<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Learner | 2026 DSE 實時個人倒數器</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #7e22ce 100%);
            --bg-color: #f1f5f9;
            --accent-red: #dc2626;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; }
        .container { max-width: 850px; margin: 0 auto; }

        /* 主倒數卡片：以 4月8日 08:30 為準 */
        .hero-card {
            background: var(--primary-gradient);
            color: white; padding: 30px 15px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 25px;
        }
        .timer-display { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .unit-box { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 12px; min-width: 60px; backdrop-filter: blur(5px); }
        .unit-num { display: block; font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .unit-label { font-size: 0.7rem; opacity: 0.8; }

        /* 科目選擇器 */
        .selector-panel { background: white; padding: 20px; border-radius: 16px; margin-bottom: 25px; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .chip.active { background: #3b82f6; color: white; border-color: #3b82f6; }

        /* Action: 2 Items Per Row 佈局 */
        .schedule-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media (max-width: 600px) { .schedule-grid { grid-template-columns: 1fr; } }

        .subject-card {
            background: white; padding: 15px; border-radius: 15px;
            border-left: 6px solid #e2e8f0; display: flex; flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s;
        }
        .subject-card.is-active { border-left-color: #10b981; }
        .subject-name { font-weight: 700; color: #334155; margin-bottom: 5px; }
        .subject-date { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
        
        /* 跳動的實時時間 */
        .live-timer { font-family: 'Courier New', Courier, monospace; color: var(--accent-red); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-card">
        <div style="font-size: 1.1rem; font-weight: 600;">距離 2026 DSE 首科 (VA) 開考還有</div>
        <div class="timer-display" id="hero-timer">
            <div class="unit-box"><span class="unit-num" id="h-d">--</span><span class="unit-label">天</span></div>
            <div class="unit-box"><span class="unit-num" id="h-h">--</span><span class="unit-label">時</span></div>
            <div class="unit-box"><span class="unit-num" id="h-m">--</span><span class="unit-label">分</span></div>
            <div class="unit-box"><span class="unit-num" id="h-s">--</span><span class="unit-label">秒</span></div>
        </div>
        <div style="margin-top:10px; font-size: 0.8rem; opacity: 0.8;">目標：2026年4月8日 08:30</div>
    </div>

    <div class="selector-panel">
        <h3 style="margin-top:0;">🛠️ 設定你的選修科</h3>
        <div class="chip-group" id="elective-selector"></div>
    </div>

    <h3 style="margin-left: 5px;">📅 我的應考時間表 (實時更新)</h3>
    <div class="schedule-grid" id="my-list"></div>
</div>

<script>
    // 完整數據 
    const timetable = [
        { id: 'va', name: '視覺藝術 (首科)', date: '2026-04-08T08:30:00', type: 'written' },
        { id: 'chi', name: '中國語文', date: '2026-04-09T08:30:00', type: 'core' },
        { id: 'eng', name: '英國語文', date: '2026-04-10T08:30:00', type: 'core' },
        { id: 'math', name: '數學必修', date: '2026-04-13T08:30:00', type: 'core' },
        { id: 'cs', name: '公民與社會', date: '2026-04-14T08:30:00', type: 'core' },
        { id: 'chem', name: '化學', date: '2026-04-16T08:30:00', type: 'science' },
        { id: 'bio', name: '生物', date: '2026-04-20T08:30:00', type: 'science' },
        { id: 'phy', name: '物理', date: '2026-04-22T08:30:00', type: 'science' },
        { id: 'ict', name: '資訊及通訊科技', date: '2026-04-24T08:30:00', type: 'elective' },
        { id: 'econ', name: '經濟', date: '2026-05-04T08:30:00', type: 'elective' }
    ];

    const STORAGE_KEY = 'luminous_user_v3';
    let userChoices = JSON.parse(localStorage.getItem(STORAGE_KEY)) || ['va','chi','eng','math','cs','chem'];

    function getTimeRemaining(target) {
        const total = Date.parse(target) - Date.parse(new Date());
        if (total <= 0) return { total: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
        return {
            total,
            days: Math.floor(total / (1000 * 60 * 60 * 24)),
            hours: Math.floor((total / (1000 * 60 * 60)) % 24),
            minutes: Math.floor((total / 1000 / 60) % 60),
            seconds: Math.floor((total / 1000) % 60)
        };
    }

    function updateAll() {
        // 更新主倒數 
        const main = getTimeRemaining('2026-04-08T08:30:00');
        document.getElementById('h-d').innerText = main.days;
        document.getElementById('h-h').innerText = main.hours.toString().padStart(2, '0');
        document.getElementById('h-m').innerText = main.minutes.toString().padStart(2, '0');
        document.getElementById('h-s').innerText = main.seconds.toString().padStart(2, '0');

        // 更新列表中的每一個實時計時器
        userChoices.forEach(id => {
            const subject = timetable.find(s => s.id === id);
            const t = getTimeRemaining(subject.date);
            const el = document.getElementById(`timer-${id}`);
            if (el) {
                el.innerText = `${t.days}天 ${t.hours}時 ${t.minutes}分 ${t.seconds}秒`;
            }
        });
    }

    function renderSelectors() {
        const container = document.getElementById('elective-selector');
        container.innerHTML = timetable.map(s => `
            <div class="chip ${userChoices.includes(s.id) ? 'active' : ''}" onclick="toggle('${s.id}')">
                ${s.name}
            </div>
        `).join('');
    }

    function renderList() {
        const container = document.getElementById('my-list');
        const sorted = timetable.filter(s => userChoices.includes(s.id)).sort((a,b) => Date.parse(a.date) - Date.parse(b.date));
        
        container.innerHTML = sorted.map(s => `
            <div class="subject-card ${Date.parse(s.date) > Date.now() ? 'is-active' : ''}">
                <div class="subject-name">${s.name}</div>
                <div class="subject-date">📅 ${s.date.split('T')[0]} 08:30</div>
                <div class="live-timer" id="timer-${s.id}">載入中...</div>
            </div>
        `).join('');
    }

    window.toggle = (id) => {
        const idx = userChoices.indexOf(id);
        if (idx > -1) userChoices.splice(idx, 1);
        else userChoices.push(id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userChoices));
        renderSelectors();
        renderList();
    };

    renderSelectors();
    renderList();
    setInterval(updateAll, 1000);
</script>
</body>
</html>
