<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luminous Learner | 2026 DSE 全科目實時倒數</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .timer-glow { text-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const EXAM_DATA = [
            // 核心科目 (預設)
            { id: 'eng_s', name: '英國語文 (口試)', papers: 'Speaking', date: '2026-03-10T17:00:00', cat: 'core' },
            { id: 'chi', name: '中國語文', papers: '卷一及卷二', date: '2026-04-09T08:30:00', cat: 'core' },
            { id: 'eng12', name: '英國語文', papers: '卷一及卷二', date: '2026-04-10T08:30:00', cat: 'core' },
            { id: 'eng3', name: '英國語文', papers: '卷三 (聆聽)', date: '2026-04-11T09:15:00', cat: 'core' },
            { id: 'math', name: '數學必修部分', papers: '卷一及卷二', date: '2026-04-13T08:30:00', cat: 'core' },
            { id: 'cs', name: '公民與社會發展', papers: '單一卷別', date: '2026-04-14T08:30:00', cat: 'core' },
            // 理科
            { id: 'chem', name: '化學', papers: '卷一及卷二', date: '2026-04-16T08:30:00', cat: 'science' },
            { id: 'bio', name: '生物', papers: '卷一及卷二', date: '2026-04-20T08:30:00', cat: 'science' },
            { id: 'phy', name: '物理', papers: '卷一及卷二', date: '2026-04-22T08:30:00', cat: 'science' },
            { id: 'ict', name: '資訊及通訊科技', papers: '卷一及卷二', date: '2026-04-24T08:30:00', cat: 'science' },
            { id: 'math_ext', name: '數學延伸部分 (M1/M2)', papers: '單一卷別', date: '2026-04-30T08:30:00', cat: 'science' },
            { id: 'dat', name: '設計與應用科技', papers: '卷一及卷二', date: '2026-04-17T08:30:00', cat: 'science' },
            // 文科
            { id: 'va', name: '視覺藝術', papers: '卷一及卷二', date: '2026-04-08T08:30:00', cat: 'arts' },
            { id: 'chi_hist', name: '中國歷史', papers: '卷一及卷二', date: '2026-04-29T08:30:00', cat: 'arts' },
            { id: 'hist', name: '歷史', papers: '卷一及卷二', date: '2026-04-25T08:30:00', cat: 'arts' },
            { id: 'geog', name: '地理', papers: '卷一及卷二', date: '2026-04-23T08:30:00', cat: 'arts' },
            { id: 'chi_lit', name: '中國文學', papers: '卷一及卷二', date: '2026-04-21T08:30:00', cat: 'arts' },
            { id: 'eng_lit', name: '英語文學', papers: '卷一及卷二', date: '2026-04-17T08:30:00', cat: 'arts' },
            // 商科及其他
            { id: 'econ', name: '經濟', papers: '卷一及卷二', date: '2026-05-04T08:30:00', cat: 'biz' },
            { id: 'bafs', name: '企會財 (BAFS)', papers: '卷一及卷二', date: '2026-04-27T08:30:00', cat: 'biz' },
            { id: 'ths', name: '旅遊與款待', papers: '卷一及卷二', date: '2026-05-02T08:30:00', cat: 'biz' },
            { id: 'ers', name: '倫理與宗教', papers: '卷一及卷二', date: '2026-04-15T08:30:00', cat: 'other' },
            { id: 'hmsc', name: '健康管理與社會關懷', papers: '卷一及卷二', date: '2026-04-18T08:30:00', cat: 'other' },
            { id: 'pe_w', name: '體育 (筆試)', papers: '卷一及卷二', date: '2026-04-28T08:30:00', cat: 'other' },
            { id: 'pe_p', name: '體育 (實習)', papers: 'Practical', date: '2026-02-25T08:00:00', cat: 'other' },
            { id: 'mu_w', name: '音樂 (筆試)', papers: '卷一', date: '2026-05-05T08:30:00', cat: 'other' },
            { id: 'mu_p', name: '音樂 (實習)', papers: 'Practical', date: '2026-03-02T09:00:00', cat: 'other' },
            { id: 'tl', name: '科技與生活', papers: '卷一及卷二', date: '2026-04-21T08:30:00', cat: 'other' }
        ];

        const App = () => {
            const [selectedIds, setSelectedIds] = useState(() => {
                const saved = localStorage.getItem('luminous_v9_config');
                return saved ? JSON.parse(saved) : [];
            });
            const [now, setNow] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('luminous_v9_config', JSON.stringify(selectedIds));
            }, [selectedIds]);

            const displayList = useMemo(() => {
                const list = EXAM_DATA.filter(i => i.cat === 'core' || selectedIds.includes(i.id));
                return list.sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [selectedIds]);

            const renderTimer = (targetDate) => {
                const diff = new Date(targetDate) - now;
                if (diff <= 0) return <div className="text-slate-500 font-bold uppercase tracking-widest py-4">已開考</div>;
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);

                return (
                    <div className="flex flex-col items-center">
                        <div className="text-3xl font-black text-white">{d} 天</div>
                        <div className="text-sm text-red-400 font-bold mt-1">
                            {h} 小時 {m} 分鐘 {s} 秒
                        </div>
                    </div>
                );
            };

            const firstExam = EXAM_DATA.find(i => i.id === 'va');
            const mainDiff = new Date(firstExam.date) - now;

            return (
                <div className="min-h-screen px-4 py-8 flex flex-col items-center max-w-4xl mx-auto">
                    {/* Header Card */}
                    <div className="w-full bg-gradient-to-br from-indigo-900 to-slate-900 rounded-3xl p-8 mb-10 border border-white/10 text-center shadow-2xl">
                        <h2 className="text-slate-400 text-xs font-bold uppercase tracking-[0.2em] mb-4">距離 2026 DSE 首科筆試 (視覺藝術) 還有</h2>
                        <div className="flex flex-col items-center space-y-2">
                            <div className="text-6xl font-black text-white timer-glow italic">{Math.max(0, Math.floor(mainDiff / 86400000))} 天</div>
                            <div className="text-lg text-indigo-300 font-bold">
                                {Math.max(0, Math.floor((mainDiff / 3600000) % 24))} 小時 {Math.max(0, Math.floor((mainDiff / 60000) % 60))} 分鐘
                            </div>
                        </div>
                        <p className="text-slate-500 text-[10px] mt-6 font-mono">TARGET: 2026-04-08 08:30</p>
                    </div>

                    {/* Selector */}
                    <div className="w-full bg-slate-900/50 border border-slate-800 p-6 rounded-2xl mb-10">
                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 block">➕ 添加選修科目</label>
                        <select 
                            className="w-full bg-slate-800 border-none rounded-xl p-4 text-white font-semibold cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                            onChange={(e) => {
                                if (e.target.value && !selectedIds.includes(e.target.value)) setSelectedIds([...selectedIds, e.target.value]);
                                e.target.value = "";
                            }}
                        >
                            <option value="">-- 請按分類選擇 --</option>
                            {['science', 'arts', 'biz', 'other'].map(cat => (
                                <optgroup key={cat} label={cat.toUpperCase()} className="bg-slate-900">
                                    {EXAM_DATA.filter(i => i.cat === cat).map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                                </optgroup>
                            ))}
                        </select>
                        <div className="flex flex-wrap gap-2 mt-4">
                            {selectedIds.map(id => (
                                <div key={id} className="bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-2">
                                    {EXAM_DATA.find(f => f.id === id).name}
                                    <button onClick={() => setSelectedIds(selectedIds.filter(i => i !== id))} className="text-indigo-500 hover:text-white text-xs">✕</button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Grid List */}
                    <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-4">
                        {displayList.map(item => (
                            <div key={item.id} className="bg-slate-900 border border-white/5 p-6 rounded-3xl hover:border-white/20 transition-all duration-300">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="text-white font-black text-lg leading-tight">{item.name}</h3>
                                        <p className="text-indigo-400 text-[10px] font-bold mt-1 uppercase tracking-widest">{item.papers}</p>
                                    </div>
                                    {item.cat === 'core' && <span className="bg-white/5 text-slate-500 text-[8px] px-2 py-1 rounded font-black border border-white/10 uppercase">核心</span>}
                                </div>
                                <div className="bg-black/30 p-5 rounded-2xl border border-white/5 mb-2">
                                    {renderTimer(item.date)}
                                </div>
                                <p className="text-[10px] text-slate-500 font-mono text-center">🗓️ {item.date.replace('T', ' ').substring(0, 16)}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
