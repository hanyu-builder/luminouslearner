<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Learner | DSE 2026 實時倒數</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .timer-glow { text-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const FULL_DATA = [
            // 核心科目 (Logic: 預設顯示)
            { id: 'chi', name: '中國語文', date: '2026-04-09T08:30:00', cat: 'core' },
            { id: 'eng12', name: '英國語文 (一)及(二)', date: '2026-04-10T08:30:00', cat: 'core' },
            { id: 'eng3', name: '英國語文 (三) (聆聽)', date: '2026-04-11T09:15:00', cat: 'core' },
            { id: 'eng_s', name: '英國語文 (口試)', date: '2026-03-10T17:00:00', cat: 'core' },
            { id: 'math', name: '數學必修部分', date: '2026-04-13T08:30:00', cat: 'core' },
            { id: 'cs', name: '公民與社會發展', date: '2026-04-14T08:30:00', cat: 'core' },
            // 理科
            { id: 'chem', name: '化學', date: '2026-04-16T08:30:00', cat: 'science' },
            { id: 'bio', name: '生物', date: '2026-04-20T08:30:00', cat: 'science' },
            { id: 'phy', name: '物理', date: '2026-04-22T08:30:00', cat: 'science' },
            { id: 'ict', name: '資訊及通訊科技', date: '2026-04-24T08:30:00', cat: 'science' },
            { id: 'm1m2', name: '數學延伸 (M1/M2)', date: '2026-04-30T08:30:00', cat: 'science' },
            // 文科
            { id: 'va', name: '視覺藝術 (一)及(二)', date: '2026-04-08T08:30:00', cat: 'arts' },
            { id: 'chi_hist', name: '中國歷史', date: '2026-04-29T08:30:00', cat: 'arts' },
            { id: 'hist', name: '歷史', date: '2026-04-25T08:30:00', cat: 'arts' },
            { id: 'geog', name: '地理', date: '2026-04-23T08:30:00', cat: 'arts' },
            // 商科及其他
            { id: 'econ', name: '經濟', date: '2026-05-04T08:30:00', cat: 'biz' },
            { id: 'bafs', name: '企會財 (BAFS)', date: '2026-04-27T08:30:00', cat: 'biz' },
            { id: 'pe_p', name: '體育 (實習)', date: '2026-02-25T08:00:00', cat: 'other' }
        ];

        const App = () => {
            const [selectedElectives, setSelectedElectives] = useState(() => {
                const saved = localStorage.getItem('luminous_v7_electives');
                return saved ? JSON.parse(saved) : [];
            });

            const [now, setNow] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('luminous_v7_electives', JSON.stringify(selectedElectives));
            }, [selectedElectives]);

            const displayList = useMemo(() => {
                const cores = FULL_DATA.filter(i => i.cat === 'core');
                const electives = FULL_DATA.filter(i => selectedElectives.includes(i.id));
                return [...cores, ...electives].sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [selectedElectives]);

            const getTimeLeft = (target) => {
                const diff = new Date(target) - now;
                if (diff <= 0) return "已開考";
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);
                return `${d}天 ${h}時 ${m}分 ${s}秒`;
            };

            const firstExam = FULL_DATA.find(i => i.id === 'va');
            const mainCountdown = getTimeLeft(firstExam.date);

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    {/* Hero Card */}
                    <div className="w-full max-w-4xl bg-gradient-to-br from-indigo-900 to-purple-900 rounded-3xl p-8 mb-8 border border-white/10 shadow-2xl text-center">
                        <h1 className="text-slate-400 text-sm font-bold uppercase tracking-widest mb-4">距離 2026 DSE 首科 (視覺藝術) 還有</h1>
                        <div className="text-4xl md:text-6xl font-black font-mono tracking-tighter text-white timer-glow">
                            {mainCountdown}
                        </div>
                        <p className="text-slate-400 text-xs mt-4 font-mono">目標時間：2026年4月8日 08:30</p>
                    </div>

                    {/* Selector */}
                    <div className="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 shadow-lg">
                        <label className="block text-sm font-bold text-slate-400 mb-4 flex items-center gap-2">
                            🔍 添加選修科目：
                        </label>
                        <select 
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-white outline-none focus:ring-2 focus:ring-indigo-500 transition"
                            onChange={(e) => {
                                if (e.target.value && !selectedElectives.includes(e.target.value)) {
                                    setSelectedElectives([...selectedElectives, e.target.value]);
                                }
                                e.target.value = "";
                            }}
                        >
                            <option value="">-- 請按分類選擇 --</option>
                            <optgroup label="理科 (Science)">
                                {FULL_DATA.filter(i => i.cat === 'science').map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                            </optgroup>
                            <optgroup label="文科 (Arts)">
                                {FULL_DATA.filter(i => i.cat === 'arts').map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                            </optgroup>
                            <optgroup label="商科及其他">
                                {FULL_DATA.filter(i => i.cat === 'biz' || i.cat === 'other').map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                            </optgroup>
                        </select>
                        <div className="flex flex-wrap gap-2 mt-4">
                            {selectedElectives.map(id => (
                                <span key={id} className="bg-indigo-900/50 border border-indigo-500/50 text-indigo-300 px-3 py-1 rounded-full text-xs flex items-center gap-2">
                                    {FULL_DATA.find(f => f.id === id).name}
                                    <button onClick={() => setSelectedElectives(selectedElectives.filter(i => i !== id))} className="hover:text-white">✕</button>
                                </span>
                            ))}
                        </div>
                    </div>

                    {/* Grid List */}
                    <div className="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-4">
                        {displayList.map(item => (
                            <div key={item.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-sm hover:border-slate-600 transition group">
                                <div className="flex justify-between items-start mb-2">
                                    <h3 className="font-bold text-slate-200 group-hover:text-white transition">{item.name}</h3>
                                    {item.cat === 'core' && <span className="text-[10px] bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30 font-bold uppercase">核心預設</span>}
                                </div>
                                <p className="text-xs text-slate-500 font-mono mb-3">🗓️ {item.date.replace('T', ' ').substring(0, 16)}</p>
                                <div className="text-red-400 font-mono font-bold text-sm bg-red-950/20 p-3 rounded-xl border border-red-500/10 text-center tracking-tight">
                                    {getTimeLeft(item.date)}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
