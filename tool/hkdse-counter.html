<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luminous Learner | 2026 DSE 實時倒數</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .timer-glow { text-shadow: 0 4px 20px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const EXAM_DATA = [
            { id: 'pe_p', name: '體育 (實習)', papers: 'Practical', date: '2026-02-25T08:00:00', cat: 'other' },
            { id: 'mu_p', name: '音樂 (實習)', papers: 'Practical', date: '2026-03-02T09:00:00', cat: 'other' },
            { id: 'eng_s', name: '英國語文 (口試)', papers: 'Speaking', date: '2026-03-10T17:00:00', cat: 'core' },
            { id: 'eng_sen', name: '英國語文 (口試-SEN)', papers: 'Speaking', date: '2026-03-21T09:00:00', cat: 'other' },
            { id: 'va', name: '視覺藝術', papers: '卷一及卷二', date: '2026-04-08T08:30:00', cat: 'arts' },
            { id: 'chi', name: '中國語文', papers: '卷一及卷二', date: '2026-04-09T08:30:00', cat: 'core' },
            { id: 'eng12', name: '英國語文', papers: '卷一及卷二', date: '2026-04-10T08:30:00', cat: 'core' },
            { id: 'eng3', name: '英國語文', papers: '卷三 (聆聽)', date: '2026-04-11T09:15:00', cat: 'core' },
            { id: 'math', name: '數學必修部分', papers: '卷一及卷二', date: '2026-04-13T08:30:00', cat: 'core' },
            { id: 'cs', name: '公民與社會發展', papers: '單一卷別', date: '2026-04-14T08:30:00', cat: 'core' },
            { id: 'ers', name: '倫理與宗教', papers: '卷一及卷二', date: '2026-04-15T08:30:00', cat: 'other' },
            { id: 'chem', name: '化學', papers: '卷一及卷二', date: '2026-04-16T08:30:00', cat: 'science' },
            { id: 'dat', name: '設計與應用科技', papers: '卷一及卷二', date: '2026-04-17T08:30:00', cat: 'science' },
            { id: 'eng_lit', name: '英語文學', papers: '卷一及卷二', date: '2026-04-17T08:30:00', cat: 'arts' },
            { id: 'hmsc', name: '健康管理與社會關懷', papers: '卷一及卷二', date: '2026-04-18T08:30:00', cat: 'other' },
            { id: 'bio', name: '生物', papers: '卷一及卷二', date: '2026-04-20T08:30:00', cat: 'science' },
            { id: 'chi_lit', name: '中國文學', papers: '卷一及卷二', date: '2026-04-21T08:30:00', cat: 'arts' },
            { id: 'tl', name: '科技與生活', papers: '卷一及卷二', date: '2026-04-21T08:30:00', cat: 'other' },
            { id: 'phy', name: '物理', papers: '卷一及卷二', date: '2026-04-22T08:30:00', cat: 'science' },
            { id: 'geog', name: '地理', papers: '卷一及卷二', date: '2026-04-23T08:30:00', cat: 'arts' },
            { id: 'ict', name: '資訊及通訊科技', papers: '卷一及卷二', date: '2026-04-24T08:30:00', cat: 'science' },
            { id: 'hist', name: '歷史', papers: '卷一及卷二', date: '2026-04-25T08:30:00', cat: 'arts' },
            { id: 'bafs', name: '企會財 (BAFS)', papers: '卷一及卷二', date: '2026-04-27T08:30:00', cat: 'biz' },
            { id: 'pe_w', name: '體育 (筆試)', papers: '卷一及卷二', date: '2026-04-28T08:30:00', cat: 'other' },
            { id: 'chi_hist', name: '中國歷史', papers: '卷一及卷二', date: '2026-04-29T08:30:00', cat: 'arts' },
            { id: 'math_ext', name: '數學延伸部分 (M1/M2)', papers: '單一卷別', date: '2026-04-30T08:30:00', cat: 'science' },
            { id: 'ths', name: '旅遊與款待', papers: '卷一及卷二', date: '2026-05-02T08:30:00', cat: 'biz' },
            { id: 'econ', name: '經濟', papers: '卷一及卷二', date: '2026-05-04T08:30:00', cat: 'biz' },
            { id: 'mu_w', name: '音樂 (筆試)', papers: '卷一', date: '2026-05-05T08:30:00', cat: 'other' }
        ];

        const App = () => {
            const [selectedIds, setSelectedIds] = useState(() => {
                const saved = localStorage.getItem('luminous_v10_config');
                return saved ? JSON.parse(saved) : [];
            });
            const [now, setNow] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('luminous_v10_config', JSON.stringify(selectedIds));
            }, [selectedIds]);

            const displayList = useMemo(() => {
                const list = EXAM_DATA.filter(i => i.cat === 'core' || selectedIds.includes(i.id));
                return list.sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [selectedIds]);

            const calculateTime = (targetDate) => {
                const diff = new Date(targetDate) - now;
                if (diff <= 0) return null;
                return {
                    d: Math.floor(diff / 86400000),
                    h: Math.floor((diff / 3600000) % 24),
                    m: Math.floor((diff / 60000) % 60),
                    s: Math.floor((diff / 1000) % 60)
                };
            };

            const firstExam = EXAM_DATA.find(i => i.id === 'va');
            const mainT = calculateTime(firstExam.date);

            return (
                <div className="min-h-screen px-4 py-8 flex flex-col items-center max-w-4xl mx-auto">
                    {/* Header Card */}
                    <div className="w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 mb-10 text-center shadow-2xl overflow-hidden relative">
                        <div className="absolute top-0 left-0 w-full h-1 bg-indigo-500 opacity-50"></div>
                        <h2 className="text-slate-400 text-xs font-bold uppercase tracking-[0.15em] mb-6">距離 2026 DSE 首科筆試 (視覺藝術) 還有</h2>
                        {mainT ? (
                            <div className="flex flex-col items-center">
                                <div className="text-5xl md:text-6xl font-extrabold text-white mb-3 tracking-tight timer-glow">
                                    {mainT.d} <span className="text-2xl md:text-3xl font-normal text-slate-400 ml-1">天</span>
                                </div>
                                <div className="text-lg md:text-xl font-medium text-indigo-300 font-mono">
                                    {mainT.h} 小時 {mainT.m} 分鐘 {mainT.s} 秒
                                </div>
                            </div>
                        ) : (
                            <div className="text-2xl font-bold text-slate-500">考試已開始</div>
                        )}
                        <p className="text-slate-600 text-[10px] mt-8 font-mono tracking-widest uppercase">TARGET: 2026-04-08 08:30</p>
                    </div>

                    {/* Selector */}
                    <div className="w-full bg-slate-900/40 border border-slate-800 p-6 rounded-2xl mb-10">
                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 block">添加選修科目</label>
                        <select 
                            className="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-4 text-white font-medium cursor-pointer outline-none focus:border-indigo-500 transition-colors"
                            onChange={(e) => {
                                if (e.target.value && !selectedIds.includes(e.target.value)) setSelectedIds([...selectedIds, e.target.value]);
                                e.target.value = "";
                            }}
                        >
                            <option value="">-- 按類別選擇 --</option>
                            <optgroup label="理科 SCIENCE" className="bg-slate-900">{EXAM_DATA.filter(i => i.cat === 'science').map(i => <option key={i.id} value={i.id}>{i.name}</option>)}</optgroup>
                            <optgroup label="文科 ARTS" className="bg-slate-900">{EXAM_DATA.filter(i => i.cat === 'arts').map(i => <option key={i.id} value={i.id}>{i.name}</option>)}</optgroup>
                            <optgroup label="商科/其他 OTHERS" className="bg-slate-900">{EXAM_DATA.filter(i => ['biz', 'other'].includes(i.cat)).map(i => <option key={i.id} value={i.id}>{i.name}</option>)}</optgroup>
                        </select>
                        <div className="flex flex-wrap gap-2 mt-5">
                            {selectedIds.map(id => (
                                <div key={id} className="bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-[10px] font-semibold flex items-center gap-2">
                                    {EXAM_DATA.find(f => f.id === id).name}
                                    <button onClick={() => setSelectedIds(selectedIds.filter(i => i !== id))} className="text-indigo-400 hover:text-white transition-colors">✕</button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Grid List */}
                    <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-4">
                        {displayList.map(item => {
                            const t = calculateTime(item.date);
                            return (
                                <div key={item.id} className="bg-slate-900 border border-slate-800/50 p-6 rounded-3xl relative overflow-hidden group hover:border-indigo-500/30 transition-all">
                                    <div className="flex justify-between items-start mb-6">
                                        <div>
                                            <h3 className="text-white font-bold text-lg">{item.name}</h3>
                                            <p className="text-indigo-400 text-[10px] font-bold mt-1 tracking-wider uppercase">{item.papers}</p>
                                        </div>
                                        {item.cat === 'core' && <span className="bg-indigo-500/10 text-indigo-400 text-[8px] px-2 py-1 rounded-md font-bold border border-indigo-500/20 uppercase">CORE</span>}
                                    </div>
                                    <div className="bg-black/20 p-5 rounded-2xl border border-white/5 mb-3 text-center">
                                        {t ? (
                                            <div className="flex flex-col">
                                                <span className="text-2xl font-bold text-white mb-1">{t.d} <span className="text-xs font-normal text-slate-500">天</span></span>
                                                <span className="text-xs font-mono text-red-400 font-bold">{t.h} 小時 {t.m} 分鐘 {t.s} 秒</span>
                                            </div>
                                        ) : (
                                            <span className="text-xs font-bold text-slate-600 uppercase tracking-widest">已開考</span>
                                        )}
                                    </div>
                                    <p className="text-[9px] text-slate-600 font-mono text-center tracking-tighter">🗓️ {item.date.replace('T', ' ').substring(0, 16)}</p>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
