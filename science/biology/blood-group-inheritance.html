<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Group Inheritance Calculator</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Grid Animation */
        .grid-cell { transition: all 0.3s ease; }
        .grid-cell:hover { transform: scale(1.05); background-color: rgba(239, 68, 68, 0.2); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- GENETICS LOGIC ---
        const ALLELES = {
            'A': 'Iᴬ',
            'B': 'Iᴮ',
            'i': 'i'
        };

        // Possible Genotypes for each Blood Type
        const GENOTYPES = {
            'A': ['AA', 'Ai'],
            'B': ['BB', 'Bi'],
            'AB': ['AB'],
            'O': ['ii']
        };

        // Display names for Genotypes
        const GENO_LABELS = {
            'AA': 'IᴬIᴬ (Homozygous A)',
            'Ai': 'Iᴬi (Heterozygous A)',
            'BB': 'IᴮIᴮ (Homozygous B)',
            'Bi': 'Iᴮi (Heterozygous B)',
            'AB': 'IᴬIᴮ (AB)',
            'ii': 'ii (O)'
        };

        const PHENOTYPES = {
            'AA': 'A', 'Ai': 'A', 'iA': 'A',
            'BB': 'B', 'Bi': 'B', 'iB': 'B',
            'AB': 'AB', 'BA': 'AB',
            'ii': 'O'
        };
        
        const COLORS = {
            'A': '#ef4444', // Red
            'B': '#3b82f6', // Blue
            'AB': '#8b5cf6', // Purple
            'O': '#10b981'  // Green
        };

        const App = () => {
            const [p1Type, setP1Type] = useState('A');
            const [p2Type, setP2Type] = useState('B');
            
            // Specific Genotype Selection
            const [p1Geno, setP1Geno] = useState('Ai');
            const [p2Geno, setP2Geno] = useState('Bi');

            // Update genotype options when blood type changes
            useEffect(() => {
                setP1Geno(GENOTYPES[p1Type][0]);
            }, [p1Type]);

            useEffect(() => {
                setP2Geno(GENOTYPES[p2Type][0]);
            }, [p2Type]);

            // Calculate Cross
            const calculateCross = () => {
                const g1 = p1Geno.split('');
                const g2 = p2Geno.split('');
                
                const grid = [];
                const counts = { 'A': 0, 'B': 0, 'AB': 0, 'O': 0 };
                const genoCounts = {};

                for(let r=0; r<2; r++) {
                    for(let c=0; c<2; c++) {
                        let allele1 = g1[r];
                        let allele2 = g2[c];
                        
                        // Combine (Standardize order: A/B before i, A before B)
                        let combo = allele1 + allele2;
                        if (combo === 'iA') combo = 'Ai';
                        if (combo === 'iB') combo = 'Bi';
                        if (combo === 'BA') combo = 'AB';
                        
                        const bloodType = PHENOTYPES[combo];
                        grid.push({ 
                            genotype: combo, 
                            phenotype: bloodType,
                            p1Allele: allele1,
                            p2Allele: allele2
                        });

                        counts[bloodType]++;
                        genoCounts[combo] = (genoCounts[combo] || 0) + 1;
                    }
                }

                return { grid, counts, genoCounts };
            };

            const result = useMemo(() => calculateCross(), [p1Geno, p2Geno]);
            
            const chartData = Object.entries(result.counts)
                .filter(([_, val]) => val > 0)
                .map(([name, value]) => ({
                    name: `Type ${name}`,
                    value: value,
                    color: COLORS[name]
                }));

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="droplet" className="text-red-500" /> Blood Calc
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">ABO Inheritance Predictor</p>
                        </div>

                        <div className="p-6 space-y-8 flex-1 overflow-y-auto">
                            
                            {/* Parent 1 */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-blue-400 uppercase tracking-widest px-1 flex items-center gap-2">
                                    <Icon name="user" size={14}/> Father
                                </label>
                                <div>
                                    <div className="text-[10px] text-slate-500 mb-1">Blood Type</div>
                                    <div className="flex gap-1">
                                        {['A', 'B', 'AB', 'O'].map(t => (
                                            <button 
                                                key={t}
                                                onClick={() => setP1Type(t)}
                                                className={`flex-1 py-1.5 rounded text-xs font-bold border
                                                    ${p1Type === t ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}
                                                `}
                                            >
                                                {t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-[10px] text-slate-500 mb-1">Genotype (Unknown?)</div>
                                    <select 
                                        value={p1Geno}
                                        onChange={(e) => setP1Geno(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm font-mono"
                                    >
                                        {GENOTYPES[p1Type].map(g => (
                                            <option key={g} value={g}>{GENO_LABELS[g]}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Parent 2 */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-pink-400 uppercase tracking-widest px-1 flex items-center gap-2">
                                    <Icon name="user" size={14}/> Mother
                                </label>
                                <div>
                                    <div className="text-[10px] text-slate-500 mb-1">Blood Type</div>
                                    <div className="flex gap-1">
                                        {['A', 'B', 'AB', 'O'].map(t => (
                                            <button 
                                                key={t}
                                                onClick={() => setP2Type(t)}
                                                className={`flex-1 py-1.5 rounded text-xs font-bold border
                                                    ${p2Type === t ? 'bg-pink-600 border-pink-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}
                                                `}
                                            >
                                                {t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-[10px] text-slate-500 mb-1">Genotype (Unknown?)</div>
                                    <select 
                                        value={p2Geno}
                                        onChange={(e) => setP2Geno(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm font-mono"
                                    >
                                        {GENOTYPES[p2Type].map(g => (
                                            <option key={g} value={g}>{GENO_LABELS[g]}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Info */}
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-xs text-slate-300 space-y-2">
                                <div className="font-bold text-slate-400 uppercase mb-1">Key Concepts</div>
                                <p>
                                    <strong className="text-red-400">Iᴬ</strong> and <strong className="text-blue-400">Iᴮ</strong> are <strong>codominant</strong>.
                                </p>
                                <p>
                                    <strong className="text-slate-400">i</strong> is <strong>recessive</strong>.
                                </p>
                                <p>
                                    A parent with type A could be <strong>IᴬIᴬ</strong> or <strong>Iᴬi</strong>.
                                </p>
                            </div>

                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 bg-[#020617] relative flex flex-col p-8 overflow-y-auto">
                        
                        <div className="flex flex-col items-center w-full max-w-4xl mx-auto gap-12">
                            
                            {/* Punnett Square Visual */}
                            <div className="w-full flex flex-col items-center">
                                <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2">
                                    <Icon name="table" /> Inheritance Pattern
                                </h2>
                                
                                <div className="relative p-4">
                                    {/* Top Labels (Mother Gametes) */}
                                    <div className="flex mb-2 ml-14 gap-2">
                                        {p2Geno.split('').map((g, i) => (
                                            <div key={i} className="w-24 text-center font-bold text-pink-400 text-xl bg-slate-900/50 rounded py-2 border border-pink-500/30">
                                                {ALLELES[g]}
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex gap-2">
                                        {/* Side Labels (Father Gametes) */}
                                        <div className="flex flex-col gap-2 justify-center mr-2">
                                            {p1Geno.split('').map((g, i) => (
                                                <div key={i} className="h-24 w-12 flex items-center justify-center font-bold text-blue-400 text-xl bg-slate-900/50 rounded border border-blue-500/30">
                                                    {ALLELES[g]}
                                                </div>
                                            ))}
                                        </div>

                                        {/* Grid */}
                                        <div className="grid grid-cols-2 gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
                                            {result.grid.map((cell, i) => (
                                                <div key={i} className="w-24 h-24 bg-slate-900 rounded-lg flex flex-col items-center justify-center border border-slate-700 shadow-inner grid-cell relative overflow-hidden group">
                                                    <div className="absolute inset-0 opacity-10" style={{backgroundColor: COLORS[cell.phenotype]}}></div>
                                                    <span className="text-xl font-serif font-bold text-white mb-1">
                                                        {ALLELES[cell.p1Allele]}{ALLELES[cell.p2Allele]}
                                                    </span>
                                                    <span className={`text-xs font-bold px-2 py-0.5 rounded-full text-white`} style={{backgroundColor: COLORS[cell.phenotype]}}>
                                                        Type {cell.phenotype}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Results & Stats */}
                            <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-8">
                                
                                {/* Probability Chart */}
                                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6 h-64 flex flex-col">
                                    <div className="text-xs font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                                        <Icon name="pie-chart" size={14}/> Offspring Probability
                                    </div>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie
                                                data={chartData}
                                                cx="50%"
                                                cy="50%"
                                                innerRadius={50}
                                                outerRadius={80}
                                                paddingAngle={5}
                                                dataKey="value"
                                                stroke="none"
                                            >
                                                {chartData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={entry.color} />
                                                ))}
                                            </Pie>
                                            <Tooltip 
                                                contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', fontSize: '12px' }}
                                                itemStyle={{ color: '#fff' }}
                                                formatter={(value) => `${(value/4)*100}%`}
                                            />
                                            <Legend 
                                                verticalAlign="middle" 
                                                layout="vertical" 
                                                align="right"
                                                iconSize={8}
                                                formatter={(value, entry) => <span className="text-slate-300 text-xs ml-1">{value}</span>}
                                            />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>

                                {/* Detailed List */}
                                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col justify-center">
                                    <div className="text-xs font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                                        <Icon name="list" size={14}/> Possible Outcomes
                                    </div>
                                    <div className="space-y-3">
                                        {chartData.map((d, i) => (
                                            <div key={i} className="flex items-center justify-between p-2 rounded bg-slate-800/50 border border-slate-700/50">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-3 h-3 rounded-full" style={{ backgroundColor: d.color }}></div>
                                                    <span className="text-sm text-slate-200 font-bold">{d.name}</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                                        <div className="h-full" style={{ width: `${(d.value/4)*100}%`, backgroundColor: d.color }}></div>
                                                    </div>
                                                    <span className="font-mono font-bold text-white text-sm">{(d.value/4)*100}%</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
