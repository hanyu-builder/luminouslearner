<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Flow Tracker</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Energy Pulse */
        .energy-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* Heat Wave Animation */
        .heat-wave {
            animation: rise 2s linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-20px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- COMPONENTS ---
        
        const TrophicLevel = ({ data, nextData, isLast }) => {
            // data: { name, energy, maxEnergy, color, icon }
            // nextData: next level data (to calculate loss)
            
            // Calculate dimensions based on energy log scale or relative
            // Visual width: logarithmic to ensure small values are visible but difference is clear
            // Or simple percentage relative to max input
            
            // Let's use a fixed width container, but fill height/intensity based on energy?
            // Better: Width represents energy.
            
            // Max width = 160px (for the box)
            // We can't scale width linearly because 10000 -> 10 is too big a drop visually (10 becomes invisible).
            // We'll use text to show numbers, and visual cues for "Loss".
            
            const lossRespiration = data.energy * 0.6; // 60% Heat
            const lossWaste = data.energy * 0.3; // 30% Waste
            const transfer = data.energy * 0.1; // 10% Transfer

            return (
                <div className="flex flex-col items-center relative group">
                    
                    {/* Main Energy Box */}
                    <motion.div 
                        initial={{ scale: 0.8, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        className="w-40 h-40 bg-slate-800 rounded-2xl border-2 relative flex flex-col items-center justify-center shadow-xl z-10"
                        style={{ borderColor: data.color }}
                    >
                        {/* Icon */}
                        <div className="mb-2" style={{ color: data.color }}>
                            <Icon name={data.icon} size={40} />
                        </div>
                        
                        {/* Name */}
                        <div className="text-sm font-bold text-white mb-1">{data.name}</div>
                        
                        {/* Energy Value */}
                        <div className="text-xl font-mono font-black" style={{ color: data.color }}>
                            {data.energy.toLocaleString()} J
                        </div>
                        
                        {/* Fill Animation (Abstract Energy Level) */}
                        <div className="absolute bottom-0 left-0 right-0 bg-white opacity-5 pointer-events-none" style={{ height: '100%' }}></div>
                    </motion.div>

                    {/* LOSS ARROWS (Heat) - Upward */}
                    <div className="absolute -top-16 left-1/2 -translate-x-1/2 flex flex-col items-center">
                        <div className="flex gap-1 mb-1">
                            {[...Array(3)].map((_, i) => (
                                <Icon key={i} name="waves" size={16} className="text-red-500 heat-wave" />
                            ))}
                        </div>
                        <div className="text-[10px] text-red-400 font-bold bg-red-900/20 px-2 py-0.5 rounded border border-red-500/30">
                            Heat Loss (Respiration)
                        </div>
                        <div className="text-[10px] text-red-400 font-mono">
                            -{lossRespiration.toLocaleString()} J
                        </div>
                        <div className="h-8 w-0.5 bg-gradient-to-t from-red-500 to-transparent"></div>
                    </div>

                    {/* LOSS ARROWS (Waste) - Downward */}
                    <div className="absolute -bottom-16 left-1/2 -translate-x-1/2 flex flex-col items-center">
                        <div className="h-8 w-0.5 bg-gradient-to-b from-slate-500 to-transparent"></div>
                        <div className="text-[10px] text-slate-400 font-bold bg-slate-900 px-2 py-0.5 rounded border border-slate-700">
                            Waste / Uneaten
                        </div>
                        <div className="text-[10px] text-slate-500 font-mono">
                            -{lossWaste.toLocaleString()} J
                        </div>
                        <div className="mt-1">
                            <Icon name="trash-2" size={14} className="text-slate-600"/>
                        </div>
                    </div>

                    {/* TRANSFER ARROW (Right) */}
                    {!isLast && (
                        <div className="absolute left-full top-1/2 -translate-y-1/2 w-24 flex flex-col items-center justify-center">
                            {/* Flow Line */}
                            <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden relative">
                                <motion.div 
                                    className="h-full bg-emerald-500"
                                    initial={{ x: '-100%' }}
                                    animate={{ x: '100%' }}
                                    transition={{ duration: 1.5, repeat: Infinity, ease: "linear" }}
                                />
                            </div>
                            {/* 10% Tag */}
                            <div className="mt-2 bg-emerald-900/50 border border-emerald-500/50 text-emerald-400 text-xs font-bold px-2 py-1 rounded-full shadow-lg backdrop-blur">
                                10% Transfer
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [sunEnergy, setSunEnergy] = useState(100000); // Joules

            // Calculate Energy at each level
            // Assuming plant captures ~1% of Sun (simplified for this specific tool context? Usually 10% rule applies between trophic levels. Sun -> Producer is usually ~1%.
            // Let's stick to the standard "10% Law" between biological levels for simplicity, but note Sun->Plant is low.
            // For this educational tool, let's let user set "Producer Energy" directly or Sun.
            // Let's set Producer Energy directly to make the math clean for 10%.
            
            const producerEnergy = sunEnergy; // User input effectively sets the base of the pyramid
            const primaryEnergy = Math.floor(producerEnergy * 0.1);
            const secondaryEnergy = Math.floor(primaryEnergy * 0.1);
            const tertiaryEnergy = Math.floor(secondaryEnergy * 0.1);

            const levels = [
                { id: 'producer', name: 'Producer (生產者)', icon: 'leaf', color: '#22c55e', energy: producerEnergy },
                { id: 'primary', name: 'Primary Consumer', icon: 'rabbit', color: '#eab308', energy: primaryEnergy },
                { id: 'secondary', name: 'Secondary Consumer', icon: 'snake', color: '#f97316', energy: secondaryEnergy },
                { id: 'tertiary', name: 'Tertiary Consumer', icon: 'bird', color: '#ef4444', energy: tertiaryEnergy }
            ];

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col overflow-hidden">
                    
                    {/* Header / Controls */}
                    <div className="h-24 bg-slate-900 border-b border-slate-800 flex items-center px-8 justify-between shrink-0 z-20">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-emerald-500/20 rounded-lg text-emerald-400">
                                <Icon name="zap" size={24}/>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight">Energy Flow Tracker</h1>
                                <p className="text-xs text-slate-400">The 10% Rule in Ecosystems</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-6 bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <div className="flex flex-col">
                                <label className="text-[10px] font-bold text-slate-500 uppercase mb-1">Start Energy (Producers)</label>
                                <div className="flex items-center gap-3">
                                    <input 
                                        type="range" 
                                        min="1000" max="1000000" step="1000"
                                        value={sunEnergy}
                                        onChange={(e) => setSunEnergy(parseInt(e.target.value))}
                                        className="w-48 accent-emerald-500"
                                    />
                                    <span className="font-mono font-bold text-emerald-400 w-24 text-right">{sunEnergy.toLocaleString()} J</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Stage: Horizontal Flow */}
                    <div className="flex-1 relative overflow-x-auto overflow-y-hidden p-8">
                        
                        {/* Background Grid */}
                        <div className="absolute inset-0 opacity-10 pointer-events-none" 
                            style={{backgroundImage: 'radial-gradient(#475569 1px, transparent 1px)', backgroundSize: '20px 20px'}}>
                        </div>

                        <div className="h-full flex items-center justify-center min-w-max gap-24 px-12">
                            
                            {/* Sun (Source) */}
                            <div className="flex flex-col items-center mr-8">
                                <motion.div 
                                    animate={{ scale: [1, 1.1, 1], rotate: 360 }}
                                    transition={{ duration: 10, repeat: Infinity, ease: "linear" }}
                                    className="w-24 h-24 rounded-full bg-yellow-400 shadow-[0_0_50px_rgba(250,204,21,0.6)] flex items-center justify-center text-yellow-900 mb-4"
                                >
                                    <Icon name="sun" size={48} />
                                </motion.div>
                                <span className="font-bold text-yellow-400">Sun Energy</span>
                                <div className="mt-4 text-xs text-slate-500 w-32 text-center">
                                    Source of all energy. Only ~1% is captured by plants.
                                </div>
                            </div>

                            {/* Arrow to Producer */}
                            <div className="text-slate-600">
                                <Icon name="arrow-right" size={32}/>
                            </div>

                            {/* Trophic Levels */}
                            {levels.map((level, i) => (
                                <TrophicLevel 
                                    key={level.id} 
                                    data={level} 
                                    nextData={levels[i+1]} 
                                    isLast={i === levels.length - 1} 
                                />
                            ))}

                        </div>

                    </div>

                    {/* Footer Info */}
                    <div className="bg-slate-900 border-t border-slate-800 p-4 flex justify-center gap-12 text-xs text-slate-400">
                        <div className="flex items-center gap-2">
                            <Icon name="flame" size={14} className="text-red-500"/>
                            <span><strong>90% Loss:</strong> Heat (Respiration), Movement, Excretion, Uneaten parts.</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <Icon name="arrow-right-circle" size={14} className="text-emerald-500"/>
                            <span><strong>10% Transfer:</strong> Stored as biomass (Growth) available for next level.</span>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
