<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Pollution & Water Quality Simulator (HKDSE Bio)</title>
    
    <!-- 1. 核心 React 庫 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 2. 樣式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 3. Recharts 依賴庫 (必須在 Recharts 之前載入) -->
    <!-- 修正重點：加入 prop-types，這是解決 'oneOfType' 錯誤的關鍵 -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- 4. 圖表庫 -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/recharts.js"></script>
    
    <!-- 5. 圖標庫 -->
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f9ff; 
            color: #1e293b;
            overflow-x: hidden;
        }

        /* 自定義水流動畫 */
        .river-flow {
            background: linear-gradient(90deg, 
                #38bdf8 0%, 
                #0ea5e9 20%, 
                #0284c7 40%, 
                #0369a1 60%, 
                #0ea5e9 80%, 
                #38bdf8 100%
            );
            background-size: 200% 100%;
            animation: flowing 8s linear infinite;
        }
        
        @keyframes flowing {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .species-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // 安全獲取 Recharts 對象
        const Recharts = window.Recharts || {};
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, AreaChart, Area, Legend } = Recharts;

        // --- 安全圖標組件 ---
        const Icon = ({ name, size = 20, color = "currentColor", className="" }) => {
            const [svg, setSvg] = useState(null);
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    // 將 kebab-case 轉為 PascalCase (例如: test-tube -> TestTube)
                    const iconName = name.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
                    const iconData = window.lucide.icons[iconName];
                    if (iconData) {
                        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}">${iconData.map(c => `<${c[0]} ${Object.entries(c[1]).map(([k,v]) => `${k}="${v}"`).join(' ')} />`).join('')}</svg>`;
                        setSvg(svgString);
                    }
                }
            }, [name, size, color]);
            
            if (!svg) return <span className={`inline-block bg-gray-200 rounded-full`} style={{width: size, height: size}}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-flex" />;
        };

        // --- 課程資料 (基於 HKDSE Biology) ---
        const ZONES = {
            CLEAN: { name: "Clean Zone", color: "bg-blue-400", desc: "High DO, Low BOD" },
            DECOMPOSITION: { name: "Decomposition Zone", color: "bg-slate-700", desc: "Pollution enters, DO drops, BOD spikes" },
            SEPTIC: { name: "Septic Zone", color: "bg-slate-900", desc: "Very Low DO, Anaerobic conditions" },
            RECOVERY: { name: "Recovery Zone", color: "bg-green-500", desc: "DO rises, Algae blooms (Eutrophication risk)" },
            CLEAN_AGAIN: { name: "Clean Zone", color: "bg-blue-400", desc: "Ecosystem restored" }
        };

        const SPECIES_INFO = {
            stonefly: { name: "Stonefly Nymph", label: "Clean Water Indicator", sensitivity: "High Oxygen Needed" },
            mayfly: { name: "Mayfly Nymph", label: "Clean Water Indicator", sensitivity: "High Oxygen Needed" },
            shrimp: { name: "Freshwater Shrimp", label: "Moderate Water", sensitivity: "Tolerates slight pollution" },
            bloodworm: { name: "Red Bloodworm", label: "Polluted Water", sensitivity: "Haemoglobin stores oxygen" },
            tubifex: { name: "Sludgeworm (Tubifex)", label: "Very Polluted", sensitivity: "Thrives in anaerobic mud" },
            rattailed: { name: "Rat-tailed Maggot", label: "Septic", sensitivity: "Breathing tube reaches surface" },
            bacteria: { name: "Sewage Bacteria", label: "Decomposers", sensitivity: "Consumes organic waste" },
            algae: { name: "Algae", label: "Nutrient Rich", sensitivity: "Causes Algal Bloom" }
        };

        const App = () => {
            const [sewageLoad, setSewageLoad] = useState(50); 
            const [flowRate, setFlowRate] = useState(30);     
            const [temperature, setTemperature] = useState(25); 
            const [selectedPoint, setSelectedPoint] = useState(0); 
            
            const [simulationData, setSimulationData] = useState([]);
            const [currentStats, setCurrentStats] = useState(null);

            // --- 模擬邏輯 ---
            useEffect(() => {
                const data = [];
                const RIVER_LENGTH = 100;
                const DISCHARGE_POINT = 20;

                let doLevel = 100 - (temperature - 20); 
                let bodLevel = 2; 
                let ammonia = 1;  

                for (let x = 0; x <= RIVER_LENGTH; x++) {
                    if (x === DISCHARGE_POINT) {
                        bodLevel += sewageLoad; 
                        ammonia += sewageLoad * 0.5;
                    }

                    if (x > DISCHARGE_POINT) {
                        const decompositionRate = 0.1 + (temperature * 0.005);
                        const bodConsumed = bodLevel * decompositionRate;
                        bodLevel -= bodConsumed;
                        
                        const deficit = (100 - (temperature - 20)) - doLevel;
                        const reaerationRate = 0.05 + (flowRate * 0.002);
                        const photosynthesis = (ammonia > 10 && x > DISCHARGE_POINT + 10) ? 0.5 : 0; 

                        doLevel = doLevel - (bodConsumed * 2.5) + (deficit * reaerationRate) + photosynthesis;
                        
                        if (ammonia > 1) ammonia -= 0.1;
                    }

                    doLevel = Math.max(0, Math.min(120, doLevel)); 
                    bodLevel = Math.max(0, bodLevel);

                    let zoneType = ZONES.CLEAN;
                    let species = [];

                    if (x > DISCHARGE_POINT && x < DISCHARGE_POINT + 5) {
                        zoneType = ZONES.DECOMPOSITION;
                        species = ['bacteria', 'rattailed'];
                    } else if (doLevel < 20) {
                        zoneType = ZONES.SEPTIC;
                        species = ['tubifex', 'bloodworm', 'bacteria'];
                    } else if (doLevel < 60) {
                        zoneType = ZONES.RECOVERY;
                        species = ['shrimp', 'bloodworm', 'algae'];
                    } else if (doLevel >= 60 && x > DISCHARGE_POINT) {
                        zoneType = ZONES.CLEAN_AGAIN;
                        species = ['mayfly', 'stonefly', 'shrimp'];
                    } else {
                        species = ['stonefly', 'mayfly'];
                    }

                    data.push({
                        distance: x,
                        do: parseFloat(doLevel.toFixed(1)),
                        bod: parseFloat(bodLevel.toFixed(1)),
                        ammonia: parseFloat(ammonia.toFixed(1)),
                        zone: zoneType,
                        species: species
                    });
                }
                setSimulationData(data);
            }, [sewageLoad, flowRate, temperature]);

            useEffect(() => {
                if (simulationData.length > 0) {
                    const idx = Math.min(Math.max(0, selectedPoint), simulationData.length - 1);
                    setCurrentStats(simulationData[idx]);
                }
            }, [selectedPoint, simulationData]);

            // 錯誤處理：如果 Recharts 加載失敗，顯示提示
            if (!Recharts || !AreaChart) {
                return (
                    <div className="flex items-center justify-center h-screen bg-red-50 text-red-800 p-8">
                        <div className="text-center">
                            <h2 className="text-2xl font-bold mb-2">Library Loading Error</h2>
                            <p>Failed to load Recharts or PropTypes. Please check your internet connection and refresh.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen max-w-7xl mx-auto bg-white shadow-2xl overflow-hidden">
                    
                    {/* --- Header --- */}
                    <header className="bg-slate-800 text-white p-4 flex justify-between items-center shadow-md z-10 shrink-0">
                        <div>
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="test-tube" size={24} color="#38bdf8" />
                                Stream Pollution Simulator
                            </h1>
                            <p className="text-xs text-slate-400">HKDSE Biology: Applied Ecology & Ecosystems</p>
                        </div>
                        <div className="hidden md:flex gap-4 text-xs text-slate-300 bg-slate-700 px-4 py-2 rounded-lg">
                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-blue-400 rounded-full"></div> Dissolved Oxygen (DO)</span>
                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-red-400 rounded-full"></div> Biochemical Oxygen Demand (BOD)</span>
                        </div>
                    </header>

                    {/* --- Main Content --- */}
                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        
                        {/* 左側：控制與資訊 (Sidebar) */}
                        <div className="w-full md:w-1/3 bg-slate-50 p-6 overflow-y-auto border-r border-slate-200">
                            
                            {/* 控制面板 */}
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 mb-6">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <Icon name="sliders" size={18} /> Simulation Controls
                                </h3>
                                
                                <div className="space-y-4">
                                    <div className="space-y-1">
                                        <div className="flex justify-between text-sm">
                                            <label className="text-slate-600 font-medium">Sewage Discharge</label>
                                            <span className="text-red-500 font-mono">{sewageLoad} units</span>
                                        </div>
                                        <input type="range" min="0" max="100" value={sewageLoad} onChange={(e) => setSewageLoad(Number(e.target.value))} className="w-full accent-red-500 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                        <p className="text-[10px] text-slate-400">Simulates organic waste entering at 20km</p>
                                    </div>

                                    <div className="space-y-1">
                                        <div className="flex justify-between text-sm">
                                            <label className="text-slate-600 font-medium">Stream Flow Rate</label>
                                            <span className="text-blue-500 font-mono">{flowRate} m/s</span>
                                        </div>
                                        <input type="range" min="10" max="100" value={flowRate} onChange={(e) => setFlowRate(Number(e.target.value))} className="w-full accent-blue-500 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                        <p className="text-[10px] text-slate-400">Faster flow increases aeration (recovery)</p>
                                    </div>

                                    <div className="space-y-1">
                                        <div className="flex justify-between text-sm">
                                            <label className="text-slate-600 font-medium">Water Temperature</label>
                                            <span className="text-orange-500 font-mono">{temperature}°C</span>
                                        </div>
                                        <input type="range" min="10" max="35" value={temperature} onChange={(e) => setTemperature(Number(e.target.value))} className="w-full accent-orange-500 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                                        <p className="text-[10px] text-slate-400">Warmer water holds less oxygen & speeds bacteria</p>
                                    </div>
                                </div>
                            </div>

                            {/* 課程知識點 */}
                            <div className="bg-blue-50 p-5 rounded-xl border border-blue-100 mb-6">
                                <h3 className="font-bold text-blue-800 mb-3 text-sm flex items-center gap-2">
                                    <Icon name="book-open" size={16} /> Key Concepts (HKDSE)
                                </h3>
                                <ul className="text-xs space-y-2 text-blue-900 list-disc list-inside">
                                    <li><strong>Oxygen Sag Curve:</strong> The drop and recovery of DO downstream from pollution.</li>
                                    <li><strong>Indicator Species:</strong> Organisms whose presence/absence indicates water quality (e.g., Stonefly = Clean, Tubifex = Polluted).</li>
                                    <li><strong>Eutrophication:</strong> Nutrient enrichment causing algal blooms, followed by bacterial decomposition and oxygen depletion.</li>
                                </ul>
                            </div>

                            {/* 當前位置數據 */}
                            {currentStats && (
                                <div className="bg-slate-800 text-white p-5 rounded-xl shadow-lg border border-slate-700">
                                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-600">
                                        <span className="text-xs uppercase tracking-wider text-slate-400">Sample at {currentStats.distance} km</span>
                                        <span className={`text-xs px-2 py-1 rounded font-bold ${currentStats.zone.color.replace('bg-', 'text-')}`}>
                                            {currentStats.zone.name}
                                        </span>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <div className="text-slate-400 text-xs">Dissolved Oxygen</div>
                                            <div className="text-2xl font-mono text-blue-400 font-bold">{currentStats.do}%</div>
                                        </div>
                                        <div>
                                            <div className="text-slate-400 text-xs">BOD</div>
                                            <div className="text-2xl font-mono text-red-400 font-bold">{currentStats.bod}</div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="text-slate-400 text-xs mb-2">Indicator Species Found:</div>
                                        <div className="flex flex-wrap gap-2">
                                            {currentStats.species.map(s => (
                                                <span key={s} className="bg-slate-700 border border-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1" title={SPECIES_INFO[s].sensitivity}>
                                                    {s === 'stonefly' || s === 'mayfly' ? '🦗' : 
                                                     s === 'shrimp' ? '🦐' : 
                                                     s === 'fish' ? '🐟' : 
                                                     s === 'bacteria' ? '🦠' : 
                                                     s === 'algae' ? '🌿' : '🐛'}
                                                    {SPECIES_INFO[s].name}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* 右側：視覺化與圖表 */}
                        <div className="w-full md:w-2/3 bg-white flex flex-col relative h-full">
                            
                            {/* 1. 河流橫切面視覺化 */}
                            <div className="h-48 bg-sky-100 relative overflow-hidden border-b-4 border-[#5d4037] shrink-0">
                                <div className="absolute top-2 left-2 z-10 bg-white/80 backdrop-blur px-2 py-1 rounded text-xs text-slate-600 font-medium">
                                    Visual Representation (Click chart below to change location)
                                </div>

                                {/* 水體背景 */}
                                <div 
                                    className="absolute inset-0 transition-colors duration-500"
                                    style={{ 
                                        backgroundColor: currentStats ? 
                                            (currentStats.do < 20 ? '#1e293b' : // 黑臭
                                             currentStats.bod > 20 ? '#065f46' : // 深綠(藻類)
                                             currentStats.do > 60 ? '#38bdf8' : '#0ea5e9') // 清澈藍
                                            : '#38bdf8',
                                        opacity: 0.8
                                    }}
                                >
                                    <div className="absolute inset-0 river-flow opacity-30"></div>
                                </div>

                                <div className="absolute bottom-0 w-full h-4 bg-[#3e2723]"></div>
                                
                                {currentStats && currentStats.bod > 10 && (
                                    <div className="absolute inset-0 pointer-events-none">
                                        {[...Array(Math.min(20, Math.floor(currentStats.bod / 2)))].map((_, i) => (
                                            <div key={i} className="absolute w-2 h-2 bg-yellow-900/50 rounded-full animate-pulse"
                                                style={{ left: `${Math.random()*100}%`, top: `${Math.random()*80}%`, animationDuration: `${1+Math.random()}s` }}>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="absolute inset-0 p-4 flex items-end justify-center gap-8">
                                    {currentStats && currentStats.species.map((s, i) => (
                                        <div key={`${s}-${i}`} className="flex flex-col items-center species-float" style={{ animationDelay: `${i*0.5}s` }}>
                                            <div className="bg-white/90 p-2 rounded-full shadow-lg text-2xl" title={SPECIES_INFO[s].name}>
                                                {s === 'stonefly' ? '🦗' : 
                                                 s === 'mayfly' ? '🦟' : 
                                                 s === 'shrimp' ? '🦐' : 
                                                 s === 'bloodworm' ? '🔴' : 
                                                 s === 'tubifex' ? '〰️' : 
                                                 s === 'rattailed' ? '🥢' : 
                                                 s === 'algae' ? '🌿' : 
                                                 s === 'bacteria' ? '🦠' : '🐟'}
                                            </div>
                                            <span className="text-[10px] font-bold text-white drop-shadow-md mt-1 bg-black/30 px-1 rounded">
                                                {SPECIES_INFO[s].name}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* 2. 互動圖表 */}
                            <div className="flex-1 p-4 bg-slate-50 relative min-h-0">
                                <h4 className="text-center font-bold text-slate-700 mb-2">Longitudinal Profile (Oxygen Sag Curve)</h4>
                                
                                <div className="w-full h-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart 
                                            data={simulationData} 
                                            margin={{ top: 10, right: 30, left: 0, bottom: 20 }}
                                            onClick={(e) => {
                                                if (e && e.activeLabel) setSelectedPoint(e.activeLabel);
                                            }}
                                            onMouseMove={(e) => {
                                                if (e && e.activeLabel) setSelectedPoint(e.activeLabel);
                                            }}
                                        >
                                            <defs>
                                                <linearGradient id="colorDO" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#38bdf8" stopOpacity={0.8}/>
                                                    <stop offset="95%" stopColor="#38bdf8" stopOpacity={0}/>
                                                </linearGradient>
                                                <linearGradient id="colorBOD" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#f87171" stopOpacity={0.8}/>
                                                    <stop offset="95%" stopColor="#f87171" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                            <XAxis 
                                                dataKey="distance" 
                                                type="number" 
                                                domain={[0, 100]}
                                                label={{ value: 'Distance Downstream (km)', position: 'insideBottom', offset: -10, fontSize: 12 }}
                                                tick={{fontSize: 10}}
                                            />
                                            <YAxis 
                                                label={{ value: 'Concentration (Arbitrary Units)', angle: -90, position: 'insideLeft', fontSize: 12 }}
                                                tick={{fontSize: 10}}
                                            />
                                            <Tooltip 
                                                contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                                                labelStyle={{ fontWeight: 'bold', color: '#64748b' }}
                                                itemStyle={{ fontSize: '12px' }}
                                            />
                                            <Legend verticalAlign="top" height={36}/>
                                            
                                            <ReferenceLine x={20} stroke="#ef4444" strokeDasharray="3 3" label={{ value: "Sewage", fill: "red", fontSize: 10 }} />
                                            <ReferenceLine x={selectedPoint} stroke="#64748b" strokeWidth={2} />

                                            <Area 
                                                type="monotone" 
                                                dataKey="do" 
                                                name="Dissolved Oxygen (DO)" 
                                                stroke="#0ea5e9" 
                                                strokeWidth={3}
                                                fillOpacity={1} 
                                                fill="url(#colorDO)" 
                                            />
                                            <Area 
                                                type="monotone" 
                                                dataKey="bod" 
                                                name="BOD (Pollution)" 
                                                stroke="#ef4444" 
                                                strokeWidth={3}
                                                fillOpacity={1} 
                                                fill="url(#colorBOD)" 
                                            />
                                            <Line type="monotone" dataKey="ammonia" name="Nutrients (Ammonia/Nitrate)" stroke="#16a34a" strokeDasharray="5 5" dot={false} strokeWidth={2}/>
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="absolute top-4 right-4 text-[10px] text-slate-400 bg-white/80 p-2 rounded">
                                    Click graph to inspect sections
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
