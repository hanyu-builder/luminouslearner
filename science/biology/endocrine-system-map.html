<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endocrine System Map</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Organ Hover Effect */
        .gland-path { transition: all 0.3s ease; cursor: pointer; fill-opacity: 0.6; stroke-width: 2px; }
        .gland-path:hover { fill-opacity: 0.9; filter: drop-shadow(0 0 8px rgba(255,255,255,0.6)); }
        .gland-path.active { fill-opacity: 1; stroke: #fbbf24; stroke-width: 3px; filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6)); }
        
        /* Info Card Animation */
        .info-enter { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    // Convert kebab-case to PascalCase
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- DATA ---
        const GLANDS = {
            pituitary: {
                id: 'pituitary', name: 'Pituitary Gland (腦下垂體)',
                color: '#a855f7', // Purple
                desc: 'The "Master Gland" located at the base of the brain.',
                hormones: [
                    { name: 'Growth Hormone (GH)', func: 'Stimulates growth of bones and muscles.' },
                    { name: 'ADH', func: 'Controls water reabsorption in kidneys.' },
                    { name: 'FSH / LH', func: 'Regulate reproductive organs.' }
                ],
                path_cx: 300, path_cy: 65, path_r: 8
            },
            thyroid: {
                id: 'thyroid', name: 'Thyroid Gland (甲狀腺)',
                color: '#ef4444', // Red
                desc: 'Butterfly-shaped gland in the neck.',
                hormones: [
                    { name: 'Thyroxine', func: 'Regulates metabolic rate.' }
                ],
                path_d: "M 290 130 Q 300 140 310 130 L 310 140 Q 300 150 290 140 Z" 
            },
            adrenal: {
                id: 'adrenal', name: 'Adrenal Glands (腎上腺)',
                color: '#f59e0b', // Orange
                desc: 'Located on top of each kidney.',
                hormones: [
                    { name: 'Adrenaline (Epinephrine)', func: 'Prepare body for "fight or flight" response.' }
                ],
                path_d: "M 260 280 L 275 265 L 290 280 Z M 310 280 L 325 265 L 340 280 Z" // Triangular caps on kidneys
            },
            pancreas: {
                id: 'pancreas', name: 'Pancreas (胰臟)',
                color: '#eab308', // Yellow
                desc: 'Located behind the stomach. Both an endocrine and exocrine gland.',
                hormones: [
                    { name: 'Insulin', func: 'Lowers blood glucose levels.' },
                    { name: 'Glucagon', func: 'Raises blood glucose levels.' }
                ],
                path_d: "M 280 260 L 340 250 L 350 270 L 290 280 Z" // Leaf shape
            },
            ovaries: {
                id: 'ovaries', name: 'Ovaries (卵巢) - Female',
                color: '#ec4899', // Pink
                desc: 'Female reproductive organs.',
                hormones: [
                    { name: 'Estrogen', func: 'Development of female secondary sexual characteristics.' },
                    { name: 'Progesterone', func: 'Maintains uterine lining.' }
                ],
                path_d: "M 260 380 A 10 10 0 1 0 260 400 A 10 10 0 1 0 260 380 M 340 380 A 10 10 0 1 0 340 400 A 10 10 0 1 0 340 380", // Two circles
                gender: 'female'
            },
            testes: {
                id: 'testes', name: 'Testes (睪丸) - Male',
                color: '#3b82f6', // Blue
                desc: 'Male reproductive organs.',
                hormones: [
                    { name: 'Testosterone', func: 'Development of male secondary sexual characteristics.' }
                ],
                path_d: "M 285 450 A 10 15 0 1 0 285 480 A 10 15 0 1 0 285 450 M 315 450 A 10 15 0 1 0 315 480 A 10 15 0 1 0 315 450", // Two ovals
                gender: 'male'
            }
        };

        // --- MAIN APP ---
        const App = () => {
            const [selectedGland, setSelectedGland] = useState(null);
            const [gender, setGender] = useState('female'); // 'female' or 'male' for gonads

            const handleSelect = (id) => {
                setSelectedGland(GLANDS[id]);
            };

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar: Info Panel */}
                    <div className="w-full md:w-96 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0 order-2 md:order-1">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="activity" className="text-yellow-400" /> Endocrine Map
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Hormonal Regulation System</p>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            
                            {/* Gender Toggle */}
                            <div className="bg-slate-800 p-1 rounded-xl flex mb-6">
                                <button 
                                    onClick={() => setGender('female')}
                                    className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${gender === 'female' ? 'bg-pink-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <Icon name="user" size={14}/> Female
                                </button>
                                <button 
                                    onClick={() => setGender('male')}
                                    className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${gender === 'male' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <Icon name="user" size={14}/> Male
                                </button>
                            </div>

                            <AnimatePresence mode='wait'>
                                {selectedGland ? (
                                    <motion.div 
                                        key={selectedGland.id}
                                        initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}
                                        className="space-y-6"
                                    >
                                        {/* Header */}
                                        <div>
                                            <div className="text-xs font-bold text-slate-500 uppercase mb-1">Selected Gland</div>
                                            <h2 className="text-2xl font-black text-white mb-2" style={{ color: selectedGland.color }}>
                                                {selectedGland.name}
                                            </h2>
                                            <p className="text-sm text-slate-300 leading-relaxed">
                                                {selectedGland.desc}
                                            </p>
                                        </div>

                                        {/* Hormones */}
                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                            <div className="text-xs font-bold text-slate-500 uppercase mb-3 flex items-center gap-2">
                                                <Icon name="flask-conical" size={14}/> Key Hormones
                                            </div>
                                            
                                            <ul className="space-y-3">
                                                {selectedGland.hormones.map((h, i) => (
                                                    <li key={i} className="flex flex-col gap-1 border-b border-slate-700 last:border-0 pb-2 last:pb-0">
                                                        <span className="font-bold text-emerald-400 text-sm">{h.name}</span>
                                                        <span className="text-xs text-slate-400">
                                                            {h.func}
                                                        </span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                        
                                        <div className="bg-blue-900/20 p-4 rounded-xl border border-blue-500/30 text-xs text-slate-300">
                                            <div className="font-bold text-blue-400 uppercase mb-1 flex items-center gap-2"><Icon name="info" size={14}/> Transport</div>
                                            <p>Hormones are secreted directly into the bloodstream and travel to target organs.</p>
                                        </div>

                                    </motion.div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-500 text-center p-8 opacity-50 space-y-4">
                                        <div className="w-20 h-20 rounded-full bg-slate-800 flex items-center justify-center">
                                            <Icon name="mouse-pointer-click" size={32} className="text-yellow-400"/>
                                        </div>
                                        <p>Click on a gland in the diagram to explore its hormones and functions.</p>
                                    </div>
                                )}
                            </AnimatePresence>

                        </div>
                    </div>

                    {/* Main Stage: Interactive Map */}
                    <div className="flex-1 bg-[#020617] relative flex flex-col p-4 overflow-hidden order-1 md:order-2">
                        
                        <div className="flex-1 relative flex items-center justify-center">
                            <svg viewBox="0 0 600 800" className="h-full w-full max-w-2xl drop-shadow-2xl">
                                
                                {/* Body Outline (Simplified) */}
                                <path d="M 200 50 Q 300 20 400 50 L 420 150 L 450 300 L 450 500 L 400 800 L 200 800 L 150 500 L 150 300 L 180 150 Z" 
                                      fill="none" stroke="#334155" strokeWidth="2" strokeDasharray="5,5" opacity="0.3"/>
                                <circle cx="300" cy="80" r="60" fill="none" stroke="#334155" strokeWidth="2" opacity="0.3"/> {/* Head */}

                                {/* Glands Layer */}
                                {Object.values(GLANDS).map(gland => {
                                    // Filter gonads based on gender
                                    if (gland.gender && gland.gender !== gender) return null;

                                    return gland.path_d ? (
                                        <path 
                                            key={gland.id}
                                            d={gland.path_d}
                                            fill={gland.color}
                                            className={`gland-path ${selectedGland?.id === gland.id ? 'active' : ''}`}
                                            onClick={() => handleSelect(gland.id)}
                                        />
                                    ) : (
                                        <circle 
                                            key={gland.id}
                                            cx={gland.path_cx} cy={gland.path_cy} r={gland.path_r}
                                            fill={gland.color}
                                            className={`gland-path ${selectedGland?.id === gland.id ? 'active' : ''}`}
                                            onClick={() => handleSelect(gland.id)}
                                        />
                                    );
                                })}

                                {/* Connecting Lines (Visual Aid) */}
                                {selectedGland && (
                                    <motion.g 
                                        initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                                        className="pointer-events-none"
                                    >
                                       {/* Visual connector if needed, or just highlight is enough */}
                                    </motion.g>
                                )}
                                
                            </svg>
                            
                            {/* Floating Label */}
                            {selectedGland && (
                                <motion.div 
                                    initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }}
                                    className="absolute bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-slate-700 px-6 py-3 rounded-full text-white font-bold shadow-xl pointer-events-none flex items-center gap-2"
                                >
                                    <div className="w-3 h-3 rounded-full" style={{backgroundColor: selectedGland.color}}></div>
                                    {selectedGland.name}
                                </motion.div>
                            )}

                            {!selectedGland && (
                                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-slate-500 text-xs bg-black/40 px-4 py-2 rounded-full backdrop-blur pointer-events-none border border-white/10">
                                    Tap anatomy to identify glands
                                </div>
                            )}
                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
