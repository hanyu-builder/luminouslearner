<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osmosis & Diffusion Simulator</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; 
            background: #38bdf8; cursor: pointer; margin-top: -6px; 
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }

        /* Canvas Container */
        .sim-canvas {
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- SIMULATION ENGINE ---
        const PARTICLE_SIZE = 6;
        const WATER_SIZE = 4;
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 400;

        const App = () => {
            const canvasRef = useRef(null);
            const [mode, setMode] = useState('diffusion'); // diffusion, osmosis
            const [temp, setTemp] = useState(50); // 0-100
            const [concLeft, setConcLeft] = useState(80); // Particles count
            const [concRight, setConcRight] = useState(20);
            const [isRunning, setIsRunning] = useState(false);
            
            // Data for chart
            const [history, setHistory] = useState([]);
            const particlesRef = useRef([]); // Store particle data ref for animation loop

            // Initialize Particles
            const initParticles = () => {
                const p = [];
                const speedBase = 0.5 + (temp / 100) * 2; // Speed depends on temp

                // Helper to create particle
                const create = (isLeft, type) => ({
                    x: isLeft ? Math.random() * (CANVAS_WIDTH/2 - 20) : Math.random() * (CANVAS_WIDTH/2 - 20) + CANVAS_WIDTH/2 + 20,
                    y: Math.random() * CANVAS_HEIGHT,
                    vx: (Math.random() - 0.5) * speedBase,
                    vy: (Math.random() - 0.5) * speedBase,
                    type: type, // 'solute' or 'water'
                    radius: type === 'solute' ? PARTICLE_SIZE : WATER_SIZE,
                    color: type === 'solute' ? '#ef4444' : '#3b82f6'
                });

                // Diffusion Mode: Only Solute
                if (mode === 'diffusion') {
                    for(let i=0; i<concLeft; i++) p.push(create(true, 'solute'));
                    for(let i=0; i<concRight; i++) p.push(create(false, 'solute'));
                } 
                // Osmosis Mode: Solute (Red) + Water (Blue)
                else if (mode === 'osmosis') {
                    // Left: High Solute, Low Water
                    // Right: Low Solute, High Water
                    // We simulate water explicitly for osmosis visuals
                    const waterCount = 200;
                    
                    // Solute
                    for(let i=0; i<concLeft; i++) p.push(create(true, 'solute'));
                    for(let i=0; i<concRight; i++) p.push(create(false, 'solute'));
                    
                    // Water (Inverse of solute roughly to fill space)
                    for(let i=0; i<waterCount - concLeft; i++) p.push(create(true, 'water'));
                    for(let i=0; i<waterCount - concRight; i++) p.push(create(false, 'water'));
                }

                particlesRef.current = p;
                setHistory([]);
            };

            useEffect(() => {
                initParticles();
                setIsRunning(false);
            }, [mode, concLeft, concRight, temp]);

            // Animation Loop
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;
                let frame = 0;

                const render = () => {
                    // Clear
                    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                    // Draw Membrane
                    ctx.beginPath();
                    const membraneX = CANVAS_WIDTH / 2;
                    const gap = mode === 'osmosis' ? 15 : 40; // Osmosis has smaller pores
                    
                    // Draw dashed line for membrane
                    ctx.setLineDash([5, gap]); // Dash array: line length, gap length
                    ctx.moveTo(membraneX, 0);
                    ctx.lineTo(membraneX, CANVAS_HEIGHT);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#94a3b8'; // Slate-400
                    ctx.stroke();
                    ctx.setLineDash([]); // Reset

                    // Update & Draw Particles
                    let leftCount = 0;
                    let rightCount = 0;
                    
                    particlesRef.current.forEach(p => {
                        if (isRunning) {
                            p.x += p.vx;
                            p.y += p.vy;

                            // Wall Bounce
                            if (p.x < p.radius || p.x > CANVAS_WIDTH - p.radius) p.vx *= -1;
                            if (p.y < p.radius || p.y > CANVAS_HEIGHT - p.radius) p.vy *= -1;

                            // Membrane Interaction
                            // Check if crossing membrane zone
                            if (Math.abs(p.x - membraneX) < 5) {
                                // Osmosis: Solute (Red) CANNOT pass. Water (Blue) CAN pass.
                                if (mode === 'osmosis' && p.type === 'solute') {
                                    p.vx *= -1; // Bounce back
                                    // Adjust position to avoid getting stuck
                                    p.x = p.x < membraneX ? membraneX - 6 : membraneX + 6;
                                }
                                // Diffusion: All pass (simple permeable membrane simulation)
                                // Or create probability of passing based on "pore size" visual
                            }
                        }

                        // Count for chart (Solute only)
                        if (p.type === 'solute') {
                            if (p.x < membraneX) leftCount++; else rightCount++;
                        }

                        // Draw
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });

                    // Update Chart Data every 10 frames
                    if (isRunning && frame % 10 === 0) {
                        setHistory(prev => {
                            const newData = [...prev, { time: frame, left: leftCount, right: rightCount }];
                            if (newData.length > 50) newData.shift(); // Keep window
                            return newData;
                        });
                    }

                    frame++;
                    animationId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animationId);
            }, [isRunning, mode]);

            const handleReset = () => {
                setIsRunning(false);
                initParticles();
            };

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="flask-conical" className="text-cyan-400" /> Sim Lab
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Osmosis & Diffusion</p>
                        </div>

                        <div className="p-6 space-y-8 flex-1 overflow-y-auto">
                            
                            {/* Mode Select */}
                            <div className="grid grid-cols-2 gap-2 bg-slate-800 p-1 rounded-xl">
                                <button 
                                    onClick={() => setMode('diffusion')}
                                    className={`py-2 text-xs font-bold rounded-lg transition-all ${mode === 'diffusion' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Diffusion
                                </button>
                                <button 
                                    onClick={() => setMode('osmosis')}
                                    className={`py-2 text-xs font-bold rounded-lg transition-all ${mode === 'osmosis' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Osmosis
                                </button>
                            </div>

                            {/* Controls */}
                            <div className="space-y-6">
                                <div>
                                    <div className="flex justify-between text-xs mb-2">
                                        <span className="text-slate-400 font-bold">Left Concentration</span>
                                        <span className="font-mono text-red-400">{concLeft}</span>
                                    </div>
                                    <input type="range" min="0" max="100" value={concLeft} onChange={(e) => setConcLeft(parseInt(e.target.value))} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-xs mb-2">
                                        <span className="text-slate-400 font-bold">Right Concentration</span>
                                        <span className="font-mono text-red-400">{concRight}</span>
                                    </div>
                                    <input type="range" min="0" max="100" value={concRight} onChange={(e) => setConcRight(parseInt(e.target.value))} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-xs mb-2">
                                        <span className="text-slate-400 font-bold">Temperature (KE)</span>
                                        <span className="font-mono text-orange-400">{temp}°C</span>
                                    </div>
                                    <input type="range" min="0" max="100" value={temp} onChange={(e) => setTemp(parseInt(e.target.value))} />
                                </div>
                            </div>

                            {/* Actions */}
                            <div className="grid grid-cols-2 gap-4">
                                <button 
                                    onClick={() => setIsRunning(!isRunning)}
                                    className={`py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all
                                        ${isRunning ? 'bg-yellow-600 text-white' : 'bg-green-600 text-white'}
                                    `}
                                >
                                    <Icon name={isRunning ? "pause" : "play"} size={18} /> {isRunning ? 'Pause' : 'Start'}
                                </button>
                                <button 
                                    onClick={handleReset}
                                    className="py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center gap-2 transition-all"
                                >
                                    <Icon name="rotate-ccw" size={18} /> Reset
                                </button>
                            </div>
                            
                            {/* Legend */}
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                <div className="text-xs font-bold text-slate-500 uppercase mb-2">Key</div>
                                <div className="space-y-2 text-xs">
                                    <div className="flex items-center gap-2">
                                        <div className="w-3 h-3 rounded-full bg-red-500"></div>
                                        <span className="text-slate-300">Solute (e.g. Sugar/Salt)</span>
                                    </div>
                                    {mode === 'osmosis' && (
                                        <div className="flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full bg-blue-500"></div>
                                            <span className="text-slate-300">Water Molecule</span>
                                        </div>
                                    )}
                                    <div className="flex items-center gap-2">
                                        <div className="w-1 h-4 bg-slate-500 border-l-2 border-dashed border-slate-400"></div>
                                        <span className="text-slate-300">Semi-permeable Membrane</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 bg-[#020617] relative flex flex-col p-4 overflow-hidden">
                        
                        {/* Canvas */}
                        <div className="flex-1 bg-slate-900 rounded-3xl border border-slate-800 shadow-xl relative overflow-hidden sim-canvas">
                            <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-black/40 backdrop-blur px-4 py-1 rounded-full border border-white/10 text-xs text-slate-300 font-mono z-10">
                                {mode === 'diffusion' ? 'Particles move from High to Low Conc.' : 'Water moves to High Solute Conc.'}
                            </div>
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_WIDTH} 
                                height={CANVAS_HEIGHT} 
                                className="w-full h-full object-contain"
                            />
                        </div>

                        {/* Real-time Graph */}
                        <div className="h-48 mt-4 bg-slate-900 rounded-2xl border border-slate-800 p-4 flex flex-col">
                            <div className="text-xs font-bold text-slate-500 uppercase mb-2 flex justify-between">
                                <span>Solute Distribution Over Time</span>
                                <span className="text-emerald-500">Equilibrium Monitor</span>
                            </div>
                            <div className="flex-1 min-h-0">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={history}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                        <XAxis dataKey="time" hide />
                                        <YAxis domain={[0, 'auto']} hide />
                                        <Tooltip 
                                            contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', fontSize: '12px' }}
                                            itemStyle={{ color: '#fff' }}
                                            labelStyle={{ display: 'none' }}
                                        />
                                        <Line type="monotone" dataKey="left" stroke="#ef4444" strokeWidth={2} dot={false} name="Left Side" />
                                        <Line type="monotone" dataKey="right" stroke="#fbbf24" strokeWidth={2} dot={false} name="Right Side" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
