<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digestive System Map</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Organ Hover Effect */
        .organ-path { transition: all 0.3s ease; cursor: pointer; fill-opacity: 0.3; stroke-width: 2px; }
        .organ-path:hover { fill-opacity: 0.6; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        .organ-path.active { fill-opacity: 0.8; stroke: #facc15; stroke-width: 3px; filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.5)); }
        
        /* Info Card Animation */
        .info-enter { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- DATA ---
        const ORGANS = {
            mouth: {
                id: 'mouth', name: 'Mouth (口腔)',
                color: '#ef4444', // Red
                desc: 'The beginning of the digestive tract. Mechanical digestion by teeth and chemical digestion by saliva.',
                enzymes: [
                    { name: 'Salivary Amylase (唾液澱粉酶)', action: 'Starch → Maltose' }
                ],
                path_d: "M 280 60 Q 300 50 320 60 L 320 80 Q 300 90 280 80 Z" // Simplified Mouth
            },
            oesophagus: {
                id: 'oesophagus', name: 'Oesophagus (食道)',
                color: '#f97316', // Orange
                desc: 'A muscular tube connecting the mouth to the stomach. Moves food by peristalsis.',
                enzymes: [],
                path_d: "M 290 80 Q 310 80 310 80 L 310 180 Q 290 180 290 180 Z" // Tube
            },
            stomach: {
                id: 'stomach', name: 'Stomach (胃)',
                color: '#eab308', // Yellow
                desc: 'A muscular sac that churns food. Secretes gastric juice containing HCl and proteases.',
                enzymes: [
                    { name: 'Pepsin (胃蛋白酶)', action: 'Proteins → Peptides' }
                ],
                path_d: "M 310 180 C 360 180 380 220 340 250 C 300 270 280 230 290 180" // J-shape
            },
            liver: {
                id: 'liver', name: 'Liver (肝臟)',
                color: '#8b5cf6', // Purple
                desc: 'Produces bile (for lipid emulsification). Processes absorbed nutrients.',
                enzymes: [], // Bile is not an enzyme
                note: 'Produces Bile (emulsifies lipids)',
                path_d: "M 230 180 C 230 150 290 150 290 180 L 290 220 L 230 220 Z" // Triangle-ish
            },
            pancreas: {
                id: 'pancreas', name: 'Pancreas (胰臟)',
                color: '#ec4899', // Pink
                desc: 'Secretes pancreatic juice into the duodenum containing key enzymes.',
                enzymes: [
                    { name: 'Pancreatic Amylase', action: 'Starch → Maltose' },
                    { name: 'Proteases (Trypsin)', action: 'Proteins → Peptides' },
                    { name: 'Lipase', action: 'Lipids → Fatty Acids + Glycerol' }
                ],
                path_d: "M 300 250 L 360 250 L 370 270 L 310 270 Z" // Leaf-like behind stomach
            },
            small_intestine: {
                id: 'small_intestine', name: 'Small Intestine (小腸)',
                color: '#10b981', // Green
                desc: 'Main site of chemical digestion and absorption. Villi increase surface area.',
                enzymes: [
                    { name: 'Maltase', action: 'Maltose → Glucose' },
                    { name: 'Peptidases', action: 'Peptides → Amino Acids' },
                    { name: 'Sucrase/Lactase', action: 'Disaccharides → Monosaccharides' }
                ],
                path_d: "M 280 280 C 200 280 200 400 300 400 C 400 400 400 280 320 280" // Coiled mass
            },
            large_intestine: {
                id: 'large_intestine', name: 'Large Intestine (大腸)',
                color: '#64748b', // Slate
                desc: 'Absorbs water and minerals. Forms and stores faeces.',
                enzymes: [],
                path_d: "M 260 350 L 260 250 L 380 250 L 380 400 L 340 400 L 340 450 L 300 450 L 300 400 L 260 400 L 260 350" // Frame around small intestine
            }
        };

        // --- MAIN APP ---
        const App = () => {
            const [selectedOrgan, setSelectedOrgan] = useState(null);

            const handleSelect = (id) => {
                setSelectedOrgan(ORGANS[id]);
            };

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar: Info Panel */}
                    <div className="w-full md:w-96 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0 order-2 md:order-1">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="activity" className="text-emerald-400" /> Digestive Map
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Interactive Human Anatomy</p>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                            
                            <AnimatePresence mode='wait'>
                                {selectedOrgan ? (
                                    <motion.div 
                                        key={selectedOrgan.id}
                                        initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }}
                                        className="space-y-6"
                                    >
                                        {/* Header */}
                                        <div>
                                            <h2 className="text-2xl font-black text-white mb-1" style={{ color: selectedOrgan.color }}>
                                                {selectedOrgan.name}
                                            </h2>
                                            <p className="text-sm text-slate-300 leading-relaxed">
                                                {selectedOrgan.desc}
                                            </p>
                                        </div>

                                        {/* Enzymes */}
                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                            <div className="text-xs font-bold text-slate-500 uppercase mb-3 flex items-center gap-2">
                                                <Icon name="flask-conical" size={14}/> Secretions & Enzymes
                                            </div>
                                            
                                            {selectedOrgan.note && (
                                                <div className="mb-3 p-2 bg-yellow-900/30 border border-yellow-500/30 rounded text-xs text-yellow-200">
                                                    ★ {selectedOrgan.note}
                                                </div>
                                            )}

                                            {selectedOrgan.enzymes.length > 0 ? (
                                                <ul className="space-y-3">
                                                    {selectedOrgan.enzymes.map((enz, i) => (
                                                        <li key={i} className="flex flex-col gap-1">
                                                            <span className="font-bold text-emerald-400 text-sm">{enz.name}</span>
                                                            <span className="text-xs text-slate-400 font-mono bg-slate-900 px-2 py-1 rounded border border-slate-800 inline-block">
                                                                {enz.action}
                                                            </span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            ) : (
                                                <div className="text-xs text-slate-500 italic">No digestive enzymes secreted here.</div>
                                            )}
                                        </div>

                                    </motion.div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-500 text-center p-8 opacity-50">
                                        <Icon name="mouse-pointer-click" size={48} className="mb-4"/>
                                        <p>Click on an organ in the diagram to explore its function.</p>
                                    </div>
                                )}
                            </AnimatePresence>

                        </div>
                    </div>

                    {/* Main Stage: Interactive Map */}
                    <div className="flex-1 bg-[#020617] relative flex flex-col p-4 overflow-hidden order-1 md:order-2">
                        
                        <div className="flex-1 relative flex items-center justify-center">
                            <svg viewBox="0 0 600 800" className="h-full w-full max-w-2xl drop-shadow-2xl">
                                
                                {/* Body Outline (Simplified) */}
                                <path d="M 200 50 Q 300 20 400 50 L 420 150 L 450 300 L 450 600 L 150 600 L 150 300 L 180 150 Z" 
                                      fill="none" stroke="#334155" strokeWidth="2" strokeDasharray="5,5" opacity="0.3"/>

                                {/* Organs Layer */}
                                {Object.values(ORGANS).map(organ => (
                                    <path 
                                        key={organ.id}
                                        d={organ.path_d}
                                        fill={organ.color}
                                        stroke={selectedOrgan?.id === organ.id ? '#fff' : organ.color}
                                        className={`organ-path ${selectedOrgan?.id === organ.id ? 'active' : ''}`}
                                        onClick={() => handleSelect(organ.id)}
                                    />
                                ))}

                                {/* Connecting Labels (Optional visual lines) */}
                                {selectedOrgan && (
                                    <g className="pointer-events-none animate-pulse">
                                        {/* Just a visual indicator, simplified */}
                                        <circle cx="0" cy="0" r="0" /> 
                                    </g>
                                )}
                                
                            </svg>
                            
                            {/* Floating Label */}
                            {selectedOrgan && (
                                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-slate-700 px-4 py-2 rounded-full text-white font-bold shadow-xl pointer-events-none flex items-center gap-2">
                                    <div className="w-3 h-3 rounded-full" style={{backgroundColor: selectedOrgan.color}}></div>
                                    {selectedOrgan.name}
                                </div>
                            )}

                            {!selectedOrgan && (
                                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-slate-500 text-xs bg-black/40 px-4 py-2 rounded-full backdrop-blur pointer-events-none">
                                    Tap anatomy to identify
                                </div>
                            )}
                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
