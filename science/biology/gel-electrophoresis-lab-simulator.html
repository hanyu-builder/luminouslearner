<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gel Electrophoresis Lab</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* UV Glow Effect */
        .uv-glow {
            filter: drop-shadow(0 0 2px #ec4899) drop-shadow(0 0 5px #ec4899);
        }
        
        /* Bubble Animation */
        .bubble {
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- DATA ---
        // DNA Fragments: size in bp
        // Smaller fragments move faster. Speed ~ 1/log(size) or just 1/size for visual simplicity
        const SAMPLES = {
            ladder: { name: 'DNA Ladder', fragments: [1000, 800, 600, 400, 200, 100], color: '#f472b6' }, // Pink marker
            sample1: { name: 'Sample A', fragments: [750, 300], color: '#38bdf8' },
            sample2: { name: 'Sample B', fragments: [500], color: '#38bdf8' },
            sample3: { name: 'Sample C (Crime Scene)', fragments: [900, 400, 150], color: '#38bdf8' },
            sample4: { name: 'Sample D (Suspect)', fragments: [900, 400, 150], color: '#38bdf8' }
        };

        // --- COMPONENT: GEL TANK ---
        const GelTank = ({ isRunning, voltage, time, samplesLoaded, isUVOn }) => {
            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            
            // Simulation State: Position of each band (0 to 100% of gel length)
            // Stored in ref to avoid re-renders on every frame, only canvas updates
            const positionsRef = useRef({}); 

            // Initialize positions
            useEffect(() => {
                const initPos = {};
                Object.keys(SAMPLES).forEach(key => {
                    initPos[key] = SAMPLES[key].fragments.map(() => 0); // All start at 0 (top)
                });
                positionsRef.current = initPos;
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const width = 600;
                const height = 400;

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    // --- DRAW TANK BACKGROUND ---
                    ctx.fillStyle = "#1e293b"; // Dark Blue Liquid
                    ctx.fillRect(0, 0, width, height);
                    
                    // Electrodes
                    ctx.fillStyle = "#0f172a"; // Negative (Black) - Top
                    ctx.fillRect(0, 0, width, 40);
                    ctx.fillStyle = "#fff"; ctx.font = "bold 20px monospace"; ctx.fillText("-", width/2, 25);
                    
                    ctx.fillStyle = "#ef4444"; // Positive (Red) - Bottom
                    ctx.fillRect(0, height - 40, width, 40);
                    ctx.fillStyle = "#fff"; ctx.fillText("+", width/2, height - 15);

                    // --- DRAW GEL ---
                    const gelMargin = 50;
                    const gelWidth = width - 100;
                    const gelHeight = height - 80;
                    const gelX = 50;
                    const gelY = 40;

                    ctx.fillStyle = isUVOn ? "#312e81" : "#334155"; // Darker if UV on? Or glowing background
                    // Gel body
                    ctx.shadowBlur = 10; ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.fillRect(gelX, gelY, gelWidth, gelHeight);
                    ctx.shadowBlur = 0;

                    // Wells
                    const wellCount = 5;
                    const wellWidth = 40;
                    const wellSpacing = (gelWidth - (wellCount * wellWidth)) / (wellCount + 1);
                    
                    const wellX = [];
                    for(let i=0; i<wellCount; i++) {
                        const wx = gelX + wellSpacing + i * (wellWidth + wellSpacing);
                        wellX.push(wx);
                        // Draw well rect
                        ctx.fillStyle = "#1e293b";
                        ctx.fillRect(wx, gelY + 10, wellWidth, 10);
                    }

                    // --- PHYSICS UPDATE ---
                    if (isRunning) {
                        // Calculate movement based on Voltage and Size
                        // Speed proportional to Voltage
                        // Speed inversely proportional to Log(Size)
                        
                        Object.keys(SAMPLES).forEach((key, laneIdx) => {
                            if (!samplesLoaded[key]) return;
                            
                            const frags = SAMPLES[key].fragments;
                            const currentPos = positionsRef.current[key] || frags.map(() => 0);
                            
                            const newPos = currentPos.map((pos, i) => {
                                const size = frags[i];
                                // Physics formula proxy: v = (V / log(size)) * constant
                                // Small (100) moves fast, Large (1000) moves slow
                                const speed = (voltage * 0.05) / Math.log10(size); 
                                
                                // Limit to gel length
                                return Math.min(gelHeight - 20, pos + speed);
                            });
                            
                            positionsRef.current[key] = newPos;
                        });
                    }

                    // --- DRAW BANDS ---
                    // Only visible if Dye is used (always implied blue dye for tracking) OR UV is on
                    // Realistically: Loading dye moves separately. DNA is invisible until stained/UV.
                    // For Sim: Show bands as "Blue" (Dye front proxy) or "Glowing" (DNA) if UV.
                    // Let's assume loading dye runs with DNA for visual simplicity, or just show DNA as bands always visible for learning context?
                    // Better: Bands invisible unless UV is ON. Tracking dye (Blue) runs at fixed speed.
                    
                    // Let's show bands as faint grey if UV off (like stained), bright if UV on.
                    
                    Object.keys(SAMPLES).forEach((key, laneIdx) => {
                        if (!samplesLoaded[key]) return;
                        
                        const wx = wellX[laneIdx];
                        const positions = positionsRef.current[key];
                        const sampleData = SAMPLES[key];

                        positions.forEach((pos, i) => {
                            const y = gelY + 10 + pos; // Well position + movement
                            
                            if (isUVOn) {
                                // Glowing Bands
                                ctx.fillStyle = sampleData.color;
                                ctx.shadowBlur = 10; ctx.shadowColor = sampleData.color;
                                ctx.fillRect(wx, y, wellWidth, 4);
                                ctx.shadowBlur = 0;
                            } else {
                                // Faint bands (Stained but no UV)
                                ctx.fillStyle = "rgba(255,255,255,0.1)";
                                ctx.fillRect(wx, y, wellWidth, 4);
                            }
                        });
                    });

                    // Bubbles (Electrolysis)
                    if (isRunning) {
                        ctx.fillStyle = "rgba(255,255,255,0.4)";
                        for(let i=0; i<10; i++) {
                            const bx = Math.random() * width;
                            const by = (Math.random() < 0.5 ? 20 : height - 20) + (Math.random()*10);
                            ctx.beginPath(); ctx.arc(bx, by, 1 + Math.random()*2, 0, Math.PI*2); ctx.fill();
                        }
                    }

                    animationRef.current = requestAnimationFrame(render);
                };
                render();
                return () => cancelAnimationFrame(animationRef.current);
            }, [isRunning, voltage, samplesLoaded, isUVOn]);

            return <canvas ref={canvasRef} width={600} height={400} className="w-full h-full object-contain bg-slate-800 rounded-xl border border-slate-700" />;
        };

        // --- MAIN APP ---
        const App = () => {
            const [voltage, setVoltage] = useState(100); // 50-150V
            const [time, setTime] = useState(0); // Minutes running
            const [isRunning, setIsRunning] = useState(false);
            const [isUVOn, setIsUVOn] = useState(false);
            
            // Lab State
            const [loadedSamples, setLoadedSamples] = useState({
                ladder: false,
                sample1: false,
                sample2: false,
                sample3: false,
                sample4: false
            });
            const [pipetteActive, setPipetteActive] = useState(null); // 'ladder', etc.

            // Timer Loop
            useEffect(() => {
                let interval;
                if (isRunning) {
                    interval = setInterval(() => {
                        setTime(t => t + 1);
                    }, 100); // 1 sec real time = 10 min sim time? No, let's just count ticks
                }
                return () => clearInterval(interval);
            }, [isRunning]);

            const loadSample = (key) => {
                if (pipetteActive === key) {
                    setLoadedSamples(prev => ({ ...prev, [key]: true }));
                    setPipetteActive(null);
                } else {
                    setPipetteActive(key);
                }
            };

            const reset = () => {
                setIsRunning(false);
                setTime(0);
                setIsUVOn(false);
                // Reload page logic or reset refs? 
                // Refs are inside component. Best to force re-mount key.
                window.location.reload(); 
            };

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="align-justify" className="text-purple-400" /> Gel Lab
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">DNA Electrophoresis</p>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-8">
                            
                            {/* Sample Loading */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">1. Load Samples</label>
                                <div className="flex flex-col gap-2">
                                    {Object.entries(SAMPLES).map(([key, data]) => (
                                        <button 
                                            key={key}
                                            onClick={() => loadSample(key)}
                                            disabled={loadedSamples[key] || isRunning}
                                            className={`w-full p-3 rounded-xl border transition-all flex items-center justify-between group
                                                ${loadedSamples[key] 
                                                    ? 'bg-emerald-900/20 border-emerald-500/50 text-emerald-400' 
                                                    : pipetteActive === key
                                                        ? 'bg-blue-600 border-blue-500 text-white shadow-lg'
                                                        : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}
                                            `}
                                        >
                                            <div className="flex items-center gap-3">
                                                <Icon name={key === 'ladder' ? 'ruler' : 'test-tube'} size={18}/>
                                                <span className="text-sm font-bold">{data.name}</span>
                                            </div>
                                            {loadedSamples[key] ? <Icon name="check" size={16}/> : pipetteActive === key ? <span className="text-[10px] animate-pulse">Click Gel Well</span> : <Icon name="pipette" size={16} className="opacity-0 group-hover:opacity-100"/>}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Power Supply */}
                            <div className="space-y-4 pt-4 border-t border-slate-800">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">2. Power Supply</label>
                                
                                <div>
                                    <div className="flex justify-between text-xs mb-2">
                                        <span className="font-bold text-slate-400">Voltage</span>
                                        <span className="font-mono text-yellow-400">{voltage} V</span>
                                    </div>
                                    <input 
                                        type="range" min="50" max="150" step="10"
                                        value={voltage} 
                                        onChange={(e) => setVoltage(parseInt(e.target.value))}
                                        disabled={isRunning}
                                        className="w-full accent-yellow-500"
                                    />
                                </div>

                                <button 
                                    onClick={() => setIsRunning(!isRunning)}
                                    className={`w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg
                                        ${isRunning ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-green-600 hover:bg-green-500 text-white'}
                                    `}
                                >
                                    <Icon name="power" size={20}/> {isRunning ? 'Stop Run' : 'Start Run'}
                                </button>
                            </div>

                            {/* Analysis */}
                            <div className="space-y-4 pt-4 border-t border-slate-800">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">3. Analysis</label>
                                <button 
                                    onClick={() => setIsUVOn(!isUVOn)}
                                    className={`w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all border
                                        ${isUVOn ? 'bg-purple-600 border-purple-500 text-white shadow-[0_0_15px_#9333ea]' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}
                                    `}
                                >
                                    <Icon name="lightbulb" size={18}/> {isUVOn ? 'UV Light ON' : 'Turn on UV'}
                                </button>
                            </div>
                            
                            <button onClick={reset} className="w-full py-2 text-xs text-slate-500 hover:text-white flex items-center justify-center gap-2">
                                <Icon name="rotate-ccw" size={12}/> Reset Lab
                            </button>

                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 bg-[#020617] relative flex flex-col p-6 overflow-hidden gap-6">
                        
                        {/* Tank View */}
                        <div className="flex-1 bg-slate-900 rounded-3xl border border-slate-800 shadow-xl relative overflow-hidden flex flex-col items-center justify-center p-8">
                            <div className="w-full h-full max-w-3xl relative">
                                <GelTank 
                                    isRunning={isRunning} 
                                    voltage={voltage} 
                                    time={time} 
                                    samplesLoaded={loadedSamples} 
                                    isUVOn={isUVOn} 
                                />
                                
                                {/* Labels Overlay */}
                                <div className="absolute top-2 left-1/2 -translate-x-1/2 flex gap-12 text-[10px] text-slate-400 font-mono">
                                    {Object.keys(SAMPLES).map((key, i) => (
                                        <div key={key} className="w-10 text-center">Lane {i+1}</div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        
                        {/* Concept Info */}
                        <div className="bg-blue-900/20 p-4 rounded-xl border border-blue-500/30 text-sm text-slate-300 flex gap-4 items-start">
                             <div className="p-2 bg-blue-500/20 rounded-lg text-blue-400 shrink-0">
                                <Icon name="info" size={20}/>
                             </div>
                             <div>
                                <h3 className="font-bold text-white mb-1">Principle</h3>
                                <p className="text-xs leading-relaxed">
                                    DNA is negatively charged (phosphate backbone) and moves towards the positive electrode (+). 
                                    Smaller fragments move <strong>faster</strong> through the gel matrix than larger ones.
                                </p>
                             </div>
                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
