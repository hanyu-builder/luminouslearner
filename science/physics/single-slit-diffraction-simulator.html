<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單縫繞射模擬實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff; background: #6366f1;
        }
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 600;
    const WAVE_HEIGHT = 250;
    const SCREEN_HEIGHT = 100;
    const GRAPH_HEIGHT = 150;
    
    const App = () => {
        const [wavelength, setWavelength] = useState(532); 
        const [slitWidth, setSlitWidth] = useState(2000); 

        const waveCanvasRef = useRef(null);
        const screenCanvasRef = useRef(null);
        const graphCanvasRef = useRef(null);
        const requestRef = useRef();
        const timeRef = useRef(0);

        const nmToRGB = (wavelength) => {
            let r, g, b;
            if (wavelength >= 380 && wavelength < 440) { r = -(wavelength - 440) / (440 - 380); g = 0; b = 1; }
            else if (wavelength >= 440 && wavelength < 490) { r = 0; g = (wavelength - 440) / (490 - 440); b = 1; }
            else if (wavelength >= 490 && wavelength < 510) { r = 0; g = 1; b = -(wavelength - 510) / (510 - 490); }
            else if (wavelength >= 510 && wavelength < 580) { r = (wavelength - 510) / (580 - 510); g = 1; b = 0; }
            else if (wavelength >= 580 && wavelength < 645) { r = 1; g = -(wavelength - 645) / (645 - 580); b = 0; }
            else if (wavelength >= 645 && wavelength <= 750) { r = 1; g = 0; b = 0; }
            else { r = 0; g = 0; b = 0; }
            let factor = (wavelength >= 380 && wavelength < 420) ? 0.3 + 0.7 * (wavelength - 380) / (420 - 380) :
                         (wavelength >= 420 && wavelength < 700) ? 1.0 :
                         (wavelength >= 700 && wavelength <= 750) ? 0.3 + 0.7 * (750 - wavelength) / (750 - 700) : 0.0;
            const R = Math.floor(r * factor * 255); const G = Math.floor(g * factor * 255); const B = Math.floor(b * factor * 255);
            return { r: R, g: G, b: B, css: `rgb(${R},${G},${B})` };
        };

        const color = nmToRGB(wavelength);

        const loop = () => {
            timeRef.current += 0.05;
            drawWaveView();
            requestRef.current = requestAnimationFrame(loop);
        };

        const drawWaveView = () => {
            const ctx = waveCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = CANVAS_WIDTH; const h = WAVE_HEIGHT; const cy = h / 2; const slitX = 100; 
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#334155';
            const gapPixels = (slitWidth / 5000) * 40; 
            ctx.fillRect(slitX, 0, 10, cy - gapPixels/2);
            ctx.fillRect(slitX, cy + gapPixels/2, 10, h - (cy + gapPixels/2));
            const waveSpacing = (wavelength / 700) * 20; const t = timeRef.current;
            ctx.lineWidth = 2; ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.5)`;
            for (let x = 0; x < slitX; x += waveSpacing) {
                const waveX = (x + t * 5) % slitX; 
                ctx.beginPath(); ctx.moveTo(waveX, 0); ctx.lineTo(waveX, h); ctx.stroke();
            }
            const numSegments = 90; const angleStep = Math.PI / numSegments;
            for (let r = 0; r < w - slitX; r += waveSpacing) {
                const radius = (r + t * 5) % (w - slitX);
                if (radius < 5) continue;
                for (let i = 0; i < numSegments; i++) {
                    const theta = -Math.PI/2 + i * angleStep;
                    const beta = (Math.PI * slitWidth * Math.sin(theta)) / wavelength;
                    let intensity = 1.0;
                    if (Math.abs(beta) > 1e-6) { const sinc = Math.sin(beta) / beta; intensity = sinc * sinc; }
                    const distanceFalloff = Math.max(0, 1 - radius / (w - slitX));
                    const alpha = intensity * distanceFalloff;
                    if (alpha < 0.01) continue;
                    ctx.beginPath(); ctx.arc(slitX, cy, radius, theta, theta + angleStep);
                    ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`; ctx.stroke();
                }
            }
            const ratio = wavelength / slitWidth;
            if (ratio <= 1) {
                const theta = Math.asin(ratio); const len = 600;
                ctx.strokeStyle = '#ef4444'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(slitX, cy); ctx.lineTo(slitX + len * Math.cos(theta), cy - len * Math.sin(theta)); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(slitX, cy); ctx.lineTo(slitX + len * Math.cos(theta), cy + len * Math.sin(theta)); ctx.stroke();
                ctx.setLineDash([]);
            }
        };

        const updateCalculations = () => {
            const screenCtx = screenCanvasRef.current?.getContext('2d');
            const graphCtx = graphCanvasRef.current?.getContext('2d');
            if (!screenCtx || !graphCtx) return;
            const w = CANVAS_WIDTH; const sh = SCREEN_HEIGHT; const gh = GRAPH_HEIGHT;
            screenCtx.fillStyle = '#000000'; screenCtx.fillRect(0, 0, w, sh);
            graphCtx.fillStyle = '#1e293b'; graphCtx.fillRect(0, 0, w, gh);
            graphCtx.strokeStyle = '#64748b'; graphCtx.lineWidth = 1;
            graphCtx.beginPath(); graphCtx.moveTo(0, gh - 20); graphCtx.lineTo(w, gh - 20); graphCtx.stroke();
            graphCtx.setLineDash([2, 4]); graphCtx.beginPath(); graphCtx.moveTo(w/2, 0); graphCtx.lineTo(w/2, gh); graphCtx.stroke(); graphCtx.setLineDash([]);
            graphCtx.beginPath(); graphCtx.strokeStyle = color.css; graphCtx.lineWidth = 2;
            graphCtx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.2)`;
            const fov = 0.5; 
            const screenImg = screenCtx.createImageData(w, sh); const sData = screenImg.data;
            for (let x = 0; x < w; x++) {
                const theta = -fov + (x / w) * (2 * fov);
                const alpha = (Math.PI * slitWidth * Math.sin(theta)) / wavelength;
                let intensity = 1.0;
                if (Math.abs(alpha) > 1e-6) { const sinc = Math.sin(alpha) / alpha; intensity = sinc * sinc; }
                const plotY = (gh - 20) - intensity * (gh - 40);
                if (x === 0) graphCtx.moveTo(x, plotY); else graphCtx.lineTo(x, plotY);
                const brightness = Math.floor(intensity * 255);
                for (let y = 0; y < sh; y++) {
                    const idx = (y * w + x) * 4; sData[idx] = color.r; sData[idx+1] = color.g; sData[idx+2] = color.b; sData[idx+3] = brightness; 
                }
            }
            graphCtx.stroke(); graphCtx.lineTo(w, gh-20); graphCtx.lineTo(0, gh-20); graphCtx.fill();
            screenCtx.putImageData(screenImg, 0, 0);
            const thetaMin = Math.asin(Math.min(1, wavelength / slitWidth));
            if (!isNaN(thetaMin)) {
                const minX_R = ((thetaMin + fov) / (2 * fov)) * w; const minX_L = ((-thetaMin + fov) / (2 * fov)) * w;
                graphCtx.fillStyle = '#ef4444'; graphCtx.font = 'bold 10px sans-serif';
                if (minX_R < w) { graphCtx.fillText('極小點', minX_R - 15, gh - 5); graphCtx.fillRect(minX_R, gh - 25, 2, 10); }
                if (minX_L > 0) { graphCtx.fillText('極小點', minX_L - 15, gh - 5); graphCtx.fillRect(minX_L, gh - 25, 2, 10); }
            }
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [wavelength, slitWidth]); 

        useEffect(() => { updateCalculations(); }, [wavelength, slitWidth]);
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-600 p-2 rounded-lg"><i data-lucide="aperture" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">單縫繞射模擬實驗室</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-indigo-400 border border-slate-700 uppercase">DSE Physics: Wave Optics</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-8 flex flex-col gap-4">
                        <div className="bg-slate-950 rounded-2xl border border-slate-700 relative overflow-hidden shadow-2xl">
                            <div className="absolute top-3 left-3 bg-slate-900/90 px-3 py-1 rounded text-[10px] text-slate-400 font-black border border-slate-700 uppercase tracking-widest z-10">俯視圖 (波陣面視覺化)</div>
                            <canvas ref={waveCanvasRef} width={CANVAS_WIDTH} height={WAVE_HEIGHT} className="w-full h-auto" />
                        </div>

                        <div className="bg-slate-900 rounded-2xl border border-slate-700 relative overflow-hidden p-6 shadow-xl">
                            <div className="absolute top-3 left-6 text-[10px] text-slate-500 font-black uppercase tracking-widest">強度分佈曲線 (Intensity Profile)</div>
                            <canvas ref={graphCanvasRef} width={CANVAS_WIDTH} height={GRAPH_HEIGHT} className="w-full h-auto" />
                        </div>

                        <div className="bg-black rounded-2xl border-4 border-slate-800 relative overflow-hidden h-28 shadow-2xl ring-1 ring-slate-700/50">
                            <div className="absolute top-3 left-4 text-[10px] text-white/40 font-black uppercase tracking-widest">屏幕實際觀測效果 (Screen View)</div>
                            <canvas ref={screenCanvasRef} width={CANVAS_WIDTH} height={SCREEN_HEIGHT} className="w-full h-full" />
                        </div>
                    </div>

                    <aside className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold mb-4 flex items-center gap-2"><i data-lucide="sliders" className="w-5 h-5 text-indigo-400"></i> 控制參數設定</h2>

                            <div>
                                <label className="flex justify-between text-xs font-black mb-3 uppercase tracking-wider" style={{color: color.css}}>
                                    <span>激光波長 (λ)</span>
                                    <span className="font-mono text-sm">{wavelength} nm</span>
                                </label>
                                <div className="h-1.5 w-full rounded-full mb-3 shadow-inner" style={{background: 'linear-gradient(to right, #4b0082, #0000ff, #00ff00, #ffff00, #ff7f00, #ff0000)'}}></div>
                                <input type="range" min="400" max="700" step="1" value={wavelength} onChange={(e) => setWavelength(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>

                            <div>
                                <label className="flex justify-between text-xs font-black text-slate-300 mb-3 uppercase tracking-wider">
                                    <span>狹縫寬度 (a)</span>
                                    <span className="font-mono text-sm">{(slitWidth/1000).toFixed(1)} μm</span>
                                </label>
                                <input type="range" min="500" max="5000" step="100" value={slitWidth} onChange={(e) => setSlitWidth(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase tracking-tighter">
                                    <span>窄縫 (繞射強)</span>
                                    <span>寬縫 (繞射弱)</span>
                                </div>
                            </div>

                            <button onClick={() => {setWavelength(532); setSlitWidth(2000);}} className="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-black uppercase text-xs tracking-[0.2em] transition-all border border-slate-600 flex items-center justify-center gap-2 shadow-lg active:scale-95"><i data-lucide="rotate-ccw" className="w-4 h-4"></i> 重置實驗</button>
                        </div>

                        <div className="bg-indigo-500/5 border border-indigo-500/20 p-6 rounded-2xl shadow-inner">
                            <h3 className="text-indigo-400 font-black text-[10px] uppercase tracking-[0.2em] mb-4 flex items-center gap-2"><i data-lucide="calculator" className="w-4 h-4"></i> 繞射比率分析</h3>
                            <div className="text-center mb-6">
                                <div className="text-sm text-slate-500 mb-1 font-bold">λ / a 比值</div>
                                <div className="text-4xl font-mono font-black text-white italic">{(wavelength / slitWidth).toFixed(3)}</div>
                            </div>
                            <div className="text-[11px] text-slate-400 leading-relaxed space-y-3 font-medium">
                                <p className="flex gap-2 items-start"><span className="text-indigo-500">■</span> 當 <strong>λ / a</strong> 增加（波長變長或狹縫變窄），繞射圖案會變得更<strong>闊</strong>。</p>
                                <p className="flex gap-2 items-start"><span className="text-indigo-500">■</span> 當 <strong>λ / a</strong> 減小，繞射效應減弱，光線趨向<strong>直線傳播</strong>。</p>
                            </div>
                        </div>
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
</script>
</body>
</html>
