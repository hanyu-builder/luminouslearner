<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重心尋找實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: pointer; }
        .shape-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .shape-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 500;
    const PIN_X = CANVAS_WIDTH / 2;
    const PIN_Y = 100;

    const SHAPES = {
        'L形薄片': [
            { x: 0, y: 0 }, { x: 100, y: 0 }, { x: 100, y: 200 }, 
            { x: 200, y: 200 }, { x: 200, y: 300 }, { x: 0, y: 300 }
        ],
        '三角形': [
            { x: 0, y: 0 }, { x: 250, y: 50 }, { x: 50, y: 250 }
        ],
        '不規則形': [
            { x: 50, y: 0 }, { x: 200, y: 50 }, { x: 250, y: 200 }, 
            { x: 150, y: 300 }, { x: 0, y: 250 }, { x: 20, y: 100 }
        ]
    };

    const App = () => {
        const [currentShapeKey, setCurrentShapeKey] = useState('L形薄片');
        const [pivotIdx, setPivotIdx] = useState(0); 
        const [rotation, setRotation] = useState(0); 
        const [lines, setLines] = useState([]); 
        const [showCoG, setShowCoG] = useState(false);
        const [isSwinging, setIsSwinging] = useState(false);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        // 多邊形質心計算 (重心)
        const getCentroid = (vertices) => {
            let signedArea = 0, Cx = 0, Cy = 0;
            for (let i = 0; i < vertices.length; i++) {
                const x0 = vertices[i].x, y0 = vertices[i].y;
                const x1 = vertices[(i + 1) % vertices.length].x, y1 = vertices[(i + 1) % vertices.length].y;
                const a = x0 * y1 - x1 * y0;
                signedArea += a;
                Cx += (x0 + x1) * a;
                Cy += (y0 + y1) * a;
            }
            signedArea *= 0.5;
            Cx /= (6 * signedArea);
            Cy /= (6 * signedArea);
            return { x: Cx, y: Cy };
        };

        const currentVertices = useMemo(() => SHAPES[currentShapeKey], [currentShapeKey]);
        const cog = useMemo(() => getCentroid(currentVertices), [currentVertices]);

        // 物理邏輯：平衡時重心必須位於支點正下方
        const getTargetRotation = () => {
            const pivot = currentVertices[pivotIdx];
            const dx = cog.x - pivot.x;
            const dy = cog.y - pivot.y;
            const localAngle = Math.atan2(dy, dx);
            return Math.PI / 2 - localAngle;
        };

        const targetRotation = useMemo(() => getTargetRotation(), [pivotIdx, currentVertices, cog]);

        const animate = () => {
            setRotation(prev => {
                const diff = targetRotation - prev;
                const normalizedDiff = Math.atan2(Math.sin(diff), Math.cos(diff));
                if (Math.abs(normalizedDiff) < 0.001) {
                    setIsSwinging(false);
                    return targetRotation;
                }
                return prev + normalizedDiff * 0.08; // 模擬阻尼擺動
            });
            if (isSwinging) requestRef.current = requestAnimationFrame(animate);
        };

        useEffect(() => {
            setIsSwinging(true);
            requestRef.current = requestAnimationFrame(animate);
            return () => cancelAnimationFrame(requestRef.current);
        }, [targetRotation]);

        const addPlumbLine = () => {
            if (isSwinging && Math.abs(rotation - targetRotation) > 0.05) return;
            const pivot = currentVertices[pivotIdx];
            // 在局部座標系中，鉛垂線是從支點出發，方向為 -rotation 的垂直向下向量
            const dy = 400;
            const rx = -dy * Math.sin(-rotation);
            const ry = dy * Math.cos(-rotation);
            setLines(prev => [...prev, { x1: pivot.x, y1: pivot.y, x2: pivot.x + rx, y2: pivot.y + ry }]);
        };

        const handleCanvasClick = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            const pivot = currentVertices[pivotIdx];
            currentVertices.forEach((v, i) => {
                const dx = v.x - pivot.x, dy = v.y - pivot.y;
                const rx = dx * Math.cos(rotation) - dy * Math.sin(rotation);
                const ry = dx * Math.sin(rotation) + dy * Math.cos(rotation);
                const wx = PIN_X + rx, wy = PIN_Y + ry;
                if (Math.hypot(clickX - wx, clickY - wy) < 25) setPivotIdx(i);
            });
        };

        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製支架
            ctx.fillStyle = '#475569';
            ctx.fillRect(PIN_X - 3, 0, 6, PIN_Y);
            ctx.beginPath(); ctx.arc(PIN_X, PIN_Y, 6, 0, Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();

            // 2. 繪製輔助線 (當前鉛垂方向)
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.beginPath(); ctx.moveTo(PIN_X, PIN_Y); ctx.lineTo(PIN_X, PIN_Y + 350); ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(PIN_X, PIN_Y + 350, 8, 0, Math.PI*2); ctx.fillStyle = '#ef4444'; ctx.fill();

            // 3. 轉換坐標系繪製薄片
            const pivot = currentVertices[pivotIdx];
            ctx.save();
            ctx.translate(PIN_X, PIN_Y);
            ctx.rotate(rotation);
            ctx.translate(-pivot.x, -pivot.y);

            // 繪製形狀
            ctx.beginPath();
            ctx.moveTo(currentVertices[0].x, currentVertices[0].y);
            currentVertices.forEach((v, i) => i > 0 && ctx.lineTo(v.x, v.y));
            ctx.closePath();
            ctx.fillStyle = 'rgba(59, 130, 246, 0.85)'; ctx.fill();
            ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 3; ctx.stroke();

            // 繪製已記錄的鉛垂線
            ctx.setLineDash([8, 4]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            lines.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            });
            ctx.setLineDash([]);

            // 繪製頂點 (懸掛點)
            currentVertices.forEach((v, i) => {
                ctx.beginPath(); ctx.arc(v.x, v.y, 7, 0, Math.PI*2);
                ctx.fillStyle = i === pivotIdx ? '#fbbf24' : '#1e293b'; ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
            });

            // 顯示正確重心 (答案)
            if (showCoG) {
                ctx.beginPath(); ctx.arc(cog.x, cog.y, 6, 0, Math.PI*2);
                ctx.fillStyle = '#10b981'; ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                // 十字準心
                ctx.beginPath();
                ctx.moveTo(cog.x - 12, cog.y); ctx.lineTo(cog.x + 12, cog.y);
                ctx.moveTo(cog.x, cog.y - 12); ctx.lineTo(cog.x, cog.y + 12);
                ctx.stroke();
            }

            ctx.restore();
            if (window.lucide) window.lucide.createIcons();
        }, [currentVertices, pivotIdx, rotation, lines, showCoG, cog]);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                            <i data-lucide="target"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">重心尋找實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Statics (Equilibrium)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 space-y-4">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px] flex justify-center items-center bg-slate-950">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onClick={handleCanvasClick} className="w-full h-full object-contain canvas-container touch-none" />
                            <div className="absolute top-6 left-6 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                                <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-1">實驗指示</p>
                                <p className="text-sm text-slate-200">點擊薄片上的<b>白色圓點</b>變換懸掛位置</p>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 flex flex-wrap gap-4 items-center justify-between shadow-xl">
                            <div className="flex gap-2 p-1 bg-slate-950 rounded-2xl border border-slate-700">
                                {Object.keys(SHAPES).map(key => (
                                    <button key={key} onClick={() => { setCurrentShapeKey(key); setPivotIdx(0); setLines([]); setShowCoG(false); }} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${currentShapeKey === key ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/20' : 'text-slate-500 hover:text-slate-300'}`}>{key}</button>
                                ))}
                            </div>
                            <div className="flex gap-3">
                                <button onClick={addPlumbLine} disabled={isSwinging} className="px-6 py-3 bg-red-600/10 hover:bg-red-600/20 text-red-400 border border-red-500/30 rounded-xl font-bold transition-all flex items-center gap-2 disabled:opacity-30">
                                    <i data-lucide="pencil" className="w-4 h-4"></i> 劃下鉛垂線
                                </button>
                                <button onClick={() => setShowCoG(!showCoG)} className={`px-6 py-3 rounded-xl font-bold border transition-all ${showCoG ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600'}`}>
                                    {showCoG ? '隱藏重心' : '顯示正確重心'}
                                </button>
                                <button onClick={() => { setLines([]); setPivotIdx(0); }} className="p-3 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl transition-all active:scale-90"><i data-lucide="rotate-ccw" className="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="book-open" className="w-5 h-5 text-indigo-400"></i> 實驗步驟詳解
                            </h2>
                            <div className="space-y-6">
                                <div className="flex gap-4">
                                    <div className="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-sm font-bold text-blue-400 shadow-inner">1</div>
                                    <p className="text-sm text-slate-400 leading-relaxed">點擊一個頂點懸掛薄片。重力會使物體擺動，直到<b>重心</b>位於支點正下方。</p>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-sm font-bold text-blue-400 shadow-inner">2</div>
                                    <p className="text-sm text-slate-400 leading-relaxed">按下「劃下鉛垂線」，系統會記錄通過支點的垂直虛線。重心必定在此線上。</p>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-sm font-bold text-blue-400 shadow-inner">3</div>
                                    <p className="text-sm text-slate-400 leading-relaxed">切換到<b>另一個頂點</b>再次劃線。兩條（或多條）線的<b>交點</b>即為重心的精確位置。</p>
                                </div>
                            </div>
                            <div className={`mt-6 p-5 rounded-2xl border text-center transition-all ${lines.length >= 2 ? 'bg-emerald-600/10 border-emerald-500/30' : 'bg-slate-900/50 border-slate-700'}`}>
                                <p className="text-xs text-slate-500 uppercase font-bold mb-1">目前進度</p>
                                <p className={`text-xl font-black ${lines.length >= 2 ? 'text-emerald-400' : 'text-white'}`}>{lines.length} 條鉛垂線</p>
                                {lines.length >= 2 && <p className="text-[10px] text-emerald-500 mt-1 uppercase font-bold italic animate-pulse">已定位重心！</p>}
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理考點</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                物體的平衡取決於<b>力矩 (Moment)</b>。當重心不在支點正下方時，重力會產生力矩使物體旋轉；只有當兩者垂直對齊時，力臂為零，合力矩才為零。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
