<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直流電動機實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        .thumb-orange::-webkit-slider-thumb { border-color: #f97316; }
        .thumb-cyan::-webkit-slider-thumb { border-color: #06b6d4; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [voltage, setVoltage] = useState(5.0); 
        const [speed, setSpeed] = useState(0); 
        const [angle, setAngle] = useState(0); 
        const [isRunning, setIsRunning] = useState(false);
        const [slowMo, setSlowMo] = useState(false);
        
        const canvasRef = useRef(null);
        const requestRef = useRef();
        const lastTimeRef = useRef(0);
        
        const physicsRef = useRef({
            angle: 0,
            velocity: 0
        });
        
        const paramsRef = useRef({ voltage, slowMo });

        useEffect(() => {
            paramsRef.current = { voltage, slowMo };
        }, [voltage, slowMo]);

        const startSim = () => {
            if (isRunning) return;
            setIsRunning(true);
            lastTimeRef.current = performance.now();
            requestRef.current = requestAnimationFrame(loop);
        };

        const resetSim = () => {
            setIsRunning(false);
            cancelAnimationFrame(requestRef.current);
            physicsRef.current = { angle: 0, velocity: 0 };
            setAngle(0);
            setSpeed(0);
            setTimeout(() => draw(), 10);
        };

        const loop = (timestamp) => {
            const dt = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;

            const state = physicsRef.current;
            const { voltage, slowMo } = paramsRef.current;
            
            // 物理模型：目標速度與電壓成正比
            const maxSpeed = voltage * 4; 
            const accel = (maxSpeed - state.velocity) * 2.0; 
            
            state.velocity += accel * dt;
            
            // 套用時間縮放 (慢動作)
            const timeScale = slowMo ? 0.2 : 1.0;
            state.angle += state.velocity * dt * timeScale;

            setAngle(state.angle);
            setSpeed(state.velocity);

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // 3D 投影輔助
        const project = (x, y, z) => {
            const scale = 300 / (300 + z);
            return {
                x: CENTER_X + x * scale,
                y: CENTER_Y + y * scale,
                scale: scale
            };
        };

        // --- 繪圖功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const theta = physicsRef.current.angle;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製磁場線 (N -> S)
            ctx.lineWidth = 1;
            for (let y = -120; y <= 120; y += 40) {
                const grad = ctx.createLinearGradient(150, 0, 650, 0);
                grad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                grad.addColorStop(0.2, 'rgba(56, 189, 248, 0.4)');
                grad.addColorStop(0.8, 'rgba(56, 189, 248, 0.4)');
                grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                ctx.strokeStyle = grad;
                ctx.beginPath(); ctx.moveTo(150, CENTER_Y + y); ctx.lineTo(650, CENTER_Y + y); ctx.stroke();
                // 箭頭
                if (y % 80 === 0) {
                    const arrowX = CENTER_X + (y % 60); 
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
                    ctx.beginPath(); ctx.moveTo(arrowX, CENTER_Y + y); ctx.lineTo(arrowX - 8, CENTER_Y + y - 4); ctx.lineTo(arrowX - 8, CENTER_Y + y + 4); ctx.fill();
                }
            }
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 24px Inter'; ctx.textAlign = 'center';
            ctx.fillText("B", CENTER_X, CENTER_Y - 140);

            // 2. 繪製定子磁鐵
            const magW = 100, magH = 240;
            drawCube(ctx, -300, 0, 0, magW, magH, 120, '#ef4444', '#b91c1c', 'N'); // 左 N
            drawCube(ctx, 300, 0, 0, magW, magH, 120, '#3b82f6', '#1d4ed8', 'S');  // 右 S

            // 3. 繪製轉子 (線圈)
            const cW = 280, cH = 160;
            const r = cH / 2, halfW = cW / 2;
            const y1 = r * Math.sin(theta), z1 = r * Math.cos(theta); 
            const y2 = -y1, z2 = -z1;

            // 繪製轉軸 (背景層)
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 12; ctx.beginPath();
            ctx.moveTo(CENTER_X - 350, CENTER_Y); ctx.lineTo(CENTER_X + 350, CENTER_Y); ctx.stroke();

            const drawArm = (y, z, color, label) => {
                const p1 = project(-halfW, y, z), p2 = project(halfW, y, z);
                ctx.lineWidth = 10; ctx.strokeStyle = color; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                ctx.fillStyle = 'white'; ctx.font = 'bold 12px Inter';
                ctx.fillText(label, (p1.x+p2.x)/2, p1.y - 10);
            };

            const drawI = (y, z, dir) => {
                if (voltage < 0.1) return;
                const p1 = project(-halfW, y, z), p2 = project(halfW, y, z);
                const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                ctx.fillStyle = '#facc15'; ctx.beginPath();
                if (dir > 0) { ctx.moveTo(midX + 10, midY); ctx.lineTo(midX - 5, midY - 6); ctx.lineTo(midX - 5, midY + 6); }
                else { ctx.moveTo(midX - 10, midY); ctx.lineTo(midX + 5, midY - 6); ctx.lineTo(midX + 5, midY + 6); }
                ctx.fill();
            };

            const drawF = (y, z, dir) => {
                if (voltage < 0.1) return;
                const p = project(0, y, z); 
                const fLen = 45;
                const fY = dir > 0 ? -fLen : fLen;
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 4; ctx.beginPath();
                ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + fY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p.x, p.y + fY); ctx.lineTo(p.x - 5, p.y + fY - 5 * Math.sign(fY)); ctx.lineTo(p.x + 5, p.y + fY - 5 * Math.sign(fY));
                ctx.fillStyle = '#10b981'; ctx.fill();
            };

            const isOrangeTop = y1 > 0;
            const drawA = () => {
                drawArm(y1, z1, '#f97316', 'A 邊');
                const curDir = isOrangeTop ? 1 : -1;
                drawI(y1, z1, curDir);
                drawF(y1, z1, -curDir); // 下沉或上升力
            };
            const drawB = () => {
                drawArm(y2, z2, '#3b82f6', 'B 邊');
                const curDir = isOrangeTop ? -1 : 1;
                drawI(y2, z2, curDir);
                drawF(y2, z2, -curDir);
            };

            if (z1 < z2) { drawA(); drawB(); } else { drawB(); drawA(); }
            
            drawCommutator(ctx, -halfW - 30, theta);
            drawBrushes(ctx, -halfW - 30);
        };

        const drawCube = (ctx, x, y, z, w, h, d, fC, sC, label) => {
            const c = project(x, y, z);
            const hw = w/2 * c.scale, hh = h/2 * c.scale, depth = d * 0.4 * c.scale;
            ctx.fillStyle = fC; ctx.fillRect(c.x - hw, c.y - hh, hw*2, hh*2);
            ctx.fillStyle = sC; ctx.beginPath();
            ctx.moveTo(c.x + hw, c.y - hh); ctx.lineTo(c.x + hw + depth, c.y - hh - depth*0.5);
            ctx.lineTo(c.x + hw + depth, c.y + hh - depth*0.5); ctx.lineTo(c.x + hw, c.y + hh); ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = 'bold 40px Inter'; ctx.fillText(label, c.x, c.y + 12);
        };

        const drawCommutator = (ctx, x, theta) => {
            const c = project(x, 0, 0);
            const r = 30 * c.scale;
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(theta);
            ctx.beginPath(); ctx.arc(0, 0, r, 0.1, Math.PI - 0.1); ctx.strokeStyle = '#f97316'; ctx.lineWidth = 6; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, r, Math.PI + 0.1, 2*Math.PI - 0.1); ctx.strokeStyle = '#3b82f6'; ctx.stroke();
            ctx.restore();
        };

        const drawBrushes = (ctx, x) => {
            const c = project(x, 0, 0);
            const gap = 35 * c.scale;
            ctx.fillStyle = '#64748b'; 
            ctx.fillRect(c.x - 12, c.y - gap - 12, 24, 12); // 上電刷
            ctx.fillRect(c.x - 12, c.y + gap, 24, 12);      // 下電刷
            ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(c.x, c.y - gap - 12); ctx.lineTo(c.x, c.y - 120); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x, c.y + gap + 12); ctx.lineTo(c.x, c.y + 120); ctx.stroke();
        };

        useEffect(() => { draw(); }, []);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-500">
                            <i data-lucide="fan"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">直流電動機實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Electromagnetism
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 gap-8 mt-4">
                    <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[450px]">
                        <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain rounded-2xl" />
                        <div className="absolute top-6 left-6 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                            <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">轉速 (估算)</div>
                            <div className="text-2xl font-mono font-black text-white">{(Math.abs(speed) * 9.55).toFixed(0)} <span className="text-xs text-slate-500">RPM</span></div>
                        </div>
                        <div className="absolute top-6 right-6 bg-slate-900/80 px-4 py-3 rounded-xl border border-slate-700 text-xs space-y-2 backdrop-blur-md">
                            <div className="flex items-center gap-2 text-yellow-400"><div className="w-4 h-1 bg-yellow-400 rounded-full"></div> <span>電流方向 (I)</span></div>
                            <div className="flex items-center gap-2 text-emerald-400"><div className="w-4 h-1 bg-emerald-500 rounded-full"></div> <span>磁力方向 (F)</span></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="settings-2" className="w-5 h-5 text-cyan-400"></i> 馬達運作控制
                            </h2>
                            <div>
                                <label className="flex justify-between text-xs text-cyan-400 font-bold uppercase tracking-widest mb-3">
                                    <span>輸入電壓 (V)</span>
                                    <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{voltage} V</span>
                                </label>
                                <input type="range" min="0" max="12" step="0.5" value={voltage} onChange={(e) => setVoltage(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                            </div>
                            <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                <div className="flex items-center gap-3">
                                    <input type="checkbox" checked={slowMo} onChange={() => setSlowMo(!slowMo)} className="w-5 h-5 rounded text-orange-500 bg-slate-800 border-slate-600 focus:ring-0" />
                                    <span className="text-sm font-bold text-slate-200">慢動作模式 (觀察換向過程)</span>
                                </div>
                                <i data-lucide="snail" className="text-orange-500 w-4 h-4"></i>
                            </label>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={startSim} disabled={isRunning} className={`py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg ${isRunning ? 'bg-slate-700 text-slate-500' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}>
                                    <i data-lucide="play"></i> 開始運作
                                </button>
                                <button onClick={resetSim} className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all active:scale-95">
                                    <i data-lucide="rotate-ccw" className="w-4 h-4 mr-2"></i> 重設
                                </button>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                                <h3 className="text-indigo-300 font-bold text-sm mb-4 flex items-center gap-2 uppercase tracking-widest">
                                    <i data-lucide="refresh-cw" className="w-4 h-4"></i> 換向器 (Commutator) 的作用
                                </h3>
                                <p className="text-xs text-slate-400 leading-relaxed italic">
                                    請觀察中心處的<b>半圓形分環</b>。當線圈轉動到垂直位置（90°）時，電刷會越過縫隙。這會使流入線圈的電流方向<b>瞬間反轉</b>，確保磁力始終推動線圈向同一方向旋轉。
                                </p>
                            </div>
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                                <span>線圈分邊標示：</span>
                                <div className="flex gap-4">
                                    <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-orange-500"></div> <span>A 邊 (橙色)</span></div>
                                    <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-blue-500"></div> <span>B 邊 (藍色)</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
