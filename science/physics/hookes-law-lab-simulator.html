<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡克定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop Types -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #14b8a6;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
        }
        .thumb-teal::-webkit-slider-thumb { border-color: #14b8a6; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceDot, ReferenceLine, Label, CartesianGrid } = Recharts;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const PIXELS_PER_CM = 10; 
    const NATURAL_LENGTH = 150; 

    const SPRINGS = [
        { name: "軟質彈簧", k: 20, limit: 8, color: "#14b8a6", desc: "易於拉伸，彈性限度低" }, 
        { name: "中等彈簧", k: 40, limit: 12, color: "#3b82f6", desc: "標準教學用彈簧" },
        { name: "強力彈簧", k: 80, limit: 16, color: "#a855f7", desc: "高強度合金鋼" },
        { name: "鋼絲", k: 200, limit: 20, color: "#64748b", desc: "極難拉伸，主要研究微小形變" }
    ];

    const App = () => {
        // --- 狀態 ---
        const [springName, setSpringName] = useState("中等彈簧");
        const [load, setLoad] = useState(0); 
        const [permanentDeformation, setPermanentDeformation] = useState(0); 
        const [showRuler, setShowRuler] = useState(true);
        const [isBroken, setIsBroken] = useState(false);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        const animRef = useRef({
            currentExtension: 0, 
            velocity: 0
        });

        const currentSpring = useMemo(() => SPRINGS.find(s => s.name === springName), [springName]);

        // --- 物理運算 ---
        const calculateExtension = (force) => {
            if (isBroken) return animRef.current.currentExtension;
            const k_visual = currentSpring.k / 10; 
            let elasticExt = force / k_visual;
            
            if (force > currentSpring.limit) {
                const excess = force - currentSpring.limit;
                const newPlastic = excess * 0.5; 
                if (newPlastic > permanentDeformation) {
                    setPermanentDeformation(newPlastic);
                }
                if (force > currentSpring.limit * 1.5) {
                    setIsBroken(true);
                }
            }
            return elasticExt + permanentDeformation;
        };

        const targetExtension = useMemo(() => calculateExtension(load), [load, currentSpring, isBroken, permanentDeformation]);

        // --- 動畫循環 ---
        const loop = () => {
            const state = animRef.current;
            const k_sim = 0.12;
            const damping = 0.82;
            
            const diff = targetExtension - state.currentExtension;
            const acc = diff * k_sim;
            
            state.velocity += acc;
            state.velocity *= damping;
            state.currentExtension += state.velocity;

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const cx = 320, supportY = 60; 
            const extPx = animRef.current.currentExtension * PIXELS_PER_CM;
            const currentLen = NATURAL_LENGTH + extPx;

            // 1. 支架
            ctx.fillStyle = '#334155';
            ctx.fillRect(cx - 60, supportY - 10, 120, 12);
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
            for(let i=-50; i<60; i+=12) {
                ctx.beginPath(); ctx.moveTo(cx + i, supportY - 10); ctx.lineTo(cx + i + 6, supportY - 20); ctx.stroke();
            }

            // 2. 刻度尺
            if (showRuler) {
                const rX = cx + 110;
                ctx.fillStyle = 'rgba(226, 232, 240, 0.05)';
                ctx.fillRect(rX, supportY, 45, 450);
                ctx.fillStyle = '#64748b'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'right';
                for(let cm = 0; cm <= 40; cm += 1) {
                    const y = supportY + NATURAL_LENGTH + (cm * PIXELS_PER_CM);
                    if (y > supportY + 450) break;
                    const isMajor = cm % 5 === 0;
                    ctx.fillRect(rX, y, isMajor ? 18 : 10, 1);
                    if (isMajor) ctx.fillText(cm, rX - 8, y + 4);
                }
                ctx.textAlign = 'center'; ctx.fillText("cm", rX + 22, supportY + 20);
                
                // 零位基準線
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)'; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(cx - 80, supportY + NATURAL_LENGTH); ctx.lineTo(rX, supportY + NATURAL_LENGTH); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#94a3b8'; ctx.fillText("基準 0", cx - 100, supportY + NATURAL_LENGTH + 4);
            }

            // 3. 彈簧
            ctx.strokeStyle = currentSpring.color; ctx.lineWidth = 5;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(cx, supportY);
            if (isBroken) {
                drawCoil(ctx, cx, supportY, currentLen/2.5, 8, 20);
                ctx.stroke();
            } else {
                drawCoil(ctx, cx, supportY, currentLen, 20, 32);
                ctx.stroke();
            }

            // 4. 砝碼
            if (!isBroken) {
                const bY = supportY + currentLen;
                // 掛勾
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(cx, bY); ctx.lineTo(cx, bY + 25);
                ctx.arc(cx, bY + 30, 6, -Math.PI/2, Math.PI * 1.5); ctx.stroke();
                
                if (load > 0) {
                    const mY = bY + 35, h = 25 + load * 2.5, w = 50;
                    const grad = ctx.createLinearGradient(cx - w/2, mY, cx + w/2, mY);
                    grad.addColorStop(0, '#475569'); grad.addColorStop(0.5, '#94a3b8'); grad.addColorStop(1, '#475569');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.moveTo(cx - w/2 + 8, mY); ctx.lineTo(cx + w/2 - 8, mY);
                    ctx.lineTo(cx + w/2, mY + h); ctx.lineTo(cx - w/2, mY + h); ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.font = 'black 14px Inter'; ctx.textAlign = 'center';
                    ctx.fillText(`${load}N`, cx, mY + h/2 + 6);
                }

                // 紅色指示箭頭
                ctx.fillStyle = '#f43f5e'; ctx.beginPath();
                ctx.moveTo(cx + 25, bY); ctx.lineTo(cx + 70, bY - 6); ctx.lineTo(cx + 70, bY + 6); ctx.fill();
            }
        };

        const drawCoil = (ctx, x, y, len, coils, width) => {
            const step = len / (coils * 4);
            let cy = y;
            for (let i = 0; i < coils; i++) {
                ctx.bezierCurveTo(x + width, cy + step, x + width, cy + step * 3, x, cy + step * 4);
                cy += step * 4;
                if (i < coils - 1) ctx.bezierCurveTo(x - width, cy - step * 3, x - width, cy - step, x, cy);
            }
        };

        const graphData = useMemo(() => {
            const data = [];
            const k = currentSpring.k / 10; 
            for (let f = 0; f <= 25; f += 1) {
                let ext = f / k;
                if (f > currentSpring.limit) ext += (f - currentSpring.limit) * 0.5;
                if (f > currentSpring.limit * 1.5) break;
                data.push({ f, x: ext });
            }
            return data;
        }, [springName]);

        const reset = () => {
            setLoad(0); setPermanentDeformation(0); setIsBroken(false);
            animRef.current = { currentExtension: 0, velocity: 0 };
        };

        useEffect(() => { reset(); }, [springName]);

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [load, springName, isBroken]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 h-16 shadow-xl z-10">
                    <div className="flex items-center space-x-3">
                        <div className="bg-teal-500/20 p-2 rounded-lg text-teal-400">
                            <i data-lucide="shrink"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">胡克定律實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Properties of Matter
                    </div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12">
                        
                        <div className="lg:col-span-8 bg-slate-950 relative border-r border-slate-800 flex items-center justify-center">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            
                            {load > currentSpring.limit && !isBroken && (
                                <div className="absolute top-8 left-1/2 -translate-x-1/2 bg-rose-600 text-white px-8 py-3 rounded-2xl shadow-2xl animate-bounce font-black flex items-center gap-3">
                                    <i data-lucide="alert-triangle"></i> 超過彈性限度！
                                </div>
                            )}

                            {isBroken && (
                                <div className="absolute inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-20">
                                    <div className="text-center p-10 border-4 border-red-500 rounded-[3rem] shadow-[0_0_50px_rgba(239,68,68,0.4)]">
                                        <h2 className="text-5xl font-black text-white mb-6 uppercase tracking-tighter">彈簧斷裂</h2>
                                        <button onClick={reset} className="px-10 py-4 bg-white text-red-600 rounded-2xl font-black hover:bg-gray-100 transition-all flex items-center gap-3 mx-auto shadow-xl">
                                            <i data-lucide="rotate-ccw"></i> 重置實驗
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="lg:col-span-4 bg-slate-900 flex flex-col h-full overflow-y-auto custom-scroll p-8 space-y-8">
                            <div className="space-y-6">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-4 flex items-center gap-2">
                                    <i data-lucide="settings" className="w-4 h-4"></i> 控制面板
                                </h3>
                                
                                <div>
                                    <label className="text-xs font-bold text-slate-400 mb-3 block">選擇彈簧材質</label>
                                    <select value={springName} onChange={(e)=>setSpringName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm font-bold text-slate-200 outline-none focus:ring-2 focus:ring-teal-500 transition-all">
                                        {SPRINGS.map(s => <option key={s.name} value={s.name}>{s.name} (限度: {s.limit}N)</option>)}
                                    </select>
                                    <p className="text-[10px] text-slate-500 mt-2 italic">{currentSpring.desc}</p>
                                </div>

                                <div>
                                    <label className="flex justify-between text-xs font-bold text-teal-400 uppercase tracking-widest mb-4"><span>懸掛負載 (F)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{load} N</span></label>
                                    <input type="range" min="0" max="25" step="1" value={load} onChange={(e)=>setLoad(Number(e.target.value))} disabled={isBroken} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-teal" />
                                </div>

                                <div className="p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3 shadow-inner">
                                    <div className="flex justify-between items-center"><span className="text-[10px] text-slate-500 font-bold uppercase">伸長量 (x)</span><span className="text-xl font-black text-white font-mono">{animRef.current.currentExtension.toFixed(2)} cm</span></div>
                                    <div className="flex justify-between items-center border-t border-slate-800 pt-3"><span className="text-[10px] text-slate-500 font-bold uppercase">永久形變</span><span className={`text-xl font-black font-mono ${permanentDeformation > 0 ? 'text-rose-400' : 'text-slate-700'}`}>{permanentDeformation.toFixed(2)} cm</span></div>
                                </div>
                            </div>

                            <div>
                                <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2"><i data-lucide="line-chart" className="text-indigo-400 w-3 h-3"></i> 力－伸長量關係 (F-x Graph)</h3>
                                <div className="h-44 w-full bg-slate-950 rounded-2xl border border-slate-800 p-2 shadow-inner">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={graphData}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" vertical={false} />
                                            <XAxis dataKey="x" hide type="number" />
                                            <YAxis hide type="number" />
                                            <Tooltip contentStyle={{backgroundColor: '#020617', border: '1px solid #1e293b', fontSize: '10px', color: '#fff'}} />
                                            <Line type="monotone" dataKey="f" stroke="#14b8a6" strokeWidth={3} dot={false} isAnimationActive={false} />
                                            <ReferenceLine y={currentSpring.limit} stroke="#ef4444" strokeDasharray="5 5" opacity={0.5} />
                                            {!isBroken && <ReferenceDot x={animRef.current.currentExtension} y={load} r={5} fill="#ffffff" stroke="#14b8a6" strokeWidth={2} />}
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner mt-auto">
                                <h4 className="text-indigo-300 font-bold text-xs uppercase mb-2 flex items-center gap-2"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理考點</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                    在<b>彈性區域</b>內，$F = kx$。一旦超過<b>彈性限度</b>，彈簧進入塑性區，移除力後無法恢復原長，最終會導致斷裂。
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
