<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同位素構建實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .particle { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .isotope-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 數據資料庫 ---
    const ELEMENTS = [
        { z: 0, sym: 'n', name: '中子' },
        { z: 1, sym: 'H', name: '氫 (Hydrogen)' },
        { z: 2, sym: 'He', name: '氦 (Helium)' },
        { z: 3, sym: 'Li', name: '鋰 (Lithium)' },
        { z: 4, sym: 'Be', name: '鈹 (Beryllium)' },
        { z: 5, sym: 'B', name: '硼 (Boron)' },
        { z: 6, sym: 'C', name: '碳 (Carbon)' },
        { z: 7, sym: 'N', name: '氮 (Nitrogen)' },
        { z: 8, sym: 'O', name: '氧 (Oxygen)' },
        { z: 9, sym: 'F', name: '氟 (Fluorine)' },
        { z: 10, sym: 'Ne', name: '氖 (Neon)' }
    ];

    const STABILITY_MAP = {
        '1-0': true, '1-1': true, '1-2': false, 
        '2-1': true, '2-2': true, '2-4': false, 
        '3-3': true, '3-4': true, 
        '4-5': true, 
        '5-5': true, '5-6': true, 
        '6-6': true, '6-7': true, '6-8': false, 
        '7-7': true, '7-8': true, 
        '8-8': true, '8-9': true, '8-10': true, 
        '9-10': true, 
        '10-10': true, '10-11': true, '10-12': true 
    };

    const App = () => {
        // --- 狀態 ---
        const [protons, setProtons] = useState(3);
        const [neutrons, setNeutrons] = useState(4);
        const [particles, setParticles] = useState([]); 

        const canvasRef = useRef(null);

        // --- 邏輯判斷 ---
        const element = useMemo(() => ELEMENTS[protons] || { sym: '?', name: '未知' }, [protons]);
        const massNumber = protons + neutrons;
        const stabilityKey = `${protons}-${neutrons}`;
        const isStable = STABILITY_MAP[stabilityKey];
        
        let stabilityText = "具放射性 (Radioactive)";
        let stabilityColor = "text-amber-500 border-amber-500/50 bg-amber-500/10";
        
        if (isStable === true) {
            stabilityText = "穩定核素 (Stable)";
            stabilityColor = "text-emerald-400 border-emerald-500/50 bg-emerald-500/10";
        } else if (isStable === undefined) {
             stabilityText = "極不穩定 (Unstable)";
             stabilityColor = "text-slate-400 border-slate-500/50 bg-slate-500/10";
        }

        // --- 視覺模擬 (費馬螺線佈局) ---
        useEffect(() => {
            const newParticles = [];
            const total = protons + neutrons;
            let pCount = 0, nCount = 0;
            const phi = Math.PI * (3 - Math.sqrt(5)); 
            
            for (let i = 0; i < total; i++) {
                let type = 'n';
                if (pCount < protons && (nCount >= neutrons || Math.random() > 0.5)) {
                    type = 'p'; pCount++;
                } else { nCount++; }
                
                const r = 12 * Math.sqrt(i); 
                const theta = i * phi;
                newParticles.push({
                    id: i, type: type,
                    targetX: r * Math.cos(theta),
                    targetY: r * Math.sin(theta),
                    x: Math.random() * 40 - 20,
                    y: Math.random() * 40 - 20
                });
            }
            setParticles(newParticles);
        }, [protons, neutrons]);

        // --- 繪圖功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = 400, h = 400, cx = w / 2, cy = h / 2;
            ctx.clearRect(0, 0, w, h);
            
            // 電子雲視覺暗示
            const cloudRadius = 60 + (protons * 10);
            const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, cloudRadius);
            grad.addColorStop(0, 'rgba(59, 130, 246, 0.0)');
            grad.addColorStop(0.5, 'rgba(59, 130, 246, 0.05)');
            grad.addColorStop(1, 'rgba(59, 130, 246, 0.0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, cloudRadius, 0, Math.PI*2); ctx.fill();

            // 繪製核子
            particles.forEach(p => {
                p.x += (p.targetX - p.x) * 0.12;
                p.y += (p.targetY - p.y) * 0.12;
                const sx = cx + p.x, sy = cy + p.y;
                
                ctx.beginPath(); ctx.arc(sx, sy, 10, 0, Math.PI*2);
                const pGrad = ctx.createRadialGradient(sx - 3, sy - 3, 2, sx, sy, 10);
                if (p.type === 'p') {
                    pGrad.addColorStop(0, '#f87171'); pGrad.addColorStop(1, '#dc2626');
                } else {
                    pGrad.addColorStop(0, '#9ca3af'); pGrad.addColorStop(1, '#4b5563');
                }
                ctx.fillStyle = pGrad; ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();
                
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'p' ? '+' : '', sx, sy + 1);
            });
            requestAnimationFrame(draw);
        };

        useEffect(() => {
            const anim = requestAnimationFrame(draw);
            return () => cancelAnimationFrame(anim);
        }, [particles]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        const renderNuclideChart = () => {
            const grid = [];
            for (let z = 10; z >= 0; z--) {
                const row = [];
                for (let n = 0; n <= 12; n++) {
                    const key = `${z}-${n}`;
                    const stable = STABILITY_MAP[key];
                    let color = 'bg-slate-800';
                    if (stable === true) color = 'bg-emerald-500';
                    else if (stable === false) color = 'bg-amber-500';
                    const isCurrent = z === protons && n === neutrons;
                    const border = isCurrent ? 'border-2 border-white ring-2 ring-indigo-500 z-10 scale-125' : 'border border-slate-700/50 hover:bg-slate-700';
                    row.push(<div key={key} onClick={()=>{setProtons(z); setNeutrons(n);}} className={`w-5 h-5 rounded-sm cursor-pointer transition-transform ${color} ${border}`} title={`Z=${z}, N=${n}`}></div>);
                }
                grid.push(<div key={z} className="flex gap-1">{row}</div>);
            }
            return grid;
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400"><i data-lucide="atom"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">同位素構建實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Atomic Structure</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    <div className="lg:col-span-7 flex flex-col gap-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h3 className="text-white font-bold flex items-center gap-2 text-sm uppercase tracking-widest mb-6 border-b border-slate-700 pb-4">
                                <i data-lucide="grid" className="text-indigo-400"></i> 核素圖 (Z-N 穩定帶模擬)
                            </h3>
                            <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 overflow-x-auto flex flex-col items-center shadow-inner relative">
                                <div className="absolute left-4 top-1/2 -rotate-90 text-[9px] font-bold text-slate-600 uppercase tracking-widest">質子數 (Z) &rarr;</div>
                                <div className="absolute bottom-2 left-1/2 -translate-x-1/2 text-[9px] font-bold text-slate-600 uppercase tracking-widest">中子數 (N) &rarr;</div>
                                <div className="flex flex-col gap-1">{renderNuclideChart()}</div>
                                <div className="flex gap-6 mt-8 text-[10px] font-bold uppercase tracking-widest">
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 bg-emerald-500 rounded-sm"></div> 穩定</div>
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 bg-amber-500 rounded-sm"></div> 放射性</div>
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 bg-slate-800 rounded-sm"></div> 暫無數據</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-800 pb-4"><i data-lucide="plus-circle" className="text-indigo-400"></i> 原子核成分調節</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                <div className="space-y-4">
                                    <div className="flex justify-between items-end"><label className="text-xs font-bold text-red-400 uppercase tracking-widest">質子數 (Z)</label><span className="text-2xl font-black text-white font-mono">{protons}</span></div>
                                    <div className="flex items-center gap-4 bg-slate-900 p-1 rounded-xl border border-slate-700">
                                        <button onClick={() => setProtons(Math.max(1, protons-1))} className="flex-1 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-all"><i data-lucide="minus" className="mx-auto w-4 h-4"></i></button>
                                        <button onClick={() => setProtons(Math.min(10, protons+1))} className="flex-1 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-all"><i data-lucide="plus" className="mx-auto w-4 h-4"></i></button>
                                    </div>
                                    <p className="text-[10px] text-slate-500 italic">* 決定元素的身份 (化學性質)</p>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-end"><label className="text-xs font-bold text-slate-300 uppercase tracking-widest">中子數 (N)</label><span className="text-2xl font-black text-white font-mono">{neutrons}</span></div>
                                    <div className="flex items-center gap-4 bg-slate-900 p-1 rounded-xl border border-slate-700">
                                        <button onClick={() => setNeutrons(Math.max(0, neutrons-1))} className="flex-1 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-all"><i data-lucide="minus" className="mx-auto w-4 h-4"></i></button>
                                        <button onClick={() => setNeutrons(Math.min(12, neutrons+1))} className="flex-1 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-all"><i data-lucide="plus" className="mx-auto w-4 h-4"></i></button>
                                    </div>
                                    <p className="text-[10px] text-slate-500 italic">* 決定同位素的重量與穩定性</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-5 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative aspect-square flex items-center justify-center">
                            <canvas ref={canvasRef} width={400} height={400} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 flex flex-col gap-3">
                                <div className="flex items-center gap-3 bg-slate-900/90 px-4 py-2 rounded-2xl border border-slate-700 backdrop-blur-md shadow-lg">
                                    <div className="w-3 h-3 rounded-full bg-red-600 shadow-[0_0_8px_red]"></div>
                                    <span className="text-[10px] font-bold text-slate-300 uppercase tracking-widest">質子 (+1)</span>
                                </div>
                                <div className="flex items-center gap-3 bg-slate-900/90 px-4 py-2 rounded-2xl border border-slate-700 backdrop-blur-md shadow-lg">
                                    <div className="w-3 h-3 rounded-full bg-slate-500"></div>
                                    <span className="text-[10px] font-bold text-slate-300 uppercase tracking-widest">中子 (0)</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl relative overflow-hidden flex-1">
                            <div className="absolute -top-6 -right-6 text-[10rem] font-bold font-serif opacity-5 select-none text-white leading-none">{element.sym}</div>
                            <div className="flex flex-col h-full justify-between">
                                <div className="flex items-center gap-6 mb-8">
                                    <div className="bg-white text-slate-950 w-24 h-24 rounded-2xl flex flex-col items-center justify-center shadow-2xl relative border-4 border-slate-200">
                                        <span className="absolute top-2 left-2.5 text-[11px] font-black">{massNumber}</span>
                                        <span className="absolute bottom-2 left-2.5 text-[11px] font-black">{protons}</span>
                                        <span className="text-5xl font-black font-serif">{element.sym}</span>
                                    </div>
                                    <div className="space-y-1">
                                        <h2 className="text-3xl font-black text-white tracking-tight">{element.name}-{massNumber}</h2>
                                        <div className={`inline-flex items-center gap-2 px-4 py-1 rounded-full text-xs font-black border uppercase tracking-wider ${stabilityColor}`}>
                                            <i data-lucide={isStable === true ? "check-circle" : "radio"}></i> {stabilityText}
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 font-mono">
                                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-700 shadow-inner">
                                        <div className="text-[9px] text-slate-500 font-bold uppercase mb-1">質量數 (A)</div>
                                        <div className="text-2xl font-black text-white">{massNumber}</div>
                                    </div>
                                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-700 shadow-inner">
                                        <div className="text-[9px] text-slate-500 font-bold uppercase mb-1">原子序 (Z)</div>
                                        <div className="text-2xl font-black text-red-400">{protons}</div>
                                    </div>
                                </div>
                                <div className="mt-6 bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-2xl shadow-inner">
                                    <h4 className="text-indigo-300 font-bold text-xs uppercase mb-2 flex items-center gap-2"><i data-lucide="lightbulb" className="w-3 h-3"></i> 物理考點</h4>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                        同位素擁有相同的<b>質子數</b>但不同的<b>中子數</b>。在穩定帶之外的核素通常會透過 α 或 β 衰變來尋找更穩定的比例。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
