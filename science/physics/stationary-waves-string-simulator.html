<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駐波實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .thumb-purple::-webkit-slider-thumb { border-color: #a855f7; }
        .thumb-pink::-webkit-slider-thumb { border-color: #ec4899; }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 400;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const STRING_LENGTH = 700; // 像素
    const STRING_START_X = 50;

    const App = () => {
        // --- 狀態 ---
        const [frequency, setFrequency] = useState(10); // Hz
        const [tension, setTension] = useState(50); // 牛頓
        const [density, setDensity] = useState(0.01); // kg/m
        
        const [waveSpeed, setWaveSpeed] = useState(0);
        const [wavelength, setWavelength] = useState(0);
        const [harmonicN, setHarmonicN] = useState(0);
        const [amplitudeDisplay, setAmplitudeDisplay] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const timeRef = useRef(0);
        
        const physicsRef = useRef({
            currentAmp: 0,
            targetAmp: 0
        });

        // --- 物理邏輯 ---
        useEffect(() => {
            // 波速 v = sqrt(T / mu)
            const v = Math.sqrt(tension / density);
            const lambda = v / frequency;

            setWaveSpeed(v);
            setWavelength(lambda);

            // 諧振計算
            // 假設弦線長度 L = 2.0 公尺
            const L = 2.0; 
            const f1 = v / (2 * L); // 基本頻率
            
            const n_float = frequency / f1;
            const n_nearest = Math.round(n_float);
            const deviation = Math.abs(n_float - n_nearest);
            
            const windowWidth = 0.25; 
            let resonanceFactor = 0;
            const baseAmp = 6; // 基礎強迫振動幅度

            if (deviation < windowWidth) {
                // 鐘形曲線諧振模擬
                resonanceFactor = Math.exp(-(deviation * deviation) / (2 * (windowWidth/3)**2));
            }

            physicsRef.current.targetAmp = (resonanceFactor * 85) + baseAmp; 
            
            if (resonanceFactor > 0.55 && n_nearest > 0) {
                setHarmonicN(n_nearest);
            } else {
                setHarmonicN(0); 
            }

        }, [frequency, tension, density]);

        // --- 動畫循環 ---
        const loop = (time) => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            
            // 調整時間步長以適應高頻視覺效果
            const visualFreqScale = Math.max(1, frequency / 12); 
            timeRef.current += 0.05 * visualFreqScale; 
            const t = timeRef.current;
            
            const phys = physicsRef.current;
            phys.currentAmp += (phys.targetAmp - phys.currentAmp) * 0.1;
            
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製支架與裝置
            ctx.fillStyle = '#334155';
            ctx.fillRect(STRING_START_X - 10, CENTER_Y - 25, 10, 50); 
            ctx.fillRect(STRING_START_X + STRING_LENGTH, CENTER_Y - 25, 10, 50); 
            
            // 滑輪
            ctx.beginPath();
            ctx.arc(STRING_START_X + STRING_LENGTH + 15, CENTER_Y - 15, 15, 0, Math.PI*2);
            ctx.fillStyle = '#475569'; ctx.fill();
            ctx.strokeStyle = '#94a3b8'; ctx.stroke();

            // 懸掛砝碼
            const weightY = CENTER_Y + 60 + (tension / 150) * 80;
            ctx.beginPath();
            ctx.moveTo(STRING_START_X + STRING_LENGTH + 30, CENTER_Y - 15);
            ctx.lineTo(STRING_START_X + STRING_LENGTH + 30, weightY);
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
            
            ctx.fillStyle = '#f59e0b';
            ctx.roundRect(STRING_START_X + STRING_LENGTH + 15, weightY, 30, 35, 4);
            ctx.fill();
            ctx.fillStyle = '#78350f'; ctx.font = 'bold 10px Inter';
            ctx.fillText(`${tension}N`, STRING_START_X + STRING_LENGTH + 20, weightY + 22);

            // 2. 繪製弦線
            const L_px = STRING_LENGTH;
            const v = Math.sqrt(tension / density);
            const k = (2 * Math.PI * frequency) / v;
            
            const hue = phys.currentAmp > 35 ? 280 : 210; // 諧振時變紫
            ctx.strokeStyle = `hsl(${hue}, 75%, 65%)`;
            ctx.lineWidth = 3;
            
            // 繪製波包外絡線 (視覺殘留效果)
            if (phys.currentAmp > 15) {
                ctx.fillStyle = `hsla(${hue}, 70%, 60%, 0.15)`;
                ctx.beginPath();
                ctx.moveTo(STRING_START_X, CENTER_Y);
                for (let i = 0; i <= L_px; i+=2) {
                    const x_m = (i / L_px) * 2.0; 
                    const y = CENTER_Y + Math.abs(Math.sin(k * x_m)) * phys.currentAmp; 
                    ctx.lineTo(STRING_START_X + i, y);
                }
                for (let i = L_px; i >= 0; i-=2) {
                    const x_m = (i / L_px) * 2.0; 
                    const y = CENTER_Y - Math.abs(Math.sin(k * x_m)) * phys.currentAmp; 
                    ctx.lineTo(STRING_START_X + i, y);
                }
                ctx.fill();
            }

            // 繪製振動弦線本體
            ctx.beginPath();
            for (let i = 0; i <= L_px; i+=1) {
                const x_m = (i / L_px) * 2.0;
                const spatial = Math.sin(k * x_m);
                const temporal = Math.cos(t); 
                const y = CENTER_Y + spatial * temporal * phys.currentAmp;
                if (i === 0) ctx.moveTo(STRING_START_X + i, y);
                else ctx.lineTo(STRING_START_X + i, y);
            }
            ctx.stroke();

            // 3. 標註節點 (Nodes)
            if (harmonicN > 0 && phys.currentAmp > 35) {
                ctx.fillStyle = '#ef4444';
                for (let n = 0; n <= harmonicN; n++) {
                    const nx = (n / harmonicN) * L_px;
                    ctx.beginPath();
                    ctx.arc(STRING_START_X + nx, CENTER_Y, 5, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();
                }
            }
            
            if (Math.random() < 0.1) setAmplitudeDisplay(phys.currentAmp);
            requestRef.current = requestAnimationFrame(loop);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [frequency, tension, density, harmonicN]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-500/20 p-2 rounded-lg text-purple-400"><i data-lucide="activity"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">駐波實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Wave Physics</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-12">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[420px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            
                            {harmonicN > 0 && amplitudeDisplay > 35 && (
                                <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-emerald-600/90 border border-emerald-400 text-white px-8 py-3 rounded-full shadow-[0_0_25px_rgba(16,185,129,0.5)] font-black animate-pulse flex items-center gap-3">
                                    <i data-lucide="award"></i>
                                    {harmonicN === 1 ? '第 1 諧音 (基頻)' : `第 ${harmonicN} 諧音`}
                                </div>
                            )}

                            <div className="absolute bottom-6 right-6 w-56 bg-slate-900/90 p-4 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-md">
                                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">諧振強度 (Resonance)</div>
                                <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                                    <div className={`h-full transition-all duration-300 ${amplitudeDisplay > 55 ? 'bg-purple-500' : 'bg-blue-500'}`} style={{width: `${Math.min(100, (amplitudeDisplay/90)*100)}%`}}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="sliders" className="text-purple-400"></i> 弦線物理參數調節</h2>
                            <div className="space-y-8">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-purple-400 uppercase tracking-widest mb-3"><span>波源頻率 (f)</span><span className="text-white font-mono">{frequency.toFixed(1)} Hz</span></label>
                                    <input type="range" min="1" max="100" step="0.5" value={frequency} onChange={(e)=>setFrequency(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-purple" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-pink-400 uppercase tracking-widest mb-3"><span>弦線張力 (T)</span><span className="text-white font-mono">{tension} N</span></label>
                                    <input type="range" min="10" max="200" step="5" value={tension} onChange={(e)=>setTension(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-pink" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><span>線密度 (μ)</span><span className="text-white font-mono">{density.toFixed(3)} kg/m</span></label>
                                    <input type="range" min="0.005" max="0.05" step="0.005" value={density} onChange={(e)=>setDensity(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                </div>
                            </div>
                            <button onClick={()=>{setFrequency(10); setTension(50); setDensity(0.01);}} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all flex items-center justify-center gap-2 active:scale-95"><i data-lucide="rotate-ccw"></i> 重設實驗</button>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="calculator" className="text-indigo-400"></i> 即時數據計算</h2>
                            <div className="space-y-4 font-mono">
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 flex justify-between items-center shadow-inner">
                                    <span className="text-[10px] text-slate-500 font-bold uppercase">波速 (v)</span>
                                    <span className="text-white text-xl font-bold">{waveSpeed.toFixed(1)} <span className="text-xs text-slate-600">m/s</span></span>
                                </div>
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 flex justify-between items-center shadow-inner">
                                    <span className="text-[10px] text-slate-500 font-bold uppercase">波長 (λ)</span>
                                    <span className="text-white text-xl font-bold">{wavelength.toFixed(2)} <span className="text-xs text-slate-600">m</span></span>
                                </div>
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 flex justify-between items-center shadow-inner transition-all border-l-4 border-l-emerald-500">
                                    <span className="text-[10px] text-slate-500 font-bold uppercase">波腹數量 (n)</span>
                                    <span className={`text-2xl font-black ${harmonicN > 0 ? 'text-emerald-400' : 'text-slate-700'}`}>{harmonicN > 0 ? harmonicN : "--"}</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 如何尋找諧音？</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                慢慢滑動<b>頻率滑桿</b>。當頻率符合特定條件時，弦線會發生強烈振動，這就是<b>諧振</b>。觀察波腹的數量，那就是第幾諧音。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
