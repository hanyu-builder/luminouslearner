<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恆星視差實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const VIEW_1_WIDTH = CANVAS_WIDTH * 0.55; 

    const App = () => {
        const [starDistance, setStarDistance] = useState(150); 
        const [isPaused, setIsPaused] = useState(false);
        const [showLines, setShowLines] = useState(true);
        const [month, setMonth] = useState("一月");
        const [parallaxAngle, setParallaxAngle] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const simRef = useRef({ earthAngle: 0, speed: 0.005 });

        const loop = () => {
            if (!isPaused) simRef.current.earthAngle += simRef.current.speed;
            
            const deg = (simRef.current.earthAngle % (2 * Math.PI)) * (180 / Math.PI);
            const monthIndex = Math.floor((deg / 360) * 12);
            const months = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
            setMonth(months[monthIndex] || "一月");

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 1. 左側面板：太陽系俯視圖 ---
            const sunX = VIEW_1_WIDTH / 2, sunY = CANVAS_HEIGHT - 120, orbitR = 90;
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(VIEW_1_WIDTH, 0); ctx.lineTo(VIEW_1_WIDTH, CANVAS_HEIGHT); ctx.stroke();
            drawStars(ctx, 0, 0, VIEW_1_WIDTH, CANVAS_HEIGHT - 150);

            // 太陽
            ctx.fillStyle = '#f59e0b'; ctx.shadowBlur = 20; ctx.shadowColor = '#f59e0b';
            ctx.beginPath(); ctx.arc(sunX, sunY, 22, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

            // 地球軌道與地球
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(sunX, sunY, orbitR, 0, Math.PI*2); ctx.stroke();
            const ex = sunX + Math.cos(simRef.current.earthAngle - Math.PI/2) * orbitR;
            const ey = sunY + Math.sin(simRef.current.earthAngle - Math.PI/2) * orbitR;
            ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(ex, ey, 9, 0, Math.PI*2); ctx.fill();

            // 目標恆星
            const starX = sunX, starY = sunY - 180 - starDistance;
            ctx.fillStyle = '#f43f5e'; ctx.shadowBlur = 15; ctx.shadowColor = '#f43f5e';
            ctx.beginPath(); drawStarShape(ctx, starX, starY, 5, 9, 4); ctx.fill(); ctx.shadowBlur = 0;

            if (showLines) {
                ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)'; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(starX, starY);
                const bgY = 40, slope = (starY - ey) / (starX - ex);
                let bgX = starX; if (Math.abs(starX - ex) > 0.1) bgX = (bgY - (ey - slope * ex)) / slope;
                ctx.lineTo(bgX, bgY); ctx.stroke(); ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.moveTo(40, bgY); ctx.lineTo(VIEW_1_WIDTH-40, bgY); ctx.stroke();
                ctx.fillStyle = '#64748b'; ctx.font = "10px Inter"; ctx.fillText("遙遠背景恆星", 40, bgY - 10);
            }

            // --- 2. 右側面板：望遠鏡視角 ---
            const view2W = CANVAS_WIDTH - VIEW_1_WIDTH, c2X = VIEW_1_WIDTH + view2W / 2, c2Y = CANVAS_HEIGHT / 2;
            ctx.save();
            ctx.beginPath(); ctx.arc(c2X, c2Y, 180, 0, Math.PI*2); ctx.clip();
            ctx.fillStyle = '#0f172a'; ctx.fillRect(VIEW_1_WIDTH, 0, view2W, CANVAS_HEIGHT);
            drawStars(ctx, VIEW_1_WIDTH, 0, view2W, CANVAS_HEIGHT);

            const baseline = ex - sunX, shiftF = 8000 / (starDistance + 150);
            const appX = c2X - (baseline * shiftF / 80) * 15;
            ctx.fillStyle = '#f43f5e'; ctx.shadowBlur = 20; ctx.shadowColor = '#f43f5e';
            ctx.beginPath(); drawStarShape(ctx, appX, c2Y, 5, 14, 7); ctx.fill(); ctx.shadowBlur = 0;
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(c2X, c2Y-180); ctx.lineTo(c2X, c2Y+180); ctx.moveTo(c2X-180, c2Y); ctx.lineTo(c2X+180, c2Y); ctx.stroke();
            ctx.restore();

            ctx.fillStyle = '#94a3b8'; ctx.font = "bold 14px Inter";
            ctx.fillText("1. 軌道幾何俯視圖", 30, 40);
            ctx.fillText("2. 望遠鏡實時觀測視角", VIEW_1_WIDTH + 30, 40);

            setParallaxAngle(1000 / (starDistance + 50));
        };

        const drawStarShape = (ctx, cx, cy, spikes, outerR, innerR) => {
            let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
            ctx.moveTo(cx, cy - outerR);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerR; y = cy + Math.sin(rot) * outerR; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot) * innerR; y = cy + Math.sin(rot) * innerR; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerR); ctx.closePath();
        };

        const stars = useRef(Array.from({length: 80}, () => ({x: Math.random(), y: Math.random(), s: Math.random() * 2})));
        const drawStars = (ctx, sx, sy, w, h) => {
            ctx.fillStyle = '#fff';
            stars.current.forEach(s => {
                ctx.globalAlpha = 0.3 + Math.random() * 0.4;
                ctx.beginPath(); ctx.arc(sx + s.x * w, sy + s.y * h, s.s, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [isPaused, starDistance, showLines]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col">
                <nav className="bg-slate-800 border-b border-slate-700 px-4 py-2 flex items-center justify-between shrink-0 h-14">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-1.5 rounded-lg text-indigo-400">
                            <i data-lucide="telescope"></i>
                        </div>
                        <h1 className="text-lg font-bold text-white tracking-wide">恆星視差實驗室</h1>
                    </div>
                    <div className="text-[10px] text-slate-400 font-mono bg-slate-950 px-2 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Astrophysics</div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-4">
                        <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-700">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                        </div>

                        <div className="lg:col-span-1 bg-slate-900 border-l border-slate-800 flex flex-col h-full overflow-y-auto custom-scroll p-6 space-y-8">
                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">實時數據回傳</h3>
                                <div className="grid grid-cols-2 gap-3 font-mono">
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                        <div className="text-[9px] text-slate-500 mb-1">月份</div>
                                        <div className="text-white font-bold">{month}</div>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                        <div className="text-[9px] text-slate-500 mb-1">視差角 (p)</div>
                                        <div className="text-emerald-400 font-bold">{parallaxAngle.toFixed(2)}"</div>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">環境參數調節</h3>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-indigo-300 mb-3">恆星距離 <span>{((starDistance + 50) / 12).toFixed(1)} pc</span></label>
                                    <input type="range" min="0" max="300" step="1" value={starDistance} onChange={(e) => setStarDistance(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase"><span>最近</span><span>最遠</span></div>
                                </div>
                                <button onClick={() => setIsPaused(!isPaused)} className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all ${isPaused ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`}>
                                    <i data-lucide={isPaused ? "play" : "pause"}></i> {isPaused ? "恢復公轉" : "暫停公轉"}
                                </button>
                                <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-800 cursor-pointer hover:bg-slate-800 transition-colors">
                                    <span className="text-xs font-bold text-slate-400 uppercase">顯示觀測視線</span>
                                    <input type="checkbox" checked={showLines} onChange={() => setShowLines(!showLines)} className="w-5 h-5 rounded border-slate-600 text-indigo-500 focus:ring-0 cursor-pointer" />
                                </label>
                            </div>

                            <div className="bg-indigo-900/20 border border-indigo-500/20 p-5 rounded-3xl shadow-inner">
                                <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 觀察要點</h3>
                                <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                    當你增加恆星距離時，請觀察右側望遠鏡中的「紅星」晃動幅度。距離越遠，視差角越小，這正是 $d = 1/p$ 公式在天文觀測上的直觀體現。
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
