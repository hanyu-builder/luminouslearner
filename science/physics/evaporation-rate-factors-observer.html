<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蒸發速率因素觀察器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #ffffff;
        }
        canvas { touch-action: none; border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 400;
    const WATER_LEVEL = 300; 

    const App = () => {
        const [temperature, setTemperature] = useState(30); 
        const [surfaceArea, setSurfaceArea] = useState(50); 
        const [humidity, setHumidity] = useState(40); 
        const [evapRate, setEvapRate] = useState(0); 
        
        const canvasRef = useRef(null);
        const requestRef = useRef();
        const simState = useRef({
            particles: [],
            airParticles: [],
            escapedCount: 0,
            lastRateCheck: 0,
            waterWidth: 300
        });

        const createWaterParticle = (reset = false) => {
            const width = simState.current.waterWidth;
            const centerX = CANVAS_WIDTH / 2;
            const startX = centerX - width / 2;
            
            return {
                x: startX + Math.random() * width,
                y: reset ? WATER_LEVEL + Math.random() * (CANVAS_HEIGHT - WATER_LEVEL) : CANVAS_HEIGHT - 5,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2,
                state: 'liquid',
                energy: Math.random() 
            };
        };

        const updatePhysics = (time) => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const state = simState.current;

            const targetWidth = 100 + (surfaceArea / 100) * 450; 
            state.waterWidth = targetWidth;
            const targetParticleCount = Math.floor(150 + (surfaceArea / 100) * 400);

            if (state.particles.length < targetParticleCount) {
                for(let i=0; i < 5; i++) {
                    if(state.particles.length < targetParticleCount) state.particles.push(createWaterParticle(true));
                }
            } else if (state.particles.length > targetParticleCount) {
                 state.particles.splice(0, state.particles.length - targetParticleCount);
            }

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 繪製背景環境
            const centerX = CANVAS_WIDTH / 2;
            const halfWidth = state.waterWidth / 2;
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(centerX - halfWidth, WATER_LEVEL - 20);
            ctx.lineTo(centerX - halfWidth, CANVAS_HEIGHT);
            ctx.lineTo(centerX + halfWidth, CANVAS_HEIGHT);
            ctx.lineTo(centerX + halfWidth, WATER_LEVEL - 20);
            ctx.stroke();
            ctx.fillStyle = 'rgba(30, 64, 175, 0.15)';
            ctx.fillRect(centerX - halfWidth, WATER_LEVEL, state.waterWidth, CANVAS_HEIGHT - WATER_LEVEL);

            // 濕度粒子 (空氣中的水分子阻礙)
            const targetAirParticles = Math.floor((humidity / 100) * 120);
            if (state.airParticles.length < targetAirParticles) {
                state.airParticles.push({
                    x: Math.random() * CANVAS_WIDTH, y: Math.random() * WATER_LEVEL,
                    vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6
                });
            } else if (state.airParticles.length > targetAirParticles) {
                state.airParticles.pop();
            }

            ctx.fillStyle = 'rgba(148, 163, 184, 0.2)';
            state.airParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > CANVAS_WIDTH) p.vx *= -1;
                if(p.y < 0 || p.y > WATER_LEVEL) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            });

            // 太陽熱源視覺
            const sunColor = temperature > 75 ? '#ef4444' : '#fbbf24';
            const sunGrad = ctx.createRadialGradient(CANVAS_WIDTH-60, 60, 5, CANVAS_WIDTH-60, 60, 70);
            sunGrad.addColorStop(0, sunColor); sunGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = sunGrad; ctx.globalAlpha = 0.3 + (temperature/200);
            ctx.beginPath(); ctx.arc(CANVAS_WIDTH-60, 60, 70, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;

            // 水分子邏輯
            const speedFactor = 0.3 + (temperature / 100) * 2.5; 
            const escapeThreshold = 1.15 - (temperature / 140);

            state.particles.forEach(p => {
                const left = centerX - halfWidth;
                const right = centerX + halfWidth;

                if (p.state === 'liquid') {
                    p.x += p.vx * speedFactor;
                    p.y += p.vy * speedFactor;

                    if (p.x < left) { p.x = left; p.vx *= -1; }
                    if (p.x > right) { p.x = right; p.vx *= -1; }
                    if (p.y > CANVAS_HEIGHT) { p.y = CANVAS_HEIGHT; p.vy *= -1; }
                    
                    if (p.y < WATER_LEVEL) {
                        const humidityBlock = (humidity / 100) * 0.85; 
                        if (p.energy * speedFactor > escapeThreshold && Math.random() > humidityBlock) {
                            p.state = 'gas';
                            state.escapedCount++;
                        } else {
                            p.y = WATER_LEVEL; p.vy *= -1;
                        }
                    }
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                } else {
                    p.x += p.vx * speedFactor;
                    p.y += p.vy * speedFactor - 0.6; // 蒸氣上升
                    const opacity = Math.max(0, 1 - (WATER_LEVEL - p.y) / 250);
                    ctx.fillStyle = `rgba(147, 197, 253, ${opacity})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();

                    if (p.y < -10 || p.x < -20 || p.x > CANVAS_WIDTH + 20) {
                         const newP = createWaterParticle();
                         Object.assign(p, newP);
                    }
                }
            });

            if (time - state.lastRateCheck > 1000) {
                setEvapRate(state.escapedCount);
                state.escapedCount = 0;
                state.lastRateCheck = time;
            }

            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(updatePhysics);
            return () => cancelAnimationFrame(requestRef.current);
        }, [temperature, surfaceArea, humidity]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                            <i data-lucide="droplets"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">蒸發速率因素觀察器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Thermal Physics
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8 mt-4">
                    <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 h-fit space-y-8 shadow-xl">
                        <h2 className="text-blue-400 font-bold flex items-center gap-2 text-lg">
                            <i data-lucide="sliders" className="w-5 h-5"></i> 影響變因控制
                        </h2>

                        <div>
                            <label className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-3">
                                <span>表面積 (Surface Area)</span>
                                <span className="text-blue-400 font-mono">{surfaceArea}%</span>
                            </label>
                            <input type="range" min="10" max="100" value={surfaceArea} onChange={(e) => setSurfaceArea(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold italic"><span>試管</span><span>碗狀</span><span>淺盤</span></div>
                        </div>

                        <div>
                            <label className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-3">
                                <span>溫度 (Temperature)</span>
                                <span className={temperature > 70 ? 'text-red-400 font-mono' : 'text-orange-400 font-mono'}>{temperature}°C</span>
                            </label>
                            <input type="range" min="5" max="100" value={temperature} onChange={(e) => setTemperature(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                        </div>

                        <div>
                            <label className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-3">
                                <span>空氣濕度 (Humidity)</span>
                                <span className="text-slate-200 font-mono">{humidity}%</span>
                            </label>
                            <input type="range" min="0" max="100" value={humidity} onChange={(e) => setHumidity(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold italic"><span>乾燥</span><span>中等</span><span>潮濕</span></div>
                        </div>

                        <div className="pt-6 border-t border-slate-700">
                            <div className="text-[10px] text-slate-500 font-bold uppercase mb-2 tracking-widest text-center">實時蒸發率 (Evaporation Rate)</div>
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-700 flex flex-col items-center shadow-inner">
                                <div className="text-4xl font-black text-white font-mono">{evapRate}</div>
                                <div className="text-[10px] text-blue-400 font-bold uppercase mt-1">分子 / 秒</div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-2 space-y-6">
                        <div className="bg-black rounded-3xl border border-slate-700 overflow-hidden relative shadow-2xl h-[450px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-cover bg-slate-950" />
                            <div className="absolute top-6 left-6 flex gap-3 pointer-events-none">
                                <div className="flex items-center bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 shadow-lg">
                                    <div className="w-2 h-2 rounded-full bg-blue-500 mr-2 shadow-[0_0_8px_#3b82f6]"></div>
                                    <span className="text-[10px] font-bold text-slate-300 uppercase">液態水分</span>
                                </div>
                                <div className="flex items-center bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 shadow-lg">
                                    <div className="w-2 h-2 rounded-full bg-gray-400 mr-2"></div>
                                    <span className="text-[10px] font-bold text-slate-300 uppercase">氣態水蒸氣</span>
                                </div>
                            </div>
                            <div className="absolute bottom-6 right-6 text-right opacity-40">
                                <i data-lucide="wind" className="text-white w-12 h-12"></i>
                            </div>
                        </div>
                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-2xl">
                             <p className="text-xs text-slate-400 leading-relaxed italic text-center">
                                分子動力學提示：提高溫度會增加分子的平均動能，使更多分子擁有足夠的能量克服表面引力。
                             </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
