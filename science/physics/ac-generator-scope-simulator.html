<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交流發電機實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-indigo::-webkit-slider-thumb { background: #6366f1; }
        .thumb-rose::-webkit-slider-thumb { background: #f43f5e; }
        .grid-bg {
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px),
                              linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [speed, setSpeed] = useState(1.0); // 角速度係數
        const [fieldStrength, setFieldStrength] = useState(1.0); // 磁場 B
        const [area, setArea] = useState(1.0); // 線圈面積 A
        
        const [isRunning, setIsRunning] = useState(false);
        const [showField, setShowField] = useState(true);
        
        // 即時數據
        const [voltage, setVoltage] = useState(0);
        const [angleDeg, setAngleDeg] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const lastTimeRef = useRef(0);
        
        // 物理 Ref 存儲 (避免閉包問題)
        const physicsRef = useRef({
            angle: 0,
            history: [] // 儲存電壓歷史紀錄
        });
        
        const paramsRef = useRef({ speed, fieldStrength, area });

        // 同步參數至 Ref
        useEffect(() => {
            paramsRef.current = { speed, fieldStrength, area };
        }, [speed, fieldStrength, area]);

        // --- 邏輯 ---
        const startSim = () => {
            if (isRunning) return;
            setIsRunning(true);
            lastTimeRef.current = performance.now();
            requestRef.current = requestAnimationFrame(loop);
        };

        const stopSim = () => {
            setIsRunning(false);
            cancelAnimationFrame(requestRef.current);
        };

        const resetSim = () => {
            stopSim();
            physicsRef.current = { angle: 0, history: [] };
            setVoltage(0);
            setAngleDeg(0);
            // 強制重繪
            setTimeout(() => draw(), 50);
        };

        const loop = (timestamp) => {
            const dt = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;
            
            const state = physicsRef.current;
            const p = paramsRef.current;

            // 物理原理：E = NBAw sin(wt)
            // 更新角度
            state.angle += p.speed * 2.0 * dt; 
            
            // 計算瞬時感應電動勢 (EMF)
            // 磁通量 Phi = B A cos(theta).
            // EMF = -dPhi/dt = B A w sin(theta).
            const currentV = p.fieldStrength * p.area * p.speed * Math.sin(state.angle) * 5; // 乘以 5 以利視覺觀察
            
            // 紀錄歷史紀錄
            state.history.push(currentV);
            if (state.history.length > 200) state.history.shift(); // 保持最後 200 幀

            // 同步 UI 顯示
            setVoltage(currentV);
            setAngleDeg((state.angle * 180 / Math.PI) % 360);
            
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 3D 投影輔助 (若原始結構有用到) ---
        const project = (x, y, z) => {
            const scale = 300 / (300 + z);
            return {
                x: 200 + x * scale, // 中心移至左側 (200)
                y: CENTER_Y + y * scale,
                scale: scale
            };
        };

        // --- 繪圖功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const state = physicsRef.current;
            const theta = state.angle;
            
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 1. 繪製發電機 (左側) ---
            
            // 磁場線
            if (showField) {
                const grad = ctx.createLinearGradient(50, 0, 350, 0);
                grad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                grad.addColorStop(0.2, 'rgba(56, 189, 248, 0.2)');
                grad.addColorStop(0.8, 'rgba(56, 189, 248, 0.2)');
                grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                
                ctx.fillStyle = grad;
                ctx.fillRect(50, 100, 300, 250);
                
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
                ctx.lineWidth = 1;
                for (let y = 120; y < 350; y+=30) {
                    ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(350, y); ctx.stroke();
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.beginPath(); ctx.moveTo(200, y); ctx.lineTo(195, y-3); ctx.lineTo(195, y+3); ctx.fill();
                }
                ctx.font = "bold 20px sans-serif";
                ctx.fillStyle = "#38bdf8";
                ctx.fillText("B", 200, 90);
            }

            // 磁鐵
            const magW = 60, magH = 200;
            // N 極 (左)
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(50 - magW, CENTER_Y - magH/2, magW, magH);
            ctx.fillStyle = 'white'; ctx.fillText("N", 50 - 30, CENTER_Y);
            // S 極 (右)
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(350, CENTER_Y - magH/2, magW, magH);
            ctx.fillStyle = 'white'; ctx.fillText("S", 350 + 20, CENTER_Y);

            // 線圈
            const coilW = 160 * paramsRef.current.area; 
            const coilH = 100;
            const r = coilH / 2;
            const halfW = coilW / 2;
            
            ctx.save();
            ctx.translate(200, CENTER_Y); 
            
            // 繪製軸
            ctx.fillStyle = '#64748b';
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
            
            // 旋轉線圈
            ctx.rotate(theta);
            
            // 線圈框
            ctx.strokeStyle = '#f59e0b'; // 琥珀色電線
            ctx.lineWidth = 6;
            ctx.lineJoin = 'round';
            ctx.strokeRect(-halfW, -r, coilW, coilH);
            
            // 電流方向箭頭 (運動時顯示)
            if (Math.abs(voltage) > 0.1) {
                const dir = voltage > 0 ? 1 : -1;
                ctx.fillStyle = '#fff';
                // 頂部電線箭頭
                drawArrowHead(ctx, 0, -r, dir * 10, 0);
                // 底部電線箭頭
                drawArrowHead(ctx, 0, r, -dir * 10, 0);
            }
            
            ctx.restore();

            // 連接至示波器的電路
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(200, CENTER_Y); // 中心軸
            ctx.lineTo(200, CENTER_Y + 150); // 向下
            ctx.lineTo(400, CENTER_Y + 150); // 向右連至示波器
            ctx.stroke();


            // --- 2. 繪製示波器 (右側) ---
            const scopeX = 400;
            const scopeY = 50;
            const scopeW = 380;
            const scopeH = 300;
            const scopeCenterY = scopeY + scopeH / 2;

            // 螢幕外框
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(scopeX, scopeY, scopeW, scopeH);
            ctx.strokeStyle = '#475569';
            ctx.strokeRect(scopeX, scopeY, scopeW, scopeH);

            // 網格線
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.beginPath();
            // 水平中心線
            ctx.moveTo(scopeX, scopeCenterY); ctx.lineTo(scopeX + scopeW, scopeCenterY);
            // 垂直格線
            for (let i=0; i<=scopeW; i+=40) {
                ctx.moveTo(scopeX + i, scopeY); ctx.lineTo(scopeX + i, scopeY + scopeH);
            }
            // 水平格線
            for (let i=0; i<=scopeH; i+=40) {
                ctx.moveTo(scopeX, scopeY + i); ctx.lineTo(scopeX + scopeW, scopeY + i);
            }
            ctx.stroke();

            // 繪製波形
            ctx.strokeStyle = '#10b981'; // 綠色追蹤線
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            const history = state.history;
            if (history.length > 0) {
                const startX = scopeX + scopeW; 
                for (let i = 0; i < history.length; i++) {
                    const val = history[history.length - 1 - i];
                    const x = startX - i * 2;
                    if (x < scopeX) break;
                    const y = scopeCenterY - val * 5; // 縮放電壓至像素
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // 當前值指示點
            if (history.length > 0) {
                const currentY = scopeCenterY - history[history.length-1] * 5;
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(scopeX + scopeW - 2, currentY, 4, 0, Math.PI*2);
                ctx.fill();
                
                // 數位讀數
                ctx.font = '24px monospace';
                ctx.fillStyle = '#10b981';
                ctx.textAlign = 'right';
                ctx.fillText(history[history.length-1].toFixed(2) + " V", scopeX + scopeW - 20, scopeY + 40);
            }
        };

        const drawArrowHead = (ctx, x, y, dx, dy) => {
            ctx.beginPath();
            ctx.moveTo(x, y);
            const len = Math.sqrt(dx*dx + dy*dy);
            if(len === 0) return;
            const udx = dx/len;
            const udy = dy/len;
            ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - 6*udx - 4*udy, y + dy - 6*udy + 4*udx);
            ctx.lineTo(x + dx - 6*udx + 4*udy, y + dy - 6*udy - 4*udx);
            ctx.fill();
        };

        useEffect(() => {
            draw();
            return () => cancelAnimationFrame(requestRef.current);
        }, []);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg">
                            <i data-lucide="activity" className="w-6 h-6 text-indigo-400"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">交流發電機與示波器實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700">
                        主題：電磁感應 (Electromagnetism)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    <div className="lg:col-span-12">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[450px]">
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_WIDTH} 
                                height={CANVAS_HEIGHT}
                                className="w-full h-full object-contain bg-slate-950 rounded-2xl"
                            />
                            
                            <div className="absolute top-6 left-6 flex gap-4">
                                <div className="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 text-xs shadow-lg backdrop-blur-md">
                                    <div className="text-slate-500 font-bold uppercase mb-1">線圈角度</div>
                                    <div className="text-white font-mono text-lg">{Math.round(angleDeg)}°</div>
                                </div>
                                <div className="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 text-xs shadow-lg backdrop-blur-md">
                                    <div className="text-slate-500 font-bold uppercase mb-1">瞬時電動勢 (EMF)</div>
                                    <div className={`text-xl font-mono font-bold ${voltage > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {voltage.toFixed(2)} V
                                    </div>
                                </div>
                            </div>
                            <div className="absolute bottom-6 left-6 bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-800 text-[10px] font-bold text-slate-500 tracking-widest uppercase backdrop-blur-sm">
                                左側：發電機模型 | 右側：虛擬示波器 (CRO)
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-8">
                            
                            {/* 旋轉速度 */}
                            <div>
                                <label className="flex justify-between text-xs text-indigo-300 font-bold mb-3">
                                    旋轉速度 (ω) <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{speed.toFixed(1)}x</span>
                                </label>
                                <input 
                                    type="range" min="0" max="5.0" step="0.1" 
                                    value={speed} onChange={(e) => setSpeed(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" 
                                />
                            </div>

                            {/* 磁場強度 */}
                            <div>
                                <label className="flex justify-between text-xs text-rose-300 font-bold mb-3">
                                    磁場強度 (B) <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{fieldStrength.toFixed(1)} T</span>
                                </label>
                                <input 
                                    type="range" min="0.1" max="3.0" step="0.5" 
                                    value={fieldStrength} onChange={(e) => setFieldStrength(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-rose" 
                                />
                            </div>

                            {/* 面積 */}
                            <div>
                                <label className="flex justify-between text-xs text-emerald-300 font-bold mb-3">
                                    線圈面積 (A) <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{area.toFixed(1)} m²</span>
                                </label>
                                <input 
                                    type="range" min="0.5" max="1.5" step="0.1" 
                                    value={area} onChange={(e) => setArea(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" 
                                />
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 flex flex-col gap-4">
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex-1 flex flex-col justify-center gap-4">
                            <div className="grid grid-cols-2 gap-3">
                                <button 
                                    onClick={isRunning ? stopSim : startSim}
                                    className={`py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg ${isRunning ? 'bg-slate-700 text-slate-300 border border-slate-600' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}
                                >
                                    <i data-lucide={isRunning ? "pause" : "play"}></i>
                                    {isRunning ? "暫停" : "開始旋轉"}
                                </button>
                                <button 
                                    onClick={resetSim}
                                    className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all active:scale-95"
                                >
                                    <i data-lucide="rotate-ccw"></i>
                                    重設
                                </button>
                            </div>
                            
                            <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                <span className="text-sm font-bold text-slate-300">顯示磁力線</span>
                                <input 
                                    type="checkbox" 
                                    checked={showField} 
                                    onChange={() => { setShowField(!showField); setTimeout(() => draw(), 10); }}
                                    className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0 cursor-pointer"
                                />
                            </label>
                        </div>
                    </div>

                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
