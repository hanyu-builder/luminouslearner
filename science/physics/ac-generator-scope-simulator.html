<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交流發電機模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [speed, setSpeed] = useState(1.0); // 角速度係數
        const [fieldStrength, setFieldStrength] = useState(1.0); // 磁場 B
        const [area, setArea] = useState(1.0); // 線圈面積 A
        const [isRunning, setIsRunning] = useState(false);
        const [showField, setShowField] = useState(true);
        const [voltage, setVoltage] = useState(0);
        const [angleDeg, setAngleDeg] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const lastTimeRef = useRef(0);
        const physicsRef = useRef({ angle: 0, history: [] });
        const paramsRef = useRef({ speed, fieldStrength, area });

        useEffect(() => {
            paramsRef.current = { speed, fieldStrength, area };
        }, [speed, fieldStrength, area]);

        const startSim = () => {
            if (isRunning) return;
            setIsRunning(true);
            lastTimeRef.current = performance.now();
            requestRef.current = requestAnimationFrame(loop);
        };

        const stopSim = () => {
            setIsRunning(false);
            cancelAnimationFrame(requestRef.current);
        };

        const resetSim = () => {
            stopSim();
            physicsRef.current = { angle: 0, history: [] };
            setVoltage(0);
            setAngleDeg(0);
            setTimeout(() => draw(), 50);
        };

        const loop = (timestamp) => {
            if (!isRunning) return;
            const dt = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;
            
            const state = physicsRef.current;
            const p = paramsRef.current;

            // 物理公式：EMF = B * A * w * sin(wt)
            state.angle += p.speed * 2.5 * dt; 
            const currentV = p.fieldStrength * p.area * p.speed * Math.sin(state.angle) * 5; 

            state.history.push(currentV);
            if (state.history.length > 250) state.history.shift();

            setVoltage(currentV);
            setAngleDeg((state.angle * 180 / Math.PI) % 360);
            
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const state = physicsRef.current;
            const theta = state.angle;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 1. 繪製發電機 (左側) ---
            // 磁場背景
            if (showField) {
                const grad = ctx.createLinearGradient(50, 0, 350, 0);
                grad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                grad.addColorStop(0.2, 'rgba(56, 189, 248, 0.15)');
                grad.addColorStop(0.8, 'rgba(56, 189, 248, 0.15)');
                grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(50, 100, 300, 250);
                
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
                ctx.lineWidth = 1;
                for (let y = 120; y < 350; y+=35) {
                    ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(350, y); ctx.stroke();
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                    ctx.beginPath(); ctx.moveTo(205, y); ctx.lineTo(198, y-4); ctx.lineTo(198, y+4); ctx.fill();
                }
            }

            // 磁鐵
            const mH = 220;
            ctx.fillStyle = '#ef4444'; ctx.fillRect(0, CENTER_Y - mH/2, 50, mH); // N
            ctx.fillStyle = 'white'; ctx.font = 'bold 20px Inter'; ctx.fillText("N", 15, CENTER_Y + 7);
            ctx.fillStyle = '#3b82f6'; ctx.fillRect(350, CENTER_Y - mH/2, 50, mH); // S
            ctx.fillStyle = 'white'; ctx.fillText("S", 365, CENTER_Y + 7);

            // 旋轉線圈
            const cW = 160 * paramsRef.current.area;
            const cH = 110;
            ctx.save();
            ctx.translate(200, CENTER_Y);
            ctx.rotate(theta);
            
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
            ctx.strokeRect(-cW/2, -cH/2, cW, cH);
            
            // 電流方向指示
            if (Math.abs(voltage) > 0.5) {
                const dir = voltage > 0 ? 1 : -1;
                ctx.fillStyle = '#ffffff';
                // 上邊界箭頭
                ctx.beginPath();
                ctx.moveTo(dir * 20, -cH/2); ctx.lineTo(dir * 10, -cH/2 - 6); ctx.lineTo(dir * 10, -cH/2 + 6);
                ctx.fill();
                // 下邊界箭頭
                ctx.beginPath();
                ctx.moveTo(-dir * 20, cH/2); ctx.lineTo(-dir * 10, cH/2 - 6); ctx.lineTo(-dir * 10, cH/2 + 6);
                ctx.fill();
            }
            ctx.restore();

            // 軸與電路連接線
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(200, CENTER_Y, 8, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(200, CENTER_Y + 10); ctx.lineTo(200, CENTER_Y + 180); ctx.lineTo(400, CENTER_Y + 180); ctx.stroke();

            // --- 2. 繪製示波器 (右側) ---
            const sX = 400, sY = 50, sW = 380, sH = 320;
            const sCY = sY + sH / 2;

            ctx.fillStyle = '#020617'; ctx.fillRect(sX, sY, sW, sH);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            // 網格
            ctx.beginPath();
            for (let i=0; i<=sW; i+=40) { ctx.moveTo(sX + i, sY); ctx.lineTo(sX + i, sY + sH); }
            for (let i=0; i<=sH; i+=40) { ctx.moveTo(sX, sY + i); ctx.lineTo(sX + sW, sY + i); }
            ctx.stroke();
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(sX, sCY); ctx.lineTo(sX + sW, sCY); ctx.stroke();

            // 追蹤波形
            ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3; ctx.beginPath();
            const history = state.history;
            if (history.length > 0) {
                for (let i = 0; i < history.length; i++) {
                    const x = sX + sW - i * 1.5;
                    const val = history[history.length - 1 - i];
                    const y = sCY - val * 6;
                    if (x < sX) break;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            // 數值顯示
            if (history.length > 0) {
                const curV = history[history.length-1];
                ctx.fillStyle = '#10b981'; ctx.font = 'bold 24px JetBrains Mono'; ctx.textAlign = 'right';
                ctx.fillText(curV.toFixed(2) + " V", sX + sW - 20, sY + 40);
                ctx.beginPath(); ctx.arc(sX + sW, sCY - curV * 6, 5, 0, Math.PI*2); ctx.fillStyle='#ef4444'; ctx.fill();
            }
            
            if (window.lucide) window.lucide.createIcons();
        };

        useEffect(() => { draw(); }, []);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400">
                            <i data-lucide="activity"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">交流發電機與示波器實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Electromagnetism
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-12">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[450px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 flex gap-3">
                                <div className="bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">線圈角度</div>
                                    <div className="text-lg font-mono text-white">{Math.round(angleDeg)}°</div>
                                </div>
                            </div>
                            <div className="absolute bottom-6 left-6 bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-800 text-[10px] font-bold text-slate-500 tracking-widest uppercase">
                                左側：發電機模型 | 右側：虛擬示波器 (CRO)
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-10">
                        <div className="space-y-6">
                            <label className="flex justify-between text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3">
                                <span>旋轉角速度 (ω)</span>
                                <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{speed.toFixed(1)}x</span>
                            </label>
                            <input type="range" min="0" max="5.0" step="0.1" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" />
                        </div>
                        <div className="space-y-6">
                            <label className="flex justify-between text-xs font-bold text-rose-400 uppercase tracking-widest mb-3">
                                <span>磁場強度 (B)</span>
                                <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{fieldStrength.toFixed(1)} T</span>
                            </label>
                            <input type="range" min="0.1" max="3.0" step="0.1" value={fieldStrength} onChange={(e) => setFieldStrength(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-rose" />
                        </div>
                        <div className="space-y-6">
                            <label className="flex justify-between text-xs font-bold text-cyan-400 uppercase tracking-widest mb-3">
                                <span>線圈面積 (A)</span>
                                <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{area.toFixed(1)} m²</span>
                            </label>
                            <input type="range" min="0.5" max="1.5" step="0.1" value={area} onChange={(e) => setArea(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                        </div>
                    </div>

                    <div className="lg:col-span-4 flex flex-col gap-4">
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex-1 flex flex-col gap-4">
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={isRunning ? stopSim : startSim} className={`py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg ${isRunning ? 'bg-slate-700 text-slate-300' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}>
                                    <i data-lucide={isRunning ? "pause" : "play"}></i>
                                    {isRunning ? "暫停" : "開始旋轉"}
                                </button>
                                <button onClick={resetSim} className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all active:scale-95">
                                    <i data-lucide="rotate-ccw"></i> 重設
                                </button>
                            </div>
                            <label className="flex items-center justify-between p-4 bg-slate-900/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                <span className="text-sm font-bold text-slate-300">顯示磁力線</span>
                                <input type="checkbox" checked={showField} onChange={() => { setShowField(!showField); setTimeout(() => draw(), 10); }} className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0 cursor-pointer" />
                            </label>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
