<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱機 PV 循環模擬器 | Luminous Learner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const GAMMA = 1.4;

    const App = () => {
        const [cycleType, setCycleType] = useState("Carnot"); 
        const [animationSpeed, setAnimationSpeed] = useState(1);
        const [isPaused, setIsPaused] = useState(false);
        const [points, setPoints] = useState([]); 

        const simRef = useRef({ t: 0, currentV: 0, currentP: 0, currentT: 0, currentStage: 0 });
        const canvasRef = useRef(null);
        const requestRef = useRef();
        const dragRef = useRef({ isDragging: false, pointIndex: -1 });

        useEffect(() => { resetCycle(cycleType); }, [cycleType]);

        const resetCycle = (type) => {
            let newPoints = [];
            if (type === "Carnot") {
                newPoints = [{ V: 2, P: 8 }, { V: 5, P: 3.2 }, { V: 8, P: 1.5 }, { V: 3.5, P: 3.5 }];
            } else {
                newPoints = [{ V: 8, P: 1 }, { V: 2, P: 12 }, { V: 2, P: 20 }, { V: 8, P: 2.5 }];
            }
            setPoints(newPoints);
        };

        const getState = (t, pts) => {
            if (!pts || pts.length < 4) return { V: 1, P: 1, T: 300, stage: 0 };
            const stage = Math.floor(t) % 4;
            const progress = t % 1;
            const pStart = pts[stage];
            const pEnd = pts[(stage + 1) % 4];
            const V = pStart.V + (pEnd.V - pStart.V) * progress;
            let P = 0;
            if (cycleType === "Carnot") {
                if (stage === 0 || stage === 2) P = (pStart.P * pStart.V) / Math.max(0.1, V);
                else P = (pStart.P * Math.pow(pStart.V, GAMMA)) / Math.pow(Math.max(0.1, V), GAMMA);
            } else {
                if (stage === 1 || stage === 3) P = pStart.P + (pEnd.P - pStart.P) * progress;
                else P = (pStart.P * Math.pow(pStart.V, GAMMA)) / Math.pow(Math.max(0.1, V), GAMMA);
            }
            return { V, P, T: P * V * 10, stage };
        };

        const updatePhysics = () => {
            if (isPaused || points.length < 4) return;
            const state = simRef.current;
            state.t += 0.01 * animationSpeed;
            if (state.t >= 4) state.t = 0;
            const cur = getState(state.t, points);
            Object.assign(state, { currentV: cur.V, currentP: cur.P, currentT: cur.T, currentStage: cur.stage });
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const state = simRef.current;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const graphX = 50; const graphY = 50; const graphW = 400; const graphH = 400;
            const engineX = 550; const engineY = 100;
            const scaleX = graphW / 12; const scaleY = graphH / 25;

            // 1. PV 圖表繪製
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(graphX, graphY); ctx.lineTo(graphX, graphY + graphH); ctx.lineTo(graphX + graphW, graphY + graphH); ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText("壓強 Pressure (P)", graphX - 20, graphY - 10);
            ctx.fillText("體積 Volume (V)", graphX + graphW - 40, graphY + graphH + 25);

            if (points.length >= 4) {
                ctx.lineWidth = 3; ctx.strokeStyle = '#38bdf8'; ctx.beginPath();
                for (let t = 0; t <= 4; t += 0.05) {
                    const s = getState(t, points);
                    const x = graphX + s.V * scaleX; const y = graphY + graphH - s.P * scaleY;
                    if (t===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.05)'; ctx.fill();

                points.forEach((p, i) => {
                    const x = graphX + p.V * scaleX; const y = graphY + graphH - p.P * scaleY;
                    ctx.fillStyle = i === state.currentStage ? '#facc15' : '#fff';
                    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#94a3b8'; ctx.fillText(i+1, x + 10, y - 10);
                });
            }

            const curX = graphX + state.currentV * scaleX; const curY = graphY + graphH - state.currentP * scaleY;
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(curX, curY, 8, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.stroke();

            // 2. 活塞引擎繪製
            const cylW = 150; const cylH = 250; const pistonH = 20;
            const tempRatio = Math.min(1, Math.max(0, state.currentT / 1500));
            const gasHeight = Math.max(10, Math.min(cylH, (state.currentV / 10) * 200 + 20));

            ctx.fillStyle = `rgb(${Math.floor(tempRatio * 255)}, 50, ${Math.floor((1 - tempRatio) * 255)})`;
            ctx.fillRect(engineX, engineY + cylH - gasHeight, cylW, gasHeight);
            
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 4;
            ctx.strokeRect(engineX, engineY, cylW, cylH);

            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(engineX + 2, engineY + cylH - gasHeight - pistonH, cylW - 4, pistonH);
            
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(engineX + cylW/2, engineY + cylH - gasHeight - pistonH); ctx.lineTo(engineX + cylW/2, engineY - 50); ctx.stroke();

            ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
            ctx.fillText(`P: ${state.currentP.toFixed(2)} atm`, engineX + 180, engineY + 50);
            ctx.fillText(`V: ${state.currentV.toFixed(2)} L`, engineX + 180, engineY + 80);
            ctx.fillText(`T: ${state.currentT.toFixed(0)} K`, engineX + 180, engineY + 110);
            
            const stage = state.currentStage;
            let heatDir = 0; 
            if (cycleType === "Carnot") {
                if (stage === 0) heatDir = 1; if (stage === 2) heatDir = -1;
            } else {
                if (stage === 1) heatDir = 1; if (stage === 3) heatDir = -1;
            }
            
            if (heatDir !== 0) {
                const arrowY = engineY + cylH - gasHeight / 2;
                if (heatDir === 1) {
                    drawArrow(ctx, engineX - 60, arrowY, engineX - 10, arrowY, '#ef4444');
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 14px sans-serif'; ctx.fillText("熱量吸入 Q_in", engineX - 110, arrowY - 15);
                } else {
                    drawArrow(ctx, engineX + cylW + 10, arrowY, engineX + cylW + 60, arrowY, '#3b82f6');
                    ctx.fillStyle = '#3b82f6'; ctx.font = 'bold 14px sans-serif'; ctx.fillText("廢熱排出 Q_out", engineX + cylW + 10, arrowY - 15);
                }
            }
        };

        const drawArrow = (ctx, x1, y1, x2, y2, color) => {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            const angle = Math.atan2(y2-y1, x2-x1);
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - 10*Math.cos(angle-Math.PI/6), y2 - 10*Math.sin(angle-Math.PI/6));
            ctx.lineTo(x2 - 10*Math.cos(angle+Math.PI/6), y2 - 10*Math.sin(angle+Math.PI/6));
            ctx.fill();
        };

        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const mx = e.clientX - rect.left; const my = e.clientY - rect.top;
            const scaleX = (400) / 12; const scaleY = (400) / 25;
            points.forEach((p, i) => {
                const px = 50 + p.V * scaleX; const py = 50 + 400 - p.P * scaleY;
                if (Math.hypot(mx - px, my - py) < 15) dragRef.current = { isDragging: true, pointIndex: i };
            });
        };

        const handleMouseMove = (e) => {
            if (dragRef.current.isDragging) {
                const rect = canvasRef.current.getBoundingClientRect();
                const mx = (e.clientX - rect.left - 50) / (400 / 12);
                const my = (50 + 400 - (e.clientY - rect.top)) / (400 / 25);
                const idx = dragRef.current.pointIndex;
                const newPoints = [...points];
                newPoints[idx] = { V: Math.max(0.5, Math.min(12, mx)), P: Math.max(0.5, Math.min(25, my)) };
                setPoints(newPoints);
            }
        };

        useEffect(() => {
            const loopCall = () => { updatePhysics(); draw(); requestRef.current = requestAnimationFrame(loopCall); };
            requestRef.current = requestAnimationFrame(loopCall);
            return () => cancelAnimationFrame(requestRef.current);
        }, [cycleType, points, isPaused]);

        const efficiency = useMemo(() => {
            if (points.length < 4) return 0;
            const Ts = points.map(p => p.P * p.V);
            const Th = Math.max(...Ts); const Tc = Math.min(...Ts);
            return (Th === 0) ? 0 : (1 - (Tc/Th)).toFixed(3) * 100;
        }, [points]);

        return (
            <div className="h-screen bg-slate-900 text-slate-200 flex flex-col overflow-hidden">
                <nav className="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between shrink-0 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-rose-600 p-1.5 rounded-lg"><i data-lucide="thermometer-sun" className="w-5 h-5 text-white"></i></div>
                        <h1 className="text-lg font-bold tracking-tight">熱機循環模擬實驗室</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-rose-400 border border-slate-700">DSE Physics: Thermodynamics</div>
                </nav>

                <main className="flex-1 grid grid-cols-1 lg:grid-cols-4 overflow-hidden">
                    <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800">
                        <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain cursor-grab active:cursor-grabbing"
                            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={()=>dragRef.current.isDragging=false} onMouseLeave={()=>dragRef.current.isDragging=false} />
                        <div className="absolute top-4 left-4 bg-slate-900/90 p-3 rounded-xl border border-slate-700 text-[11px] text-slate-400">
                            <div>紅色圓點：當前氣體狀態 (P, V)</div>
                            <div>白色圓點：循環轉折點 (可拖動)</div>
                        </div>
                    </div>

                    <aside className="lg:col-span-1 bg-slate-900 p-6 flex flex-col space-y-8 overflow-y-auto border-l border-slate-800">
                        <div className="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 text-center">
                            <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">熱機效率 (&eta;)</h3>
                            <div className="text-4xl font-mono font-bold text-rose-400">{efficiency.toFixed(1)}%</div>
                            <div className="text-[10px] text-slate-500 mt-2 font-bold italic">理想最高效率 (Theoretical Max)</div>
                        </div>

                        <div className="space-y-6">
                            <div>
                                <label className="text-xs font-bold text-slate-400 mb-3 block">引擎循環類型 (Cycle Type)</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setCycleType("Carnot")} className={`py-2 text-xs font-bold rounded-lg border transition-all ${cycleType === "Carnot" ? 'bg-orange-600 border-orange-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>卡諾 (理想)</button>
                                    <button onClick={() => setCycleType("Otto")} className={`py-2 text-xs font-bold rounded-lg border transition-all ${cycleType === "Otto" ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>奧圖 (汽油)</button>
                                </div>
                            </div>

                            <button onClick={()=>setIsPaused(!isPaused)} className={`w-full py-4 rounded-xl text-xs font-black uppercase tracking-widest border transition-all flex items-center justify-center gap-2 ${isPaused ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <i data-lucide={isPaused ? "play" : "pause"}></i> {isPaused ? "開始運行" : "暫停運行"}
                            </button>
                        </div>

                        <div className="bg-blue-900/10 border border-blue-500/20 p-4 rounded-xl">
                            <h4 className="text-xs font-bold text-blue-400 mb-2 flex items-center gap-2"><i data-lucide="info" className="w-3 h-3"></i> 過程說明</h4>
                            <div className="text-[11px] text-slate-400 space-y-2 leading-relaxed font-medium">
                                {cycleType === "Carnot" ? (
                                    <>
                                        <p>1-2: 等溫膨脹 (吸熱 Q_in)</p>
                                        <p>2-3: 絕熱膨脹 (對外做功)</p>
                                        <p>3-4: 等溫壓縮 (放熱 Q_out)</p>
                                        <p>4-1: 絕熱壓縮 (恢復初態)</p>
                                    </>
                                ) : (
                                    <>
                                        <p>1-2: 絕熱壓縮 (活塞上升)</p>
                                        <p>2-3: 等容加熱 (火嘴點火)</p>
                                        <p>3-4: 絕熱膨脹 (動力行程)</p>
                                        <p>4-1: 等容冷卻 (廢氣排放)</p>
                                    </>
                                )}
                            </div>
                        </div>
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 100);
</script>
</body>
</html>
