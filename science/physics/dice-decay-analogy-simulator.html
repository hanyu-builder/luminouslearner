<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骰子衰變實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .dice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(24px, 1fr));
            gap: 4px;
        }
        .dice-face {
            width: 24px; height: 24px;
            background-color: white;
            border-radius: 4px;
            display: flex; justify-content: center; align-items: center;
            color: #1e293b; font-weight: bold; font-family: monospace;
            font-size: 14px;
            box-shadow: 0 2px 0 #94a3b8;
            transition: all 0.2s;
        }
        .dice-decayed {
            background-color: #334155;
            color: #64748b;
            box-shadow: none;
            opacity: 0.5;
        }
        .rolling { animation: shake 0.5s infinite; }
        
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
        // --- 狀態 ---
        const [totalDice, setTotalDice] = useState(100);
        const [decayConditions, setDecayConditions] = useState([6]); // 導致衰變的面數
        
        // 模擬狀態
        const [dice, setDice] = useState([]); // {id, value, status: 'active' | 'decayed'}
        const [rollCount, setRollCount] = useState(0);
        const [isRolling, setIsRolling] = useState(false);
        const [history, setHistory] = useState([]); // {roll, count}

        // --- 初始化 ---
        useEffect(() => {
            resetSim();
        }, [totalDice]); 

        const resetSim = () => {
            const newDice = Array.from({ length: totalDice }, (_, i) => ({
                id: i,
                value: '?',
                status: 'active'
            }));
            setDice(newDice);
            setRollCount(0);
            setHistory([{ roll: 0, count: totalDice }]);
            setIsRolling(false);
        };

        // --- 邏輯 ---
        const roll = () => {
            if (isRolling) return;
            
            // 僅擲出活躍（未衰變）的骰子
            const activeIndices = dice.map((d, i) => d.status === 'active' ? i : -1).filter(i => i !== -1);
            
            if (activeIndices.length === 0) return; // 全數衰變

            setIsRolling(true);

            // 動畫效果
            let frames = 0;
            const interval = setInterval(() => {
                setDice(prev => prev.map(d => {
                    if (d.status === 'decayed') return d;
                    return { ...d, value: Math.floor(Math.random() * 6) + 1 };
                }));
                frames++;
                if (frames > 10) {
                    clearInterval(interval);
                    finalizeRoll();
                }
            }, 50);
        };

        const finalizeRoll = () => {
            setDice(prev => {
                const nextDice = prev.map(d => {
                    if (d.status === 'decayed') return d;
                    
                    const val = Math.floor(Math.random() * 6) + 1;
                    // 檢查是否衰變
                    if (decayConditions.includes(val)) {
                        return { ...d, value: val, status: 'decayed' };
                    }
                    return { ...d, value: val };
                });
                
                // 更新歷史紀錄
                const activeCount = nextDice.filter(d => d.status === 'active').length;
                setHistory(h => [...h, { roll: rollCount + 1, count: activeCount }]);
                setRollCount(c => c + 1);
                setIsRolling(false);
                
                return nextDice;
            });
        };

        // --- 數據統計 ---
        const activeCount = dice.filter(d => d.status === 'active').length;
        const decayProb = decayConditions.length / 6;
        const theoreticalHalfLife = Math.log(2) / Math.log(1 / (1 - decayProb)); // 單位：擲骰次數

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        // --- 繪製圖表 ---
        const Graph = () => {
            const h = 200;
            const w = 300;
            const padding = 35;
            
            const maxRolls = Math.max(12, history.length + 2);
            
            const mapX = (r) => padding + (r / maxRolls) * (w - 2*padding);
            const mapY = (n) => h - padding - (n / totalDice) * (h - 2*padding);

            const points = history.map(d => `${mapX(d.roll)},${mapY(d.count)}`).join(' ');

            return (
                <div className="bg-slate-950 rounded-xl border border-slate-800 p-4 relative h-[220px] shadow-inner overflow-hidden">
                    <div className="absolute top-2 left-4 text-[10px] font-black uppercase tracking-widest text-slate-500">剩餘數量 vs 擲骰次數</div>
                    <svg width="100%" height="100%" viewBox={`0 0 ${w} ${h}`} className="overflow-visible">
                        {/* 軸線 */}
                        <line x1={padding} y1={h-padding} x2={w-padding} y2={h-padding} stroke="#475569" strokeWidth="1" />
                        <line x1={padding} y1={padding} x2={padding} y2={h-padding} stroke="#475569" strokeWidth="1" />
                        
                        {/* 理論衰變曲線 (背景參考) */}
                        <path d={`M ${mapX(0)} ${mapY(totalDice)} ` + Array.from({length: maxRolls + 1}).map((_, i) => {
                            const n = totalDice * Math.pow((1 - decayProb), i);
                            return `L ${mapX(i)} ${mapY(n)}`;
                        }).join(' ')} fill="none" stroke="#3b82f6" strokeWidth="1.5" strokeDasharray="5 3" opacity="0.3" />

                        {/* 數據折線 */}
                        <polyline points={points} fill="none" stroke="#facc15" strokeWidth="2.5" strokeLinejoin="round" />
                        
                        {/* 數據點 */}
                        {history.map((d, i) => (
                            <circle key={i} cx={mapX(d.roll)} cy={mapY(d.count)} r="3.5" fill="#facc15" stroke="#0f172a" strokeWidth="1" />
                        ))}
                        
                        {/* 標籤 */}
                        <text x={w-padding} y={h-5} fill="#64748b" fontSize="9" fontWeight="bold" textAnchor="end">次數</text>
                        <text x="10" y={padding} fill="#64748b" fontSize="9" fontWeight="bold" textAnchor="start">N</text>
                    </svg>
                </div>
            );
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-500/20 p-2 rounded-lg text-purple-400">
                            <i data-lucide="dices"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">骰子衰變類比實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Nuclear Physics (Analogy)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    {/* 左側：骰子模擬區 */}
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-8 min-h-[400px] max-h-[650px] overflow-y-auto custom-scroll shadow-2xl relative">
                            <div className="flex justify-between items-center mb-6 sticky top-0 bg-slate-950/80 backdrop-blur pb-4 z-10">
                                <div className="space-y-1">
                                    <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">活躍原子核 (未衰變)</div>
                                    <div className="text-3xl font-black text-white font-mono">{activeCount}</div>
                                </div>
                                <div className="text-right space-y-1">
                                    <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">目前擲骰次數</div>
                                    <div className="text-3xl font-black text-indigo-400 font-mono">#{rollCount}</div>
                                </div>
                            </div>
                            
                            <div className="dice-grid">
                                {dice.map(d => (
                                    <div 
                                        key={d.id} 
                                        className={`dice-face ${d.status === 'decayed' ? 'dice-decayed' : isRolling ? 'rolling shadow-indigo-500/50 shadow-lg' : 'bg-white text-slate-900 border-b-4 border-slate-300'}`}
                                    >
                                        {d.value}
                                    </div>
                                ))}
                            </div>

                            {activeCount === 0 && (
                                <div className="absolute inset-0 bg-slate-950/80 flex items-center justify-center backdrop-blur-sm z-20">
                                    <div className="text-center p-8 border-4 border-slate-700 rounded-3xl">
                                        <h3 className="text-3xl font-black text-white mb-2 uppercase italic tracking-widest">全數衰變完成</h3>
                                        <p className="text-slate-400 text-sm">樣本已達到完全穩定狀態。</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 右側：控制面板與數據 */}
                    <div className="lg:col-span-4 space-y-6">
                        
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="settings-2" className="text-indigo-400"></i> 實驗參數設定
                            </h2>
                            
                            <div>
                                <label className="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                                    <span>總骰子數 ($N_0$)</span>
                                    <span className="text-white font-mono">{totalDice}</span>
                                </label>
                                <input 
                                    type="range" min="50" max="500" step="50" 
                                    value={totalDice} onChange={(e) => setTotalDice(Number(e.target.value))}
                                    disabled={rollCount > 0}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" 
                                />
                            </div>

                            <div className="space-y-4">
                                <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest">
                                    衰變條件 (機率: {decayProb.toFixed(2)})
                                </label>
                                <div className="grid grid-cols-1 gap-3">
                                    <button 
                                        onClick={() => { setDecayConditions([6]); resetSim(); }}
                                        disabled={rollCount > 0}
                                        className={`py-3 px-4 rounded-xl text-xs font-bold border transition-all ${decayConditions.length === 1 ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-900/40' : 'bg-slate-900 border-slate-700 text-slate-500 hover:text-slate-300'}`}
                                    >
                                        擲得 '6' 即衰變 (1/6)
                                    </button>
                                    <button 
                                        onClick={() => { setDecayConditions([5, 6]); resetSim(); }}
                                        disabled={rollCount > 0}
                                        className={`py-3 px-4 rounded-xl text-xs font-bold border transition-all ${decayConditions.length === 2 ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-900/40' : 'bg-slate-900 border-slate-700 text-slate-500 hover:text-slate-300'}`}
                                    >
                                        擲得 '5' 或 '6' 即衰變 (1/3)
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-700">
                                <button 
                                    onClick={roll}
                                    disabled={isRolling || activeCount === 0}
                                    className={`py-5 rounded-2xl font-black text-xl tracking-widest flex flex-col items-center justify-center gap-1 transition-all active:scale-95 shadow-xl ${isRolling || activeCount === 0 ? 'bg-slate-700 text-slate-500 opacity-50 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}
                                >
                                    <i data-lucide="dices" className="w-6 h-6"></i>
                                    擲骰
                                </button>
                                <button 
                                    onClick={resetSim}
                                    className="py-5 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all flex items-center justify-center shadow-lg active:rotate-180"
                                >
                                    <i data-lucide="rotate-ccw"></i>
                                </button>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-sm uppercase tracking-widest border-b border-slate-700 pb-3">
                                <i data-lucide="line-chart" className="text-yellow-400"></i> 衰變曲線分析
                            </h2>
                            <Graph />
                            <div className="p-5 rounded-2xl bg-indigo-900/10 border border-indigo-500/20">
                                <div className="flex justify-between text-xs text-indigo-300 font-bold mb-1">
                                    <span>理論半衰期 (Half-Life)</span>
                                    <span className="font-mono">{theoreticalHalfLife.toFixed(1)} 次</span>
                                </div>
                                <div className="text-[10px] text-slate-500 leading-relaxed italic">
                                    統計學意義：平均每經過 {theoreticalHalfLife.toFixed(1)} 次擲骰，剩餘數量會減少為原本的一半。
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
