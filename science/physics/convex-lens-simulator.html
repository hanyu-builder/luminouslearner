<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透鏡成像實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-teal::-webkit-slider-thumb { border-color: #14b8a6; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    
    const SCALE = 2.5; 

    const App = () => {
        // --- 狀態 ---
        const [u, setU] = useState(100); // 物距 (cm)
        const [f, setF] = useState(60);  // 焦距 (cm)
        const [h, setH] = useState(40);  // 物體高度
        const [showRays, setShowRays] = useState(true);

        const canvasRef = useRef(null);
        const requestRef = useRef();

        // --- 物理計算 ---
        const physics = useMemo(() => {
            // 透鏡公式: 1/u + 1/v = 1/f
            let v = 0;
            let m = 0;
            let type = "實像 (Real)";
            
            if (u === f) {
                v = Infinity;
                m = Infinity;
                type = "不定 (平行光)";
            } else {
                v = (u * f) / (u - f);
                m = -v / u; 
                
                if (v > 0) type = "實像 (Real)";
                else type = "虛像 (Virtual)";
            }

            return { v, m, type };
        }, [u, f]);

        // --- 繪圖功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 1. 光學平台設置 ---
            // 主軸
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

            // 透鏡中心線
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(CENTER_X, 50); ctx.lineTo(CENTER_X, CANVAS_HEIGHT-50); ctx.stroke();
            ctx.setLineDash([]);
            
            // 繪製透鏡
            ctx.fillStyle = 'rgba(147, 197, 253, 0.1)'; ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(CENTER_X, CENTER_Y, 15, 200, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            // 標註焦點
            const fPx = f * SCALE;
            drawPoint(ctx, CENTER_X - fPx, CENTER_Y, "F'");
            drawPoint(ctx, CENTER_X + fPx, CENTER_Y, "F");
            drawPoint(ctx, CENTER_X - fPx * 2, CENTER_Y, "2F'");
            drawPoint(ctx, CENTER_X + fPx * 2, CENTER_Y, "2F");

            // --- 2. 物體 ---
            const objX = CENTER_X - u * SCALE;
            const objY = CENTER_Y - h; 
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4;
            drawArrow(ctx, objX, CENTER_Y, objX, objY);
            ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
            ctx.fillText("物體 (Object)", objX, objY - 15);

            // --- 3. 像 ---
            const { v, m, type } = physics;
            if (v !== Infinity && Math.abs(v) < 2000) {
                const imgX = CENTER_X + v * SCALE;
                const imgY = CENTER_Y - (h * m);
                ctx.strokeStyle = v > 0 ? '#10b981' : '#f43f5e'; 
                ctx.lineWidth = 4;
                ctx.setLineDash(v > 0 ? [] : [5, 5]);
                drawArrow(ctx, imgX, CENTER_Y, imgX, imgY);
                ctx.setLineDash([]);
                ctx.fillStyle = v > 0 ? '#10b981' : '#f43f5e';
                ctx.fillText(`像 (${v > 0 ? '實像' : '虛像'})`, imgX, v > 0 ? imgY + 20 : imgY - 15);
            }

            // --- 4. 光路追蹤 ---
            if (showRays && v !== Infinity) {
                ctx.lineWidth = 2;
                const imgX = CENTER_X + v * SCALE;
                const imgY = CENTER_Y - (h * m);

                // 射線 1
                ctx.strokeStyle = '#38bdf8'; ctx.beginPath();
                ctx.moveTo(objX, objY); ctx.lineTo(CENTER_X, objY); 
                const slope1 = (0 - objY) / (fPx - 0);
                const endX1 = CANVAS_WIDTH; const endY1 = objY + slope1 * (endX1 - CENTER_X);
                ctx.lineTo(endX1, endY1); ctx.stroke();
                if (v < 0) {
                    ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.beginPath(); ctx.moveTo(CENTER_X, objY); ctx.lineTo(imgX, imgY); ctx.stroke(); ctx.setLineDash([]);
                }

                // 射線 2
                ctx.strokeStyle = '#a855f7'; ctx.beginPath();
                ctx.moveTo(objX, objY);
                const slope2 = (CENTER_Y - objY) / (CENTER_X - objX);
                const endX2 = CANVAS_WIDTH; const endY2 = objY + slope2 * (endX2 - objX);
                ctx.lineTo(endX2, endY2); ctx.stroke();
                if (v < 0) {
                    ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(168, 85, 247, 0.5)';
                    ctx.beginPath(); ctx.moveTo(objX, objY); ctx.lineTo(imgX, imgY); ctx.stroke(); ctx.setLineDash([]);
                }

                // 射線 3
                const slope3 = (CENTER_Y - objY) / ((CENTER_X - fPx) - objX);
                const hitY = objY + slope3 * (CENTER_X - objX);
                if (Math.abs(hitY - CENTER_Y) < 300) {
                    ctx.strokeStyle = '#14b8a6'; ctx.beginPath();
                    ctx.moveTo(objX, objY); ctx.lineTo(CENTER_X, hitY); ctx.lineTo(CANVAS_WIDTH, hitY); ctx.stroke();
                    if (v < 0) {
                        ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(20, 184, 166, 0.5)';
                        ctx.beginPath(); ctx.moveTo(CENTER_X, hitY); ctx.lineTo(imgX, hitY); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
            }
        };

        const drawArrow = (ctx, x1, y1, x2, y2) => {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            const angle = Math.atan2(y2 - y1, x2 - x1), headLen = 12;
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        };

        const drawPoint = (ctx, x, y, label) => {
            ctx.fillStyle = '#64748b'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
            ctx.font = 'bold 11px Inter'; ctx.textAlign = 'center';
            ctx.fillText(label, x, y + 20);
        };

        useEffect(() => { draw(); }, [u, f, h, physics, showRays]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 h-16 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                            <i data-lucide="glasses"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">凸透鏡成像實驗室</h1>
                    </div>
                    <div className="text-[10px] text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Geometric Optics
                    </div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-4">
                        
                        {/* 左側：畫布 */}
                        <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800 flex items-center justify-center p-2">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 flex gap-3 pointer-events-none">
                                <div className="bg-slate-900/90 backdrop-blur-md px-5 py-3 rounded-2xl border border-slate-700 shadow-2xl">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">成像性質</div>
                                    <div className={`text-xl font-black ${physics.v > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{physics.type}</div>
                                    <div className="text-[10px] text-slate-400 mt-1 uppercase font-bold tracking-tighter">
                                        {physics.m < 0 ? '倒立' : '正立'} &middot; {Math.abs(physics.m) > 1 ? '放大' : '縮小'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 右側：控制面板 */}
                        <div className="lg:col-span-1 bg-slate-900 border-l border-slate-800 flex flex-col h-full overflow-y-auto custom-scroll p-6 space-y-8">
                            <div className="space-y-8">
                                <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="settings-2" className="text-blue-400"></i> 光學參數調節</h2>
                                
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-amber-400 uppercase tracking-widest mb-4"><span>物距 (u)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{u} cm</span></label>
                                    <input type="range" min="30" max="150" step="1" value={u} onChange={(e)=>setU(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase italic"><span>靠近透鏡</span><span>遠離透鏡</span></div>
                                </div>

                                <div>
                                    <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-4"><span>焦距 (f)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{f} cm</span></label>
                                    <input type="range" min="30" max="100" step="1" value={f} onChange={(e)=>setF(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase italic"><span>厚透鏡 (強)</span><span>薄透鏡 (弱)</span></div>
                                </div>
                            </div>

                            <div className="pt-6 border-t border-slate-800 space-y-6">
                                <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="calculator" className="w-3 h-3 text-indigo-400"></i> 定量運算結果</h3>
                                <div className="space-y-3 font-mono text-sm">
                                    <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center text-xs">
                                        <span className="text-slate-500 uppercase">像距 (v)</span>
                                        <span className={`font-bold ${physics.v > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{physics.v === Infinity ? '∞' : physics.v.toFixed(1)} cm</span>
                                    </div>
                                    <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center text-xs">
                                        <span className="text-slate-500 uppercase">放大率 (m)</span>
                                        <span className="font-bold text-white">{Math.abs(physics.m).toFixed(2)}x</span>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-4">
                                <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-800 cursor-pointer hover:bg-slate-800 transition-colors">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">顯示光路作圖</span>
                                    <input type="checkbox" checked={showRays} onChange={()=>setShowRays(!showRays)} className="w-5 h-5 rounded border-slate-600 text-blue-500 focus:ring-0 cursor-pointer" />
                                </label>
                                <button onClick={()=>{setU(100); setF(60);}} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2"><i data-lucide="rotate-ccw"></i> 重置實驗</button>
                            </div>

                            <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-2xl shadow-inner mt-auto">
                                <h4 className="text-indigo-400 font-bold text-[10px] uppercase mb-2 flex items-center gap-2"><i data-lucide="lightbulb" className="w-3 h-3"></i> 物理機制提示</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                    當物距 $u &lt; f$ 時，折射光線發散，無法在屏幕上成像，大腦會將光線反向延伸形成<b>虛像</b>。這就是放大鏡的運作原理。
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
