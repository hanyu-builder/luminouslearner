<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熔化曲線繪製器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #f59e0b; cursor: pointer; border: 2px solid #ffffff;
        }
        canvas { touch-action: none; border-radius: 0.5rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 物理常數 ---
    const MP = 0;   // 熔點
    const BP = 100; // 沸點
    const C_SOLID = 0.8;  // 固態比熱 (模擬比例)
    const C_LIQUID = 1.0; // 液態比熱
    const C_GAS = 0.5;    // 氣態比熱
    const L_FUSION = 80;  // 熔化潛熱
    const L_VAPOR = 250;  // 汽化潛熱
    const CONTAINER_WIDTH = 300;
    const CONTAINER_HEIGHT = 200;

    const App = () => {
        const [displayTemp, setDisplayTemp] = useState(-20);
        const [heating, setHeating] = useState(false);
        const [power, setPower] = useState(50);
        const [stateLabel, setStateLabel] = useState("固態 (冰)");
        const [resetFlag, setResetFlag] = useState(0);

        const simState = useRef({
            currentTime: 0,
            currentTemp: -20,
            latentBuffer: 0,
            phase: 'SOLID',
            history: [{t: 0, T: -20}],
            particles: []
        });
        
        const requestRef = useRef();
        const particleCanvasRef = useRef(null);
        const graphCanvasRef = useRef(null);

        const initParticles = () => {
            const ps = [];
            const rows = 8, cols = 10, spacing = 20;
            const startX = (CONTAINER_WIDTH - cols * spacing) / 2 + 10;
            const startY = CONTAINER_HEIGHT - rows * spacing - 10;

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    ps.push({
                        baseX: startX + c * spacing, baseY: startY + r * spacing,
                        x: startX + c * spacing, y: startY + r * spacing,
                        vx: 0, vy: 0
                    });
                }
            }
            simState.current = {
                currentTime: 0, currentTemp: -20, latentBuffer: 0,
                phase: 'SOLID', history: [{t: 0, T: -20}], particles: ps
            };
            setDisplayTemp(-20);
            setStateLabel("固態 (冰)");
            setHeating(false);
        };

        useEffect(() => {
            initParticles();
            drawParticles();
            drawGraph();
        }, [resetFlag]);

        const updatePhysics = () => {
            if (!heating) return;
            const state = simState.current;
            const heatInput = power * 0.06; 

            // 1. 溫度與相變邏輯
            if (state.phase === 'SOLID') {
                state.currentTemp += heatInput / C_SOLID;
                if (state.currentTemp >= MP) {
                    state.currentTemp = MP; state.phase = 'MELTING'; state.latentBuffer = 0;
                }
            } else if (state.phase === 'MELTING') {
                state.latentBuffer += heatInput;
                if (state.latentBuffer >= L_FUSION) state.phase = 'LIQUID';
            } else if (state.phase === 'LIQUID') {
                state.currentTemp += heatInput / C_LIQUID;
                if (state.currentTemp >= BP) {
                    state.currentTemp = BP; state.phase = 'BOILING'; state.latentBuffer = 0;
                }
            } else if (state.phase === 'BOILING') {
                state.latentBuffer += heatInput;
                if (state.latentBuffer >= L_VAPOR) state.phase = 'GAS';
            } else if (state.phase === 'GAS') {
                state.currentTemp += heatInput / C_GAS;
                if (state.currentTemp > 140) setHeating(false);
            }

            state.currentTime += 1;
            setDisplayTemp(state.currentTemp);
            setStateLabel(formatPhase(state.phase));
            if (state.currentTime % 5 === 0) state.history.push({ t: state.currentTime, T: state.currentTemp });

            // 2. 質點動畫邏輯
            const ps = state.particles;
            const T = state.currentTemp;
            ps.forEach(p => {
                if (state.phase === 'SOLID' || state.phase === 'MELTING') {
                    const vib = (T + 30) * 0.05 + (state.phase === 'MELTING' ? (state.latentBuffer/L_FUSION)*5 : 0);
                    p.x = p.baseX + (Math.random() - 0.5) * vib;
                    p.y = p.baseY + (Math.random() - 0.5) * vib;
                } else if (state.phase === 'LIQUID' || state.phase === 'BOILING') {
                    p.vx += (Math.random() - 0.5) * 0.8;
                    p.vy += (Math.random() - 0.5) * 0.8 + 0.1; // 重力
                    p.vx *= 0.95; p.vy *= 0.95;
                    p.x += p.vx; p.y += p.vy;
                    if (p.y > CONTAINER_HEIGHT - 5) { p.y = CONTAINER_HEIGHT - 5; p.vy *= -0.5; }
                    if (p.x < 5) { p.x = 5; p.vx *= -0.5; }
                    if (p.x > CONTAINER_WIDTH - 5) { p.x = CONTAINER_WIDTH - 5; p.vx *= -0.5; }
                } else {
                    p.vx += (Math.random() - 0.5) * 1.2;
                    p.vy += (Math.random() - 0.5) * 1.2;
                    p.x += p.vx; p.y += p.vy;
                    if (p.y < 5 || p.y > CONTAINER_HEIGHT - 5) p.vy *= -1;
                    if (p.x < 5 || p.x > CONTAINER_WIDTH - 5) p.vx *= -1;
                }
            });

            drawParticles();
            drawGraph();
            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        const formatPhase = (p) => {
            switch(p) {
                case 'SOLID': return '固態 (升溫中)';
                case 'MELTING': return '熔化中 (相變)';
                case 'LIQUID': return '液態 (升溫中)';
                case 'BOILING': return '沸騰中 (相變)';
                case 'GAS': return '氣態 (升溫中)';
                default: return p;
            }
        };

        const drawParticles = () => {
            const ctx = particleCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CONTAINER_WIDTH, CONTAINER_HEIGHT);
            ctx.strokeStyle = '#334155'; ctx.strokeRect(0, 0, CONTAINER_WIDTH, CONTAINER_HEIGHT);
            const phase = simState.current.phase;
            simState.current.particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                if (phase.includes('SOLID')) ctx.fillStyle = '#60a5fa';
                else if (phase === 'MELTING') ctx.fillStyle = '#818cf8';
                else if (phase.includes('LIQUID')) ctx.fillStyle = '#34d399';
                else if (phase === 'BOILING') ctx.fillStyle = '#fbbf24';
                else ctx.fillStyle = '#f87171';
                ctx.fill();
            });
        };

        const drawGraph = () => {
            const ctx = graphCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = 600, h = 400, pad = 50;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pad, 20); ctx.lineTo(pad, h-pad); ctx.lineTo(w-20, h-pad); ctx.stroke();
            
            const mapY = (temp) => h - pad - ((temp + 30) / 180) * (h - pad - 40);
            const mapX = (t) => pad + (t / 4000) * (w - pad - 40);

            // 網格與標籤
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px Inter';
            [-20, 0, 100].forEach(v => {
                const y = mapY(v);
                ctx.fillText(`${v}°C`, 10, y + 5);
                ctx.beginPath(); ctx.moveTo(pad-5, y); ctx.lineTo(pad, y); ctx.stroke();
            });

            const history = simState.current.history;
            if (history.length < 2) return;
            ctx.beginPath(); ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 4;
            ctx.moveTo(mapX(history[0].t), mapY(history[0].T));
            history.forEach(pt => ctx.lineTo(mapX(pt.t), mapY(pt.T)));
            ctx.stroke();
        };

        useEffect(() => {
            if (heating) requestRef.current = requestAnimationFrame(updatePhysics);
            else cancelAnimationFrame(requestRef.current);
            return () => cancelAnimationFrame(requestRef.current);
        }, [heating, power]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                        <div className="bg-pink-500/20 p-2 rounded-lg"><i data-lucide="flame" className="w-6 h-6 text-pink-400"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">熔化曲線繪製器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700">主題：熱學 (Thermal Physics)</div>
                </nav>

                <main className="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-5 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                            <div className="flex justify-between items-center mb-6">
                                <div>
                                    <div className="text-slate-400 text-[10px] uppercase font-bold tracking-widest mb-1">目前狀態</div>
                                    <div className="text-xl font-bold text-white">{stateLabel}</div>
                                </div>
                                <div className="text-4xl font-mono font-black text-pink-400">{Math.round(displayTemp)}°C</div>
                            </div>
                            <div className="space-y-4">
                                <button onClick={() => setHeating(!heating)} className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center transition-all ${heating ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-pink-600 hover:bg-pink-500 text-white shadow-lg shadow-pink-900/20'}`}>
                                    <i data-lucide={heating ? "pause" : "play"} className="w-5 h-5 mr-2"></i> {heating ? "暫停加熱" : "開始加熱"}
                                </button>
                                <button onClick={() => setResetFlag(f => f+1)} className="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-slate-300 text-xs font-bold transition-colors">重設實驗</button>
                            </div>
                            <div className="mt-6 pt-6 border-t border-slate-700">
                                <label className="flex justify-between text-xs font-bold text-slate-500 uppercase mb-3"><span>加熱功率 (P)</span><span className="text-orange-400">{power}W</span></label>
                                <input type="range" min="20" max="100" value={power} onChange={(e) => setPower(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>
                        </div>

                        <div className="bg-slate-950 rounded-3xl border border-slate-800 p-6 flex flex-col items-center shadow-2xl relative overflow-hidden">
                            <div className="text-slate-600 text-[10px] font-bold uppercase tracking-widest mb-4 w-full">微觀質點模擬 (Microscopic View)</div>
                            <canvas ref={particleCanvasRef} width={CONTAINER_WIDTH} height={CONTAINER_HEIGHT} className="bg-slate-900/50 border border-slate-800" />
                            <div className={`mt-4 w-20 h-10 bg-orange-600 blur-xl rounded-full transition-opacity duration-300 ${heating ? 'opacity-60' : 'opacity-0'}`}></div>
                        </div>
                    </div>

                    <div className="lg:col-span-7 bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl flex flex-col">
                        <div className="p-4 flex justify-between items-center border-b border-slate-700 bg-slate-800/50">
                            <h3 className="font-bold text-white flex items-center text-sm"><i data-lucide="line-chart" className="w-4 h-4 mr-2 text-pink-400"></i> 溫度－時間關係圖 (T-t Graph)</h3>
                        </div>
                        <div className="flex-1 bg-slate-900 p-4 relative">
                            <canvas ref={graphCanvasRef} width={600} height={400} className="w-full h-full" />
                            {stateLabel.includes("相變") && (
                                <div className="absolute top-8 right-8 bg-pink-500/10 border border-pink-500/50 text-pink-300 px-4 py-2 rounded-xl text-xs font-bold animate-pulse">吸收潛熱中：溫度保持不變</div>
                            )}
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
