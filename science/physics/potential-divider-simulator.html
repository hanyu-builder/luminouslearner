<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分壓電路實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        .thumb-amber::-webkit-slider-thumb { border-color: #f59e0b; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const SCHEMATIC_X = 200;
    const REALISTIC_X = 600;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [vin, setVin] = useState(12); // 輸入電壓 (V)
        const [sliderPos, setSliderPos] = useState(50); // 0 (底) 到 100 (頂)
        const [totalR, setTotalR] = useState(10); // 總電阻 kOhm
        const [loadConnected, setLoadConnected] = useState(false);
        const [loadR, setLoadR] = useState(10); // 負載電阻 kOhm

        const canvasRef = useRef(null);
        const requestRef = useRef();

        // --- 物理計算 ---
        const physics = useMemo(() => {
            // R1 是上段, R2 是下段 (量度 Vout 的部分)
            const r2_raw = (sliderPos / 100) * totalR; 
            const r1_raw = totalR - r2_raw;

            let r2_effective = r2_raw;

            // 負載效應計算
            if (loadConnected) {
                // R2 與負載 RL 並聯
                if (r2_raw > 0) {
                    r2_effective = (r2_raw * loadR) / (r2_raw + loadR);
                } else {
                    r2_effective = 0;
                }
            }

            const total_circuit_R = r1_raw + r2_effective;
            const current = total_circuit_R > 0 ? vin / total_circuit_R : 0; // mA
            const vout = current * r2_effective;

            return {
                r1: r1_raw,
                r2: r2_raw,
                r2_eff: r2_effective,
                vout,
                current
            };
        }, [vin, sliderPos, totalR, loadConnected, loadR]);

        // --- 渲染功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 1. 電路原理圖 (左側) ---
            const sx = SCHEMATIC_X, sy = CENTER_Y, w = 120, h = 200;

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx - w, sy - h/2); ctx.lineTo(sx - w, sy + h/2); 
            ctx.moveTo(sx - w, sy - h/2); ctx.lineTo(sx, sy - h/2);
            ctx.moveTo(sx - w, sy + h/2); ctx.lineTo(sx, sy + h/2);
            ctx.stroke();

            drawBatterySymbol(ctx, sx - w, sy, vin);
            drawZigzagResistor(ctx, sx, sy - h/2, sx, sy + h/2);

            // 電位器滑標箭頭
            const sliderY = (sy + h/2) - (sliderPos / 100) * h;
            ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(sx + 35, sliderY); ctx.lineTo(sx, sliderY);
            ctx.moveTo(sx + 8, sliderY - 6); ctx.lineTo(sx, sliderY); ctx.lineTo(sx + 8, sliderY + 6);
            ctx.stroke();

            // 輸出電路 (Vout)
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx + 35, sliderY); ctx.lineTo(sx + 80, sliderY);
            ctx.moveTo(sx, sy + h/2); ctx.lineTo(sx + 80, sy + h/2);
            ctx.stroke();

            drawVoltmeter(ctx, sx + 80, (sliderY + (sy + h/2)) / 2, physics.vout);
            
            // 繪製連線至電壓計
            ctx.beginPath();
            ctx.moveTo(sx + 80, sliderY); ctx.lineTo(sx + 80, (sliderY + (sy + h/2)) / 2 - 20);
            ctx.moveTo(sx + 80, sy + h/2); ctx.lineTo(sx + 80, (sliderY + (sy + h/2)) / 2 + 20);
            ctx.stroke();

            // 繪製燈泡負載
            if (loadConnected) {
                const lx = sx + 145, ly = (sliderY + (sy + h/2)) / 2;
                ctx.strokeStyle = '#64748b'; ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(sx + 80, sliderY); ctx.lineTo(lx, sliderY); ctx.lineTo(lx, ly - 22);
                ctx.moveTo(sx + 80, sy + h/2); ctx.lineTo(lx, sy + h/2); ctx.lineTo(lx, ly + 22);
                ctx.stroke(); ctx.setLineDash([]);
                drawBulb(ctx, lx, ly, physics.vout);
            }

            // --- 2. 實體圖 (右側) ---
            const rx = REALISTIC_X, ry = CENTER_Y, rw = 40, rh = 250;

            // 電位器本體
            const grad = ctx.createLinearGradient(rx - rw/2, 0, rx + rw/2, 0);
            grad.addColorStop(0, '#1e293b'); grad.addColorStop(0.5, '#475569'); grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad; ctx.fillRect(rx - rw/2, ry - rh/2, rw, rh);
            
            // 線圈視覺效果
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
            for(let i=0; i<rh; i+=4) {
                ctx.beginPath(); ctx.moveTo(rx - rw/2, ry - rh/2 + i); ctx.lineTo(rx + rw/2, ry - rh/2 + i + 2); ctx.stroke();
            }

            // 實體滑塊
            const handleY = (ry + rh/2) - (sliderPos / 100) * rh;
            ctx.fillStyle = '#f59e0b'; ctx.shadowBlur = 10; ctx.shadowColor = '#f59e0b44';
            ctx.fillRect(rx - rw/2 - 12, handleY - 12, rw + 24, 24); ctx.shadowBlur = 0;
            
            // 端子繪製
            drawTerminal(ctx, rx, ry - rh/2 - 12, '#ef4444', "V_in"); 
            drawTerminal(ctx, rx, ry + rh/2 + 12, '#000000', "GND"); 
            drawTerminal(ctx, rx + rw/2 + 18, handleY, '#38bdf8', "V_out");

            // 實體導線連接
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(rx, ry - rh/2 - 12); ctx.lineTo(rx, ry - rh/2 - 50); ctx.stroke();
            ctx.fillStyle = '#ef4444'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'right';
            ctx.fillText(`+${vin}V`, rx - 15, ry - rh/2 - 55);

            ctx.strokeStyle = '#64748b'; ctx.beginPath(); ctx.moveTo(rx, ry + rh/2 + 12); ctx.lineTo(rx, ry + rh/2 + 50); ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.fillText(`0V`, rx - 15, ry + rh/2 + 65);

            ctx.strokeStyle = '#38bdf8'; ctx.beginPath();
            ctx.moveTo(rx + rw/2 + 18, handleY); ctx.bezierCurveTo(rx + 110, handleY, rx + 110, ry, rx + 160, ry); ctx.stroke();

            // 標註物理分段 R1/R2
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'right';
            if (sliderPos < 95) ctx.fillText(`R₁: ${physics.r1.toFixed(1)}kΩ`, rx - 45, (ry - rh/2 + handleY)/2);
            if (sliderPos > 5) ctx.fillText(`R₂: ${physics.r2.toFixed(1)}kΩ`, rx - 45, (ry + rh/2 + handleY)/2);

            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Inter'; ctx.textAlign = 'center';
            ctx.fillText("電路原理圖", sx, 50); ctx.fillText("實體接線圖", rx, 50);
        };

        const drawBatterySymbol = (ctx, x, y, v) => {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            ctx.clearRect(x-12, y-15, 24, 30);
            ctx.fillStyle = '#0f172a'; ctx.fillRect(x-12, y-15, 24, 30);
            ctx.beginPath(); ctx.moveTo(x-12, y-10); ctx.lineTo(x+12, y-10); ctx.stroke();
            ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x-8, y+8); ctx.lineTo(x+8, y+8); ctx.stroke();
            ctx.font = 'bold 13px JetBrains Mono'; ctx.fillStyle = '#facc15'; ctx.textAlign = 'right';
            ctx.fillText(`${v}V`, x - 35, y + 5);
        };

        const drawZigzagResistor = (ctx, x1, y1, x2, y2) => {
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x1, y1);
            const steps = 10, h = y2 - y1, step = h / steps;
            for(let i=1; i<steps; i++) {
                const off = (i%2 === 0) ? -8 : 8;
                ctx.lineTo(x1 + off, y1 + i*step);
            }
            ctx.lineTo(x1, y2); ctx.stroke();
        };

        const drawVoltmeter = (ctx, x, y, v) => {
            ctx.fillStyle = '#020617'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
            ctx.fillText(v.toFixed(1) + "V", x, y + 4);
        };

        const drawTerminal = (ctx, x, y, color, label) => {
            ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'left';
            ctx.fillText(label, x + 12, y + 4);
        };

        const drawBulb = (ctx, x, y, v) => {
            const br = Math.min(1, v / 12);
            ctx.fillStyle = `rgba(253, 224, 71, ${0.1 + br * 0.85})`;
            ctx.shadowColor = '#facc15'; ctx.shadowBlur = br * 25;
            ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x-8, y+10); ctx.lineTo(x, y-5); ctx.lineTo(x+8, y+10); ctx.stroke();
        };

        useEffect(() => { draw(); }, [physics, sliderPos, loadConnected]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 h-16 shadow-xl z-10">
                    <div className="flex items-center space-x-3">
                        <div className="bg-amber-500/20 p-2 rounded-lg text-amber-500"><i data-lucide="zap"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">分壓電路實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Potentiometer Theory</div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-4 gap-1">
                        <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800 flex items-center justify-center">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/80 px-6 py-2 rounded-full border border-slate-700 text-xs text-slate-400 animate-pulse backdrop-blur-sm">
                                使用右側滑桿調節電位器位置 &uarr;&darr;
                            </div>
                        </div>

                        <div className="lg:col-span-1 bg-slate-900 flex flex-col h-full overflow-y-auto custom-scroll p-6 space-y-8 shadow-2xl">
                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">輸出電壓 (V<sub>out</sub>)</h3>
                                <div className="bg-slate-950 p-6 rounded-3xl border border-slate-800 text-center shadow-inner">
                                    <div className="text-5xl font-black text-sky-400 font-mono tracking-tighter">{physics.vout.toFixed(2)} <span className="text-xl">V</span></div>
                                    <div className="text-[10px] text-slate-500 mt-3 font-bold uppercase tracking-widest italic">佔輸入電壓之 {((physics.r2_eff / (physics.r1 + physics.r2_eff)) * 100).toFixed(1)}%</div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-amber-400 uppercase tracking-widest mb-4"><span>滑標位置 (比例)</span><span className="text-white font-mono">{sliderPos}%</span></label>
                                    <input type="range" min="0" max="100" step="1" value={sliderPos} onChange={(e)=>setSliderPos(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-amber" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase italic"><span>0V (低)</span><span>Max (高)</span></div>
                                </div>

                                <div className="h-px bg-slate-800"></div>

                                <div>
                                    <label className="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">輸入電壓 (V<sub>in</sub>) <span>{vin} V</span></label>
                                    <input type="range" min="3" max="24" step="1" value={vin} onChange={(e)=>setVin(Number(e.target.value))} className="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                </div>

                                <div className="space-y-4 pt-4 border-t border-slate-800">
                                    <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-800 transition-colors">
                                        <div className="flex items-center gap-2"><i data-lucide="lightbulb" className={`w-4 h-4 ${loadConnected ? 'text-yellow-400' : 'text-slate-500'}`}></i><span className="text-xs font-bold text-slate-300 uppercase tracking-widest">連接負載 (燈泡)</span></div>
                                        <div className={`w-10 h-5 rounded-full relative transition-colors ${loadConnected ? 'bg-emerald-600' : 'bg-slate-700'}`}>
                                            <input type="checkbox" checked={loadConnected} onChange={()=>setLoadConnected(!loadConnected)} className="opacity-0 w-full h-full absolute cursor-pointer z-10" />
                                            <div className={`w-3 h-3 bg-white rounded-full absolute top-1 transition-all ${loadConnected ? 'left-6' : 'left-1'}`}></div>
                                        </div>
                                    </label>
                                    {loadConnected && (
                                        <div className="px-4 animate-in fade-in slide-in-from-top-2 duration-300">
                                            <label className="flex justify-between text-[10px] font-bold text-emerald-400 uppercase mb-3">負載電阻 (R<sub>L</sub>) <span>{loadR} kΩ</span></label>
                                            <input type="range" min="1" max="50" value={loadR} onChange={(e)=>setLoadR(Number(e.target.value))} className="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-3xl shadow-inner mt-auto">
                                <h4 className="text-indigo-400 font-bold text-[10px] uppercase mb-2 flex items-center gap-2"><i data-lucide="info" className="w-3 h-3"></i> 負載效應提醒</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                    請注意：當連接負載時，輸出電壓會<b>下降</b>。這是因為負載電阻與 R₂ 並聯，減小了該段的總電阻。負載電阻 R<sub>L</sub> 愈小，壓降愈明顯。
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
