<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脈衝疊加模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-red::-webkit-slider-thumb { border-color: #ef4444; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 400;
    const CENTER_Y = 200;

    const App = () => {
        // --- 狀態 ---
        const [ampA, setAmpA] = useState(1.0); 
        const [widthA, setWidthA] = useState(1.0); 
        const [ampB, setAmpB] = useState(1.0); 
        const [widthB, setWidthB] = useState(1.0); 

        const [simState, setSimState] = useState('idle'); 
        const [simSpeed, setSimSpeed] = useState(1.0);
        const [showGhost, setShowGhost] = useState(true);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const timeRef = useRef(0);
        const lastTimeRef = useRef(0);

        // 使用 Ref 存儲參數以避免動畫循環中的閉包問題
        const paramsRef = useRef({ ampA, widthA, ampB, widthB, showGhost, simSpeed, simState });

        useEffect(() => {
            paramsRef.current = { ampA, widthA, ampB, widthB, showGhost, simSpeed, simState };
            // 如果處於非運行狀態，則手動重繪一幀以反映滑桿調整
            if (simState !== 'running') draw(timeRef.current);
        }, [ampA, widthA, ampB, widthB, showGhost, simSpeed, simState]);

        /**
         * 計算高斯脈衝 (Gaussian Pulse) 的位移
         * y = A * exp(-(x - center)^2 / (2 * sigma^2))
         */
        const getPulseY = (x, amp, width, centerPos) => {
            const sigma = width * 40; 
            const dx = x - centerPos;
            // 回傳負值，因為 Canvas 的 Y 軸向下為正
            return -amp * 100 * Math.exp(-(dx * dx) / (2 * sigma * sigma));
        };

        const resetSim = () => {
            setSimState('idle');
            cancelAnimationFrame(requestRef.current);
            timeRef.current = 0;
            draw(0);
        };

        const toggleSim = () => {
            if (simState === 'running') {
                setSimState('paused');
            } else {
                setSimState('running');
                lastTimeRef.current = performance.now();
                requestRef.current = requestAnimationFrame(loop);
            }
        };

        const loop = (timestamp) => {
            if (paramsRef.current.simState !== 'running') return;
            
            const dt = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;
            // 根據模擬速度調整時間步長
            const safeDt = Math.min(dt, 0.1) * paramsRef.current.simSpeed;
            
            timeRef.current += safeDt;

            // 如果脈衝已經穿過彼此一段距離，則停止模擬
            if (timeRef.current > 6.0) {
                setSimState('finished');
                draw(timeRef.current);
                return;
            }

            draw(timeRef.current);
            requestRef.current = requestAnimationFrame(loop);
        };

        /**
         * 繪製畫布內容
         */
        const draw = (t) => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const { ampA, widthA, ampB, widthB, showGhost } = paramsRef.current;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製背景與中心基準線
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

            // 計算兩個脈衝的當前中心位置
            const speed = 140; 
            const posA = 100 + speed * t;
            const posB = 700 - speed * t;

            // 2. 繪製單獨的脈衝分量 (虛線標示)
            if (showGhost) {
                ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
                
                // 脈衝 A (向右運動，藍色)
                ctx.beginPath(); ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
                for (let x = 0; x <= CANVAS_WIDTH; x += 4) {
                    const y = CENTER_Y + getPulseY(x, ampA, widthA, posA);
                    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // 脈衝 B (向左運動，紅色)
                ctx.beginPath(); ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                for (let x = 0; x <= CANVAS_WIDTH; x += 4) {
                    const y = CENTER_Y + getPulseY(x, ampB, widthB, posB);
                    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 3. 繪製疊加後的合成波 (Superposition, 金色)
            ctx.beginPath();
            ctx.lineWidth = 5; ctx.strokeStyle = '#fbbf24'; 
            ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 8;
            
            for (let x = 0; x <= CANVAS_WIDTH; x += 2) {
                const yA = getPulseY(x, ampA, widthA, posA);
                const yB = getPulseY(x, ampB, widthB, posB);
                // y_total = yA + yB
                const yTotal = CENTER_Y + yA + yB;
                if (x === 0) ctx.moveTo(x, yTotal); else ctx.lineTo(x, yTotal);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 4. 左上角時間標記
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px JetBrains Mono';
            ctx.fillText(`時間 t = ${t.toFixed(2)}s`, 20, 30);
            
            if (window.lucide) window.lucide.createIcons();
        };

        useEffect(() => {
            draw(0);
            return () => cancelAnimationFrame(requestRef.current);
        }, []);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400">
                            <i data-lucide="waves"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">脈衝疊加模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase">
                        Topic: Wave Superposition
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-12">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[400px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/80 px-6 py-2 rounded-full border border-slate-700 font-bold text-sm backdrop-blur-md">
                                {simState === 'ready' || simState === 'idle' ? '等待啟動' : simState === 'paused' ? '已暫停' : simState === 'finished' ? '演示結束' : '波包傳遞中...'}
                            </div>
                            <div className="absolute bottom-6 right-6 flex gap-3">
                                <button onClick={() => setSimSpeed(simSpeed === 1 ? 0.2 : 1)} className={`px-4 py-1.5 rounded-xl border text-xs font-bold transition-all flex items-center gap-2 ${simSpeed < 1 ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400'}`}>
                                    <i data-lucide="clock" className="w-3.5 h-3.5"></i> 慢動作
                                </button>
                                <button onClick={() => setShowGhost(!showGhost)} className={`px-4 py-1.5 rounded-xl border text-xs font-bold transition-all flex items-center gap-2 ${showGhost ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400'}`}>
                                    <i data-lucide="eye" className="w-3.5 h-3.5"></i> 顯示分量波
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div className="space-y-6">
                            <h3 className="text-blue-400 font-bold flex items-center gap-2 uppercase tracking-widest text-sm">
                                <div className="w-2 h-2 rounded-full bg-blue-500"></div> 脈衝 A (向右)
                            </h3>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-slate-400 mb-2">振幅 (Amplitude) <span className="text-white font-mono">{ampA.toFixed(1)}</span></label>
                                <input type="range" min="-1.5" max="1.5" step="0.1" value={ampA} onChange={(e) => setAmpA(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                            </div>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-slate-400 mb-2">波寬 (Width) <span className="text-white font-mono">{widthA.toFixed(1)}</span></label>
                                <input type="range" min="0.5" max="2.0" step="0.1" value={widthA} onChange={(e) => setWidthA(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                            </div>
                        </div>

                        <div className="space-y-6">
                            <h3 className="text-red-400 font-bold flex items-center gap-2 uppercase tracking-widest text-sm">
                                <div className="w-2 h-2 rounded-full bg-red-500"></div> 脈衝 B (向左)
                            </h3>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-slate-400 mb-2">振幅 (Amplitude) <span className="text-white font-mono">{ampB.toFixed(1)}</span></label>
                                <input type="range" min="-1.5" max="1.5" step="0.1" value={ampB} onChange={(e) => setAmpB(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" />
                            </div>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-slate-400 mb-2">波寬 (Width) <span className="text-white font-mono">{widthB.toFixed(1)}</span></label>
                                <input type="range" min="0.5" max="2.0" step="0.1" value={widthB} onChange={(e) => setWidthB(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" />
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 flex flex-col gap-4">
                        <button onClick={toggleSim} disabled={simState === 'finished'} className={`flex-1 py-4 rounded-3xl font-bold text-xl flex items-center justify-center gap-3 transition-all shadow-lg ${simState === 'running' ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}>
                            <i data-lucide={simState === 'running' ? "pause" : "play"} />
                            {simState === 'running' ? "暫停" : simState === 'paused' ? "繼續" : "開始模擬"}
                        </button>
                        <button onClick={resetSim} className="py-4 bg-slate-700 text-white rounded-3xl font-bold hover:bg-slate-600 transition-colors border border-slate-600 flex items-center justify-center gap-2 active:scale-95">
                            <i data-lucide="rotate-ccw" className="w-5 h-5"></i> 重設
                        </button>
                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-5 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2"><i data-lucide="lightbulb" className="w-4 h-4"></i> 疊加原理</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                當兩列波在同一介質中相遇時，介質質點的總位移等於各列波單獨引起位移的<b>代數和</b>：{'$y_{total} = y_A + y_B$'}。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
