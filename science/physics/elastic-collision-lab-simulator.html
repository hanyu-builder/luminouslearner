<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彈性碰撞模擬實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
        }
        .thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
        .thumb-red::-webkit-slider-thumb { background: #ef4444; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 400;
    const TRACK_Y = 250;
    const PIXELS_PER_METER = 50;

    const App = () => {
        // --- 狀態設定 ---
        const [m1, setM1] = useState(2.0); 
        const [u1, setU1] = useState(4.0); 
        const [m2, setM2] = useState(1.0); 
        const [u2, setU2] = useState(-2.0); 

        const [elasticity, setElasticity] = useState(1.0); 
        const [simSpeed, setSimSpeed] = useState(1.0); 
        const [simState, setSimState] = useState('idle'); 

        const [p1, setP1] = useState({ x: 200, v: 0 });
        const [p2, setP2] = useState({ x: 600, v: 0 });
        
        const [initialStats, setInitialStats] = useState(null);
        const [currentStats, setCurrentStats] = useState(null);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const physicsRef = useRef({ x1: 200, v1: 0, x2: 600, v2: 0, collided: false });

        const resetSim = () => {
            setSimState('idle');
            cancelAnimationFrame(requestRef.current);
            physicsRef.current = {
                x1: 200, v1: u1 * PIXELS_PER_METER,
                x2: 600, v2: u2 * PIXELS_PER_METER,
                collided: false
            };
            setP1({ x: 200, v: u1 }); setP2({ x: 600, v: u2 });
            setInitialStats(null); setCurrentStats(null);
            draw();
        };

        const calculateCollision = () => {
            const v1_i = u1; const v2_i = u2;
            const totalP = m1 * v1_i + m2 * v2_i;
            const v2_f = (totalP + m1 * elasticity * (v1_i - v2_i)) / (m1 + m2);
            const v1_f = v2_f - elasticity * (v1_i - v2_i);
            return { v1_f, v2_f };
        };

        const startSim = () => {
            if (simState === 'running') return;
            const P_i = m1 * u1 + m2 * u2;
            const KE_i = 0.5 * m1 * u1*u1 + 0.5 * m2 * u2*u2;
            setInitialStats({ P: P_i, KE: KE_i });
            setSimState('running');
            physicsRef.current.v1 = u1 * PIXELS_PER_METER;
            physicsRef.current.v2 = u2 * PIXELS_PER_METER;
            physicsRef.current.collided = false;
            loop();
        };

        const loop = () => {
            const state = physicsRef.current;
            const dt = 0.016 * simSpeed;
            state.x1 += state.v1 * dt; state.x2 += state.v2 * dt;
            const dist = state.x2 - state.x1;
            const minDist = 80;

            if (dist <= minDist && !state.collided) {
                state.collided = true;
                const { v1_f, v2_f } = calculateCollision();
                state.v1 = v1_f * PIXELS_PER_METER;
                state.v2 = v2_f * PIXELS_PER_METER;
                const overlap = minDist - dist;
                state.x1 -= overlap / 2; state.x2 += overlap / 2;
            }

            if (state.x1 < -100 || state.x2 > CANVAS_WIDTH + 100) {
                setSimState('finished');
                const v1_curr = state.v1 / PIXELS_PER_METER; const v2_curr = state.v2 / PIXELS_PER_METER;
                setCurrentStats({ P: m1 * v1_curr + m2 * v2_curr, KE: 0.5 * m1 * v1_curr*v1_curr + 0.5 * m2 * v2_curr*v2_curr });
                draw(); return;
            }

            setP1({ x: state.x1, v: state.v1 / PIXELS_PER_METER });
            setP2({ x: state.x2, v: state.v2 / PIXELS_PER_METER });
            const v1_now = state.v1 / PIXELS_PER_METER; const v2_now = state.v2 / PIXELS_PER_METER;
            setCurrentStats({ P: m1 * v1_now + m2 * v2_now, KE: 0.5 * m1 * v1_now*v1_now + 0.5 * m2 * v2_now*v2_now });

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = '#334155'; ctx.fillRect(0, TRACK_Y + 25, CANVAS_WIDTH, 10);
            ctx.fillStyle = '#475569';
            for (let x=0; x<CANVAS_WIDTH; x+=50) ctx.fillRect(x, TRACK_Y + 25, 2, 10);

            const drawCart = (x, mass, color, vel, label) => {
                const w = 80; const h = 50; const y = TRACK_Y - 25;
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.arc(x - 25, y + 25, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 25, y + 25, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x - w/2, y - h/2, w, h, 8); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`${mass}kg`, x, y + 5);
                const arrowLen = vel * 15;
                if (Math.abs(arrowLen) > 2) {
                    const arrowY = y - 40;
                    ctx.beginPath(); ctx.moveTo(x, arrowY); ctx.lineTo(x + arrowLen, arrowY);
                    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
                    ctx.beginPath(); ctx.fillStyle = color;
                    if (vel > 0) { ctx.moveTo(x + arrowLen, arrowY); ctx.lineTo(x + arrowLen - 8, arrowY - 5); ctx.lineTo(x + arrowLen - 8, arrowY + 5); }
                    else { ctx.moveTo(x + arrowLen, arrowY); ctx.lineTo(x + arrowLen + 8, arrowY - 5); ctx.lineTo(x + arrowLen + 8, arrowY + 5); }
                    ctx.fill();
                    ctx.font = 'bold 12px monospace'; ctx.fillText(`${vel.toFixed(1)} m/s`, x, arrowY - 10);
                }
            };

            drawCart(physicsRef.current.x1, m1, '#3b82f6', p1.v, '1');
            drawCart(physicsRef.current.x2, m2, '#ef4444', p2.v, '2');
        };

        useEffect(() => { resetSim(); return () => cancelAnimationFrame(requestRef.current); }, [m1, m2, u1, u2, elasticity]);
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        const StatBox = ({ label, valInit, valCurr, unit, match }) => (
            <div className={`p-4 rounded-2xl border transition-all ${match ? 'bg-emerald-900/10 border-emerald-500/30' : 'bg-orange-900/10 border-orange-500/30'}`}>
                <div className="text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-3">{label}</div>
                <div className="flex justify-between items-center gap-4">
                    <div className="flex-1">
                        <div className="text-[9px] text-slate-500 font-bold uppercase">碰撞前</div>
                        <div className="font-mono font-bold text-white text-lg">{valInit != null ? valInit.toFixed(2) : '--'}</div>
                    </div>
                    <div className="text-slate-700 font-black">▶</div>
                    <div className="flex-1 text-right">
                        <div className="text-[9px] text-slate-500 font-bold uppercase">碰撞後</div>
                        <div className={`font-mono font-black text-lg ${match ? 'text-emerald-400' : 'text-orange-400'}`}>{valCurr != null ? valCurr.toFixed(2) : '--'}</div>
                    </div>
                </div>
                <div className="text-right text-[9px] text-slate-600 font-bold mt-2 uppercase tracking-widest">{unit}</div>
            </div>
        );

        const keMatch = currentStats && initialStats && Math.abs(currentStats.KE - initialStats.KE) < 0.1;

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 flex flex-col overflow-hidden">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg h-16 shrink-0">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-600 p-2 rounded-lg"><i data-lucide="activity" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">彈性碰撞模擬實驗室</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-indigo-400 border border-slate-700 uppercase">DSE Physics: Momentum</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 space-y-6 overflow-y-auto custom-scroll flex-1">
                    <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[300px] bg-black/20">
                        <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                        <div className="absolute top-4 right-4 flex gap-2">
                            <button onClick={() => setSimSpeed(simSpeed === 1 ? 0.2 : 1)} className={`px-4 py-1.5 text-[10px] font-black uppercase tracking-widest rounded-full border transition-all ${simSpeed < 1 ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-600 text-slate-400'}`}>
                                <i data-lucide="clock" className="w-3 h-3 inline mr-1"></i> 慢動作模式
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
                            <h3 className="text-blue-400 font-black text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><i data-lucide="info" className="w-4 h-4"></i> 滑車 1 參數 (藍色)</h3>
                            <div className="grid grid-cols-2 gap-6">
                                <div><div className="flex justify-between text-[11px] font-bold text-slate-400 mb-2 uppercase"><span>質量 m1</span><span className="text-white font-mono">{m1} kg</span></div>
                                <input type="range" min="0.5" max="10.0" step="0.5" value={m1} onChange={(e)=>setM1(Number(e.target.value))} disabled={simState==='running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" /></div>
                                <div><div className="flex justify-between text-[11px] font-bold text-slate-400 mb-2 uppercase"><span>初速 u1</span><span className="text-white font-mono">{u1} m/s</span></div>
                                <input type="range" min="-10" max="10" step="1" value={u1} onChange={(e)=>setU1(Number(e.target.value))} disabled={simState==='running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" /></div>
                            </div>
                        </div>
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
                            <h3 className="text-red-400 font-black text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><i data-lucide="info" className="w-4 h-4"></i> 滑車 2 參數 (紅色)</h3>
                            <div className="grid grid-cols-2 gap-6">
                                <div><div className="flex justify-between text-[11px] font-bold text-slate-400 mb-2 uppercase"><span>質量 m2</span><span className="text-white font-mono">{m2} kg</span></div>
                                <input type="range" min="0.5" max="10.0" step="0.5" value={m2} onChange={(e)=>setM2(Number(e.target.value))} disabled={simState==='running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" /></div>
                                <div><div className="flex justify-between text-[11px] font-bold text-slate-400 mb-2 uppercase"><span>初速 u2</span><span className="text-white font-mono">{u2} m/s</span></div>
                                <input type="range" min="-10" max="10" step="1" value={u2} onChange={(e)=>setU2(Number(e.target.value))} disabled={simState==='running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" /></div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col justify-between">
                            <div className="space-y-4">
                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest">恢復係數 Elasticity (e)</label>
                                <div className="flex items-center gap-4 bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                    <input type="range" min="0" max="1" step="0.1" value={elasticity} onChange={(e)=>setElasticity(Number(e.target.value))} disabled={simState==='running'} className="flex-1 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                    <span className="font-mono text-emerald-400 font-black w-8 text-right">{elasticity}</span>
                                </div>
                                <div className="text-[10px] text-slate-500 font-bold italic leading-tight uppercase">1.0 = 完全彈性 (KE 守恆)<br/>0.0 = 完全非彈性 (黏合)</div>
                            </div>
                            <div className="grid grid-cols-2 gap-3 mt-6">
                                <button onClick={startSim} disabled={simState==='running'} className={`py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg transition-all flex items-center justify-center gap-2 ${simState==='running' ? 'bg-slate-700 text-slate-600' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}><i data-lucide="play" className="w-4 h-4"></i> 開始</button>
                                <button onClick={resetSim} className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-black text-xs uppercase tracking-widest transition-all flex items-center justify-center gap-2 border border-slate-600"><i data-lucide="rotate-ccw" className="w-4 h-4"></i> 重置</button>
                            </div>
                        </div>

                        <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <StatBox label="系統總動量 (Total Momentum P)" valInit={initialStats?.P} valCurr={currentStats?.P} unit="kg·m/s" match={true} />
                            <StatBox label="系統總動能 (Total Kinetic Energy KE)" valInit={initialStats?.KE} valCurr={currentStats?.KE} unit="Joules (J)" match={keMatch || elasticity < 1} />
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 150);
</script>
</body>
</html>
