<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓周運動向量實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-green::-webkit-slider-thumb { background: #10b981; }
        .thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 450;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const SCALE = 50; // 50 像素 = 1 公尺

    const App = () => {
        // --- 狀態 ---
        const [radius, setRadius] = useState(3.0); // 公尺
        const [omega, setOmega] = useState(1.0); // 弧度/秒 (rad/s)
        const [isRunning, setIsRunning] = useState(false);
        const [showVelocity, setShowVelocity] = useState(true);
        const [showAcceleration, setShowAcceleration] = useState(true);
        const [showComponents, setShowComponents] = useState(false);

        // 即時數據
        const [angle, setAngle] = useState(0); 
        const [time, setTime] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const prevTimeRef = useRef(0);
        const isRunningRef = useRef(false);

        // 物理運算
        const velocityMag = radius * omega; // v = r * w
        const accelMag = radius * omega * omega; // a = r * w^2

        // --- 邏輯 ---
        const resetSim = () => {
            setIsRunning(false);
            isRunningRef.current = false;
            cancelAnimationFrame(requestRef.current);
            setAngle(0);
            setTime(0);
            setTimeout(() => draw(0), 0);
        };

        const toggleSim = () => {
            if (isRunning) {
                setIsRunning(false);
                isRunningRef.current = false;
                cancelAnimationFrame(requestRef.current);
            } else {
                setIsRunning(true);
                isRunningRef.current = true;
                prevTimeRef.current = performance.now();
                requestRef.current = requestAnimationFrame(loop);
            }
        };

        const loop = (timestamp) => {
            if (!isRunningRef.current) return;
            const dt = (timestamp - prevTimeRef.current) / 1000;
            const safeDt = Math.min(dt, 0.1); 
            prevTimeRef.current = timestamp;

            setAngle(prev => (prev + omega * safeDt) % (2 * Math.PI));
            setTime(t => t + safeDt);

            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 渲染功能 ---
        const draw = (currentAngle) => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製軸線與格網
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(CENTER_X, 0); ctx.lineTo(CENTER_X, CANVAS_HEIGHT);
            ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y);
            ctx.stroke();
            
            // 軌道圓周
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, radius * SCALE, 0, 2 * Math.PI);
            ctx.strokeStyle = '#475569'; ctx.setLineDash([5, 5]);
            ctx.stroke(); ctx.setLineDash([]);

            // 2. 物體位置
            const px = CENTER_X + radius * SCALE * Math.cos(currentAngle);
            const py = CENTER_Y - radius * SCALE * Math.sin(currentAngle);

            // 半徑連線
            ctx.beginPath(); ctx.moveTo(CENTER_X, CENTER_Y); ctx.lineTo(px, py);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 2; ctx.stroke();

            // 質點
            ctx.beginPath(); ctx.arc(px, py, 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#facc15'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

            // 3. 向量繪製
            const vScale = 15;
            const aScale = 15;

            // 速度向量 (切向)
            if (showVelocity) {
                const mathVAngle = currentAngle + Math.PI / 2;
                const vx = velocityMag * Math.cos(mathVAngle);
                const vy = velocityMag * Math.sin(mathVAngle); 
                drawArrow(ctx, px, py, vx * vScale, -vy * vScale, '#10b981', 'v');
                if (showComponents) {
                    drawComponent(ctx, px, py, vx * vScale, 0, '#10b981', 'vx');
                    drawComponent(ctx, px, py, 0, -vy * vScale, '#10b981', 'vy');
                }
            }

            // 加速度向量 (向心)
            if (showAcceleration) {
                const mathAAngle = currentAngle + Math.PI; 
                const ax = accelMag * Math.cos(mathAAngle);
                const ay = accelMag * Math.sin(mathAAngle);
                drawArrow(ctx, px, py, ax * aScale, -ay * aScale, '#ef4444', 'a');
                if (showComponents) {
                    drawComponent(ctx, px, py, ax * aScale, 0, '#ef4444', 'ax');
                    drawComponent(ctx, px, py, 0, -ay * aScale, '#ef4444', 'ay');
                }
            }
        };

        const drawArrow = (ctx, x, y, dx, dy, color, label) => {
            const toX = x + dx, toY = y + dy;
            const angle = Math.atan2(dy, dx);
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.moveTo(x, y); ctx.lineTo(toX, toY); ctx.stroke();
            const headLen = 8;
            ctx.beginPath(); ctx.fillStyle = color; ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI/6), toY - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI/6), toY - headLen * Math.sin(angle + Math.PI/6));
            ctx.fill();
            ctx.fillStyle = color; ctx.font = 'bold 14px Inter'; ctx.fillText(label, toX + 5, toY - 5);
        };

        const drawComponent = (ctx, x, y, dx, dy, color, label) => {
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
            ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.fillStyle = color; ctx.arc(x + dx, y + dy, 2.5, 0, Math.PI*2); ctx.fill();
        };

        useEffect(() => { draw(angle); }, [angle, radius, omega, showVelocity, showAcceleration, showComponents]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        const Graph = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const ctx = canvasRef.current?.getContext('2d');
                if(!ctx) return;
                const w = 300, h = 100;
                ctx.clearRect(0,0,w,h);
                ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
                ctx.lineWidth = 2;
                // Vx
                ctx.beginPath(); ctx.strokeStyle = '#10b981';
                for(let i=0; i<w; i++) {
                    const phase = angle - (w - i) * 0.05;
                    const val = -Math.sin(phase) * 30;
                    if (i===0) ctx.moveTo(i, h/2 + val); else ctx.lineTo(i, h/2 + val);
                }
                ctx.stroke();
                // Vy
                ctx.beginPath(); ctx.strokeStyle = '#059669'; ctx.setLineDash([2,2]);
                for(let i=0; i<w; i++) {
                    const phase = angle - (w - i) * 0.05;
                    const val = Math.cos(phase) * 30;
                    if (i===0) ctx.moveTo(i, h/2 + val); else ctx.lineTo(i, h/2 + val);
                }
                ctx.stroke(); ctx.setLineDash([]);
            }, [angle]);
            return <canvas ref={canvasRef} width={300} height={100} className="w-full h-full" />;
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-emerald-500/20 p-2 rounded-lg text-emerald-400">
                            <i data-lucide="refresh-cw"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">圓周運動向量實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        主題：運動學 (Kinematics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 left-6 bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700 text-xs shadow-lg backdrop-blur-md">
                                <div className="text-slate-500 font-bold uppercase mb-1">經歷時間</div>
                                <div className="font-mono text-white text-lg">{time.toFixed(2)}s</div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <div className="flex flex-wrap gap-8 items-center">
                                <div className="flex-1 min-w-[200px]">
                                    <label className="flex justify-between text-xs text-blue-400 font-bold uppercase tracking-widest mb-3">
                                        軌道半徑 (r) <span>{radius.toFixed(1)} m</span>
                                    </label>
                                    <input type="range" min="1.0" max="4.5" step="0.1" value={radius} onChange={(e) => setRadius(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                </div>
                                <div className="flex-1 min-w-[200px]">
                                    <label className="flex justify-between text-xs text-emerald-400 font-bold uppercase tracking-widest mb-3">
                                        角速度 (ω) <span>{omega.toFixed(1)} rad/s</span>
                                    </label>
                                    <input type="range" min="0.1" max="5.0" step="0.1" value={omega} onChange={(e) => setOmega(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-green" />
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-6 items-center justify-between border-t border-slate-700 pt-6">
                                <div className="flex gap-6">
                                    <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={showVelocity} onChange={() => setShowVelocity(!showVelocity)} className="rounded text-emerald-500 bg-slate-900 border-slate-700 focus:ring-0"/><span className="text-xs font-bold text-emerald-400">顯示速度 (v)</span></label>
                                    <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={showAcceleration} onChange={() => setShowAcceleration(!showAcceleration)} className="rounded text-red-500 bg-slate-900 border-slate-700 focus:ring-0"/><span className="text-xs font-bold text-red-400">顯示加速度 (a)</span></label>
                                    <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={showComponents} onChange={() => setShowComponents(!showComponents)} className="rounded text-slate-500 bg-slate-900 border-slate-700 focus:ring-0"/><span className="text-xs font-bold text-slate-400">顯示分量</span></label>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={toggleSim} className={`px-8 py-3 rounded-2xl font-bold flex items-center shadow-lg transition-all active:scale-95 ${isRunning ? 'bg-slate-700 text-white' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}><i data-lucide={isRunning ? "pause" : "play"} className="w-5 h-5 mr-2"></i> {isRunning ? '暫停' : '開始模擬'}</button>
                                    <button onClick={resetSim} className="p-3 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl transition-all active:rotate-180"><i data-lucide="rotate-ccw"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-4">
                            <div className="bg-emerald-900/10 border border-emerald-500/20 p-5 rounded-2xl flex justify-between items-center shadow-inner">
                                <div><div className="text-emerald-400 text-[10px] font-bold uppercase mb-1 tracking-widest">切向速度 (v)</div><div className="text-xs text-slate-500 font-mono">v = r &omega;</div></div>
                                <div className="text-3xl font-black text-white font-mono tracking-tighter">{velocityMag.toFixed(2)} <span className="text-xs text-slate-600">m/s</span></div>
                            </div>
                            <div className="bg-red-900/10 border border-red-500/20 p-5 rounded-2xl flex justify-between items-center shadow-inner">
                                <div><div className="text-red-400 text-[10px] font-bold uppercase mb-1 tracking-widest">向心加速度 (ac)</div><div className="text-xs text-slate-500 font-mono">a = r &omega;&sup2;</div></div>
                                <div className="text-3xl font-black text-white font-mono tracking-tighter">{accelMag.toFixed(2)} <span className="text-xs text-slate-600">m/s&sup2;</span></div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-4">
                            <h3 className="text-slate-500 text-[10px] font-bold uppercase tracking-widest flex items-center gap-2"><i data-lucide="line-chart" className="w-3 h-3 text-emerald-400"></i> 速度分量即時波形 (vx, vy)</h3>
                            <div className="h-32 bg-slate-950 rounded-2xl border border-slate-700 p-4 shadow-inner relative flex items-center justify-center">
                                <Graph />
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/30 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-4 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理機制提示</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                為什麼恆速率運動仍有加速度？因為<b>速度是向量</b>。即便速率 (大小) 不變，<b>方向</b>卻在時刻改變。這種方向的改變需要一股指向圓心的力（與加速度），這就是「向心力」。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
