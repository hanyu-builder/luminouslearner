<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸鏡成像實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-orange::-webkit-slider-thumb { border-color: #f97316; }
        .canvas-container { cursor: ew-resize; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const MIRROR_X = 400; 
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [focalLength, setFocalLength] = useState(150); // 焦距大小
        const [objDist, setObjDist] = useState(200); // 物距
        const [objHeight, setObjHeight] = useState(80); // 物高
        const [showRays, setShowRays] = useState(true);
        const [isDragging, setIsDragging] = useState(false);

        const canvasRef = useRef(null);

        // --- 物理計算 (凸面鏡公式) ---
        // 1/f = 1/u + 1/v，凸面鏡 f 為負
        const f_val = -focalLength;
        const u_val = objDist;
        
        // 1/v = 1/f - 1/u = (-1/focal) - (1/objDist)
        // v = (f*u) / (u - f)
        const v_val = (f_val * u_val) / (u_val - f_val);
        const magnification = -v_val / u_val;
        const imgHeight = objHeight * magnification;
        
        // 像的位置：鏡後 |v| 處 (Right side)
        const imgX = MIRROR_X + Math.abs(v_val);

        // --- 互動邏輯 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const objX = MIRROR_X - objDist;
            if (Math.abs(x - objX) < 40) setIsDragging(true);
        };

        const handleMouseMove = (e) => {
            if (!isDragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            let x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            if (x > MIRROR_X - 25) x = MIRROR_X - 25;
            if (x < 30) x = 30;
            setObjDist(MIRROR_X - x);
        };

        const handleMouseUp = () => setIsDragging(false);

        // --- 渲染 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製背景
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, MIRROR_X, CANVAS_HEIGHT); // 實景區
            ctx.fillStyle = '#1e293b'; ctx.fillRect(MIRROR_X, 0, CANVAS_WIDTH - MIRROR_X, CANVAS_HEIGHT); // 虛擬區

            // 2. 主光軸
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();
            ctx.setLineDash([]);

            // 3. 繪製凸面鏡
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(MIRROR_X, CENTER_Y - 150);
            ctx.quadraticCurveTo(MIRROR_X - 45, CENTER_Y, MIRROR_X, CENTER_Y + 150);
            ctx.stroke();
            
            // 鏡背陰影
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            for(let y = -140; y <= 140; y+=12) {
                const cy = CENTER_Y + y;
                const tx = y / 150;
                const cx = MIRROR_X - 22 * (1 - tx*tx);
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 12, cy + 6); ctx.stroke();
            }

            // 4. 標記焦點 F 與球心 C (鏡後)
            const fX = MIRROR_X + focalLength;
            const cX = MIRROR_X + 2 * focalLength;
            drawPoint(ctx, fX, CENTER_Y, '#ef4444', 'F');
            drawPoint(ctx, cX, CENTER_Y, '#3b82f6', 'C');
            drawPoint(ctx, MIRROR_X, CENTER_Y, '#94a3b8', 'V');

            // 5. 繪製物體與像
            const objX = MIRROR_X - objDist;
            drawCandle(ctx, objX, CENTER_Y, objHeight, 1.0, "物體 (Object)");
            drawCandle(ctx, imgX, CENTER_Y, imgHeight, 0.5, "虛像 (Image)");

            // 6. 光路追蹤 (Ray Tracing)
            if (showRays) {
                const oY = CENTER_Y - objHeight, iY = CENTER_Y - imgHeight;

                // 射線 1: 平行光 -> 從 F 發散
                ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(objX, oY); ctx.lineTo(MIRROR_X, oY); ctx.stroke();
                // 發散部分
                const slope1 = (oY - CENTER_Y) / (MIRROR_X - fX);
                ctx.beginPath(); ctx.moveTo(MIRROR_X, oY); ctx.lineTo(0, oY - slope1 * MIRROR_X); ctx.stroke();
                // 虛擬延長線
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(MIRROR_X, oY); ctx.lineTo(fX, CENTER_Y); ctx.stroke();
                ctx.setLineDash([]);

                // 射線 2: 趨向 F -> 平行反射
                const slope2 = (CENTER_Y - oY) / (fX - objX);
                const hY2 = oY + slope2 * (MIRROR_X - objX);
                ctx.strokeStyle = '#38bdf8';
                ctx.beginPath(); ctx.moveTo(objX, oY); ctx.lineTo(MIRROR_X, hY2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(MIRROR_X, hY2); ctx.lineTo(0, hY2); ctx.stroke();
                // 虛擬延長線
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(MIRROR_X, hY2); ctx.lineTo(imgX, hY2); ctx.stroke();
                ctx.setLineDash([]);

                // 射線 3: 趨向 C -> 原路反射
                const slope3 = (CENTER_Y - oY) / (cX - objX);
                const hY3 = oY + slope3 * (MIRROR_X - objX);
                ctx.strokeStyle = '#a855f7';
                ctx.beginPath(); ctx.moveTo(objX, oY); ctx.lineTo(MIRROR_X, hY3); ctx.stroke();
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(MIRROR_X, hY3); ctx.lineTo(cX, CENTER_Y); ctx.stroke();
                ctx.setLineDash([]);
            }
        }, [focalLength, objDist, objHeight, showRays, isDragging, material]);

        const drawPoint = (ctx, x, y, color, label) => {
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
            ctx.font = 'bold 12px Inter'; ctx.fillText(label, x - 5, y + 25);
        };

        const drawCandle = (ctx, x, baseY, h, alpha, label) => {
            ctx.save(); ctx.translate(x, baseY); ctx.globalAlpha = alpha;
            ctx.fillStyle = '#fde047'; ctx.fillRect(-10, -h, 20, h); // 蠟身
            ctx.fillStyle = '#1f2937'; ctx.fillRect(-1, -h-5, 2, 5); // 燭芯
            ctx.beginPath(); ctx.arc(0, -h-10, 8, 0, Math.PI*2); ctx.fillStyle = '#ef4444'; ctx.fill(); // 焰
            ctx.beginPath(); ctx.arc(0, -h-10, 4, 0, Math.PI*2); ctx.fillStyle = '#facc15'; ctx.fill();
            ctx.fillStyle = alpha === 1 ? 'white' : '#ef4444'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
            ctx.fillText(label, 0, 25); ctx.restore();
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-400"><i data-lucide="eye"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">凸面鏡成像實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Geometric Optics</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-full object-contain canvas-container" />
                            <div className="absolute top-6 left-6 flex gap-3">
                                <div className="bg-purple-600/20 border border-purple-500/40 px-4 py-2 rounded-xl text-xs font-bold text-purple-300 backdrop-blur-md shadow-lg">成像特性：永遠為縮小、正立、虛像</div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-10 items-center">
                            <div className="flex-1 min-w-[220px]">
                                <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><span>物距 (u)</span><span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{objDist} px</span></label>
                                <input type="range" min="50" max="350" step="1" value={objDist} onChange={(e)=>setObjDist(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                            </div>
                            <div className="flex-1 min-w-[220px]">
                                <label className="flex justify-between text-xs font-bold text-orange-400 uppercase tracking-widest mb-3"><span>焦距大小 (|f|)</span><span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{focalLength} px</span></label>
                                <input type="range" min="50" max="250" step="5" value={focalLength} onChange={(e)=>setFocalLength(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-orange" />
                            </div>
                            <div className="flex gap-4">
                                <button onClick={()=>setShowRays(!showRays)} className={`px-5 py-3 rounded-2xl font-bold text-sm border transition-all ${showRays ? 'bg-cyan-600 border-cyan-400 text-white shadow-lg shadow-cyan-900/20' : 'bg-slate-900 border-slate-700 text-slate-500'}`}>顯示光線</button>
                                <button onClick={()=>{setObjDist(200); setFocalLength(150);}} className="p-3 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl transition-all active:scale-90"><i data-lucide="rotate-ccw"></i></button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="calculator" className="text-indigo-400"></i> 成像數據分析</h2>
                            <div className="space-y-4 font-mono">
                                <div className="p-4 rounded-xl bg-slate-950 border border-slate-700 text-center">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1 tracking-tighter">放大率 (M)</div>
                                    <div className="text-2xl font-black text-emerald-400">{magnification.toFixed(2)}x</div>
                                </div>
                                <div className="p-4 rounded-xl bg-slate-950 border border-slate-700 text-center">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1 tracking-tighter">像距 (v)</div>
                                    <div className="text-2xl font-black text-red-400">{v_val.toFixed(0)} px</div>
                                    <div className="text-[9px] text-slate-600 mt-1 uppercase italic">(負值代表虛像)</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase"><i data-lucide="car" className="w-4 h-4"></i> 生活應用</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                <b>"鏡中物體比看起來更近"</b><br/><br/>
                                汽車後視鏡使用凸面鏡，因為它能提供極廣的視野（Wide Field of View）。但由於成像被縮小，大腦會誤判物體距離較遠，駕駛時需多加留意。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
