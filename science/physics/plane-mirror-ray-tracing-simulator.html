<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平面鏡成像作圖模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: crosshair; }
        input[type=checkbox] { cursor: pointer; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const MIRROR_X = CANVAS_WIDTH / 2;

    const App = () => {
        // --- 狀態 ---
        const [objPos, setObjPos] = useState({ x: 200, y: 250 });
        const [eyePos, setEyePos] = useState({ x: 100, y: 100 }); 
        
        const [showVirtualRays, setShowVirtualRays] = useState(true);
        const [showNormal, setShowNormal] = useState(true);
        const [showImage, setShowImage] = useState(true);
        const [dragging, setDragging] = useState(null); 

        const canvasRef = useRef(null);

        // --- 互動邏輯 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            if (Math.hypot(x - objPos.x, y - objPos.y) < 40) {
                setDragging('obj');
            } else if (Math.hypot(x - eyePos.x, y - eyePos.y) < 40) {
                setDragging('eye');
            }
        };

        const handleMouseMove = (e) => {
            if (!dragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            let x = (e.clientX - rect.left) * scaleX;
            let y = (e.clientY - rect.top) * scaleY;

            // 限制在鏡子左側 (實景區)
            if (x > MIRROR_X - 30) x = MIRROR_X - 30;
            if (x < 30) x = 30;
            if (y < 30) y = 30;
            if (y > CANVAS_HEIGHT - 30) y = CANVAS_HEIGHT - 30;

            if (dragging === 'obj') setObjPos({ x, y });
            if (dragging === 'eye') setEyePos({ x, y });
        };

        const handleMouseUp = () => setDragging(null);

        // --- 繪圖功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製背景與區域標示
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, MIRROR_X, CANVAS_HEIGHT);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(MIRROR_X, 0, CANVAS_WIDTH - MIRROR_X, CANVAS_HEIGHT);
            
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("實景 (REAL)", MIRROR_X / 2, 60);
            ctx.fillText("虛擬 (VIRTUAL)", MIRROR_X + (CANVAS_WIDTH - MIRROR_X) / 2, 60);

            // 2. 繪製平面鏡
            ctx.strokeStyle = '#94a3b8'; 
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(MIRROR_X, 20); ctx.lineTo(MIRROR_X, CANVAS_HEIGHT - 20);
            ctx.stroke();
            
            // 鏡背斜線
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            for (let y = 30; y < CANVAS_HEIGHT - 20; y += 20) {
                ctx.beginPath();
                ctx.moveTo(MIRROR_X, y); ctx.lineTo(MIRROR_X + 12, y + 12);
                ctx.stroke();
            }

            // 3. 計算像的位置 (物距 = 像距)
            const dist = MIRROR_X - objPos.x;
            const imgX = MIRROR_X + dist;
            const imgY = objPos.y;

            // 4. 光路追蹤
            // 技巧：反射光看起來是從「像」發出的，連線「像」與「眼睛」找到反射點
            const dx = eyePos.x - imgX;
            const dy = eyePos.y - imgY;
            const m = dy / dx;
            const hitY = imgY + m * (MIRROR_X - imgX);

            // 繪製虛擬光線 (像 -> 鏡子)
            if (showVirtualRays && showImage) {
                ctx.beginPath();
                ctx.strokeStyle = '#ef4444'; 
                ctx.setLineDash([8, 6]);
                ctx.lineWidth = 2;
                ctx.moveTo(imgX, imgY); ctx.lineTo(MIRROR_X, hitY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 繪製反射光線 (鏡子 -> 眼睛)
            ctx.beginPath();
            ctx.strokeStyle = '#facc15'; 
            ctx.lineWidth = 3;
            ctx.moveTo(MIRROR_X, hitY); ctx.lineTo(eyePos.x, eyePos.y);
            ctx.stroke();
            
            // 繪製入射光線 (物體 -> 鏡子)
            ctx.beginPath();
            ctx.strokeStyle = '#facc15';
            ctx.moveTo(objPos.x, objPos.y); ctx.lineTo(MIRROR_X, hitY);
            ctx.stroke();
            
            // 繪製法線
            if (showNormal) {
                ctx.beginPath();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.moveTo(MIRROR_X - 60, hitY); ctx.lineTo(MIRROR_X + 60, hitY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.fillText("法線", MIRROR_X - 40, hitY - 5);
            }

            // 5. 繪製物體與元件
            drawCandle(ctx, objPos.x, objPos.y, 1.0, "物體 (Object)");
            if (showImage) drawCandle(ctx, imgX, imgY, 0.4, "虛像 (Image)");
            drawEye(ctx, eyePos.x, eyePos.y);
            
            // 繪製距離測量
            const measureY = CANVAS_HEIGHT - 40;
            drawDimension(ctx, objPos.x, measureY, MIRROR_X, measureY, '#3b82f6', `物距 u = ${(dist/10).toFixed(1)}`);
            if (showImage) {
                drawDimension(ctx, MIRROR_X, measureY, imgX, measureY, '#ef4444', `像距 v = ${(dist/10).toFixed(1)}`);
            }

            if (window.lucide) window.lucide.createIcons();
        };

        const drawCandle = (ctx, x, y, alpha, label) => {
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#fde047'; ctx.fillRect(-10, 0, 20, 40); // 蠟燭
            ctx.fillStyle = '#1f2937'; ctx.fillRect(-1, -5, 2, 5);   // 燭芯
            ctx.beginPath(); ctx.arc(0, -10, 8, 0, Math.PI*2); ctx.fillStyle = '#ef4444'; ctx.fill(); // 外焰
            ctx.beginPath(); ctx.arc(0, -10, 4, 0, Math.PI*2); ctx.fillStyle = '#facc15'; ctx.fill(); // 內焰
            ctx.fillStyle = alpha === 1 ? 'white' : '#ef4444';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, 0, 55);
            ctx.restore();
        };

        const drawEye = (ctx, x, y) => {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.moveTo(-20, 0); ctx.quadraticCurveTo(0, -15, 20, 0); ctx.quadraticCurveTo(0, 15, -20, 0);
            ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.strokeStyle = '#334155'; ctx.stroke();
            ctx.beginPath(); ctx.arc(8, 0, 7, 0, Math.PI*2); ctx.fillStyle = '#3b82f6'; ctx.fill(); // 虹膜
            ctx.beginPath(); ctx.arc(8, 0, 3, 0, Math.PI*2); ctx.fillStyle = '#000'; ctx.fill();    // 瞳孔
            ctx.fillStyle = 'white'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("觀察者", 0, 30);
            ctx.restore();
        };

        const drawDimension = (ctx, x1, y1, x2, y2, color, label) => {
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1;
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.moveTo(x1, y1 - 5); ctx.lineTo(x1, y1 + 5);
            ctx.moveTo(x2, y2 - 5); ctx.lineTo(x2, y2 + 5);
            ctx.stroke();
            ctx.fillStyle = color; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
            ctx.fillText(label, (x1 + x2) / 2, y1 - 8);
        };

        useEffect(() => {
            draw();
        }, [objPos, eyePos, showVirtualRays, showNormal, showImage]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg">
                            <i data-lucide="mirror" className="w-6 h-6 text-indigo-400"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">平面鏡成像作圖模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700">
                        主題：幾何光學 (Optics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[520px]">
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_WIDTH} 
                                height={CANVAS_HEIGHT}
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                className="w-full h-full object-contain bg-slate-950 rounded-2xl canvas-container"
                            />
                            <div className="absolute top-6 left-6 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 text-sm text-slate-300 backdrop-blur-md pointer-events-none flex items-center gap-2">
                                <i data-lucide="mouse-pointer-2" className="w-4 h-4 text-indigo-400"></i>
                                拖動 <strong>蠟燭</strong> 或 <strong>眼睛</strong> 來觀察光路變化
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold mb-2 flex items-center gap-2 text-lg">
                                <i data-lucide="eye" className="w-5 h-5 text-indigo-400"></i>
                                視覺設定
                            </h2>
                            
                            <div className="space-y-3">
                                <label className="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 cursor-pointer hover:bg-slate-700 transition-colors border border-slate-700/50">
                                    <span className="text-sm font-medium text-slate-300">顯示反射延長線</span>
                                    <input type="checkbox" checked={showVirtualRays} onChange={() => setShowVirtualRays(!showVirtualRays)} className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0" />
                                </label>
                                <label className="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 cursor-pointer hover:bg-slate-700 transition-colors border border-slate-700/50">
                                    <span className="text-sm font-medium text-slate-300">顯示法線</span>
                                    <input type="checkbox" checked={showNormal} onChange={() => setShowNormal(!showNormal)} className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0" />
                                </label>
                                <label className="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 cursor-pointer hover:bg-slate-700 transition-colors border border-slate-700/50">
                                    <span className="text-sm font-medium text-slate-300">顯示虛像</span>
                                    <input type="checkbox" checked={showImage} onChange={() => setShowImage(!showImage)} className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0" />
                                </label>
                            </div>

                            <button onClick={() => { setObjPos({ x: 200, y: 250 }); setEyePos({ x: 100, y: 100 }); }} className="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-2xl text-white font-bold transition-all flex items-center justify-center gap-2 active:scale-95">
                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i> 重設實驗
                            </button>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/30 p-5 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2">
                                <i data-lucide="lightbulb" className="w-4 h-4"></i> 成像原理
                            </h3>
                            <p className="text-xs text-slate-300 leading-relaxed italic">
                                眼睛習慣認為光線沿直線傳播。當反射光進入眼睛，大腦會將其<b>向後延伸</b>。那些虛線（紅線）交匯的位置，就是我們感覺到「像」的地方。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
