<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查理定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #f97316; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 300;
    const CANVAS_HEIGHT = 450; 
    const CYLINDER_WIDTH = 180;
    const CYLINDER_BOTTOM = 380;
    const PARTICLE_COUNT = 45;

    const App = () => {
        // --- 狀態 ---
        const [tempC, setTempC] = useState(25); // 攝氏度
        const [showExtrapolation, setShowExtrapolation] = useState(false);
        const [volume, setVolume] = useState(0); 
        
        const canvasRef = useRef(null);
        const graphCanvasRef = useRef(null);
        const requestRef = useRef();
        const particlesRef = useRef([]);

        // 初始化分子質點
        useEffect(() => {
            const ps = [];
            for(let i=0; i<PARTICLE_COUNT; i++) {
                ps.push({
                    x: Math.random() * (CYLINDER_WIDTH - 20) + (CANVAS_WIDTH - CYLINDER_WIDTH) / 2 + 10,
                    y: Math.random() * 200 + 100,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3
                });
            }
            particlesRef.current = ps;
        }, []);

        // 根據查理定律計算體積 V / T(K) = k
        useEffect(() => {
            const tempK = tempC + 273.15;
            // 基準設定：0°C (273.15K) 時體積為 50 單位
            const v = Math.max(5, 50 * (tempK / 273.15)); 
            setVolume(v);
        }, [tempC]);

        // --- 物理循環 ---
        const updatePhysics = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const cylinderHeight = volume * 3.2; 
            const pistonY = CYLINDER_BOTTOM - cylinderHeight;
            const centerX = CANVAS_WIDTH / 2;
            const leftX = centerX - CYLINDER_WIDTH / 2;
            const rightX = centerX + CYLINDER_WIDTH / 2;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製氣缸本體
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(leftX, pistonY, CYLINDER_WIDTH, cylinderHeight);
            
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(leftX, 50); ctx.lineTo(leftX, CYLINDER_BOTTOM);
            ctx.lineTo(rightX, CYLINDER_BOTTOM); ctx.lineTo(rightX, 50);
            ctx.stroke();

            // 2. 繪製活塞與配重 (保持定壓)
            ctx.fillStyle = '#334155'; // 活塞頭
            ctx.fillRect(leftX + 2, pistonY - 15, CYLINDER_WIDTH - 4, 15);
            ctx.fillStyle = '#fbbf24'; // 配重砝碼
            ctx.fillRect(centerX - 25, pistonY - 45, 50, 30);
            ctx.fillStyle = '#92400e'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("P", centerX, pistonY - 26);

            // 3. 熱源效果
            if (tempC > 25) {
                const alpha = (tempC - 25) / 200;
                ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
                ctx.beginPath();
                ctx.moveTo(centerX - 30, CYLINDER_BOTTOM + 5);
                ctx.lineTo(centerX, CYLINDER_BOTTOM - 25);
                ctx.lineTo(centerX + 30, CYLINDER_BOTTOM + 5);
                ctx.fill();
            } else if (tempC < 0) {
                const alpha = Math.abs(tempC) / 200;
                ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
                ctx.fillRect(leftX, CYLINDER_BOTTOM + 2, CYLINDER_WIDTH, 15);
            }

            // 4. 分子運動 (速度隨溫度變化 v ∝ √T)
            const tempK = tempC + 273.15;
            const speedFactor = Math.sqrt(Math.max(1, tempK)) / 12;

            ctx.fillStyle = tempC > 50 ? '#f87171' : tempC < 0 ? '#60a5fa' : '#a855f7';
            particlesRef.current.forEach(p => {
                p.x += p.vx * speedFactor;
                p.y += p.vy * speedFactor;

                if (p.x < leftX + 8) { p.x = leftX + 8; p.vx *= -1; }
                if (p.x > rightX - 8) { p.x = rightX - 8; p.vx *= -1; }
                if (p.y > CYLINDER_BOTTOM - 8) { p.y = CYLINDER_BOTTOM - 8; p.vy *= -1; }
                if (p.y < pistonY + 8) { p.y = pistonY + 8; p.vy *= -1; }

                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        // --- 繪製 V-T 圖表 ---
        const drawGraph = () => {
            const ctx = graphCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = 600, h = 350, pad = 50;
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, w, h);

            const xMin = -300, xMax = 200;
            const yMin = 0, yMax = 100;
            const mapX = (t) => pad + ((t - xMin) / (xMax - xMin)) * (w - 2 * pad);
            const mapY = (v) => h - pad - (v / yMax) * (h - 2 * pad);

            // 軸與網格
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h - pad); ctx.lineTo(w - pad, h - pad); ctx.stroke();
            
            // 標記絕對零度
            const absZeroX = mapX(-273.15);
            ctx.strokeStyle = '#ef4444'; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(absZeroX, pad); ctx.lineTo(absZeroX, h - pad); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#ef4444'; ctx.font = '10px Inter'; ctx.textAlign = 'center';
            ctx.fillText("-273.15°C", absZeroX, h - 35);

            // 標記 0 度線
            const zeroX = mapX(0);
            ctx.strokeStyle = '#64748b'; ctx.setLineDash([2, 4]);
            ctx.beginPath(); ctx.moveTo(zeroX, pad); ctx.lineTo(zeroX, h - pad); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#64748b'; ctx.fillText("0°C", zeroX, h - 35);

            // 繪製理論線
            ctx.beginPath(); ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
            const tStart = showExtrapolation ? -273.15 : -200;
            const vStart = 50 * ((tStart + 273.15) / 273.15);
            ctx.moveTo(mapX(tStart), mapY(vStart));
            const tEnd = 200;
            const vEnd = 50 * ((tEnd + 273.15) / 273.15);
            ctx.lineTo(mapX(tEnd), mapY(vEnd));
            ctx.stroke();

            // 當前數據點
            const cx = mapX(tempC); const cy = mapY(volume);
            ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
            ctx.fillText("溫度 T (°C) →", w/2, h - 10);
            ctx.save(); ctx.translate(15, h/2); ctx.rotate(-Math.PI/2);
            ctx.fillText("體積 V (單位)", 0, 0); ctx.restore();
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(updatePhysics);
            return () => cancelAnimationFrame(requestRef.current);
        }, [volume, tempC]);

        useEffect(() => { drawGraph(); }, [tempC, volume, showExtrapolation]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-400">
                            <i data-lucide="thermometer-sun"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">查理定律實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Gas Laws (Thermal Physics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-5 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl flex flex-col items-center relative overflow-hidden">
                            <h2 className="text-orange-400 font-bold mb-8 w-full flex items-center gap-2">
                                <i data-lucide="beaker" className="w-5 h-5"></i> 實驗裝置模擬
                            </h2>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto max-w-[260px]" />
                            <div className="mt-4 p-4 bg-slate-950/50 rounded-2xl border border-slate-700/50 w-full text-center">
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">物理狀態</p>
                                <div className="text-sm font-bold text-white flex justify-center gap-4">
                                    <span className="flex items-center gap-1 text-emerald-400"><i data-lucide="lock" className="w-3 h-3"></i> 定壓 P</span>
                                    <span className="flex items-center gap-1 text-orange-400"><i data-lucide="thermometer" className="w-3 h-3"></i> 變溫 T</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-7 space-y-6">
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center relative overflow-hidden transition-all border-b-4 border-b-orange-500">
                                <div className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">攝氏溫度 (T)</div>
                                <div className="text-3xl font-black text-white font-mono">{tempC}<span className="text-sm ml-1 text-slate-500">°C</span></div>
                                <div className="text-xs text-orange-400 mt-1 font-bold">{(tempC + 273.15).toFixed(2)} K</div>
                            </div>
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center relative overflow-hidden transition-all border-b-4 border-b-blue-500">
                                <div className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">相對體積 (V)</div>
                                <div className="text-3xl font-black text-white font-mono">{volume.toFixed(1)}<span className="text-sm ml-1 text-slate-500">單位</span></div>
                                <div className="text-xs text-blue-400 mt-1 font-bold">V / T(K) = {(volume / (tempC + 273.15)).toFixed(3)}</div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <div className="flex justify-between items-center mb-6">
                                <label className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                    <i data-lucide="flame" className="w-4 h-4 text-orange-400"></i> 調節熱源溫度
                                </label>
                                <span className={`px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest ${tempC > 0 ? 'bg-red-500/10 text-red-400' : 'bg-blue-500/10 text-blue-400'}`}>
                                    {tempC > 25 ? "加熱中" : tempC < 0 ? "冷卻中" : "室溫狀態"}
                                </span>
                            </div>
                            <input 
                                type="range" min="-200" max="200" step="1"
                                value={tempC}
                                onChange={(e) => setTempC(Number(e.target.value))}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"
                            />
                            <div className="flex justify-between mt-3 text-[10px] font-bold text-slate-500 uppercase">
                                <span>極低溫 (-200°C)</span>
                                <span>室溫</span>
                                <span>極高溫 (200°C)</span>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-1 rounded-3xl border border-slate-700 shadow-2xl relative overflow-hidden h-[300px]">
                            <canvas ref={graphCanvasRef} width={600} height={350} className="w-full h-full object-cover" />
                            <div className="absolute top-4 right-4 flex gap-2">
                                <button 
                                    onClick={() => setShowExtrapolation(!showExtrapolation)}
                                    className={`px-3 py-1.5 rounded-xl border text-[10px] font-bold transition-all ${showExtrapolation ? 'bg-red-600 border-red-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400'}`}
                                >
                                    {showExtrapolation ? "隱藏外推法" : "顯示絕對零度"}
                                </button>
                            </div>
                            {showExtrapolation && (
                                <div className="absolute bottom-16 left-16 bg-slate-900/90 p-3 rounded-xl border border-red-500/30 text-[10px] text-red-300 max-w-[180px] backdrop-blur-md">
                                    <strong>絕對零度 (-273.15°C):</strong><br/>
                                    理論上氣體分子的動能歸零，體積也隨之縮減為零。
                                </div>
                            )}
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
