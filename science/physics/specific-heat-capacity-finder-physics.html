<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比熱容量混合模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #10b981; cursor: pointer;
        }
        .beaker {
            border: 2px solid rgba(255,255,255,0.2);
            border-top: none;
            border-radius: 0 0 10px 10px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { motion, AnimatePresence } = window.Motion;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, Legend } = window.Recharts;

    const LIQUIDS = [
        { name: "水 (Water)", c: 4200, color: "#3b82f6" },
        { name: "乙醇 (Ethanol)", c: 2440, color: "#a855f7" },
        { name: "橄欖油 (Olive Oil)", c: 1970, color: "#eab308" },
        { name: "甘油 (Glycerin)", c: 2430, color: "#10b981" },
        { name: "水銀 (Mercury)", c: 140, color: "#94a3b8" },
        { name: "自定義 (Custom)", c: 1000, color: "#f43f5e" }
    ];

    const App = () => {
        const [liquidA, setLiquidA] = useState(LIQUIDS[0]);
        const [massA, setMassA] = useState(0.5); 
        const [tempA, setTempA] = useState(80); 
        
        const [liquidB, setLiquidB] = useState(LIQUIDS[2]);
        const [massB, setMassB] = useState(0.5); 
        const [tempB, setTempB] = useState(20); 

        const [isMixed, setIsMixed] = useState(false);
        const [progress, setProgress] = useState(0);

        const finalTemp = useMemo(() => {
            const numerator = (massA * liquidA.c * tempA) + (massB * liquidB.c * tempB);
            const denominator = (massA * liquidA.c) + (massB * liquidB.c);
            return numerator / denominator;
        }, [massA, liquidA, tempA, massB, liquidB, tempB]);

        const graphData = useMemo(() => {
            const points = [];
            const steps = 20;
            for (let i = 0; i <= steps; i++) {
                const t = i / 2;
                const k = 0.5;
                const currentTA = finalTemp + (tempA - finalTemp) * Math.exp(-k * t);
                const currentTB = finalTemp + (tempB - finalTemp) * Math.exp(-k * t);
                points.push({
                    time: t.toFixed(1),
                    "液體 A": currentTA.toFixed(1),
                    "液體 B": currentTB.toFixed(1),
                    "熱平衡溫度": finalTemp.toFixed(1)
                });
            }
            return points;
        }, [tempA, tempB, finalTemp]);

        const handleMix = () => { setIsMixed(true); setProgress(0); };
        const handleReset = () => { setIsMixed(false); setProgress(0); };

        useEffect(() => {
            if (isMixed && progress < 1) {
                const timer = setTimeout(() => setProgress(p => Math.min(p + 0.05, 1)), 50);
                return () => clearTimeout(timer);
            }
        }, [isMixed, progress]);

        const updateLiquidType = (setFunc, name) => {
            const selected = LIQUIDS.find(l => l.name === name);
            setFunc(prev => ({ ...selected }));
        };

        const updateCustomC = (setFunc, val) => {
            setFunc(prev => ({ ...prev, name: "自定義 (Custom)", c: Number(val) }));
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 font-sans">
                <header className="mb-8 flex items-center space-x-3 border-b border-slate-700 pb-4">
                    <div className="p-2 bg-orange-500/10 rounded-lg"><i data-lucide="flask-conical" className="w-8 h-8 text-orange-400"></i></div>
                    <div>
                        <h1 className="text-2xl font-bold text-white tracking-tight">比熱容量混合模擬器</h1>
                        <p className="text-slate-400 text-sm">Heat and Gases • 物理熱學</p>
                    </div>
                </header>

                <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
                    <div className="space-y-6">
                        <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                            <h2 className="text-blue-400 font-bold mb-4 flex items-center"><span className="bg-blue-500/20 px-2 py-1 rounded text-xs mr-2">A</span> 液體 A (熱源)</h2>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div><label className="text-xs text-slate-400 block mb-1">物質類型</label>
                                <select value={liquidA.name} onChange={(e) => updateLiquidType(setLiquidA, e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-white" disabled={isMixed}>
                                    {LIQUIDS.map(l => <option key={l.name} value={l.name}>{l.name}</option>)}
                                </select></div>
                                <div><label className="text-xs text-slate-400 block mb-1">比熱容量 (c)</label>
                                <div className="flex items-center"><input type="number" value={liquidA.c} onChange={(e) => updateCustomC(setLiquidA, e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-blue-300 font-mono" disabled={isMixed}/><span className="text-[10px] ml-1 text-slate-500">J/kg°C</span></div></div>
                            </div>
                            <div className="space-y-4">
                                <div><div className="flex justify-between text-xs mb-1"><span className="text-slate-300">質量 (mA)</span><span className="text-blue-300 font-mono">{massA} kg</span></div>
                                <input type="range" min="0.1" max="2.0" step="0.1" value={massA} onChange={(e) => setMassA(Number(e.target.value))} disabled={isMixed} className="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                                <div><div className="flex justify-between text-xs mb-1"><span className="text-slate-300">初溫 (TA)</span><span className="text-blue-300 font-mono">{tempA}°C</span></div>
                                <input type="range" min="0" max="100" step="1" value={tempA} onChange={(e) => setTempA(Number(e.target.value))} disabled={isMixed} className="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                            </div>
                        </div>

                        <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1 h-full bg-yellow-500"></div>
                            <h2 className="text-yellow-400 font-bold mb-4 flex items-center"><span className="bg-yellow-500/20 px-2 py-1 rounded text-xs mr-2">B</span> 液體 B (冷源)</h2>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div><label className="text-xs text-slate-400 block mb-1">物質類型</label>
                                <select value={liquidB.name} onChange={(e) => updateLiquidType(setLiquidB, e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-white" disabled={isMixed}>
                                    {LIQUIDS.map(l => <option key={l.name} value={l.name}>{l.name}</option>)}
                                </select></div>
                                <div><label className="text-xs text-slate-400 block mb-1">比熱容量 (c)</label>
                                <div className="flex items-center"><input type="number" value={liquidB.c} onChange={(e) => updateCustomC(setLiquidB, e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-yellow-300 font-mono" disabled={isMixed}/><span className="text-[10px] ml-1 text-slate-500">J/kg°C</span></div></div>
                            </div>
                            <div className="space-y-4">
                                <div><div className="flex justify-between text-xs mb-1"><span className="text-slate-300">質量 (mB)</span><span className="text-yellow-300 font-mono">{massB} kg</span></div>
                                <input type="range" min="0.1" max="2.0" step="0.1" value={massB} onChange={(e) => setMassB(Number(e.target.value))} disabled={isMixed} className="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                                <div><div className="flex justify-between text-xs mb-1"><span className="text-slate-300">初溫 (TB)</span><span className="text-yellow-300 font-mono">{tempB}°C</span></div>
                                <input type="range" min="0" max="100" step="1" value={tempB} onChange={(e) => setTempB(Number(e.target.value))} disabled={isMixed} className="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"/></div>
                            </div>
                        </div>

                        <button onClick={isMixed ? handleReset : handleMix} className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transition-all flex items-center justify-center ${isMixed ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-emerald-600 text-white hover:bg-emerald-500'}`}>
                            {isMixed ? <><i data-lucide="rotate-ccw" className="w-5 h-5 mr-2"></i> 重置實驗環境</> : <><i data-lucide="flask-conical" className="w-5 h-5 mr-2"></i> 開始混合液體</>}
                        </button>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-slate-950 border border-slate-700 rounded-xl h-[320px] relative flex items-end justify-center p-6 overflow-hidden">
                            <motion.div className="absolute" initial={{ left: '20%', bottom: '20px', rotate: 0, opacity: 1 }} animate={isMixed ? { left: '45%', bottom: '150px', rotate: 135, opacity: 0 } : { left: '20%', bottom: '20px', rotate: 0, opacity: 1 }} transition={{ duration: 1.5 }}>
                                <div className="text-center text-[10px] text-blue-400 mb-1 font-bold">A ({tempA}°C)</div>
                                <div className="beaker w-16 bg-slate-800/30" style={{ height: '100px' }}><div className="absolute bottom-0 w-full" style={{ height: `${massA * 40}px`, backgroundColor: liquidA.color }}></div></div>
                            </motion.div>
                            <motion.div className="absolute" initial={{ right: '20%', bottom: '20px', rotate: 0, opacity: 1 }} animate={isMixed ? { right: '45%', bottom: '150px', rotate: -135, opacity: 0 } : { right: '20%', bottom: '20px', rotate: 0, opacity: 1 }} transition={{ duration: 1.5 }}>
                                <div className="text-center text-[10px] text-yellow-400 mb-1 font-bold">B ({tempB}°C)</div>
                                <div className="beaker w-16 bg-slate-800/30" style={{ height: '100px' }}><div className="absolute bottom-0 w-full" style={{ height: `${massB * 40}px`, backgroundColor: liquidB.color }}></div></div>
                            </motion.div>
                            <div className="relative z-10 flex flex-col items-center">
                                <AnimatePresence>{isMixed && <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 1 }} className="mb-2 text-emerald-400 font-mono font-bold text-xl">{finalTemp.toFixed(1)}°C</motion.div>}</AnimatePresence>
                                <div className="w-40 h-40 border-4 border-slate-600 border-t-0 rounded-b-xl relative bg-slate-900 overflow-hidden">
                                    <motion.div className="absolute bottom-0 w-full" initial={{ height: 0 }} animate={isMixed ? { height: `${(massA + massB) * 35}px` } : { height: 0 }} transition={{ delay: 0.5, duration: 1.5 }} style={{ background: isMixed ? `linear-gradient(to right, ${liquidA.color}88, ${liquidB.color}88)` : 'transparent' }} />
                                    <div className="absolute left-1/2 -translate-x-1/2 bottom-2 w-1.5 h-[180px] bg-slate-500/50 rounded-full"><motion.div className="absolute bottom-0 w-full bg-red-500 rounded-full" initial={{ height: '20%' }} animate={isMixed ? { height: `${finalTemp}%` } : { height: '20%' }} transition={{ delay: 1.5 }} /></div>
                                </div>
                                <div className="text-[10px] text-slate-500 mt-2 uppercase tracking-widest font-bold">絕熱容器</div>
                            </div>
                        </div>

                        <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-1">
                            <div className="grid grid-cols-2 gap-1 p-1">
                                <div className="text-center py-2 text-xs font-bold text-slate-300 bg-slate-700 rounded cursor-default">混合計算步驟</div>
                                <div className="text-center py-2 text-xs text-slate-500 cursor-default">溫度/時間關係圖</div>
                            </div>
                            <div className="p-4">
                                {isMixed ? (
                                    <div className="font-mono text-[11px] space-y-3">
                                        <div className="flex justify-between items-center text-[10px] text-slate-500 border-b border-slate-700 pb-2"><span>能量守恆定律</span><span>釋放熱量 = 吸收熱量</span></div>
                                        <div className="bg-slate-900 p-3 rounded leading-relaxed border-l-4 border-blue-500">
                                            <div className="text-slate-500 mb-1">// 高溫液體釋放熱量 Q = mc&Delta;T</div>
                                            <div className="text-blue-300">Q_loss = {tempA > tempB ? massA : massB} &times; {tempA > tempB ? liquidA.c : liquidB.c} &times; ({tempA > tempB ? tempA : tempB} - Tf)</div>
                                        </div>
                                        <div className="bg-slate-900 p-3 rounded leading-relaxed border-l-4 border-yellow-500">
                                            <div className="text-slate-500 mb-1">// 低溫液體吸收熱量 Q = mc&Delta;T</div>
                                            <div className="text-yellow-300">Q_gain = {tempA > tempB ? massB : massA} &times; {tempA > tempB ? liquidB.c : liquidA.c} &times; (Tf - {tempA > tempB ? tempB : tempA})</div>
                                        </div>
                                        <div className="bg-emerald-900/30 border border-emerald-500/30 p-3 rounded text-center">
                                            <div className="text-[10px] text-emerald-400 mb-1">最終平衡溫度 (Equilibrium Temp)</div>
                                            <div className="text-xl font-bold text-white">Tf = {finalTemp.toFixed(2)} °C</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-40 flex items-center justify-center text-slate-500 text-xs italic">請啟動混合實驗以顯示能量交換計算過程。</div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 150);
</script>
</body>
</html>
