<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波形參數模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .thumb-indigo::-webkit-slider-thumb { border-color: #6366f1; }
        .thumb-rose::-webkit-slider-thumb { border-color: #f43f5e; }
        .thumb-emerald::-webkit-slider-thumb { border-color: #10b981; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 350;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const PIXELS_PER_METER = 50; 

    const App = () => {
        // --- 狀態 ---
        const [freq, setFreq] = useState(1.0); 
        const [wavelength, setWavelength] = useState(4.0); 
        const [amplitude, setAmplitude] = useState(1.0); 
        const [isRunning, setIsRunning] = useState(true);

        const waveSpeed = freq * wavelength; 

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const timeRef = useRef(0);
        const lastTimeRef = useRef(0);

        // --- 邏輯 ---
        const resetSim = () => {
            setFreq(1.0);
            setWavelength(4.0);
            setAmplitude(1.0);
            timeRef.current = 0;
        };

        const loop = (timestamp) => {
            if (!isRunning) return;
            const dt = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;
            const safeDt = Math.min(dt, 0.1);
            timeRef.current += safeDt;
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 繪圖 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const t = timeRef.current;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 背景與基準線
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

            // 2. 繪製波形 y = A sin(kx - wt)
            const ampPx = amplitude * 50; 
            const lambdaPx = wavelength * PIXELS_PER_METER;
            const k = (2 * Math.PI) / lambdaPx;
            const w = 2 * Math.PI * freq;

            ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = '#38bdf8';
            for (let x = 0; x < CANVAS_WIDTH; x+=2) {
                const y = CENTER_Y - ampPx * Math.sin(k * x - w * t);
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 3. 標註：振幅 (Amplitude)
            const phase = w * t;
            let peakX = ((phase + Math.PI/2) / k) % lambdaPx;
            if (peakX < 50) peakX += lambdaPx;
            const peakY = CENTER_Y - ampPx;
            ctx.beginPath(); ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2;
            ctx.moveTo(peakX, CENTER_Y); ctx.lineTo(peakX, peakY); ctx.stroke();
            ctx.fillStyle = '#f43f5e'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`振幅 A = ${amplitude}m`, peakX + 10, (CENTER_Y + peakY)/2);

            // 4. 標註：波長 (Wavelength)
            const nextPeakX = peakX + lambdaPx;
            if (nextPeakX < CANVAS_WIDTH - 20) {
                const guideY = peakY - 25;
                ctx.beginPath(); ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
                ctx.moveTo(peakX, guideY); ctx.lineTo(nextPeakX, guideY);
                ctx.moveTo(peakX, guideY - 5); ctx.lineTo(peakX, guideY + 5);
                ctx.moveTo(nextPeakX, guideY - 5); ctx.lineTo(nextPeakX, guideY + 5);
                ctx.stroke();
                ctx.fillStyle = '#10b981'; ctx.textAlign = 'center';
                ctx.fillText(`波長 λ = ${wavelength}m`, (peakX + nextPeakX)/2, guideY - 10);
                ctx.textAlign = 'left';
            }
        };

        useEffect(() => {
            lastTimeRef.current = performance.now();
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [isRunning, freq, wavelength, amplitude]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400">
                            <i data-lucide="activity"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">波形參數模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Wave Properties
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-12">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[380px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 right-6 bg-slate-900/90 px-6 py-4 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-md">
                                <div className="text-[10px] text-slate-400 font-bold uppercase mb-1 tracking-widest text-right">波速 (Wave Speed)</div>
                                <div className="text-4xl font-black text-white text-right">
                                    {waveSpeed.toFixed(1)} <span className="text-sm text-slate-500 font-medium">m/s</span>
                                </div>
                                <div className="text-[10px] text-indigo-400 mt-1 font-bold font-mono text-right italic">v = f × λ</div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-indigo-400 uppercase tracking-widest">
                                    <span>頻率 (f)</span>
                                    <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{freq.toFixed(1)} Hz</span>
                                </label>
                                <input type="range" min="0.5" max="4.0" step="0.1" value={freq} onChange={(e) => setFreq(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" />
                            </div>

                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-emerald-400 uppercase tracking-widest">
                                    <span>波長 (λ)</span>
                                    <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{wavelength.toFixed(1)} m</span>
                                </label>
                                <input type="range" min="1.0" max="10.0" step="0.5" value={wavelength} onChange={(e) => setWavelength(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-emerald" />
                            </div>

                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-rose-400 uppercase tracking-widest">
                                    <span>振幅 (A)</span>
                                    <span className="text-white bg-slate-950 px-2 py-0.5 rounded font-mono">{amplitude.toFixed(1)} m</span>
                                </label>
                                <input type="range" min="0.2" max="2.0" step="0.1" value={amplitude} onChange={(e) => setAmplitude(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-rose" />
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 flex gap-4">
                        <button onClick={() => setIsRunning(!isRunning)} className={`flex-1 py-4 rounded-3xl font-bold text-lg flex items-center justify-center gap-2 transition-all shadow-lg ${isRunning ? 'bg-slate-700 text-slate-300' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/20'}`}>
                            <i data-lucide={isRunning ? "pause" : "play"}></i>
                            {isRunning ? "暫停動畫" : "繼續播放"}
                        </button>
                        <button onClick={resetSim} className="px-8 py-4 bg-slate-800 text-white rounded-3xl font-bold hover:bg-slate-700 transition-colors border border-slate-700 shadow-xl active:scale-95">
                            <i data-lucide="rotate-ccw"></i>
                        </button>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
