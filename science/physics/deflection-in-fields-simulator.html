<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>場中偏轉實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .thumb-indigo::-webkit-slider-thumb { border-color: #6366f1; }
        .thumb-pink::-webkit-slider-thumb { border-color: #ec4899; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    // 場域範圍
    const FIELD_X_START = 200;
    const FIELD_X_END = 600;
    const FIELD_Y_START = 50;
    const FIELD_Y_END = 400;

    const PARTICLES = {
        'alpha': { m: 4.0, q: 2.0, color: '#ef4444', label: 'α (阿爾法粒子)' },
        'beta_minus': { m: 0.05, q: -1.0, color: '#3b82f6', label: 'β⁻ (電子)' }, 
        'beta_plus': { m: 0.05, q: 1.0, color: '#a855f7', label: 'β⁺ (正電子)' },
        'gamma': { m: 0.0, q: 0.0, color: '#facc15', label: 'γ (伽瑪射線)' }
    };

    const App = () => {
        // --- 狀態 ---
        const [fieldType, setFieldType] = useState('electric'); // 'electric' 或 'magnetic'
        const [fieldStrength, setFieldStrength] = useState(5.0); 
        const [velocity, setVelocity] = useState(5.0); 
        const [selectedParticle, setSelectedParticle] = useState('alpha');
        
        const [particles, setParticles] = useState([]); 
        const [showTrails, setShowTrails] = useState(true);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const prevTimeRef = useRef(0);

        const paramsRef = useRef({ fieldType, fieldStrength, velocity, showTrails });

        useEffect(() => {
            paramsRef.current = { fieldType, fieldStrength, velocity, showTrails };
        }, [fieldType, fieldStrength, velocity, showTrails]);

        // --- 邏輯 ---
        const fire = () => {
            const pType = selectedParticle;
            setParticles(prev => [...prev, {
                x: 50,
                y: CENTER_Y,
                vx: velocity * 20, 
                vy: 0,
                type: pType,
                trail: [],
                active: true
            }]);
        };

        const clear = () => setParticles([]);

        const loop = (timestamp) => {
            const dt = (timestamp - prevTimeRef.current) / 1000;
            prevTimeRef.current = timestamp;
            const safeDt = Math.min(dt, 0.05);

            setParticles(prev => prev.map(p => {
                if (!p.active) return p;

                const props = PARTICLES[p.type];
                const { fieldType, fieldStrength } = paramsRef.current;
                let ax = 0;
                let ay = 0;

                // 檢查是否在場域內
                if (p.x >= FIELD_X_START && p.x <= FIELD_X_END && p.y >= FIELD_Y_START && p.y <= FIELD_Y_END) {
                    
                    if (fieldType === 'electric') {
                        // F = qE. E 是垂直的 (上/下).
                        // 正向 fieldStrength 代表 E 向下 (+Y).
                        const E = fieldStrength * 50; 
                        if (props.m > 0) {
                            ay = (props.q * E) / props.m;
                        }
                    } else {
                        // 磁場 B. F = q(v x B).
                        // 假設 B 垂直於螢幕. B > 0 代表進入紙面 (X).
                        // v 向右 (+X). B 向內 (+Z). F = q(v x B) 向左旋轉 (上).
                        const B = fieldStrength * 2; 
                        const vMag = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                        if (vMag > 0 && props.m > 0) {
                            const aMag = (props.q * vMag * B) / props.m;
                            // 垂直向量 (vy, -vx)
                            ax = (p.vy / vMag) * aMag;
                            ay = -(p.vx / vMag) * aMag;
                        }
                    }
                }

                const newVx = p.vx + ax * safeDt;
                const newVy = p.vy + ay * safeDt;
                const newX = p.x + newVx * safeDt;
                const newY = p.y + newVy * safeDt;

                const newTrail = [...p.trail];
                if (paramsRef.current.showTrails && (newTrail.length === 0 || Math.hypot(newX - newTrail[newTrail.length-1].x, newY - newTrail[newTrail.length-1].y) > 5)) {
                    newTrail.push({x: newX, y: newY});
                }
                if (newTrail.length > 100) newTrail.shift();

                const isActive = newX < CANVAS_WIDTH + 50 && newY > -50 && newY < CANVAS_HEIGHT + 50;
                return { ...p, x: newX, y: newY, vx: newVx, vy: newVy, trail: newTrail, active: isActive };
            }).filter(p => p.active));

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const { fieldType, fieldStrength, showTrails } = paramsRef.current;

            // 1. 繪製場域範圍
            ctx.fillStyle = fieldType === 'electric' ? 'rgba(99, 102, 241, 0.08)' : 'rgba(236, 72, 153, 0.08)';
            ctx.fillRect(FIELD_X_START, FIELD_Y_START, FIELD_X_END - FIELD_X_START, FIELD_Y_END - FIELD_Y_START);
            ctx.strokeStyle = fieldType === 'electric' ? '#6366f1' : '#ec4899';
            ctx.lineWidth = 2;
            ctx.strokeRect(FIELD_X_START, FIELD_Y_START, FIELD_X_END - FIELD_X_START, FIELD_Y_END - FIELD_Y_START);

            // 場標識
            const spacing = 45;
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
            if (fieldType === 'electric') {
                // 電極板
                ctx.fillStyle = fieldStrength > 0 ? '#ef4444' : '#3b82f6';
                ctx.fillRect(FIELD_X_START, FIELD_Y_START - 10, FIELD_X_END - FIELD_X_START, 10);
                ctx.fillStyle = fieldStrength > 0 ? '#3b82f6' : '#ef4444';
                ctx.fillRect(FIELD_X_START, FIELD_Y_END, FIELD_X_END - FIELD_X_START, 10);
                
                // 箭頭
                const dir = fieldStrength > 0 ? 1 : -1;
                for(let x=FIELD_X_START + 22; x<FIELD_X_END; x+=spacing) {
                    for(let y=FIELD_Y_START + 22; y<FIELD_Y_END; y+=spacing) {
                        ctx.beginPath();
                        if (dir > 0) { ctx.moveTo(x, y-6); ctx.lineTo(x, y+6); ctx.lineTo(x-3, y+2); ctx.moveTo(x, y+6); ctx.lineTo(x+3, y+2); }
                        else { ctx.moveTo(x, y+6); ctx.lineTo(x, y-6); ctx.lineTo(x-3, y-2); ctx.moveTo(x, y-6); ctx.lineTo(x+3, y-2); }
                        ctx.stroke();
                    }
                }
            } else {
                // 磁場符號
                for(let x=FIELD_X_START + 22; x<FIELD_X_END; x+=spacing) {
                    for(let y=FIELD_Y_START + 22; y<FIELD_Y_END; y+=spacing) {
                        ctx.beginPath();
                        if (fieldStrength > 0) { // 進入 (X)
                            ctx.moveTo(x-4, y-4); ctx.lineTo(x+4, y+4); ctx.moveTo(x+4, y-4); ctx.lineTo(x-4, y+4);
                        } else { // 穿出 (.)
                            ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2);
                        }
                        ctx.stroke();
                    }
                }
            }
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Inter';
            ctx.fillText(fieldType === 'electric' ? "勻強電場 (E)" : "勻強磁場 (B)", FIELD_X_START + 10, FIELD_Y_START - 22);

            // 2. 繪製粒子
            particles.forEach(p => {
                const color = PARTICLES[p.type].color;
                if (showTrails && p.trail.length > 0) {
                    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = 0.4;
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    p.trail.forEach(pt => ctx.lineTo(pt.x, pt.y));
                    ctx.stroke(); ctx.globalAlpha = 1.0;
                }
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();
            });

            // 3. 發射器
            ctx.fillStyle = '#334155'; ctx.fillRect(0, CENTER_Y - 20, 50, 40);
            ctx.fillStyle = '#64748b'; ctx.fillRect(50, CENTER_Y - 5, 10, 10);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, []);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400">
                            <i data-lucide="crosshair"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">場中偏轉實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Atomic Physics</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[450px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                            <div className="absolute bottom-6 left-6 flex gap-3">
                                <button onClick={() => setFieldType('electric')} className={`px-6 py-2.5 rounded-xl text-xs font-bold border transition-all ${fieldType==='electric' ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>電場模式</button>
                                <button onClick={() => setFieldType('magnetic')} className={`px-6 py-2.5 rounded-xl text-xs font-bold border transition-all ${fieldType==='magnetic' ? 'bg-pink-600 border-pink-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>磁場模式</button>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-10 items-start">
                            <div className="space-y-4">
                                <h3 className="text-[10px] font-black text-slate-500 uppercase tracking-widest">粒子選擇</h3>
                                <div className="grid grid-cols-2 gap-2">
                                    {Object.keys(PARTICLES).map(key => (
                                        <button key={key} onClick={() => setSelectedParticle(key)} className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition-all text-left flex items-center gap-2 ${selectedParticle === key ? 'bg-slate-700 border-white text-white' : 'bg-slate-900 border-slate-700 text-slate-500'}`} style={{ borderColor: selectedParticle === key ? PARTICLES[key].color : '' }}>
                                            <div className="w-2 h-2 rounded-full" style={{ backgroundColor: PARTICLES[key].color }}></div>
                                            {PARTICLES[key].label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex-1 space-y-6">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">場強大小 <span className="text-white font-mono">{fieldStrength.toFixed(1)}</span></label>
                                    <input type="range" min="-10" max="10" step="1" value={fieldStrength} onChange={(e) => setFieldStrength(Number(e.target.value))} className={`w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb ${fieldType==='electric'?'thumb-indigo':'thumb-pink'}`} />
                                    <div className="flex justify-between text-[10px] text-slate-600 font-bold mt-2 uppercase"><span>反向</span><span>0</span><span>正向</span></div>
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">粒子初速 <span className="text-white font-mono">{velocity.toFixed(1)}</span></label>
                                    <input type="range" min="1" max="10" step="0.5" value={velocity} onChange={(e) => setVelocity(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                </div>
                            </div>

                            <div className="flex flex-col gap-3">
                                <button onClick={fire} className="px-10 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-900/20 transition-all active:scale-95 flex items-center justify-center gap-2"><i data-lucide="zap"></i> 發射</button>
                                <button onClick={clear} className="px-10 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all active:scale-95">清除</button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="book-open" className="text-indigo-400"></i> 現象觀察
                            </h2>
                            <div className="space-y-6 text-xs text-slate-400 leading-relaxed">
                                <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                                    <strong className="text-indigo-300 block mb-2 font-black uppercase tracking-widest">電場偏轉：</strong>
                                    粒子路徑為 <b>拋物線</b>。力方向恆定 ($F=qE$)。偏轉程度與 $q/m$ 成正比。
                                </div>
                                <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                                    <strong className="text-pink-400 block mb-2 font-black uppercase tracking-widest">磁場偏轉：</strong>
                                    粒子路徑為 <b>圓周</b>。力始終與運動方向垂直 ($F \perp v$)。
                                </div>
                                <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                                    <strong className="text-yellow-400 block mb-2 font-black uppercase tracking-widest">伽瑪射線：</strong>
                                    不帶電 ($q=0$)，故在兩種場中均呈直線傳播！
                                </div>
                            </div>
                        </div>

                        <label className="flex items-center justify-between p-5 bg-slate-800 rounded-3xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-all shadow-lg">
                            <span className="text-xs font-bold text-slate-300 uppercase tracking-widest">顯示粒子軌跡</span>
                            <input type="checkbox" checked={showTrails} onChange={() => setShowTrails(!showTrails)} className="w-5 h-5 rounded border-slate-600 text-blue-500 focus:ring-0 cursor-pointer" />
                        </label>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
