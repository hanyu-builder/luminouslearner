<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUVAT 運動方程式求解器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
        .solved-field { background-color: #064e3b; border-color: #10b981; color: #a7f3d0; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
        // --- 狀態 ---
        const [inputs, setInputs] = useState({
            s: '', // 位移
            u: '', // 初速
            v: '', // 末速
            a: '', // 加速度
            t: ''  // 時間
        });
        
        const [results, setResults] = useState(null); 
        const [steps, setSteps] = useState([]);
        const [error, setError] = useState('');
        
        // 動畫狀態
        const [animating, setAnimating] = useState(false);
        const [carX, setCarX] = useState(0);
        const [animTime, setAnimTime] = useState(0);
        
        const requestRef = useRef();
        const startTimeRef = useRef(0);

        // --- 邏輯 ---
        const handleInputChange = (e) => {
            const { name, value } = e.target;
            setInputs(prev => ({ ...prev, [name]: value }));
            if (results) {
                setResults(null);
                setSteps([]);
                setError('');
            }
        };

        const reset = () => {
            setInputs({ s: '', u: '', v: '', a: '', t: '' });
            setResults(null);
            setSteps([]);
            setError('');
            setAnimating(false);
            setCarX(0);
            setAnimTime(0);
        };

        const solve = () => {
            const val = {};
            let count = 0;
            for (const key in inputs) {
                if (inputs[key] !== '' && !isNaN(inputs[key])) {
                    val[key] = parseFloat(inputs[key]);
                    count++;
                } else {
                    val[key] = null;
                }
            }

            if (count !== 3) {
                setError(`請輸入恰好 3 個已知數值。目前輸入了 ${count} 個。`);
                return;
            }
            
            setError('');
            const logStep = (msg) => setSteps(prev => [...prev, msg]);
            setSteps([]);

            let { s, u, v, a, t } = val;

            try {
                // 1. 根據組合尋找未知變數
                if (u !== null && a !== null && t !== null) {
                    v = u + a * t;
                    logStep(`v = u + at = ${u} + (${a})(${t}) = ${v.toFixed(2)} m/s`);
                    s = u * t + 0.5 * a * t * t;
                    logStep(`s = ut + ½at² = (${u})(${t}) + 0.5(${a})(${t}²) = ${s.toFixed(2)} m`);
                }
                else if (u !== null && v !== null && t !== null) {
                    a = (v - u) / t;
                    logStep(`a = (v - u) / t = (${v} - ${u}) / ${t} = ${a.toFixed(2)} m/s²`);
                    s = 0.5 * (u + v) * t;
                    logStep(`s = ½(u + v)t = 0.5(${u} + ${v})(${t}) = ${s.toFixed(2)} m`);
                }
                else if (u !== null && v !== null && a !== null) {
                    if (a === 0) {
                        if (u !== v) throw "錯誤：若 a=0，則 u 必須等於 v";
                        throw "錯誤：加速度為 0 且未知時間，無法求得唯一位移。";
                    }
                    s = (v*v - u*u) / (2 * a);
                    logStep(`v² = u² + 2as → s = (v² - u²) / 2a = (${v}² - ${u}²) / 2(${a}) = ${s.toFixed(2)} m`);
                    t = (v - u) / a;
                    logStep(`v = u + at → t = (v - u) / a = (${v} - ${u}) / ${a} = ${t.toFixed(2)} s`);
                }
                else if (s !== null && u !== null && t !== null) {
                    a = (2 * (s - u * t)) / (t * t);
                    logStep(`s = ut + ½at² → a = 2(s - ut)/t² = ${a.toFixed(2)} m/s²`);
                    v = u + a * t;
                    logStep(`v = u + at = ${v.toFixed(2)} m/s`);
                }
                else if (s !== null && v !== null && t !== null) {
                    u = (2 * s) / t - v;
                    logStep(`s = ½(u + v)t → u = 2s/t - v = ${u.toFixed(2)} m/s`);
                    a = (v - u) / t;
                    logStep(`a = (v - u) / t = ${a.toFixed(2)} m/s²`);
                }
                else if (s !== null && a !== null && t !== null) {
                    u = (s - 0.5 * a * t * t) / t;
                    logStep(`s = ut + ½at² → u = (s - ½at²) / t = ${u.toFixed(2)} m/s`);
                    v = u + a * t;
                    logStep(`v = u + at = ${v.toFixed(2)} m/s`);
                }
                else if (s !== null && u !== null && v !== null) {
                    if (u + v === 0) throw "錯誤：u + v = 0，無法計算時間。";
                    t = (2 * s) / (u + v);
                    logStep(`s = ½(u + v)t → t = 2s / (u + v) = ${t.toFixed(2)} s`);
                    a = (v - u) / t;
                    logStep(`a = (v - u) / t = ${a.toFixed(2)} m/s²`);
                }
                else if (v !== null && a !== null && t !== null) {
                    u = v - a * t;
                    logStep(`v = u + at → u = v - at = ${u.toFixed(2)} m/s`);
                    s = u * t + 0.5 * a * t * t;
                    logStep(`s = ut + ½at² = ${s.toFixed(2)} m`);
                }
                else if (s !== null && u !== null && a !== null) {
                    const v2 = u*u + 2*a*s;
                    if (v2 < 0) throw "錯誤：不可能的運動 (v² < 0)。";
                    v = Math.sqrt(v2); 
                    logStep(`v² = u² + 2as → v = ±${v.toFixed(2)} m/s (取正值)`);
                    const delta = Math.sqrt(u*u + 2*a*s);
                    const t1 = (-u + delta) / a;
                    const t2 = (-u - delta) / a;
                    t = (t1 >= 0) ? t1 : t2;
                    logStep(`求解時間二次方程，t = ${t.toFixed(2)} s`);
                }
                else if (s !== null && v !== null && a !== null) {
                    const u2 = v*v - 2*a*s;
                    if (u2 < 0) throw "錯誤：不可能的運動 (u² < 0)。";
                    u = Math.sqrt(u2);
                    logStep(`v² = u² + 2as → u = ±${u.toFixed(2)} m/s (取正值)`);
                    t = (v - u) / a;
                    logStep(`t = (v - u) / a = ${t.toFixed(2)} s`);
                }

                setResults({ s, u, v, a, t });

            } catch (err) {
                setError(err.toString());
            }
        };

        const startAnimation = () => {
            if (!results) return;
            setAnimating(true);
            setCarX(0);
            startTimeRef.current = Date.now();
            requestRef.current = requestAnimationFrame(animateCar);
        };

        const animateCar = () => {
            const now = Date.now();
            let dt = (now - startTimeRef.current) / 1000; 
            if (dt > results.t) {
                dt = results.t;
                setAnimating(false);
            } else {
                requestRef.current = requestAnimationFrame(animateCar);
            }
            setAnimTime(dt);
            const currentS = results.u * dt + 0.5 * results.a * dt * dt;
            setCarX(currentS);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400"><i data-lucide="calculator"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">SUVAT 運動方程式求解器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Kinematics</div>
                </nav>

                <main className="max-w-5xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-8 mt-4">
                    <div className="space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="pencil-line" className="text-indigo-400"></i> 輸入 3 個已知數值
                            </h2>
                            <div className="space-y-4">
                                {[
                                    { k: 's', label: '位移 Displacement (s)', unit: 'm' },
                                    { k: 'u', label: '初速 Initial Velocity (u)', unit: 'm/s' },
                                    { k: 'v', label: '末速 Final Velocity (v)', unit: 'm/s' },
                                    { k: 'a', label: '加速度 Acceleration (a)', unit: 'm/s²' },
                                    { k: 't', label: '時間 Time (t)', unit: 's' }
                                ].map((field) => (
                                    <div key={field.k} className="relative group">
                                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">{field.label}</label>
                                        <div className="relative">
                                            <input 
                                                type="number" name={field.k} value={inputs[field.k]} onChange={handleInputChange}
                                                placeholder={results ? results[field.k].toFixed(2) : "未知"}
                                                className={`w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-white font-mono transition-all ${results && inputs[field.k] === '' ? 'solved-field shadow-[0_0_15px_rgba(16,185,129,0.2)]' : ''}`}
                                            />
                                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-600 group-hover:text-slate-400 transition-colors">{field.unit}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {error && <div className="mt-4 p-4 bg-red-900/20 border border-red-500/50 rounded-2xl text-red-400 text-xs flex items-center gap-3 animate-pulse"><i data-lucide="alert-triangle"></i> {error}</div>}
                            <div className="mt-8 flex gap-3">
                                <button onClick={solve} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-900/20 active:scale-95 flex items-center justify-center gap-2"><i data-lucide="zap"></i> 開始計算</button>
                                <button onClick={reset} className="px-6 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl transition-all active:rotate-180"><i data-lucide="rotate-ccw"></i></button>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl overflow-hidden relative min-h-[220px] flex flex-col justify-between">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-white font-bold flex items-center gap-2 text-sm uppercase tracking-widest"><i data-lucide="play-circle" className="text-emerald-400"></i> 物理過程模擬</h3>
                                {results && <button onClick={startAnimation} disabled={animating} className={`px-4 py-1.5 rounded-lg font-bold text-xs transition-all ${animating ? 'bg-slate-900 text-slate-600' : 'bg-emerald-600 text-white shadow-lg'}`}>{animating ? '運行中...' : '重播動畫'}</button>}
                            </div>
                            <div className="relative w-full h-32 bg-slate-950 rounded-2xl border border-slate-700 overflow-hidden shadow-inner flex items-end pb-4">
                                <div className="absolute inset-x-0 bottom-4 h-0.5 bg-slate-800"></div>
                                <div className="absolute left-0 bottom-4 h-2 w-px bg-slate-700"></div>
                                <div className="absolute left-1 bottom-0 text-[8px] text-slate-600 font-bold">START</div>
                                <div className="absolute bottom-4 w-14 h-9 bg-indigo-600 rounded-lg shadow-[0_0_20px_rgba(79,70,229,0.4)] flex items-center justify-center border-t-2 border-indigo-400 transition-transform duration-75 ease-linear" style={{ transform: `translateX(${Math.min(300, carX * 15)}px)` }}>
                                    <i data-lucide="car" className="text-white/40 w-6 h-6"></i>
                                </div>
                            </div>
                            <div className="flex justify-between mt-4 font-mono text-[10px] text-slate-500 uppercase font-bold tracking-tighter">
                                <span>計時: {animTime.toFixed(2)}s</span>
                                <span className="text-emerald-400">當前位置: {carX.toFixed(2)}m</span>
                            </div>
                        </div>

                        {steps.length > 0 && (
                            <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <h3 className="text-emerald-400 font-bold mb-6 text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="list-checks"></i> 運算步驟與公式應用</h3>
                                <div className="space-y-4">
                                    {steps.map((step, i) => (
                                        <div key={i} className="text-xs font-mono text-slate-300 border-l-2 border-indigo-500/50 pl-4 py-2 bg-slate-900/50 rounded-r-xl leading-relaxed">{step}</div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {!results && !error && (
                            <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                                <h4 className="text-indigo-400 font-bold text-xs uppercase mb-3 flex items-center gap-2"><i data-lucide="help-circle"></i> 如何使用求解器？</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed italic">在 5 個運動參數（s, u, v, a, t）中填入任意 <b>3</b> 個已知數值。求解器將根據物理規律為你推導出剩餘的 2 個參數，並同步顯示解題步驟。</p>
                            </div>
                        )}
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
