<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噪音分貝實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .meter-gradient {
            background: conic-gradient(from 180deg at 50% 100%, 
                #22c55e 0deg, 
                #22c55e 60deg, 
                #eab308 60deg, 
                #eab308 120deg, 
                #ef4444 120deg, 
                #ef4444 180deg);
        }
        .needle-pivot { transform-origin: bottom center; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #ec4899;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SCENES = [
        { id: 'silence', label: '靜寂', db: 0, icon: 'volume-x', desc: '聽覺閾值 (I₀)' },
        { id: 'leaves', label: '樹葉摩擦', db: 20, icon: 'wind', desc: '極度安靜' },
        { id: 'library', label: '圖書館', db: 40, icon: 'book-open', desc: '寧靜環境' },
        { id: 'conversation', label: '普通交談', db: 60, icon: 'message-circle', desc: '適中音量' },
        { id: 'traffic', label: '城市交通', db: 80, icon: 'car', desc: '吵雜 (開始感到不適)' },
        { id: 'drill', label: '電鑽', db: 100, icon: 'hammer', desc: '極度吵雜 (長期暴露傷聽覺)' },
        { id: 'concert', label: '搖滾演唱會', db: 120, icon: 'music', desc: '痛覺閾值' },
        { id: 'jet', label: '噴射引擎', db: 140, icon: 'plane', desc: '瞬間造成永久損害' }
    ];

    const App = () => {
        const [currentDb, setCurrentDb] = useState(60);
        const [displayDb, setDisplayDb] = useState(60); 
        const [isPlaying, setIsPlaying] = useState(false);
        const [intensity, setIntensity] = useState(1); 

        const audioCtxRef = useRef(null);
        const gainRef = useRef(null);
        const noiseNodeRef = useRef(null);

        // 分貝數值與指針動畫
        useEffect(() => {
            let frame;
            const animate = () => {
                setDisplayDb(prev => {
                    const diff = currentDb - prev;
                    if (Math.abs(diff) < 0.1) return currentDb;
                    return prev + diff * 0.1;
                });
                frame = requestAnimationFrame(animate);
            };
            animate();
            return () => cancelAnimationFrame(frame);
        }, [currentDb]);

        // 計算強度比與音量反饋
        useEffect(() => {
            // 強度比 I/I0 = 10^(dB/10)
            const I = Math.pow(10, currentDb / 10);
            setIntensity(I);
            
            if (gainRef.current && isPlaying) {
                // 將 dB 映射到音頻增益 (Gain)
                // 140dB 太響，我們壓縮範圍以便安全演示：0-100dB 對應 0-0.4 增益
                const vol = Math.min(0.4, (currentDb / 120) * 0.4);
                gainRef.current.gain.setTargetAtTime(currentDb === 0 ? 0 : vol, audioCtxRef.current.currentTime, 0.1);
            }
        }, [currentDb, isPlaying]);

        // 初始化 Web Audio API
        const initAudio = () => {
            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                audioCtxRef.current = ctx;
                
                const gain = ctx.createGain();
                gain.connect(ctx.destination);
                gainRef.current = gain;

                const bufferSize = ctx.sampleRate * 2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; // 白噪音
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;
                noise.connect(gain);
                noiseNodeRef.current = noise;
                noise.start();
                gain.gain.setValueAtTime(0, ctx.currentTime);
            }
        };

        const togglePlay = () => {
            initAudio();
            if (isPlaying) {
                audioCtxRef.current.suspend();
                setIsPlaying(false);
            } else {
                audioCtxRef.current.resume();
                setIsPlaying(true);
            }
        };

        const needleAngle = -90 + (displayDb / 140) * 180;

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center space-x-3">
                        <div className="bg-pink-500/20 p-2 rounded-lg text-pink-500">
                            <i data-lucide="volume-2"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">噪音分貝實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Sound Intensity (Decibel)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    {/* 左側：儀表板與視覺化 */}
                    <div className="lg:col-span-7 space-y-6">
                        
                        {/* 模擬分貝計 */}
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-8 flex flex-col items-center shadow-2xl relative overflow-hidden h-[400px] justify-center">
                            <div className="absolute top-6 left-8 text-[10px] font-bold text-slate-500 uppercase tracking-widest border border-slate-700 px-2 py-1 rounded">聲級計 (dB Meter)</div>
                            
                            <div className="relative w-72 h-36 mt-4">
                                <div className="absolute inset-0 rounded-t-full meter-gradient opacity-10"></div>
                                <div className="absolute inset-2 rounded-t-full bg-slate-800 border-t border-slate-700"></div>
                                
                                {/* 刻度 */}
                                {[0, 20, 40, 60, 80, 100, 120, 140].map(val => {
                                    const rot = -90 + (val / 140) * 180;
                                    return (
                                        <div key={val} className="absolute bottom-0 left-1/2 w-0.5 h-full origin-bottom" style={{transform: `rotate(${rot}deg)`}}>
                                            <div className="w-full h-4 bg-slate-500 absolute top-0"></div>
                                            <div className="absolute top-5 left-1/2 -translate-x-1/2 text-[10px] font-bold text-slate-500" style={{transform: `translate(-50%, 0) rotate(${-rot}deg)`}}>
                                                {val}
                                            </div>
                                        </div>
                                    );
                                })}

                                {/* 指針 */}
                                <div 
                                    className="absolute bottom-0 left-1/2 w-1.5 h-32 bg-red-500 origin-bottom needle-pivot shadow-[0_0_15px_rgba(239,68,68,0.5)]"
                                    style={{transform: `rotate(${needleAngle}deg)`}}
                                ></div>
                                <div className="absolute bottom-0 left-1/2 w-6 h-6 bg-slate-300 rounded-full -translate-x-1/2 translate-y-1/2 border-4 border-slate-800 z-10"></div>
                            </div>

                            <div className="bg-slate-950 border-2 border-slate-700 rounded-2xl px-10 py-4 mt-12 shadow-inner text-center">
                                <span className={`text-5xl font-black font-mono tracking-tighter ${displayDb >= 85 ? 'text-red-500 animate-pulse' : displayDb >= 60 ? 'text-yellow-400' : 'text-emerald-400'}`}>
                                    {displayDb.toFixed(1)} <span className="text-sm">dB</span>
                                </span>
                            </div>

                            {displayDb >= 85 && (
                                <div className="absolute bottom-6 flex items-center gap-2 text-red-400 text-[10px] font-bold uppercase tracking-widest bg-red-900/20 px-4 py-1 rounded-full border border-red-500/30">
                                    <i data-lucide="alert-triangle" className="w-3 h-3"></i> 需要聽力保護
                                </div>
                            )}
                        </div>

                        {/* 強度比視覺化 (Log vs Linear) */}
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h3 className="text-white font-bold text-sm flex items-center gap-2">
                                <i data-lucide="bar-chart-3" className="text-indigo-400 w-5 h-5"></i>
                                對數刻度 vs 真實能量強度
                            </h3>
                            
                            <div className="space-y-6">
                                <div>
                                    <div className="flex justify-between text-xs text-slate-400 mb-2">
                                        <span>分貝級數 (Logarithmic - 感覺音量)</span>
                                        <span className="text-white font-bold">{currentDb} dB</span>
                                    </div>
                                    <div className="w-full h-4 bg-slate-900 rounded-full overflow-hidden border border-slate-700">
                                        <div className="h-full bg-indigo-500 transition-all duration-500" style={{width: `${(currentDb/140)*100}%`}}></div>
                                    </div>
                                </div>

                                <div>
                                    <div className="flex justify-between text-xs text-slate-400 mb-2">
                                        <span>能量強度 (Linear - 物理能量)</span>
                                        <span className="text-pink-400 font-mono font-bold">10^{ (currentDb/10).toFixed(1) } &times; I₀</span>
                                    </div>
                                    <div className="w-full h-4 bg-slate-900 rounded-full overflow-hidden relative border border-slate-700 shadow-inner">
                                        <div 
                                            className="h-full bg-pink-500 transition-all duration-500 shadow-[0_0_15px_rgba(236,72,153,0.5)]" 
                                            style={{ width: `${Math.min(100, Math.pow(10, (currentDb - 140)/10) * 100)}%` }}
                                        ></div>
                                        {currentDb < 110 && (
                                            <div className="absolute left-0 top-0 h-full w-0.5 bg-pink-400/50 animate-pulse"></div>
                                        )}
                                    </div>
                                    <p className="text-[10px] text-slate-500 mt-2 italic leading-relaxed">
                                        {currentDb < 100 ? "注意：相較於噴射引擎，此等級的物理能量在圖表中「幾乎隱形」！" : "注意：能量正隨分貝數呈幾何級數暴增。"}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 右側：控制面板 */}
                    <div className="lg:col-span-5 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl h-full flex flex-col">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-white font-bold text-lg flex items-center gap-2">
                                    <i data-lucide="music-4" className="text-pink-400 w-5 h-5"></i> 噪音場景選擇
                                </h2>
                                <button 
                                    onClick={togglePlay}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border ${isPlaying ? 'bg-red-500/20 border-red-500 text-red-400' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                >
                                    <i data-lucide={isPlaying ? "volume-x" : "volume-2"}></i>
                                    {isPlaying ? "靜音模擬" : "開啟音頻"}
                                </button>
                            </div>

                            <div className="space-y-3 flex-1 overflow-y-auto pr-2 custom-scroll">
                                {SCENES.map(scene => (
                                    <button
                                        key={scene.id}
                                        onClick={() => setCurrentDb(scene.db)}
                                        className={`w-full p-4 rounded-2xl border transition-all flex items-center justify-between group ${currentDb === scene.db ? 'bg-indigo-600 border-indigo-400 shadow-lg shadow-indigo-900/20' : 'bg-slate-900/50 border-slate-700 hover:border-slate-500'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className={`p-3 rounded-xl ${currentDb === scene.db ? 'bg-white/20' : 'bg-slate-800'}`}>
                                                <i data-lucide={scene.icon} className={`w-5 h-5 ${currentDb === scene.db ? 'text-white' : 'text-slate-500'}`}></i>
                                            </div>
                                            <div className="text-left">
                                                <div className={`font-bold text-sm ${currentDb === scene.db ? 'text-white' : 'text-slate-200'}`}>{scene.label}</div>
                                                <div className={`text-[10px] font-medium ${currentDb === scene.db ? 'text-indigo-200' : 'text-slate-500'}`}>{scene.desc}</div>
                                            </div>
                                        </div>
                                        <div className={`font-mono font-black ${currentDb === scene.db ? 'text-white' : 'text-slate-400'}`}>
                                            {scene.db} dB
                                        </div>
                                    </button>
                                ))}
                            </div>

                            <div className="pt-8 mt-6 border-t border-slate-700">
                                <label className="flex justify-between text-xs font-bold text-pink-300 uppercase mb-4 tracking-widest">
                                    <span>手動微調強弱</span>
                                    <span className="font-mono">{currentDb} dB</span>
                                </label>
                                <input 
                                    type="range" min="0" max="140" step="1" 
                                    value={currentDb} onChange={(e) => setCurrentDb(Number(e.target.value))}
                                    className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" 
                                />
                                <div className="flex justify-between mt-3 text-[9px] text-slate-500 font-bold uppercase tracking-tighter">
                                    <span>無聲 (0)</span>
                                    <span>痛苦閾值 (120)</span>
                                    <span>破壞性 (140)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
