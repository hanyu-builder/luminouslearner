<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛頓第二定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .slider-thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
        .slider-thumb-orange::-webkit-slider-thumb { background: #f97316; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 300;
    const TRACK_Y = 200;
    const PIXELS_PER_METER = 50; 

    const App = () => {
        // --- 狀態管理 ---
        const [force, setForce] = useState(10); // 牛頓
        const [mass, setMass] = useState(2.0);  // 公斤
        
        const [simState, setSimState] = useState('idle'); 
        const [time, setTime] = useState(0);
        const [position, setPosition] = useState(0);
        const [velocity, setVelocity] = useState(0);
        const [acceleration, setAcceleration] = useState(0);

        const requestRef = useRef();
        const startTimeRef = useRef(0);
        const physicsRef = useRef({ x: 0, v: 0 }); 
        const historyRef = useRef([]); 

        // 核心物理引擎：當輸入改變時計算理論加速度
        useEffect(() => {
            setAcceleration(force / mass);
        }, [force, mass]);

        const startSim = () => {
            if (simState === 'running') return;
            setSimState('running');
            physicsRef.current = { x: 0, v: 0 };
            historyRef.current = [];
            startTimeRef.current = Date.now();
            loop();
        };

        const resetSim = () => {
            setSimState('idle');
            cancelAnimationFrame(requestRef.current);
            setTime(0);
            setPosition(0);
            setVelocity(0);
            historyRef.current = [];
            physicsRef.current = { x: 0, v: 0 };
        };

        const loop = () => {
            const dt = 0.016; 
            const currentAcc = force / mass; 
            
            // 更新物理狀態
            physicsRef.current.v += currentAcc * dt;
            physicsRef.current.x += physicsRef.current.v * dt;
            
            const t = historyRef.current.length * dt;

            // 停止條件：到達軌道終點 (約 14 公尺)
            if (physicsRef.current.x > 14) {
                setSimState('finished');
                return;
            }

            // 紀錄歷史數據用於圖表
            if (historyRef.current.length % 5 === 0) {
                historyRef.current.push({ t: t, v: physicsRef.current.v });
            } else {
                historyRef.current.push({ t: t, v: physicsRef.current.v });
            }

            // 同步至 UI
            setTime(t);
            setPosition(physicsRef.current.x);
            setVelocity(physicsRef.current.v);

            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 畫布渲染 ---
        const canvasRef = useRef(null);
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製軌道
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, TRACK_Y, CANVAS_WIDTH, 12);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 10px JetBrains Mono';
            for (let i = 0; i <= 15; i++) {
                const x = 50 + i * PIXELS_PER_METER;
                ctx.fillRect(x, TRACK_Y, 2, 12);
                ctx.fillText(`${i}m`, x - 8, TRACK_Y + 28);
            }

            // 2. 繪製滑車
            const cartX = 50 + position * PIXELS_PER_METER;
            const cartY = TRACK_Y - 45;
            const cartWidth = 65 + mass * 5; 
            
            // 輪胎
            ctx.fillStyle = '#020617';
            ctx.beginPath(); ctx.arc(cartX + 18, TRACK_Y - 5, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cartX + cartWidth - 18, TRACK_Y - 5, 10, 0, Math.PI*2); ctx.fill();

            // 車身
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath(); ctx.roundRect(cartX, cartY, cartWidth, 40, 6); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();
            
            ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`${mass}kg`, cartX + cartWidth/2, cartY + 25);

            // 3. 繪製作用力向量 (F)
            if (force > 0 && simState !== 'idle') {
                const arrowLen = force * 3.5; 
                const arrowY = cartY + 20;
                const arrowStartX = cartX + cartWidth;
                const arrowEndX = arrowStartX + arrowLen;

                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 4; ctx.beginPath();
                ctx.moveTo(arrowStartX, arrowY); ctx.lineTo(arrowEndX, arrowY); ctx.stroke();
                ctx.beginPath(); ctx.fillStyle = '#f97316';
                ctx.moveTo(arrowEndX, arrowY); ctx.lineTo(arrowEndX - 10, arrowY - 6); ctx.lineTo(arrowEndX - 10, arrowY + 6); ctx.fill();
                ctx.font = 'bold 12px Inter'; ctx.fillText(`F = ${force}N`, arrowStartX + 25, arrowY - 12);
            }

            // 4. 繪製加速度向量 (a)
            if (acceleration > 0 && simState === 'running') {
                const accLen = acceleration * 12; 
                const accY = cartY - 35;
                const accStartX = cartX + cartWidth / 2;
                const accEndX = accStartX + accLen;
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
                ctx.beginPath(); ctx.moveTo(accStartX, accY); ctx.lineTo(accEndX, accY); ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath(); ctx.fillStyle = '#10b981';
                ctx.moveTo(accEndX, accY); ctx.lineTo(accEndX - 8, accY - 5); ctx.lineTo(accEndX - 8, accY + 5); ctx.fill();
                ctx.font = 'bold 11px Inter'; ctx.fillText(`a = ${acceleration.toFixed(2)} m/s²`, accStartX + 30, accY - 10);
            }
        }, [position, force, mass, acceleration, simState]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400"><i data-lucide="rocket"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">牛頓第二定律實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Dynamics (F = ma)</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="sliders" className="text-indigo-400"></i> 實驗參數設定</h2>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-orange-400 uppercase tracking-widest mb-3"><span>作用力 (F)</span><span className="text-white font-mono">{force} N</span></label>
                                <input type="range" min="0" max="50" step="1" value={force} onChange={(e) => setForce(Number(e.target.value))} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb slider-thumb-orange" />
                            </div>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><span>滑車質量 (m)</span><span className="text-white font-mono">{mass} kg</span></label>
                                <input type="range" min="1.0" max="10.0" step="0.5" value={mass} onChange={(e) => setMass(Number(e.target.value))} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb slider-thumb-blue" />
                            </div>
                            <button onClick={simState === 'idle' ? startSim : resetSim} className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg ${simState === 'running' ? 'bg-red-600/20 text-red-400 border border-red-500/50' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}>
                                <i data-lucide={simState === 'running' ? "rotate-ccw" : "play"}></i>
                                {simState === 'running' ? '重置實驗' : simState === 'finished' ? '再次實驗' : '啟動模擬'}
                            </button>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl h-64 relative">
                            <h3 className="text-slate-500 text-[10px] font-bold uppercase tracking-widest absolute top-6 left-6">速度 - 時間關係圖 (v-t Graph)</h3>
                            <svg width="100%" height="100%" viewBox="0 0 300 200" className="overflow-visible mt-4">
                                <line x1="35" y1="170" x2="280" y2="170" stroke="#475569" strokeWidth="1" />
                                <line x1="35" y1="170" x2="35" y2="20" stroke="#475569" strokeWidth="1" />
                                <text x="160" y="195" fill="#64748b" fontSize="10" textAnchor="middle">時間 (s)</text>
                                <text x="10" y="95" fill="#64748b" fontSize="10" textAnchor="middle" transform="rotate(-90, 10, 95)">速度 (m/s)</text>
                                {historyRef.current.length > 1 && (
                                    <polyline fill="none" stroke="#10b981" strokeWidth="2.5" points={historyRef.current.map((pt) => {
                                        const maxT = Math.max(5, historyRef.current[historyRef.current.length-1].t);
                                        const maxV = Math.max(12, acceleration * maxT);
                                        return `${35 + (pt.t / maxT) * 245},${170 - (pt.v / maxV) * 150}`;
                                    }).join(' ')} />
                                )}
                            </svg>
                        </div>
                    </div>

                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="flex flex-col items-center md:items-start">
                                <h3 className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">牛頓第二定律公式</h3>
                                <div className="text-4xl font-serif font-black text-white italic tracking-widest">F = m &middot; a</div>
                            </div>
                            <div className="h-12 w-px bg-slate-700 hidden md:block"></div>
                            <div className="flex gap-10 text-center">
                                <div><div className="text-3xl font-black text-emerald-400 font-mono tracking-tighter">{acceleration.toFixed(2)}</div><div className="text-[9px] text-slate-500 font-bold uppercase">加速度 (m/s²)</div></div>
                                <div className="text-2xl font-bold text-slate-600 self-center">=</div>
                                <div><div className="text-3xl font-black text-orange-400 font-mono tracking-tighter">{force}</div><div className="text-[9px] text-slate-500 font-bold uppercase">推力 (N)</div></div>
                                <div className="text-2xl font-bold text-slate-600 self-center">/</div>
                                <div><div className="text-3xl font-black text-blue-400 font-mono tracking-tighter">{mass}</div><div className="text-[9px] text-slate-500 font-bold uppercase">質量 (kg)</div></div>
                            </div>
                        </div>

                        <div className="bg-slate-950 rounded-3xl border border-slate-800 flex-1 relative overflow-hidden shadow-inner min-h-[350px]">
                            <div className="absolute top-6 left-8 bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-800 text-[10px] font-mono text-slate-500 shadow-lg backdrop-blur-md">
                                <span className="text-blue-400 font-bold">時間:</span> {time.toFixed(2)}s &nbsp;|&nbsp; <span className="text-emerald-400 font-bold">位移:</span> {position.toFixed(2)}m
                            </div>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner flex items-start gap-4">
                            <i data-lucide="lightbulb" className="w-5 h-5 text-indigo-400 shrink-0 mt-0.5"></i>
                            <div>
                                <h4 className="text-indigo-300 font-bold text-sm uppercase tracking-widest mb-1">實驗觀察要點</h4>
                                <p className="text-xs text-slate-400 leading-relaxed italic">
                                    當你<b>增加作用力 F</b> 時，請觀察 v-t 圖的斜率變化；當你<b>增加滑車質量 m</b> 時，斜率會變陡還是變平緩？這對理解物體的「慣性」與受力反應有什麼啟發？
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
