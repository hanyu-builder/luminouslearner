<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拋體運動模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .canvas-container { cursor: crosshair; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const GROUND_Y = 450;
    const LAUNCH_X = 50;
    const LAUNCH_Y = GROUND_Y - 20; 
    const SCALE = 10; 
    const G = 9.81;

    const App = () => {
        const [angle, setAngle] = useState(45); 
        const [velocity, setVelocity] = useState(25); 
        const [showVectors, setShowVectors] = useState(true);
        const [showGrid, setShowGrid] = useState(true);
        const [simState, setSimState] = useState('idle'); 
        
        const [time, setTime] = useState(0);
        const [currentPos, setCurrentPos] = useState({ x: 0, y: 0 });
        const [maxHeight, setMaxHeight] = useState(0);
        const [range, setRange] = useState(0);

        const physicsRef = useRef({ x: 0, y: 0, vx: 0, vy: 0, t: 0, path: [] });
        const requestRef = useRef();
        const canvasRef = useRef(null);

        const fire = () => {
            if (simState === 'running') return;
            const rad = angle * (Math.PI / 180);
            physicsRef.current = {
                x: 0, y: 0,
                vx: velocity * Math.cos(rad),
                vy: velocity * Math.sin(rad),
                t: 0,
                path: [{x: 0, y: 0}]
            };
            setMaxHeight(0); setRange(0); setTime(0);
            setCurrentPos({x: 0, y: 0});
            setSimState('running');
            loop();
        };

        const reset = () => {
            cancelAnimationFrame(requestRef.current);
            setSimState('idle');
            physicsRef.current = { x: 0, y: 0, vx: 0, vy: 0, t: 0, path: [] };
            setTime(0); setCurrentPos({x: 0, y: 0});
            draw();
        };

        const loop = () => {
            const dt = 0.03;
            const state = physicsRef.current;
            state.t += dt;
            state.x += state.vx * dt;
            state.vy -= G * dt;
            state.y += state.vy * dt;
            state.path.push({ x: state.x, y: state.y });

            if (state.y > maxHeight) setMaxHeight(state.y);
            setTime(state.t);
            setCurrentPos({ x: state.x, y: state.y });

            if (state.y < 0) {
                state.y = 0;
                setRange(state.x);
                setSimState('finished');
                draw();
                return;
            }
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, '#0f172a'); skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);
            ctx.fillStyle = '#334155'; ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            if (showGrid) {
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.beginPath();
                for(let x=LAUNCH_X; x<CANVAS_WIDTH; x+=10*SCALE) {
                    ctx.moveTo(x, 0); ctx.lineTo(x, GROUND_Y);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '10px monospace';
                    ctx.fillText(`${(x-LAUNCH_X)/SCALE}m`, x+2, GROUND_Y-5);
                }
                for(let y=LAUNCH_Y; y>0; y-=10*SCALE) {
                    ctx.moveTo(0, y); ctx.lineTo(CANVAS_WIDTH, y);
                }
                ctx.stroke();
            }

            if (physicsRef.current.path.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                physicsRef.current.path.forEach((p, i) => {
                    const cx = LAUNCH_X + p.x * SCALE; const cy = LAUNCH_Y - p.y * SCALE;
                    if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
                });
                ctx.stroke(); ctx.setLineDash([]);
            }

            ctx.save(); ctx.translate(LAUNCH_X, LAUNCH_Y); ctx.rotate(-angle * Math.PI / 180);
            ctx.fillStyle = '#475569'; ctx.fillRect(0, -10, 40, 20); ctx.restore();
            ctx.beginPath(); ctx.arc(LAUNCH_X, LAUNCH_Y, 15, 0, Math.PI*2); ctx.fillStyle = '#64748b'; ctx.fill();
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.stroke();

            const state = physicsRef.current;
            const px = LAUNCH_X + state.x * SCALE;
            const py = LAUNCH_Y - state.y * SCALE;

            if (simState !== 'idle') {
                ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.fillStyle = '#facc15'; ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

                if (showVectors && simState === 'running') {
                    const vScale = 3;
                    drawArrow(ctx, px, py, state.vx * vScale, -state.vy * vScale, '#10b981', 'v');
                    drawArrow(ctx, px, py, state.vx * vScale, 0, '#3b82f6', 'vx');
                    drawArrow(ctx, px, py, 0, -state.vy * vScale, '#ef4444', 'vy');
                }
            } else {
                if (showVectors) {
                    const rad = angle * Math.PI/180;
                    const vScale = 3;
                    drawArrow(ctx, LAUNCH_X, LAUNCH_Y, velocity * Math.cos(rad) * vScale, -velocity * Math.sin(rad) * vScale, '#10b981', 'u');
                }
            }
        };

        const drawArrow = (ctx, x, y, dx, dy, color, label) => {
            if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
            const toX = x + dx; const toY = y + dy;
            const angle = Math.atan2(dy, dx); const headLen = 10;
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.moveTo(x, y); ctx.lineTo(toX, toY); ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = color; ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI/6), toY - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI/6), toY - headLen * Math.sin(angle + Math.PI/6));
            ctx.fill();
            ctx.font = 'bold 12px sans-serif'; ctx.fillText(label, toX + 10, toY);
        };

        useEffect(() => { draw(); return () => cancelAnimationFrame(requestRef.current); }, [angle, velocity, showVectors, showGrid]);
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 flex flex-col overflow-hidden">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg h-16 shrink-0">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-600 p-2 rounded-lg"><i data-lucide="crosshair" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">拋體運動模擬器</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-blue-400 border border-slate-700 uppercase">DSE Physics: Kinematics</div>
                </nav>

                <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
                    <div className="lg:col-span-9 bg-slate-950 relative border-r border-slate-800">
                        <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain canvas-container" />
                        
                        <div className="absolute top-4 right-4 flex flex-col gap-2 pointer-events-none">
                            <div className="bg-slate-900/90 backdrop-blur p-3 rounded-xl border border-slate-700 text-[11px] font-mono shadow-xl">
                                <div className="text-slate-500 uppercase font-black mb-1">運動時間</div>
                                <div className="text-white font-black text-lg">{time.toFixed(2)} s</div>
                            </div>
                            <div className="bg-slate-900/90 backdrop-blur p-3 rounded-xl border border-slate-700 text-[11px] font-mono shadow-xl">
                                <div className="text-emerald-500 uppercase font-black mb-1">當前高度 (y)</div>
                                <div className="text-emerald-400 font-black text-lg">{currentPos.y.toFixed(1)} m</div>
                            </div>
                            <div className="bg-slate-900/90 backdrop-blur p-3 rounded-xl border border-slate-700 text-[11px] font-mono shadow-xl">
                                <div className="text-blue-500 uppercase font-black mb-1">水平距離 (x)</div>
                                <div className="text-blue-400 font-black text-lg">{currentPos.x.toFixed(1)} m</div>
                            </div>
                        </div>
                    </div>

                    <aside className="lg:col-span-3 bg-slate-900 p-6 flex flex-col gap-6 overflow-y-auto border-l border-slate-800 custom-scroll">
                        <div className="space-y-6">
                            <div>
                                <label className="flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3"><span>發射角度 (Angle)</span><span className="text-yellow-400 text-sm font-mono">{angle}°</span></label>
                                <input type="range" min="0" max="90" step="1" value={angle} onChange={(e) => { setAngle(Number(e.target.value)); reset(); }} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>

                            <div>
                                <label className="flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3"><span>初始速度 (Velocity)</span><span className="text-emerald-400 text-sm font-mono">{velocity} m/s</span></label>
                                <input type="range" min="5" max="50" step="1" value={velocity} onChange={(e) => { setVelocity(Number(e.target.value)); reset(); }} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>
                        </div>

                        <div className="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 space-y-4">
                            <h3 className="text-white font-black text-[10px] uppercase tracking-widest flex items-center gap-2"><i data-lucide="eye" className="w-4 h-4 text-indigo-400"></i> 視覺化設定</h3>
                            <label className="flex items-center justify-between cursor-pointer group"><span className="text-[11px] font-bold text-slate-400 group-hover:text-slate-200 transition-colors">顯示速度向量</span><input type="checkbox" checked={showVectors} onChange={() => setShowVectors(!showVectors)} className="w-4 h-4 rounded border-slate-600 text-blue-600 bg-slate-900 focus:ring-0" /></label>
                            <label className="flex items-center justify-between cursor-pointer group"><span className="text-[11px] font-bold text-slate-400 group-hover:text-slate-200 transition-colors">顯示坐標網格</span><input type="checkbox" checked={showGrid} onChange={() => setShowGrid(!showGrid)} className="w-4 h-4 rounded border-slate-600 text-blue-600 bg-slate-900 focus:ring-0" /></label>
                        </div>

                        <div className="mt-auto space-y-3">
                            <button onClick={simState === 'idle' ? fire : reset} className={`w-full py-4 rounded-xl font-black uppercase text-xs tracking-[0.2em] shadow-lg transition-all flex items-center justify-center gap-2 ${simState === 'running' ? 'bg-slate-800 text-slate-600 border border-slate-700' : simState === 'finished' ? 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-900/20' : 'bg-red-600 hover:bg-red-500 text-white shadow-red-900/20'}`}><i data-lucide={simState === 'idle' ? "rocket" : "rotate-ccw"}></i> {simState === 'idle' ? '發射！' : '重設實驗'}</button>
                        </div>

                        {simState === 'finished' && (
                            <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-2xl animate-in zoom-in duration-300">
                                <h3 className="text-indigo-400 font-black text-[10px] uppercase tracking-widest mb-4 flex items-center gap-2"><i data-lucide="clipboard-check" className="w-4 h-4"></i> 模擬結果數據</h3>
                                <div className="space-y-4 font-mono">
                                    <div><div className="text-[10px] text-slate-500 uppercase font-bold">最高點 (Max H)</div><div className="text-xl font-black text-white">{maxHeight.toFixed(2)} m</div></div>
                                    <div className="h-px bg-slate-800"></div>
                                    <div><div className="text-[10px] text-slate-500 uppercase font-bold">總射程 (Range)</div><div className="text-xl font-black text-white">{range.toFixed(2)} m</div></div>
                                    <div className="h-px bg-slate-800"></div>
                                    <div><div className="text-[10px] text-slate-500 uppercase font-bold">飛行時間 (Time)</div><div className="text-xl font-black text-white">{time.toFixed(2)} s</div></div>
                                </div>
                            </div>
                        )}
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
</script>
</body>
</html>
