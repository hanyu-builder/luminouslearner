<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凹透鏡成像實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
        .thumb-orange::-webkit-slider-thumb { background: #f97316; }
        .canvas-container { cursor: ew-resize; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const LENS_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const LENS_HEIGHT = 200;

    const App = () => {
        // --- 狀態 ---
        const [focalLength, setFocalLength] = useState(120); 
        const [objDist, setObjDist] = useState(250); 
        const [objHeight, setObjHeight] = useState(70); 
        
        const [showRays, setShowRays] = useState(true);
        const [isDragging, setIsDragging] = useState(false);

        // --- 物理計算 ---
        const f = focalLength; 
        const di_val = -(f * objDist) / (f + objDist); 
        
        const magnification = -di_val / objDist; 
        const imgHeight = objHeight * magnification; 

        const imgX = LENS_X - Math.abs(di_val);

        const canvasRef = useRef(null);

        // --- 互動邏輯 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const objX = LENS_X - objDist;
            
            if (Math.abs(x - objX) < 30) {
                setIsDragging(true);
            }
        };

        const handleMouseMove = (e) => {
            if (!isDragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            let x = e.clientX - rect.left;
            
            if (x > LENS_X - 20) x = LENS_X - 20;
            if (x < 20) x = 20;
            
            setObjDist(LENS_X - x);
        };

        const handleMouseUp = () => {
            setIsDragging(false);
        };

        const reset = () => {
            setFocalLength(120);
            setObjDist(250);
        };

        // --- 渲染 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 主光軸
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(CANVAS_WIDTH, CENTER_Y);
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. 繪製凹透鏡
            ctx.fillStyle = 'rgba(147, 197, 253, 0.1)';
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(LENS_X - 10, CENTER_Y - LENS_HEIGHT/2);
            ctx.quadraticCurveTo(LENS_X, CENTER_Y, LENS_X - 10, CENTER_Y + LENS_HEIGHT/2);
            ctx.lineTo(LENS_X + 10, CENTER_Y + LENS_HEIGHT/2);
            ctx.quadraticCurveTo(LENS_X, CENTER_Y, LENS_X + 10, CENTER_Y - LENS_HEIGHT/2);
            ctx.lineTo(LENS_X - 10, CENTER_Y - LENS_HEIGHT/2);
            ctx.fill();
            ctx.stroke();
            
            // 光學中心線
            ctx.beginPath();
            ctx.moveTo(LENS_X, CENTER_Y - LENS_HEIGHT/2);
            ctx.lineTo(LENS_X, CENTER_Y + LENS_HEIGHT/2);
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 2]);
            ctx.strokeStyle = '#93c5fd';
            ctx.stroke();
            ctx.setLineDash([]);

            // 3. 標記焦點 F 與 2F
            const drawFocus = (x, label) => {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(x, CENTER_Y, 4, 0, Math.PI*2); ctx.fill();
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(label, x - 5, CENTER_Y + 20);
            };
            
            const fNearX = LENS_X - focalLength;
            const fFarX = LENS_X + focalLength;
            
            drawFocus(fNearX, 'F');
            drawFocus(LENS_X - 2*focalLength, '2F');
            drawFocus(fFarX, 'F\'');
            drawFocus(LENS_X + 2*focalLength, '2F\'');

            // 4. 繪製物體
            const objX = LENS_X - objDist;
            drawCandle(ctx, objX, CENTER_Y, objHeight, 1.0, "物體");

            // 5. 繪製像
            drawCandle(ctx, imgX, CENTER_Y, imgHeight, 0.6, "虛像");

            // 6. 光路追蹤
            if (showRays) {
                const objTopY = CENTER_Y - objHeight;
                const imgTopY = CENTER_Y - imgHeight;

                // 射線 1：平行軸 -> 經由近處焦點發散
                ctx.strokeStyle = '#facc15'; 
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(objX, objTopY);
                ctx.lineTo(LENS_X, objTopY); 
                ctx.stroke();
                const slope1 = (objTopY - CENTER_Y) / focalLength;
                const endX1 = CANVAS_WIDTH;
                const endY1 = objTopY + slope1 * (CANVAS_WIDTH - LENS_X);
                ctx.beginPath();
                ctx.moveTo(LENS_X, objTopY);
                ctx.lineTo(endX1, endY1);
                ctx.stroke();
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(LENS_X, objTopY);
                ctx.lineTo(fNearX, CENTER_Y);
                ctx.stroke();
                ctx.setLineDash([]);

                // 射線 2：穿過光心 -> 直線傳播
                ctx.strokeStyle = '#38bdf8'; 
                ctx.beginPath();
                ctx.moveTo(objX, objTopY);
                const slope2 = (CENTER_Y - objTopY) / (LENS_X - objX);
                const endX2 = CANVAS_WIDTH;
                const endY2 = CENTER_Y + slope2 * (CANVAS_WIDTH - LENS_X);
                ctx.lineTo(endX2, endY2);
                ctx.stroke();

                // 射線 3：趨向遠處焦點 -> 平行折射
                const m3 = (CENTER_Y - objTopY) / (fFarX - objX);
                const hitY3 = objTopY + m3 * (LENS_X - objX);
                ctx.strokeStyle = '#a855f7'; 
                ctx.beginPath();
                ctx.moveTo(objX, objTopY);
                ctx.lineTo(LENS_X, hitY3);
                ctx.stroke();
                ctx.setLineDash([2, 2]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(LENS_X, hitY3);
                ctx.lineTo(fFarX, CENTER_Y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(LENS_X, hitY3);
                ctx.lineTo(CANVAS_WIDTH, hitY3);
                ctx.stroke();
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(LENS_X, hitY3);
                ctx.lineTo(imgX, hitY3); 
                ctx.stroke();
                ctx.setLineDash([]);
            }

        }, [focalLength, objDist, objHeight, showRays]);

        const drawCandle = (ctx, x, baseY, height, alpha, label) => {
            ctx.save();
            ctx.translate(x, baseY);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#fde047';
            ctx.fillRect(-8, 0, 16, -height);
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(-1, -height - 5, 2, 5);
            ctx.beginPath();
            ctx.arc(0, -height - 10, 8, 0, Math.PI*2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -height - 10, 4, 0, Math.PI*2);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.fillStyle = alpha === 1 ? 'white' : '#60a5fa';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, 0, 20);
            ctx.restore();
        };

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-400">
                            <i data-lucide="eye"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">凹透鏡成像實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        主題：幾何光學 (Optics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_WIDTH} 
                                height={CANVAS_HEIGHT}
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                className="w-full h-full object-contain bg-slate-950 rounded-2xl canvas-container"
                            />
                            <div className="absolute top-4 left-4 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700 text-sm flex flex-col gap-1">
                                <span className="text-slate-500 font-bold text-[10px] uppercase tracking-widest">像的性質</span>
                                <span className="text-white font-bold">虛像、正立、縮小</span>
                            </div>
                            <div className="absolute bottom-4 left-4 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700 text-sm text-slate-300 backdrop-blur-md">
                                拖動 <strong>蠟燭</strong> 觀察成像與光路變化
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-wrap gap-8 items-center">
                            <div className="flex-1 min-w-[200px]">
                                <label className="flex justify-between text-xs text-slate-300 font-bold mb-1">
                                    物距 (u) <span className="text-blue-400">{objDist} px</span>
                                </label>
                                <input 
                                    type="range" min="50" max="350" step="10" 
                                    value={objDist} onChange={(e) => setObjDist(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue"
                                />
                            </div>
                            <div className="flex-1 min-w-[200px]">
                                <label className="flex justify-between text-xs text-slate-300 font-bold mb-1">
                                    焦距大小 (|f|) <span className="text-orange-400">{focalLength} px</span>
                                </label>
                                <input 
                                    type="range" min="50" max="250" step="10" 
                                    value={focalLength} onChange={(e) => setFocalLength(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-orange"
                                />
                            </div>
                            <label className="flex items-center gap-2 cursor-pointer p-2 rounded-lg bg-slate-700/50 hover:bg-slate-700 transition-colors">
                                <input type="checkbox" checked={showRays} onChange={() => setShowRays(!showRays)} className="rounded text-cyan-500 focus:ring-0" />
                                <span className="text-sm font-bold text-slate-300 uppercase tracking-widest">光線</span>
                            </label>
                            <button onClick={reset} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-bold transition-all flex items-center justify-center gap-2">
                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i> 重設
                            </button>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-4 flex items-center gap-2 text-lg">
                                <i data-lucide="calculator" className="text-indigo-400"></i> 成像數據
                            </h2>
                            <div className="space-y-4 font-mono text-sm">
                                <div className="p-3 rounded-xl bg-slate-950 border border-slate-700 text-center">
                                    <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">放大率 (M)</div>
                                    <div className="text-xl font-bold text-emerald-400">{magnification.toFixed(2)}x</div>
                                </div>
                                <div className="p-3 rounded-xl bg-slate-950 border border-slate-700 text-center">
                                    <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">像距 (v)</div>
                                    <div className="text-xl font-bold text-red-400">{di_val.toFixed(0)} px</div>
                                    <div className="text-[9px] text-slate-600 mt-1 uppercase italic">(負值表示虛像)</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest">
                                <i data-lucide="glasses" className="w-4 h-4"></i> 生活應用
                            </h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                <b>近視矯正：</b> 凹透鏡（發散透鏡）能將光線在進入眼睛前先行發散，使原本落在視網膜前的成像點後移，從而讓近視患者看清遠處物體。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
