<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉塞福散射實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .thumb-indigo::-webkit-slider-thumb { border-color: #6366f1; }
        .thumb-rose::-webkit-slider-thumb { border-color: #f43f5e; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const NUCLEUS_X = CANVAS_WIDTH * 0.6;
    const NUCLEUS_Y = CANVAS_HEIGHT / 2;
    const K_COU = 50000; // 庫侖力視覺模擬比例

    const App = () => {
        // --- 狀態 ---
        const [energy, setEnergy] = useState(5); 
        const [spread, setSpread] = useState(100); 
        const [showTrails, setShowTrails] = useState(true);
        const [isFiring, setIsFiring] = useState(true);
        
        // 統計數據
        const [totalCount, setTotalCount] = useState(0);
        const [deflectedCount, setDeflectedCount] = useState(0); 
        const [backscatterCount, setBackscatterCount] = useState(0); 

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const particlesRef = useRef([]); 
        
        // --- 物理邏輯 ---
        const spawnParticle = () => {
            const yOffset = (Math.random() - 0.5) * spread * 2;
            particlesRef.current.push({
                x: 0,
                y: NUCLEUS_Y + yOffset,
                vx: energy * 0.8 + 2.5, 
                vy: 0,
                trail: [],
                color: Math.random() > 0.92 ? '#fca5a5' : '#a5f3fc',
                history: 0,
                counted: false
            });
        };

        const updatePhysics = () => {
            const dt = 0.5;
            const nucleusR = 15;

            if (isFiring && Math.random() > 0.82) spawnParticle();

            particlesRef.current.forEach(p => {
                const dx = p.x - NUCLEUS_X;
                const dy = p.y - NUCLEUS_Y;
                const distSq = dx*dx + dy*dy;
                const dist = Math.sqrt(distSq);

                // 庫侖斥力 F = k / r^2
                if (dist > nucleusR) {
                    const force = K_COU / (distSq + 200); 
                    const ax = (force * dx / dist);
                    const ay = (force * dy / dist);
                    p.vx += ax * dt * 0.012; 
                    p.vy += ay * dt * 0.012;
                }

                p.x += p.vx * dt;
                p.y += p.vy * dt;

                if (showTrails && p.history % 4 === 0) {
                    p.trail.push({x: p.x, y: p.y});
                    if (p.trail.length > 18) p.trail.shift();
                }
                p.history++;

                // 統計分析
                if (!p.counted && (p.x > CANVAS_WIDTH - 50 || p.x < 0 || p.y < 0 || p.y > CANVAS_HEIGHT)) {
                    p.counted = true;
                    const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                    const angleRad = Math.acos(Math.min(1, p.vx / speed));
                    const angleDeg = angleRad * (180 / Math.PI);

                    setTotalCount(c => c + 1);
                    if (angleDeg > 15) setDeflectedCount(c => c + 1);
                    if (angleDeg > 90) setBackscatterCount(c => c + 1);
                }
            });

            particlesRef.current = particlesRef.current.filter(p => 
                p.x > -50 && p.x < CANVAS_WIDTH + 50 && 
                p.y > -50 && p.y < CANVAS_HEIGHT + 50
            );
        };

        const loop = () => {
            updatePhysics();
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 繪製背景網格
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.beginPath();
            for(let i=0; i<CANVAS_WIDTH; i+=50) { ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_HEIGHT); }
            for(let i=0; i<CANVAS_HEIGHT; i+=50) { ctx.moveTo(0, i); ctx.lineTo(CANVAS_WIDTH, i); }
            ctx.stroke();

            // 繪製金原子核
            const grad = ctx.createRadialGradient(NUCLEUS_X, NUCLEUS_Y, 5, NUCLEUS_X, NUCLEUS_Y, 45);
            grad.addColorStop(0, '#fbbf24'); grad.addColorStop(0.5, 'rgba(251, 191, 36, 0.2)'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(NUCLEUS_X, NUCLEUS_Y, 45, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(NUCLEUS_X, NUCLEUS_Y, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'center'; ctx.fillText('Au (金)', NUCLEUS_X, NUCLEUS_Y + 4);

            // 繪製粒子
            particlesRef.current.forEach(p => {
                if (showTrails && p.trail.length > 1) {
                    ctx.beginPath(); ctx.strokeStyle = p.color; ctx.lineWidth = 1; ctx.globalAlpha = 0.35;
                    p.trail.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
                    ctx.stroke(); ctx.globalAlpha = 1.0;
                }
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill();
                if (Math.abs(p.vx) < 1 && p.history > 100) { // 近乎靜止的視覺提示
                    ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.stroke();
                }
            });

            // 繪製放射源
            ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.roundRect(0, NUCLEUS_Y - 45, 30, 90, 4); ctx.fill();
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'left'; ctx.fillText("α 放射源", 5, NUCLEUS_Y - 55);
        };

        const resetStats = () => {
            setTotalCount(0); setDeflectedCount(0); setBackscatterCount(0);
            particlesRef.current = [];
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [energy, spread, isFiring, showTrails]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shrink-0 h-16 shadow-lg z-10">
                    <div className="flex items-center space-x-3">
                        <div className="bg-amber-500/20 p-2 rounded-lg">
                            <i data-lucide="atom" className="w-6 h-6 text-amber-500"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">拉塞福散射實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1.5 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Atomic Physics (Alpha Scattering)
                    </div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-4">
                        <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800 flex items-center justify-center">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 flex gap-3 pointer-events-none">
                                <div className="flex items-center bg-black/60 backdrop-blur px-3 py-1.5 rounded-full border border-white/10 text-[10px] text-slate-300 uppercase font-bold tracking-widest">
                                    <div className="w-2 h-2 rounded-full bg-amber-500 mr-2 shadow-[0_0_8px_#f59e0b]"></div> 金原子核 (+)
                                </div>
                                <div className="flex items-center bg-black/60 backdrop-blur px-3 py-1.5 rounded-full border border-white/10 text-[10px] text-slate-300 uppercase font-bold tracking-widest">
                                    <div className="w-2 h-2 rounded-full bg-cyan-300 mr-2"></div> α 粒子 (+)
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-1 bg-slate-900 flex flex-col h-full overflow-y-auto custom-scroll border-l border-slate-800">
                            <div className="p-6 border-b border-slate-800 bg-slate-800/30">
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex justify-between items-center">
                                    偵測數據統計 <button onClick={resetStats} className="text-indigo-400 hover:text-indigo-300 text-[10px] border border-indigo-400/30 px-2 py-0.5 rounded">清空</button>
                                </h3>
                                <div className="space-y-4">
                                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-xs text-slate-500">總發射量</span>
                                        <span className="font-mono text-lg font-black text-white">{totalCount}</span>
                                    </div>
                                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-xs text-yellow-500 font-bold">偏轉粒子 (&gt;15°)</span>
                                        <span className="font-mono text-lg font-black text-yellow-400">{deflectedCount}</span>
                                    </div>
                                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-xs text-rose-500 font-bold">反向散射 (&gt;90°)</span>
                                        <span className="font-mono text-lg font-black text-rose-500">{backscatterCount}</span>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <div className="text-[9px] text-slate-600 font-bold uppercase mb-2">反向散射機率 (約 1 分之...)</div>
                                        <div className="text-xl font-mono text-white text-center">{backscatterCount > 0 ? Math.round(totalCount/backscatterCount) : '---'}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="p-6 space-y-8">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3">α 粒子能量 (速度)</label>
                                    <input type="range" min="2" max="15" step="0.5" value={energy} onChange={(e) => setEnergy(Number(e.target.value))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2"><span>低能量</span><span>高能量</span></div>
                                </div>

                                <div>
                                    <label className="flex justify-between text-xs font-bold text-rose-400 uppercase tracking-widest mb-3">束流寬度 (準直度)</label>
                                    <input type="range" min="10" max="220" step="10" value={spread} onChange={(e) => setSpread(Number(e.target.value))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer slider-thumb thumb-rose" />
                                </div>

                                <div className="space-y-3 pt-2">
                                    <button onClick={() => setIsFiring(!isFiring)} className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg ${!isFiring ? 'bg-emerald-600 text-white shadow-emerald-900/20' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>
                                        <i data-lucide={isFiring ? "pause" : "play"}></i> {isFiring ? "暫停束流" : "啟動束流"}
                                    </button>
                                    <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-800 cursor-pointer hover:bg-slate-800 transition-colors">
                                        <span className="text-xs font-bold text-slate-400 uppercase">顯示粒子軌跡</span>
                                        <input type="checkbox" checked={showTrails} onChange={() => setShowTrails(!showTrails)} className="w-5 h-5 rounded border-slate-600 text-indigo-500 focus:ring-0 cursor-pointer" />
                                    </label>
                                </div>

                                <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-3xl shadow-inner">
                                    <h3 className="text-indigo-400 font-bold text-sm mb-2 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 現象啟示</h3>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                        請觀察：超過 99% 的粒子幾乎沿直線穿過。只有極少數正面迎向原子核的粒子會被猛烈彈回。拉塞福曾感嘆：「這就像是你對著衛生紙發射 15 吋巨砲，結果砲彈反彈回來擊中你一樣不可思議。」
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
