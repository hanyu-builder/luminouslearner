<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>力矩平衡模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: pointer; }
        .btn-weight { transition: all 0.2s ease; }
        .btn-weight:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 400;
    const PIVOT_X = CANVAS_WIDTH / 2;
    const PIVOT_Y = 300;
    const BEAM_LENGTH = 600; 
    const MAX_DIST = 5; // 公尺
    const PIXELS_PER_METER = (BEAM_LENGTH / 2) / MAX_DIST; 
    const G = 9.8; 

    const WEIGHT_TYPES = [
        { mass: 5, color: '#3b82f6', radius: 15 },
        { mass: 10, color: '#10b981', radius: 20 },
        { mass: 20, color: '#ef4444', radius: 25 },
    ];

    const App = () => {
        // --- 狀態 ---
        const [weights, setWeights] = useState([]); // { id, mass, dist, color, radius }
        const [selectedIdx, setSelectedIdx] = useState(0);
        const [angle, setAngle] = useState(0); 
        const [showValues, setShowValues] = useState(true);

        const canvasRef = useRef(null);
        const requestRef = useRef();

        // --- 物理邏輯 ---
        useEffect(() => {
            const animate = () => {
                let torqueLeft = 0;  // 逆時針方向 (力在左側)
                let torqueRight = 0; // 順時針方向 (力在右側)

                weights.forEach(w => {
                    const force = w.mass * G;
                    const torque = force * Math.abs(w.dist);
                    if (w.dist < 0) torqueLeft += torque;
                    else torqueRight += torque;
                });

                const netTorque = torqueLeft - torqueRight;
                
                // 計算目標傾斜角度 (簡化靜力平衡模型)
                let targetAngle = 0;
                const threshold = 5; 
                if (netTorque > threshold) targetAngle = -15; // 左側下沉 (逆時針傾斜)
                else if (netTorque < -threshold) targetAngle = 15; // 右側下沉 (順時針傾斜)
                else targetAngle = 0;

                setAngle(prev => prev + (targetAngle - prev) * 0.1);
                requestRef.current = requestAnimationFrame(animate);
            };

            requestRef.current = requestAnimationFrame(animate);
            return () => cancelAnimationFrame(requestRef.current);
        }, [weights]);

        // --- 互動邏輯 ---
        const handleCanvasClick = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rad = angle * Math.PI / 180;

            // 1. 檢查是否點擊現有砝碼以移除
            let clickedId = null;
            for (let w of weights) {
                const wx = PIVOT_X + (w.dist * PIXELS_PER_METER) * Math.cos(rad);
                const wy = PIVOT_Y + (w.dist * PIXELS_PER_METER) * Math.sin(rad) - 10 - w.radius;
                if (Math.hypot(x - wx, y - wy) < w.radius + 10) {
                    clickedId = w.id;
                    break;
                }
            }

            if (clickedId) {
                setWeights(prev => prev.filter(w => w.id !== clickedId));
                return;
            }

            // 2. 在點擊位置放置新砝碼
            const dx = x - PIVOT_X;
            const dy = y - PIVOT_Y;
            // 將點擊座標逆旋轉以對齊水平樑
            const distPx = dx * Math.cos(-rad) - dy * Math.sin(-rad);
            const distMeters = Math.round(distPx / PIXELS_PER_METER);

            if (Math.abs(distMeters) > 0 && Math.abs(distMeters) <= MAX_DIST) {
                const type = WEIGHT_TYPES[selectedIdx];
                setWeights(prev => [...prev, {
                    id: Date.now(),
                    mass: type.mass,
                    color: type.color,
                    radius: type.radius,
                    dist: distMeters
                }]);
            }
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const rad = angle * Math.PI / 180;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製支點
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(PIVOT_X, PIVOT_Y);
            ctx.lineTo(PIVOT_X - 25, PIVOT_Y + 50);
            ctx.lineTo(PIVOT_X + 25, PIVOT_Y + 50);
            ctx.fill();

            // 2. 繪製橫樑
            ctx.save();
            ctx.translate(PIVOT_X, PIVOT_Y);
            ctx.rotate(rad);

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-BEAM_LENGTH/2, -10, BEAM_LENGTH, 20);
            ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2;
            ctx.strokeRect(-BEAM_LENGTH/2, -10, BEAM_LENGTH, 20);

            // 刻度
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.textAlign = 'center';
            ctx.font = 'bold 10px Inter';
            for (let i = -MAX_DIST; i <= MAX_DIST; i++) {
                if (i === 0) continue;
                const x = i * PIXELS_PER_METER;
                ctx.fillRect(x - 1, -10, 2, 20);
                if (showValues) ctx.fillText(`${Math.abs(i)}m`, x, 25);
            }

            // 3. 繪製砝碼
            weights.forEach(w => {
                const x = w.dist * PIXELS_PER_METER;
                const y = -10 - w.radius;
                ctx.beginPath();
                ctx.arc(x, y, w.radius, 0, Math.PI*2);
                ctx.fillStyle = w.color; ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = 'white'; ctx.font = 'bold 12px sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText(w.mass, x, y);
            });

            ctx.restore();
            if (window.lucide) window.lucide.createIcons();
        };

        useEffect(() => { draw(); }, [weights, angle, showValues]);

        // 計算力矩數值
        const torqueL = weights.filter(w => w.dist < 0).reduce((acc, w) => acc + w.mass * G * Math.abs(w.dist), 0);
        const torqueR = weights.filter(w => w.dist > 0).reduce((acc, w) => acc + w.mass * G * Math.abs(w.dist), 0);
        const balanced = Math.abs(torqueL - torqueR) < 5;

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center space-x-3">
                        <div className="bg-amber-500/20 p-2 rounded-lg text-amber-500">
                            <i data-lucide="scale"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">力矩平衡模擬實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Moments (Mechanics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 space-y-4">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[420px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onClick={handleCanvasClick} className="w-full h-full object-contain bg-slate-950 rounded-2xl canvas-container" />
                            <div className="absolute top-6 left-6 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md pointer-events-none">
                                <p className="text-xs text-slate-400 font-bold uppercase mb-1">操作提示</p>
                                <p className="text-sm text-white">點擊樑上標記添加砝碼，點擊砝碼移除</p>
                            </div>
                            <div className={`absolute top-6 left-1/2 -translate-x-1/2 px-6 py-2 rounded-full border font-bold text-sm shadow-xl transition-all ${balanced ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-900/90 border-slate-700 text-slate-400'}`}>
                                {balanced ? '系統平衡 ✅' : '失去平衡 ⚠️'}
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 flex flex-wrap items-center justify-between gap-6 shadow-xl">
                            <div className="flex gap-4">
                                {WEIGHT_TYPES.map((w, i) => (
                                    <button key={i} onClick={() => setSelectedIdx(i)} className={`flex flex-col items-center gap-2 p-3 rounded-2xl border-2 transition-all btn-weight ${selectedIdx === i ? 'border-white bg-slate-700' : 'border-transparent hover:bg-slate-700/50'}`}>
                                        <div className="w-8 h-8 rounded-full shadow-lg" style={{background: w.color}}></div>
                                        <span className="text-xs font-bold text-slate-300">{w.mass}kg</span>
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setShowValues(!showValues)} className="px-5 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold flex items-center gap-2 transition-all">
                                    <i data-lucide={showValues ? "eye" : "eye-off"} className="w-4 h-4"></i> 數值顯示
                                </button>
                                <button onClick={() => { setWeights([]); setAngle(0); }} className="px-5 py-3 bg-red-900/20 hover:bg-red-900/40 text-red-400 border border-red-500/30 rounded-xl font-bold transition-all flex items-center gap-2">
                                    <i data-lucide="trash-2" className="w-4 h-4"></i> 全部清除
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-800 pb-4">
                                <i data-lucide="calculator" className="w-5 h-5 text-indigo-400"></i> 力矩運算面板
                            </h2>
                            <div className="space-y-4">
                                <div className="bg-blue-900/10 border border-blue-500/20 p-5 rounded-2xl relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>
                                    <h3 className="text-blue-400 text-xs font-bold uppercase tracking-widest mb-3 flex justify-between">逆時針力矩 (左) <i data-lucide="rotate-ccw" className="w-4 h-4"></i></h3>
                                    <div className="space-y-1 max-h-32 overflow-y-auto pr-2 scrollbar-hide">
                                        {weights.filter(w => w.dist < 0).map(w => (
                                            <div key={w.id} className="flex justify-between text-xs font-mono text-slate-400 border-b border-white/5 py-1">
                                                <span>{w.mass}kg × {Math.abs(w.dist)}m</span>
                                                <span className="text-white">{(w.mass*G*Math.abs(w.dist)).toFixed(0)} Nm</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-3 pt-3 border-t border-blue-500/20 flex justify-between font-bold text-blue-300">
                                        <span>總計 (L):</span><span>{torqueL.toFixed(0)} Nm</span>
                                    </div>
                                </div>

                                <div className="bg-emerald-900/10 border border-emerald-500/20 p-5 rounded-2xl relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-emerald-500"></div>
                                    <h3 className="text-emerald-400 text-xs font-bold uppercase tracking-widest mb-3 flex justify-between">順時針力矩 (右) <i data-lucide="rotate-cw" className="w-4 h-4"></i></h3>
                                    <div className="space-y-1 max-h-32 overflow-y-auto pr-2 scrollbar-hide">
                                        {weights.filter(w => w.dist > 0).map(w => (
                                            <div key={w.id} className="flex justify-between text-xs font-mono text-slate-400 border-b border-white/5 py-1">
                                                <span>{w.mass}kg × {Math.abs(w.dist)}m</span>
                                                <span className="text-white">{(w.mass*G*Math.abs(w.dist)).toFixed(0)} Nm</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-3 pt-3 border-t border-emerald-500/20 flex justify-between font-bold text-emerald-300">
                                        <span>總計 (R):</span><span>{torqueR.toFixed(0)} Nm</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理考點提示</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                根據 <b>力矩定律 (Law of Moments)</b>，當一個物體處於轉動平衡時，其順時針力矩之和必須等於逆時針力矩之和。注意公式中的力臂長度必須是從<b>支點 (Pivot)</b> 起算的距離。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
