<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多普勒效應模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .thumb-indigo::-webkit-slider-thumb { border-color: #6366f1; }
        .thumb-rose::-webkit-slider-thumb { border-color: #f43f5e; }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 400;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const SPEED_OF_SOUND = 100; // 像素/秒 (模擬比例)

    const App = () => {
        // --- 狀態 ---
        const [sourceSpeed, setSourceSpeed] = useState(0.5); // 馬赫數 (vs / v)
        const [frequency, setFrequency] = useState(2.0); // 發射頻率 (Hz)
        const [isPlaying, setIsPlaying] = useState(false);
        const [soundEnabled, setSoundEnabled] = useState(false);
        
        const [obsFreq, setObsFreq] = useState(0); 
        const [isApproaching, setIsApproaching] = useState(false);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const lastTimeRef = useRef(0);
        
        // 模擬數據儲存 (避免閉包導致的數值過期)
        const isPlayingRef = useRef(false);
        const paramsRef = useRef({ sourceSpeed: 0.5, frequency: 2.0 });
        const stateRef = useRef({
            waves: [], // {x, y, r, timeCreated}
            sourceX: 100,
            lastEmitTime: 0,
            observerX: CANVAS_WIDTH * 0.75
        });

        // 音訊 Ref
        const audioCtxRef = useRef(null);
        const oscRef = useRef(null);
        const gainNodeRef = useRef(null);
        const pannerRef = useRef(null);

        // 同步狀態至 Ref
        useEffect(() => {
            isPlayingRef.current = isPlaying;
            paramsRef.current = { sourceSpeed, frequency };
        }, [isPlaying, sourceSpeed, frequency]);

        // --- 動作處理 ---
        const resetSim = () => {
            setIsPlaying(false);
            isPlayingRef.current = false;
            cancelAnimationFrame(requestRef.current);
            stateRef.current = {
                waves: [],
                sourceX: 100,
                lastEmitTime: 0,
                observerX: CANVAS_WIDTH * 0.75
            };
            stopSound();
            setTimeout(() => draw(), 50);
        };

        const togglePlay = () => {
            if (isPlaying) {
                setIsPlaying(false);
                stopSound();
            } else {
                setIsPlaying(true);
                isPlayingRef.current = true;
                lastTimeRef.current = performance.now();
                if (soundEnabled) startSound();
                requestRef.current = requestAnimationFrame(loop);
            }
        };

        // --- 音訊系統 ---
        const initAudio = () => {
            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
            }
        };

        const startSound = () => {
            initAudio();
            const ctx = audioCtxRef.current;
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const panner = ctx.createStereoPanner();
            osc.type = 'sawtooth'; 
            osc.connect(gain); gain.connect(panner); panner.connect(ctx.destination);
            osc.start();
            oscRef.current = osc; gainNodeRef.current = gain; pannerRef.current = panner;
        };

        const stopSound = () => {
            if (oscRef.current) {
                try { oscRef.current.stop(); oscRef.current.disconnect(); } catch(e) {}
                oscRef.current = null;
            }
        };

        const updateAudio = (sX, oX, vS) => {
            if (!oscRef.current) return;
            const ctx = audioCtxRef.current;
            const dist = oX - sX;
            const approaching = dist > 0;
            setIsApproaching(approaching);

            const vSound = 340; 
            const vSourceReal = vS * vSound;
            const baseF = 200 + paramsRef.current.frequency * 50; 

            // 多普勒公式
            let factor = approaching ? vSound / (vSound - vSourceReal) : vSound / (vSound + vSourceReal);
            if (factor > 4) factor = 4; if (factor < 0) factor = 0; 

            const newFreq = baseF * factor;
            setObsFreq(newFreq);
            oscRef.current.frequency.setTargetAtTime(newFreq, ctx.currentTime, 0.1);
            
            const panVal = Math.max(-1, Math.min(1, (sX - CANVAS_WIDTH/2) / (CANVAS_WIDTH/2)));
            pannerRef.current.pan.setTargetAtTime(panVal, ctx.currentTime, 0.1);

            const vol = Math.max(0, 1 - Math.abs(dist) / 600);
            gainNodeRef.current.gain.setTargetAtTime(vol * 0.4, ctx.currentTime, 0.1);
        };

        // --- 物理循環 ---
        const loop = (timestamp) => {
            if (!isPlayingRef.current) return;
            const dt = (timestamp - lastTimeRef.current) / 1000;
            lastTimeRef.current = timestamp;
            const state = stateRef.current;
            const { sourceSpeed, frequency } = paramsRef.current;

            // 1. 移動波源
            state.sourceX += (sourceSpeed * SPEED_OF_SOUND) * dt;
            if (state.sourceX > CANVAS_WIDTH + 100) {
                state.sourceX = -50; state.waves = [];
            }

            // 2. 發射波前
            if (timestamp - state.lastEmitTime > (1000 / frequency)) {
                state.waves.push({ x: state.sourceX, y: CENTER_Y, r: 0 });
                state.lastEmitTime = timestamp;
            }

            // 3. 擴張波前
            state.waves.forEach(w => { w.r += SPEED_OF_SOUND * dt; });
            state.waves = state.waves.filter(w => w.r < CANVAS_WIDTH * 1.5);

            // 4. 更新音效與 UI
            if (soundEnabled) updateAudio(state.sourceX, state.observerX, sourceSpeed);
            else {
                const dist = state.observerX - state.sourceX;
                const app = dist > 0;
                setIsApproaching(app);
                const vSound = 340; const vsReal = sourceSpeed * vSound;
                let f = app ? vSound/(vSound-vsReal) : vSound/(vSound+vsReal);
                setObsFreq((200 + frequency * 50) * Math.min(4, f));
            }

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const state = stateRef.current;
            const { sourceSpeed } = paramsRef.current;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 網格線
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

            // 觀察者
            ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(state.observerX, CENTER_Y, 20, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👂', state.observerX, CENTER_Y + 7);
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 10px Inter'; ctx.fillText("觀察者 (Observer)", state.observerX, CENTER_Y + 40);

            // 波前
            ctx.lineWidth = 2;
            state.waves.forEach(w => {
                const alpha = Math.max(0, 1 - w.r / 600);
                ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
            });

            // 波源
            ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(state.sourceX, CENTER_Y, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Inter'; ctx.fillText('S', state.sourceX, CENTER_Y + 4);

            // 馬赫錐 (Mach Cone)
            if (sourceSpeed > 1.0) {
                const angle = Math.asin(1 / sourceSpeed);
                const len = 600;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.setLineDash([8, 6]);
                ctx.beginPath();
                ctx.moveTo(state.sourceX, CENTER_Y);
                ctx.lineTo(state.sourceX - len * Math.cos(angle), CENTER_Y - len * Math.sin(angle));
                ctx.moveTo(state.sourceX, CENTER_Y);
                ctx.lineTo(state.sourceX - len * Math.cos(angle), CENTER_Y + len * Math.sin(angle));
                ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
            }
        };

        useEffect(() => { resetSim(); }, []);
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
        useEffect(() => { if (!soundEnabled) stopSound(); else if (isPlaying) startSound(); }, [soundEnabled]);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400"><i data-lucide="siren"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">多普勒效應模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Wave Properties</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-12">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[400px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 left-6 flex gap-4">
                                <div className="bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700 text-xs shadow-lg backdrop-blur-md">
                                    <div className="text-slate-500 font-bold uppercase mb-1">波源速度 (vs)</div>
                                    <div className="text-white font-mono text-lg">{sourceSpeed.toFixed(2)} Mach</div>
                                </div>
                            </div>
                            <div className={`absolute bottom-6 left-1/2 -translate-x-1/2 px-8 py-2.5 rounded-full border shadow-2xl font-mono text-xl font-black backdrop-blur-md transition-all ${isApproaching ? 'bg-indigo-600/90 border-indigo-400 text-white' : 'bg-rose-600/90 border-rose-400 text-white'}`}>
                                f' = {obsFreq.toFixed(0)} Hz
                                <span className="ml-3 text-[10px] font-bold uppercase tracking-widest opacity-70">{isApproaching ? '頻率升高 (接近中)' : '頻率降低 (遠離中)'}</span>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-800 pb-4"><i data-lucide="sliders" className="text-indigo-400"></i> 波源與環境參數</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                <div className="space-y-4">
                                    <label className="flex justify-between text-xs font-bold text-indigo-300 uppercase tracking-widest mb-3"><span>波源運動速度 (vs)</span><span className="text-white font-mono">{sourceSpeed.toFixed(2)} c</span></label>
                                    <input type="range" min="0" max="2.0" step="0.05" value={sourceSpeed} onChange={(e)=>setSourceSpeed(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" />
                                    <div className="flex justify-between text-[10px] text-slate-500 font-bold uppercase italic"><span>靜止</span><span>音爆 (1.0)</span><span>超音速</span></div>
                                </div>
                                <div className="space-y-4">
                                    <label className="flex justify-between text-xs font-bold text-rose-300 uppercase tracking-widest mb-3"><span>發射頻率 (fs)</span><span className="text-white font-mono">{frequency} Hz</span></label>
                                    <input type="range" min="1.0" max="5.0" step="0.5" value={frequency} onChange={(e)=>setFrequency(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-rose" />
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-4 items-center justify-between border-t border-slate-700 pt-6">
                                <label className="flex items-center gap-3 cursor-pointer p-4 bg-slate-950/50 rounded-2xl border border-slate-700 hover:bg-slate-800 transition-colors">
                                    <div className="flex items-center gap-2"><i data-lucide={soundEnabled ? "volume-2" : "volume-x"} className={`w-4 h-4 ${soundEnabled ? 'text-emerald-400' : 'text-slate-500'}`}></i><span className="text-xs font-bold text-slate-300 uppercase">啟動聽覺回饋</span></div>
                                    <input type="checkbox" checked={soundEnabled} onChange={()=>setSoundEnabled(!soundEnabled)} className="w-5 h-5 rounded border-slate-600 text-emerald-500 focus:ring-0 cursor-pointer" />
                                </label>
                                <div className="flex gap-3">
                                    <button onClick={togglePlay} className={`px-10 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg ${isPlaying ? 'bg-slate-700 text-slate-300' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/20'}`}><i data-lucide={isPlaying ? "pause" : "play"}></i> {isPlaying ? "暫停模擬" : "啟動模擬"}</button>
                                    <button onClick={resetSim} className="p-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all"><i data-lucide="rotate-ccw"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理機制</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                <b>多普勒效應：</b> 當波源向觀察者移動時，波源會不斷追上先前發出的波前，導致前方波長被「壓縮」而頻率升高。當速度突破音速（&gt;1.0 Mach）時，波前會重疊形成衝擊波面，即<b>馬赫錐</b>。
                            </p>
                        </div>
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">波長變化視覺規律</h3>
                            <div className="space-y-3">
                                <div className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 text-[10px]"><span className="text-indigo-400 font-bold">接近中</span><span className="text-slate-300">波長變短 $\lambda \downarrow$ 頻率變高 $f \uparrow$</span></div>
                                <div className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 text-[10px]"><span className="text-rose-400 font-bold">遠離中</span><span className="text-slate-300">波長變長 $\lambda \uparrow$ 頻率變低 $f \downarrow$</span></div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
