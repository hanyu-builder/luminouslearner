<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楊氏雙縫干涉模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
        }
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SIM_WIDTH = 250; 
    const SIM_HEIGHT = 200;
    const CANVAS_SCALE = 3; 
    
    const SCREEN_HEIGHT = 100;
    const GRAPH_HEIGHT = 150;

    const App = () => {
        const [wavelength, setWavelength] = useState(532); 
        const [slitSeparation, setSlitSeparation] = useState(3000); 
        const [distanceD, setDistanceD] = useState(1.0); 
        
        const [fringeWidth, setFringeWidth] = useState(0);

        const waveCanvasRef = useRef(null);
        const screenCanvasRef = useRef(null);
        const graphCanvasRef = useRef(null);
        const requestRef = useRef();
        const timeRef = useRef(0);

        const nmToRGB = (wavelength) => {
            let r, g, b;
            if (wavelength >= 380 && wavelength < 440) { r = -(wavelength - 440) / (440 - 380); g = 0; b = 1; }
            else if (wavelength >= 440 && wavelength < 490) { r = 0; g = (wavelength - 440) / (490 - 440); b = 1; }
            else if (wavelength >= 490 && wavelength < 510) { r = 0; g = 1; b = -(wavelength - 510) / (510 - 490); }
            else if (wavelength >= 510 && wavelength < 580) { r = (wavelength - 510) / (580 - 510); g = 1; b = 0; }
            else if (wavelength >= 580 && wavelength < 645) { r = 1; g = -(wavelength - 645) / (645 - 580); b = 0; }
            else if (wavelength >= 645 && wavelength <= 750) { r = 1; g = 0; b = 0; }
            else { r = 0; g = 0; b = 0; }
            return { r: Math.floor(r * 255), g: Math.floor(g * 255), b: Math.floor(b * 255) };
        };

        const color = nmToRGB(wavelength);
        const cssColor = `rgb(${color.r},${color.g},${color.b})`;

        const loop = () => {
            timeRef.current += 0.2;
            drawWaveField();
            requestRef.current = requestAnimationFrame(loop);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [wavelength, slitSeparation, distanceD]);

        useEffect(() => {
            drawAnalysis();
            const fy = (distanceD * wavelength / slitSeparation) * 1000; 
            setFringeWidth(fy);
        }, [wavelength, slitSeparation, distanceD]);

        const drawWaveField = () => {
            const ctx = waveCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const imgData = ctx.createImageData(SIM_WIDTH, SIM_HEIGHT);
            const data = imgData.data;
            const t = timeRef.current;
            const sepPx = (slitSeparation / 100) * (distanceD); 
            const lambdaPx = wavelength / 50; 
            const k = 2 * Math.PI / lambdaPx;
            const cx = 10; const cy = SIM_HEIGHT / 2;
            const s1y = cy - sepPx / 2; const s2y = cy + sepPx / 2;

            for (let y = 0; y < SIM_HEIGHT; y++) {
                for (let x = 0; x < SIM_WIDTH; x++) {
                    const idx = (y * SIM_WIDTH + x) * 4;
                    const d1 = Math.sqrt((x - cx) ** 2 + (y - s1y) ** 2);
                    const d2 = Math.sqrt((x - cx) ** 2 + (y - s2y) ** 2);
                    const interferenceFactor = Math.cos((k * (d2 - d1)) / 2); 
                    const travel = Math.sin(k * (d1+d2)/2 - t);
                    const viz = Math.abs(2 * interferenceFactor * travel) / 2;
                    data[idx] = Math.floor(color.r * viz);
                    data[idx+1] = Math.floor(color.g * viz);
                    data[idx+2] = Math.floor(color.b * viz);
                    data[idx+3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            ctx.fillStyle = '#fff'; ctx.fillRect(cx-2, s1y-2, 4, 4); ctx.fillRect(cx-2, s2y-2, 4, 4);
        };

        const drawAnalysis = () => {
            const screenCtx = screenCanvasRef.current?.getContext('2d');
            const graphCtx = graphCanvasRef.current?.getContext('2d');
            if (!screenCtx || !graphCtx) return;
            const w = SIM_WIDTH * CANVAS_SCALE; const sh = SCREEN_HEIGHT; const gh = GRAPH_HEIGHT;
            screenCtx.fillStyle = '#000'; screenCtx.fillRect(0, 0, w, sh);
            graphCtx.fillStyle = '#1e293b'; graphCtx.fillRect(0, 0, w, gh);
            graphCtx.strokeStyle = '#64748b'; graphCtx.lineWidth = 1;
            graphCtx.beginPath(); graphCtx.moveTo(0, gh - 20); graphCtx.lineTo(w, gh - 20); graphCtx.stroke();
            graphCtx.setLineDash([2, 4]); graphCtx.beginPath(); graphCtx.moveTo(w/2, 0); graphCtx.lineTo(w/2, gh); graphCtx.stroke(); graphCtx.setLineDash([]);
            graphCtx.beginPath(); graphCtx.strokeStyle = cssColor; graphCtx.lineWidth = 2;
            graphCtx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.2)`;
            const sImg = screenCtx.createImageData(w, sh);
            for (let x = 0; x < w; x++) {
                const screenY = (x - w/2); 
                const scaleFactor = 40000 * distanceD; 
                const phase = (Math.PI * slitSeparation * screenY) / (wavelength * scaleFactor);
                const intensity = Math.cos(phase) ** 2;
                const plotY = (gh - 20) - intensity * (gh - 40);
                if (x===0) graphCtx.moveTo(x, plotY); else graphCtx.lineTo(x, plotY);
                const brightness = Math.floor(intensity * 255);
                for(let sy=0; sy<sh; sy++) {
                    const idx = (sy * w + x) * 4;
                    sImg.data[idx] = color.r; sImg.data[idx+1] = color.g; sImg.data[idx+2] = color.b; sImg.data[idx+3] = brightness;
                }
            }
            graphCtx.stroke(); graphCtx.lineTo(w, gh-20); graphCtx.lineTo(0, gh-20); graphCtx.fill();
            screenCtx.putImageData(sImg, 0, 0);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 flex flex-col overflow-hidden">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg h-16 shrink-0">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-600 p-2 rounded-lg"><i data-lucide="split" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">雙縫干涉模擬器</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-indigo-400 border border-slate-700 uppercase">DSE Physics: Wave Interference</div>
                </nav>

                <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
                    <div className="lg:col-span-8 flex flex-col gap-4 p-4 md:p-6 overflow-y-auto custom-scroll">
                        <div className="bg-slate-950 rounded-2xl border border-slate-700 relative overflow-hidden shadow-2xl">
                            <div className="absolute top-3 left-3 bg-slate-900/90 px-3 py-1 rounded border border-slate-700 text-[10px] font-black text-slate-500 uppercase tracking-widest z-10">俯視圖 (波陣面視覺化)</div>
                            <canvas ref={waveCanvasRef} width={SIM_WIDTH} height={SIM_HEIGHT} className="w-full h-auto" />
                        </div>

                        <div className="bg-slate-900 rounded-2xl border border-slate-700 relative overflow-hidden p-6 shadow-xl">
                            <div className="absolute top-3 left-6 text-[10px] text-slate-500 font-black uppercase tracking-widest">強度分佈曲線 (Intensity Profile)</div>
                            <canvas ref={graphCanvasRef} width={SIM_WIDTH * CANVAS_SCALE} height={GRAPH_HEIGHT} className="w-full h-auto" />
                        </div>

                        <div className="bg-black rounded-2xl border-4 border-slate-800 relative overflow-hidden h-28 shadow-2xl ring-1 ring-slate-700/50">
                            <div className="absolute top-3 left-4 text-[10px] text-white/40 font-black uppercase tracking-widest">屏幕實際觀測效果 (Screen View)</div>
                            <canvas ref={screenCanvasRef} width={SIM_WIDTH * CANVAS_SCALE} height={SCREEN_HEIGHT} className="w-full h-full" />
                        </div>
                    </div>

                    <aside className="lg:col-span-4 bg-slate-900 p-6 flex flex-col gap-6 overflow-y-auto border-l border-slate-800 custom-scroll">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold mb-4 flex items-center gap-2"><i data-lucide="sliders" className="w-5 h-5 text-indigo-400"></i> 控制參數設定</h2>

                            <div>
                                <label className="flex justify-between text-xs font-black mb-3 uppercase tracking-wider" style={{color: cssColor}}>
                                    <span>波長 (λ)</span>
                                    <span className="font-mono text-sm">{wavelength} nm</span>
                                </label>
                                <div className="h-1.5 w-full rounded-full mb-3 shadow-inner" style={{background: 'linear-gradient(to right, #4b0082, #0000ff, #00ff00, #ffff00, #ff7f00, #ff0000)'}}></div>
                                <input type="range" min="400" max="700" step="1" value={wavelength} onChange={(e) => setWavelength(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>

                            <div>
                                <label className="flex justify-between text-xs font-black text-slate-300 mb-3 uppercase tracking-wider">
                                    <span>雙縫間距 (a)</span>
                                    <span className="font-mono text-sm">{(slitSeparation/1000).toFixed(1)} μm</span>
                                </label>
                                <input type="range" min="1000" max="5000" step="100" value={slitSeparation} onChange={(e) => setSlitSeparation(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>

                            <div>
                                <label className="flex justify-between text-xs font-black text-slate-300 mb-3 uppercase tracking-wider">
                                    <span>屏幕距離 (D)</span>
                                    <span className="font-mono text-sm">{distanceD.toFixed(1)} m</span>
                                </label>
                                <input type="range" min="0.5" max="2.0" step="0.1" value={distanceD} onChange={(e) => setDistanceD(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>

                            <button onClick={() => {setWavelength(532); setSlitSeparation(3000); setDistanceD(1.0);}} className="w-full py-4 bg-slate-700 hover:bg-slate-600 rounded-xl text-white font-black uppercase text-xs tracking-[0.2em] transition-all border border-slate-600 flex items-center justify-center gap-2 shadow-lg active:scale-95"><i data-lucide="rotate-ccw" className="w-4 h-4"></i> 重置實驗</button>
                        </div>

                        <div className="bg-indigo-500/5 border border-indigo-500/20 p-6 rounded-2xl shadow-inner">
                            <h3 className="text-indigo-400 font-black text-[10px] uppercase tracking-[0.2em] mb-4 flex items-center gap-2"><i data-lucide="calculator" className="w-4 h-4"></i> 條紋間距分析 (Δy)</h3>
                            <div className="text-center mb-6">
                                <div className="text-sm text-slate-500 mb-1 font-bold">計算所得 Δy</div>
                                <div className="text-4xl font-mono font-black text-white italic">{fringeWidth.toFixed(1)} <span className="text-sm">mm</span></div>
                            </div>
                            <div className="text-[11px] text-slate-400 leading-relaxed space-y-3 font-medium">
                                <p className="flex gap-2 items-start"><span className="text-indigo-500">■</span> <strong>波長越長</strong>（如紅光）或 <strong>a 越窄</strong>，條紋間距越闊。</p>
                                <p className="flex gap-2 items-start"><span className="text-indigo-500">■</span> 增加屏幕距離 <strong>D</strong> 會使條紋成正比地擴張。</p>
                                <p className="flex gap-2 items-start font-mono text-[10px] text-indigo-300/70 opacity-80 pt-2 border-t border-white/5">Δy = λD / a</p>
                            </div>
                        </div>
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
</script>
</body>
</html>
