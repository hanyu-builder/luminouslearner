<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功率輸出競賽模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
        .thumb-orange::-webkit-slider-thumb { background: #f97316; }
        .thumb-gray::-webkit-slider-thumb { background: #64748b; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const GROUND_Y = 400;
    const G = 9.8;
    const PIXELS_PER_METER = 30; 

    const App = () => {
        const [mass, setMass] = useState(50); 
        const [height, setHeight] = useState(10); 
        const [powerA, setPowerA] = useState(500); 
        const [powerB, setPowerB] = useState(250); 
        const [simState, setSimState] = useState('idle'); 
        
        const [time, setTime] = useState(0);
        const [posA, setPosA] = useState(0); 
        const [posB, setPosB] = useState(0); 
        
        const requestRef = useRef();
        const startTimeRef = useRef(0);
        
        const workRequired = mass * G * height; 
        const timeA = workRequired / powerA; 
        const timeB = workRequired / powerB; 

        const startRace = () => {
            if (simState === 'running') return;
            setSimState('running');
            setPosA(0); setPosB(0);
            startTimeRef.current = Date.now();
            loop();
        };

        const reset = () => {
            setSimState('idle');
            cancelAnimationFrame(requestRef.current);
            setPosA(0); setPosB(0); setTime(0);
        };

        const loop = () => {
            const now = Date.now();
            const elapsed = (now - startTimeRef.current) / 1000; 
            const currentHA = Math.min(height, (powerA * elapsed) / (mass * G));
            const currentHB = Math.min(height, (powerB * elapsed) / (mass * G));
            
            setPosA(currentHA);
            setPosB(currentHB);
            setTime(elapsed);

            if (currentHA >= height && currentHB >= height) {
                setSimState('finished');
            } else {
                requestRef.current = requestAnimationFrame(loop);
            }
        };

        useEffect(() => {
            return () => cancelAnimationFrame(requestRef.current);
        }, []);

        const canvasRef = useRef(null);
        
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            const goalY = GROUND_Y - height * PIXELS_PER_METER;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(0, goalY); ctx.lineTo(CANVAS_WIDTH, goalY); ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.font = '12px Inter';
            ctx.fillText(`目標高度 Target: ${height}m`, 10, goalY - 10);

            const drawEngine = (x, currentH, color, label, power) => {
                const boxSize = 40 + (mass / 200) * 10;
                const boxY = GROUND_Y - currentH * PIXELS_PER_METER - boxSize;
                
                ctx.beginPath(); ctx.moveTo(x + boxSize/2, 0); ctx.lineTo(x + boxSize/2, boxY);
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = color; ctx.fillRect(x, boxY, boxSize, boxSize);
                ctx.fillStyle = 'white'; ctx.font = 'bold 12px sans-serif';
                ctx.fillText(`${mass}kg`, x + 5, boxY + boxSize/2 + 4);

                ctx.fillStyle = color; ctx.font = 'bold 14px sans-serif';
                ctx.fillText(label, x, GROUND_Y + 25);
                ctx.fillStyle = '#94a3b8'; ctx.font = '12px monospace';
                ctx.fillText(`${power} W`, x, GROUND_Y + 45);
                
                if (currentH >= height) {
                    ctx.fillStyle = '#10b981'; ctx.font = 'bold 12px sans-serif';
                    ctx.fillText("完成 DONE!", x + boxSize + 10, boxY + 25);
                }
            };

            drawEngine(200, posA, '#3b82f6', '引擎 A (Engine A)', powerA);
            drawEngine(500, posB, '#f97316', '引擎 B (Engine B)', powerB);

        }, [mass, height, powerA, powerB, posA, posB]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-emerald-500/20 p-2 rounded-lg"><i data-lucide="timer" className="w-6 h-6 text-emerald-400"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">功率輸出競賽模擬器</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-indigo-400 border border-slate-700 uppercase">DSE Physics: Work & Power</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-2xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto bg-slate-950 rounded-xl" />
                            <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-slate-900/90 px-8 py-2 rounded-full border border-slate-700 font-mono text-2xl text-white shadow-xl">
                                {time.toFixed(2)}s
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-6">
                            <div className="flex flex-wrap gap-8">
                                <div className="flex-1 min-w-[200px] space-y-5 border-r border-slate-700 pr-6">
                                    <h3 className="text-white font-black text-[10px] uppercase tracking-widest flex items-center gap-2">
                                        <i data-lucide="package" className="w-4 h-4 text-slate-500"></i> 載重與高度設定
                                    </h3>
                                    <div>
                                        <label className="flex justify-between text-xs text-slate-400 mb-2"><span>物體質量 (Mass)</span> <span className="text-white font-mono">{mass} kg</span></label>
                                        <input type="range" min="10" max="200" step="10" value={mass} onChange={(e) => { setMass(Number(e.target.value)); reset(); }} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb thumb-gray" />
                                    </div>
                                    <div>
                                        <label className="flex justify-between text-xs text-slate-400 mb-2"><span>目標高度 (Height)</span> <span className="text-white font-mono">{height} m</span></label>
                                        <input type="range" min="5" max="12" step="1" value={height} onChange={(e) => { setHeight(Number(e.target.value)); reset(); }} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb thumb-gray" />
                                    </div>
                                    <div className="bg-emerald-900/10 p-4 rounded-xl border border-emerald-500/20 text-xs font-mono">
                                        <div className="text-slate-500 mb-1 uppercase tracking-tighter">所需作功 (mgh):</div>
                                        <div className="text-xl text-emerald-400 font-bold">{(workRequired).toFixed(0)} J</div>
                                    </div>
                                </div>

                                <div className="flex-1 min-w-[200px] space-y-5">
                                    <h3 className="text-white font-black text-[10px] uppercase tracking-widest flex items-center gap-2">
                                        <i data-lucide="zap" className="w-4 h-4 text-slate-500"></i> 引擎輸出功率設定
                                    </h3>
                                    <div>
                                        <label className="flex justify-between text-xs text-blue-400 mb-2 font-bold"><span>引擎 A (功率)</span> <span className="text-white font-mono">{powerA} W</span></label>
                                        <input type="range" min="100" max="2000" step="50" value={powerA} onChange={(e) => { setPowerA(Number(e.target.value)); reset(); }} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                        <div className="text-[10px] text-slate-500 mt-2 italic font-medium uppercase tracking-tight">預計時間: {timeA.toFixed(2)}s</div>
                                    </div>
                                    <div>
                                        <label className="flex justify-between text-xs text-orange-400 mb-2 font-bold"><span>引擎 B (功率)</span> <span className="text-white font-mono">{powerB} W</span></label>
                                        <input type="range" min="100" max="2000" step="50" value={powerB} onChange={(e) => { setPowerB(Number(e.target.value)); reset(); }} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-600 rounded-lg appearance-none cursor-pointer slider-thumb thumb-orange" />
                                        <div className="text-[10px] text-slate-500 mt-2 italic font-medium uppercase tracking-tight">預計時間: {timeB.toFixed(2)}s</div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={startRace} disabled={simState === 'running'} className={`rounded-xl font-black text-xs uppercase tracking-widest shadow-lg flex items-center justify-center gap-2 py-4 transition-all ${simState === 'running' ? 'bg-slate-700 text-slate-600' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}>
                                    <i data-lucide="play" className="w-4 h-4"></i> 開始競賽
                                </button>
                                <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-black text-xs uppercase tracking-widest py-4 transition-all flex items-center justify-center gap-2 border border-slate-600">
                                    <i data-lucide="rotate-ccw" className="w-4 h-4"></i> 重置參數
                                </button>
                            </div>
                        </div>
                    </div>

                    <aside className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2"><i data-lucide="calculator" className="w-5 h-5 text-indigo-400"></i> 競賽數據面板</h2>
                            <div className="space-y-4">
                                <div className="p-4 rounded-xl bg-blue-900/10 border border-blue-500/20">
                                    <div className="text-blue-400 font-bold mb-3 text-xs uppercase tracking-widest">引擎 A 狀態</div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><div className="text-[10px] text-slate-500 uppercase font-bold">功率</div><div className="font-mono text-white text-sm">{powerA} W</div></div>
                                        <div><div className="text-[10px] text-slate-500 uppercase font-bold">完成用時</div><div className={`font-mono text-lg font-bold ${posA >= height ? 'text-emerald-400' : 'text-slate-600'}`}>{posA >= height ? timeA.toFixed(2) + 's' : '--'}</div></div>
                                    </div>
                                </div>
                                <div className="p-4 rounded-xl bg-orange-900/10 border border-orange-500/20">
                                    <div className="text-orange-400 font-bold mb-3 text-xs uppercase tracking-widest">引擎 B 狀態</div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><div className="text-[10px] text-slate-500 uppercase font-bold">功率</div><div className="font-mono text-white text-sm">{powerB} W</div></div>
                                        <div><div className="text-[10px] text-slate-500 uppercase font-bold">完成用時</div><div className={`font-mono text-lg font-bold ${posB >= height ? 'text-emerald-400' : 'text-slate-600'}`}>{posB >= height ? timeB.toFixed(2) + 's' : '--'}</div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {simState === 'finished' && (
                            <div className="p-6 rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-700 shadow-xl text-center animate-in zoom-in duration-300 ring-2 ring-indigo-400/50">
                                <div className="text-indigo-200 text-[10px] font-black uppercase tracking-[0.3em] mb-2">WINNER 勝出者</div>
                                <div className="text-3xl font-black text-white mb-2">
                                    {timeA < timeB ? "引擎 A 🏆" : timeA > timeB ? "引擎 B 🏆" : "雙方平手! 🤝"}
                                </div>
                                <div className="text-[11px] text-white/70 font-medium leading-relaxed">
                                    {timeA < timeB 
                                        ? `A 比 B 快了 ${(timeB - timeA).toFixed(2)}s！` 
                                        : timeA > timeB 
                                            ? `B 比 A 快了 ${(timeA - timeB).toFixed(2)}s！` 
                                            : "功率完全相同，所用時間一致。"}
                                </div>
                            </div>
                        )}
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 150);
</script>
</body>
</html>
