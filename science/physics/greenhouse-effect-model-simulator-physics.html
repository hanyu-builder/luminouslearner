<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溫室效應模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
            border-radius: 50%; background: #10b981; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const GROUND_Y = 420;
    const ATMOSPHERE_TOP = 100;
    const SUN_X = 100;
    const SUN_Y = 80;

    const App = () => {
        const [ghgConcentration, setGhgConcentration] = useState(20); 
        const [temperature, setTemperature] = useState(15); 
        
        const canvasRef = useRef(null);
        const requestRef = useRef();
        const particlesRef = useRef([]); 

        useEffect(() => {
            particlesRef.current = [];
        }, []);

        const updatePhysics = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            // 1. 繪製背景與環境
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 天空漸層
            const skyGradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGradient.addColorStop(0, '#020617'); // 外太空
            skyGradient.addColorStop(0.4, '#1e3a8a'); 
            skyGradient.addColorStop(1, '#60a5fa'); 
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);

            // 地面
            const groundGradient = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_HEIGHT);
            groundGradient.addColorStop(0, '#166534'); 
            groundGradient.addColorStop(1, '#064e3b'); 
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            // 太陽
            ctx.fillStyle = '#facc15';
            ctx.shadowBlur = 40; ctx.shadowColor = '#facc15';
            ctx.beginPath(); ctx.arc(SUN_X, SUN_Y, 40, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // 大氣霧霾 (視覺化溫室氣體層)
            const alpha = ghgConcentration / 250;
            ctx.fillStyle = `rgba(226, 232, 240, ${alpha})`;
            ctx.fillRect(0, ATMOSPHERE_TOP, CANVAS_WIDTH, GROUND_Y - ATMOSPHERE_TOP);

            // 溫室氣體分子 (視覺點)
            const moleculeCount = Math.floor(ghgConcentration * 1.2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for(let i=0; i<moleculeCount; i++) {
                const rx = (Math.sin(i * 123.45) * 0.5 + 0.5) * CANVAS_WIDTH;
                const ry = ATMOSPHERE_TOP + (Math.cos(i * 67.89) * 0.5 + 0.5) * (GROUND_Y - ATMOSPHERE_TOP);
                ctx.beginPath(); ctx.arc(rx, ry, 2, 0, Math.PI*2); ctx.fill();
            }

            // 2. 質點管理
            // 產生太陽射線 (短波 - 黃色)
            if (Math.random() < 0.25) {
                particlesRef.current.push({
                    x: SUN_X + (Math.random() - 0.5) * 50,
                    y: SUN_Y + 40,
                    vx: 1.2 + Math.random(),
                    vy: 2.2 + Math.random(),
                    type: 'sunlight'
                });
            }

            const newParticles = [];
            particlesRef.current.forEach(p => {
                p.x += p.vx; p.y += p.vy;

                if (p.type === 'sunlight') {
                    // 太陽光穿透大氣
                    if (p.y >= GROUND_Y) {
                        // 撞擊地表：吸收後重新輻射為紅外線 (IR)
                        if (Math.random() > 0.15) { 
                             newParticles.push({
                                x: p.x, y: GROUND_Y - 5,
                                vx: (Math.random() - 0.5) * 2,
                                vy: -1.8 - Math.random(), 
                                type: 'infrared',
                                reRadiated: false
                            });
                        }
                        return; 
                    }
                } else if (p.type === 'infrared') {
                    // 紅外線 (長波) 與溫室氣體互動
                    if (p.y < GROUND_Y && p.y > ATMOSPHERE_TOP) {
                        const collisionChance = ghgConcentration / 3500; 
                        if (Math.random() < collisionChance) {
                            // 吸收並再輻射
                            p.vx = (Math.random() - 0.5) * 3.5;
                            p.vy = (Math.random() - 0.5) * 3.5;
                            p.reRadiated = true;
                        }
                    }
                    if (p.y < -30) return; // 逃逸到太空
                    if (p.y > GROUND_Y) { p.y = GROUND_Y; p.vy *= -1; } // 地表反射/回彈
                    if (p.x < 0 || p.x > CANVAS_WIDTH) p.vx *= -1;
                }
                newParticles.push(p);
            });
            particlesRef.current = newParticles;

            // 3. 繪製質點
            particlesRef.current.forEach(p => {
                ctx.beginPath();
                if (p.type === 'sunlight') {
                    ctx.fillStyle = '#facc15'; ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                } else {
                    ctx.fillStyle = '#ef4444'; ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    if (p.reRadiated) { ctx.shadowBlur = 8; ctx.shadowColor = '#ef4444'; }
                }
                ctx.fill(); ctx.shadowBlur = 0;
            });

            // 4. 溫度邏輯 (平滑模擬)
            const targetTemp = -18 + (ghgConcentration * 0.65); 
            setTemperature(prev => prev + (targetTemp - prev) * 0.04);

            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(updatePhysics);
            return () => cancelAnimationFrame(requestRef.current);
        }, [ghgConcentration]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 pb-12 font-sans text-slate-200">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-emerald-500/20 p-2 rounded-lg text-emerald-400">
                            <i data-lucide="globe"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">溫室效應模型模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Environmental Physics
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-emerald-400 font-bold flex items-center gap-2 text-lg uppercase tracking-wider">
                                <i data-lucide="settings-2"></i> 大氣環境設定
                            </h2>

                            <div>
                                <div className="flex justify-between items-end mb-4">
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">溫室氣體濃度 (CO₂, CH₄)</label>
                                    <span className="text-emerald-400 font-mono font-black text-lg">{ghgConcentration}%</span>
                                </div>
                                <input 
                                    type="range" min="0" max="100" step="1"
                                    value={ghgConcentration}
                                    onChange={(e) => setGhgConcentration(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"
                                />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-3 font-bold uppercase tracking-tighter">
                                    <span>無氣體 (-18°C)</span>
                                    <span>現代水平</span>
                                    <span>失控溫室</span>
                                </div>
                            </div>

                            <div className="bg-slate-950 rounded-2xl p-6 border border-slate-700 flex items-center justify-between shadow-inner">
                                <div>
                                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">全球平均氣溫</div>
                                    <div className={`text-4xl font-black font-mono transition-colors duration-500 ${temperature > 25 ? 'text-red-500' : temperature > 10 ? 'text-emerald-400' : 'text-blue-400'}`}>
                                        {temperature.toFixed(1)}°C
                                    </div>
                                    <div className="text-[10px] text-slate-500 mt-2 font-bold uppercase">
                                        狀態：{temperature < -10 ? '冰河期' : temperature > 25 ? '極端高溫' : '適宜居住'}
                                    </div>
                                </div>
                                <div className="h-24 w-6 bg-slate-800 rounded-full relative overflow-hidden border border-slate-700">
                                    <div 
                                        className={`absolute bottom-0 w-full transition-all duration-700 ${temperature > 20 ? 'bg-red-500 shadow-[0_0_10px_red]' : 'bg-emerald-500'}`}
                                        style={{height: `${Math.min(100, Math.max(0, (temperature + 20) / 60 * 100))}%`}}
                                    ></div>
                                </div>
                            </div>

                            <div className="space-y-4 pt-4 border-t border-slate-700 text-xs text-slate-400 font-medium">
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.6)]"></div>
                                    <span><b>太陽輻射 (短波)：</b> 直接穿透大氣抵達地表。</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
                                    <span><b>紅外線 (長波)：</b> 地表釋放熱能，被氣體攔截。</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full border border-slate-500 bg-slate-700"></div>
                                    <span><b>大氣霧霾：</b> 代表溫室氣體分子的分佈密度。</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8">
                        <div className="bg-slate-950 rounded-[2.5rem] border-8 border-slate-800 h-[550px] relative overflow-hidden shadow-2xl">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            
                            <div className="absolute top-6 left-6 bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 text-xs text-slate-300 font-bold">
                                外太空 (Outer Space)
                            </div>
                            <div className="absolute top-1/2 left-6 bg-blue-900/30 backdrop-blur-sm px-4 py-1.5 rounded-full border border-blue-500/20 text-xs text-blue-200 font-bold">
                                大氣層 (Atmosphere)
                            </div>
                            <div className="absolute bottom-6 left-6 bg-green-900/50 backdrop-blur-md px-4 py-1.5 rounded-full border border-green-500/20 text-xs text-green-200 font-bold">
                                地表 (Earth Surface)
                            </div>
                        </div>
                        <div className="mt-6 bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-2 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理機制</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                溫室氣體允許短波長的可見光通過，但會吸收並隨機向各個方向重新輻射地表發出的長波紅外線。這就像在地球上方蓋了一條毯子，減少了能量向太空的流失速度。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
