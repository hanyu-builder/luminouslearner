<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帶電粒子實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .thumb-indigo::-webkit-slider-thumb { border-color: #6366f1; }
        .thumb-cyan::-webkit-slider-thumb { border-color: #06b6d4; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const PIXELS_PER_METER = 50; 

    // 發射器幾何
    const GUN_W = 60;
    const GUN_H = 30;
    const GUN_X = 0;
    const GUN_Y = CENTER_Y - GUN_H / 2;

    const App = () => {
        // --- 狀態 ---
        const [velocity, setVelocity] = useState(5.0); // m/s
        const [magneticField, setMagneticField] = useState(1.0); // Tesla
        const [particleType, setParticleType] = useState('proton'); 
        
        const [mass, setMass] = useState(1.0); 
        const [charge, setCharge] = useState(1.0); 

        const [radius, setRadius] = useState(0);
        const [period, setPeriod] = useState(0);
        
        const [particles, setParticles] = useState([]); 
        const [isRunning, setIsRunning] = useState(true);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const prevTimeRef = useRef(0);

        // --- 預設粒子參數 ---
        useEffect(() => {
            if (particleType === 'proton') {
                setMass(1.0); setCharge(1.0);
            } else if (particleType === 'electron') {
                setMass(0.1); setCharge(-1.0); 
            } else if (particleType === 'alpha') {
                setMass(4.0); setCharge(2.0);
            }
        }, [particleType]);

        // --- 物理計算 ---
        useEffect(() => {
            if (Math.abs(magneticField) < 0.01 || Math.abs(charge) < 0.01) {
                setRadius(Infinity); setPeriod(Infinity);
            } else {
                // r = mv / qB
                const r = (mass * velocity) / (Math.abs(charge) * Math.abs(magneticField));
                // T = 2πm / qB
                const T = (2 * Math.PI * mass) / (Math.abs(charge) * Math.abs(magneticField));
                setRadius(r);
                setPeriod(T);
            }
        }, [velocity, magneticField, mass, charge]);

        // --- 動作 ---
        const fireParticle = () => {
            setParticles(prev => [...prev, {
                x: 70, 
                y: CENTER_Y,
                vx: velocity * PIXELS_PER_METER, 
                vy: 0,
                m: mass,
                q: charge,
                trail: [],
                color: charge > 0 ? '#ef4444' : '#3b82f6',
                active: true,
                hit: false
            }]);
        };

        const clear = () => setParticles([]);

        // --- 動畫循環 ---
        const loop = (timestamp) => {
            const dt = (timestamp - prevTimeRef.current) / 1000;
            prevTimeRef.current = timestamp;
            const safeDt = Math.min(dt, 0.05);

            setParticles(prev => prev.map(p => {
                if (!p.active || p.hit) return p;

                const B = magneticField;
                // 勞侖茲力 F = q(v x B)
                // 假設 B 垂直向外 (Out of Page)
                const k = (p.q * B / p.m);
                const ax = -k * p.vy;
                const ay = k * p.vx;
                
                const newVx = p.vx + ax * safeDt;
                const newVy = p.vy + ay * safeDt;
                const newX = p.x + newVx * safeDt;
                const newY = p.y + newVy * safeDt;

                // 軌跡紀錄
                const newTrail = [...p.trail];
                if (newTrail.length === 0 || Math.hypot(newX - newTrail[newTrail.length-1].x, newY - newTrail[newTrail.length-1].y) > 5) {
                    newTrail.push({x: newX, y: newY});
                }
                if (newTrail.length > 150) newTrail.shift();

                const isInside = newX > -100 && newX < CANVAS_WIDTH + 100 && newY > -100 && newY < CANVAS_HEIGHT + 100;
                
                // 碰撞發射器檢查
                let isHit = false;
                if (newX < 60 && newY > CENTER_Y - 20 && newY < CENTER_Y + 20) isHit = true;

                return { 
                    ...p, 
                    x: newX, y: newY, 
                    vx: isHit ? 0 : newVx, 
                    vy: isHit ? 0 : newVy, 
                    trail: newTrail, 
                    active: isInside,
                    hit: isHit 
                };
            }).filter(p => p.active));

            draw();
            if (isRunning) requestRef.current = requestAnimationFrame(loop);
        };

        // --- 渲染 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製磁場背景
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1.5;
            const spacing = 50, size = 6;
            if (Math.abs(magneticField) > 0.1) {
                for (let x = 25; x < CANVAS_WIDTH; x += spacing) {
                    for (let y = 25; y < CANVAS_HEIGHT; y += spacing) {
                        if (magneticField < 0) { // 入紙面 (X)
                            ctx.beginPath(); ctx.moveTo(x-size, y-size); ctx.lineTo(x+size, y+size);
                            ctx.moveTo(x+size, y-size); ctx.lineTo(x-size, y+size); ctx.stroke();
                        } else { // 出紙面 (O)
                            ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.fill();
                            ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.stroke();
                        }
                    }
                }
                ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 14px Inter'; ctx.textAlign = 'right';
                ctx.fillText(magneticField < 0 ? "磁場方向：進入紙面 (✕)" : "磁場方向：穿出紙面 (⊙)", CANVAS_WIDTH - 30, 35);
            }

            // 2. 繪製粒子
            particles.forEach(p => {
                // 軌跡
                if (p.trail.length > 1) {
                    ctx.beginPath(); ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.5;
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    p.trail.forEach(pt => ctx.lineTo(pt.x, pt.y));
                    ctx.stroke(); ctx.globalAlpha = 1.0;
                }
                // 粒子本體
                ctx.beginPath(); ctx.arc(p.x, p.y, 7 + p.m/2, 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
                // 符號
                ctx.fillStyle = 'white'; ctx.font = 'bold 11px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.q > 0 ? '+' : '-', p.x, p.y + 0.5);
                if (p.hit) { ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI*2); ctx.stroke(); }
            });
            
            // 3. 繪製發射器
            ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.roundRect(GUN_X, GUN_Y, GUN_W, GUN_H, 4); ctx.fill();
            ctx.fillStyle = '#475569'; ctx.fillRect(GUN_X + GUN_W - 10, GUN_Y + 5, 10, 20);
        };

        useEffect(() => {
            if (isRunning) requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [isRunning, magneticField, particles]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400"><i data-lucide="atom"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">帶電粒子實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Electromagnetism</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[480px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 flex gap-3">
                                <button onClick={fireParticle} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="zap" className="w-4 h-4"></i> 發射粒子</button>
                                <button onClick={clear} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl font-bold transition-all border border-slate-700 active:scale-95">清除路徑</button>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <div className="flex gap-4 p-1 bg-slate-950 rounded-2xl border border-slate-700 w-fit">
                                {['proton', 'electron', 'alpha'].map(t => (
                                    <button key={t} onClick={() => setParticleType(t)} className={`px-6 py-2 rounded-xl text-xs font-bold transition-all ${particleType === t ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>{t === 'proton' ? '質子 (+)' : t === 'electron' ? '電子 (-)' : '阿爾法粒子 (++)'}</button>
                                ))}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                <div className="space-y-4">
                                    <label className="flex justify-between text-xs font-bold text-cyan-400 uppercase tracking-widest"><span>初速度 (v)</span><span className="text-white font-mono">{velocity} m/s</span></label>
                                    <input type="range" min="1" max="10" step="0.5" value={velocity} onChange={(e) => setVelocity(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                                </div>
                                <div className="space-y-4">
                                    <label className="flex justify-between text-xs font-bold text-indigo-400 uppercase tracking-widest"><span>磁場強度 (B)</span><span className="text-white font-mono">{magneticField} T</span></label>
                                    <input type="range" min="-2.0" max="2.0" step="0.1" value={magneticField} onChange={(e) => setMagneticField(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-indigo" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="calculator" className="text-indigo-400"></i> 定量數據預測</h2>
                            <div className="space-y-5 font-mono">
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 shadow-inner">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-2">軌道半徑 (r)</div>
                                    <div className="text-3xl font-black text-emerald-400 tracking-tighter">
                                        {Math.abs(radius) === Infinity ? "∞" : Math.abs(radius).toFixed(2)} <span className="text-sm font-medium text-slate-600">m</span>
                                    </div>
                                </div>
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 shadow-inner">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-2">公轉週期 (T)</div>
                                    <div className="text-2xl font-black text-white tracking-tighter">
                                        {Math.abs(period) === Infinity ? "∞" : Math.abs(period).toFixed(2)} <span className="text-sm font-medium text-slate-600">s</span>
                                    </div>
                                    <p className="text-[9px] text-indigo-400 mt-2 italic font-bold leading-tight">* 注意：週期與速度無關！</p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 手則提示</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                使用 <b>佛萊明左手定則</b> 判定正電荷的受力方向。如果是電子（負電），請將結果反轉或使用右手判定。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
