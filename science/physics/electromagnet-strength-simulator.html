<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電磁鐵強度實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #f97316;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }
        .thumb-orange::-webkit-slider-thumb { border-color: #f97316; }
        .thumb-cyan::-webkit-slider-thumb { border-color: #06b6d4; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CORE_X = 250;
    const CORE_Y = CANVAS_HEIGHT / 2;
    const CORE_WIDTH = 300;
    const CORE_HEIGHT = 60;

    const App = () => {
        // --- 狀態 ---
        const [current, setCurrent] = useState(2.0); // 安培
        const [turns, setTurns] = useState(10); // 圈數
        const [hasCore, setHasCore] = useState(true); // 是否有鐵芯
        const [showField, setShowField] = useState(true);
        
        // 計算結果
        const [magneticField, setMagneticField] = useState(0); 
        const [clipsPicked, setClipsPicked] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const electronOffsetRef = useRef(0);

        // --- 物理邏輯 ---
        useEffect(() => {
            // 磁場公式簡化模型：B = k * mu * N * I
            // 軟鐵磁導率假設為空氣的 50 倍
            const mu = hasCore ? 50 : 1; 
            const B = (mu * turns * current) / 100; 
            
            setMagneticField(B);
            
            // 計算吸起的迴紋針數量 (上限 20)
            const maxCapacity = Math.min(20, Math.floor(B / 2));
            setClipsPicked(maxCapacity);

        }, [current, turns, hasCore]);

        // --- 動畫循環 ---
        const loop = () => {
            // 電子流速與電流成正比
            const speed = Math.min(10, current * 2.5); 
            electronOffsetRef.current = (electronOffsetRef.current + speed) % 20; 
            
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        });

        // --- 渲染 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製磁場線 (N -> S)
            if (showField && magneticField > 0.1) {
                drawFieldLines(ctx);
            }

            // 2. 繪製鐵芯
            if (hasCore) {
                const grad = ctx.createLinearGradient(CORE_X, CORE_Y - CORE_HEIGHT/2, CORE_X, CORE_Y + CORE_HEIGHT/2);
                grad.addColorStop(0, '#94a3b8');
                grad.addColorStop(0.5, '#cbd5e1');
                grad.addColorStop(1, '#64748b');
                
                ctx.fillStyle = grad;
                ctx.fillRect(CORE_X, CORE_Y - CORE_HEIGHT/2, CORE_WIDTH, CORE_HEIGHT);
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
                ctx.strokeRect(CORE_X, CORE_Y - CORE_HEIGHT/2, CORE_WIDTH, CORE_HEIGHT);
                
                ctx.fillStyle = '#475569'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'left';
                ctx.fillText("軟鐵芯 (SOFT IRON)", CORE_X + 15, CORE_Y + 5);
            } else {
                ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.setLineDash([5, 5]);
                ctx.strokeRect(CORE_X, CORE_Y - CORE_HEIGHT/2, CORE_WIDTH, CORE_HEIGHT);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = 'bold 10px Inter';
                ctx.fillText("空氣芯 (AIR CORE)", CORE_X + 15, CORE_Y + 5);
            }

            // 3. 繪製線圈與電路
            drawCoils(ctx);
            drawCircuit(ctx);
            drawPaperclips(ctx);
        };

        const drawFieldLines = (ctx) => {
            const strength = Math.min(1, magneticField / 55); 
            ctx.lineWidth = 2;
            const numLines = 6;
            for(let i=1; i<=numLines; i++) {
                const yOff = i * 40;
                const alpha = strength * (1 - i/numLines);
                ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                
                ctx.beginPath();
                // 上半部迴圈
                ctx.moveTo(CORE_X, CORE_Y - CORE_HEIGHT/2);
                ctx.bezierCurveTo(CORE_X - 120 - yOff, CORE_Y - CORE_HEIGHT/2, CORE_X - 120 - yOff, CORE_Y - 120 - yOff, CORE_X + CORE_WIDTH/2, CORE_Y - 120 - yOff);
                ctx.bezierCurveTo(CORE_X + CORE_WIDTH + 120 + yOff, CORE_Y - 120 - yOff, CORE_X + CORE_WIDTH + 120 + yOff, CORE_Y - CORE_HEIGHT/2, CORE_X + CORE_WIDTH, CORE_Y - CORE_HEIGHT/2);
                ctx.stroke();

                // 下半部迴圈
                ctx.beginPath();
                ctx.moveTo(CORE_X, CORE_Y + CORE_HEIGHT/2);
                ctx.bezierCurveTo(CORE_X - 120 - yOff, CORE_Y + CORE_HEIGHT/2, CORE_X - 120 - yOff, CORE_Y + 120 + yOff, CORE_X + CORE_WIDTH/2, CORE_Y + 120 + yOff);
                ctx.bezierCurveTo(CORE_X + CORE_WIDTH + 120 + yOff, CORE_Y + 120 + yOff, CORE_X + CORE_WIDTH + 120 + yOff, CORE_Y + CORE_HEIGHT/2, CORE_X + CORE_WIDTH, CORE_Y + CORE_HEIGHT/2);
                ctx.stroke();
                
                // 箭頭 (N 側流出)
                const midX = CORE_X + CORE_WIDTH/2;
                const midY = CORE_Y - 120 - yOff;
                drawArrowHead(ctx, midX, midY, -1, `rgba(56, 189, 248, ${alpha})`);
            }
        };
        
        const drawArrowHead = (ctx, x, y, dir, color) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + 6*dir, y);
            ctx.lineTo(x - 6*dir, y - 6);
            ctx.lineTo(x - 6*dir, y + 6);
            ctx.fill();
        };

        const drawCoils = (ctx) => {
            const spacing = CORE_WIDTH / (turns + 1);
            ctx.lineWidth = 5; ctx.lineCap = 'round';
            // 背後導線
            for(let i=0; i<turns; i++) {
                const x = CORE_X + spacing * (i + 0.5);
                ctx.strokeStyle = '#92400e'; ctx.beginPath();
                ctx.moveTo(x + 10, CORE_Y - CORE_HEIGHT/2);
                ctx.lineTo(x - 10, CORE_Y + CORE_HEIGHT/2); ctx.stroke();
            }
            // 正面導線
            for(let i=0; i<turns; i++) {
                const x = CORE_X + spacing * (i + 0.5);
                ctx.strokeStyle = '#f59e0b'; ctx.beginPath();
                ctx.moveTo(x - 10, CORE_Y + CORE_HEIGHT/2);
                ctx.lineTo(x + 10, CORE_Y - CORE_HEIGHT/2); ctx.stroke();
                if (current > 0.1) {
                    const progress = (electronOffsetRef.current / 20);
                    const ex = (x - 10) + ((x + 10) - (x - 10)) * progress;
                    const ey = (CORE_Y + CORE_HEIGHT/2) + ((CORE_Y - CORE_HEIGHT/2) - (CORE_Y + CORE_HEIGHT/2)) * progress;
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(ex, ey, 2.5, 0, Math.PI*2); ctx.fill();
                }
            }
            // 連接
            ctx.strokeStyle = '#f59e0b';
            ctx.beginPath(); ctx.moveTo(CORE_X - 60, CORE_Y + 60); ctx.lineTo(CORE_X + spacing*0.5 - 10, CORE_Y + CORE_HEIGHT/2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(CORE_X + CORE_WIDTH + 60, CORE_Y + 60); ctx.lineTo(CORE_X + spacing*(turns-0.5) + 10, CORE_Y - CORE_HEIGHT/2); ctx.stroke();
        };

        const drawCircuit = (ctx) => {
            const batX = CANVAS_WIDTH / 2, batY = 380;
            ctx.lineWidth = 4; ctx.strokeStyle = '#fbbf24';
            ctx.beginPath(); ctx.moveTo(CORE_X - 60, CORE_Y + 60); ctx.lineTo(CORE_X - 60, batY); ctx.lineTo(batX - 35, batY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(CORE_X + CORE_WIDTH + 60, CORE_Y + 60); ctx.lineTo(CORE_X + CORE_WIDTH + 60, batY); ctx.lineTo(batX + 35, batY); ctx.stroke();
            // 電池
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(batX - 35, batY - 20); ctx.lineTo(batX - 35, batY + 20); ctx.stroke();
            ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(batX - 15, batY - 30); ctx.lineTo(batX - 15, batY + 30); ctx.stroke();
            // 調節標示
            ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(batX - 45, batY + 35); ctx.lineTo(batX + 15, batY - 35); ctx.lineTo(batX + 15, batY - 25); ctx.moveTo(batX + 15, batY - 35); ctx.lineTo(batX + 5, batY - 35); ctx.stroke();
            ctx.fillStyle = '#facc15'; ctx.font = 'bold 16px Inter'; ctx.textAlign = 'center';
            ctx.fillText(`${current}A`, batX, batY + 50);
        };

        const drawPaperclips = (ctx) => {
            if (clipsPicked === 0) return;
            const oX = CORE_X + CORE_WIDTH, oY = CORE_Y;
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
            let cx = oX, cy = oY;
            for(let i=0; i<clipsPicked; i++) {
                ctx.beginPath(); ctx.ellipse(cx + 12, cy, 10, 4, 0.4, 0, Math.PI*2); ctx.stroke();
                cx += 18; cy += (Math.sin(i*0.5)*2 + 2.5);
            }
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'left';
            ctx.fillText(`已吸起: ${clipsPicked}`, oX + 20, oY - 20);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
        
        const reset = () => { setCurrent(2.0); setTurns(10); setHasCore(true); };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-400"><i data-lucide="zap"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">電磁鐵強度實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Electromagnetism</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[450px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 bg-slate-900/90 px-5 py-4 rounded-2xl border border-slate-700 backdrop-blur-md shadow-lg space-y-2">
                                <div className="flex justify-between gap-6"><span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">磁場強度 (B)</span><span className="text-xl font-black text-cyan-400 font-mono">{magneticField.toFixed(0)} <span className="text-xs">單位</span></span></div>
                                <div className="flex justify-between gap-6"><span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">負載能力</span><span className="text-xl font-black text-white font-mono">{clipsPicked} <span className="text-xs">枚</span></span></div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-orange-400 uppercase tracking-widest mb-2"><span>電流大小 (I)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{current} A</span></label>
                                <input type="range" min="0" max="5.0" step="0.1" value={current} onChange={(e)=>setCurrent(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-orange" />
                            </div>
                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2"><span>線圈圈數 (N)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{turns} 圈</span></label>
                                <input type="range" min="5" max="30" step="1" value={turns} onChange={(e)=>setTurns(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                            </div>
                            <div className="flex flex-col gap-3 pt-2">
                                <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                    <span className="text-xs font-bold text-slate-300 uppercase tracking-widest">插入軟鐵芯</span>
                                    <input type="checkbox" checked={hasCore} onChange={()=>setHasCore(!hasCore)} className="w-5 h-5 rounded border-slate-600 text-indigo-500 focus:ring-0 cursor-pointer" />
                                </label>
                                <button onClick={reset} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-all active:scale-95 flex items-center justify-center gap-2"><i data-lucide="rotate-ccw"></i> 重置實驗</button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-800 pb-4"><i data-lucide="book-open" className="text-indigo-400"></i> 強度變因分析</h2>
                            <div className="space-y-5">
                                <div className="p-4 rounded-xl bg-orange-900/10 border border-orange-500/20">
                                    <strong className="text-orange-400 block mb-1 text-xs uppercase tracking-widest">1. 電流 (I)</strong>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">電流愈大，單位時間內運動的電荷愈多，產生的感應磁場愈強。</p>
                                </div>
                                <div className="p-4 rounded-xl bg-cyan-900/10 border border-cyan-500/20">
                                    <strong className="text-cyan-400 block mb-1 text-xs uppercase tracking-widest">2. 圈數 (N)</strong>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">每個線圈都會產生磁場，疊加後總強度與圈數成正比。</p>
                                </div>
                                <div className="p-4 rounded-xl bg-indigo-900/10 border border-indigo-500/20">
                                    <strong className="text-indigo-400 block mb-1 text-xs uppercase tracking-widest">3. 鐵芯 (Core)</strong>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">軟鐵具有高磁導率，能集中並放大磁力線，強度可提升數十倍。</p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/30 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 生活應用</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                垃圾場的<b>廢鐵起重機</b>就是巨大的電磁鐵。當通電時吸起廢車，斷電時則立刻鬆開。這展示了電磁鐵最重要的優點：磁性可隨意開關。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
