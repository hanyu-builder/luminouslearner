<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伽利略斜面實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #facc15; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 400;
    const G = 9.81;
    const RAMP_LENGTH_PIXELS = 400;
    const SCALE = 100; // 100 像素 = 1 公尺

    const App = () => {
        // --- 狀態 ---
        const [angle, setAngle] = useState(30); // 度數
        const [time, setTime] = useState(0);
        const [isRunning, setIsRunning] = useState(false);
        const [showVectors, setShowVectors] = useState(true);
        
        // 物理狀態
        const [dist, setDist] = useState(0); // 公尺
        const [velocity, setVelocity] = useState(0); // m/s
        const [acceleration, setAcceleration] = useState(0); // m/s^2

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const startTimeRef = useRef(0);

        // --- 物理引擎 ---
        useEffect(() => {
            // 當角度改變時重新計算加速度
            const rad = angle * (Math.PI / 180);
            const a = G * Math.sin(rad);
            setAcceleration(a);
        }, [angle]);

        const startSim = () => {
            setIsRunning(true);
            startTimeRef.current = Date.now() - time * 1000;
            animate();
        };

        const pauseSim = () => {
            setIsRunning(false);
            cancelAnimationFrame(requestRef.current);
        };

        const resetSim = () => {
            setIsRunning(false);
            cancelAnimationFrame(requestRef.current);
            setTime(0);
            setDist(0);
            setVelocity(0);
        };

        const animate = () => {
            const now = Date.now();
            const t = (now - startTimeRef.current) / 1000; // 秒
            
            // 運動方程式
            const rad = angle * (Math.PI / 180);
            const a = G * Math.sin(rad);
            
            // s = 0.5 * a * t^2
            const s = 0.5 * a * t * t;
            // v = a * t
            const v = a * t;

            const maxDist = RAMP_LENGTH_PIXELS / SCALE;
            if (s >= maxDist) {
                setDist(maxDist);
                setVelocity(Math.sqrt(2 * a * maxDist)); 
                setTime(Math.sqrt(2 * maxDist / a)); 
                setIsRunning(false);
                return;
            }

            setTime(t);
            setDist(s);
            setVelocity(v);

            requestRef.current = requestAnimationFrame(animate);
        };

        // --- 繪圖功能 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const rad = angle * (Math.PI / 180);
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const pivotX = 50;
            const pivotY = CANVAS_HEIGHT - 50;
            
            const endX = pivotX + RAMP_LENGTH_PIXELS * Math.cos(rad);
            const endY = pivotY - RAMP_LENGTH_PIXELS * Math.sin(rad);

            // 1. 繪製斜面 (三角形)
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(pivotX, pivotY);
            ctx.lineTo(endX, endY); 
            ctx.lineTo(endX, pivotY); 
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 角度弧線
            ctx.beginPath();
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.arc(pivotX, pivotY, 40, -rad, 0);
            ctx.stroke();
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 12px Inter';
            ctx.fillText(`${angle}°`, pivotX + 50, pivotY - 10);

            // 2. 繪製小球
            const pixelDist = dist * SCALE;
            const startX = endX;
            const startY = endY;
            
            const dx = -Math.cos(rad) * pixelDist;
            const dy = Math.sin(rad) * pixelDist;
            const ballX = startX + dx;
            const ballY = startY + dy;

            const ballRadius = 15;
            const perpX = -Math.sin(rad) * ballRadius; 
            const perpY = -Math.cos(rad) * ballRadius; 
            const drawX = ballX + perpX;
            const drawY = ballY + perpY;

            ctx.beginPath();
            ctx.arc(drawX, drawY, ballRadius, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(drawX - 5, drawY - 5, 2, drawX, drawY, ballRadius);
            grad.addColorStop(0, '#fff');
            grad.addColorStop(1, '#6366f1');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 3. 繪製力向量
            if (showVectors) {
                const drawArrow = (x, y, len, angleRad, color, label) => {
                    const toX = x + len * Math.cos(angleRad);
                    const toY = y + len * Math.sin(angleRad);
                    ctx.beginPath();
                    ctx.strokeStyle = color; ctx.lineWidth = 3;
                    ctx.moveTo(x, y); ctx.lineTo(toX, toY);
                    ctx.stroke();
                    const hL = 8;
                    ctx.beginPath(); ctx.fillStyle = color;
                    ctx.moveTo(toX, toY);
                    ctx.lineTo(toX - hL * Math.cos(angleRad - Math.PI / 6), toY - hL * Math.sin(angleRad - Math.PI / 6));
                    ctx.lineTo(toX - hL * Math.cos(angleRad + Math.PI / 6), toY - hL * Math.sin(angleRad + Math.PI / 6));
                    ctx.fill();
                    ctx.font = 'bold 11px Inter';
                    ctx.fillText(label, toX + 5, toY + 5);
                };

                const vecScale = 6;
                drawArrow(drawX, drawY, 9.8 * vecScale, Math.PI/2, '#3b82f6', 'mg (重力)');
                drawArrow(drawX, drawY, 9.8 * Math.cos(rad) * vecScale, -Math.PI/2 - rad, '#10b981', 'N (正向力)');
                drawArrow(drawX, drawY, 9.8 * Math.sin(rad) * vecScale, Math.PI - rad, '#ef4444', 'mg sinθ (下滑力)');
            }

        }, [angle, dist, showVectors]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-yellow-500/20 p-2 rounded-lg text-yellow-500">
                            <i data-lucide="triangle"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">伽利略斜面實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Mechanics (Motion)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 right-6 flex flex-col gap-2">
                                <button 
                                    onClick={() => setShowVectors(!showVectors)}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${showVectors ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400'}`}
                                >
                                    <i data-lucide="arrow-up-right" className="w-3.5 h-3.5 inline mr-1"></i> 受力向量
                                </button>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-10 items-center">
                            <div className="flex-1 min-w-[250px]">
                                <label className="flex justify-between text-xs font-bold text-yellow-500 uppercase tracking-widest mb-4">
                                    <span>斜面角度 (θ)</span>
                                    <span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{angle}°</span>
                                </label>
                                <input 
                                    type="range" min="5" max="85" step="1"
                                    value={angle} onChange={(e) => { setAngle(Number(e.target.value)); resetSim(); }}
                                    disabled={isRunning}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"
                                />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase italic">
                                    <span>平緩 (緩慢)</span>
                                    <span>陡峭 (接近自由落體)</span>
                                </div>
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={isRunning ? pauseSim : startSim}
                                    className={`px-8 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg ${isRunning ? 'bg-amber-600/20 text-amber-400 border border-amber-500/50' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/20'}`}
                                >
                                    <i data-lucide={isRunning ? "pause" : "play"}></i>
                                    {isRunning ? "暫停" : "釋放小球"}
                                </button>
                                <button onClick={resetSim} className="p-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all active:rotate-180">
                                    <i data-lucide="rotate-ccw"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="calculator" className="text-indigo-400"></i> 物理即時數據
                            </h2>
                            <div className="space-y-5">
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">加速度 (a)</div>
                                    <div className="text-3xl font-black text-red-400 font-mono tracking-tighter">
                                        {acceleration.toFixed(2)} <span className="text-xs">m/s²</span>
                                    </div>
                                    <div className="text-[9px] text-indigo-400 mt-2 font-bold italic">公式：g &times; sin({angle}°)</div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 shadow-inner">
                                        <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">經歷時間</div>
                                        <div className="text-xl font-bold text-white font-mono">{time.toFixed(2)}s</div>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 shadow-inner">
                                        <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">瞬時速度</div>
                                        <div className="text-xl font-bold text-emerald-400 font-mono">{velocity.toFixed(1)} <span className="text-[10px]">m/s</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest">
                                <i data-lucide="lightbulb" className="w-4 h-4"></i> 為何使用斜面？
                            </h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                伽利略時代沒有高速攝影機。自由落體（9.8 m/s²）太快，難以測量。
                                <br/><br/>
                                透過使用斜面，他「<b>稀釋</b>」了重力。例如在 30° 時，加速度僅為 <b>0.5g</b>。這讓運動變得足夠緩慢，才能觀測出位移與時間平方成正比的規律。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
