<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質量虧損計算機 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #ffffff;
        }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 常數定義
    const C = 299792458; // 光速 (m/s)
    const U_TO_KG = 1.66053906660e-27; // 1 u 的公斤值
    const J_TO_MEV = 6.242e12; // 1 焦耳轉 MeV
    const U_TO_MEV = 931.5; // 1 u 約等於 931.5 MeV/c^2

    // 反應預設值
    const REACTIONS = {
        'fusion': {
            name: '核融合 (太陽動力)',
            desc: '氘 (D) + 氚 (T) → 氦-4 + 中子',
            reactants: [
                { name: '氘 (H-2)', mass: 2.014102, count: 1 },
                { name: '氚 (H-3)', mass: 3.016049, count: 1 }
            ],
            products: [
                { name: '氦-4', mass: 4.002602, count: 1 },
                { name: '中子', mass: 1.008665, count: 1 }
            ],
            color: 'from-orange-500 to-yellow-500'
        },
        'fission': {
            name: '核分裂 (核能發電)',
            desc: '鈾-235 + 中子 → 鋇-141 + 氪-92 + 3 中子',
            reactants: [
                { name: '鈾-235', mass: 235.043930, count: 1 },
                { name: '中子', mass: 1.008665, count: 1 }
            ],
            products: [
                { name: '鋇-141', mass: 140.914411, count: 1 },
                { name: '氪-92', mass: 91.926156, count: 1 },
                { name: '中子', mass: 1.008665, count: 3 }
            ],
            color: 'from-blue-600 to-cyan-500'
        },
        'alpha': {
            name: '阿爾法衰變',
            desc: '鐳-226 → 氡-222 + 阿爾法粒子',
            reactants: [
                { name: '鐳-226', mass: 226.025410, count: 1 }
            ],
            products: [
                { name: '氡-222', mass: 222.017578, count: 1 },
                { name: '阿爾法粒子', mass: 4.002602, count: 1 }
            ],
            color: 'from-green-600 to-emerald-500'
        },
        'custom': {
            name: '自定義計算',
            desc: '手動輸入質量數值進行運算',
            reactants: [{ name: '輸入總質量', mass: 10.000000, count: 1 }],
            products: [{ name: '輸出總質量', mass: 9.995000, count: 1 }],
            color: 'from-slate-600 to-slate-500'
        }
    };

    const App = () => {
        // --- 狀態 ---
        const [mode, setMode] = useState('fusion');
        const [customMassIn, setCustomMassIn] = useState(10.0);
        const [customMassOut, setCustomMassOut] = useState(9.995);

        // --- 計算屬性 ---
        const currentReaction = useMemo(() => REACTIONS[mode], [mode]);
        
        const massReactants = useMemo(() => {
            if (mode === 'custom') return customMassIn;
            return currentReaction.reactants.reduce((sum, item) => sum + item.mass * item.count, 0);
        }, [mode, customMassIn, currentReaction]);

        const massProducts = useMemo(() => {
            if (mode === 'custom') return customMassOut;
            return currentReaction.products.reduce((sum, item) => sum + item.mass * item.count, 0);
        }, [mode, customMassOut, currentReaction]);

        const massDefect = massReactants - massProducts; // 單位：u
        const energyMeV = massDefect * U_TO_MEV; // 單位：MeV
        const energyJoules = massDefect * U_TO_KG * C * C; // E = mc^2 (焦耳)
        
        // 推算 1kg 燃料的效能
        const energyPerKg = energyJoules / (massReactants * U_TO_KG); 
        const tntEquivalent = energyPerKg / 4.184e6; // kg TNT 每公斤燃料
        const homeYears = (energyPerKg / (3.6e6 * 10)) / 365; // 假設家庭每日用電 10度 (36MJ)

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        // --- 子組件 ---
        const ParticleList = ({ items, title, color }) => (
            <div className={`p-5 rounded-2xl border border-slate-800 bg-slate-900/50 flex-1 flex flex-col h-full`}>
                <h3 className={`text-[10px] font-black uppercase tracking-widest mb-4 ${color}`}>{title}</h3>
                <div className="space-y-3 flex-1">
                    {items.map((item, i) => (
                        <div key={i} className="flex justify-between items-center text-sm p-3 bg-slate-950 rounded-xl border border-slate-800 shadow-inner">
                            <div className="flex items-center gap-3">
                                <span className="font-black text-white bg-slate-800 w-7 h-7 flex items-center justify-center rounded-lg border border-slate-700">{item.count}</span>
                                <span className="text-slate-300 font-bold">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs text-slate-500">{item.mass.toFixed(6)} u</span>
                        </div>
                    ))}
                </div>
                <div className="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                    <span className="text-[10px] font-bold text-slate-500 uppercase">總質量</span>
                    <span className="font-mono text-xl font-black text-white">
                        {mode === 'custom' 
                            ? (title.includes('反應物') ? massReactants : massProducts).toFixed(6) 
                            : items.reduce((s, i) => s + i.mass*i.count, 0).toFixed(6)
                        } <span className="text-xs font-medium text-slate-600 ml-1">u</span>
                    </span>
                </div>
            </div>
        );

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-rose-500/20 p-2 rounded-lg text-rose-500">
                            <i data-lucide="atom"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">質量虧損計算機</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Nuclear Physics (E = mc²)
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        {/* 反應類型選擇 */}
                        <div className="bg-slate-800 p-2 rounded-2xl border border-slate-700 flex gap-2 overflow-x-auto custom-scroll">
                            {Object.keys(REACTIONS).map(k => (
                                <button
                                    key={k}
                                    onClick={() => setMode(k)}
                                    className={`flex-1 py-3 px-6 rounded-xl text-xs font-bold transition-all whitespace-nowrap active:scale-95 ${mode === k ? 'bg-indigo-600 text-white shadow-lg border border-indigo-400/50' : 'bg-transparent text-slate-500 hover:bg-slate-700/50'}`}
                                >
                                    {REACTIONS[k].name}
                                </button>
                            ))}
                        </div>

                        {/* 視覺化核心區 */}
                        <div className={`bg-gradient-to-br ${REACTIONS[mode].color} p-1 rounded-[2.5rem] shadow-2xl`}>
                            <div className="bg-slate-950 rounded-[2.3rem] p-8 relative overflow-hidden flex flex-col justify-between min-h-[350px]">
                                <div className="absolute top-0 right-0 p-32 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                                
                                <div className="text-center mb-8 z-10">
                                    <h2 className="text-3xl font-black text-white mb-2 tracking-tight">{REACTIONS[mode].name}</h2>
                                    <div className="inline-block px-4 py-1 rounded-full bg-slate-900 border border-slate-800 text-sm font-mono text-indigo-400">{REACTIONS[mode].desc}</div>
                                </div>

                                {/* 天秤視覺模擬 */}
                                <div className="flex items-end justify-center gap-12 md:gap-24 mb-10 relative z-10">
                                    <div className="flex flex-col items-center gap-4 transition-all duration-700" style={{ transform: massDefect > 0 ? 'translateY(20px)' : 'translateY(0)' }}>
                                        <div className="w-28 h-28 rounded-3xl bg-slate-800 border-4 border-slate-700 flex flex-col items-center justify-center shadow-2xl relative group">
                                            <i data-lucide="package" className="w-12 h-12 text-blue-400"></i>
                                            <div className="absolute -bottom-3 bg-blue-600 px-3 py-1 rounded-lg text-[10px] font-black text-white border-2 border-slate-950">反應物 IN</div>
                                        </div>
                                        <div className="h-12 w-1.5 bg-slate-800 rounded-full"></div>
                                    </div>

                                    <div className="flex flex-col items-center mb-10">
                                        <div className="text-slate-800 mb-2">
                                            <i data-lucide="triangle" className="w-12 h-12 fill-current"></i>
                                        </div>
                                        <div className="w-48 h-1.5 bg-slate-800 rounded-full relative">
                                            <div className={`absolute inset-0 bg-gradient-to-r from-blue-500 to-emerald-500 rounded-full transition-all duration-700`} style={{ transform: `rotate(${massDefect * 100}deg)` }}></div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col items-center gap-4 transition-all duration-700" style={{ transform: massDefect > 0 ? 'translateY(-20px)' : 'translateY(0)' }}>
                                        <div className="w-28 h-28 rounded-3xl bg-slate-800 border-4 border-slate-700 flex flex-col items-center justify-center shadow-2xl relative">
                                            <i data-lucide="package-open" className="w-12 h-12 text-emerald-400"></i>
                                            <div className="absolute -bottom-3 bg-emerald-600 px-3 py-1 rounded-lg text-[10px] font-black text-white border-2 border-slate-950">生成物 OUT</div>
                                        </div>
                                        <div className="h-12 w-1.5 bg-slate-800 rounded-full"></div>
                                    </div>
                                </div>
                                
                                <div className={`p-6 rounded-2xl text-center z-10 transition-all duration-500 border-2 ${massDefect > 0 ? 'bg-emerald-900/20 border-emerald-500/50 animate-pulse-slow' : 'bg-red-900/20 border-red-500/50'}`}>
                                    <div className={`text-[10px] font-black uppercase tracking-widest mb-1 ${massDefect > 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                        {massDefect > 0 ? "偵測到質量虧損 (Mass Defect)" : "質量不減反增 (需吸收能量)"}
                                    </div>
                                    <div className="text-4xl font-mono text-white font-black">{Math.abs(massDefect).toFixed(6)} <span className="text-xl">u</span></div>
                                </div>
                            </div>
                        </div>

                        {/* 輸入區與列表 */}
                        {mode === 'custom' ? (
                            <div className="grid grid-cols-2 gap-6 bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                                <div className="space-y-4">
                                    <label className="text-xs font-bold text-blue-400 uppercase tracking-widest block">反應物總質量 (u)</label>
                                    <input type="number" step="0.0001" value={customMassIn} onChange={(e) => setCustomMassIn(parseFloat(e.target.value) || 0)} className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-5 py-4 text-white font-mono text-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-inner" />
                                </div>
                                <div className="space-y-4">
                                    <label className="text-xs font-bold text-emerald-400 uppercase tracking-widest block">生成物總質量 (u)</label>
                                    <input type="number" step="0.0001" value={customMassOut} onChange={(e) => setCustomMassOut(parseFloat(e.target.value) || 0)} className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-5 py-4 text-white font-mono text-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all shadow-inner" />
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col md:flex-row gap-6">
                                <ParticleList items={REACTIONS[mode].reactants} title="反應物 (Before)" color="text-blue-400" />
                                <div className="flex items-center justify-center">
                                    <i data-lucide="chevrons-right" className="w-8 h-8 text-slate-700 hidden md:block"></i>
                                    <i data-lucide="chevrons-down" className="w-8 h-8 text-slate-700 md:hidden"></i>
                                </div>
                                <ParticleList items={REACTIONS[mode].products} title="生成物 (After)" color="text-emerald-400" />
                            </div>
                        )}
                    </div>

                    {/* 右側：數據分析 */}
                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="zap" className="text-yellow-400"></i> 核能釋放分析
                            </h2>
                            
                            <div className="space-y-6">
                                <div className="p-5 rounded-2xl bg-slate-950 border border-slate-700 shadow-inner">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">每次反應能量輸出 (E)</div>
                                    <div className="text-4xl font-black text-white font-mono tracking-tighter">
                                        {energyMeV.toFixed(2)} <span className="text-lg text-indigo-400 font-medium ml-1">MeV</span>
                                    </div>
                                    <div className="text-[10px] text-slate-600 mt-2 font-mono italic">
                                        = {energyJoules.toExponential(3)} Joules
                                    </div>
                                </div>

                                <div className="pt-4 space-y-4">
                                    <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest">假如我們有 1 KG 此材料...</h3>
                                    
                                    <div className="p-5 bg-orange-950/20 border border-orange-500/30 rounded-2xl flex items-center gap-5 transition-all hover:bg-orange-950/30">
                                        <div className="p-3 bg-orange-500/20 rounded-xl text-orange-400 shadow-lg"><i data-lucide="flame"></i></div>
                                        <div>
                                            <div className="text-2xl font-black text-white font-mono">{(tntEquivalent/1000).toFixed(0)} 萬</div>
                                            <div className="text-[10px] text-orange-400 font-bold uppercase tracking-tighter">噸 TNT 炸藥當量</div>
                                        </div>
                                    </div>

                                    <div className="p-5 bg-blue-950/20 border border-blue-500/30 rounded-2xl flex items-center gap-5 transition-all hover:bg-blue-950/30">
                                        <div className="p-3 bg-blue-500/20 rounded-xl text-blue-400 shadow-lg"><i data-lucide="home"></i></div>
                                        <div>
                                            <div className="text-2xl font-black text-white font-mono">
                                                {homeYears > 10000 ? (homeYears/1000).toFixed(0) + 'k' : homeYears.toFixed(0)}
                                            </div>
                                            <div className="text-[10px] text-blue-400 font-bold uppercase tracking-tighter">供應單個家庭用電 (年數)</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-400 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理機制詳解</h3>
                            <div className="space-y-3 text-[11px] text-slate-400 leading-relaxed italic">
                                <p>當原子核發生結合或分裂時，一部分質量會消失。這並非消失，而是轉化為純粹的能量：</p>
                                <div className="text-center py-2 bg-slate-950/50 rounded-xl font-serif text-lg font-bold text-white tracking-widest border border-slate-800">E = mc²</div>
                                <p>由於光速 c 的平方是一個極其巨大的數字，即使微不足道的質量虧損，也能釋放出摧枯拉朽的能量。</p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
