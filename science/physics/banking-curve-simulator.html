<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彎道傾角實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-orange::-webkit-slider-thumb { border-color: #f97316; }
        .thumb-emerald::-webkit-slider-thumb { border-color: #10b981; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT * 0.7;
    const G = 9.81;

    const App = () => {
        // --- 狀態 ---
        const [angle, setAngle] = useState(15); // 度數
        const [velocity, setVelocity] = useState(20); // m/s
        const [radius, setRadius] = useState(50); // 米
        const [mu, setMu] = useState(0.5); // 摩擦係數
        const [showVectors, setShowVectors] = useState(true);
        const [showComponents, setShowComponents] = useState(false);

        // 物理計算結果
        const [idealSpeed, setIdealSpeed] = useState(0);
        const [maxSpeed, setMaxSpeed] = useState(0);
        const [minSpeed, setMinSpeed] = useState(0);
        const [status, setStatus] = useState('safe'); // safe, skid-out, slide-in

        const canvasRef = useRef(null);

        // --- 物理引擎 ---
        useEffect(() => {
            const rad = angle * (Math.PI / 180);
            
            // 1. 理想速率 (不需要摩擦力)
            // v = sqrt(rg tan(theta))
            const v_ideal = Math.sqrt(radius * G * Math.tan(rad));
            setIdealSpeed(v_ideal);

            // 2. 最大速率 (即將向外側滑 - 摩擦力沿斜面向下)
            const numMax = Math.sin(rad) + mu * Math.cos(rad);
            const denMax = Math.cos(rad) - mu * Math.sin(rad);
            let v_max = Infinity;
            if (denMax > 0) {
                v_max = Math.sqrt(radius * G * (numMax / denMax));
            }
            setMaxSpeed(v_max);

            // 3. 最小速率 (即將向內下滑 - 摩擦力沿斜面向上)
            const numMin = Math.sin(rad) - mu * Math.cos(rad);
            const denMin = Math.cos(rad) + mu * Math.sin(rad);
            let v_min = 0;
            if (numMin > 0) {
                v_min = Math.sqrt(radius * G * (numMin / denMin));
            }
            setMinSpeed(v_min);

            // 4. 判定狀態
            if (velocity > v_max) setStatus('skid-out');
            else if (velocity < v_min) setStatus('slide-in');
            else setStatus('safe');

        }, [angle, velocity, radius, mu]);

        // --- 渲染功能 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const rad = angle * (Math.PI / 180);

            // 1. 背景
            const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 2. 繪製傾斜路面
            const roadWidth = 600;
            ctx.save();
            ctx.translate(CENTER_X, CENTER_Y);
            
            // 地面基礎
            ctx.fillStyle = '#334155';
            ctx.fillRect(-400, 0, 800, 200);

            // 路面旋轉
            ctx.rotate(-rad);
            ctx.fillStyle = '#475569';
            ctx.fillRect(-roadWidth/2, 0, roadWidth, 20); 
            
            // 路面標線
            ctx.fillStyle = '#fbbf24';
            for(let i=-roadWidth/2; i<roadWidth/2; i+=40) {
                ctx.fillRect(i, 2, 20, 4);
            }

            // 3. 繪製車輛 (後視圖)
            const carW = 60;
            const carH = 40;
            
            // 根據狀態設定顏色
            ctx.fillStyle = status === 'safe' ? '#3b82f6' : '#ef4444';
            ctx.translate(0, -carH - 10); 

            // 車身
            ctx.fillRect(-carW/2, 0, carW, carH);
            // 車頂
            ctx.fillStyle = status === 'safe' ? '#60a5fa' : '#f87171';
            ctx.beginPath();
            ctx.moveTo(-carW/2 + 5, 0);
            ctx.lineTo(carW/2 - 5, 0);
            ctx.lineTo(carW/2 - 10, -20);
            ctx.lineTo(-carW/2 + 10, -20);
            ctx.fill();

            // 輪胎
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-carW/2 + 5, carH, 15, 10);
            ctx.fillRect(carW/2 - 20, carH, 15, 10);
            
            // 尾燈
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-carW/2 + 5, 10, 10, 5);
            ctx.fillRect(carW/2 - 15, 10, 10, 5);

            // 4. 向量繪製
            if (showVectors) {
                const vecScale = 1.0; 

                // 正向力 N (垂直於路面)
                drawArrow(ctx, 0, carH/2, 0, -80, '#10b981', '正向力 N');

                // 重力 mg (垂直向下)
                const gLen = 60;
                const gx = gLen * Math.sin(rad);
                const gy = gLen * Math.cos(rad);
                drawArrow(ctx, 0, carH/2, gx, gy, '#94a3b8', '重力 mg');

                // 摩擦力 f
                const fLen = Math.min(60, Math.abs(velocity - idealSpeed) * 3);
                if (velocity > idealSpeed) {
                    // 車速快，摩擦力沿斜面向下 (左)
                    drawArrow(ctx, 0, carH + 10, -fLen, 0, '#f59e0b', '摩擦力 f');
                } else if (velocity < idealSpeed) {
                    // 車速慢，摩擦力沿斜面向上 (右)
                    drawArrow(ctx, 0, carH + 10, fLen, 0, '#f59e0b', '摩擦力 f');
                }

                // 向心力 (合力) - 在世界坐標中是水平向左
                if (showComponents) {
                    const fcLen = Math.min(150, (velocity * velocity / radius) * 5);
                    const fcx = -fcLen * Math.cos(rad);
                    const fcy = fcLen * Math.sin(rad); 
                    drawArrow(ctx, 0, carH/2, fcx, fcy, '#ef4444', '所需向心力');
                }
            }

            ctx.restore();

        }, [angle, velocity, radius, mu, idealSpeed, status, showVectors, showComponents]);

        const drawArrow = (ctx, x, y, dx, dy, color, label) => {
            if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
            const toX = x + dx;
            const toY = y + dy;
            const a = Math.atan2(dy, dx);
            const hL = 8;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.moveTo(x, y);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - hL * Math.cos(a - Math.PI/6), toY - hL * Math.sin(a - Math.PI/6));
            ctx.lineTo(toX - hL * Math.cos(a + Math.PI/6), toY - hL * Math.sin(a + Math.PI/6));
            ctx.fill();
            
            ctx.fillStyle = color;
            ctx.font = 'bold 12px Inter';
            ctx.fillText(label, toX + 5, toY - 5);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                            <i data-lucide="car"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">彎道傾角實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Circular Motion
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto bg-slate-950 rounded-2xl" />
                            
                            <div className="absolute top-6 left-6 flex flex-col gap-3">
                                <div className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-white font-bold shadow-xl border ${status === 'safe' ? 'bg-emerald-600 border-emerald-400' : status === 'skid-out' ? 'bg-red-600 border-red-400 animate-pulse' : 'bg-orange-600 border-orange-400 animate-bounce'}`}>
                                    <i data-lucide={status === 'safe' ? 'check-circle' : 'alert-triangle'}></i>
                                    {status === 'safe' ? '安全轉彎' : status === 'skid-out' ? '向外側滑 (過快)' : '向內下滑 (過慢)'}
                                </div>
                            </div>

                            <div className="absolute top-6 right-6 bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 backdrop-blur-md shadow-2xl">
                                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">理想無摩擦速率</div>
                                <div className="text-2xl font-black text-emerald-400 font-mono">{idealSpeed.toFixed(1)} <span className="text-xs font-medium">m/s</span></div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="space-y-6">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><span>車輛速度 (v)</span><span className="text-white font-mono">{velocity} m/s</span></label>
                                    <input type="range" min="0" max="50" step="1" value={velocity} onChange={(e) => setVelocity(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-3"><span>轉彎半徑 (r)</span><span className="text-white font-mono">{radius} m</span></label>
                                    <input type="range" min="20" max="100" step="5" value={radius} onChange={(e) => setRadius(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-orange-400 uppercase tracking-widest mb-3"><span>路面傾角 (θ)</span><span className="text-white font-mono">{angle}°</span></label>
                                    <input type="range" min="0" max="45" step="1" value={angle} onChange={(e) => setAngle(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-orange" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-emerald-400 uppercase tracking-widest mb-3"><span>摩擦係數 (μ)</span><span className="text-white font-mono">{mu.toFixed(2)}</span></label>
                                    <input type="range" min="0" max="1.0" step="0.05" value={mu} onChange={(e) => setMu(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-emerald" />
                                </div>
                            </div>

                            <div className="md:col-span-2 flex gap-4 border-t border-slate-700 pt-6">
                                <label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl bg-slate-950/50 hover:bg-slate-700 transition-colors border border-slate-700">
                                    <input type="checkbox" checked={showVectors} onChange={() => setShowVectors(!showVectors)} className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0 cursor-pointer" />
                                    <span className="text-sm font-bold text-slate-300 uppercase">顯示受力向量</span>
                                </label>
                                <label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl bg-slate-950/50 hover:bg-slate-700 transition-colors border border-slate-700">
                                    <input type="checkbox" checked={showComponents} onChange={() => setShowComponents(!showComponents)} className="w-5 h-5 rounded border-slate-500 text-indigo-600 focus:ring-0 cursor-pointer" />
                                    <span className="text-sm font-bold text-slate-300 uppercase">顯示所需向心力</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="shield-check" className="text-indigo-400"></i> 安全速率區間
                            </h2>
                            
                            <div className="space-y-6">
                                <div>
                                    <div className="flex justify-between text-[10px] text-slate-500 font-bold uppercase mb-2">安全速率範圍</div>
                                    <div className="relative h-6 bg-slate-950 rounded-full border border-slate-700 overflow-hidden shadow-inner">
                                        <div className="absolute inset-0 bg-red-900/20"></div>
                                        <div 
                                            className="absolute top-0 bottom-0 bg-emerald-500/30 border-x border-emerald-500/50"
                                            style={{
                                                left: `${(minSpeed / 60) * 100}%`,
                                                right: `${100 - (maxSpeed / 60) * 100}%`
                                            }}
                                        ></div>
                                        <div 
                                            className="absolute top-0 bottom-0 w-1 bg-white shadow-[0_0_10px_white] transition-all duration-300"
                                            style={{ left: `${(velocity / 60) * 100}%` }}
                                        ></div>
                                    </div>
                                    <div className="flex justify-between mt-2 font-mono text-[10px] font-bold text-slate-400">
                                        <span>下限: {minSpeed.toFixed(1)} m/s</span>
                                        <span>上限: {maxSpeed === Infinity ? '∞' : maxSpeed.toFixed(1) + ' m/s'}</span>
                                    </div>
                                </div>

                                <div className="p-5 rounded-2xl bg-indigo-900/10 border border-indigo-500/20">
                                    <h4 className="text-indigo-400 font-bold text-xs uppercase mb-3">摩擦力的角色</h4>
                                    <p className="text-xs text-slate-400 leading-relaxed italic">
                                        {velocity > idealSpeed 
                                            ? "車速超過理想值：摩擦力「向下」沿斜面作用，幫助向心力防止外滑。" 
                                            : velocity < idealSpeed 
                                                ? "車速低於理想值：摩擦力「向上」沿斜面作用，防止車輛向內滑落。"
                                                : "車速剛好：不需要摩擦力，僅靠正向力的水平分量即可提供向心力。"}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-inner">
                            <h3 className="text-slate-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase">
                                <i data-lucide="lightbulb" className="w-4 h-4 text-yellow-400"></i> DSE 考點提醒
                            </h3>
                            <p className="text-xs text-slate-500 leading-relaxed">
                                在無摩擦的理想彎道中，公式為 <b>tan θ = v² / rg</b>。這代表轉彎角度與車輛質量無關。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
