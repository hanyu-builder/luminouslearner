<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波耳原子模型與光譜實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { touch-action: none; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 550;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    // 物理常數
    const RH = 13.6; // 氫原子能階單位 (eV)
    
    // 電子軌道 (n=1 to 6)
    const ORBITS = [
        { n: 1, r: 40, label: "基態 (n=1)" },
        { n: 2, r: 80, label: "n=2" },
        { n: 3, r: 120, label: "n=3" },
        { n: 4, r: 160, label: "n=4" },
        { n: 5, r: 200, label: "n=5" },
        { n: 6, r: 240, label: "n=6" },
    ];

    const App = () => {
        const [currentN, setCurrentN] = useState(1);
        const [targetN, setTargetN] = useState(null);
        const [lastEmission, setLastEmission] = useState(null); 
        
        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        const animRef = useRef({
            angle: 0,
            radius: ORBITS[0].r,
            photon: null, 
            transitionProgress: 0, 
            isTransitioning: false
        });

        // 計算躍遷能量與波長
        const calculateTransition = (nHigh, nLow) => {
            const E_low = -RH / (nLow * nLow);
            const E_high = -RH / (nHigh * nHigh);
            const dE = E_high - E_low; 
            const wl = 1240 / dE; // 波長 (nm)
            
            let series = "未知";
            if (nLow === 1) series = "萊曼系 (紫外光)";
            else if (nLow === 2) series = "巴耳末系 (可見光)";
            else if (nLow === 3) series = "帕申系 (紅外光)";
            else series = "其他系 (紅外光)";

            return { dE, wl, series, color: getWavelengthColor(wl) };
        };

        const jumpTo = (n) => {
            if (n === currentN || animRef.current.isTransitioning) return;
            
            setTargetN(n);
            animRef.current.isTransitioning = true;
            animRef.current.transitionProgress = 0;

            if (n < currentN) {
                // 發射 (向下躍遷)
                const data = calculateTransition(currentN, n);
                setLastEmission(data);
                animRef.current.photon = {
                    dist: 0,
                    angle: Math.random() * Math.PI * 2,
                    color: data.color,
                    type: 'emit',
                    active: true,
                    wl: data.wl 
                };
            } else {
                // 吸收 (向上躍遷)
                setLastEmission(null);
            }
        };

        const loop = () => {
            updatePhysics();
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const updatePhysics = () => {
            const state = animRef.current;
            const speed = 0.05 / Math.sqrt(targetN || currentN); 
            state.angle += speed;

            if (state.isTransitioning && targetN) {
                state.transitionProgress += 0.05;
                const rStart = ORBITS[currentN - 1].r;
                const rEnd = ORBITS[targetN - 1].r;
                
                if (state.transitionProgress >= 1) {
                    state.radius = rEnd;
                    state.isTransitioning = false;
                    setCurrentN(targetN);
                    setTargetN(null);
                } else {
                    const t = state.transitionProgress;
                    const smoothT = t * t * (3 - 2 * t);
                    state.radius = rStart + (rEnd - rStart) * smoothT;
                }
            } else {
                state.radius = ORBITS[currentN - 1].r;
            }

            if (state.photon && state.photon.active) {
                state.photon.dist += 5; 
                if (state.photon.dist > 600) state.photon.active = false;
            }
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const state = animRef.current;

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 軌道
            ORBITS.forEach(orbit => {
                ctx.beginPath();
                ctx.arc(CENTER_X, CENTER_Y, orbit.r, 0, Math.PI * 2);
                ctx.lineWidth = 1;
                ctx.strokeStyle = (orbit.n === currentN || orbit.n === targetN) 
                    ? 'rgba(255, 255, 255, 0.5)' 
                    : 'rgba(255, 255, 255, 0.1)';
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.font = '10px sans-serif';
                ctx.fillText(`n=${orbit.n}`, CENTER_X + 5, CENTER_Y - orbit.r - 2);
            });

            // 2. 原子核
            const grad = ctx.createRadialGradient(CENTER_X, CENTER_Y, 2, CENTER_X, CENTER_Y, 15);
            grad.addColorStop(0, '#ef4444'); grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(CENTER_X, CENTER_Y, 15, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'center';
            ctx.fillText("p+", CENTER_X, CENTER_Y + 4);

            // 3. 電子
            const ex = CENTER_X + Math.cos(state.angle) * state.radius;
            const ey = CENTER_Y + Math.sin(state.angle) * state.radius;
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // 4. 光子 (波動包)
            if (state.photon && state.photon.active) {
                const p = state.photon;
                ctx.save();
                ctx.translate(CENTER_X, CENTER_Y);
                ctx.rotate(p.angle);
                ctx.beginPath();
                ctx.strokeStyle = p.color; ctx.lineWidth = 3;
                const waveLen = 20; 
                for (let x = p.dist - 50; x < p.dist; x+=2) {
                    if (x < 0) continue;
                    const y = Math.sin(x / waveLen * Math.PI * 2) * 6;
                    if (x === p.dist - 50) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.restore();
            }
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [currentN, targetN]);

        function getWavelengthColor(wl) {
            if (wl < 380) return "#a855f7"; 
            if (wl >= 380 && wl < 450) return "#6366f1"; 
            if (wl >= 450 && wl < 495) return "#3b82f6"; 
            if (wl >= 495 && wl < 570) return "#22c55e"; 
            if (wl >= 570 && wl < 590) return "#eab308"; 
            if (wl >= 590 && wl < 620) return "#f97316"; 
            if (wl >= 620 && wl < 750) return "#ef4444"; 
            return "#475569"; 
        }

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col">
                <nav className="bg-slate-800 border-b border-slate-700 px-4 py-2 flex items-center justify-between shrink-0 h-14 z-10 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-500/20 p-1.5 rounded-lg">
                            <i data-lucide="orbit" className="w-5 h-5 text-purple-400"></i>
                        </div>
                        <h1 className="text-lg font-bold text-white tracking-wide">波耳模型與能階光譜</h1>
                    </div>
                    <div className="text-[10px] text-slate-400 font-mono bg-slate-950 px-2 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Atomic Physics
                    </div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-4">
                        <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-4 left-4 bg-slate-900/60 backdrop-blur-md px-3 py-1.5 rounded-lg border border-slate-700 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                氫原子模型 (Z=1)
                            </div>
                        </div>

                        <div className="lg:col-span-1 bg-slate-900 flex flex-col h-full overflow-y-auto custom-scroll border-l border-slate-800">
                            <div className="p-6 border-b border-slate-800">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                                    <i data-lucide="zap" className="w-4 h-4 text-purple-400"></i> 能階跳變控制
                                </h3>
                                <div className="grid grid-cols-3 gap-3">
                                    {[1, 2, 3, 4, 5, 6].map(n => (
                                        <button
                                            key={n}
                                            onClick={() => jumpTo(n)}
                                            disabled={currentN === n || targetN !== null}
                                            className={`py-3 rounded-xl border text-sm font-black transition-all
                                                ${currentN === n 
                                                    ? 'bg-purple-600 border-purple-400 text-white shadow-[0_0_15px_rgba(147,51,234,0.4)]' 
                                                    : 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-400'}
                                                ${(currentN === n || targetN !== null) ? 'opacity-50 cursor-not-allowed' : 'active:scale-90'}`}
                                        >
                                            n = {n}
                                        </button>
                                    ))}
                                </div>
                                <p className="text-[10px] text-slate-500 mt-4 leading-relaxed italic">
                                    * 點擊能階數字。向下躍遷發射光子，向上躍遷需吸收能量。
                                </p>
                            </div>

                            <div className="p-6 border-b border-slate-800 flex-1">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                                    <i data-lucide="barcode" className="w-4 h-4 text-emerald-400"></i> 偵測到的光子數據
                                </h3>

                                {lastEmission ? (
                                    <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner animate-in fade-in zoom-in duration-300">
                                        <div className="flex justify-between items-center mb-6">
                                            <div className="w-12 h-12 rounded-full shadow-2xl border-2 border-white/10" style={{backgroundColor: lastEmission.color, boxShadow: `0 0 25px ${lastEmission.color}`}}></div>
                                            <div className="text-right">
                                                <div className="text-3xl font-black text-white font-mono">{lastEmission.wl.toFixed(1)} <span className="text-xs text-slate-600">nm</span></div>
                                                <div className="text-[10px] font-bold text-indigo-400 uppercase tracking-tighter">{lastEmission.series}</div>
                                            </div>
                                        </div>
                                        <div className="space-y-4 font-mono">
                                            <div className="flex justify-between text-xs border-b border-slate-800 pb-2">
                                                <span className="text-slate-500">能量差 (ΔE)</span>
                                                <span className="text-emerald-400 font-bold">{lastEmission.dE.toFixed(2)} eV</span>
                                            </div>
                                            <div className="flex justify-between text-xs">
                                                <span className="text-slate-500">頻率 (f)</span>
                                                <span className="text-blue-400 font-bold">{(300000/lastEmission.wl).toFixed(1)} THz</span>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-slate-950/50 rounded-2xl p-8 border border-dashed border-slate-800 text-center text-xs text-slate-600 italic">
                                        尚未偵測到發射光子。<br/>請嘗試從高能階跳回低能階。
                                    </div>
                                )}
                            </div>

                            <div className="p-6 bg-slate-950 mt-auto">
                                <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center justify-between">
                                    可見光譜 (巴耳末系) <span>380-750nm</span>
                                </h3>
                                <div className="h-10 w-full rounded-lg bg-black relative border border-slate-800 overflow-hidden shadow-inner">
                                    <div className="absolute inset-0 opacity-20 pointer-events-none" style={{background: 'linear-gradient(to right, #4b0082, #0000ff, #00ff00, #ffff00, #ff0000)'}}></div>
                                    {lastEmission && lastEmission.wl >= 380 && lastEmission.wl <= 750 && (
                                        <div 
                                            className="absolute top-0 bottom-0 w-1.5 bg-white shadow-[0_0_15px_white] transition-all duration-700"
                                            style={{
                                                left: `${((lastEmission.wl - 380) / (750 - 380)) * 100}%`,
                                                backgroundColor: lastEmission.color,
                                                boxShadow: `0 0 10px ${lastEmission.color}`
                                            }}
                                        ></div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
