<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動量守恆：爆炸模型實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-red::-webkit-slider-thumb { border-color: #ef4444; }
        .thumb-purple::-webkit-slider-thumb { border-color: #a855f7; }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 350;
    const TRACK_Y = 200;
    const PIXELS_PER_METER = 50;
    const CART_WIDTH = 60;

    const App = () => {
        // --- 狀態 ---
        const [mA, setMA] = useState(2.0); // kg
        const [mB, setMB] = useState(1.0); // kg
        const [impulse, setImpulse] = useState(10); // Ns (爆炸強度)
        
        const [simState, setSimState] = useState('ready'); // ready, exploding, moving, finished
        const [simSpeed, setSimSpeed] = useState(1.0);
        
        const [velA, setVelA] = useState(0);
        const [velB, setVelB] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        const physicsRef = useRef({ 
            xA: 400 - CART_WIDTH/2 - 2, 
            vA: 0, 
            xB: 400 + CART_WIDTH/2 + 2, 
            vB: 0,
            explosionProgress: 0 
        });

        // --- 邏輯 ---
        const resetSim = () => {
            setSimState('ready');
            cancelAnimationFrame(requestRef.current);
            physicsRef.current = {
                xA: 400 - CART_WIDTH/2 - 2,
                vA: 0,
                xB: 400 + CART_WIDTH/2 + 2,
                vB: 0,
                explosionProgress: 0
            };
            setVelA(0);
            setVelB(0);
            draw();
        };

        const startExplosion = () => {
            if (simState !== 'ready') return;
            setSimState('exploding');
            
            let frame = 0;
            const animateExplosion = () => {
                frame++;
                physicsRef.current.explosionProgress = frame / 20;
                draw();
                if (frame < 20) {
                    requestRef.current = requestAnimationFrame(animateExplosion);
                } else {
                    calculatePhysics();
                    setSimState('moving');
                    loop();
                }
            };
            requestRef.current = requestAnimationFrame(animateExplosion);
        };

        const calculatePhysics = () => {
            // 動量守恆：P_initial = 0 -> mA*vA + mB*vB = 0
            // 衝量 J = mA*|vA| = mB*|vB|
            const vA = -impulse / mA;
            const vB = impulse / mB;
            
            physicsRef.current.vA = vA * PIXELS_PER_METER;
            physicsRef.current.vB = vB * PIXELS_PER_METER;
            
            setVelA(vA);
            setVelB(vB);
        };

        const loop = () => {
            const state = physicsRef.current;
            const dt = 0.016 * simSpeed;

            state.xA += state.vA * dt;
            state.xB += state.vB * dt;

            if (state.xA < 0 || state.xB > CANVAS_WIDTH) {
                setSimState('finished');
                draw();
                return;
            }

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 繪圖 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 軌道
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, TRACK_Y + 25, CANVAS_WIDTH, 12);
            ctx.fillStyle = '#334155';
            for (let x=0; x<=CANVAS_WIDTH; x+=50) ctx.fillRect(x, TRACK_Y + 25, 2, 12);
            ctx.fillStyle = '#ef4444'; ctx.fillRect(400-1, TRACK_Y + 25, 2, 20);

            // 2. 爆炸效果
            if (simState === 'exploding') {
                const p = physicsRef.current.explosionProgress;
                ctx.save(); ctx.translate(400, TRACK_Y); ctx.scale(p*2, p*2);
                ctx.globalAlpha = 1 - p;
                ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            // 3. 繪製滑車
            const drawCart = (x, mass, color, label, velocity) => {
                const y = TRACK_Y - 25;
                const w = CART_WIDTH;
                const h = 50;
                ctx.fillStyle = '#020617';
                ctx.beginPath(); ctx.arc(x - 18, y + 25, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 18, y + 25, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.roundRect(x - w/2, y - h/2, w, h, 6); ctx.fill();
                ctx.fillStyle = 'white'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`${mass}kg`, x, y + 5);
                ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 10px Inter';
                ctx.fillText(label, x, y - 15);

                if (Math.abs(velocity) > 0.1) {
                    const arrowLen = velocity * 15;
                    ctx.beginPath(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.moveTo(x, y - 35); ctx.lineTo(x + arrowLen, y - 35); ctx.stroke();
                }
            };

            const state = physicsRef.current;
            drawCart(state.xA, mA, '#3b82f6', '滑車 A', simState === 'ready' ? 0 : velA);
            drawCart(state.xB, mB, '#ef4444', '滑車 B', simState === 'ready' ? 0 : velB);

            // 4. 彈簧 (準備中)
            if (simState === 'ready') {
                const sx = state.xA + CART_WIDTH/2, ex = state.xB - CART_WIDTH/2;
                ctx.beginPath(); ctx.moveTo(sx, TRACK_Y - 25);
                const coils = 6; const step = (ex - sx) / coils;
                for(let i=0; i<=coils; i++) ctx.lineTo(sx + step*i, TRACK_Y - 25 + (i%2==0 ? 6 : -6));
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.stroke();
            }
        };

        useEffect(() => { resetSim(); }, [mA, mB, impulse]);
        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-500/20 p-2 rounded-lg text-purple-400">
                            <i data-lucide="bomb"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">動量守恆：爆炸模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Momentum Conservation
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[400px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 left-6 flex gap-4">
                                <div className="bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                                    <div className="text-[10px] text-blue-400 font-bold uppercase mb-1 tracking-tighter">滑車 A 動量</div>
                                    <div className="text-xl font-mono text-white">{(mA * velA).toFixed(2)} <span className="text-[10px] text-slate-500">kg&middot;m/s</span></div>
                                </div>
                                <div className="bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                                    <div className="text-[10px] text-red-400 font-bold uppercase mb-1 tracking-tighter">滑車 B 動量</div>
                                    <div className="text-xl font-mono text-white">{(mB * velB).toFixed(2)} <span className="text-[10px] text-slate-500">kg&middot;m/s</span></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-2"><span>滑車 A 質量</span><span className="text-white font-mono">{mA} kg</span></label>
                                <input type="range" min="0.5" max="10" step="0.5" value={mA} onChange={(e)=>setMA(Number(e.target.value))} disabled={simState !== 'ready'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                            </div>
                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-red-400 uppercase tracking-widest mb-2"><span>滑車 B 質量</span><span className="text-white font-mono">{mB} kg</span></label>
                                <input type="range" min="0.5" max="10" step="0.5" value={mB} onChange={(e)=>setMB(Number(e.target.value))} disabled={simState !== 'ready'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" />
                            </div>
                            <div className="space-y-4">
                                <label className="flex justify-between text-xs font-bold text-purple-400 uppercase tracking-widest mb-2"><span>爆炸衝量 (J)</span><span className="text-white font-mono">{impulse} Ns</span></label>
                                <input type="range" min="5" max="30" step="1" value={impulse} onChange={(e)=>setImpulse(Number(e.target.value))} disabled={simState !== 'ready'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-purple" />
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="activity" className="text-indigo-400"></i> 動量守恆分析</h2>
                            <div className="p-6 rounded-2xl bg-slate-950 border border-slate-700 text-center shadow-inner">
                                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">系統總動量 (Total P)</div>
                                <div className={`text-4xl font-black font-mono ${(mA*velA + mB*velB).toFixed(2) === "0.00" ? 'text-emerald-400' : 'text-white'}`}>
                                    {(mA * velA + mB * velB).toFixed(2)}
                                </div>
                                <div className="text-[9px] text-emerald-500 mt-2 font-bold uppercase tracking-tighter italic flex items-center justify-center gap-1">
                                    <i data-lucide="check-circle" className="w-3 h-3"></i> 守恆定律驗證成功
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={startExplosion} disabled={simState !== 'ready'} className={`py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg ${simState === 'ready' ? 'bg-purple-600 hover:bg-purple-500 text-white' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}>
                                    <i data-lucide="zap"></i> 啟動爆炸
                                </button>
                                <button onClick={resetSim} className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all"><i data-lucide="rotate-ccw"></i></button>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理考點</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                根據<b>動量守恆定律</b>，由於系統初始總動量為零，且爆炸力屬於內力。因此，兩車彈開後的動量大小必然相等、方向相反，使得總動量始終維持為零。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
