<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>右手定則實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: move; }
        .tab-btn { transition: all 0.2s ease; }
        .tab-active { background: #4f46e5; color: white; border-color: #6366f1; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
        // --- 狀態管理 ---
        const [mode, setMode] = useState('wire'); // 'wire' 直導線 或 'solenoid' 螺線管
        const [currentDirection, setCurrentDirection] = useState(1); // 1 (向上/向右) 或 -1 (向下/向左)
        const [showHand, setShowHand] = useState(true);
        const [showField, setShowField] = useState(true);

        const mountRef = useRef(null);
        const sceneRef = useRef(null);
        const cameraRef = useRef(null);
        const rendererRef = useRef(null);
        const animationRef = useRef();

        // --- Three.js 初始化 ---
        useEffect(() => {
            const mount = mountRef.current;
            const width = mount.clientWidth;
            const height = mount.clientHeight;

            // 場景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.Fog(0x020617, 15, 60);
            sceneRef.current = scene;

            // 相機
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.set(8, 6, 12);
            camera.lookAt(0, 0, 0);
            cameraRef.current = camera;

            // 渲染器
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            mount.appendChild(renderer.domElement);
            rendererRef.current = renderer;

            // 燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // 簡易軌道控制實作
            let isDragging = false;
            let prevMouse = { x: 0, y: 0 };
            const onDown = () => { isDragging = true; };
            const onUp = () => { isDragging = false; };
            const onMove = (e) => {
                if (!isDragging) return;
                const delta = { x: e.offsetX - prevMouse.x, y: e.offsetY - prevMouse.y };
                const radius = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / radius);
                theta -= delta.x * 0.01;
                phi -= delta.y * 0.01;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
                camera.position.x = radius * Math.sin(phi) * Math.sin(theta);
                camera.position.y = radius * Math.cos(phi);
                camera.position.z = radius * Math.sin(phi) * Math.cos(theta);
                camera.lookAt(0, 0, 0);
                prevMouse = { x: e.offsetX, y: e.offsetY };
            };
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', onDown);
            window.addEventListener('mouseup', onUp);
            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) onMove(e);
                prevMouse = { x: e.offsetX, y: e.offsetY };
            });

            // 啟動動畫
            const animate = () => {
                animationRef.current = requestAnimationFrame(animate);
                renderer.render(scene, camera);
            };
            animate();

            // 響應式尺寸
            const handleResize = () => {
                const w = mount.clientWidth, h = mount.clientHeight;
                camera.aspect = w / h; camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            };
            window.addEventListener('resize', handleResize);

            return () => {
                cancelAnimationFrame(animationRef.current);
                window.removeEventListener('resize', handleResize);
                if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
            };
        }, []);

        // --- 場景物件構建 ---
        const refreshScene = () => {
            const scene = sceneRef.current;
            if (!scene) return;
            // 清除現有物件（保留燈光）
            const toRemove = scene.children.filter(obj => obj.type === 'Mesh' || obj.type === 'Group' || obj.type === 'Line' || obj instanceof THREE.ArrowHelper);
            toRemove.forEach(obj => scene.remove(obj));

            if (mode === 'wire') buildWire(scene); else buildSolenoid(scene);
        };

        const buildWire = (scene) => {
            // 導線
            const wireGeo = new THREE.CylinderGeometry(0.15, 0.15, 10, 16);
            const wireMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
            const wire = new THREE.Mesh(wireGeo, wireMat);
            scene.add(wire);

            // 電流箭頭
            const iDir = new THREE.Vector3(0, currentDirection, 0);
            const iPos = new THREE.Vector3(0, -currentDirection * 3, 0);
            scene.add(new THREE.ArrowHelper(iDir, iPos, 3, 0xffffff, 0.8, 0.4));

            // 磁場線
            if (showField) {
                [1.8, 3.2, 4.6].forEach(r => {
                    const ringGeo = new THREE.TorusGeometry(r, 0.03, 16, 100);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.6 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    scene.add(ring);

                    // 旋轉箭頭
                    for(let i=0; i<4; i++) {
                        const ang = (i/4) * Math.PI * 2;
                        const x = Math.cos(ang) * r, z = Math.sin(ang) * r;
                        const dX = -Math.sin(ang) * currentDirection, dZ = Math.cos(ang) * currentDirection;
                        scene.add(new THREE.ArrowHelper(new THREE.Vector3(dX, 0, dZ), new THREE.Vector3(x, 0, z), 0.6, 0x3b82f6, 0.3, 0.2));
                    }
                });
            }

            // 手部輔助
            if (showHand) {
                const hand = new THREE.Group();
                const skinMat = new THREE.MeshStandardMaterial({ color: 0xfca5a5 });
                // 拇指 (電流方向)
                const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 12), skinMat);
                thumb.position.y = currentDirection * 1;
                if (currentDirection === -1) thumb.rotation.x = Math.PI;
                hand.add(thumb);
                // 四指 (磁場方向)
                const fingers = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.35, 12, 16, Math.PI), skinMat);
                fingers.rotation.x = Math.PI / 2; fingers.rotation.y = Math.PI;
                hand.add(fingers);
                hand.position.set(0.6, 0, 0);
                scene.add(hand);
            }
        };

        const buildSolenoid = (scene) => {
            const r = 2.2, len = 8, turns = 10;
            const curve = new THREE.Curve();
            curve.getPoint = (t) => {
                const a = t * turns * 2 * Math.PI;
                return new THREE.Vector3((t-0.5)*len, Math.cos(a)*r, Math.sin(a)*r);
            };
            const coil = new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.12, 8, false), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
            scene.add(coil);

            // 電流標示
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(currentDirection, 0, 0), new THREE.Vector3(-len/2 - 1.5, 0, 0), 1.5, 0xffffff));

            // 磁場線
            if (showField) {
                const bDir = new THREE.Vector3(currentDirection, 0, 0);
                const bMain = new THREE.ArrowHelper(bDir, new THREE.Vector3(-len/2 - 2, 0, 0), len + 4, 0x3b82f6, 1.2, 0.6);
                scene.add(bMain);
                for(let dy of [-1.2, 1.2]) {
                    scene.add(new THREE.ArrowHelper(bDir, new THREE.Vector3(-len/2, dy, 0), len, 0x3b82f6, 0.6, 0.3));
                }
                // 標註 N 極
                const nX = currentDirection === 1 ? len/2 + 2 : -len/2 - 3;
                const labelGroup = new THREE.Group();
                scene.add(labelGroup); // 佔位
            }

            // 手部輔助
            if (showHand) {
                const hand = new THREE.Group();
                const skinMat = new THREE.MeshStandardMaterial({ color: 0xfca5a5 });
                // 拇指 (磁極方向)
                const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2.5, 12), skinMat);
                thumb.rotation.z = -Math.PI / 2 * currentDirection;
                thumb.position.x = currentDirection * 1.2;
                hand.add(thumb);
                // 四指 (繞組電流方向)
                const fingers = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.45, 12, 16, Math.PI * 1.5), skinMat);
                fingers.rotation.y = Math.PI / 2;
                hand.add(fingers);
                hand.position.y = 2.8;
                scene.add(hand);
            }
        };

        useEffect(() => { refreshScene(); }, [mode, currentDirection, showHand, showField]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-cyan-500/20 p-2 rounded-lg text-cyan-400"><i data-lucide="hand"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">右手定則 3D 實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Electromagnetism</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[550px]" ref={mountRef}>
                            <div className="absolute top-6 left-6 flex gap-3">
                                <button onClick={() => setMode('wire')} className={`px-5 py-2.5 rounded-xl text-xs font-bold border transition-all ${mode==='wire' ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>長直導線</button>
                                <button onClick={() => setMode('solenoid')} className={`px-5 py-2.5 rounded-xl text-xs font-bold border transition-all ${mode==='solenoid' ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>螺線管</button>
                            </div>
                            <div className="absolute bottom-6 left-6 bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 text-xs text-slate-400 backdrop-blur-md pointer-events-none flex items-center gap-2">
                                <i data-lucide="mouse-pointer-2" className="text-cyan-400"></i> 滑鼠左鍵拖動以<b>旋轉視角</b>，觀察 3D 空間關係。
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="settings-2" className="text-cyan-400"></i> 參數控制
                            </h2>

                            <div className="space-y-4">
                                <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest block">電流方向 (I)</label>
                                <button 
                                    onClick={() => setCurrentDirection(d => d * -1)}
                                    className={`w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg ${currentDirection === 1 ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20' : 'bg-rose-600 hover:bg-rose-500 text-white shadow-rose-900/20'}`}
                                >
                                    <i data-lucide={currentDirection === 1 ? "arrow-up" : "arrow-down"}></i>
                                    {currentDirection === 1 ? (mode === 'wire' ? "向上" : "向右") : (mode === 'wire' ? "向下" : "向左")}
                                </button>
                            </div>

                            <div className="space-y-3">
                                <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">顯示引導手勢</span>
                                    <input type="checkbox" checked={showHand} onChange={() => setShowHand(!showHand)} className="w-5 h-5 rounded border-slate-600 text-cyan-600 focus:ring-0 cursor-pointer" />
                                </label>
                                <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">顯示感應磁場</span>
                                    <input type="checkbox" checked={showField} onChange={() => setShowField(!showField)} className="w-5 h-5 rounded border-slate-600 text-blue-600 focus:ring-0 cursor-pointer" />
                                </label>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 操作口訣</h3>
                            {mode === 'wire' ? (
                                <div className="text-xs text-slate-400 leading-relaxed space-y-3">
                                    <p><b>長直導線：</b></p>
                                    <p>1. 伸出右手，<b>大拇指</b> 指向電流 ($I$) 方向。</p>
                                    <p>2. <b>其餘四指</b> 彎曲的方向即為磁場線 ($B$) 的旋轉方向。</p>
                                </div>
                            ) : (
                                <div className="text-xs text-slate-400 leading-relaxed space-y-3">
                                    <p><b>螺線管 (電磁鐵)：</b></p>
                                    <p>1. 伸出右手，<b>四指順著線圈電流</b> 方向彎曲。</p>
                                    <p>2. <b>大拇指</b> 所指的方向即為螺線管內部的磁場方向（指向 <b>N 極</b>）。</p>
                                </div>
                            )}
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
