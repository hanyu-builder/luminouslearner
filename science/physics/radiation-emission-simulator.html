<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱輻射實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .glow-text { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 輔助函式：絕對溫度轉 RGB 顏色近似值 ---
    const kelvinToRgb = (k) => {
        let temp = k / 100;
        let r, g, b;

        if (temp <= 66) {
            r = 255;
            g = Math.max(0, Math.min(255, 99.4708025861 * Math.log(temp || 1) - 161.1195681661));
            b = temp <= 19 ? 0 : Math.max(0, Math.min(255, 138.5177312231 * Math.log(temp - 10) - 305.0447927307));
        } else {
            r = Math.max(0, Math.min(255, 329.698727446 * Math.pow(temp - 60, -0.1332047592)));
            g = Math.max(0, Math.min(255, 288.1221695283 * Math.pow(temp - 60, -0.0755148492)));
            b = 255;
        }

        return { r: Math.floor(r), g: Math.floor(g), b: Math.floor(b) };
    };

    // --- 輔助函式：普朗克定律計算 (Planck's Law) ---
    const planck = (wavelengthNm, tempK) => {
        const c1 = 3.7418e-16; 
        const c2 = 1.4388e-2;  
        const lambdaM = wavelengthNm * 1e-9;
        if (lambdaM === 0) return 0;
        return (c1 / Math.pow(lambdaM, 5)) / (Math.exp(c2 / (lambdaM * tempK)) - 1);
    };

    const App = () => {
        const [temperature, setTemperature] = useState(3000); 
        const canvasRef = useRef(null);
        
        // 衍生數據
        const peakWavelength = Math.round(2898000 / temperature); // 維恩定律
        const rgb = kelvinToRgb(temperature);
        const colorString = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        
        // 史蒂芬-波茲曼定律視覺縮放
        const maxSimTemp = 10000;
        const relativeIntensity = Math.pow(temperature / maxSimTemp, 4) * 100;
        const infraredRatio = temperature < 3000 ? 0.9 : Math.max(0.1, 1 - (temperature / 12000));

        // --- 繪製能譜圖 ---
        useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const { width, height } = canvas;

            ctx.clearRect(0, 0, width, height);

            // 背景網格
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<width; i+=50) { ctx.moveTo(i, 0); ctx.lineTo(i, height); }
            for(let i=0; i<height; i+=50) { ctx.moveTo(0, i); ctx.lineTo(width, i); }
            ctx.stroke();

            // 繪製可見光光譜區間
            const nmToX = (nm) => (nm / 3000) * width;
            const visStart = nmToX(380), visEnd = nmToX(750);
            
            const gradient = ctx.createLinearGradient(visStart, 0, visEnd, 0);
            gradient.addColorStop(0, 'rgba(100, 0, 255, 0.2)'); 
            gradient.addColorStop(0.2, 'rgba(0, 0, 255, 0.2)'); 
            gradient.addColorStop(0.4, 'rgba(0, 255, 0, 0.2)'); 
            gradient.addColorStop(0.6, 'rgba(255, 255, 0, 0.2)');
            gradient.addColorStop(0.8, 'rgba(255, 165, 0, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0.2)');   
            ctx.fillStyle = gradient;
            ctx.fillRect(visStart, 0, visEnd - visStart, height);

            // 區域標籤
            ctx.fillStyle = '#64748b'; ctx.font = 'bold 10px Inter';
            ctx.fillText('紫外線 (UV)', nmToX(100), 20);
            ctx.fillText('可見光區', nmToX(500), 20);
            ctx.fillText('紅外線 (IR)', nmToX(1500), 20);

            // 繪製普朗克曲線
            const peakIntensity = planck(peakWavelength, temperature);
            const scaleY = (height * 0.8) / peakIntensity;
            const xToNm = (x) => (x / width) * 3000;

            ctx.beginPath(); ctx.lineWidth = 3; ctx.strokeStyle = '#fcd34d';
            ctx.moveTo(0, height);
            for (let x = 0; x < width; x+=2) {
                const nm = xToNm(x);
                if (nm === 0) continue;
                const y = height - (planck(nm, temperature) * scaleY);
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 填滿曲線下方
            ctx.lineTo(width, height); ctx.lineTo(0, height);
            ctx.fillStyle = 'rgba(252, 211, 77, 0.1)'; ctx.fill();

            // 標註峰值點
            const peakX = nmToX(peakWavelength), peakY = height - (peakIntensity * scaleY);
            ctx.beginPath(); ctx.arc(peakX, peakY, 5, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.fillStyle = '#e2e8f0'; ctx.fillText(`λmax: ${peakWavelength} nm`, peakX + 10, peakY);
        }, [temperature, peakWavelength]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-500">
                            <i data-lucide="flame"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">熱輻射與普朗克曲線實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Quantum Physics (Blackbody)
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-8 shadow-xl space-y-8">
                            <h2 className="text-blue-400 font-bold flex items-center gap-2 text-lg uppercase tracking-wider">
                                <i data-lucide="thermometer"></i> 溫度控制面板
                            </h2>
                            <div>
                                <div className="flex justify-between items-end mb-4">
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">絕對溫度 (T)</label>
                                    <div className="text-right">
                                        <span className="text-4xl font-black text-white font-mono glow-text transition-colors duration-300" 
                                              style={{color: temperature > 6000 ? '#93c5fd' : temperature > 3500 ? '#ffffff' : '#fca5a5'}}>
                                            {temperature}
                                        </span>
                                        <span className="text-slate-500 ml-1 font-bold">K</span>
                                    </div>
                                </div>
                                <input 
                                    type="range" min="500" max="10000" step="50" 
                                    value={temperature} onChange={(e) => setTemperature(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" 
                                />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-3 font-bold">
                                    <span>500K</span>
                                    <span>太陽表面 (5800K)</span>
                                    <span>10000K</span>
                                </div>
                            </div>

                            <div className="space-y-4 pt-4 border-t border-slate-700">
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 flex justify-between items-center shadow-inner">
                                    <div>
                                        <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">峰值波長 (λmax)</div>
                                        <div className="text-xl font-black text-emerald-400 font-mono">{peakWavelength} <span className="text-xs">nm</span></div>
                                    </div>
                                    <div className="w-10 h-10 rounded-full border-2 border-white/20 shadow-lg transition-colors duration-300" style={{backgroundColor: colorString, boxShadow: `0 0 15px ${colorString}`}}></div>
                                </div>

                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-700 space-y-3">
                                    <div className="flex justify-between items-center">
                                        <div className="text-[10px] text-slate-500 font-bold uppercase flex items-center gap-1">
                                            <i data-lucide="waves" className="w-3 h-3 text-red-500"></i> 紅外線輻射強度
                                        </div>
                                        <div className="text-sm font-black text-red-400 font-mono">{(relativeIntensity * infraredRatio).toFixed(1)}</div>
                                    </div>
                                    <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-red-900 to-red-500 transition-all duration-300"
                                             style={{width: `${Math.min(100, (temperature/4000) * 35)}%`}}></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/30 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-400 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理考點提醒</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                根據<b>維恩定律</b>，溫度愈高，輻射能量的峰值波長會移向更短的波段（藍端）。這解釋了為什麼加熱金屬時，顏色會從暗紅變為黃白，最終呈現藍白。
                            </p>
                        </div>
                    </div>

                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-800 p-2 shadow-2xl relative overflow-hidden h-[280px] flex items-center justify-center">
                            <div className="absolute top-6 left-8 text-[10px] font-bold text-slate-500 uppercase tracking-widest border border-slate-800 px-2 py-1 rounded">可見光外觀 (Visible Color)</div>
                            <div className="w-36 h-36 rounded-full transition-all duration-300 relative shadow-2xl"
                                 style={{
                                     backgroundColor: temperature < 800 ? '#1a1a1a' : colorString,
                                     boxShadow: temperature > 800 
                                         ? `0 0 ${Math.min(120, (temperature - 800)/15)}px ${Math.min(25, (temperature - 800)/80)}px ${colorString}` 
                                         : 'none'
                                 }}>
                                {temperature > 1500 && <div className="absolute inset-0 rounded-full animate-pulse opacity-40 bg-white blur-2xl"></div>}
                            </div>
                            {temperature < 1000 && (
                                <div className="absolute bottom-6 text-[10px] font-bold text-red-400/60 uppercase tracking-tighter animate-pulse">
                                    物體正在釋放熱量，但肉眼無法察覺其光芒
                                </div>
                            )}
                        </div>

                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-6 flex flex-col shadow-xl flex-1 relative">
                            <div className="absolute top-6 left-8 text-[10px] font-bold text-slate-500 uppercase tracking-widest">普朗克能譜曲線圖</div>
                            <div className="flex-1 mt-6 relative">
                                <canvas ref={canvasRef} width={800} height={300} className="w-full h-full block bg-slate-950 rounded-2xl" />
                                <div className="absolute bottom-2 right-4 text-slate-500 text-[10px] font-mono tracking-widest">波長 (nm) →</div>
                                <div className="absolute top-2 left-4 text-slate-500 text-[10px] font-mono tracking-widest">強度 ↑</div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
