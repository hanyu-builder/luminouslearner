<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波義耳定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #a855f7; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 300;
    const CANVAS_HEIGHT = 400;
    const SYRINGE_WIDTH = 180;
    const SYRINGE_BOTTOM = 350;
    const PARTICLE_COUNT = 45;
    const CONSTANT_K = 2500; // P * V = 2500 (模擬比例)

    const App = () => {
        // --- 狀態 ---
        const [volume, setVolume] = useState(60); // 單位：mL (25 to 100)
        const [pressure, setPressure] = useState(CONSTANT_K / 60); 
        
        const canvasRef = useRef(null);
        const graphCanvasRef = useRef(null);
        const requestRef = useRef();
        const particlesRef = useRef([]);

        // 初始化分子質點
        useEffect(() => {
            const ps = [];
            for(let i=0; i<PARTICLE_COUNT; i++) {
                ps.push({
                    x: Math.random() * (SYRINGE_WIDTH - 20) + (CANVAS_WIDTH - SYRINGE_WIDTH) / 2 + 10,
                    y: Math.random() * 200 + 100,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5
                });
            }
            particlesRef.current = ps;
        }, []);

        // 當體積改變時更新壓力
        useEffect(() => {
            const newP = CONSTANT_K / volume;
            setPressure(newP);
        }, [volume]);

        // --- 物理循環 ---
        const updatePhysics = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const syringeHeight = (volume / 100) * 300;
            const pistonY = SYRINGE_BOTTOM - syringeHeight;
            const centerX = CANVAS_WIDTH / 2;
            const leftX = centerX - SYRINGE_WIDTH / 2;
            const rightX = centerX + SYRINGE_WIDTH / 2;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製注射器本體
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(leftX, pistonY, SYRINGE_WIDTH, syringeHeight);
            
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
            ctx.strokeRect(leftX, 50, SYRINGE_WIDTH, 300); // 玻璃外殼
            
            // 刻度
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
            ctx.textAlign = 'right'; ctx.font = '10px Inter'; ctx.fillStyle = '#64748b';
            for(let v = 20; v <= 100; v+=10) {
                const y = SYRINGE_BOTTOM - (v / 100) * 300;
                ctx.beginPath(); ctx.moveTo(leftX, y); ctx.lineTo(leftX + 12, y); ctx.stroke();
                ctx.fillText(`${v}mL`, leftX - 8, y + 3);
            }

            // 2. 繪製活塞 (Piston)
            ctx.fillStyle = '#334155'; // 橡膠頭
            ctx.fillRect(leftX + 2, pistonY - 20, SYRINGE_WIDTH - 4, 20);
            ctx.fillStyle = '#64748b'; // 金屬桿
            ctx.fillRect(centerX - 8, pistonY - 300, 16, 280);
            ctx.fillStyle = '#94a3b8'; // 把手
            ctx.fillRect(centerX - 40, pistonY - 300, 80, 10);

            // 3. 分子動力模擬
            // 壓力愈高，分子運動速度感增強 (視覺模擬)
            const speedBoost = 0.5 + (pressure / 100) * 1.5;

            ctx.fillStyle = '#a855f7';
            particlesRef.current.forEach(p => {
                p.x += p.vx * speedBoost;
                p.y += p.vy * speedBoost;

                // 邊界碰撞
                if (p.x < leftX + 6) { p.x = leftX + 6; p.vx *= -1; }
                if (p.x > rightX - 6) { p.x = rightX - 6; p.vx *= -1; }
                if (p.y > SYRINGE_BOTTOM - 6) { p.y = SYRINGE_BOTTOM - 6; p.vy *= -1; }
                if (p.y < pistonY + 6) { p.y = pistonY + 6; p.vy *= -1; }

                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                // 碰撞發光效果
                if (p.y < pistonY + 10) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.fill();
                    ctx.fillStyle = '#a855f7';
                }
            });

            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        // --- 繪製 P-V 圖表 ---
        const drawGraph = () => {
            const ctx = graphCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = 600, h = 350, pad = 50;
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, w, h);

            // 軸
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pad, 20); ctx.lineTo(pad, h-pad); ctx.lineTo(w-20, h-pad); ctx.stroke();
            
            // 標籤
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px Inter';
            ctx.fillText("體積 V (mL) →", w - 100, h - 15);
            ctx.save(); ctx.translate(15, h/2); ctx.rotate(-Math.PI/2);
            ctx.fillText("壓力 P (kPa)", 0, 0); ctx.restore();

            const mapX = (v) => pad + (v / 110) * (w - pad - 40);
            const mapY = (p) => h - pad - (p / 110) * (h - pad - 40);

            // 繪製理論雙曲線 (P = k/V)
            ctx.beginPath(); ctx.strokeStyle = '#475569'; ctx.setLineDash([5, 5]);
            for(let v = 15; v <= 110; v+=2) {
                const p = CONSTANT_K / v;
                if (p > 110) continue;
                const x = mapX(v); const y = mapY(p);
                if (v === 15 || p > 105) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke(); ctx.setLineDash([]);

            // 繪製當前點
            const cx = mapX(volume); const cy = mapY(pressure);
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.3)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pad, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, h-pad); ctx.stroke();
            
            ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(updatePhysics);
            return () => cancelAnimationFrame(requestRef.current);
        }, [volume, pressure]);

        useEffect(() => { drawGraph(); }, [volume, pressure]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-500/20 p-2 rounded-lg text-purple-400">
                            <i data-lucide="flask-conical"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">波義耳定律實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Gas Laws (Thermal Physics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    {/* 左側：注射器視覺化 */}
                    <div className="lg:col-span-5 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl flex flex-col items-center relative overflow-hidden">
                            <h2 className="text-purple-400 font-bold mb-8 w-full flex items-center gap-2">
                                <i data-lucide="microscope" className="w-5 h-5"></i> 實驗裝置模擬
                            </h2>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto max-w-[280px]" />
                            <p className="text-[10px] text-slate-500 mt-4 text-center italic">
                                * 質點代表氣體分子，運動速度反映碰撞頻率 (溫度維持恆定)
                            </p>
                        </div>
                    </div>

                    {/* 右側：數據、滑桿與圖表 */}
                    <div className="lg:col-span-7 space-y-6">
                        {/* 數據面板 */}
                        <div className="grid grid-cols-3 gap-4">
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center transition-all">
                                <div className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">體積 (V)</div>
                                <div className="text-3xl font-black text-white font-mono">{volume}<span className="text-sm ml-1 text-slate-500">mL</span></div>
                            </div>
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center transition-all border-b-4 border-b-purple-500">
                                <div className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">壓力 (P)</div>
                                <div className="text-3xl font-black text-purple-400 font-mono">{pressure.toFixed(1)}<span className="text-sm ml-1 text-slate-500">kPa</span></div>
                            </div>
                            <div className="bg-purple-900/10 p-5 rounded-2xl border border-purple-500/30 shadow-lg text-center">
                                <div className="text-purple-300 text-[10px] font-bold uppercase tracking-widest mb-1">P × V 定值</div>
                                <div className="text-3xl font-black text-white font-mono">{(pressure * volume).toFixed(0)}</div>
                                <div className="text-[9px] text-purple-500 font-bold mt-1">Isothermal</div>
                            </div>
                        </div>

                        {/* 控制滑桿 */}
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <div className="flex justify-between items-center mb-4">
                                <label className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                    <i data-lucide="move-vertical" className="w-4 h-4 text-purple-400"></i> 調節活塞位置 (體積)
                                </label>
                                <span className="bg-slate-950 px-3 py-1 rounded-full text-purple-400 font-mono font-bold">{volume} mL</span>
                            </div>
                            <input 
                                type="range" min="25" max="100" step="1"
                                value={volume}
                                onChange={(e) => setVolume(Number(e.target.value))}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"
                            />
                            <div className="flex justify-between mt-3 text-[10px] font-bold text-slate-500 uppercase tracking-tighter">
                                <span>壓縮 (高壓)</span>
                                <span>擴張 (低壓)</span>
                            </div>
                        </div>

                        {/* P-V 圖表 */}
                        <div className="bg-slate-800 p-1 rounded-3xl border border-slate-700 shadow-2xl relative overflow-hidden h-[300px]">
                            <canvas ref={graphCanvasRef} width={600} height={350} className="w-full h-full object-cover" />
                            <div className="absolute top-4 right-6 bg-slate-900/60 backdrop-blur-sm px-3 py-1 rounded-lg border border-slate-700 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                P-V 關係曲線圖
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
