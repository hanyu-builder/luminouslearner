<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庫侖定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-red::-webkit-slider-thumb { border-color: #ef4444; }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const K_CONST = 8.98755e9; // 庫侖常數
    const PIXELS_PER_METER = 2000; // 1m = 2000px (縮放比例)

    const App = () => {
        // --- 狀態 ---
        const [q1, setQ1] = useState(-4); // 微庫侖 (µC)
        const [q2, setQ2] = useState(8); 
        const [distanceCm, setDistanceCm] = useState(6); // 公分

        const [force, setForce] = useState(0); 
        const [isDragging, setIsDragging] = useState(false);
        const canvasRef = useRef(null);

        // --- 物理引擎 ---
        useEffect(() => {
            // F = k * |q1 * q2| / r^2
            const r_m = distanceCm / 100;
            const q1_c = q1 * 1e-6;
            const q2_c = q2 * 1e-6;
            const f = (K_CONST * Math.abs(q1_c * q2_c)) / (r_m * r_m);
            setForce(f);
        }, [q1, q2, distanceCm]);

        // --- 互動邏輯 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            const r_px = (distanceCm / 100) * PIXELS_PER_METER;
            const x2 = CENTER_X + r_px/2;
            
            // 檢查是否點擊在右側電荷附近
            if (Math.hypot(x - x2, y - CENTER_Y) < 40) {
                setIsDragging(true);
            }
        };

        const handleMouseMove = (e) => {
            if (!isDragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            
            let newDistPx = (x - CENTER_X) * 2;
            if (newDistPx < 60) newDistPx = 60; // 最小距離限制
            if (newDistPx > 600) newDistPx = 600; // 最大距離限制
            
            setDistanceCm((newDistPx / PIXELS_PER_METER) * 100);
        };

        const handleMouseUp = () => setIsDragging(false);

        // --- 渲染功能 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const r_px = (distanceCm / 100) * PIXELS_PER_METER;
            const x1 = CENTER_X - r_px / 2;
            const x2 = CENTER_X + r_px / 2;
            const cy = CENTER_Y;

            // 1. 繪製標尺
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x1, cy + 70); ctx.lineTo(x2, cy + 70); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x1, cy + 65); ctx.lineTo(x1, cy + 75); ctx.moveTo(x2, cy + 65); ctx.lineTo(x2, cy + 75); ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 13px JetBrains Mono'; ctx.textAlign = 'center';
            ctx.fillText(`距離 r = ${(distanceCm/100).toFixed(3)} m`, CENTER_X, cy + 95);

            // 2. 繪製電荷
            const drawCharge = (x, y, q, isDraggable) => {
                const radius = 28;
                const color = q > 0 ? '#ef4444' : q < 0 ? '#3b82f6' : '#64748b';
                
                // 發光效果
                const grad = ctx.createRadialGradient(x, y, 5, x, y, radius * 2.5);
                grad.addColorStop(0, q !== 0 ? (q > 0 ? 'rgba(239, 68, 68, 0.3)' : 'rgba(59, 130, 246, 0.3)') : 'transparent');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(x, y, radius * 2.5, 0, Math.PI*2); ctx.fill();

                // 本體
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();

                // 符號
                ctx.fillStyle = 'white'; ctx.font = 'bold 24px Inter'; ctx.textBaseline = 'middle';
                ctx.fillText(q > 0 ? '+' : q < 0 ? '-' : '0', x, y + 2);

                // 標籤
                ctx.font = 'bold 12px Inter'; ctx.fillStyle = color;
                ctx.fillText(`${q > 0 ? '+' : ''}${q} µC`, x, y - 45);

                if (isDraggable && isDragging) {
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(x, y, radius + 8, 0, Math.PI*2); ctx.stroke();
                    ctx.setLineDash([]);
                }
            };

            drawCharge(x1, cy, q1, false);
            drawCharge(x2, cy, q2, true);

            // 3. 繪製力向量 (F)
            if (force > 0.01 && q1 !== 0 && q2 !== 0) {
                const isRepelling = (q1 * q2) > 0;
                // 視覺長度映射 (對數縮放以處理巨大範圍)
                const arrowLen = Math.min(180, 45 + Math.log10(force + 1) * 35);
                
                const drawVec = (x, toRight) => {
                    const dir = toRight ? 1 : -1;
                    const sX = x + (dir * 32), eX = sX + (dir * arrowLen);
                    ctx.beginPath(); ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4;
                    ctx.moveTo(sX, cy); ctx.lineTo(eX, cy); ctx.stroke();
                    // 箭頭
                    ctx.beginPath(); ctx.fillStyle = '#facc15';
                    ctx.moveTo(eX, cy); ctx.lineTo(eX - (dir * 12), cy - 7); ctx.lineTo(eX - (dir * 12), cy + 7); ctx.fill();
                    ctx.font = 'black 14px Inter'; ctx.fillText('F', eX + (dir * 20), cy + 5);
                };

                if (isRepelling) { drawVec(x1, false); drawVec(x2, true); } // 排斥
                else { drawVec(x1, true); drawVec(x2, false); } // 吸引
            }
        }, [q1, q2, distanceCm, force, isDragging]);

        const formatSci = (num) => {
            if (num === 0) return "0";
            return num > 1000 || num < 0.1 ? num.toExponential(2) : num.toFixed(2);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-600/20 p-2 rounded-lg text-blue-400">
                            <i data-lucide="zap"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">庫侖定律力學實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Electrostatics (Force)
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[450px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-full object-contain cursor-ew-resize" />
                            <div className="absolute top-6 left-6 bg-slate-900/80 px-5 py-3 rounded-2xl border border-slate-700 text-xs text-slate-300 backdrop-blur-md pointer-events-none flex items-center gap-3">
                                <i data-lucide="mouse-pointer-2" className="text-blue-400"></i>
                                拖動<b>右側電荷</b>來改變距離 ($r$)
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="space-y-6">
                                <h3 className="text-blue-400 font-bold flex items-center gap-2 uppercase tracking-widest text-xs">
                                    <div className="w-2 h-2 rounded-full bg-blue-500"></div> 左側電荷量 ($q_1$)
                                </h3>
                                <input type="range" min="-10" max="10" step="1" value={q1} onChange={(e) => setQ1(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                <div className="flex justify-between font-mono text-[10px] text-slate-500"><span>-10 µC</span><span>0</span><span>+10 µC</span></div>
                            </div>
                            <div className="space-y-6">
                                <h3 className="text-red-400 font-bold flex items-center gap-2 uppercase tracking-widest text-xs">
                                    <div className="w-2 h-2 rounded-full bg-red-500"></div> 右側電荷量 ($q_2$)
                                </h3>
                                <input type="range" min="-10" max="10" step="1" value={q2} onChange={(e) => setQ2(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" />
                                <div className="flex justify-between font-mono text-[10px] text-slate-500"><span>-10 µC</span><span>0</span><span>+10 µC</span></div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="calculator" className="text-indigo-400"></i> 定量數據分析
                            </h2>
                            <div className="p-6 rounded-2xl bg-slate-950 border border-slate-700 text-center shadow-inner">
                                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">相互作用力 ($F$)</div>
                                <div className="text-4xl font-black text-yellow-400 font-mono tracking-tighter">
                                    {formatSci(force)} <span className="text-lg text-slate-600 font-medium">N</span>
                                </div>
                                <div className={`text-[10px] mt-3 font-bold uppercase tracking-widest ${q1*q2 > 0 ? 'text-orange-400' : q1*q2 < 0 ? 'text-blue-400' : 'text-slate-500'}`}>
                                    {q1*q2 > 0 ? "🏃 排斥力 (Repulsive)" : q1*q2 < 0 ? "🤝 吸引力 (Attractive)" : "無作用力"}
                                </div>
                            </div>
                            <div className="space-y-4 font-mono text-[11px]">
                                <div className="flex justify-between py-2 border-b border-slate-700/50 text-slate-400"><span>常數 $k$</span><span className="text-indigo-300">8.99 &times; 10⁹ N&middot;m²/C²</span></div>
                                <div className="flex justify-between py-2 border-b border-slate-700/50 text-slate-400"><span>距離 $r$</span><span className="text-white">{(distanceCm/100).toFixed(3)} m</span></div>
                                <div className="flex justify-between py-2 text-slate-400"><span>乘積 $|q_1 q_2|$</span><span className="text-white">{Math.abs(q1*q2).toFixed(0)} &times; 10⁻¹² C²</span></div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest">
                                <i data-lucide="lightbulb" className="w-4 h-4"></i> 平方反比規律
                            </h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                觀察當你將距離 $r$ 增加一倍時，力 $F$ 會如何變化？根據庫侖定律，力與距離的平方成反比。若距離變為 2 倍，力將減弱為原本的 <b>1/4</b>。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
