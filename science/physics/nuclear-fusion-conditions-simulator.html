<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核融合實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .digital-font { font-family: 'Orbitron', sans-serif; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #f97316;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }
        .thumb-orange::-webkit-slider-thumb { border-color: #f97316; }
        .thumb-cyan::-webkit-slider-thumb { border-color: #06b6d4; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const MAX_PARTICLES = 30; 

    const App = () => {
        // --- 狀態 ---
        const [temperature, setTemperature] = useState(10); // 百萬度
        const [pressure, setPressure] = useState(1.0); // 磁約束壓力
        const [isRunning, setIsRunning] = useState(false);
        const [energyOutput, setEnergyOutput] = useState(0); 
        const [fusionCount, setFusionCount] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        const particlesRef = useRef([]); 
        const effectsRef = useRef([]); 
        const containerRef = useRef({ w: 600, h: 300 });

        const paramsRef = useRef({ temperature, pressure });
        const isRunningRef = useRef(false);

        useEffect(() => {
            paramsRef.current = { temperature, pressure };
        }, [temperature, pressure]);

        useEffect(() => {
            isRunningRef.current = isRunning;
        }, [isRunning]);

        // --- 初始化 ---
        const resetSim = () => {
            setIsRunning(false);
            isRunningRef.current = false;
            cancelAnimationFrame(requestRef.current);
            setEnergyOutput(0);
            setFusionCount(0);
            
            const ps = [];
            const w = CANVAS_WIDTH * 0.8;
            const h = CANVAS_HEIGHT * 0.8;
            for(let i=0; i<MAX_PARTICLES; i++) {
                ps.push({
                    x: CANVAS_WIDTH/2 + (Math.random()-0.5)*w*0.5,
                    y: CANVAS_HEIGHT/2 + (Math.random()-0.5)*h*0.5,
                    vx: (Math.random()-0.5),
                    vy: (Math.random()-0.5),
                    type: i % 2 === 0 ? 'D' : 'T',
                    r: 8
                });
            }
            particlesRef.current = ps;
            effectsRef.current = [];
            setTimeout(draw, 50);
        };

        const toggleSim = () => {
            if (!isRunning) {
                setIsRunning(true);
                isRunningRef.current = true; 
                requestRef.current = requestAnimationFrame(loop);
            } else {
                setIsRunning(false);
                isRunningRef.current = false;
                cancelAnimationFrame(requestRef.current);
            }
        };

        // --- 物理循環 ---
        const loop = () => {
            if (!isRunningRef.current) return;
            const { temperature: cT, pressure: cP } = paramsRef.current;

            // 1. 更新約束器尺寸
            const targetW = 700 / cP;
            const targetH = 400 / cP;
            containerRef.current.w += (targetW - containerRef.current.w) * 0.1;
            containerRef.current.h += (targetH - containerRef.current.h) * 0.1;
            
            const b = {
                l: (CANVAS_WIDTH - containerRef.current.w)/2,
                r: (CANVAS_WIDTH + containerRef.current.w)/2,
                t: (CANVAS_HEIGHT - containerRef.current.h)/2,
                b: (CANVAS_HEIGHT + containerRef.current.h)/2
            };

            // 2. 更新質點
            const speedScale = Math.sqrt(cT) * 0.55;
            const ps = particlesRef.current;
            
            for (let i = 0; i < ps.length; i++) {
                let p1 = ps[i];
                const typeScale = (p1.type === 'He' || p1.type === 'n') ? 3.0 : 1.0;
                
                p1.x += p1.vx * speedScale * typeScale;
                p1.y += p1.vy * speedScale * typeScale;

                // 牆壁碰撞
                if (p1.x < b.l + p1.r) { p1.x = b.l + p1.r; p1.vx *= -1; }
                if (p1.x > b.r - p1.r) { p1.x = b.r - p1.r; p1.vx *= -1; }
                if (p1.y < b.t + p1.r) { p1.y = b.t + p1.r; p1.vy *= -1; }
                if (p1.y > b.b - p1.r) { p1.y = b.b - p1.r; p1.vy *= -1; }

                // 聚變檢測 (D-T 反應)
                if (p1.type === 'D' || p1.type === 'T') {
                    for (let j = i + 1; j < ps.length; j++) {
                        let p2 = ps[j];
                        if ((p1.type === 'D' && p2.type === 'T') || (p1.type === 'T' && p2.type === 'D')) {
                            const dx = p2.x - p1.x, dy = p2.y - p1.y;
                            const distSq = dx*dx + dy*dy;
                            const minDist = p1.r + p2.r;
                            
                            if (distSq < minDist * minDist) {
                                // 克服庫侖障礙：溫度愈高機率愈大
                                if (cT > 70 && Math.random() < (cT/250)) {
                                    p1.type = 'He'; p1.r = 10;
                                    p1.vx = (Math.random()-0.5)*5; p1.vy = (Math.random()-0.5)*5;
                                    
                                    p2.type = 'n'; p2.r = 4;
                                    p2.vx = -p1.vx * 3.5; p2.vy = -p1.vy * 3.5;
                                    
                                    effectsRef.current.push({
                                        x: (p1.x+p2.x)/2, y: (p1.y+p2.y)/2,
                                        life: 1.0
                                    });
                                    setFusionCount(c => c + 1);
                                    setEnergyOutput(e => e + 17.6); 
                                } else {
                                    // 普通碰撞反彈
                                    const tempVx = p1.vx; p1.vx = p2.vx; p2.vx = tempVx;
                                    const tempVy = p1.vy; p1.vy = p2.vy; p2.vy = tempVy;
                                    const angle = Math.atan2(dy, dx);
                                    const overlap = minDist - Math.sqrt(distSq) + 1;
                                    p2.x += Math.cos(angle) * overlap; p2.y += Math.sin(angle) * overlap;
                                }
                            }
                        }
                    }
                }
            }
            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 渲染 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            const { temperature: cT } = paramsRef.current;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 1. 約束器外框
            const b = {
                x: (CANVAS_WIDTH - containerRef.current.w)/2,
                y: (CANVAS_HEIGHT - containerRef.current.h)/2,
                w: containerRef.current.w,
                h: containerRef.current.h
            };
            
            const glowA = Math.min(0.8, cT / 220);
            ctx.shadowBlur = 40; ctx.shadowColor = `rgba(249, 115, 22, ${glowA})`;
            ctx.strokeStyle = `rgba(148, 163, 184, 0.6)`; ctx.lineWidth = 10;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            ctx.shadowBlur = 0; 
            ctx.fillStyle = `rgba(15, 23, 42, 0.9)`; ctx.fillRect(b.x, b.y, b.w, b.h);

            // 2. 繪製質點
            particlesRef.current.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                if (p.type === 'D') ctx.fillStyle = '#3b82f6'; 
                else if (p.type === 'T') ctx.fillStyle = '#ef4444'; 
                else if (p.type === 'He') {
                    ctx.fillStyle = '#facc15'; ctx.shadowColor = '#facc15'; ctx.shadowBlur = 12;
                } else if (p.type === 'n') ctx.fillStyle = '#94a3b8'; 
                ctx.fill(); ctx.shadowBlur = 0;
            });

            // 3. 聚變特效
            effectsRef.current.forEach(e => {
                e.life -= 0.05;
                if (e.life > 0) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 45 * (1 - e.life), 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${e.life})`; ctx.fill();
                    ctx.beginPath(); ctx.arc(e.x, e.y, 25 * (1 - e.life), 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(250, 204, 21, ${e.life})`; ctx.lineWidth = 5; ctx.stroke();
                }
            });
            effectsRef.current = effectsRef.current.filter(e => e.life > 0);
        };

        useEffect(() => { resetSim(); }, []);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg text-orange-500"><i data-lucide="sun"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">核融合實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Nuclear Physics</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[450px] flex items-center justify-center">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute top-6 left-6 flex flex-col gap-3 pointer-events-none">
                                <div className="bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 backdrop-blur-md shadow-xl">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">總能量輸出 (Q)</div>
                                    <div className="text-2xl font-mono text-emerald-400 digital-font tracking-wider">
                                        {energyOutput.toFixed(1)} <span className="text-xs text-slate-600 font-medium">MeV</span>
                                    </div>
                                </div>
                                <div className="bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 backdrop-blur-md shadow-xl">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">核融合成功次數</div>
                                    <div className="text-xl font-mono text-white digital-font">{fusionCount}</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="space-y-6">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-orange-400 uppercase tracking-widest mb-4"><span>電漿核心溫度 (T)</span><span className="text-white font-mono">{temperature}M K</span></label>
                                    <input type="range" min="10" max="200" step="5" value={temperature} onChange={(e) => setTemperature(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-orange" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold"><span>低溫</span><span>點火臨界</span><span>極高溫</span></div>
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-cyan-400 uppercase tracking-widest mb-4"><span>磁約束壓力 (P)</span><span className="text-white font-mono">{pressure.toFixed(1)} atm</span></label>
                                    <input type="range" min="1.0" max="3.0" step="0.1" value={pressure} onChange={(e) => setPressure(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                                </div>
                            </div>
                            <div className="flex flex-col justify-center gap-4">
                                <button onClick={toggleSim} className={`py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg active:scale-95 text-lg ${isRunning ? 'bg-slate-700 text-slate-300' : 'bg-orange-600 hover:bg-orange-500 text-white shadow-orange-900/20'}`}>
                                    <i data-lucide={isRunning ? "pause" : "play"}></i> {isRunning ? "暫停模擬" : "啟動反應"}
                                </button>
                                <button onClick={resetSim} className="py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all flex items-center justify-center gap-2 active:rotate-180"><i data-lucide="rotate-ccw"></i> 重置系統</button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="list" className="text-indigo-400"></i> 粒子圖例</h2>
                            <ul className="space-y-4 text-xs">
                                <li className="flex items-center gap-3"><div className="w-4 h-4 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></div><span className="text-slate-300 font-bold">氘 (²H)</span></li>
                                <li className="flex items-center gap-3"><div className="w-4 h-4 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></div><span className="text-slate-300 font-bold">氚 (³H)</span></li>
                                <li className="h-px bg-slate-700"></li>
                                <li className="flex items-center gap-3"><div className="w-5 h-5 rounded-full bg-yellow-400 border border-white"></div><span className="text-white font-black">氦 (⁴He)</span></li>
                                <li className="flex items-center gap-3"><div className="w-2.5 h-2.5 rounded-full bg-slate-400"></div><span className="text-slate-500 font-bold">中子 (n)</span></li>
                            </ul>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理考點</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                <b>庫侖障礙：</b>原子核之間存在強大的靜電斥力。唯有在<b>高溫</b>（增加動能）與<b>高壓</b>（縮小距離）下，強核力才能克服斥力，讓聚變發生。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
