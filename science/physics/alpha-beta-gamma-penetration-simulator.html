<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輻射穿透力實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .digital-font { font-family: 'Courier New', monospace; letter-spacing: -1px; }
        .canvas-container { cursor: default; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    
    const SOURCE_X = 100;
    const BARRIER_X = 400;
    const DETECTOR_X = 700;

    const App = () => {
        // --- 狀態 ---
        const [sourceType, setSourceType] = useState('alpha'); // alpha, beta, gamma
        const [barrierType, setBarrierType] = useState('none'); // none, paper, aluminium, lead
        const [thickness, setThickness] = useState(5); // mm (視覺寬度)
        const [isRunning, setIsRunning] = useState(true);
        const [soundEnabled, setSoundEnabled] = useState(false);
        
        // 數據
        const [cpm, setCpm] = useState(0); // Counts Per Minute (每分鐘計數)
        
        // 使用 Ref 處理質點以確保循環中的同步更新
        const particlesRef = useRef([]);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const audioCtxRef = useRef(null);
        
        // Refs 用於在循環中讀取當前狀態
        const paramsRef = useRef({ sourceType, barrierType });

        // 同步參數
        useEffect(() => {
            paramsRef.current = { sourceType, barrierType };
        }, [sourceType, barrierType]);

        // --- 物理邏輯 ---
        const getPenetrationChance = (type, barrier) => {
            if (barrier === 'none') return 1.0; 

            if (type === 'alpha') {
                if (barrier === 'paper') return 0.0;
                if (barrier === 'aluminium') return 0.0;
                if (barrier === 'lead') return 0.0;
            }
            if (type === 'beta') {
                if (barrier === 'paper') return 0.95;
                if (barrier === 'aluminium') return 0.0;
                if (barrier === 'lead') return 0.0;
            }
            if (type === 'gamma') {
                if (barrier === 'paper') return 1.0;
                if (barrier === 'aluminium') return 0.95;
                if (barrier === 'lead') return 0.1;
            }
            return 1.0;
        };

        // --- 音效 ---
        const playClick = () => {
            if (!soundEnabled) return;
            
            if (!audioCtxRef.current) {
                audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();

            const osc = audioCtxRef.current.createOscillator();
            const gain = audioCtxRef.current.createGain();

            osc.type = 'square';
            osc.frequency.value = 800 + Math.random() * 200;
            
            gain.gain.setValueAtTime(0.1, audioCtxRef.current.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtxRef.current.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtxRef.current.destination);
            
            osc.start();
            osc.stop(audioCtxRef.current.currentTime + 0.05);
        };

        // --- 模擬循環 ---
        const loop = (timestamp) => {
            if (!isRunning) return;

            const { sourceType: currentSource, barrierType: currentBarrier } = paramsRef.current;

            // 1. 產生質點
            if (Math.random() < 0.3) {
                particlesRef.current.push({
                    x: SOURCE_X + 40,
                    y: CENTER_Y + (Math.random() - 0.5) * 40,
                    vx: (5 + Math.random() * 2),
                    vy: (Math.random() - 0.5) * 0.5,
                    type: currentSource,
                    dead: false,
                    passed: false
                });
            }

            // 2. 更新質點
            let hits = 0;
            
            particlesRef.current = particlesRef.current.map(p => {
                if (p.dead) return p;

                let nextX = p.x + p.vx;
                let nextY = p.y + p.vy;
                let isDead = false;

                // 阻隔物碰撞檢測
                if (!p.passed && nextX >= BARRIER_X - thickness && nextX <= BARRIER_X + thickness) {
                    const chance = getPenetrationChance(p.type, currentBarrier);
                    if (Math.random() > chance) { // 被阻擋
                        isDead = true; 
                        nextX = BARRIER_X - Math.random() * 5; 
                    } else {
                        p.passed = true; // 穿透成功
                    }
                }

                // 偵測器碰撞檢測
                if (nextX >= DETECTOR_X - 20 && nextX <= DETECTOR_X + 20 && Math.abs(nextY - CENTER_Y) < 40) {
                    isDead = true;
                    hits++;
                    playClick();
                }

                // 出界檢測
                if (nextX > CANVAS_WIDTH) isDead = true;

                return { ...p, x: nextX, y: nextY, dead: isDead };
            }).filter(p => p.x < CANVAS_WIDTH + 50 && !(p.dead && Math.random() > 0.9));

            // 3. 更新 CPM
            if (hits > 0) {
                setCpm(prev => prev + hits * 50); 
            }
            // 數據衰減
            setCpm(prev => Math.max(0, prev * 0.95)); 

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 渲染 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const { sourceType: currentSource, barrierType: currentBarrier } = paramsRef.current;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 放射源基塊
            ctx.fillStyle = '#334155';
            ctx.fillRect(SOURCE_X - 40, CENTER_Y - 40, 80, 80);
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.moveTo(SOURCE_X, CENTER_Y - 20);
            ctx.lineTo(SOURCE_X + 20, CENTER_Y + 15);
            ctx.lineTo(SOURCE_X - 20, CENTER_Y + 15);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            const sourceLabels = { alpha: 'ALPHA (α)', beta: 'BETA (β)', gamma: 'GAMMA (γ)' };
            ctx.fillText(sourceLabels[currentSource], SOURCE_X, CENTER_Y + 55);

            // 2. 阻隔材料
            if (currentBarrier !== 'none') {
                if (currentBarrier === 'paper') ctx.fillStyle = '#fefce8';
                else if (currentBarrier === 'aluminium') ctx.fillStyle = '#94a3b8';
                else if (currentBarrier === 'lead') ctx.fillStyle = '#475569';
                
                ctx.fillRect(BARRIER_X - thickness, CENTER_Y - 100, thickness * 2, 200);
                
                ctx.fillStyle = '#fff';
                const barrierLabels = { paper: '紙張', aluminium: '鋁片', lead: '鉛塊' };
                ctx.fillText(barrierLabels[currentBarrier], BARRIER_X, CENTER_Y - 110);
            }

            // 3. 偵測器
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(DETECTOR_X, CENTER_Y - 40, 80, 80);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.strokeRect(DETECTOR_X, CENTER_Y - 40, 10, 80); 
            ctx.beginPath(); ctx.moveTo(DETECTOR_X + 80, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

            // 4. 質點繪製
            particlesRef.current.forEach(p => {
                ctx.beginPath();
                
                if (p.type === 'alpha') {
                    ctx.fillStyle = '#ef4444';
                    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                } else if (p.type === 'beta') {
                    ctx.fillStyle = '#3b82f6';
                    ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                } else {
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p.x - 5, p.y);
                    ctx.quadraticCurveTo(p.x, p.y - 3, p.x + 5, p.y);
                    ctx.stroke();
                    return; 
                }
                ctx.fill();
            });
        };

        useEffect(() => {
            if (isRunning) {
                requestRef.current = requestAnimationFrame(loop);
            } else {
                cancelAnimationFrame(requestRef.current);
            }
            return () => cancelAnimationFrame(requestRef.current);
        }, [isRunning]);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        // 設定阻隔物
        const setBarrier = (type) => {
            setBarrierType(type);
            if (type === 'paper') setThickness(2);
            else if (type === 'aluminium') setThickness(10);
            else if (type === 'lead') setThickness(40);
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-yellow-500/20 p-2 rounded-lg text-yellow-500">
                            <i data-lucide="radio"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">輻射穿透力實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        主題：核子物理 (Nuclear Physics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    {/* 左側：模擬畫布 */}
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[450px]">
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_WIDTH} 
                                height={CANVAS_HEIGHT}
                                className="w-full h-full object-contain bg-slate-950 rounded-2xl"
                            />
                            
                            {/* 計數器顯示 */}
                            <div className="absolute top-6 right-6 bg-black/80 border-2 border-slate-600 rounded-2xl p-5 shadow-2xl w-52 backdrop-blur-md">
                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-2 tracking-widest">蓋革計數器 (Geiger Counter)</div>
                                <div className="font-mono text-4xl text-emerald-400 text-right font-black tracking-tighter">
                                    {Math.floor(cpm)} <span className="text-xs text-slate-600 font-bold">CPM</span>
                                </div>
                                <div className="w-full h-1.5 bg-slate-900 mt-3 rounded-full overflow-hidden shadow-inner">
                                    <div className="h-full bg-emerald-500 transition-all duration-150" style={{width: `${Math.min(100, cpm/50)}%`}}></div>
                                </div>
                            </div>
                        </div>

                        {/* 控制項 */}
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-10 items-start">
                            
                            {/* 放射源選擇 */}
                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="zap" className="w-3 h-3 text-yellow-500"></i> 選擇放射源
                                </h3>
                                <div className="flex gap-2">
                                    <button onClick={() => setSourceType('alpha')} className={`px-5 py-2.5 rounded-xl text-xs font-bold border transition-all active:scale-95 ${sourceType==='alpha' ? 'bg-red-600 border-red-500 text-white shadow-lg shadow-red-900/40' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>阿爾法 (α)</button>
                                    <button onClick={() => setSourceType('beta')} className={`px-5 py-2.5 rounded-xl text-xs font-bold border transition-all active:scale-95 ${sourceType==='beta' ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-900/40' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>貝塔 (β)</button>
                                    <button onClick={() => setSourceType('gamma')} className={`px-5 py-2.5 rounded-xl text-xs font-bold border transition-all active:scale-95 ${sourceType==='gamma' ? 'bg-yellow-600 border-yellow-500 text-white shadow-lg shadow-yellow-900/40' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>伽瑪 (γ)</button>
                                </div>
                            </div>

                            {/* 阻隔材料選擇 */}
                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="shield" className="w-3 h-3 text-indigo-400"></i> 阻隔材料
                                </h3>
                                <div className="flex gap-2">
                                    <button onClick={() => setBarrier('none')} className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${barrierType==='none' ? 'bg-slate-600 border-slate-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>無</button>
                                    <button onClick={() => setBarrier('paper')} className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${barrierType==='paper' ? 'bg-white text-slate-900 border-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>紙張</button>
                                    <button onClick={() => setBarrier('aluminium')} className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${barrierType==='aluminium' ? 'bg-slate-400 text-slate-900 border-slate-400 shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>鋁片</button>
                                    <button onClick={() => setBarrier('lead')} className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ${barrierType==='lead' ? 'bg-slate-700 border-slate-500 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>鉛塊</button>
                                </div>
                            </div>

                            <div className="flex-1 flex justify-end items-center gap-5 pt-6">
                                <label className="flex items-center gap-3 cursor-pointer bg-slate-950/50 px-4 py-2 rounded-xl border border-slate-700 hover:bg-slate-700 transition-colors">
                                    <div className="flex items-center gap-2">
                                        <i data-lucide={soundEnabled ? "volume-2" : "volume-x"} className={`w-4 h-4 ${soundEnabled ? 'text-emerald-400' : 'text-slate-500'}`}></i>
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">點擊音效</span>
                                    </div>
                                    <input type="checkbox" checked={soundEnabled} onChange={() => setSoundEnabled(!soundEnabled)} className="w-5 h-5 rounded border-slate-600 text-emerald-500 focus:ring-0 cursor-pointer" />
                                </label>
                                
                                <button 
                                    onClick={() => { setIsRunning(!isRunning); particlesRef.current = []; }}
                                    className={`px-8 py-3 rounded-2xl font-bold text-sm shadow-xl transition-all flex items-center gap-2 active:scale-95 ${isRunning ? 'bg-slate-700 text-slate-300' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}
                                >
                                    <i data-lucide={isRunning ? "pause" : "play"}></i>
                                    {isRunning ? "暫停模擬" : "啟動發射"}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 右側：粒子性質資訊 */}
                    <div className="lg:col-span-3 space-y-6">
                        
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="info" className="text-indigo-400"></i> 粒子物理性質
                            </h2>
                            
                            <div className="space-y-5">
                                <div className="p-4 bg-red-900/10 border border-red-500/20 rounded-2xl">
                                    <strong className="text-red-400 block mb-2 text-xs uppercase tracking-widest">阿爾法 (Alpha, α)</strong>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">氦原子核 (2p, 2n)。質量大、速度慢、電離能力極強。能被<b>一張紙</b>完全阻隔。</p>
                                </div>
                                <div className="p-4 bg-blue-900/10 border border-blue-500/20 rounded-2xl">
                                    <strong className="text-blue-400 block mb-2 text-xs uppercase tracking-widest">貝塔 (Beta, β)</strong>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">高速電子。質量極小、速度快。能穿透紙張，但會被<b>數毫米厚的鋁片</b>阻隔。</p>
                                </div>
                                <div className="p-4 bg-yellow-900/10 border border-yellow-500/20 rounded-2xl">
                                    <strong className="text-yellow-400 block mb-2 text-xs uppercase tracking-widest">伽瑪 (Gamma, γ)</strong>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">高能電磁波（光子）。穿透力極強。需要<b>厚鉛塊</b>或混凝土才能顯著減弱其強度。</p>
                                </div>
                            </div>
                        </div>

                    </div>

                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
