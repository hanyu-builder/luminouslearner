<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子運動模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-types -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #10b981; cursor: pointer; border: 2px solid white;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = window.Recharts;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 400;
    const PARTICLE_RADIUS = 4;
    
    const STATE_CONFIG = {
        SOLID: { name: '固態 (Solid)', color: '#3b82f6', bondStrength: 0.8, damping: 0.9, lattice: true },
        LIQUID: { name: '液態 (Liquid)', color: '#22c55e', bondStrength: 0.1, damping: 0.98, lattice: false, gravity: 0.1 },
        GAS: { name: '氣態 (Gas)', color: '#ef4444', bondStrength: 0, damping: 1, lattice: false, gravity: 0 }
    };

    const App = () => {
        const [mode, setMode] = useState('SOLID');
        const [temperature, setTemperature] = useState(20);
        const [particleCount, setParticleCount] = useState(100);
        const [energyData, setEnergyData] = useState([]);
        
        const canvasRef = useRef(null);
        const requestRef = useRef();
        const particlesRef = useRef([]);

        const initParticles = useCallback(() => {
            const particles = [];
            const cols = Math.floor(Math.sqrt(particleCount * (CANVAS_WIDTH/CANVAS_HEIGHT)));
            const rows = Math.ceil(particleCount / cols);
            const spacingX = CANVAS_WIDTH / (cols + 1);
            const spacingY = CANVAS_HEIGHT / (rows + 1);

            for (let i = 0; i < particleCount; i++) {
                let x, y, vx, vy, originX, originY;
                if (mode === 'SOLID') {
                    const r = Math.floor(i / cols);
                    const c = i % cols;
                    originX = spacingX * (c + 1);
                    originY = spacingY * (r + 1) + 50;
                    x = originX; y = originY;
                    vx = (Math.random() - 0.5); vy = (Math.random() - 0.5);
                } else if (mode === 'LIQUID') {
                    x = Math.random() * (CANVAS_WIDTH - 20) + 10;
                    y = CANVAS_HEIGHT - Math.random() * (CANVAS_HEIGHT / 2) - 10;
                    vx = (Math.random() - 0.5) * 2; vy = (Math.random() - 0.5) * 2;
                    originX = x; originY = y;
                } else {
                    x = Math.random() * (CANVAS_WIDTH - 20) + 10;
                    y = Math.random() * (CANVAS_HEIGHT - 20) + 10;
                    vx = (Math.random() - 0.5) * 5; vy = (Math.random() - 0.5) * 5;
                    originX = x; originY = y;
                }
                particles.push({ x, y, vx, vy, originX, originY });
            }
            particlesRef.current = particles;
        }, [mode, particleCount]);

        useEffect(() => {
            initParticles();
            setEnergyData([]);
        }, [initParticles]);

        const updatePhysics = () => {
            const config = STATE_CONFIG[mode];
            const speedMultiplier = (temperature / 50) + 0.1;
            let totalKE = 0;

            particlesRef.current.forEach(p => {
                if (mode === 'SOLID') {
                    p.vx += (p.originX - p.x) * config.bondStrength * 0.1;
                    p.vy += (p.originY - p.y) * config.bondStrength * 0.1;
                    if (Math.random() < 0.1) {
                        p.vx += (Math.random() - 0.5) * speedMultiplier;
                        p.vy += (Math.random() - 0.5) * speedMultiplier;
                    }
                    p.vx *= config.damping; p.vy *= config.damping;
                } else if (mode === 'LIQUID') {
                    p.vy += config.gravity;
                    if (p.x < PARTICLE_RADIUS || p.x > CANVAS_WIDTH - PARTICLE_RADIUS) p.vx *= -0.5;
                    if (p.y > CANVAS_HEIGHT - PARTICLE_RADIUS) { p.y = CANVAS_HEIGHT - PARTICLE_RADIUS; p.vy *= -0.5; }
                    p.vx += (Math.random() - 0.5) * speedMultiplier * 0.2;
                    p.vy += (Math.random() - 0.5) * speedMultiplier * 0.2;
                    p.vx *= config.damping; p.vy *= config.damping;
                } else {
                    if (p.x < PARTICLE_RADIUS || p.x > CANVAS_WIDTH - PARTICLE_RADIUS) p.vx *= -1;
                    if (p.y < PARTICLE_RADIUS || p.y > CANVAS_HEIGHT - PARTICLE_RADIUS) p.vy *= -1;
                    const currentSpeed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                    const targetSpeed = speedMultiplier * 4; 
                    p.vx = p.vx * 0.99 + p.vx/currentSpeed * targetSpeed * 0.01; 
                    p.vy = p.vy * 0.99 + p.vy/currentSpeed * targetSpeed * 0.01;
                }
                p.x += p.vx; p.y += p.vy;
                totalKE += 0.5 * (p.vx*p.vx + p.vy*p.vy);
            });

            if (Math.random() < 0.1) {
                setEnergyData(prev => {
                    const newData = [...prev, { time: prev.length, ke: (totalKE / particleCount).toFixed(2) }];
                    return newData.slice(-50);
                });
            }
        };

        const draw = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const config = STATE_CONFIG[mode];
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = config.color;
            particlesRef.current.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, Math.PI * 2); ctx.fill();
                if (mode === 'SOLID') {
                    ctx.strokeStyle = 'rgba(59, 130, 246, 0.15)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.originX, p.originY); ctx.stroke();
                }
            });
        };

        useEffect(() => {
            const animate = () => { updatePhysics(); draw(); requestRef.current = requestAnimationFrame(animate); };
            requestRef.current = requestAnimationFrame(animate);
            return () => cancelAnimationFrame(requestRef.current);
        }, [mode, temperature, particleCount]);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 p-4 font-sans flex flex-col">
                <header className="mb-6 flex items-center justify-between border-b border-slate-700 pb-4">
                    <div className="flex items-center space-x-3">
                        <div className="p-2 bg-blue-500/10 rounded-lg"><i data-lucide="atom" className="w-8 h-8 text-blue-400"></i></div>
                        <div>
                            <h1 className="text-xl font-bold text-white tracking-tight">粒子運動模擬器</h1>
                            <p className="text-slate-400 text-xs tracking-wide">分子運動論與物質三態</p>
                        </div>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-blue-400 border border-slate-700 uppercase">DSE Physics: Heat</div>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 overflow-hidden">
                    <div className="lg:col-span-1 space-y-4">
                        <div className="grid grid-cols-3 gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
                            {Object.keys(STATE_CONFIG).map(s => (
                                <button key={s} onClick={() => setMode(s)} className={`py-2 rounded-lg text-xs font-bold transition-all ${mode === s ? 'text-white shadow-lg' : 'text-slate-500 hover:bg-slate-700'}`} style={{ backgroundColor: mode === s ? STATE_CONFIG[s].color : '' }}>{STATE_CONFIG[s].name.split(' ')[0]}</button>
                            ))}
                        </div>

                        <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5">
                            <h2 className="text-blue-400 text-xs font-bold mb-4 uppercase tracking-wider flex items-center"><i data-lucide="thermometer" className="w-3 h-3 mr-2"></i> 實驗變因設定</h2>
                            <div className="mb-6">
                                <div className="flex justify-between mb-2 text-xs font-bold"><span>環境溫度 (能量級別)</span><span className="text-blue-300 font-mono">{temperature}°C</span></div>
                                <input type="range" min="0" max="100" value={temperature} onChange={(e) => setTemperature(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase"><span>低溫</span><span>高溫</span></div>
                            </div>
                            <div>
                                <div className="flex justify-between mb-2 text-xs font-bold"><span>粒子數量</span><span className="text-slate-300 font-mono">{particleCount}</span></div>
                                <input type="range" min="50" max="300" step="10" value={particleCount} onChange={(e) => setParticleCount(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>
                        </div>

                        <div className="bg-blue-900/10 border border-blue-500/20 p-4 rounded-xl">
                            <h3 className="text-blue-400 text-[10px] font-bold uppercase mb-2">微觀觀察提示</h3>
                            <p className="text-xs text-slate-400 leading-relaxed font-medium italic">
                                {mode === 'SOLID' && "粒子在固定平衡位置附近振動，維持規則晶格結構。"}
                                {mode === 'LIQUID' && "粒子間距較近但可互相滑動，分子鍵不斷斷裂與重組。"}
                                {mode === 'GAS' && "粒子以高速作隨機運動，動能佔主導地位，與器壁碰撞產生壓強。"}
                            </p>
                        </div>
                    </div>

                    <div className="lg:col-span-2 space-y-4 overflow-y-auto custom-scroll pr-1">
                        <div className="relative rounded-xl border border-slate-700 overflow-hidden shadow-2xl bg-slate-950">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto block" />
                            <div className="absolute top-4 right-4 bg-slate-900/90 px-3 py-1 rounded border border-slate-700 text-[10px] font-mono text-slate-400 uppercase tracking-widest">
                                模式: <span style={{color: STATE_CONFIG[mode].color}}>{STATE_CONFIG[mode].name}</span>
                            </div>
                        </div>

                        <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 h-64">
                            <h3 className="text-slate-400 text-[10px] font-bold uppercase mb-4 flex items-center"><i data-lucide="activity" className="w-3 h-3 mr-2"></i> 實時數據：平均動能對時間關係圖</h3>
                            <div className="w-full h-full pb-8">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={energyData}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                        <YAxis stroke="#64748b" fontSize={10} tickFormatter={(v)=>v} />
                                        <XAxis hide={true} />
                                        <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: 'none', borderRadius: '8px', fontSize: '10px' }} />
                                        <Line type="monotone" dataKey="ke" stroke={STATE_CONFIG[mode].color} strokeWidth={2} dot={false} isAnimationActive={false} />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 100);
</script>
</body>
</html>
