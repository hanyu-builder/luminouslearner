<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完全非彈性碰撞實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
        .thumb-orange::-webkit-slider-thumb { background: #f97316; }
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 350;
    const TRACK_Y = 200;
    const PIXELS_PER_METER = 50;
    const CART_WIDTH = 80;

    const App = () => {
        // --- 狀態 ---
        const [m1, setM1] = useState(2.0); // kg
        const [u1, setU1] = useState(4.0); // m/s
        const [m2, setM2] = useState(2.0); // kg
        const [u2, setU2] = useState(-2.0); // m/s
        const [simState, setSimState] = useState('idle'); // idle, running, stuck, finished
        const [simSpeed, setSimSpeed] = useState(1.0);
        const [results, setResults] = useState(null);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const physicsRef = useRef({ 
            x1: 200, v1: 0, 
            x2: 600, v2: 0,
            stuck: false
        });

        // --- 邏輯 ---
        const resetSim = () => {
            setSimState('idle');
            cancelAnimationFrame(requestRef.current);
            physicsRef.current = {
                x1: 200, v1: u1 * PIXELS_PER_METER,
                x2: 600, v2: u2 * PIXELS_PER_METER,
                stuck: false
            };
            setResults(null);
            draw();
        };

        const calculatePhysics = () => {
            // 動量守恆: m1u1 + m2u2 = (m1 + m2)v
            const totalMomentum = m1 * u1 + m2 * u2;
            const totalMass = m1 + m2;
            const vFinal = totalMomentum / totalMass;

            const keInit = 0.5 * m1 * u1*u1 + 0.5 * m2 * u2*u2;
            const keFinal = 0.5 * totalMass * vFinal*vFinal;
            const loss = keInit - keFinal;
            const lossPercent = keInit > 0.001 ? (loss / keInit) * 100 : 0;

            return { vFinal, keInit, keFinal, loss, lossPercent };
        };

        const startSim = () => {
            if (simState === 'running') return;
            setSimState('running');
            setResults(calculatePhysics());
            physicsRef.current.v1 = u1 * PIXELS_PER_METER;
            physicsRef.current.v2 = u2 * PIXELS_PER_METER;
            physicsRef.current.stuck = false;
            loop();
        };

        const loop = () => {
            const state = physicsRef.current;
            const dt = 0.016 * simSpeed;

            if (!state.stuck) {
                state.x1 += state.v1 * dt;
                state.x2 += state.v2 * dt;
                const dist = state.x2 - state.x1;
                
                if (dist <= CART_WIDTH) {
                    state.stuck = true;
                    setSimState('stuck');
                    const mid = (state.x1 + state.x2) / 2;
                    state.x1 = mid - CART_WIDTH/2;
                    state.x2 = mid + CART_WIDTH/2;
                    const { vFinal } = calculatePhysics();
                    state.v1 = vFinal * PIXELS_PER_METER;
                    state.v2 = vFinal * PIXELS_PER_METER;
                }
            } else {
                state.x1 += state.v1 * dt;
                state.x2 += state.v2 * dt;
            }

            if (state.x1 < -100 || state.x2 > CANVAS_WIDTH + 100) {
                setSimState('finished');
                draw();
                return;
            }

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 背景
            const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 軌道
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, TRACK_Y + 25, CANVAS_WIDTH, 10);

            const drawCart = (x, mass, color, side) => {
                const y = TRACK_Y - 25;
                const w = CART_WIDTH;
                const h = 50;
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.arc(x - 20, y + 25, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 20, y + 25, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.roundRect(x - w/2, y - h/2, w, h, 6); ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`${mass}kg`, x, y + 5);
                ctx.fillStyle = '#fde047'; // 魔鬼氈標示
                const patchX = side === 'right' ? x + w/2 - 5 : x - w/2;
                ctx.fillRect(patchX, y - h/2 + 5, 5, h - 10);
            };

            const state = physicsRef.current;
            drawCart(state.x1, m1, '#3b82f6', 'right');
            drawCart(state.x2, m2, '#f97316', 'left');

            if (state.stuck && simState === 'stuck') {
                const cx = (state.x1 + state.x2) / 2;
                const cy = TRACK_Y - 25;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.lineTo(0, -30); ctx.lineTo(10, -10);
                }
                ctx.fillStyle = 'rgba(255, 255, 0, 0.7)';
                ctx.fill();
                ctx.restore();
            }
        };

        useEffect(() => {
            resetSim();
            if (window.lucide) window.lucide.createIcons();
        }, [m1, m2, u1, u2]);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        const ResultItem = ({ label, initial, final, unit, isLoss }) => (
            <div className={`p-4 rounded-xl border ${isLoss ? 'bg-red-900/10 border-red-500/30' : 'bg-emerald-900/10 border-emerald-500/30'}`}>
                <div className="text-[10px] text-slate-500 uppercase font-bold mb-2 tracking-wider">{label}</div>
                <div className="flex justify-between items-baseline text-xs mb-1">
                    <span className="text-slate-400">碰撞前</span>
                    <span className="text-white font-mono">{initial?.toFixed(2)} {unit}</span>
                </div>
                <div className="flex justify-between items-baseline text-xs border-b border-slate-700 pb-2 mb-2">
                    <span className="text-slate-400">碰撞後</span>
                    <span className={`font-mono font-bold ${isLoss ? 'text-red-400' : 'text-emerald-400'}`}>{final?.toFixed(2)} {unit}</span>
                </div>
                {isLoss && (
                    <div className="flex justify-between text-xs text-red-300 font-bold">
                        <span>能量損耗率</span>
                        <span>{results?.lossPercent.toFixed(1)}%</span>
                    </div>
                )}
            </div>
        );

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center space-x-3">
                        <div className="bg-orange-500/20 p-2 rounded-lg">
                            <i data-lucide="combine" className="w-6 h-6 text-orange-400"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">完全非彈性碰撞實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700">
                        主題：動量守恆與能量損耗
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-8 space-y-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[400px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain bg-slate-950 rounded-2xl" />
                            <div className="absolute top-6 left-6 flex gap-4">
                                <div className="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                                    <div className="text-[10px] text-blue-400 font-bold uppercase">滑車 A 速度</div>
                                    <div className="text-xl font-mono text-white">{(simState === 'idle' ? u1 : physicsRef.current.v1/PIXELS_PER_METER).toFixed(2)} m/s</div>
                                </div>
                                <div className="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-md">
                                    <div className="text-[10px] text-orange-400 font-bold uppercase">滑車 B 速度</div>
                                    <div className="text-xl font-mono text-white">{(simState === 'idle' ? u2 : physicsRef.current.v2/PIXELS_PER_METER).toFixed(2)} m/s</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-4">
                                <h3 className="text-blue-400 text-xs font-bold uppercase flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-blue-500"></div> 滑車 A (左側)
                                </h3>
                                <div>
                                    <label className="flex justify-between text-xs text-slate-400 mb-2">質量: <span className="text-white font-mono">{m1} kg</span></label>
                                    <input type="range" min="1" max="10" step="0.5" value={m1} onChange={(e) => setM1(Number(e.target.value))} disabled={simState !== 'idle'} className="w-full h-1.5 bg-slate-700 rounded-lg slider-thumb thumb-blue appearance-none" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs text-slate-400 mb-2">初速: <span className="text-white font-mono">{u1} m/s</span></label>
                                    <input type="range" min="-10" max="10" step="1" value={u1} onChange={(e) => setU1(Number(e.target.value))} disabled={simState !== 'idle'} className="w-full h-1.5 bg-slate-700 rounded-lg slider-thumb thumb-blue appearance-none" />
                                </div>
                            </div>
                            <div className="space-y-4">
                                <h3 className="text-orange-400 text-xs font-bold uppercase flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-orange-500"></div> 滑車 B (右側)
                                </h3>
                                <div>
                                    <label className="flex justify-between text-xs text-slate-400 mb-2">質量: <span className="text-white font-mono">{m2} kg</span></label>
                                    <input type="range" min="1" max="10" step="0.5" value={m2} onChange={(e) => setM2(Number(e.target.value))} disabled={simState !== 'idle'} className="w-full h-1.5 bg-slate-700 rounded-lg slider-thumb thumb-orange appearance-none" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs text-slate-400 mb-2">初速: <span className="text-white font-mono">{u2} m/s</span></label>
                                    <input type="range" min="-10" max="10" step="1" value={u2} onChange={(e) => setU2(Number(e.target.value))} disabled={simState !== 'idle'} className="w-full h-1.5 bg-slate-700 rounded-lg slider-thumb thumb-orange appearance-none" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center">
                                <i data-lucide="bar-chart-2" className="w-5 h-5 mr-2 text-indigo-400"></i>
                                數據分析面板
                            </h2>
                            <div className="space-y-4">
                                <div className="p-4 rounded-xl bg-blue-900/10 border border-blue-500/20">
                                    <div className="text-[10px] text-blue-400 uppercase font-bold mb-2">總動量 (P)</div>
                                    <div className="text-2xl font-mono font-bold text-white mb-1">
                                        {(m1*u1 + m2*u2).toFixed(2)} <span className="text-sm text-slate-500">kg·m/s</span>
                                    </div>
                                    <div className="text-[10px] text-emerald-400 flex items-center gap-1 font-bold italic">
                                        <i data-lucide="shield-check" className="w-3 h-3"></i> 系統動量守恆
                                    </div>
                                </div>
                                <ResultItem label="總動能 (KE)" initial={results?.keInit} final={results?.keFinal} unit="J" isLoss={true} />
                            </div>
                            <div className="mt-8 grid grid-cols-2 gap-3">
                                <button onClick={startSim} disabled={simState !== 'idle'} className={`py-4 rounded-2xl font-bold flex items-center justify-center transition-all ${simState === 'idle' ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-500/20' : 'bg-slate-700 text-slate-500'}`}>
                                    <i data-lucide="play" className="w-5 h-5 mr-2"></i> 開始模擬
                                </button>
                                <button onClick={resetSim} className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-colors">
                                    <i data-lucide="rotate-ccw" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                            <h3 className="text-indigo-300 font-bold text-sm mb-4 flex items-center gap-2">
                                <i data-lucide="help-circle" className="w-4 h-4"></i> 實驗原理
                            </h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                在完全非彈性碰撞中，物體會因為相互黏合（如膠帶、磁鐵）而以共同速度運動。這過程會將大量動能轉化為<b>內能（熱與聲音）</b>，但整體動量仍需維持不變。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
