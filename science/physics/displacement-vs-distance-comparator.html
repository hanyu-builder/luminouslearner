<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位移與路徑長度對稱模擬 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .map-grid {
            background-image: 
                linear-gradient(to right, #1e293b 1px, transparent 1px),
                linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 400;

    const App = () => {
        const [waypoints, setWaypoints] = useState([]);
        const [distance, setDistance] = useState(0);
        const [displacement, setDisplacement] = useState(0);
        const [isWalking, setIsWalking] = useState(false);
        const [walkerPos, setWalkerPos] = useState(null);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const walkerIndexRef = useRef(0);
        const walkerProgressRef = useRef(0);

        useEffect(() => { resetMap(); }, []);

        const resetMap = () => {
            const startPoint = { x: 50, y: CANVAS_HEIGHT - 50 };
            setWaypoints([startPoint]);
            setWalkerPos(startPoint);
            setDistance(0);
            setDisplacement(0);
            setIsWalking(false);
        };

        const getDist = (p1, p2) => Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));

        const updateMeasurements = (points) => {
            if (points.length < 1) return;
            let totalDist = 0;
            for (let i = 0; i < points.length - 1; i++) {
                totalDist += getDist(points[i], points[i+1]);
            }
            setDistance(Math.round(totalDist));
            const start = points[0];
            const end = points[points.length - 1];
            setDisplacement(Math.round(getDist(start, end)));
        };

        const handleCanvasClick = (e) => {
            if (isWalking) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const newPoints = [...waypoints, { x, y }];
            setWaypoints(newPoints);
            setWalkerPos({ x, y });
            updateMeasurements(newPoints);
        };

        const updateAnimation = () => {
            if (!isWalking || waypoints.length < 2) return;
            const speed = 3;
            const idx = walkerIndexRef.current;
            const p1 = waypoints[idx];
            const p2 = waypoints[idx+1];
            const segmentLength = getDist(p1, p2);
            walkerProgressRef.current += speed / segmentLength;

            if (walkerProgressRef.current >= 1) {
                walkerProgressRef.current = 0;
                walkerIndexRef.current += 1;
                if (walkerIndexRef.current >= waypoints.length - 1) {
                    setIsWalking(false);
                    setWalkerPos(waypoints[waypoints.length - 1]);
                    return;
                }
            }
            const currentP1 = waypoints[walkerIndexRef.current];
            const currentP2 = waypoints[walkerIndexRef.current + 1];
            const t = walkerProgressRef.current;
            setWalkerPos({ 
                x: currentP1.x + (currentP2.x - currentP1.x) * t, 
                y: currentP1.y + (currentP2.y - currentP1.y) * t 
            });
            requestRef.current = requestAnimationFrame(updateAnimation);
        };

        const startWalk = () => {
            if (waypoints.length < 2) return;
            setIsWalking(true);
            walkerIndexRef.current = 0;
            walkerProgressRef.current = 0;
            setWalkerPos(waypoints[0]);
        };

        useEffect(() => {
            if (isWalking) requestRef.current = requestAnimationFrame(updateAnimation);
            return () => cancelAnimationFrame(requestRef.current);
        }, [isWalking]);

        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if (waypoints.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);
                ctx.moveTo(waypoints[0].x, waypoints[0].y);
                for (let i = 1; i < waypoints.length; i++) ctx.lineTo(waypoints[i].x, waypoints[i].y);
                ctx.stroke(); ctx.setLineDash([]);
            }

            if (walkerPos && waypoints.length > 0) {
                const start = waypoints[0]; const end = walkerPos;
                ctx.beginPath(); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4;
                ctx.moveTo(start.x, start.y); ctx.lineTo(end.x, end.y); ctx.stroke();
                const angle = Math.atan2(end.y - start.y, end.x - start.x);
                const headLen = 15;
                ctx.beginPath(); ctx.fillStyle = '#ef4444'; ctx.moveTo(end.x, end.y);
                ctx.lineTo(end.x - headLen * Math.cos(angle - Math.PI / 6), end.y - headLen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(end.x - headLen * Math.cos(angle + Math.PI / 6), end.y - headLen * Math.sin(angle + Math.PI / 6));
                ctx.fill();
            }

            waypoints.forEach((p, i) => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                if (i === 0) ctx.fillStyle = '#22c55e';
                else if (i === waypoints.length - 1 && !isWalking) ctx.fillStyle = '#ef4444';
                else ctx.fillStyle = '#3b82f6';
                ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = '12px Inter';
                if (i === 0) ctx.fillText("起點 START", p.x - 20, p.y - 15);
            });

            if (walkerPos) {
                ctx.beginPath(); ctx.arc(walkerPos.x, walkerPos.y, 10, 0, Math.PI*2);
                ctx.fillStyle = '#fbbf24'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }
        }, [waypoints, walkerPos, isWalking]);

        return (
            <div className="min-h-screen bg-slate-900 pb-12 font-sans text-slate-200">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg"><i data-lucide="map" className="w-6 h-6 text-blue-400"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">位移與路徑長度對比儀</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700">DSE Physics: Kinematics</div>
                </nav>

                <main className="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-2xl p-1 border border-slate-700 shadow-xl overflow-hidden relative">
                            <div className="absolute top-4 left-4 bg-slate-900/90 px-3 py-2 rounded-lg border border-slate-600 text-[10px] text-slate-300 pointer-events-none z-10">
                                <p className="flex items-center gap-2 font-bold"><span className="w-2 h-2 bg-blue-500 rounded-full"></span> 實際路徑 (長度)</p>
                                <p className="flex items-center gap-2 mt-1 font-bold"><span className="w-2 h-2 bg-red-500 rounded-full"></span> 位移向量 (直線)</p>
                            </div>
                            <div className="absolute top-4 right-4 text-[10px] text-slate-500 italic pointer-events-none z-10 font-bold uppercase tracking-widest">
                                點擊地圖以添加轉折點
                            </div>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onClick={handleCanvasClick} className="w-full h-auto cursor-crosshair map-grid bg-slate-950" />
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="grid grid-cols-1 gap-4">
                            <div className="bg-blue-900/10 border border-blue-500/30 p-5 rounded-xl flex justify-between items-center">
                                <div>
                                    <div className="text-blue-300 text-[10px] uppercase tracking-widest font-black mb-1">路徑長度 Distance</div>
                                    <div className="text-3xl font-mono font-black text-white">{distance} <span className="text-sm text-slate-500 italic">m</span></div>
                                </div>
                                <i data-lucide="footprints" className="w-8 h-8 text-blue-500/30"></i>
                            </div>

                            <div className="bg-red-900/10 border border-red-500/30 p-5 rounded-xl flex justify-between items-center">
                                <div>
                                    <div className="text-red-300 text-[10px] uppercase tracking-widest font-black mb-1">位移量 Displacement</div>
                                    <div className="text-3xl font-mono font-black text-white">{displacement} <span className="text-sm text-slate-500 italic">m</span></div>
                                </div>
                                <i data-lucide="move-up-right" className="w-8 h-8 text-red-500/30"></i>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-inner">
                            <h3 className="text-white font-black mb-4 text-xs uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="activity" className="w-4 h-4 text-blue-400"></i> 實時物理分析
                            </h3>
                            <div className="text-xs text-slate-400 space-y-3 leading-relaxed">
                                <p><strong className="text-slate-200">路徑長度</strong> 是標量，隨步數累積增加。</p>
                                <p><strong className="text-slate-200">位移</strong> 是向量，只代表目前位置與起點的落差。如果你往回走，位移會減小！</p>
                                <div className="mt-4 p-3 bg-slate-900/50 rounded-lg border border-slate-700 text-center font-bold">
                                    {displacement === 0 && distance > 0 ? (
                                        <span className="text-yellow-400 animate-pulse uppercase">來回行程：位移為零！</span>
                                    ) : distance > 0 && displacement < distance ? (
                                        <span className="text-emerald-400">非直線運動：路徑 &gt; 位移</span>
                                    ) : distance > 0 && displacement === distance ? (
                                        <span className="text-blue-400 font-black">理想直線運動</span>
                                    ) : (
                                        <span className="text-slate-600 italic uppercase">在地圖上繪製路徑以查看數據</span>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button onClick={startWalk} disabled={isWalking || waypoints.length < 2} className={`w-2/3 py-4 rounded-xl font-black uppercase tracking-widest flex items-center justify-center transition-all ${isWalking || waypoints.length < 2 ? 'bg-slate-800 text-slate-600 border border-slate-700' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20'}`}>
                                <i data-lucide="play" className="w-4 h-4 mr-2"></i> 開始行走
                            </button>
                            <button onClick={resetMap} className="w-1/3 py-4 bg-slate-700 hover:bg-slate-600 rounded-xl text-white transition-all flex items-center justify-center font-black uppercase tracking-widest border border-slate-600">
                                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
</script>
</body>
</html>
