<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家居用電計算機 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-green::-webkit-slider-thumb { background: #10b981; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PRESETS = [
        { name: 'LED 燈泡', power: 10, icon: 'lightbulb' },
        { name: '手提電腦', power: 65, icon: 'laptop' },
        { name: '電視機', power: 150, icon: 'tv' },
        { name: '雪櫃 (平均)', power: 200, icon: 'snowflake' }, 
        { name: '微波爐', power: 1200, icon: 'waves' },
        { name: '冷氣機', power: 1500, icon: 'wind' },
        { name: '電熱水爐', power: 3000, icon: 'droplets' }
    ];

    const App = () => {
        // --- 狀態 ---
        const [appliances, setAppliances] = useState([
            { id: 1, name: 'LED 燈泡', power: 10, hours: 5, icon: 'lightbulb' },
            { id: 2, name: '冷氣機', power: 1500, hours: 8, icon: 'wind' }
        ]);
        
        const [unitCost, setUnitCost] = useState(1.5); // $ 每度電 (HKD 近似值)

        // --- 計算邏輯 ---
        const totalPower = appliances.reduce((sum, item) => sum + item.power, 0); 
        
        // 能量 (kWh) = (功率 (W) * 小時) / 1000
        const dailyEnergy = appliances.reduce((sum, item) => sum + (item.power * item.hours) / 1000, 0);
        
        const dailyCost = dailyEnergy * unitCost;
        const monthlyCost = dailyCost * 30;
        const yearlyCost = dailyCost * 365;

        // --- 操作 ---
        const addAppliance = (preset) => {
            setAppliances([
                ...appliances,
                { id: Date.now(), name: preset.name, power: preset.power, hours: 1, icon: preset.icon }
            ]);
        };

        const removeAppliance = (id) => {
            setAppliances(appliances.filter(item => item.id !== id));
        };

        const updateAppliance = (id, field, value) => {
            setAppliances(appliances.map(item => 
                item.id === id ? { ...item, [field]: Number(value) } : item
            ));
        };

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        });

        // --- 比例圓餅圖 (CSS Conic Gradient) ---
        const pieStyle = useMemo(() => {
            if (dailyEnergy === 0) return { background: '#334155' };
            
            let gradientString = 'conic-gradient(';
            let currentAngle = 0;
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#a855f7', '#ec4899', '#6366f1'];
            
            appliances.forEach((item, index) => {
                const energy = (item.power * item.hours) / 1000;
                const percentage = energy / dailyEnergy;
                const angle = percentage * 360;
                const color = colors[index % colors.length];
                
                gradientString += `${color} ${currentAngle}deg ${currentAngle + angle}deg, `;
                currentAngle += angle;
            });
            
            gradientString = gradientString.slice(0, -2) + ')';
            return { background: gradientString };
        }, [appliances, dailyEnergy]);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-emerald-500/20 p-2 rounded-lg">
                            <i data-lucide="zap" className="w-6 h-6 text-emerald-400"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">家居用電成本計算機</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Energy & Efficiency
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    {/* 左側：電器管理器 */}
                    <div className="lg:col-span-7 flex flex-col gap-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-8 flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="plug" className="text-emerald-400"></i> 我的電器清單
                            </h2>

                            <div className="space-y-4 max-h-[600px] overflow-y-auto pr-2 custom-scroll">
                                {appliances.map((item, index) => (
                                    <div key={item.id} className="bg-slate-900/50 p-6 rounded-2xl border border-slate-700 hover:border-emerald-500/30 transition-all shadow-inner group">
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="flex items-center gap-4">
                                                <div className="p-3 bg-slate-800 rounded-xl text-slate-300 shadow-lg">
                                                    <i data-lucide={item.icon || 'circle'} className="w-6 h-6"></i>
                                                </div>
                                                <div>
                                                    <div className="font-bold text-white text-lg">{item.name}</div>
                                                    <div className="text-xs text-slate-500 font-mono uppercase tracking-tighter">額定功率: <span className="text-blue-400 font-bold">{item.power} W</span></div>
                                                </div>
                                            </div>
                                            <button onClick={() => removeAppliance(item.id)} className="text-slate-600 hover:text-red-400 p-2 transition-colors">
                                                <i data-lucide="trash-2" className="w-5 h-5"></i>
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                            <div className="space-y-3">
                                                <label className="text-[10px] uppercase font-black text-slate-500 tracking-widest flex justify-between">
                                                    <span>每日使用時數</span>
                                                    <span className="text-emerald-400 font-mono">{item.hours}h</span>
                                                </label>
                                                <input 
                                                    type="range" min="0" max="24" step="0.5" 
                                                    value={item.hours} onChange={(e) => updateAppliance(item.id, 'hours', e.target.value)}
                                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-green"
                                                />
                                            </div>
                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center flex flex-col justify-center">
                                                <div className="text-[9px] uppercase font-bold text-slate-600 mb-1">每日消耗</div>
                                                <div className="text-xl font-black text-white font-mono leading-none">
                                                    {((item.power * item.hours) / 1000).toFixed(2)} <span className="text-[10px] text-slate-500 font-medium">kWh</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {appliances.length === 0 && (
                                    <div className="text-center py-16 bg-slate-900/30 rounded-3xl border-2 border-dashed border-slate-700">
                                        <i data-lucide="layout-list" className="w-12 h-12 text-slate-700 mx-auto mb-4 opacity-20"></i>
                                        <p className="text-slate-500 font-medium italic">目前清單為空。請從下方選擇電器新增！</p>
                                    </div>
                                )}
                            </div>
                            
                            <div className="mt-8 pt-8 border-t border-slate-700">
                                <label className="text-xs font-bold text-slate-400 mb-4 block uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="plus-circle" className="w-4 h-4"></i> 快速新增電器庫
                                </label>
                                <div className="flex flex-wrap gap-3">
                                    {PRESETS.map(p => (
                                        <button 
                                            key={p.name}
                                            onClick={() => addAppliance(p)}
                                            className="px-4 py-2.5 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 transition-all flex items-center gap-2 active:scale-95 shadow-md"
                                        >
                                            <i data-lucide={p.icon} className="w-3.5 h-3.5 text-blue-400"></i>
                                            {p.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 右側：帳單分析 */}
                    <div className="lg:col-span-5 space-y-6">
                        
                        {/* 電費看板 */}
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="calculator" className="text-indigo-400"></i> 帳單預估 (Bill Analysis)
                            </h2>
                            
                            <div>
                                <div className="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                                    <span>電費單價 (每度)</span>
                                    <span className="text-emerald-400 font-mono text-lg">${unitCost.toFixed(2)} <span className="text-[10px]">/ kWh</span></span>
                                </div>
                                <input 
                                    type="range" min="0.5" max="3.5" step="0.1" 
                                    value={unitCost} onChange={(e) => setUnitCost(Number(e.target.value))}
                                    className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-green"
                                />
                                <div className="flex justify-between text-[9px] text-slate-600 font-bold mt-2 uppercase tracking-tighter"><span>政府補貼價</span><span>標準民生價</span><span>累進高價區</span></div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-inner">
                                    <div className="text-[10px] text-indigo-400 font-bold uppercase tracking-widest mb-2">每日用電量</div>
                                    <div className="text-3xl font-black text-white font-mono tracking-tighter">
                                        {dailyEnergy.toFixed(2)} <span className="text-xs text-slate-600 font-bold">度</span>
                                    </div>
                                </div>
                                <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-inner">
                                    <div className="text-[10px] text-emerald-400 font-bold uppercase tracking-widest mb-2">每日電費</div>
                                    <div className="text-3xl font-black text-white font-mono tracking-tighter">
                                        ${dailyCost.toFixed(1)}
                                    </div>
                                </div>
                            </div>

                            <div className="mt-4 p-6 bg-slate-950/50 rounded-2xl border border-slate-800 space-y-4">
                                <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold text-slate-400">每月預算 (30日)</span>
                                    <span className="text-2xl font-black text-white font-mono">${monthlyCost.toFixed(0)}</span>
                                </div>
                                <div className="h-px bg-slate-800"></div>
                                <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold text-slate-400">年度開支 (365日)</span>
                                    <span className="text-2xl font-black text-emerald-400 font-mono">${yearlyCost.toFixed(0)}</span>
                                </div>
                            </div>
                        </div>

                        {/* 分佈圖表 */}
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-col items-center">
                            <h3 className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8 w-full border-b border-slate-700 pb-4 flex items-center gap-2">
                                <i data-lucide="pie-chart" className="w-4 h-4"></i> 用電量百分比分佈
                            </h3>
                            
                            <div className="w-44 h-44 rounded-full border-4 border-slate-900 shadow-[0_0_40px_rgba(0,0,0,0.4)] relative" style={pieStyle}>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <div className="w-32 h-32 bg-slate-800 rounded-full flex flex-col items-center justify-center shadow-inner">
                                        <span className="text-[9px] text-slate-500 font-black uppercase tracking-tighter leading-none mb-1">總度數</span>
                                        <span className="text-xl font-black text-white font-mono tracking-tighter">{dailyEnergy.toFixed(1)}</span>
                                        <span className="text-[10px] text-slate-600 font-bold">kWh/Day</span>
                                    </div>
                                </div>
                            </div>

                            <div className="w-full mt-10 space-y-3">
                                {appliances.map((item, index) => {
                                    const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-red-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500'];
                                    const color = colors[index % colors.length];
                                    const percent = dailyEnergy > 0 ? ((item.power * item.hours / 1000) / dailyEnergy * 100).toFixed(1) : 0;
                                    
                                    return (
                                        <div key={item.id} className="flex items-center justify-between text-xs animate-in fade-in slide-in-from-bottom-1" style={{animationDelay: `${index * 100}ms`}}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-2.5 h-2.5 rounded-full ${color} shadow-sm`}></div>
                                                <span className="text-slate-400 font-medium truncate max-w-[150px]">{item.name}</span>
                                            </div>
                                            <span className="font-mono text-white font-black">{percent}%</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 節能物理筆記</h3>
                            <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                根據 <b>E = P &times; t</b> 公式，減少電費有兩個途徑：選購<b>低額定功率</b>的電器（如將 60W 鎢絲燈換成 10W LED），或是縮短<b>使用時間</b>。
                            </p>
                        </div>

                    </div>

                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
