<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁場模擬實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: move; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .thumb-red::-webkit-slider-thumb { border-color: #ef4444; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const FILING_COUNT = 3000;
    
    const App = () => {
        // --- 狀態 ---
        const [magnetPos, setMagnetPos] = useState({ x: 400, y: 250, angle: 0 });
        const [magnetStrength, setMagnetStrength] = useState(50); 
        const [viewMode, setViewMode] = useState('filings'); // filings, lines
        const [showCompass, setShowCompass] = useState(false);
        const [compassPos, setCompassPos] = useState({ x: 100, y: 100 });

        const canvasRef = useRef(null);
        const filingsRef = useRef([]);
        const requestRef = useRef();
        const isDraggingRef = useRef(null); 

        // --- 初始化鐵粉 ---
        useEffect(() => {
            const filings = [];
            for (let i = 0; i < FILING_COUNT; i++) {
                filings.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * CANVAS_HEIGHT,
                    angle: Math.random() * Math.PI * 2,
                    len: 2 + Math.random() * 4,
                    color: `rgba(200, 200, 200, ${0.3 + Math.random()*0.5})`
                });
            }
            filingsRef.current = filings;
            updateFilings(true); 
        }, []);

        // --- 物理邏輯 ---
        const getFieldAt = (x, y, mx, my, mAngle, strength) => {
            const L = 100;
            const rad = mAngle * Math.PI / 180;
            
            // N 極位置
            const nx = mx + (L/2) * Math.cos(rad);
            const ny = my + (L/2) * Math.sin(rad);
            
            // S 極位置
            const sx = mx - (L/2) * Math.cos(rad);
            const sy = my - (L/2) * Math.sin(rad);

            const dnx = x - nx, dny = y - ny;
            const distN2 = dnx*dnx + dny*dny;
            const distN = Math.sqrt(distN2);

            const dsx = x - sx, dsy = y - sy;
            const distS2 = dsx*dsx + dsy*dsy;
            const distS = Math.sqrt(distS2);

            const scale = strength * 500;
            const rMin = 20;
            
            const Bnx = (scale * dnx) / Math.pow(Math.max(distN, rMin), 3);
            const Bny = (scale * dny) / Math.pow(Math.max(distN, rMin), 3);

            const Bsx = (-scale * dsx) / Math.pow(Math.max(distS, rMin), 3);
            const Bsy = (-scale * dsy) / Math.pow(Math.max(distS, rMin), 3);

            return { Bx: Bnx + Bsx, By: Bny + Bsy };
        };

        const updateFilings = (isTapping = false) => {
            if (viewMode !== 'filings') return;
            const { x: mx, y: my, angle: ma } = magnetPos;
            
            filingsRef.current.forEach(f => {
                const { Bx, By } = getFieldAt(f.x, f.y, mx, my, ma, magnetStrength);
                const targetAngle = Math.atan2(By, Bx);
                const B_mag = Math.sqrt(Bx*Bx + By*By);
                
                let rotSpeed = B_mag * 0.05;
                if (isTapping) rotSpeed += 0.5; 
                
                let diff = targetAngle - f.angle;
                while (diff > Math.PI) diff -= 2*Math.PI;
                while (diff < -Math.PI) diff += 2*Math.PI;
                
                f.angle += diff * Math.min(1, rotSpeed);
                
                if (isTapping) {
                    f.x += (Math.random() - 0.5) * 2.5;
                    f.y += (Math.random() - 0.5) * 2.5;
                }
            });
        };

        const tapTable = () => {
            let frames = 0;
            const shake = () => {
                updateFilings(true);
                draw();
                frames++;
                if (frames < 20) requestAnimationFrame(shake);
            };
            shake();
        };

        useEffect(() => {
            updateFilings(false);
            draw();
        }, [magnetPos, magnetStrength, viewMode, showCompass, compassPos]);

        // --- 互動處理 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);

            const dx = x - magnetPos.x, dy = y - magnetPos.y;
            const rad = -magnetPos.angle * Math.PI / 180;
            const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
            const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
            
            if (Math.abs(rx) < 55 && Math.abs(ry) < 25) {
                isDraggingRef.current = 'magnet';
                return;
            }
            if (showCompass && Math.hypot(x - compassPos.x, y - compassPos.y) < 30) {
                isDraggingRef.current = 'compass';
                return;
            }
        };

        const handleMouseMove = (e) => {
            if (!isDraggingRef.current) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);

            if (isDraggingRef.current === 'magnet') {
                setMagnetPos(prev => ({ ...prev, x, y }));
            } else if (isDraggingRef.current === 'compass') {
                setCompassPos({ x, y });
            }
        };

        const handleMouseUp = () => {
            isDraggingRef.current = null;
            tapTable(); 
        };
        
        const handleWheel = (e) => {
            e.preventDefault(); 
            setMagnetPos(prev => ({ ...prev, angle: prev.angle + e.deltaY * 0.1 }));
        };

        // --- 渲染功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製場域
            if (viewMode === 'filings') {
                ctx.lineWidth = 1;
                filingsRef.current.forEach(f => {
                    ctx.strokeStyle = f.color;
                    ctx.beginPath();
                    const dx = Math.cos(f.angle) * f.len, dy = Math.sin(f.angle) * f.len;
                    ctx.moveTo(f.x - dx, f.y - dy); ctx.lineTo(f.x + dx, f.y + dy);
                    ctx.stroke();
                });
            } else {
                const L = 100, rad = magnetPos.angle * Math.PI / 180;
                const nx = magnetPos.x + (L/2) * Math.cos(rad), ny = magnetPos.y + (L/2) * Math.sin(rad);
                const sx = magnetPos.x - (L/2) * Math.cos(rad), sy = magnetPos.y - (L/2) * Math.sin(rad);
                
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)'; ctx.lineWidth = 2;
                const numLines = 24;
                for (let i = 0; i < numLines; i++) {
                    const startAngle = (i / numLines) * Math.PI * 2;
                    let cx = nx + 10 * Math.cos(startAngle), cy = ny + 10 * Math.sin(startAngle);
                    ctx.beginPath(); ctx.moveTo(cx, cy);
                    for (let step = 0; step < 200; step++) {
                        const { Bx, By } = getFieldAt(cx, cy, magnetPos.x, magnetPos.y, magnetPos.angle, magnetStrength);
                        const B = Math.sqrt(Bx*Bx + By*By);
                        if (B === 0) break;
                        cx += (Bx / B) * 10; cy += (By / B) * 10;
                        ctx.lineTo(cx, cy);
                        if (Math.hypot(cx - sx, cy - sy) < 20) break;
                        if (cx < 0 || cx > CANVAS_WIDTH || cy < 0 || cy > CANVAS_HEIGHT) break;
                    }
                    ctx.stroke();
                }
            }

            // 2. 繪製磁鐵
            ctx.save();
            ctx.translate(magnetPos.x, magnetPos.y);
            ctx.rotate(magnetPos.angle * Math.PI / 180);
            const w = 110, h = 40;
            ctx.fillStyle = '#3b82f6'; ctx.fillRect(-w/2, -h/2, w/2, h); // S
            ctx.fillStyle = '#ef4444'; ctx.fillRect(0, -h/2, w/2, h);    // N
            ctx.fillStyle = 'white'; ctx.font = 'bold 20px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('S', -w/4, 0); ctx.fillText('N', w/4, 0);
            ctx.restore();

            // 3. 繪製指南針
            if (showCompass) {
                const { Bx, By } = getFieldAt(compassPos.x, compassPos.y, magnetPos.x, magnetPos.y, magnetPos.angle, magnetStrength);
                const needleAngle = Math.atan2(By, Bx);
                ctx.save();
                ctx.translate(compassPos.x, compassPos.y);
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#334155'; ctx.lineWidth=2; ctx.stroke();
                ctx.rotate(needleAngle);
                ctx.beginPath(); ctx.fillStyle = '#ef4444'; ctx.moveTo(20, 0); ctx.lineTo(-5, 8); ctx.lineTo(-5, -8); ctx.fill(); // N
                ctx.beginPath(); ctx.fillStyle = '#cbd5e1'; ctx.moveTo(-20, 0); ctx.lineTo(5, 8); ctx.lineTo(5, -8); ctx.fill(); // S
                ctx.restore();
            }
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-red-500/20 p-2 rounded-lg text-red-500"><i data-lucide="magnet"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">磁場模擬實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Magnetism</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} onWheel={handleWheel} className="w-full h-full object-contain canvas-container" />
                            <div className="absolute top-6 left-6 bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 text-sm text-slate-300 backdrop-blur-md pointer-events-none flex items-center gap-3">
                                <i data-lucide="mouse-pointer-2" className="text-red-400"></i>
                                拖動<b>磁鐵</b>移動 • 滾輪<b>旋轉</b>磁鐵
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-8 items-center justify-between">
                            <div className="flex gap-3 p-1 bg-slate-950 rounded-2xl border border-slate-700">
                                <button onClick={()=>{setViewMode('filings'); setTimeout(tapTable, 50);}} className={`px-6 py-2.5 rounded-xl text-xs font-bold transition-all ${viewMode==='filings'?'bg-slate-200 text-slate-900 shadow-lg':'text-slate-500 hover:text-slate-300'}`}>鐵粉模擬 (Filings)</button>
                                <button onClick={()=>setViewMode('lines')} className={`px-6 py-2.5 rounded-xl text-xs font-bold transition-all ${viewMode==='lines'?'bg-blue-600 text-white shadow-lg':'text-slate-500 hover:text-slate-300'}`}>磁力線 (Field Lines)</button>
                            </div>

                            <div className="flex-1 min-w-[200px] space-y-3">
                                <label className="flex justify-between text-xs font-bold text-red-400 uppercase tracking-widest"><span>磁鐵強度</span><span className="text-white font-mono">{magnetStrength}</span></label>
                                <input type="range" min="10" max="100" step="5" value={magnetStrength} onChange={(e)=>{setMagnetStrength(Number(e.target.value)); tapTable();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-red" />
                            </div>

                            <div className="flex gap-4">
                                <label className="flex items-center gap-3 cursor-pointer p-3 rounded-2xl bg-slate-950/50 hover:bg-slate-700 transition-colors border border-slate-700">
                                    <input type="checkbox" checked={showCompass} onChange={()=>setShowCompass(!showCompass)} className="w-5 h-5 rounded border-slate-600 text-red-600 focus:ring-0 cursor-pointer" />
                                    <span className="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center gap-2"><i data-lucide="compass" className="w-4 h-4"></i> 指南針</span>
                                </label>
                                <button onClick={tapTable} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="vibrate"></i> 敲擊桌面</button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-800 pb-4"><i data-lucide="book-open" className="text-indigo-400"></i> 實驗觀察指南</h2>
                            <ul className="space-y-5 text-xs text-slate-400 leading-relaxed">
                                <li className="flex gap-3"><div className="w-4 h-4 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-[10px] font-bold text-blue-400">1</div> <b>鐵粉對齊：</b> 鐵粉像微型磁針，會沿著磁場方向排列。若因摩擦力卡住，請點擊「敲擊桌面」。</li>
                                <li className="flex gap-3"><div className="w-4 h-4 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-[10px] font-bold text-blue-400">2</div> <b>磁場方向：</b> 磁力線在磁鐵外部總是從 <b>N 極</b> 出發，進入 <b>S 極</b>。</li>
                                <li className="flex gap-3"><div className="w-4 h-4 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-[10px] font-bold text-blue-400">3</div> <b>場強強弱：</b> 磁力線愈密集的地方，代表磁場愈強。</li>
                            </ul>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 物理小知識</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                指南針的紅色指針是其自身的 N 極。根據「異性相吸」，它會指向磁鐵的 S 極，或沿著磁場線由 N 指向 S。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
