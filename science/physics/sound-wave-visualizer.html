<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲波視覺化實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .thumb-purple::-webkit-slider-thumb { border-color: #a855f7; }
        .thumb-pink::-webkit-slider-thumb { border-color: #ec4899; }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 300;
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [frequency, setFrequency] = useState(440); // 單位：Hz (標準音 A4)
        const [volume, setVolume] = useState(0.5); // 0 到 1 (振幅)
        const [isPlaying, setIsPlaying] = useState(false);
        const [waveform, setWaveform] = useState('sine'); // 正弦, 方波, 鋸齒, 三角

        const canvasRef = useRef(null);
        const particlesCanvasRef = useRef(null);
        const requestRef = useRef();
        const timeRef = useRef(0);
        
        // 音訊 Ref
        const audioCtxRef = useRef(null);
        const oscillatorRef = useRef(null);
        const gainNodeRef = useRef(null);

        // --- 音訊邏輯 ---
        const initAudio = () => {
            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
                gainNodeRef.current = audioCtxRef.current.createGain();
                gainNodeRef.current.connect(audioCtxRef.current.destination);
            }
        };

        const togglePlay = () => {
            initAudio();
            if (isPlaying) {
                if (oscillatorRef.current) {
                    oscillatorRef.current.stop();
                    oscillatorRef.current.disconnect();
                    oscillatorRef.current = null;
                }
                setIsPlaying(false);
            } else {
                if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                const osc = audioCtxRef.current.createOscillator();
                osc.type = waveform;
                osc.frequency.setValueAtTime(frequency, audioCtxRef.current.currentTime);
                osc.connect(gainNodeRef.current);
                osc.start();
                oscillatorRef.current = osc;
                setIsPlaying(true);
            }
        };

        useEffect(() => {
            if (oscillatorRef.current && isPlaying) {
                oscillatorRef.current.frequency.setTargetAtTime(frequency, audioCtxRef.current.currentTime, 0.05);
            }
        }, [frequency]);

        useEffect(() => {
            if (gainNodeRef.current) {
                gainNodeRef.current.gain.setTargetAtTime(volume, audioCtxRef.current.currentTime, 0.05);
            }
        }, [volume]);

        useEffect(() => {
            if (oscillatorRef.current && isPlaying) oscillatorRef.current.type = waveform;
        }, [waveform]);

        // --- 渲染循環 ---
        const draw = () => {
            const t = timeRef.current;
            timeRef.current += 0.05; 
            
            // 1. 示波器圖案 (橫向表示位移－時間)
            const ctx = canvasRef.current?.getContext('2d');
            if (ctx) {
                ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

                ctx.lineWidth = 3; ctx.strokeStyle = '#a855f7'; ctx.beginPath();
                const ampPx = volume * 100; 
                
                for (let x = 0; x < CANVAS_WIDTH; x++) {
                    const phase = x * (frequency / 2000) - t * (frequency / 100); 
                    let y = 0;
                    if (waveform === 'sine') y = Math.sin(phase * Math.PI * 2);
                    else if (waveform === 'square') y = Math.sign(Math.sin(phase * Math.PI * 2));
                    else if (waveform === 'sawtooth') y = -1 + 2 * ((phase) % 1);
                    else if (waveform === 'triangle') y = Math.abs((phase % 1) * 4 - 2) - 1;

                    const plotY = CENTER_Y - y * ampPx;
                    if (x === 0) ctx.moveTo(x, plotY);
                    else ctx.lineTo(x, plotY);
                }
                ctx.stroke();
            }

            // 2. 空氣質點動畫 (縱波真實運動)
            const pCtx = particlesCanvasRef.current?.getContext('2d');
            if (pCtx) {
                pCtx.clearRect(0, 0, CANVAS_WIDTH, 60);
                pCtx.fillStyle = '#1e293b'; pCtx.fillRect(0, 0, CANVAS_WIDTH, 60);

                const numParticles = 100;
                const spacing = CANVAS_WIDTH / numParticles;
                for (let i = 0; i < numParticles; i++) {
                    const x0 = i * spacing;
                    const phase = x0 * (frequency / 2000) - t * (frequency / 100); 
                    const displacement = Math.sin(phase * Math.PI * 2); 
                    const ampPx = volume * 22; 
                    const x = x0 + displacement * ampPx;
                    
                    pCtx.beginPath();
                    pCtx.arc(x, 30, 2.5, 0, Math.PI * 2);
                    pCtx.fillStyle = i % 10 === 0 ? '#ef4444' : '#94a3b8';
                    pCtx.fill();
                }
            }
            requestRef.current = requestAnimationFrame(draw);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(draw);
            return () => cancelAnimationFrame(requestRef.current);
        }, [frequency, volume, waveform]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        const reset = () => {
            if (isPlaying) togglePlay();
            setFrequency(440);
            setVolume(0.5);
            setWaveform('sine');
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-500/20 p-2 rounded-lg text-purple-400">
                            <i data-lucide="waves"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">聲波視覺化實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Sound Waves & Properties
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <div className="absolute top-4 left-6 bg-slate-900/90 px-3 py-1 rounded-lg text-[10px] font-bold text-slate-500 border border-slate-700 uppercase tracking-widest backdrop-blur-md">
                                虛擬示波器 (位移－時間圖)
                            </div>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto bg-slate-950 rounded-2xl" />
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                            <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i data-lucide="wind" className="w-3 h-3"></i> 空氣分子模擬 (縱波運動)
                            </div>
                            <canvas ref={particlesCanvasRef} width={CANVAS_WIDTH} height={60} className="w-full h-[60px] bg-slate-950 rounded-xl border border-slate-900" />
                            <div className="text-[10px] text-slate-500 mt-3 italic text-center">
                                * 注意：聲波透過「壓縮」與「稀疏」層傳遞能量。紅色質點展示了單一分子的往復運動。
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="sliders" className="text-purple-400"></i> 聲音屬性控制
                            </h2>

                            <button 
                                onClick={togglePlay}
                                className={`w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg ${isPlaying ? 'bg-red-600/20 text-red-500 border border-red-500/50' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}
                            >
                                <i data-lucide={isPlaying ? "square" : "play"}></i>
                                {isPlaying ? "停止發聲" : "啟動發聲"}
                            </button>

                            <div className="space-y-6">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-purple-300 uppercase tracking-widest mb-3">
                                        <span>音調 (頻率 Frequency)</span>
                                        <span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{frequency} Hz</span>
                                    </label>
                                    <input type="range" min="100" max="1000" step="10" value={frequency} onChange={(e)=>setFrequency(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-purple" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase italic"><span>低音 (大波長)</span><span>高音 (小波長)</span></div>
                                </div>

                                <div>
                                    <label className="flex justify-between text-xs font-bold text-pink-300 uppercase tracking-widest mb-3">
                                        <span>響度 (振幅 Amplitude)</span>
                                        <span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{Math.round(volume * 100)}%</span>
                                    </label>
                                    <input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e)=>setVolume(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-pink" />
                                </div>

                                <div>
                                    <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 block">音色 (波形 Waveform)</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['sine', 'square', 'sawtooth', 'triangle'].map(type => (
                                            <button key={type} onClick={()=>setWaveform(type)} className={`py-2.5 rounded-xl text-[10px] font-bold uppercase border transition-all ${waveform === type ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>
                                                {type === 'sine' ? '正弦波' : type === 'square' ? '方波' : type === 'sawtooth' ? '鋸齒波' : '三角波'}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <button onClick={reset} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                                <i data-lucide="rotate-ccw"></i> 重設實驗
                            </button>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="ear" className="w-4 h-4"></i> 聽覺物理筆記</h3>
                            <div className="space-y-3 text-[11px] text-slate-400 leading-relaxed italic">
                                <p>• <b>高頻：</b> 單位時間振動次數多，聽起來音調較高。</p>
                                <p>• <b>高振幅：</b> 質點偏離平衡位置遠，攜帶能量大，聽起來較響。</p>
                                <p>• <b>人耳範圍：</b> 健康人耳約可聽到 20Hz 至 20,000Hz 的聲音。</p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
