<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凹面鏡成像實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-cyan::-webkit-slider-thumb { border-color: #06b6d4; }
        .canvas-container { cursor: ew-resize; }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const MIRROR_X = 700; 
    const CENTER_Y = CANVAS_HEIGHT / 2;

    const App = () => {
        // --- 狀態 ---
        const [focalLength, setFocalLength] = useState(100); // 像素
        const [objDist, setObjDist] = useState(250); // 像素
        const [objHeight, setObjHeight] = useState(60); 
        
        const [showRays, setShowRays] = useState(true);
        const [isDragging, setIsDragging] = useState(false);

        // --- 物理計算 ---
        // 面鏡公式: 1/f = 1/do + 1/di 
        let imgDist = Infinity;
        let imgHeight = Infinity;
        let magnification = 0;
        let imageType = "無 (無窮遠)";
        
        if (Math.abs(objDist - focalLength) < 1) {
            imgDist = Infinity;
            imageType = "無 (成像於無窮遠)";
        } else {
            imgDist = (focalLength * objDist) / (objDist - focalLength);
            magnification = -imgDist / objDist;
            imgHeight = objHeight * magnification;
            
            if (objDist > focalLength) imageType = "實像、倒立";
            else imageType = "虛像、正立";
        }

        const canvasRef = useRef(null);

        // --- 互動邏輯 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const objX = MIRROR_X - objDist;
            if (Math.abs(x - objX) < 30) {
                setIsDragging(true);
            }
        };

        const handleMouseMove = (e) => {
            if (!isDragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            let x = e.clientX - rect.left;
            if (x > MIRROR_X - 10) x = MIRROR_X - 10;
            if (x < 50) x = 50;
            setObjDist(MIRROR_X - x);
        };

        const handleMouseUp = () => {
            setIsDragging(false);
        };

        // --- 渲染 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 主光軸
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();
            ctx.setLineDash([]);

            // 2. 繪製凹面鏡 (孔徑近似)
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.beginPath();
            ctx.moveTo(MIRROR_X, CENTER_Y - 150);
            ctx.quadraticCurveTo(MIRROR_X - 40, CENTER_Y, MIRROR_X, CENTER_Y + 150);
            ctx.stroke();
            
            // 鏡背斜線
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            for(let y = -140; y <= 140; y+=10) {
                const cy = CENTER_Y + y; const t = y / 150;
                const cx = MIRROR_X - 20 * (1 - t*t);
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 10, cy + 5); ctx.stroke();
            }

            // 3. 標記焦點 F 與球心 C
            const fX = MIRROR_X - focalLength, cX = MIRROR_X - 2 * focalLength;
            drawPoint(ctx, fX, CENTER_Y, '#ef4444', 'F');
            drawPoint(ctx, cX, CENTER_Y, '#3b82f6', 'C');
            drawPoint(ctx, MIRROR_X, CENTER_Y, '#94a3b8', 'V');

            // 4. 繪製物體 (蠟燭)
            const objX = MIRROR_X - objDist;
            drawCandle(ctx, objX, CENTER_Y, objHeight, 1.0, "物體");

            // 5. 繪製像
            if (Math.abs(imgDist) < 10000) {
                const drawImgX = MIRROR_X - imgDist; 
                drawCandle(ctx, drawImgX, CENTER_Y, imgHeight, 0.6, "像");
            }

            // 6. 光路追蹤 (Ray Tracing)
            if (showRays && Math.abs(imgDist) < 10000) {
                const imgX = MIRROR_X - imgDist, imgTopY = CENTER_Y - imgHeight, objTopY = CENTER_Y - objHeight;
                ctx.lineWidth = 2;

                // 射線 1：平行軸 -> 經由焦點反射
                ctx.strokeStyle = '#facc15'; ctx.beginPath();
                ctx.moveTo(objX, objTopY); ctx.lineTo(MIRROR_X, objTopY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(MIRROR_X, objTopY); ctx.lineTo(imgX, imgTopY);
                if (imgDist > 0) ctx.lineTo(imgX - (MIRROR_X - imgX) * 0.5, imgTopY - (objTopY - imgTopY) * 0.5);
                ctx.stroke();
                if (imgDist < 0) { ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(MIRROR_X, objTopY); ctx.lineTo(imgX, imgTopY); ctx.stroke(); ctx.setLineDash([]); }

                // 射線 2：經由焦點 -> 平行反射
                ctx.strokeStyle = '#38bdf8';
                const m2 = (CENTER_Y - objTopY) / (fX - objX);
                const hitY2 = objTopY + m2 * (MIRROR_X - objX);
                ctx.beginPath(); ctx.moveTo(objX, objTopY); ctx.lineTo(MIRROR_X, hitY2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(MIRROR_X, hitY2); ctx.lineTo(0, hitY2); ctx.stroke();
                if (imgDist < 0) { ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(MIRROR_X, hitY2); ctx.lineTo(imgX, hitY2); ctx.stroke(); ctx.setLineDash([]); }

                // 射線 3：經由球心 -> 原路反射
                ctx.strokeStyle = '#a855f7';
                const m3 = (CENTER_Y - objTopY) / (cX - objX);
                const hitY3 = objTopY + m3 * (MIRROR_X - objX);
                ctx.beginPath(); ctx.moveTo(objX, objTopY); ctx.lineTo(MIRROR_X, hitY3); ctx.stroke();
                if (imgDist < 0) { ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(MIRROR_X, hitY3); ctx.lineTo(imgX, imgTopY); ctx.stroke(); ctx.setLineDash([]); }
            }
        }, [focalLength, objDist, objHeight, showRays]);

        const drawPoint = (ctx, x, y, color, label) => {
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
            ctx.font = 'bold 12px sans-serif'; ctx.fillText(label, x - 5, y + 20);
        };

        const drawCandle = (ctx, x, baseY, height, alpha, label) => {
            ctx.save(); ctx.translate(x, baseY); ctx.globalAlpha = alpha;
            const h = Math.abs(height), sY = Math.sign(height);
            ctx.scale(1, -sY);
            ctx.fillStyle = '#fde047'; ctx.fillRect(-8, 0, 16, -h);
            ctx.beginPath(); ctx.arc(0, -h - 5, 5, 0, Math.PI*2); ctx.fillStyle = '#ef4444'; ctx.fill();
            ctx.scale(1, sY); 
            ctx.fillStyle = alpha === 1 ? 'white' : '#60a5fa'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(label, 0, sY > 0 ? 20 : -20);
            ctx.restore();
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-cyan-500/20 p-2 rounded-lg text-cyan-400"><i data-lucide="aperture"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">凹面鏡成像實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Geometric Optics</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-2 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-full object-contain bg-slate-950 rounded-2xl canvas-container" />
                            <div className="absolute top-6 left-6 flex flex-col gap-3">
                                <div className={`px-4 py-1.5 rounded-full border font-bold text-xs shadow-xl backdrop-blur-md ${imgDist > 0 ? 'bg-emerald-900/80 border-emerald-500 text-emerald-100' : imgDist < 0 ? 'bg-purple-900/80 border-purple-500 text-purple-100' : 'bg-slate-800 text-slate-500'}`}>
                                    性質：{imageType}
                                </div>
                            </div>
                            <div className="absolute bottom-6 left-6 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 text-sm text-slate-300 backdrop-blur-md pointer-events-none flex items-center gap-3">
                                <i data-lucide="mouse-pointer-2" className="text-cyan-400"></i> 拖動<b>蠟燭</b>觀察成像位置與光路變化
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-10 items-center">
                            <div className="flex-1 min-w-[250px]">
                                <label className="flex justify-between text-xs font-bold text-blue-400 uppercase tracking-widest mb-4"><span>物距 (do)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{objDist} 單位</span></label>
                                <input type="range" min="50" max="600" step="10" value={objDist} onChange={(e)=>setObjDist(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                            </div>
                            <div className="flex-1 min-w-[250px]">
                                <label className="flex justify-between text-xs font-bold text-red-400 uppercase tracking-widest mb-4"><span>焦距 (f)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{focalLength} 單位</span></label>
                                <input type="range" min="50" max="200" step="10" value={focalLength} onChange={(e)=>setFocalLength(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="calculator" className="text-indigo-400"></i> 定量運算數據</h2>
                            <div className="space-y-4 font-mono">
                                <div className="p-4 rounded-xl bg-slate-950 border border-slate-700 text-center">
                                    <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">放大率 (M)</div>
                                    <div className={`text-3xl font-black ${Math.abs(magnification) > 1 ? 'text-emerald-400' : 'text-white'}`}>{Math.abs(magnification).toFixed(2)}x</div>
                                </div>
                                <div className="p-4 rounded-xl bg-slate-950 border border-slate-700 text-center">
                                    <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">像距 (di)</div>
                                    <div className="text-2xl font-bold text-white">{Math.abs(imgDist) === Infinity ? "∞" : Math.abs(imgDist).toFixed(0)} <span className="text-xs text-slate-600">像素</span></div>
                                    <div className="text-[9px] text-slate-500 mt-1 uppercase italic">{imgDist > 0 ? "實像 (鏡前)" : "虛像 (鏡後)"}</div>
                                </div>
                            </div>
                            <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">顯示作圖光線</span>
                                <input type="checkbox" checked={showRays} onChange={()=>setShowRays(!showRays)} className="w-5 h-5 rounded border-slate-600 text-cyan-500 focus:ring-0 cursor-pointer" />
                            </label>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-4">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 成像原理提示</h3>
                            <div className="space-y-3 text-[11px] text-slate-400 leading-relaxed italic">
                                <p>• 當 <b>u &gt; f</b>：光線匯聚於鏡前，形成<b>倒立實像</b>。</p>
                                <p>• 當 <b>u &lt; f</b>：反射光線發散，其延長線相交於鏡後，形成<b>放大正立虛像</b>（如化妝鏡）。</p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
