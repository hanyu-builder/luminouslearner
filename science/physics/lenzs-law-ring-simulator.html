<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楞次定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: grab; }
        .canvas-container:active { cursor: grabbing; }
        .meter-gradient {
            background: linear-gradient(90deg, #ef4444 0%, #1e293b 50%, #10b981 100%);
        }
        canvas { border-radius: 1.5rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const CENTER_X = CANVAS_WIDTH / 2;
    const COIL_Y = CANVAS_HEIGHT / 2;
    const COIL_RADIUS = 100;
    const MAGNET_W = 60;
    const MAGNET_H = 140;

    const App = () => {
        // --- 狀態 ---
        const [magnetY, setMagnetY] = useState(100); 
        const [polarity, setPolarity] = useState('N_DOWN'); // 'N_DOWN' 或 'S_DOWN'
        const [isDropping, setIsDropping] = useState(false);
        const [showField, setShowField] = useState(true);
        const [showForces, setShowForces] = useState(true);
        
        // 物理數據
        const [inducedCurrent, setInducedCurrent] = useState(0); 
        const [magnetVel, setMagnetVel] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const physicsRef = useRef({
            y: 100, v: 0, dragging: false
        });

        // --- 物理運算 ---
        const calculateInduction = (y, v) => {
            const dy = y - COIL_Y;
            // 使用高斯導數模擬磁通量變化率
            const dist = (dy / 100);
            const rateOfChange = -dist * Math.exp(-(dist * dist)) * 6; 
            
            // ε ∝ - dΦ/dt
            let emf = -rateOfChange * v;
            
            // 考慮極性
            if (polarity === 'S_DOWN') emf = -emf;
            return emf;
        };

        const resetSim = () => {
            setIsDropping(false);
            physicsRef.current = { y: 100, v: 0, dragging: false };
            setMagnetY(100);
            setMagnetVel(0);
            setInducedCurrent(0);
        };

        const dropMagnet = () => {
            if (isDropping) return;
            setIsDropping(true);
            physicsRef.current.v = 0; 
        };

        const loop = () => {
            const state = physicsRef.current;
            if (isDropping) {
                const G = 0.45; // 模擬重力
                
                // 磁力剎車 (Magnetic Braking)
                const dy = state.y - COIL_Y;
                const sensitivity = (dy/100) * Math.exp(-(dy*dy)/(100*100));
                const brakingForce = 2.5 * (sensitivity * sensitivity) * state.v;
                
                state.v += G - brakingForce; 
                state.y += state.v;

                if (state.y > CANVAS_HEIGHT + 250) {
                    setIsDropping(false);
                    resetSim();
                    return;
                }
            }
            
            const current = calculateInduction(state.y, state.v);
            setMagnetY(state.y);
            setMagnetVel(state.v);
            setInducedCurrent(current);

            requestRef.current = requestAnimationFrame(loop);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [isDropping, polarity]);

        // --- 互動處理 ---
        const handleMouseDown = (e) => {
            if (isDropping) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
            
            if (Math.abs(x - CENTER_X) < MAGNET_W/2 + 25 && Math.abs(y - physicsRef.current.y) < MAGNET_H/2 + 25) {
                physicsRef.current.dragging = true;
            }
        };

        const handleMouseMove = (e) => {
            if (physicsRef.current.dragging) {
                const rect = canvasRef.current.getBoundingClientRect();
                const y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
                // 計算拖動速度
                physicsRef.current.v = y - physicsRef.current.y;
                physicsRef.current.y = y;
            }
        };

        const handleMouseUp = () => physicsRef.current.dragging = false;

        // --- 渲染功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const my = magnetY, cx = CENTER_X, cy = COIL_Y;

            // 1. 繪製背景與磁場線
            if (showField) drawFieldLines(ctx, cx, my, polarity);

            // 2. 繪製金屬環 (後半部分)
            ctx.beginPath();
            ctx.ellipse(cx, cy, COIL_RADIUS, COIL_RADIUS * 0.35, 0, Math.PI, 2*Math.PI);
            ctx.lineWidth = 12; ctx.strokeStyle = '#1e293b'; ctx.stroke();
            ctx.lineWidth = 8; ctx.strokeStyle = '#b45309'; ctx.stroke();

            // 3. 繪製磁鐵
            drawMagnet(ctx, cx, my, polarity);

            // 4. 繪製金屬環 (前半部分)
            ctx.beginPath();
            ctx.ellipse(cx, cy, COIL_RADIUS, COIL_RADIUS * 0.35, 0, 0, Math.PI);
            ctx.lineWidth = 12; ctx.strokeStyle = '#334155'; ctx.stroke();
            ctx.lineWidth = 8; ctx.strokeStyle = '#b45309'; ctx.stroke();

            // 5. 繪製感應電流與效果
            if (Math.abs(inducedCurrent) > 0.4) {
                const intensity = Math.min(1, Math.abs(inducedCurrent) / 10);
                const dir = inducedCurrent > 0 ? 1 : -1;
                drawCurrentArrows(ctx, cx, cy, COIL_RADIUS, COIL_RADIUS*0.35, dir, `rgba(250, 204, 21, ${intensity})`);
                drawBulb(ctx, cx + COIL_RADIUS + 50, cy, intensity);
                
                // 顯示感應出的磁極 (楞次定律核心)
                const label = inducedCurrent > 0 ? "N" : "S";
                const color = inducedCurrent > 0 ? "#ef4444" : "#3b82f6";
                ctx.save(); ctx.globalAlpha = intensity; ctx.fillStyle = color; ctx.font = 'bold 44px Inter'; ctx.textAlign = 'center';
                ctx.fillText(label, cx, cy + 15); ctx.restore();
            } else {
                drawBulb(ctx, cx + COIL_RADIUS + 50, cy, 0);
            }

            // 6. 繪製力向量
            if (showForces && Math.abs(inducedCurrent) > 1.2) {
                const fDir = -Math.sign(magnetVel);
                const fMag = Math.abs(inducedCurrent) * 6;
                drawArrow(ctx, cx + MAGNET_W/2 + 25, my, 0, fDir * fMag, '#10b981', '磁力 (F_magnetic)');
            }
        };

        const drawMagnet = (ctx, x, y, pol) => {
            const w = MAGNET_W, h = MAGNET_H;
            const topC = pol === 'N_DOWN' ? '#3b82f6' : '#ef4444';
            const botC = pol === 'N_DOWN' ? '#ef4444' : '#3b82f6';
            ctx.fillStyle = topC; ctx.fillRect(x - w/2, y - h/2, w, h/2);
            ctx.fillStyle = botC; ctx.fillRect(x - w/2, y, w, h/2);
            ctx.fillStyle = 'white'; ctx.font = 'bold 22px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(pol === 'N_DOWN' ? 'S' : 'N', x, y - h/4);
            ctx.fillText(pol === 'N_DOWN' ? 'N' : 'S', x, y + h/4);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(x - w/2, y - h/2, w, h);
        };

        const drawFieldLines = (ctx, x, y, pol) => {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)'; ctx.lineWidth = 1.5;
            const isNDown = pol === 'N_DOWN';
            for(let i=1; i<=3; i++) {
                const offset = i * 45;
                ctx.beginPath(); ctx.moveTo(x + 15, y - 60); ctx.bezierCurveTo(x + 50 + offset, y - 100, x + 50 + offset, y + 100, x + 15, y + 60); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - 15, y - 60); ctx.bezierCurveTo(x - 50 - offset, y - 100, x - 50 - offset, y + 100, x - 15, y + 60); ctx.stroke();
                // 箭頭
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                const aDir = isNDown ? -1 : 1;
                drawArrowTip(ctx, x + 50 + offset*0.8, y, 0, aDir * 10);
                drawArrowTip(ctx, x - (50 + offset*0.8), y, 0, aDir * 10);
            }
        };

        const drawCurrentArrows = (ctx, x, y, rx, ry, dir, color) => {
            ctx.fillStyle = color;
            for (let i = 1; i <= 3; i++) {
                const angle = Math.PI * (i/4);
                const px = x + rx * Math.cos(angle), py = y + ry * Math.sin(angle);
                let tx = -rx * Math.sin(angle), ty = ry * Math.cos(angle);
                const len = Math.sqrt(tx*tx + ty*ty);
                drawArrowTip(ctx, px, py, (tx/len) * 16 * dir, (ty/len) * 16 * dir);
            }
        };

        const drawArrowTip = (ctx, px, py, vx, vy) => {
            ctx.beginPath(); ctx.moveTo(px + vx, py + vy); 
            ctx.lineTo(px - vy*0.5, py + vx*0.5); ctx.lineTo(px + vy*0.5, py - vx*0.5); ctx.fill();
        };

        const drawArrow = (ctx, x, y, dx, dy, color, label) => {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
            const angle = Math.atan2(dy, dx);
            ctx.beginPath(); ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - 12 * Math.cos(angle - Math.PI/6), y + dy - 12 * Math.sin(angle - Math.PI/6));
            ctx.lineTo(x + dx - 12 * Math.cos(angle + Math.PI/6), y + dy - 12 * Math.sin(angle + Math.PI/6));
            ctx.fill();
            if (label) { ctx.font = 'bold 12px Inter'; ctx.fillText(label, x + dx + 12, y + dy + 4); }
        };

        const drawBulb = (ctx, x, y, alpha) => {
            ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x - 50, y); ctx.lineTo(x, y); ctx.stroke();
            if (alpha > 0) {
                const g = ctx.createRadialGradient(x, y, 10, x, y, 60);
                g.addColorStop(0, `rgba(251, 191, 36, ${alpha})`); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 60, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = `rgba(255, 255, 255, 0.25)`; ctx.strokeStyle = '#fff';
            ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = alpha > 0.1 ? '#fde047' : '#444';
            ctx.beginPath(); ctx.moveTo(x-6, y+12); ctx.lineTo(x-6, y-5); ctx.lineTo(x+6, y-5); ctx.lineTo(x+6, y+12); ctx.stroke();
        };

        useEffect(() => { draw(); });

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-cyan-500/20 p-2 rounded-lg text-cyan-400"><i data-lucide="magnet"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">楞次定律實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Induction</div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-full object-contain canvas-container" />
                            <div className="absolute top-6 left-6 bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 backdrop-blur-md shadow-lg">
                                <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">感應電流方向</div>
                                <div className={`text-xl font-black font-mono ${Math.abs(inducedCurrent) > 1 ? 'text-yellow-400 animate-pulse' : 'text-slate-600'}`}>
                                    {inducedCurrent > 1 ? "↺ 逆時針 (CCW)" : inducedCurrent < -1 ? "↻ 順時針 (CW)" : "無感應"}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-8 items-center justify-between">
                            <div className="flex gap-4">
                                <button onClick={() => setPolarity(p => p === 'N_DOWN' ? 'S_DOWN' : 'N_DOWN')} className="px-6 py-3 rounded-2xl font-bold text-sm bg-slate-700 hover:bg-slate-600 border border-slate-500 transition-all flex items-center gap-2 active:scale-95 shadow-lg">
                                    <i data-lucide="refresh-cw"></i> 翻轉磁極 ({polarity === 'N_DOWN' ? 'N極朝下' : 'S極朝下'})
                                </button>
                                <button onClick={dropMagnet} disabled={isDropping} className={`px-10 py-3 rounded-2xl font-bold shadow-xl transition-all active:scale-95 flex items-center gap-2 ${isDropping ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'}`}>
                                    <i data-lucide="arrow-down"></i> 釋放磁鐵
                                </button>
                                <button onClick={resetSim} className="p-3 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl transition-all active:rotate-180"><i data-lucide="rotate-ccw"></i></button>
                            </div>
                            <div className="flex gap-4 p-2 bg-slate-950/50 rounded-2xl border border-slate-700">
                                <label className="flex items-center gap-2 cursor-pointer px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors">
                                    <input type="checkbox" checked={showField} onChange={() => setShowField(!showField)} className="w-5 h-5 rounded border-slate-600 text-cyan-600 focus:ring-0 cursor-pointer" />
                                    <span className="text-xs font-bold text-slate-400">磁場</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors border-l border-slate-700">
                                    <input type="checkbox" checked={showForces} onChange={() => setShowForces(!showForces)} className="w-5 h-5 rounded border-slate-600 text-emerald-600 focus:ring-0 cursor-pointer" />
                                    <span className="text-xs font-bold text-slate-400">磁力</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl flex flex-col items-center">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-700 pb-4 w-full">
                                <i data-lucide="gauge" className="text-indigo-400"></i> 檢流計 (G)
                            </h2>
                            <div className="relative w-full h-32 mb-4 bg-slate-950 rounded-t-full border-t-8 border-slate-700 overflow-hidden shadow-inner">
                                <div className="absolute inset-0 meter-gradient opacity-10"></div>
                                {[...Array(11)].map((_, i) => (
                                    <div key={i} className="absolute bottom-0 left-1/2 w-0.5 h-full bg-slate-700 origin-bottom" style={{transform: `rotate(${(i-5)*15}deg)`}}></div>
                                ))}
                                <div className="absolute bottom-0 left-1/2 w-1.5 h-24 bg-red-500 origin-bottom shadow-[0_0_10px_rgba(239,68,68,0.5)]" style={{transform: `rotate(${Math.max(-75, Math.min(75, inducedCurrent * 6))}deg)`}}></div>
                                <div className="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 w-5 h-5 bg-slate-400 rounded-full border-4 border-slate-800"></div>
                            </div>
                            <div className="flex justify-between w-full text-[10px] font-bold text-slate-600 uppercase tracking-widest px-2"><span>負偏</span><span>0</span><span>正偏</span></div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-6">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 定律解析</h3>
                            <div className="space-y-4">
                                <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                                    <p className="text-xs font-bold text-emerald-400 mb-2">1. 接近中 (Approaching):</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">磁通量增加。線圈頂端產生<b>同性磁極</b>（如 N 遇 N）以產生排斥力阻礙接近。</p>
                                </div>
                                <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                                    <p className="text-xs font-bold text-rose-400 mb-2">2. 遠離中 (Leaving):</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">磁通量減少。線圈頂端產生<b>異性磁極</b>（如 N 遇 S）以產生吸引力阻礙離開。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
