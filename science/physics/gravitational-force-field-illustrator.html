<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬有引力場實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: crosshair; }
        .canvas-container:active { cursor: grabbing; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
        .thumb-purple::-webkit-slider-thumb { border-color: #a855f7; }
        canvas { border-radius: 1rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 500;
    const CANVAS_HEIGHT = 400;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    const G_SCALE = 10000; // 視覺模擬常數

    const App = () => {
        // --- 狀態 ---
        const [massM, setMassM] = useState(50); // 中心質量
        const [massm, setMassm] = useState(10); // 衛星質量
        const [satPos, setSatPos] = useState({ x: 150, y: 0 });
        const [isDragging, setIsDragging] = useState(false);

        const [distance, setDistance] = useState(0);
        const [force, setForce] = useState(0);

        const canvasRef = useRef(null);
        const graphCanvasRef = useRef(null);

        // --- 物理運算 ---
        useEffect(() => {
            const r = Math.sqrt(satPos.x * satPos.x + satPos.y * satPos.y);
            const rSafe = Math.max(r, 35); // 避免過近導致力無限大
            
            // F = G * M * m / r^2
            const f = (G_SCALE * massM * massm) / (rSafe * rSafe);
            
            setDistance(rSafe);
            setForce(f);
        }, [satPos, massM, massm]);

        // --- 互動邏輯 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - CENTER_X;
            const mouseY = e.clientY - rect.top - CENTER_Y;
            if (Math.hypot(mouseX - satPos.x, mouseY - satPos.y) < 30) {
                setIsDragging(true);
            }
        };

        const handleMouseMove = (e) => {
            if (!isDragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            let x = e.clientX - rect.left - CENTER_X;
            let y = e.clientY - rect.top - CENTER_Y;
            const r = Math.hypot(x, y);
            if (r < 45) { // 防止進入天體內部
                const angle = Math.atan2(y, x);
                x = 45 * Math.cos(angle);
                y = 45 * Math.sin(angle);
            }
            if (r > 230) { // 限制在畫布範圍
                const angle = Math.atan2(y, x);
                x = 230 * Math.cos(angle);
                y = 230 * Math.sin(angle);
            }
            setSatPos({ x, y });
        };

        const handleMouseUp = () => setIsDragging(false);

        // --- 渲染功能 ---
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 背景網格 (太空)
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            ctx.beginPath();
            for (let r = 50; r < 300; r += 50) { ctx.arc(CENTER_X, CENTER_Y, r, 0, Math.PI * 2); }
            ctx.stroke();

            // 2. 中心天體 (M)
            const planetR = 20 + (massM / 100) * 18;
            const grad = ctx.createRadialGradient(CENTER_X - 5, CENTER_Y - 5, 2, CENTER_X, CENTER_Y, planetR);
            grad.addColorStop(0, '#60a5fa'); grad.addColorStop(1, '#1d4ed8');
            ctx.fillStyle = grad;
            ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.arc(CENTER_X, CENTER_Y, planetR, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white'; ctx.font = 'bold 14px Inter'; ctx.textAlign = 'center'; ctx.fillText('M', CENTER_X, CENTER_Y + 5);

            // 3. 衛星 (m)
            const sx = CENTER_X + satPos.x, sy = CENTER_Y + satPos.y;
            const satR = 10 + (massm / 20) * 6;

            // 距離指示線
            ctx.beginPath(); ctx.moveTo(CENTER_X, CENTER_Y); ctx.lineTo(sx, sy);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#94a3b8'; ctx.font = '10px JetBrains Mono';
            ctx.fillText(`r=${distance.toFixed(0)}`, (CENTER_X + sx)/2, (CENTER_Y + sy)/2 - 10);

            // 繪製衛星
            ctx.beginPath(); ctx.arc(sx, sy, satR, 0, Math.PI * 2);
            ctx.fillStyle = isDragging ? '#e879f9' : '#c026d3'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = 'white'; ctx.font = 'bold 10px Inter'; ctx.fillText('m', sx, sy + 3.5);

            // 4. 引力向量 (F)
            const angle = Math.atan2(-satPos.y, -satPos.x);
            const arrowLen = Math.min(130, force * 0.22); 
            const arrowW = Math.min(12, 3 + force * 0.025);
            const ex = sx + arrowLen * Math.cos(angle), ey = sy + arrowLen * Math.sin(angle);

            if (arrowLen > 8) {
                ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
                ctx.strokeStyle = '#facc15'; ctx.lineWidth = arrowW; ctx.lineCap = 'round'; ctx.stroke();
                // 箭頭
                const hL = arrowW * 2.5;
                ctx.beginPath(); ctx.moveTo(ex, ey);
                ctx.lineTo(ex - hL * Math.cos(angle - Math.PI/6), ey - hL * Math.sin(angle - Math.PI/6));
                ctx.lineTo(ex - hL * Math.cos(angle + Math.PI/6), ey - hL * Math.sin(angle + Math.PI/6));
                ctx.fillStyle = '#facc15'; ctx.fill();
                ctx.fillText(`F`, sx + (arrowLen + 20) * Math.cos(angle), sy + (arrowLen + 20) * Math.sin(angle));
            }
        }, [massM, massm, satPos, distance, force, isDragging]);

        // --- 繪製 F-r 曲線圖 ---
        useEffect(() => {
            const ctx = graphCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = 300, h = 200, pad = 40;
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pad, 10); ctx.lineTo(pad, h-pad); ctx.lineTo(w-10, h-pad); ctx.stroke();

            ctx.fillStyle = '#94a3b8'; ctx.font = '10px Inter';
            ctx.fillText('距離 r', w - 15, h - 10);
            ctx.save(); ctx.translate(15, 40); ctx.rotate(-Math.PI/2); ctx.fillText('引力 F', 0, 0); ctx.restore();

            const maxPlotF = (G_SCALE * massM * massm) / (50 * 50);
            ctx.beginPath(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            let first = true;
            for (let r = 40; r <= 230; r+=2) {
                const f = (G_SCALE * massM * massm) / (r * r);
                const px = pad + ((r - 40) / 190) * (w - pad - 20);
                const py = (h - pad) - (f / maxPlotF) * (h - pad - 20);
                if (py < 10) continue;
                if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
            }
            ctx.stroke();

            const cx = pad + ((distance - 40) / 190) * (w - pad - 20);
            const cy = (h - pad) - (force / maxPlotF) * (h - pad - 20);
            if (cy >= 10 && cx < w - 10) {
                ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2);
                ctx.fillStyle = '#facc15'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke();
            }
        }, [massM, massm, distance, force]);

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg text-blue-400">
                            <i data-lucide="orbit"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">萬有引力場實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Universal Gravitation
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-7 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-auto bg-slate-950 rounded-2xl canvas-container touch-none" />
                            <div className="absolute top-6 left-6 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 text-xs text-slate-300 backdrop-blur-md pointer-events-none">
                                拖動<b>紫色衛星 (m)</b> 改變位置
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg uppercase tracking-wider">
                                <i data-lucide="sliders" className="w-5 h-5 text-indigo-400"></i> 物理參數設定
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-blue-400 uppercase mb-3">中心質量 (M) <span>{massM} 單位</span></label>
                                    <input type="range" min="10" max="100" step="5" value={massM} onChange={(e) => setMassM(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                </div>
                                <div>
                                    <label className="flex justify-between text-xs font-bold text-purple-400 uppercase mb-3">衛星質量 (m) <span>{massm} 單位</span></label>
                                    <input type="range" min="1" max="20" step="1" value={massm} onChange={(e) => setMassm(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-purple" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-5 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl text-center">
                            <h2 className="text-white font-bold mb-6 flex items-center justify-center gap-2 text-lg">
                                <i data-lucide="function-square" className="text-indigo-400"></i> 萬有引力定律
                            </h2>
                            <div className="bg-slate-950 p-6 rounded-2xl border border-slate-700 inline-block mb-6 shadow-inner">
                                <div className="text-2xl font-serif text-white tracking-widest">
                                    F = G &middot; <span className="text-blue-400">M</span><span className="text-purple-400">m</span> / <span className="text-emerald-400">r²</span>
                                </div>
                            </div>
                            <div className="text-slate-400 text-sm font-bold">
                                當前引力：<span className="text-yellow-400 font-mono text-3xl ml-2 font-black">{force.toFixed(0)} N</span>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-4">
                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest flex justify-between items-center px-1">
                                <span>力 - 距離關係圖</span>
                                <span className="text-blue-400 italic">平方反比定律</span>
                            </h3>
                            <canvas ref={graphCanvasRef} width={300} height={200} className="w-full h-auto rounded-xl border border-slate-700 bg-slate-900" />
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/20 p-6 rounded-3xl shadow-inner">
                            <h3 className="text-indigo-300 font-bold text-sm mb-3 flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 現象觀察</h3>
                            <p className="text-xs text-slate-400 leading-relaxed italic">
                                注意看黃色箭頭（引力）：當你將衛星距離 $r$ 縮減一半時，引力並非增加兩倍，而是增加了 <b>4 倍</b> ($2^2 = 4$)。這就是平方反比的神奇規律。
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
