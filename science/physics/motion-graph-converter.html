<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動線圖轉換器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        canvas { touch-action: none; }
        .graph-grid {
            background-image: 
                linear-gradient(to right, #1e293b 1px, transparent 1px),
                linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 600;
    const GRAPH_HEIGHT = 180;
    const TIME_TOTAL = 10; 
    const POINTS_COUNT = 6; 

    const App = () => {
        const [controlPoints, setControlPoints] = useState(
            Array.from({ length: POINTS_COUNT }, (_, i) => ({
                t: i * (TIME_TOTAL / (POINTS_COUNT - 1)),
                s: i === 0 ? 0 : 20 + i * 10
            }))
        );
        
        const [time, setTime] = useState(0);
        const [isPlaying, setIsPlaying] = useState(false);
        const [draggingIdx, setDraggingIdx] = useState(null);
        const [graphData, setGraphData] = useState({ s: [], v: [], a: [] });

        const canvasRefS = useRef(null);
        const canvasRefV = useRef(null);
        const canvasRefA = useRef(null);
        const requestRef = useRef();

        const calculateGraphData = () => {
            const steps = 200;
            const dt = TIME_TOTAL / steps;
            const sData = [];
            const vData = [];
            const aData = [];

            const getS = (t) => {
                const segmentWidth = TIME_TOTAL / (POINTS_COUNT - 1);
                const idx = Math.min(POINTS_COUNT - 2, Math.floor(t / segmentWidth));
                const t0 = controlPoints[idx].t;
                const t1 = controlPoints[idx+1].t;
                const localT = (t - t0) / (t1 - t0);
                
                const p0 = controlPoints[Math.max(0, idx - 1)];
                const p1 = controlPoints[idx];
                const p2 = controlPoints[idx + 1];
                const p3 = controlPoints[Math.min(POINTS_COUNT - 1, idx + 2)];

                const t2 = localT * localT;
                const t3 = t2 * localT;
                const v0 = (p2.s - p0.s) * 0.5;
                const v1 = (p3.s - p1.s) * 0.5;

                const h1 = 2*t3 - 3*t2 + 1;
                const h2 = -2*t3 + 3*t2;
                const h3 = t3 - 2*t2 + localT;
                const h4 = t3 - t2;

                return h1*p1.s + h2*p2.s + h3*v0 + h4*v1;
            };

            for (let i = 0; i <= steps; i++) {
                sData.push(getS((i / steps) * TIME_TOTAL));
            }

            for (let i = 0; i < sData.length; i++) {
                if (i === 0) vData.push((sData[1] - sData[0]) / dt);
                else if (i === sData.length - 1) vData.push((sData[i] - sData[i-1]) / dt);
                else vData.push((sData[i+1] - sData[i-1]) / (2 * dt));
            }

            for (let i = 0; i < vData.length; i++) {
                if (i === 0) aData.push((vData[1] - vData[0]) / dt);
                else if (i === vData.length - 1) aData.push((vData[i] - vData[i-1]) / dt);
                else aData.push((vData[i+1] - vData[i-1]) / (2 * dt));
            }

            setGraphData({ s: sData, v: vData, a: aData });
        };

        useEffect(() => { calculateGraphData(); }, [controlPoints]);

        const handleMouseDown = (e) => {
            const rect = canvasRefS.current.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const clickT = (x / CANVAS_WIDTH) * TIME_TOTAL;
            const closestIdx = controlPoints.reduce((bestIdx, pt, idx) => {
                return Math.abs(pt.t - clickT) < Math.abs(controlPoints[bestIdx].t - clickT) ? idx : bestIdx;
            }, 0);
            if (Math.abs(controlPoints[closestIdx].t - clickT) < 0.5) setDraggingIdx(closestIdx);
        };

        const handleMouseMove = (e) => {
            if (draggingIdx === null) return;
            const rect = canvasRefS.current.getBoundingClientRect();
            let y = e.clientY - rect.top;
            const sRange = 140; const sOffset = 20;
            const s = sRange - (y / GRAPH_HEIGHT) * sRange - sOffset;
            setControlPoints(prev => {
                const next = [...prev];
                next[draggingIdx] = { ...next[draggingIdx], s: s };
                return next;
            });
        };

        useEffect(() => {
            if (isPlaying) {
                const startTime = Date.now() - time * 1000;
                const loop = () => {
                    let t = (Date.now() - startTime) / 1000;
                    if (t > TIME_TOTAL) { t = TIME_TOTAL; setIsPlaying(false); }
                    setTime(t);
                    if (t < TIME_TOTAL) requestRef.current = requestAnimationFrame(loop);
                };
                requestRef.current = requestAnimationFrame(loop);
            }
            return () => cancelAnimationFrame(requestRef.current);
        }, [isPlaying]);

        const drawGraph = (ctx, data, color, label, unit, minVal, maxVal, showControlPoints = false) => {
            ctx.clearRect(0, 0, CANVAS_WIDTH, GRAPH_HEIGHT);
            const zeroY = GRAPH_HEIGHT - ((0 - minVal) / (maxVal - minVal)) * GRAPH_HEIGHT;
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(CANVAS_WIDTH, zeroY); ctx.stroke();
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 10px sans-serif';
            ctx.fillText(`${label} (${unit})`, 10, 20);

            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
            const stepX = CANVAS_WIDTH / (data.length - 1);
            data.forEach((val, i) => {
                const x = i * stepX;
                const y = GRAPH_HEIGHT - ((val - minVal) / (maxVal - minVal)) * GRAPH_HEIGHT;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            if (showControlPoints) {
                controlPoints.forEach((p, i) => {
                    const x = (p.t / TIME_TOTAL) * CANVAS_WIDTH;
                    const y = GRAPH_HEIGHT - ((p.s - minVal) / (maxVal - minVal)) * GRAPH_HEIGHT;
                    ctx.fillStyle = i === draggingIdx ? '#fff' : color;
                    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                });
            }

            const timeX = (time / TIME_TOTAL) * CANVAS_WIDTH;
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(timeX, 0); ctx.lineTo(timeX, GRAPH_HEIGHT); ctx.stroke(); ctx.setLineDash([]);
            const idx = Math.floor((time / TIME_TOTAL) * (data.length - 1));
            const currentVal = data[idx] || 0;
            const curY = GRAPH_HEIGHT - ((currentVal - minVal) / (maxVal - minVal)) * GRAPH_HEIGHT;
            ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(timeX, curY, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText(currentVal.toFixed(1), timeX + 5, curY - 5);
        };

        useEffect(() => {
            if (!canvasRefS.current || !canvasRefV.current || !canvasRefA.current) return;
            drawGraph(canvasRefS.current.getContext('2d'), graphData.s, '#3b82f6', '位移 Displacement', 'm', -20, 120, true);
            drawGraph(canvasRefV.current.getContext('2d'), graphData.v, '#10b981', '速度 Velocity', 'm/s', -30, 30);
            drawGraph(canvasRefA.current.getContext('2d'), graphData.a, '#ef4444', '加速度 Acceleration', 'm/s²', -20, 20);
        }, [graphData, time, draggingIdx, controlPoints]);

        const carPos = graphData.s[Math.floor((time / TIME_TOTAL) * (graphData.s.length - 1))] || 0;

        return (
            <div className="min-h-screen bg-slate-900 pb-12 font-sans text-slate-200" onMouseMove={handleMouseMove} onMouseUp={() => setDraggingIdx(null)} onMouseLeave={() => setDraggingIdx(null)}>
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-lg">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-600 p-2 rounded-lg"><i data-lucide="activity" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">運動線圖轉換器</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-indigo-400 border border-slate-700 uppercase">DSE Physics: Kinematics</div>
                </nav>

                <main className="max-w-5xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-8 space-y-4">
                        <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden relative group shadow-xl">
                            <div className="absolute top-2 right-2 text-[10px] text-blue-400 font-black bg-slate-950/80 px-3 py-1 rounded-full uppercase tracking-widest z-10 border border-blue-900/50">編輯模式：拖動圓點修改 s-t 圖</div>
                            <canvas ref={canvasRefS} width={CANVAS_WIDTH} height={GRAPH_HEIGHT} onMouseDown={handleMouseDown} className="w-full h-auto cursor-ns-resize graph-grid bg-slate-950" />
                        </div>
                        <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden relative shadow-lg">
                            <div className="absolute top-2 right-2 text-[10px] text-emerald-400 font-black bg-slate-950/80 px-3 py-1 rounded-full uppercase tracking-widest z-10 border border-emerald-900/50">s-t 圖的斜率</div>
                            <canvas ref={canvasRefV} width={CANVAS_WIDTH} height={GRAPH_HEIGHT} className="w-full h-auto graph-grid bg-slate-950" />
                        </div>
                        <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden relative shadow-lg">
                            <div className="absolute top-2 right-2 text-[10px] text-red-400 font-black bg-slate-950/80 px-3 py-1 rounded-full uppercase tracking-widest z-10 border border-red-900/50">v-t 圖的斜率</div>
                            <canvas ref={canvasRefA} width={CANVAS_WIDTH} height={GRAPH_HEIGHT} className="w-full h-auto graph-grid bg-slate-950" />
                        </div>
                    </div>

                    <aside className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                            <h3 className="text-white font-bold mb-4 flex items-center gap-2"><i data-lucide="car" className="w-5 h-5 text-yellow-400"></i> 動態視覺化</h3>
                            <div className="bg-slate-950 rounded-xl h-64 relative border border-slate-800 overflow-hidden">
                                <div className="absolute left-1/2 top-0 bottom-0 w-px bg-slate-800 border-l border-dashed border-slate-700"></div>
                                <div className="absolute top-1/2 left-0 right-0 h-px bg-slate-800"></div>
                                <div className="absolute left-2 bottom-4 text-[10px] text-slate-600 font-bold">0m 基位</div>
                                <div className="absolute left-1/2 bottom-4 w-full border-b border-slate-800"></div>
                                <div className="absolute left-1/2 w-10 h-16 -ml-5 bg-indigo-600 rounded-lg shadow-[0_0_20px_rgba(79,70,229,0.4)] flex items-center justify-center transition-transform duration-75 ease-linear border border-indigo-400/30" style={{ bottom: '20px', transform: `translateY(${-carPos * 2}px)` }}>
                                    <i data-lucide="chevrons-up" className="text-white/30 w-5 h-5"></i>
                                </div>
                                <div className="absolute bottom-2 right-3 text-xs font-mono text-indigo-400 font-bold">位移: {carPos.toFixed(1)}m</div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <button onClick={() => setIsPlaying(!isPlaying)} className={`w-full py-4 rounded-xl font-black uppercase text-xs tracking-widest flex items-center justify-center transition-all ${isPlaying ? 'bg-red-500/20 text-red-400 border border-red-500/50 shadow-inner' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/20'}`}>
                                <i data-lucide={isPlaying ? "pause" : "play"} className="w-5 h-5 mr-2"></i> {isPlaying ? "暫停模擬" : "啟動模擬"}
                            </button>
                            <button onClick={() => { setIsPlaying(false); setTime(0); }} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl font-bold border border-slate-700 transition-colors flex items-center justify-center text-xs tracking-widest"><i data-lucide="rotate-ccw" className="w-4 h-4 mr-2"></i> 重設時間</button>
                        </div>

                        <div className="bg-blue-900/10 border border-blue-500/20 p-5 rounded-2xl">
                            <h4 className="text-blue-400 text-xs font-bold mb-3 uppercase tracking-wider flex items-center gap-2"><i data-lucide="info" className="w-4 h-4"></i> 操作說明</h4>
                            <ul className="space-y-3 text-[11px] text-slate-400 font-medium">
                                <li className="flex gap-2"><span className="text-blue-500">●</span> 拖動最上方 <strong>s-t 圖</strong> 中的藍色圓點，定義物體的位移路徑。</li>
                                <li className="flex gap-2"><span className="text-emerald-500">●</span> 速度 (v) 與 加速度 (a) 將根據數學斜率<strong>自動計算</strong>生成。</li>
                                <li className="flex gap-2"><span className="text-indigo-500">●</span> 按下「啟動模擬」，觀察中間小車如何隨圖表運動。</li>
                            </ul>
                        </div>
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
</script>
</body>
</html>
