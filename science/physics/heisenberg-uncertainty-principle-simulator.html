<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子測不準原理模擬器 | Luminous Learner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin:0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff; background: #a855f7;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    // 修正：從 window.Recharts 安全獲取組件
    const { ScatterChart, Scatter, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceDot } = window.Recharts;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const CENTER_X = CANVAS_WIDTH / 2;

    const App = () => {
        const [boxWidth, setBoxWidth] = useState(200); 
        const [showMomentum, setShowMomentum] = useState(true);
        const [isPaused, setIsPaused] = useState(false);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const K = 10000; 
        const momentumSpread = K / Math.max(10, boxWidth);

        const animRef = useRef({
            time: 0,
            particles: []
        });

        useEffect(() => {
            const ps = [];
            for(let i=0; i<300; i++) {
                ps.push({
                    x: (Math.random() - 0.5) * boxWidth,
                    y: (Math.random() - 0.5) * 200,
                    phase: Math.random() * Math.PI * 2
                });
            }
            animRef.current.particles = ps;
        }, []);

        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const leftWall = CENTER_X - boxWidth/2;
            const rightWall = CENTER_X + boxWidth/2;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, leftWall, 300);
            ctx.fillRect(rightWall, 0, CANVAS_WIDTH - rightWall, 300);
            
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(leftWall, 0); ctx.lineTo(leftWall, 300);
            ctx.moveTo(rightWall, 0); ctx.lineTo(rightWall, 300);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            const sigma = boxWidth / 4; 
            for (let x = leftWall; x <= rightWall; x+=2) {
                const localX = x - CENTER_X;
                const env = Math.exp( - (localX*localX) / (2*sigma*sigma) );
                const prob = env * env * 150;
                const y = 280 - prob;
                if (x === leftWall) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.lineTo(rightWall, 280); ctx.lineTo(leftWall, 280);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
            ctx.fill();

            const speedFactor = momentumSpread * 0.05;
            animRef.current.particles.forEach(p => {
                if (!isPaused) p.x += (Math.random() - 0.5) * speedFactor;
                if (p.x > boxWidth/2) p.x = boxWidth/2;
                if (p.x < -boxWidth/2) p.x = -boxWidth/2;
                ctx.fillStyle = momentumSpread > 150 ? '#f472b6' : '#fff';
                ctx.beginPath(); ctx.arc(CENTER_X + p.x, 280 - Math.random() * 20, 2, 0, Math.PI*2); ctx.fill();
            });

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText("位置空間 (Position Space)", 20, 30);

            if (showMomentum) {
                const baseY = CANVAS_HEIGHT - 30;
                ctx.strokeStyle = '#64748b';
                ctx.beginPath(); ctx.moveTo(50, baseY); ctx.lineTo(CANVAS_WIDTH-50, baseY); ctx.stroke();
                const sigma_p = 4000 / boxWidth; 
                ctx.beginPath(); ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 3;
                for (let px = 50; px <= CANVAS_WIDTH - 50; px+=2) {
                    const localP = px - CENTER_X;
                    const envP = Math.exp( - (localP*localP) / (2*sigma_p*sigma_p) );
                    const probP = envP * envP * 150;
                    const y = baseY - probP;
                    if (px === 50) ctx.moveTo(px, y); else ctx.lineTo(px, y);
                }
                ctx.stroke();
                ctx.lineTo(CANVAS_WIDTH-50, baseY); ctx.lineTo(50, baseY);
                ctx.fillStyle = 'rgba(168, 85, 247, 0.1)'; ctx.fill();
                ctx.fillStyle = '#fff'; ctx.fillText("動量空間 (Momentum Space)", 20, 340);
            }
        };

        useEffect(() => {
            let frame;
            const loop = () => { draw(); frame = requestAnimationFrame(loop); };
            frame = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(frame);
        }, [boxWidth, showMomentum, isPaused]);

        const graphData = useMemo(() => {
            const data = [];
            for (let x = 10; x <= 400; x+=10) data.push({ x: x, y: K / x });
            return data;
        }, []);

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col">
                <nav className="bg-slate-800 border-b border-slate-700 px-4 h-14 flex items-center justify-between shrink-0">
                    <div className="flex items-center space-x-3">
                        <div className="bg-purple-600 p-1.5 rounded-lg"><i data-lucide="atom" className="w-5 h-5 text-white"></i></div>
                        <h1 className="text-lg font-bold">海森堡測不準原理模擬器</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-purple-400 border border-slate-700">DSE Physics: Atomic World</div>
                </nav>

                <main className="flex-1 grid grid-cols-1 lg:grid-cols-4 overflow-hidden">
                    <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800">
                        <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                        <div className="absolute top-4 right-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700 backdrop-blur shadow-2xl">
                            <div className="text-xl font-mono text-center mb-2 font-bold text-white">Δx &middot; Δp &ge; ℏ/2</div>
                            <div className="grid grid-cols-2 gap-4 text-center">
                                <div>
                                    <div className="text-xs text-slate-500 uppercase">位置不確定性</div>
                                    <div className="text-lg font-mono text-sky-400 font-bold">{boxWidth} <span className="text-[10px]">pm</span></div>
                                </div>
                                <div>
                                    <div className="text-xs text-slate-500 uppercase">動量不確定性</div>
                                    <div className="text-lg font-mono text-purple-400 font-bold">{momentumSpread.toFixed(1)}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <aside className="lg:col-span-1 bg-slate-900 flex flex-col border-l border-slate-800">
                        <div className="h-48 w-full bg-slate-950 border-b border-slate-700 p-2 relative">
                            <ResponsiveContainer width="100%" height="100%">
                                <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: 0 }}>
                                    <XAxis type="number" dataKey="x" domain={[0, 400]} hide />
                                    <YAxis type="number" dataKey="y" domain={[0, 1000]} hide />
                                    <Scatter data={graphData} fill="#4b5563" line shape="circle" />
                                    <ReferenceDot x={boxWidth} y={momentumSpread} r={5} fill="#f43f5e" stroke="white" />
                                </ScatterChart>
                            </ResponsiveContainer>
                            <div className="absolute bottom-2 right-2 text-[8px] text-slate-600 font-mono">Δp vs Δx 反比例圖</div>
                        </div>

                        <div className="p-5 space-y-8 flex-1 overflow-y-auto custom-scroll">
                            <div>
                                <label className="flex justify-between text-xs font-bold text-sky-400 mb-3 uppercase tracking-widest">
                                    容器寬度 (Δx) <span>{boxWidth} pm</span>
                                </label>
                                <input type="range" min="20" max="400" step="5" value={boxWidth} onChange={(e) => setBoxWidth(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase"><span>精確位置</span><span>模糊位置</span></div>
                            </div>

                            <div className="bg-blue-900/10 border border-blue-500/20 p-4 rounded-xl">
                                <h4 className="text-xs font-bold text-blue-400 mb-2 flex items-center gap-2"><i data-lucide="lightbulb" className="w-3 h-3"></i> 直觀理解</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed">當你縮小粒子所在的空間 (&Delta;x &darr;)，它會變得異常「躁動」，可能的動量範圍會大幅增加 (&Delta;p &uarr;)，導致我們更難預測它的運動狀態。</p>
                            </div>

                            <button onClick={() => setIsPaused(!isPaused)} className={`w-full py-4 rounded-xl text-xs font-black uppercase border transition-all flex items-center justify-center gap-2 ${isPaused ? 'bg-amber-600 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                <i data-lucide={isPaused ? "play" : "pause"}></i> {isPaused ? "恢復模擬" : "暫停模擬"}
                            </button>
                        </div>
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 100);
</script>
</body>
</html>
