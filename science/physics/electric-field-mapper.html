<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電場線描繪工具 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .canvas-container { cursor: grab; }
        .canvas-container:active { cursor: grabbing; }
        .noselect { user-select: none; }
        canvas { border-radius: 1.5rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const K_SCALE = 5000; // 電場強度視覺縮放係數

    const App = () => {
        // --- 狀態 ---
        const [charges, setCharges] = useState([
            { id: 1, x: 300, y: 250, q: 1 },  // 正電荷
            { id: 2, x: 500, y: 250, q: -1 }  // 負電荷
        ]);
        
        const [lineDensity, setLineDensity] = useState(8); 
        const [showFieldLines, setShowFieldLines] = useState(true);
        const [showVectors, setShowVectors] = useState(false);
        const [draggingId, setDraggingId] = useState(null);

        const canvasRef = useRef(null);

        // --- 物理計算核心 ---
        
        // 獲取特定點的合電場向量 (Ex, Ey)
        const getFieldAt = (x, y, chargeList) => {
            let Ex = 0;
            let Ey = 0;
            
            chargeList.forEach(c => {
                const dx = x - c.x;
                const dy = y - c.y;
                const r2 = dx*dx + dy*dy;
                const r = Math.sqrt(r2);
                
                if (r < 10) return; // 避免奇異點
                
                // E = k * q / r^2
                const E_mag = (K_SCALE * c.q) / r2;
                Ex += E_mag * (dx / r);
                Ey += E_mag * (dy / r);
            });
            
            return { Ex, Ey };
        };

        // --- 繪圖功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 背景漸層
            const bgGrad = ctx.createRadialGradient(CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 0, CANVAS_WIDTH/2, CANVAS_HEIGHT/2, CANVAS_WIDTH);
            bgGrad.addColorStop(0, '#1e293b');
            bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製向量網格 (Vector Grid)
            if (showVectors) {
                const step = 40;
                ctx.lineWidth = 1;
                for(let x=step/2; x<CANVAS_WIDTH; x+=step) {
                    for(let y=step/2; y<CANVAS_HEIGHT; y+=step) {
                        const { Ex, Ey } = getFieldAt(x, y, charges);
                        const E = Math.sqrt(Ex*Ex + Ey*Ey);
                        
                        if (E > 0.1) {
                            const angle = Math.atan2(Ey, Ex);
                            const len = Math.min(25, E * 1.5);
                            const alpha = Math.min(1, E * 0.12);
                            
                            ctx.strokeStyle = `rgba(148, 163, 184, ${alpha})`;
                            ctx.beginPath();
                            ctx.moveTo(x - Math.cos(angle)*len/2, y - Math.sin(angle)*len/2);
                            ctx.lineTo(x + Math.cos(angle)*len/2, y + Math.sin(angle)*len/2);
                            ctx.stroke();
                            
                            // 繪製小箭頭
                            const hX = x + Math.cos(angle)*len/2;
                            const hY = y + Math.sin(angle)*len/2;
                            ctx.beginPath();
                            ctx.moveTo(hX, hY);
                            ctx.lineTo(hX - 4*Math.cos(angle-Math.PI/6), hY - 4*Math.sin(angle-Math.PI/6));
                            ctx.lineTo(hX - 4*Math.cos(angle+Math.PI/6), hY - 4*Math.sin(angle+Math.PI/6));
                            ctx.fillStyle = `rgba(148, 163, 184, ${alpha})`;
                            ctx.fill();
                        }
                    }
                }
            }

            // 2. 繪製電場線 (Field Lines)
            if (showFieldLines) {
                const stepSize = 4;
                const maxSteps = 500;

                const traceLine = (startX, startY, direction) => {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    let cx = startX;
                    let cy = startY;
                    
                    for (let i=0; i<maxSteps; i++) {
                        const { Ex, Ey } = getFieldAt(cx, cy, charges);
                        const E = Math.sqrt(Ex*Ex + Ey*Ey);
                        if (E === 0) break;
                        
                        cx += (Ex / E) * stepSize * direction;
                        cy += (Ey / E) * stepSize * direction;
                        
                        if (cx < 0 || cx > CANVAS_WIDTH || cy < 0 || cy > CANVAS_HEIGHT) break;
                        
                        let hit = false;
                        for(let c of charges) {
                             if (Math.hypot(cx - c.x, cy - c.y) < 12) { hit = true; break; }
                        }
                        if (hit) break;
                        ctx.lineTo(cx, cy);
                    }
                    ctx.stroke();
                };

                ctx.strokeStyle = 'rgba(250, 204, 21, 0.35)'; // 金色透明線條
                ctx.lineWidth = 1.5;

                // 從正電荷出發追蹤
                charges.filter(c => c.q > 0).forEach(c => {
                    const lines = Math.floor(lineDensity * Math.abs(c.q));
                    for (let i=0; i<lines; i++) {
                        const angle = (i / lines) * Math.PI * 2;
                        traceLine(c.x + 14 * Math.cos(angle), c.y + 14 * Math.sin(angle), 1);
                    }
                });

                // 從負電荷逆向追蹤 (捕獲來自無窮遠處的線)
                charges.filter(c => c.q < 0).forEach(c => {
                    const lines = Math.floor(lineDensity * Math.abs(c.q));
                    for (let i=0; i<lines; i++) {
                        const angle = (i / lines) * Math.PI * 2;
                        traceLine(c.x + 14 * Math.cos(angle), c.y + 14 * Math.sin(angle), -1);
                    }
                });
            }

            // 3. 繪製電荷本體
            charges.forEach(c => {
                const color = c.q > 0 ? '#ef4444' : '#3b82f6';
                const shadow = c.q > 0 ? 'rgba(239, 68, 68, 0.5)' : 'rgba(59, 130, 246, 0.5)';
                
                const g = ctx.createRadialGradient(c.x, c.y, 5, c.x, c.y, 25);
                g.addColorStop(0, shadow); g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(c.x, c.y, 25, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(c.x, c.y, 14, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.fillStyle = 'white'; ctx.font = 'bold 16px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(c.q > 0 ? '+' : '-', c.x, c.y + 1);
            });
        };

        useEffect(() => { draw(); }, [charges, lineDensity, showFieldLines, showVectors]);

        // --- 互動處理 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            for (let i=charges.length-1; i>=0; i--) {
                const c = charges[i];
                if (Math.hypot(x - c.x, y - c.y) < 25) {
                    if (e.shiftKey) { // Shift+點擊 移除
                        setCharges(prev => prev.filter(p => p.id !== c.id));
                        return;
                    }
                    setDraggingId(c.id);
                    return;
                }
            }
        };

        const handleMouseMove = (e) => {
            if (draggingId === null) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            setCharges(prev => prev.map(c => c.id === draggingId ? { ...c, x, y } : c));
        };

        const handleMouseUp = () => setDraggingId(null);

        const addCharge = (q) => {
            setCharges(prev => [...prev, {
                id: Date.now(),
                x: CANVAS_WIDTH / 2 + (Math.random() - 0.5) * 150,
                y: CANVAS_HEIGHT / 2 + (Math.random() - 0.5) * 150,
                q
            }]);
        };

        const reset = () => {
            setCharges([
                { id: 1, x: 300, y: 250, q: 1 },
                { id: 2, x: 500, y: 250, q: -1 }
            ]);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-yellow-500/20 p-2 rounded-lg text-yellow-500">
                            <i data-lucide="zap"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">電場線描繪工具</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Electrostatics (E-Field)
                    </div>
                </nav>

                <main className="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-full object-contain canvas-container touch-none" />
                            <div className="absolute top-6 left-6 bg-slate-900/80 px-5 py-3 rounded-2xl border border-slate-700 text-sm text-slate-300 backdrop-blur-md pointer-events-none flex items-center gap-3 shadow-lg">
                                <i data-lucide="mouse-pointer-2" className="text-yellow-400"></i>
                                拖動電荷移動位置。按住 <b>Shift + 點擊</b> 移除電荷。
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex flex-wrap gap-6 items-center justify-between">
                            <div className="flex gap-3">
                                <button onClick={() => addCharge(1)} className="px-6 py-3 bg-red-600/20 border border-red-500/40 hover:bg-red-600/40 text-red-200 rounded-2xl font-bold flex items-center gap-2 transition-all active:scale-95 shadow-lg shadow-red-900/20">
                                    <i data-lucide="plus-circle"></i> 新增正電荷
                                </button>
                                <button onClick={() => addCharge(-1)} className="px-6 py-3 bg-blue-600/20 border border-blue-500/40 hover:bg-blue-600/40 text-blue-200 rounded-2xl font-bold flex items-center gap-2 transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                                    <i data-lucide="minus-circle"></i> 新增負電荷
                                </button>
                            </div>

                            <div className="flex gap-4 p-2 bg-slate-950/50 rounded-2xl border border-slate-700">
                                <label className="flex items-center gap-2 cursor-pointer px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors">
                                    <input type="checkbox" checked={showFieldLines} onChange={() => setShowFieldLines(!showFieldLines)} className="w-5 h-5 rounded border-slate-600 text-yellow-500 focus:ring-0 cursor-pointer" />
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">電場線</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors border-l border-slate-700">
                                    <input type="checkbox" checked={showVectors} onChange={() => setShowVectors(!showVectors)} className="w-5 h-5 rounded border-slate-600 text-indigo-500 focus:ring-0 cursor-pointer" />
                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">向量網格</span>
                                </label>
                            </div>

                            <button onClick={reset} className="p-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl transition-all active:scale-90 shadow-lg">
                                <i data-lucide="rotate-ccw"></i>
                            </button>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="sliders" className="w-5 h-5 text-indigo-400"></i> 場景參數
                            </h2>
                            <div>
                                <label className="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                                    線條密度 <span>{lineDensity}</span>
                                </label>
                                <input type="range" min="4" max="16" step="2" value={lineDensity} onChange={(e) => setLineDensity(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold italic"><span>簡約</span><span>精細</span></div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/20 border border-indigo-500/30 p-6 rounded-3xl shadow-inner space-y-6">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest">
                                <i data-lucide="lightbulb" className="w-4 h-4"></i> 電場核心概念
                            </h3>
                            <div className="space-y-4">
                                <div>
                                    <p className="text-xs font-bold text-slate-200 mb-1">方向性：</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">電場線始終由正電荷指向負電荷。這代表了正試驗電荷受力的切線方向。</p>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-200 mb-1">場強分佈：</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">線條分佈愈密集的地方，代表電場強度愈大，電荷在該點受到的電力也愈強。</p>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-200 mb-1">特性：</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">電場線永不交叉，因為空間中任何一點的合電場方向是唯一的。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
