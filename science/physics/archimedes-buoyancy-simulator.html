<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿基米德浮力實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        .thumb-cyan::-webkit-slider-thumb { border-color: #06b6d4; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        canvas { border-radius: 1.5rem; background-color: #020617; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 550;
    const WATER_LEVEL = 350; // 水面 Y 坐標
    const GRAVITY = 9.8;

    const MATERIALS = [
        { name: "木塊 (Wood)", density: 600, color: "#a87748" }, // kg/m^3
        { name: "冰塊 (Ice)", density: 917, color: "#bae6fd" },
        { name: "水 (中性)", density: 1000, color: "#3b82f6" },
        { name: "鋁塊 (Aluminum)", density: 2700, color: "#94a3b8" },
        { name: "鐵塊 (Iron)", density: 7874, color: "#64748b" },
        { name: "金塊 (Gold)", density: 19320, color: "#facc15" }
    ];

    const FLUID_DENSITY = 1000; // 水的密度

    const App = () => {
        // --- 狀態 ---
        const [material, setMaterial] = useState("木塊 (Wood)");
        const [volume, setVolume] = useState(0.005); // m^3 (5 公升)
        const [showForces, setShowForces] = useState(true);
        const [isDragging, setIsDragging] = useState(false);
        const [isPaused, setIsPaused] = useState(false); 
        
        // 物理狀態
        const physicsRef = useRef({
            y: 100, 
            vy: 0,
            submergedVol: 0,
            displacedMass: 0
        });

        const canvasRef = useRef(null);
        const requestRef = useRef();

        // 衍生數據
        const currentMat = useMemo(() => MATERIALS.find(m => m.name === material), [material]);
        const mass = currentMat.density * volume; // kg
        const weight = mass * GRAVITY; // N
        const blockSize = Math.pow(volume, 1/3) * 200; // 視覺縮放像素

        // 預測邏輯
        const prediction = useMemo(() => {
            const ratio = currentMat.density / FLUID_DENSITY;
            if (ratio < 1.0) {
                return { 
                    result: "浮起 (FLOATS)", 
                    color: "text-emerald-400", 
                    detail: `浸沒比例：${(ratio * 100).toFixed(1)}%` 
                };
            } else if (ratio > 1.0) {
                return { 
                    result: "下沉 (SINKS)", 
                    color: "text-rose-400", 
                    detail: "100% 浸沒 (沉底)" 
                };
            } else {
                return { 
                    result: "中性浮力", 
                    color: "text-blue-400", 
                    detail: "可在水中任何位置懸浮" 
                };
            }
        }, [currentMat]);

        // --- 物理引擎 ---
        const updatePhysics = () => {
            if (isDragging || isPaused) return; 

            const state = physicsRef.current;
            const bottomY = state.y + blockSize/2;
            
            // 1. 計算浮力
            let submergedH = 0;
            if (bottomY > WATER_LEVEL) {
                submergedH = Math.min(blockSize, bottomY - WATER_LEVEL);
            }
            const ratio = Math.max(0, submergedH / blockSize);
            state.submergedVol = volume * ratio;
            
            const buoyantForce = FLUID_DENSITY * state.submergedVol * GRAVITY;
            state.displacedMass = FLUID_DENSITY * state.submergedVol;

            // 2. 合力與運動更新
            const netForceCanvas = weight - buoyantForce - (state.vy * 10); // 阻尼
            const accCanvas = netForceCanvas / mass;
            
            state.vy += accCanvas * 0.016;
            state.y += state.vy * 0.1;

            // 底部碰撞
            if (state.y + blockSize/2 > CANVAS_HEIGHT - 20) {
                state.y = CANVAS_HEIGHT - 20 - blockSize/2;
                state.vy *= -0.3; // 彈跳
                if (Math.abs(state.vy) < 0.1) state.vy = 0;
            }
        };

        const loop = () => {
            updatePhysics();
            
            if (isDragging || isPaused) {
                const state = physicsRef.current;
                const bottomY = state.y + blockSize/2;
                let submergedH = 0;
                if (bottomY > WATER_LEVEL) {
                    submergedH = Math.min(blockSize, bottomY - WATER_LEVEL);
                }
                const ratio = Math.max(0, submergedH / blockSize);
                state.submergedVol = volume * ratio;
                state.displacedMass = FLUID_DENSITY * state.submergedVol;
            }

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 渲染功能 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const state = physicsRef.current;

            // 1. 水箱
            ctx.fillStyle = 'rgba(56, 189, 248, 0.2)'; 
            ctx.fillRect(100, WATER_LEVEL, 400, CANVAS_HEIGHT - WATER_LEVEL);
            ctx.beginPath();
            ctx.moveTo(100, WATER_LEVEL); ctx.lineTo(500, WATER_LEVEL);
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = '#94a3b8'; ctx.strokeRect(100, WATER_LEVEL - 50, 400, CANVAS_HEIGHT - WATER_LEVEL + 50);

            // 2. 物體
            const x = 300; const y = state.y;
            ctx.fillStyle = currentMat.color;
            ctx.fillRect(x - blockSize/2, y - blockSize/2, blockSize, blockSize);
            ctx.strokeStyle = '#fff'; ctx.strokeRect(x - blockSize/2, y - blockSize/2, blockSize, blockSize);
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
            ctx.fillText(currentMat.name.split(' ')[0], x, y);
            ctx.fillText(`${mass.toFixed(1)} kg`, x, y + 15);

            // 3. 排水計 (排水桶)
            const beakerX = 600, beakerY = 400, beakerW = 100, beakerH = 120;
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
            ctx.strokeRect(beakerX, beakerY - beakerH, beakerW, beakerH);
            
            const maxVol = 0.01; 
            const waterH = (state.displacedMass / FLUID_DENSITY / maxVol) * beakerH;
            if (waterH > 0) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.fillRect(beakerX, beakerY - waterH, beakerW, waterH);
            }
            
            // 溢水導向線
            ctx.beginPath(); ctx.moveTo(500, WATER_LEVEL); ctx.lineTo(beakerX + beakerW/2, WATER_LEVEL);
            ctx.lineTo(beakerX + beakerW/2, beakerY - beakerH - 10);
            ctx.strokeStyle = '#475569'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);

            ctx.fillStyle = '#94a3b8'; ctx.fillText("排開的水重量 (等效質量)", beakerX + beakerW/2, beakerY + 20);
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 16px JetBrains Mono';
            ctx.fillText(`${state.displacedMass.toFixed(2)} kg`, beakerX + beakerW/2, beakerY - beakerH/2);

            // 4. 受力向量
            if (showForces) {
                const fb = state.displacedMass * GRAVITY;
                drawArrow(ctx, x, y, 0, weight * 0.5, '#ef4444', `W = ${weight.toFixed(0)}N`);
                if (fb > 0.5) drawArrow(ctx, x, y, 0, -fb * 0.5, '#10b981', `Fb = ${fb.toFixed(0)}N`);
            }
        };

        const drawArrow = (ctx, x, y, dx, dy, color, label) => {
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len < 5) return;
            const angle = Math.atan2(dy, dx);
            const hL = 10;

            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy);
            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - hL * Math.cos(angle - Math.PI / 6), y + dy - hL * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x + dx - hL * Math.cos(angle + Math.PI / 6), y + dy - hL * Math.sin(angle + Math.PI / 6));
            ctx.fillStyle = color; ctx.fill();
            ctx.font = 'bold 12px Inter'; ctx.textAlign = 'left';
            ctx.fillText(label, x + dx + 10, y + dy);
        };

        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            if (Math.abs(mouseX - 300) < blockSize/2 + 20 && Math.abs(mouseY - physicsRef.current.y) < blockSize/2 + 20) {
                setIsDragging(true);
            }
        };

        const handleMouseMove = (e) => {
            if (isDragging) {
                const rect = canvasRef.current.getBoundingClientRect();
                physicsRef.current.y = e.clientY - rect.top;
                physicsRef.current.vy = 0;
            }
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [material, volume, showForces, isDragging, isPaused]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 h-16 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-cyan-500/20 p-2 rounded-lg text-cyan-400"><i data-lucide="anchor"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">阿基米德浮力實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Buoyancy & Density</div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-4">
                        <div className="lg:col-span-3 bg-slate-950 relative border-r border-slate-800 flex items-center justify-center">
                            <canvas 
                                ref={canvasRef} 
                                width={CANVAS_WIDTH} 
                                height={CANVAS_HEIGHT}
                                className="w-full h-full object-contain cursor-grab active:cursor-grabbing"
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={() => setIsDragging(false)}
                                onMouseLeave={() => setIsDragging(false)}
                            />
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/80 px-6 py-2.5 rounded-full text-xs text-slate-400 backdrop-blur-md border border-slate-700 shadow-xl animate-pulse">
                                點擊並拖動方塊進行實驗！
                            </div>
                        </div>

                        <div className="lg:col-span-1 bg-slate-900 border-l border-slate-800 flex flex-col h-full overflow-y-auto custom-scroll p-6 space-y-8">
                            <div>
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">浮力預測 (物理判定)</h3>
                                <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner space-y-3">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs text-slate-400">狀態：</span>
                                        <span className={`text-lg font-black ${prediction.color}`}>{prediction.result}</span>
                                    </div>
                                    <div className="text-[10px] text-slate-500 border-t border-slate-800 pt-3 italic">
                                        依據：密度比 {currentMat.density} / 1000 kg/m³
                                        <div className="text-slate-400 mt-1">{prediction.detail}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 block">選擇材料</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {MATERIALS.map(m => (
                                            <button key={m.name} onClick={() => setMaterial(m.name)} className={`py-2.5 px-1 text-xs font-bold rounded-xl border transition-all ${material === m.name ? 'bg-cyan-600 border-cyan-400 text-white shadow-lg' : 'bg-slate-800 border-slate-700 text-slate-500 hover:text-slate-300'}`}>
                                                {m.name.split(' ')[0]}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="flex justify-between text-xs font-bold text-cyan-400 uppercase tracking-widest mb-4"><span>物體體積 (V)</span><span className="text-white font-mono bg-slate-950 px-2 py-0.5 rounded">{(volume * 1000).toFixed(1)} L</span></label>
                                    <input type="range" min="0.001" max="0.01" step="0.001" value={volume} onChange={(e) => setVolume(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                                    <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase italic"><span>小體積</span><span>大體積</span></div>
                                </div>

                                <div className="space-y-3 pt-4">
                                    <button onClick={() => setIsPaused(!isPaused)} className={`w-full py-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 border transition-all active:scale-95 shadow-lg ${isPaused ? 'bg-amber-600 border-amber-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                        <i data-lucide={isPaused ? "play" : "pause"}></i> {isPaused ? "恢復物理運作" : "暫停物理運作"}
                                    </button>
                                    <label className="flex items-center justify-between p-4 bg-slate-950/50 rounded-2xl border border-slate-800 cursor-pointer hover:bg-slate-800 transition-colors">
                                        <span className="text-xs font-bold text-slate-400 uppercase">顯示受力向量</span>
                                        <input type="checkbox" checked={showForces} onChange={() => setShowForces(!showForces)} className="w-5 h-5 rounded border-slate-600 text-cyan-500 focus:ring-0 cursor-pointer" />
                                    </label>
                                </div>
                            </div>

                            <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-3xl shadow-inner mt-auto">
                                <h4 className="text-indigo-400 font-bold text-[10px] uppercase mb-2 flex items-center gap-2"><i data-lucide="lightbulb" className="w-3 h-3"></i> 實驗提示</h4>
                                <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                    你可以<b>暫停模擬</b>並手動拖動方塊。觀察當方塊浸沒越多時，排開的水重以及「綠色向上箭頭（浮力）」是如何同步增加的！
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
