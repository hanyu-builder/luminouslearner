<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超聲波掃描實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-y: hidden; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .scan-line {
            background: linear-gradient(to bottom, rgba(16, 185, 129, 0) 0%, rgba(16, 185, 129, 0.8) 100%);
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 400; // 組織畫布寬度
    const CANVAS_HEIGHT = 400; // 組織畫布高度
    const GRAPH_HEIGHT = 200; // A-Scan 示波器高度

    const App = () => {
        // --- 狀態管理 ---
        const [probeX, setProbeX] = useState(50); // 0 到 100%
        const [gain, setGain] = useState(50); // 增益放大
        const [isSweeping, setIsSweeping] = useState(false);
        const [showTissue, setShowTissue] = useState(false); // 隱藏/顯示「標準答案」
        
        // 畫布 Refs
        const tissueCanvasRef = useRef(null);
        const aScanCanvasRef = useRef(null);
        const bScanCanvasRef = useRef(null);
        const requestRef = useRef();
        
        // B-Scan 記憶體數據
        const bScanMemory = useRef(new Array(101).fill(null));

        // --- 物理邏輯：光線追蹤 ---
        const getIntersections = (xPct) => {
            const x = xPct * CANVAS_WIDTH / 100;
            const intersections = [];
            
            // 1. 皮膚表面 (始終在 y=20)
            intersections.push({ y: 20, strength: 0.8 });

            // 2. 肌肉層邊界 (y=120)
            intersections.push({ y: 120, strength: 0.4 });

            // 3. 圓形物體 (腫瘤/器官)
            // 圓心 (200, 250)，半徑 60
            const cx = 200, cy = 250, r = 60;
            if (Math.abs(x - cx) < r) {
                const dy = Math.sqrt(r*r - (x-cx)*(x-cx));
                // 上表面
                intersections.push({ y: cy - dy, strength: 0.7 });
                // 下表面
                intersections.push({ y: cy + dy, strength: 0.5 });
            }

            // 4. 骨骼/底部邊界 (y=380)
            intersections.push({ y: 380, strength: 0.9 });

            return intersections.sort((a, b) => a.y - b.y);
        };

        // --- 模擬循環 ---
        const loop = () => {
            // 自動掃描邏輯
            if (isSweeping) {
                setProbeX(prev => {
                    if (prev >= 100) {
                        setIsSweeping(false);
                        return 100;
                    }
                    return prev + 0.5;
                });
            }

            drawTissue();
            drawAScan();
            drawBScan();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 1. 繪製組織 (現實狀況) ---
        const drawTissue = () => {
            const ctx = tissueCanvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if (showTissue) {
                // 繪製分層
                ctx.fillStyle = '#334155'; ctx.fillRect(0, 20, CANVAS_WIDTH, 100);
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 120, CANVAS_WIDTH, 260);
                ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 380, CANVAS_WIDTH, 20);

                // 繪製腫瘤/器官
                ctx.beginPath();
                ctx.arc(200, 250, 60, 0, Math.PI * 2);
                ctx.fillStyle = '#9f1239'; ctx.fill();
                ctx.strokeStyle = '#f43f5e'; ctx.stroke();
            } else {
                // 隱藏模式提示
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 20, CANVAS_WIDTH, 380);
                ctx.fillStyle = '#334155';
                ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("人體組織 (隱藏中)", CANVAS_WIDTH/2, CANVAS_HEIGHT/2);
            }

            // 繪製探頭
            const px = probeX * CANVAS_WIDTH / 100;
            ctx.fillStyle = '#38bdf8'; 
            ctx.fillRect(px - 10, 0, 20, 20);
            
            // 繪製超聲波束
            const grad = ctx.createLinearGradient(0, 20, 0, CANVAS_HEIGHT);
            grad.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
            grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(px - 2, 20, 4, CANVAS_HEIGHT);
        };

        // --- 2. 繪製 A-Scan (振幅圖) ---
        const drawAScan = () => {
            const ctx = aScanCanvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, CANVAS_WIDTH, GRAPH_HEIGHT);

            // 網格
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<CANVAS_WIDTH; i+=40) { ctx.moveTo(i, 0); ctx.lineTo(i, GRAPH_HEIGHT); }
            for(let i=0; i<GRAPH_HEIGHT; i+=40) { ctx.moveTo(0, i); ctx.lineTo(CANVAS_WIDTH, i); }
            ctx.stroke();

            // 計算信號
            const intersections = getIntersections(probeX);
            
            ctx.beginPath();
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2;
            ctx.moveTo(0, GRAPH_HEIGHT - 10); 

            // 生成帶雜訊的信號
            for (let x = 0; x < CANVAS_WIDTH; x++) {
                let amp = Math.random() * 2; 
                intersections.forEach(hit => {
                    const dist = Math.abs(x - hit.y);
                    if (dist < 5) {
                        // 高斯波峰
                        amp += hit.strength * gain * Math.exp(-dist*dist/2); 
                    }
                });
                const y = GRAPH_HEIGHT - 10 - Math.min(amp, GRAPH_HEIGHT - 20);
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 標籤
            ctx.fillStyle = '#34d399'; ctx.font = '10px monospace';
            ctx.fillText("振幅 (V)", 10, 20);
            ctx.fillText("時間 / 深度 (t)", CANVAS_WIDTH - 90, GRAPH_HEIGHT - 15);
        };

        // --- 3. 繪製 B-Scan (亮度圖) ---
        const drawBScan = () => {
            const ctx = bScanCanvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 更新當前探頭位置的記憶體
            const colIndex = Math.floor(probeX); 
            if (colIndex >= 0 && colIndex <= 100) {
                const intersections = getIntersections(probeX);
                const strip = new Uint8ClampedArray(CANVAS_HEIGHT); 
                
                for(let y=0; y<CANVAS_HEIGHT; y++) {
                    let brightness = 0;
                    intersections.forEach(hit => {
                        const dist = Math.abs(y - hit.y);
                        if (dist < 4) {
                            brightness += hit.strength * gain * 4 * Math.exp(-dist*dist/4);
                        }
                    });
                    strip[y] = Math.min(255, brightness);
                }
                bScanMemory.current[colIndex] = strip;
            }

            // 從記憶體繪製圖像
            const colWidth = CANVAS_WIDTH / 100;
            bScanMemory.current.forEach((strip, i) => {
                if (!strip) return;
                const x = i * colWidth;
                for(let y=0; y<CANVAS_HEIGHT; y+=2) { 
                    const b = strip[y];
                    if (b > 10) { 
                        ctx.fillStyle = `rgb(${b}, ${b}, ${b})`;
                        ctx.fillRect(x, y, colWidth, 2);
                    }
                }
            });

            // 繪製當前掃描線指示
            const px = probeX * CANVAS_WIDTH / 100;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
            ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, CANVAS_HEIGHT); ctx.stroke();
        };

        const clearScan = () => {
            bScanMemory.current = new Array(101).fill(null);
            setProbeX(0);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        }, [probeX, gain, isSweeping, showTissue]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="h-screen bg-slate-900 text-slate-200 font-sans overflow-hidden flex flex-col">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 h-16 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-emerald-500/20 p-2 rounded-lg text-emerald-400">
                            <i data-lucide="activity"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">超聲波實驗室：A-Scan 與 B-Scan</h1>
                    </div>
                    <div className="text-[10px] text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Medical Physics
                    </div>
                </nav>

                <main className="flex-1 overflow-hidden">
                    <div className="h-full max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-1 p-4 lg:p-6">
                        
                        {/* 左側：組織模擬 (1/3) */}
                        <div className="lg:col-span-4 bg-slate-950 relative border border-slate-800 rounded-3xl overflow-hidden flex flex-col shadow-2xl">
                            <div className="p-3 border-b border-slate-800 bg-slate-900/50 text-center">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">1. 患者組織區</h3>
                            </div>
                            <div className="flex-1 relative flex items-center justify-center p-4">
                                <canvas 
                                    ref={tissueCanvasRef} 
                                    width={CANVAS_WIDTH} 
                                    height={CANVAS_HEIGHT}
                                    className="w-full h-auto max-w-[320px] aspect-square rounded-2xl border border-slate-800 shadow-inner"
                                />
                            </div>
                            <div className="p-6 bg-slate-900/50 border-t border-slate-800 space-y-4">
                                <div>
                                    <label className="flex items-center justify-between text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">
                                        <span>探頭位置 (Probe)</span>
                                        <span className="text-blue-400 font-mono">{probeX.toFixed(0)}%</span>
                                    </label>
                                    <input 
                                        type="range" min="0" max="100" step="0.5" 
                                        value={probeX} onChange={(e) => setProbeX(Number(e.target.value))}
                                        className="w-full h-1.5 bg-slate-700 rounded-lg slider-thumb mb-2 appearance-none" 
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button 
                                        onClick={() => setIsSweeping(!isSweeping)}
                                        className={`py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all ${isSweeping ? 'bg-red-600 text-white animate-pulse' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}
                                    >
                                        <i data-lucide={isSweeping ? "square" : "play"}></i> {isSweeping ? "停止掃描" : "自動掃描"}
                                    </button>
                                    <button 
                                        onClick={() => setShowTissue(!showTissue)}
                                        className="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold text-slate-200 border border-slate-700 flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide={showTissue ? "eye-off" : "eye"}></i> {showTissue ? "隱藏組織" : "揭開真相"}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* 中間：A-Scan (1/3) */}
                        <div className="lg:col-span-4 bg-slate-900 relative border border-slate-800 rounded-3xl overflow-hidden flex flex-col shadow-2xl">
                            <div className="p-3 border-b border-slate-800 bg-slate-900/50 text-center">
                                <h3 className="text-xs font-bold text-emerald-400 uppercase tracking-widest">2. A-Scan (振幅模式)</h3>
                            </div>
                            <div className="flex-1 relative flex flex-col items-center justify-center p-6 gap-6">
                                <div className="w-full max-w-[320px] aspect-[2/1.2] bg-black rounded-xl border-4 border-slate-800 shadow-inner relative overflow-hidden">
                                    <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
                                    <canvas 
                                        ref={aScanCanvasRef} 
                                        width={CANVAS_WIDTH} 
                                        height={GRAPH_HEIGHT}
                                        className="w-full h-full"
                                    />
                                </div>
                                
                                <div className="w-full max-w-[320px] bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-4">
                                    <label className="flex items-center justify-between text-xs font-bold text-emerald-400 uppercase tracking-widest">
                                        <span>信號增益 (Gain)</span>
                                        <span className="font-mono">{gain}%</span>
                                    </label>
                                    <input 
                                        type="range" min="10" max="100" 
                                        value={gain} onChange={(e) => setGain(Number(e.target.value))}
                                        className="w-full h-1.5 bg-slate-800 rounded-lg slider-thumb appearance-none" 
                                    />
                                    <div className="p-3 bg-emerald-500/5 rounded-xl border border-emerald-500/10">
                                        <p className="text-[10px] text-slate-500 leading-relaxed italic text-center">
                                            <b>A-Scan:</b> 一維波形圖。波峰代表聲波在界面反射回來的時間（深度）。常用於測量眼球長度。
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 右側：B-Scan (1/3) */}
                        <div className="lg:col-span-4 bg-slate-900 relative border border-slate-800 rounded-3xl overflow-hidden flex flex-col shadow-2xl">
                            <div className="p-3 border-b border-slate-700 bg-slate-950 text-center">
                                <h3 className="text-xs font-bold text-white uppercase tracking-widest">3. B-Scan (亮度模式)</h3>
                            </div>
                            <div className="flex-1 relative flex flex-col items-center justify-center p-6">
                                <div className="relative group">
                                    <canvas 
                                        ref={bScanCanvasRef} 
                                        width={CANVAS_WIDTH} 
                                        height={CANVAS_HEIGHT}
                                        className="w-full h-auto max-w-[320px] aspect-square rounded-2xl border-4 border-slate-600 bg-black shadow-2xl"
                                    />
                                    <div className="absolute top-0 bottom-0 left-0 w-6 border-r border-white/5 flex flex-col justify-between py-4 text-[8px] text-slate-600 font-mono uppercase tracking-tighter">
                                        <span>0cm</span><span>5cm</span><span>10cm</span>
                                    </div>
                                </div>

                                <button 
                                    onClick={clearScan}
                                    className="mt-6 w-full max-w-[320px] py-3 bg-slate-800 hover:bg-red-900/30 border border-slate-700 hover:border-red-500/30 rounded-xl text-xs font-bold text-slate-400 hover:text-red-400 flex items-center justify-center gap-2 transition-all"
                                >
                                    <i data-lucide="eraser"></i> 清除掃描圖像
                                </button>
                                
                                <div className="mt-6 p-4 bg-slate-950 rounded-2xl border border-slate-800 w-full max-w-[320px] shadow-inner">
                                    <p className="text-[10px] text-slate-500 leading-relaxed italic text-center">
                                        <b>B-Scan:</b> 二維灰階影像。由大量 A-Scan 橫向組合而成。亮點代表強反射介面。常用於產前檢查與內臟成像。
                                    </p>
                                </div>
                            </div>
                        </div>

                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
