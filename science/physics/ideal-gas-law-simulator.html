<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想氣體定律模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
        }
        .slider-thumb-red::-webkit-slider-thumb { border-color: #ef4444; }
        .slider-thumb-green::-webkit-slider-thumb { border-color: #10b981; }
        .slider-thumb-blue::-webkit-slider-thumb { border-color: #3b82f6; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 400;
    const CANVAS_HEIGHT = 400;
    const CONTAINER_WIDTH = 250;
    const CONTAINER_BOTTOM = 350;
    const R_CONSTANT = 8.314; 

    const App = () => {
        const [moles, setMoles] = useState(1.0); 
        const [temp, setTemp] = useState(300);   
        const [volume, setVolume] = useState(5.0); 
        const [pressure, setPressure] = useState(0); 

        const [particles, setParticles] = useState([]);
        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        useEffect(() => {
            const p = (moles * R_CONSTANT * temp) / volume;
            setPressure(p);
        }, [moles, temp, volume]);

        useEffect(() => {
            const targetCount = Math.floor(moles * 50);
            setParticles(prev => {
                const current = [...prev];
                if (current.length < targetCount) {
                    const needed = targetCount - current.length;
                    for(let i=0; i<needed; i++) {
                        current.push({
                            x: CONTAINER_WIDTH/2 + (CANVAS_WIDTH - CONTAINER_WIDTH)/2,
                            y: CONTAINER_BOTTOM - 20,
                            vx: (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 2
                        });
                    }
                } else if (current.length > targetCount) {
                    current.splice(targetCount);
                }
                return current;
            });
        }, [moles]);

        const updatePhysics = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            const cylinderHeight = volume * 30; 
            const pistonY = CONTAINER_BOTTOM - cylinderHeight;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const centerX = CANVAS_WIDTH / 2;
            const leftX = centerX - CONTAINER_WIDTH / 2;

            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 4;
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.fillRect(leftX, pistonY, CONTAINER_WIDTH, cylinderHeight);
            ctx.beginPath();
            ctx.moveTo(leftX, 50); ctx.lineTo(leftX, CONTAINER_BOTTOM);
            ctx.lineTo(leftX + CONTAINER_WIDTH, CONTAINER_BOTTOM);
            ctx.lineTo(leftX + CONTAINER_WIDTH, 50);
            ctx.stroke();

            ctx.fillStyle = '#475569';
            ctx.fillRect(leftX + 2, pistonY - 10, CONTAINER_WIDTH - 4, 10);
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(centerX - 5, pistonY - 100, 10, 90);

            if (temp > 300) {
                const intensity = (temp - 300) / 200;
                ctx.fillStyle = `rgba(239, 68, 68, ${intensity})`;
                ctx.beginPath();
                ctx.moveTo(centerX - 20, CONTAINER_BOTTOM + 5);
                ctx.lineTo(centerX, CONTAINER_BOTTOM - 15);
                ctx.lineTo(centerX + 20, CONTAINER_BOTTOM + 5);
                ctx.fill();
            } else if (temp < 300) {
                const intensity = (300 - temp) / 200;
                ctx.fillStyle = `rgba(59, 130, 246, ${intensity})`;
                ctx.fillRect(leftX, CONTAINER_BOTTOM + 2, CONTAINER_WIDTH, 10);
            }

            const speedFactor = Math.sqrt(temp) / 10;
            ctx.fillStyle = temp > 400 ? '#fca5a5' : temp < 200 ? '#93c5fd' : '#e2e8f0';

            particles.forEach(p => {
                p.x += p.vx * speedFactor;
                p.y += p.vy * speedFactor;
                if (p.x < leftX + 5) { p.x = leftX + 5; p.vx *= -1; }
                if (p.x > leftX + CONTAINER_WIDTH - 5) { p.x = leftX + CONTAINER_WIDTH - 5; p.vx *= -1; }
                if (p.y > CONTAINER_BOTTOM - 5) { p.y = CONTAINER_BOTTOM - 5; p.vy *= -1; }
                if (p.y < pistonY + 5) { p.y = pistonY + 5; p.vy *= -1; }
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });
            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(updatePhysics);
            return () => cancelAnimationFrame(requestRef.current);
        }, [temp, volume, particles]);

        return (
            <div className="min-h-screen bg-slate-900 pb-12 font-sans text-slate-200">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg h-16 shrink-0">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-600 p-2 rounded-lg"><i data-lucide="atom" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">理想氣體定律模擬器</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-indigo-400 border border-slate-700 uppercase">DSE Physics: Thermodynamics</div>
                </nav>

                <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-5 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl relative overflow-hidden bg-black/20">
                            <div className="absolute top-4 left-4 bg-slate-900/90 px-3 py-1 rounded border border-slate-700 text-[10px] font-black text-slate-500 uppercase tracking-widest z-10">密封氣缸 (Chamber)</div>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto" />
                            
                            <div className="absolute top-6 right-6 bg-slate-900/95 p-4 rounded-2xl border border-slate-700 shadow-2xl w-36 text-center ring-1 ring-slate-700">
                                <div className="text-[10px] text-slate-500 uppercase font-black tracking-tighter mb-1">即時壓強 Pressure</div>
                                <div className="text-3xl font-black text-white font-mono">{pressure.toFixed(0)}</div>
                                <div className="text-[10px] text-indigo-400 font-bold uppercase">kPa</div>
                                <div className="w-full h-1 bg-slate-800 rounded-full mt-3 overflow-hidden">
                                    <div className="h-full bg-indigo-500 transition-all duration-300" style={{width: `${Math.min(100, pressure/10)}%`}}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-7 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-black text-[10px] uppercase tracking-[0.2em] mb-6 flex items-center gap-2">
                                <i data-lucide="calculator" className="w-4 h-4 text-indigo-400"></i> 公式實時驗證 (PV = nRT)
                            </h2>
                            <div className="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 font-mono text-xl md:text-2xl bg-slate-950 p-8 rounded-2xl border border-slate-800 ring-1 ring-white/5">
                                <div className="flex items-center gap-2">
                                    <span className="text-indigo-400 font-black">{pressure.toFixed(0)}</span>
                                    <span className="text-slate-600 text-sm font-bold">P</span>
                                    <span className="text-slate-800">×</span>
                                    <span className="text-blue-400 font-black">{volume.toFixed(1)}</span>
                                    <span className="text-slate-600 text-sm font-bold">V</span>
                                </div>
                                <div className="text-slate-700">=</div>
                                <div className="flex items-center gap-2">
                                    <span className="text-emerald-400 font-black">{moles.toFixed(1)}</span>
                                    <span className="text-slate-600 text-sm font-bold">n</span>
                                    <span className="text-slate-800">×</span>
                                    <span className="text-slate-500 font-bold">8.31</span>
                                    <span className="text-slate-600 text-sm font-bold">R</span>
                                    <span className="text-slate-800">×</span>
                                    <span className="text-red-400 font-black">{temp.toFixed(0)}</span>
                                    <span className="text-slate-600 text-sm font-bold">T</span>
                                </div>
                            </div>
                            <div className="flex justify-between mt-4 px-6 text-[10px] font-black uppercase tracking-widest">
                                <div className="text-indigo-500/70">左端 PV 值: {(pressure * volume).toFixed(0)} J</div>
                                <div className="text-emerald-500/70">右端 nRT 值: {(moles * R_CONSTANT * temp).toFixed(0)} J</div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-inner">
                                <div className="flex justify-between items-center mb-4">
                                    <label className="text-slate-400 font-black text-[10px] uppercase tracking-wider">莫耳數 (n)</label>
                                    <span className="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-mono font-bold">{moles} mol</span>
                                </div>
                                <input type="range" min="0.1" max="2.0" step="0.1" value={moles} onChange={(e) => setMoles(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb slider-thumb-green" />
                                <div className="text-[9px] text-slate-500 mt-2 font-bold uppercase">調整粒子總量</div>
                            </div>

                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-inner">
                                <div className="flex justify-between items-center mb-4">
                                    <label className="text-slate-400 font-black text-[10px] uppercase tracking-wider">溫度 (T)</label>
                                    <span className="bg-red-500/20 text-red-400 px-2 py-1 rounded text-[10px] font-mono font-bold">{temp} K</span>
                                </div>
                                <input type="range" min="100" max="500" step="10" value={temp} onChange={(e) => setTemp(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb slider-thumb-red" />
                                <div className="text-[9px] text-slate-500 mt-2 font-bold uppercase">調整粒子平均動能</div>
                            </div>

                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-inner">
                                <div className="flex justify-between items-center mb-4">
                                    <label className="text-slate-400 font-black text-[10px] uppercase tracking-wider">體積 (V)</label>
                                    <span className="bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-[10px] font-mono font-bold">{volume} L</span>
                                </div>
                                <input type="range" min="1.0" max="10.0" step="0.1" value={volume} onChange={(e) => setVolume(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb slider-thumb-blue" />
                                <div className="text-[9px] text-slate-500 mt-2 font-bold uppercase">調整活塞高度</div>
                            </div>
                        </div>

                        <div className="bg-blue-900/10 border border-blue-500/20 p-5 rounded-2xl flex gap-4 items-start shadow-inner">
                            <i data-lucide="info" className="w-5 h-5 text-blue-400 shrink-0 mt-0.5"></i>
                            <div>
                                <p className="font-black text-xs text-blue-300 uppercase tracking-widest mb-1">實驗操作指引</p>
                                <p className="text-slate-400 text-[11px] leading-relaxed font-medium italic">
                                    手動變更任意獨立變量 (n, T, 或 V)，模擬器將自動根據<strong>理想氣體定律</strong>計算對應的壓強 (P)。請觀察上方「公式實時驗證」框，體驗物理量之間的動態平衡關係。
                                </p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
</script>
</body>
</html>
