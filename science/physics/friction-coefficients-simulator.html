<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摩擦力實驗室：臨界角分析 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 400;
    const RAMP_LENGTH = 400;
    const PIVOT_X = 50;
    const PIVOT_Y = 350;
    const BOX_SIZE = 40;
    const GRAVITY = 9.8;
    const MASS = 5; 

    const App = () => {
        // --- 狀態 ---
        const [mu, setMu] = useState(0.5); 
        const [angle, setAngle] = useState(15); 
        const [boxDist, setBoxDist] = useState(50); 
        const [velocity, setVelocity] = useState(0);
        const [simState, setSimState] = useState('static'); 
        const [isReleased, setIsReleased] = useState(false); 
        
        const angleRad = angle * (Math.PI / 180);
        const mg = MASS * GRAVITY;
        const normalForce = mg * Math.cos(angleRad);
        const gravityParallel = mg * Math.sin(angleRad);
        const maxFriction = mu * normalForce;
        
        const requestRef = useRef();
        const lastTimeRef = useRef(0);
        const physicsRef = useRef({ dist: 50, vel: 0 });
        const isReleasedRef = useRef(false);
        const simStateRef = useRef('static');

        // --- 物理循環 ---
        const updatePhysics = (time) => {
            if (!lastTimeRef.current) lastTimeRef.current = time;
            const dt = (time - lastTimeRef.current) / 1000;
            lastTimeRef.current = time;

            const released = isReleasedRef.current;
            const currentState = simStateRef.current;

            if (released && gravityParallel > maxFriction && currentState !== 'finished') {
                if (currentState === 'static') {
                    setSimState('sliding');
                    simStateRef.current = 'sliding';
                }
                
                const mu_k = mu * 0.8; // 動摩擦力假設為靜摩擦力的 0.8 倍
                const kineticFriction = mu_k * normalForce;
                const netForce = gravityParallel - kineticFriction;
                const acceleration = netForce / MASS;

                physicsRef.current.vel += acceleration * dt * 25; 
                physicsRef.current.dist += physicsRef.current.vel * dt;

                setVelocity(physicsRef.current.vel);
                setBoxDist(physicsRef.current.dist);
            }

            if (physicsRef.current.dist > RAMP_LENGTH - BOX_SIZE) {
                physicsRef.current.dist = RAMP_LENGTH - BOX_SIZE;
                physicsRef.current.vel = 0;
                setBoxDist(RAMP_LENGTH - BOX_SIZE);
                setSimState('finished');
                simStateRef.current = 'finished';
            } else if (simStateRef.current !== 'finished' && released) {
                requestRef.current = requestAnimationFrame(updatePhysics);
            }
        };

        const handleRelease = () => {
            if (isReleasedRef.current) return;
            setIsReleased(true);
            isReleasedRef.current = true;
            lastTimeRef.current = performance.now();
            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        const resetSim = () => {
            setBoxDist(50);
            setVelocity(0);
            physicsRef.current = { dist: 50, vel: 0 };
            isReleasedRef.current = false;
            simStateRef.current = 'static';
            setSimState('static');
            setIsReleased(false);
            cancelAnimationFrame(requestRef.current);
        };

        useEffect(() => { if (isReleased) resetSim(); }, [angle, mu]);

        // --- 渲染 ---
        const canvasRef = useRef(null);
        
        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const endX = PIVOT_X + RAMP_LENGTH * Math.cos(angleRad);
            const endY = PIVOT_Y - RAMP_LENGTH * Math.sin(angleRad);

            // 1. 繪製斜面
            ctx.beginPath();
            ctx.moveTo(PIVOT_X, PIVOT_Y);
            ctx.lineTo(endX, endY);
            ctx.lineTo(endX, PIVOT_Y);
            ctx.closePath();
            const roughness = Math.floor(mu * 150);
            ctx.fillStyle = `rgb(${40+roughness/2}, ${50+roughness/2}, ${70+roughness/2})`;
            ctx.fill();
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4; ctx.stroke();

            // 角度弧線
            ctx.beginPath(); ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
            ctx.arc(PIVOT_X, PIVOT_Y, 40, -angleRad, 0); ctx.stroke();
            ctx.fillStyle = '#facc15'; ctx.font = 'bold 12px Inter';
            ctx.fillText(`${angle}°`, PIVOT_X + 45, PIVOT_Y - 10);

            // 2. 繪製木塊
            const dx = -Math.cos(angleRad) * boxDist;
            const dy = Math.sin(angleRad) * boxDist;
            const boxCenterX = endX + dx;
            const boxCenterY = endY + dy;

            ctx.save();
            ctx.translate(boxCenterX, boxCenterY);
            ctx.rotate(-angleRad);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-BOX_SIZE/2, -BOX_SIZE, BOX_SIZE, BOX_SIZE);
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.strokeRect(-BOX_SIZE/2, -BOX_SIZE, BOX_SIZE, BOX_SIZE);
            ctx.fillStyle = 'white'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("m", 0, -BOX_SIZE/2 + 5);
            ctx.restore();

            // 3. 繪製力向量
            const comX = boxCenterX - Math.sin(angleRad)*(BOX_SIZE/2);
            const comY = boxCenterY - Math.cos(angleRad)*(BOX_SIZE/2);
            const vecScale = 2.5;

            drawArrow(ctx, comX, comY, 0, mg * vecScale, '#94a3b8', 'mg'); // 重力
            drawArrow(ctx, comX, comY, -Math.PI/2 - angleRad, normalForce * vecScale, '#10b981', 'N'); // 正向力
            drawArrow(ctx, comX, comY, Math.PI - angleRad, gravityParallel * vecScale, '#ef4444', 'mg sinθ'); // 下滑力
            
            let curFric = isReleased && simState !== 'static' ? mu*0.8*normalForce : Math.min(gravityParallel, maxFriction);
            drawArrow(ctx, comX, comY, -angleRad, curFric * vecScale, '#f59e0b', 'f'); // 摩擦力

        }, [angle, mu, boxDist, simState, isReleased]);

        const drawArrow = (ctx, x, y, angle, len, color, label) => {
            if (len < 5) return;
            const toX = x + len * Math.cos(angle);
            const toY = y + len * Math.sin(angle);
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.moveTo(x, y); ctx.lineTo(toX, toY); ctx.stroke();
            const headLen = 8;
            ctx.beginPath(); ctx.fillStyle = color;
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI/6), toY - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI/6), toY - headLen * Math.sin(angle + Math.PI/6));
            ctx.fill();
            ctx.fillStyle = color; ctx.font = 'bold 11px sans-serif'; ctx.fillText(label, toX + 8, toY + 4);
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-500/20 p-2 rounded-lg">
                            <i data-lucide="layers" className="w-6 h-6 text-blue-400"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">摩擦力實驗室：臨界角分析</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-700">主題：靜力學與動力學</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-2xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto bg-slate-950 rounded-xl" />
                            <div className={`absolute top-4 left-4 px-4 py-2 rounded-lg border backdrop-blur-md font-bold text-sm ${gravityParallel > maxFriction && isReleased ? 'text-red-400 border-red-500/30 bg-red-500/10' : 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10'}`}>
                                {!isReleased ? "待命：調整參數後點擊釋放" : gravityParallel > maxFriction ? "下滑中！ (mg sinθ > f_max)" : "靜止中 (摩擦力平衡)"}
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label className="flex justify-between text-sm font-bold text-slate-300 mb-3">
                                    <span>摩擦係數 (μ)</span>
                                    <span className="text-emerald-400 font-mono">{mu.toFixed(2)}</span>
                                </label>
                                <input type="range" min="0.1" max="1.0" step="0.05" value={mu} onChange={(e) => setMu(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase"><span>光滑 (冰)</span><span>粗糙 (橡膠)</span></div>
                            </div>
                            <div>
                                <label className="flex justify-between text-sm font-bold text-slate-300 mb-3">
                                    <span>斜面角度 (θ)</span>
                                    <span className="text-yellow-400 font-mono">{angle}°</span>
                                </label>
                                <input type="range" min="0" max="60" step="1" value={angle} onChange={(e) => setAngle(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                <div className="flex justify-between text-[10px] text-slate-500 mt-2 font-bold uppercase"><span>水平</span><span>陡峭</span></div>
                            </div>
                            <div className="md:col-span-2 flex gap-3">
                                <button onClick={handleRelease} disabled={isReleased} className={`flex-1 py-4 rounded-xl font-bold flex items-center justify-center transition-all ${isReleased ? 'bg-slate-700 text-slate-500' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-500/20'}`}>
                                    <i data-lucide="play" className="w-5 h-5 mr-2"></i> 釋放木塊
                                </button>
                                <button onClick={resetSim} className="px-6 py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-colors">
                                    <i data-lucide="rotate-ccw" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2"><i data-lucide="calculator" className="w-5 h-5 text-indigo-400"></i> 受力即時數據</h2>
                            <div className="space-y-4 font-mono">
                                <div className="p-4 rounded-xl bg-slate-900/50 border border-slate-700/50">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">下滑力 (mg sin θ)</div>
                                    <div className={`text-2xl font-bold ${gravityParallel > maxFriction ? 'text-red-400' : 'text-white'}`}>{gravityParallel.toFixed(1)} N</div>
                                </div>
                                <div className="p-4 rounded-xl bg-slate-900/50 border border-slate-700/50">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-1">最大靜摩擦力 (μ N)</div>
                                    <div className="text-2xl font-bold text-emerald-400">{maxFriction.toFixed(1)} N</div>
                                </div>
                                <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 mt-4">
                                    <div className="text-[10px] text-indigo-400 font-bold uppercase mb-1">理論臨界角 (θc)</div>
                                    <div className="text-2xl font-bold text-white">{(Math.atan(mu) * 180 / Math.PI).toFixed(1)}°</div>
                                    <div className="text-[10px] text-slate-500 mt-1 italic">當 θ &gt; θc 時木塊開始下滑</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
