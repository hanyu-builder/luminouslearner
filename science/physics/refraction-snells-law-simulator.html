<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光學折射模擬實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border-radius: 50%; cursor: pointer; border: 2px solid #ffffff;
        }
        .thumb-blue::-webkit-slider-thumb { background: #3b82f6; }
        .thumb-cyan::-webkit-slider-thumb { background: #06b6d4; }
        .canvas-container { cursor: crosshair; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    
    const MATERIALS = {
        '空氣 (Air)': 1.00,
        '水 (Water)': 1.33,
        '玻璃 (Glass)': 1.50,
        '鑽石 (Diamond)': 2.42
    };

    const App = () => {
        const [n1, setN1] = useState(1.00); 
        const [n2, setN2] = useState(1.50); 
        const [angle, setAngle] = useState(45); 
        
        const [showNormal, setShowNormal] = useState(true);
        const [showAngles, setShowAngles] = useState(true);
        const [isTIR, setIsTIR] = useState(false); 
        const [refractedAngle, setRefractedAngle] = useState(0);

        const canvasRef = useRef(null);

        useEffect(() => {
            const theta1Rad = angle * Math.PI / 180;
            const sinTheta2 = (n1 / n2) * Math.sin(theta1Rad);
            
            if (Math.abs(sinTheta2) > 1.0000001) {
                setIsTIR(true);
                setRefractedAngle(null);
            } else {
                setIsTIR(false);
                const theta2Rad = Math.asin(Math.min(1, Math.max(-1, sinTheta2)));
                setRefractedAngle(theta2Rad * 180 / Math.PI);
            }
        }, [n1, n2, angle]);

        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = getColorForIndex(n1, true);
            ctx.fillRect(0, 0, CANVAS_WIDTH, CENTER_Y);
            ctx.fillStyle = getColorForIndex(n2, false);
            ctx.fillRect(0, CENTER_Y, CANVAS_WIDTH, CENTER_Y);

            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1; ctx.beginPath();
            ctx.moveTo(0, CENTER_Y); ctx.lineTo(CANVAS_WIDTH, CENTER_Y); ctx.stroke();

            if (showNormal) {
                ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(CENTER_X, 50); ctx.lineTo(CENTER_X, CANVAS_HEIGHT - 50); ctx.stroke(); ctx.setLineDash([]);
            }

            const rayLen = 300;
            const theta1Rad = angle * Math.PI / 180;
            const startX = CENTER_X - rayLen * Math.sin(theta1Rad);
            const startY = CENTER_Y - rayLen * Math.cos(theta1Rad);
            
            drawLaser(ctx, startX, startY, CENTER_X, CENTER_Y, '#ef4444'); 

            if (isTIR) {
                const endX = CENTER_X + rayLen * Math.sin(theta1Rad);
                const endY = CENTER_Y - rayLen * Math.cos(theta1Rad);
                drawLaser(ctx, CENTER_X, CENTER_Y, endX, endY, '#ef4444', 0.8);
            } else {
                const theta2Rad = refractedAngle * Math.PI / 180;
                const endX = CENTER_X + rayLen * Math.sin(theta2Rad);
                const endY = CENTER_Y + rayLen * Math.cos(theta2Rad);
                drawLaser(ctx, CENTER_X, CENTER_Y, endX, endY, '#ef4444', 0.9);
                const reflX = CENTER_X + rayLen * Math.sin(theta1Rad);
                const reflY = CENTER_Y - rayLen * Math.cos(theta1Rad);
                drawLaser(ctx, CENTER_X, CENTER_Y, reflX, reflY, '#ef4444', 0.2);
            }

            if (showAngles) {
                drawAngleArc(ctx, CENTER_X, CENTER_Y, -90 - angle, -90, 40, '#fcd34d', `θ₁=${angle.toFixed(0)}°`);
                if (isTIR) {
                     drawAngleArc(ctx, CENTER_X, CENTER_Y, -90, -90 + angle, 40, '#fcd34d', `θ'=${angle.toFixed(0)}°`);
                } else {
                     drawAngleArc(ctx, CENTER_X, CENTER_Y, 90 - refractedAngle, 90, 40, '#fcd34d', `θ₂=${refractedAngle.toFixed(1)}°`);
                }
            }
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
            ctx.fillText(`介質 1 (n₁) = ${n1.toFixed(2)}`, 20, 30);
            ctx.fillText(`介質 2 (n₂) = ${n2.toFixed(2)}`, 20, CANVAS_HEIGHT - 20);

        }, [n1, n2, angle, isTIR, refractedAngle, showNormal, showAngles]);

        const getColorForIndex = (n, isTop) => {
            const opacity = 0.05 + ((n - 1) / 1.5) * 0.4;
            return isTop ? `rgba(147, 197, 253, ${opacity})` : `rgba(59, 130, 246, ${opacity})`;
        };

        const drawLaser = (ctx, x1, y1, x2, y2, color, alpha = 1) => {
            ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 4;
            ctx.shadowColor = color; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.restore();
        };

        const drawAngleArc = (ctx, x, y, startDeg, endDeg, radius, color, label) => {
            const startRad = startDeg * Math.PI / 180; const endRad = endDeg * Math.PI / 180;
            ctx.beginPath(); ctx.arc(x, y, radius, startRad, endRad);
            ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
            const midRad = (startRad + endRad) / 2;
            const tx = x + (radius + 20) * Math.cos(midRad); const ty = y + (radius + 20) * Math.sin(midRad);
            ctx.fillStyle = color; ctx.font = '12px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(label, tx, ty);
        };
        
        const handleMouseMove = (e) => {
            if (e.buttons !== 1) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left; const y = e.clientY - rect.top;
            if (y > CENTER_Y) return;
            const dx = x - CENTER_X; const dy = y - CENTER_Y;
            let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
            if (deg > 85) deg = 85; if (deg < -85) deg = -85;
            setAngle(Math.abs(deg));
        };

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 flex flex-col overflow-hidden">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg h-16 shrink-0">
                    <div className="flex items-center space-x-3">
                        <div className="bg-blue-600 p-2 rounded-lg"><i data-lucide="sun" className="w-6 h-6 text-white"></i></div>
                        <h1 className="text-xl font-bold tracking-tight">折射定律模擬實驗室</h1>
                    </div>
                    <div className="text-[10px] font-mono bg-slate-950 px-3 py-1 rounded-full text-blue-400 border border-slate-700 uppercase">DSE Physics: Light & Optics</div>
                </nav>

                <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
                    <div className="lg:col-span-8 bg-black relative border-r border-slate-800">
                        <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseMove={handleMouseMove} className="w-full h-full object-contain canvas-container" />
                        
                        <div className="absolute top-4 left-4 bg-slate-900/90 px-4 py-2 rounded-lg border border-slate-700 text-[10px] text-slate-400 shadow-xl pointer-events-none uppercase tracking-widest font-black">
                            提示：在上方區域拖動滑鼠可改變入射角
                        </div>

                        {isTIR && (
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-red-600/90 text-white px-8 py-4 rounded-2xl shadow-2xl font-black border-2 border-red-400 animate-pulse pointer-events-none tracking-widest text-lg">
                                發生全反射 (TIR)
                            </div>
                        )}
                    </div>

                    <aside className="lg:col-span-4 bg-slate-900 p-6 flex flex-col gap-6 overflow-y-auto custom-scroll border-l border-slate-800">
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-black text-[10px] uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                                <i data-lucide="sliders" className="w-4 h-4 text-indigo-400"></i> 介質參數設定
                            </h2>

                            <div className="space-y-4">
                                <div className="flex justify-between items-center"><label className="text-[11px] font-bold text-blue-300 uppercase">上方介質 (n₁)</label><span className="text-white font-mono font-bold">{n1.toFixed(2)}</span></div>
                                <input type="range" min="1.00" max="3.00" step="0.01" value={n1} onChange={(e) => setN1(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-blue" />
                                <div className="flex flex-wrap gap-2">
                                    {Object.keys(MATERIALS).map(m => <button key={m} onClick={() => setN1(MATERIALS[m])} className="px-3 py-1 text-[10px] font-bold bg-slate-700 hover:bg-slate-600 rounded-full text-slate-300 transition-all border border-slate-600">{m.split(' ')[0]}</button>)}
                                </div>
                            </div>

                            <div className="h-px bg-slate-700/50"></div>

                            <div className="space-y-4">
                                <div className="flex justify-between items-center"><label className="text-[11px] font-bold text-cyan-300 uppercase">下方介質 (n₂)</label><span className="text-white font-mono font-bold">{n2.toFixed(2)}</span></div>
                                <input type="range" min="1.00" max="3.00" step="0.01" value={n2} onChange={(e) => setN2(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb thumb-cyan" />
                                <div className="flex flex-wrap gap-2">
                                    {Object.keys(MATERIALS).map(m => <button key={m} onClick={() => setN2(MATERIALS[m])} className="px-3 py-1 text-[10px] font-bold bg-slate-700 hover:bg-slate-600 rounded-full text-slate-300 transition-all border border-slate-600">{m.split(' ')[0]}</button>)}
                                </div>
                            </div>

                            <div className="h-px bg-slate-700/50"></div>

                            <div className="space-y-4">
                                <div className="flex justify-between items-center"><label className="text-[11px] font-bold text-rose-400 uppercase">入射角度 (θ₁)</label><span className="text-white font-mono font-bold">{angle}°</span></div>
                                <input type="range" min="0" max="85" step="1" value={angle} onChange={(e) => setAngle(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                            </div>
                        </div>

                        <div className="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 space-y-3">
                            <h3 className="text-white font-black text-[10px] uppercase tracking-widest flex items-center gap-2 mb-2"><i data-lucide="eye" className="w-4 h-4 text-indigo-400"></i> 視覺化設定</h3>
                            <label className="flex items-center justify-between cursor-pointer group"><span className="text-[11px] font-bold text-slate-400 group-hover:text-slate-200 transition-colors">顯示法線 (Normal)</span><input type="checkbox" checked={showNormal} onChange={() => setShowNormal(!showNormal)} className="w-4 h-4 rounded border-slate-600 text-blue-600 bg-slate-900 focus:ring-0" /></label>
                            <label className="flex items-center justify-between cursor-pointer group"><span className="text-[11px] font-bold text-slate-400 group-hover:text-slate-200 transition-colors">顯示角度標籤</span><input type="checkbox" checked={showAngles} onChange={() => setShowAngles(!showAngles)} className="w-4 h-4 rounded border-slate-600 text-blue-600 bg-slate-900 focus:ring-0" /></label>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-5 rounded-2xl shadow-inner">
                            <h3 className="text-indigo-400 font-black text-[10px] uppercase tracking-[0.2em] mb-4 flex items-center gap-2"><i data-lucide="calculator" className="w-4 h-4"></i> 斯涅爾定律驗證</h3>
                            <div className="font-mono text-[11px] space-y-3 text-slate-300">
                                <div className="flex justify-between items-center"><span>n₁ sin θ₁</span><span className="text-white font-bold">{(n1 * Math.sin(angle * Math.PI/180)).toFixed(3)}</span></div>
                                <div className="flex justify-between items-center border-t border-indigo-500/20 pt-2"><span>n₂ sin θ₂</span><span className="text-white font-bold">{isTIR ? '無定義' : (n2 * Math.sin(refractedAngle * Math.PI/180)).toFixed(3)}</span></div>
                                {!isTIR && <div className="text-right text-[10px] text-emerald-400 font-black uppercase mt-1">✓ 數值吻合</div>}
                            </div>
                        </div>
                    </aside>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 150);
</script>
</body>
</html>
