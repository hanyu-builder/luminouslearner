<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壓力定律實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ef4444; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        canvas { border-radius: 1rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 300;
    const CANVAS_HEIGHT = 400;
    const FLASK_CENTER_X = 150;
    const FLASK_CENTER_Y = 220;
    const FLASK_RADIUS = 100;
    const PARTICLE_COUNT = 55;

    const App = () => {
        // --- 狀態 ---
        const [tempC, setTempC] = useState(25); // 攝氏度
        const [pressure, setPressure] = useState(100); 
        const [showExtrapolation, setShowExtrapolation] = useState(false);
        
        const canvasRef = useRef(null);
        const graphCanvasRef = useRef(null);
        const requestRef = useRef();
        const particlesRef = useRef([]);
        const gaugeRef = useRef(Math.PI); // 指針位置

        // 初始化分子
        useEffect(() => {
            const ps = [];
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * (FLASK_RADIUS - 12);
                ps.push({
                    x: FLASK_CENTER_X + r * Math.cos(angle),
                    y: FLASK_CENTER_Y + r * Math.sin(angle),
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: (Math.random() - 0.5) * 2.5
                });
            }
            particlesRef.current = ps;
        }, []);

        // 根據壓力定律更新 P = k * T
        useEffect(() => {
            const tempK = tempC + 273.15;
            // 基準：25°C (298.15K) 時為 100 kPa
            const p = Math.max(0, 0.3354 * tempK);
            setPressure(p);
        }, [tempC]);

        // --- 物理循環 ---
        const updatePhysics = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製容器 (定體積)
            ctx.beginPath();
            ctx.arc(FLASK_CENTER_X, FLASK_CENTER_Y, FLASK_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fill();
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 5;
            ctx.stroke();

            // 2. 繪製壓力計 (Gauge)
            const gaugeY = 60;
            ctx.beginPath();
            ctx.arc(FLASK_CENTER_X, gaugeY, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b'; ctx.fill();
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.stroke();

            // 壓力計刻度
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
            for(let i=0; i<=6; i++) {
                const a = Math.PI + (i/6) * Math.PI;
                ctx.beginPath();
                ctx.moveTo(FLASK_CENTER_X + 26 * Math.cos(a), gaugeY + 26 * Math.sin(a));
                ctx.lineTo(FLASK_CENTER_X + 32 * Math.cos(a), gaugeY + 32 * Math.sin(a));
                ctx.stroke();
            }

            // 指針動畫 (對應 0 - 200 kPa)
            const targetA = Math.PI + (Math.min(pressure, 200) / 200) * Math.PI;
            gaugeRef.current += (targetA - gaugeRef.current) * 0.1;
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(FLASK_CENTER_X, gaugeY);
            ctx.lineTo(FLASK_CENTER_X + 28 * Math.cos(gaugeRef.current), gaugeY + 28 * Math.sin(gaugeRef.current));
            ctx.stroke();

            // 3. 熱源/冰塊視覺
            const bottomY = FLASK_CENTER_Y + FLASK_RADIUS + 15;
            if (tempC > 25) {
                ctx.fillStyle = `rgba(239, 68, 68, ${Math.min(1, (tempC-25)/200)})`;
                ctx.beginPath();
                ctx.moveTo(FLASK_CENTER_X - 25, bottomY + 10);
                ctx.lineTo(FLASK_CENTER_X, bottomY - 20);
                ctx.lineTo(FLASK_CENTER_X + 25, bottomY + 10);
                ctx.fill();
            } else if (tempC < 0) {
                ctx.fillStyle = `rgba(56, 189, 248, ${Math.min(1, Math.abs(tempC)/200)})`;
                ctx.fillRect(FLASK_CENTER_X - 60, FLASK_CENTER_Y + FLASK_RADIUS + 5, 120, 15);
            }

            // 4. 分子運動 (速度 v ∝ √T)
            const tempK = tempC + 273.15;
            const speedFactor = Math.sqrt(Math.max(1, tempK)) / 10;
            ctx.fillStyle = tempC > 50 ? '#fca5a5' : tempC < 0 ? '#93c5fd' : '#cbd5e1';

            particlesRef.current.forEach(p => {
                p.x += p.vx * speedFactor;
                p.y += p.vy * speedFactor;

                const dx = p.x - FLASK_CENTER_X;
                const dy = p.y - FLASK_CENTER_Y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist > FLASK_RADIUS - 6) {
                    const nx = dx / dist; const ny = dy / dist;
                    const dot = p.vx * nx + p.vy * ny;
                    p.vx -= 2 * dot * nx;
                    p.vy -= 2 * dot * ny;
                    p.x = FLASK_CENTER_X + nx * (FLASK_RADIUS - 6.1);
                    p.y = FLASK_CENTER_Y + ny * (FLASK_RADIUS - 6.1);
                }
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            requestRef.current = requestAnimationFrame(updatePhysics);
        };

        // --- 繪製 P-T 圖表 ---
        const drawGraph = () => {
            const ctx = graphCanvasRef.current?.getContext('2d');
            if (!ctx) return;
            const w = 600, h = 350, pad = 50;
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, w, h);

            const xMin = -300, xMax = 300;
            const yMin = 0, yMax = 200;
            const mapX = (t) => pad + ((t - xMin) / (xMax - xMin)) * (w - 2 * pad);
            const mapY = (p) => h - pad - (p / yMax) * (h - 2 * pad);

            // 軸
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h - pad); ctx.lineTo(w - pad, h - pad); ctx.stroke();
            
            // 標註
            const absZeroX = mapX(-273.15);
            ctx.strokeStyle = '#ef4444'; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(absZeroX, pad); ctx.lineTo(absZeroX, h - pad); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#ef4444'; ctx.font = '10px Inter'; ctx.textAlign = 'center';
            ctx.fillText("-273.15°C", absZeroX, h - 35);

            const zeroX = mapX(0);
            ctx.strokeStyle = '#64748b'; ctx.setLineDash([2, 4]);
            ctx.beginPath(); ctx.moveTo(zeroX, pad); ctx.lineTo(zeroX, h - pad); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#64748b'; ctx.fillText("0°C", zeroX, h - 35);

            // 理論線
            ctx.beginPath(); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
            const tStart = showExtrapolation ? -273.15 : -200;
            const pStart = 0.3354 * (tStart + 273.15);
            ctx.moveTo(mapX(tStart), mapY(pStart));
            const tEnd = 300;
            const pEnd = 0.3354 * (tEnd + 273.15);
            ctx.lineTo(mapX(tEnd), mapY(pEnd));
            ctx.stroke();

            // 當前點
            const cx = mapX(tempC); const cy = mapY(pressure);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#94a3b8'; ctx.fillText("溫度 T (°C) →", w/2, h - 10);
            ctx.save(); ctx.translate(15, h/2); ctx.rotate(-Math.PI/2);
            ctx.fillText("壓力 P (kPa)", 0, 0); ctx.restore();
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(updatePhysics);
            return () => cancelAnimationFrame(requestRef.current);
        }, [tempC, pressure]);

        useEffect(() => { drawGraph(); }, [tempC, pressure, showExtrapolation]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-red-500/20 p-2 rounded-lg text-red-400">
                            <i data-lucide="gauge"></i>
                        </div>
                        <h1 className="text-xl font-bold text-white tracking-wide">壓力定律實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">
                        Topic: Gas Laws (Thermal Physics)
                    </div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-5 flex flex-col gap-6">
                        <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl flex flex-col items-center relative overflow-hidden">
                            <h2 className="text-red-400 font-bold mb-8 w-full flex items-center gap-2">
                                <i data-lucide="flask-round" className="w-5 h-5"></i> 密閉容器裝置模擬
                            </h2>
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-auto max-w-[280px]" />
                            <div className="mt-4 p-4 bg-slate-950/50 rounded-2xl border border-slate-700/50 w-full text-center">
                                <div className="text-sm font-bold text-white flex justify-center gap-4">
                                    <span className="flex items-center gap-1 text-blue-400"><i data-lucide="lock" className="w-3 h-3"></i> 定體積 V</span>
                                    <span className="flex items-center gap-1 text-orange-400"><i data-lucide="thermometer" className="w-3 h-3"></i> 變溫 T</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-7 space-y-6">
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center border-b-4 border-b-orange-500">
                                <div className="text-slate-500 text-[10px] font-bold uppercase mb-1">攝氏溫度 (T)</div>
                                <div className="text-3xl font-black text-white font-mono">{tempC}<span className="text-sm ml-1 text-slate-500">°C</span></div>
                                <div className="text-xs text-orange-400 mt-1 font-bold">{(tempC + 273.15).toFixed(2)} K</div>
                            </div>
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg text-center border-b-4 border-b-red-500">
                                <div className="text-slate-500 text-[10px] font-bold uppercase mb-1">氣體壓力 (P)</div>
                                <div className="text-3xl font-black text-white font-mono">{pressure.toFixed(1)}<span className="text-sm ml-1 text-slate-500">kPa</span></div>
                                <div className="text-xs text-red-400 mt-1 font-bold">P / T(K) = {(pressure / (tempC + 273.15)).toFixed(3)}</div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <div className="flex justify-between items-center mb-6">
                                <label className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                    <i data-lucide="thermometer-sun" className="w-4 h-4 text-red-400"></i> 控制環境溫度
                                </label>
                                <span className={`px-4 py-1 rounded-full text-xs font-bold ${tempC > 25 ? 'bg-red-500/10 text-red-400' : 'bg-blue-500/10 text-blue-400'}`}>
                                    {tempC > 25 ? "加熱中 (粒子加速)" : "冷卻中 (粒子減速)"}
                                </span>
                            </div>
                            <input 
                                type="range" min="-200" max="300" step="1"
                                value={tempC}
                                onChange={(e) => setTempC(Number(e.target.value))}
                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb"
                            />
                            <div className="flex justify-between mt-3 text-[10px] font-bold text-slate-500 uppercase">
                                <span>-200°C</span>
                                <span>室溫</span>
                                <span>300°C</span>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-1 rounded-3xl border border-slate-700 shadow-2xl relative overflow-hidden h-[300px]">
                            <canvas ref={graphCanvasRef} width={600} height={350} className="w-full h-full object-cover" />
                            <div className="absolute top-4 right-4 flex gap-2">
                                <button 
                                    onClick={() => setShowExtrapolation(!showExtrapolation)}
                                    className={`px-3 py-1.5 rounded-xl border text-[10px] font-bold transition-all ${showExtrapolation ? 'bg-red-600 border-red-400 text-white shadow-lg' : 'bg-slate-900/80 border-slate-700 text-slate-400'}`}
                                >
                                    {showExtrapolation ? "隱藏外推法" : "顯示絕對零度"}
                                </button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
