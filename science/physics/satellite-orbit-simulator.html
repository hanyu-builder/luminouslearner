<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人造衛星軌道模擬器 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: default; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .stars {
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0));
            background-size: 200px 200px;
        }
        canvas { border-radius: 1.5rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT / 2;
    
    // 物理常數
    const G_CONST = 2000; // 視覺縮放後的 G
    const PLANET_MASS = 100;
    const PLANET_RADIUS = 40;
    const LAUNCH_RADIUS = 120; // 初始發射距離
    
    // 關鍵速度計算
    const V_CIRCULAR = Math.sqrt(G_CONST * PLANET_MASS / LAUNCH_RADIUS);
    const V_ESCAPE = V_CIRCULAR * Math.sqrt(2);

    const App = () => {
        // --- 狀態 ---
        const [launchSpeed, setLaunchSpeed] = useState(V_CIRCULAR); 
        const [simState, setSimState] = useState('idle'); // idle, running, crashed
        const [simSpeed, setSimSpeed] = useState(1.0);
        
        const [altitude, setAltitude] = useState(LAUNCH_RADIUS - PLANET_RADIUS);
        const [velocity, setVelocity] = useState(V_CIRCULAR);
        const [orbitType, setOrbitType] = useState('圓形軌道');

        const canvasRef = useRef(null);
        const requestRef = useRef();
        
        const physicsRef = useRef({
            x: 0, y: -LAUNCH_RADIUS,
            vx: V_CIRCULAR, vy: 0,
            path: []
        });

        // --- 邏輯 ---
        const resetSim = () => {
            setSimState('idle');
            cancelAnimationFrame(requestRef.current);
            
            let type = "橢圓軌道";
            if (Math.abs(launchSpeed - V_CIRCULAR) < 0.1) type = "圓形軌道";
            else if (launchSpeed >= V_ESCAPE) type = "逃逸速度 (雙曲線)";
            else if (launchSpeed < V_CIRCULAR * 0.7) type = "次軌道 (將墜毀)";
            
            setOrbitType(type);
            setAltitude(LAUNCH_RADIUS - PLANET_RADIUS);
            setVelocity(launchSpeed);

            physicsRef.current = {
                x: 0, y: -LAUNCH_RADIUS,
                vx: launchSpeed, vy: 0,
                path: []
            };
            draw();
        };

        const startSim = () => {
            if (simState === 'running') return;
            setSimState('running');
            loop();
        };

        const loop = () => {
            const state = physicsRef.current;
            const dt = 0.05 * simSpeed;

            // 1. 計算引力
            const r2 = state.x * state.x + state.y * state.y;
            const r = Math.sqrt(r2);
            const a = (G_CONST * PLANET_MASS) / r2;
            const ax = -a * (state.x / r);
            const ay = -a * (state.y / r);

            // 2. 更新速度 (Euler-Cromer 方法)
            state.vx += ax * dt;
            state.vy += ay * dt;

            // 3. 更新位置
            state.x += state.vx * dt;
            state.y += state.vy * dt;

            // 4. 更新軌跡
            if (Math.random() > 0.5) {
                state.path.push({ x: state.x, y: state.y });
                if (state.path.length > 600) state.path.shift(); 
            }

            // 5. 碰撞檢測
            if (r <= PLANET_RADIUS) {
                setSimState('crashed');
                return;
            }

            // 同步 UI
            setVelocity(Math.sqrt(state.vx*state.vx + state.vy*state.vy));
            setAltitude(r - PLANET_RADIUS);

            draw();
            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 渲染 ---
        const draw = () => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 繪製軌跡
            const state = physicsRef.current;
            if (state.path.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
                ctx.lineWidth = 1;
                ctx.setLineDash([2, 3]);
                state.path.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(CENTER_X + p.x, CENTER_Y + p.y);
                    else ctx.lineTo(CENTER_X + p.x, CENTER_Y + p.y);
                });
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 2. 繪製行星 (地球)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, PLANET_RADIUS, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(CENTER_X - 10, CENTER_Y - 10, 5, CENTER_X, CENTER_Y, PLANET_RADIUS);
            grad.addColorStop(0, '#60a5fa');
            grad.addColorStop(1, '#1e3a8a');
            ctx.fillStyle = grad;
            ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 25;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 3. 繪製衛星
            const satX = CENTER_X + state.x;
            const satY = CENTER_Y + state.y;
            ctx.save();
            ctx.translate(satX, satY);
            const angle = Math.atan2(state.vy, state.vx);
            ctx.rotate(angle);
            ctx.fillStyle = '#facc15'; ctx.fillRect(-7, -4, 14, 8); // 機身
            ctx.fillStyle = '#06b6d4'; ctx.fillRect(-5, -10, 10, 4); // 太陽能板
            ctx.fillRect(-5, 6, 10, 4);
            ctx.restore();

            // 4. 繪製向量
            if (simState !== 'crashed') {
                const vL = Math.sqrt(state.vx**2 + state.vy**2);
                drawArrow(ctx, satX, satY, state.vx * 4, state.vy * 4, '#10b981'); // 速度向量
                const r_dist = Math.sqrt(state.x**2 + state.y**2);
                const aM = (G_CONST * PLANET_MASS) / (r_dist**2);
                drawArrow(ctx, satX, satY, -state.x/r_dist * 60, -state.y/r_dist * 60, '#ef4444'); // 引力向量
            } else {
                ctx.beginPath(); ctx.arc(satX, satY, 18, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.8)'; ctx.fill();
            }
        };

        const drawArrow = (ctx, x, y, dx, dy, color) => {
            const hL = 8;
            const a = Math.atan2(dy, dx);
            const eX = x + dx, eY = y + dy;
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.moveTo(x, y); ctx.lineTo(eX, eY); ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = color;
            ctx.moveTo(eX, eY);
            ctx.lineTo(eX - hL * Math.cos(a - Math.PI / 6), eY - hL * Math.sin(a - Math.PI / 6));
            ctx.lineTo(eX - hL * Math.cos(a + Math.PI / 6), eY - hL * Math.sin(a + Math.PI / 6));
            ctx.fill();
        };

        useEffect(() => {
            resetSim();
            return () => cancelAnimationFrame(requestRef.current);
        }, [launchSpeed]);

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        const setPreset = (t) => {
            if (t === 'circular') setLaunchSpeed(V_CIRCULAR);
            else if (t === 'escape') setLaunchSpeed(V_ESCAPE);
        };

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 select-none">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-indigo-500/20 p-2 rounded-lg text-indigo-400"><i data-lucide="satellite"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">人造衛星軌道模擬器</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Gravitation</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-8 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[450px] stars">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full object-contain" />
                            <div className="absolute bottom-6 left-6 bg-slate-900/90 px-4 py-3 rounded-2xl border border-slate-700 text-[10px] space-y-2 backdrop-blur-md">
                                <div className="flex items-center gap-2"><div className="w-3 h-0.5 bg-emerald-500"></div> 速度向量 (v)</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-0.5 bg-red-500"></div> 萬有引力 (F_g)</div>
                            </div>
                            <div className="absolute top-6 left-6 flex gap-3">
                                <div className={`px-4 py-1.5 rounded-full border font-bold text-xs shadow-xl backdrop-blur-md ${simState === 'crashed' ? 'bg-red-900/80 border-red-500 text-red-100' : 'bg-indigo-900/80 border-indigo-500 text-indigo-100'}`}>
                                    {simState === 'crashed' ? '衛星墜毀' : orbitType}
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl">
                            <div className="flex gap-4 items-center pl-2">
                                <label className="text-xs text-slate-500 font-bold uppercase tracking-wider">演化速度:</label>
                                <div className="flex bg-slate-950 rounded-xl p-1 border border-slate-700">
                                    {[0.5, 1.0, 2.0].map(s => (
                                        <button key={s} onClick={() => setSimSpeed(s)} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${simSpeed === s ? 'bg-slate-700 text-white shadow-inner' : 'text-slate-500 hover:text-slate-300'}`}>{s}x</button>
                                    ))}
                                </div>
                            </div>
                            <p className="text-[10px] text-slate-500 italic pr-4">物理模型：開普勒運動與動能勢能轉換</p>
                        </div>
                    </div>

                    <div className="lg:col-span-4 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-8">
                            <h2 className="text-white font-bold mb-4 flex items-center gap-2 text-lg border-b border-slate-700 pb-4"><i data-lucide="rocket" className="text-indigo-400"></i> 發射控制中心</h2>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => setPreset('circular')} className="bg-emerald-900/30 hover:bg-emerald-800/40 border border-emerald-500/30 text-emerald-400 py-3 rounded-xl text-xs font-bold transition-all">圓形軌道速</button>
                                <button onClick={() => setPreset('escape')} className="bg-orange-900/30 hover:bg-orange-800/40 border border-orange-500/30 text-orange-400 py-3 rounded-xl text-xs font-bold transition-all">逃逸速度</button>
                            </div>
                            <div>
                                <div className="flex justify-between mb-3 items-end">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">初始發射速率</label>
                                    <div className="text-right">
                                        <div className="font-mono text-2xl text-blue-400 font-black">{launchSpeed.toFixed(1)}</div>
                                        <div className="text-[9px] text-slate-500 font-bold uppercase">km/s (等效)</div>
                                    </div>
                                </div>
                                <input type="range" min="10" max="60" step="0.5" value={launchSpeed} onChange={(e) => setLaunchSpeed(Number(e.target.value))} disabled={simState === 'running'} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-thumb" />
                                <div className="flex justify-between text-[9px] text-slate-600 mt-2 font-bold uppercase tracking-tighter"><span>墜毀區</span><span className="text-emerald-500">第一宇宙速</span><span className="text-orange-500">第二宇宙速</span></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={startSim} disabled={simState === 'running'} className={`py-4 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg ${simState === 'running' ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-900/20'}`}><i data-lucide="play"></i> 點火發射</button>
                                <button onClick={resetSim} className="py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-all flex items-center justify-center gap-2 active:scale-95"><i data-lucide="rotate-ccw"></i> 重置</button>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
                            <h3 className="text-slate-400 text-xs font-bold uppercase tracking-widest">實時遙測數據 (Telemetry)</h3>
                            <div className="space-y-4 font-mono">
                                <div className="flex justify-between items-baseline border-b border-slate-700 pb-3">
                                    <span className="text-xs text-slate-500">離地高度</span>
                                    <span className="text-white text-xl font-bold">{(altitude * 50).toFixed(0)} <span className="text-xs text-slate-600">km</span></span>
                                </div>
                                <div className="flex justify-between items-baseline border-b border-slate-700 pb-3">
                                    <span className="text-xs text-slate-500">當前速度</span>
                                    <span className="text-white text-xl font-bold">{(velocity * 1.5).toFixed(1)} <span className="text-xs text-slate-600">km/s</span></span>
                                </div>
                                <div className="pt-2 text-[11px] text-slate-500 leading-relaxed italic border-l-2 border-indigo-500/30 pl-3">
                                    <b>物理提示：</b>請觀察衛星在<b>近地點 (Perigee)</b> 時如何加速，以及在<b>遠地點 (Apogee)</b> 時如何減速？這正是能量守恆與角動量守恆的表現。
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
