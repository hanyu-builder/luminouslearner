<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靜電氣球實驗室 | Luminous Learner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        .canvas-container { cursor: grab; }
        .canvas-container:active { cursor: grabbing; }
        .noselect { user-select: none; }
        canvas { border-radius: 1.5rem; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 500;
    const BALLOON_RADIUS = 60;
    const CHARGE_COUNT = 18; 
    
    const SWEATER_X = 150;
    const SWEATER_Y = 250;
    const SWEATER_W = 180;
    const SWEATER_H = 320;

    const WALL_X = 750;
    const WALL_W = 50;

    const App = () => {
        // --- 狀態 ---
        const [showCharges, setShowCharges] = useState(true);
        const [balloonPos, setBalloonPos] = useState({ x: 400, y: 250 });
        const [balloonCharges, setBalloonCharges] = useState([]); 
        const [sweaterCharges, setSweaterCharges] = useState([]);
        const [wallCharges, setWallCharges] = useState([]);
        const [isDragging, setIsDragging] = useState(false);
        const [netCharge, setNetCharge] = useState(0);

        const canvasRef = useRef(null);
        const requestRef = useRef();
        const physicsRef = useRef({
            bx: 400, by: 250, vx: 0, vy: 0,
            dragging: false
        });

        // --- 初始化 ---
        useEffect(() => {
            resetSim();
        }, []);

        const resetSim = () => {
            // 1. 初始化毛衣電荷 (固定網格)
            const sCharges = [];
            for(let r=0; r<8; r++) {
                for(let c=0; c<4; c++) {
                    const cx = (c - 1.5) * 40;
                    const cy = (r - 3.5) * 40;
                    sCharges.push({ type: 1, x: cx, y: cy, baseX: cx, baseY: cy }); // 質子
                    sCharges.push({ type: -1, x: cx + 6, y: cy + 6, baseX: cx + 6, baseY: cy + 6 }); // 電子
                }
            }
            setSweaterCharges(sCharges);

            // 2. 初始化氣球電荷 (圓內隨機)
            const bCharges = [];
            for(let i=0; i<CHARGE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.sqrt(Math.random()) * (BALLOON_RADIUS - 15);
                const bx = Math.cos(angle) * dist;
                const by = Math.sin(angle) * dist;
                bCharges.push({ type: 1, x: bx, y: by });
                bCharges.push({ type: -1, x: bx + 5, y: by + 5 });
            }
            setBalloonCharges(bCharges);

            // 3. 初始化牆壁電荷
            const wCharges = [];
            for(let i=0; i<12; i++) {
                const wy = (i - 5.5) * 40;
                wCharges.push({ type: 1, x: 0, y: wy });
                wCharges.push({ type: -1, x: 0, y: wy, baseX: 0 }); // 電子可水平移動
            }
            setWallCharges(wCharges);

            physicsRef.current = { bx: 400, by: 250, vx: 0, vy: 0, dragging: false };
            setNetCharge(0);
            setBalloonPos({ x: 400, y: 250 });
        };

        // --- 物理循環 ---
        const loop = () => {
            const state = physicsRef.current;
            const dt = 0.016;

            if (!state.dragging) {
                let fx = 0;
                let fy = 0;

                const bNet = balloonCharges.reduce((acc, c) => acc + c.type, 0);
                const sNet = sweaterCharges.reduce((acc, c) => acc + c.type, 0); 
                
                // 1. 與毛衣的庫侖力 (吸引)
                if (bNet < 0) {
                    const dx = SWEATER_X - state.bx;
                    const dy = SWEATER_Y - state.by;
                    const distSq = dx*dx + dy*dy;
                    const dist = Math.sqrt(distSq);
                    const forceMag = 4000 * Math.abs(bNet * sNet) / (distSq + 1200);
                    fx += (dx/dist) * forceMag;
                    fy += (dy/dist) * forceMag;
                }

                // 2. 與牆壁的感應吸引力
                const distToWall = WALL_X - (state.bx + BALLOON_RADIUS);
                if (distToWall < 180 && bNet < 0) {
                    const forceInd = 18000 * (bNet * bNet) / Math.pow(distToWall + 60, 2.3);
                    fx += forceInd; 
                }

                // 3. 運動更新
                state.vx += fx * dt;
                state.vy += fy * dt;
                state.vx *= 0.94; // 空氣阻力
                state.vy *= 0.94;
                state.bx += state.vx;
                state.by += state.vy;

                // 碰撞處理
                if (state.bx + BALLOON_RADIUS > WALL_X) {
                    state.bx = WALL_X - BALLOON_RADIUS;
                    state.vx = 0;
                }
                if (state.bx - BALLOON_RADIUS < SWEATER_X + SWEATER_W/2) {
                    if (bNet < 0) { state.vx = 0; state.vy = 0; }
                    else {
                         state.bx = SWEATER_X + SWEATER_W/2 + BALLOON_RADIUS;
                         state.vx *= -0.4;
                    }
                }
                // 邊界
                if (state.by < 50) { state.by = 50; state.vy *= -0.5; }
                if (state.by > CANVAS_HEIGHT - 50) { state.by = CANVAS_HEIGHT - 50; state.vy *= -0.5; }
            }

            setBalloonPos({ x: state.bx, y: state.by });
            const bNetFinal = balloonCharges.reduce((acc, c) => acc + c.type, 0);
            setNetCharge(bNetFinal);

            // 牆壁極化 (視覺邏輯)
            setWallCharges(prev => prev.map(c => {
                if (c.type === 1) return c;
                const bNet = balloonCharges.reduce((acc, q) => acc + q.type, 0);
                const distToWall = WALL_X - (state.bx + BALLOON_RADIUS);
                let targetX = c.baseX;
                if (bNet < -2 && distToWall < 220) {
                     const push = Math.min(35, 800 / (distToWall + 15));
                     targetX = c.baseX + push;
                }
                return { ...c, x: c.x + (targetX - c.x) * 0.12 };
            }));

            requestRef.current = requestAnimationFrame(loop);
        };

        // --- 互動處理 ---
        const handleMouseDown = (e) => {
            const rect = canvasRef.current.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);
            if (Math.hypot(x - balloonPos.x, y - balloonPos.y) < BALLOON_RADIUS + 25) {
                physicsRef.current.dragging = true;
                setIsDragging(true);
            }
        };

        const handleMouseMove = (e) => {
            if (!physicsRef.current.dragging) return;
            const rect = canvasRef.current.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const y = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);

            physicsRef.current.bx = x;
            physicsRef.current.by = y;
            physicsRef.current.vx = 0;
            physicsRef.current.vy = 0;

            const sR = SWEATER_X + SWEATER_W/2, sL = SWEATER_X - SWEATER_W/2;
            const sT = SWEATER_Y - SWEATER_H/2, sB = SWEATER_Y + SWEATER_H/2;

            if (x - BALLOON_RADIUS < sR && x + BALLOON_RADIUS > sL &&
                y - BALLOON_RADIUS < sB && y + BALLOON_RADIUS > sT) {
                const electronIdx = sweaterCharges.findIndex(c => c.type === -1);
                if (electronIdx !== -1 && Math.random() > 0.85) {
                    const newSweater = [...sweaterCharges];
                    newSweater.splice(electronIdx, 1);
                    setSweaterCharges(newSweater);
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.sqrt(Math.random()) * (BALLOON_RADIUS - 12);
                    setBalloonCharges(prev => [...prev, { type: -1, x: r * Math.cos(angle), y: r * Math.sin(angle) }]);
                }
            }
        };

        const handleMouseUp = () => {
            physicsRef.current.dragging = false;
            setIsDragging(false);
        };

        useEffect(() => {
            const ctx = canvasRef.current?.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. 毛衣
            ctx.fillStyle = '#facc15'; ctx.fillRect(SWEATER_X - SWEATER_W/2, SWEATER_Y - SWEATER_H/2, SWEATER_W, SWEATER_H);
            ctx.strokeStyle = '#eab308'; ctx.lineWidth = 2;
            for(let i=0; i<12; i++) {
                ctx.beginPath(); ctx.moveTo(SWEATER_X - SWEATER_W/2, SWEATER_Y - SWEATER_H/2 + i*28);
                ctx.lineTo(SWEATER_X + SWEATER_W/2, SWEATER_Y - SWEATER_H/2 + i*28 + 15); ctx.stroke();
            }
            if (showCharges) sweaterCharges.forEach(c => drawCharge(ctx, SWEATER_X + c.x, SWEATER_Y + c.y, c.type));

            // 2. 牆壁
            ctx.fillStyle = '#1e293b'; ctx.fillRect(WALL_X, 0, WALL_W, CANVAS_HEIGHT);
            if (showCharges) wallCharges.forEach(c => drawCharge(ctx, WALL_X + 15 + c.x, 50 + c.y, c.type));

            // 3. 氣球
            const { bx, by } = balloonPos;
            ctx.beginPath(); ctx.moveTo(bx, by + BALLOON_RADIUS);
            ctx.quadraticCurveTo(bx + 10, by + BALLOON_RADIUS + 40, bx + 5, by + BALLOON_RADIUS + 90);
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = netCharge < -5 ? '#fde047' : '#eab308';
            ctx.beginPath(); ctx.ellipse(bx, by, BALLOON_RADIUS, BALLOON_RADIUS * 1.1, 0, 0, Math.PI*2); ctx.fill();
            
            if (Math.abs(netCharge) > 0) {
                ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = Math.abs(netCharge) * 1.8;
                ctx.strokeStyle = 'rgba(96, 165, 250, 0.6)'; ctx.lineWidth = 3; ctx.stroke();
                ctx.shadowBlur = 0;
            }
            if (showCharges) balloonCharges.forEach(c => drawCharge(ctx, bx + c.x, by + c.y, c.type));
        }, [balloonPos, sweaterCharges, wallCharges, balloonCharges, showCharges, netCharge]);

        const drawCharge = (ctx, x, y, type) => {
            ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2);
            ctx.fillStyle = type > 0 ? '#ef4444' : '#3b82f6'; ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'center';
            ctx.fillText(type > 0 ? '+' : '-', x, y + 3.5);
        };

        useEffect(() => {
            requestRef.current = requestAnimationFrame(loop);
            return () => cancelAnimationFrame(requestRef.current);
        });

        useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

        return (
            <div className="min-h-screen bg-slate-900 text-slate-200 font-sans pb-12 noselect">
                <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                    <div className="flex items-center space-x-3">
                        <div className="bg-yellow-500/20 p-2 rounded-lg text-yellow-500"><i data-lucide="zap"></i></div>
                        <h1 className="text-xl font-bold text-white tracking-wide">靜電氣球實驗室</h1>
                    </div>
                    <div className="text-xs text-slate-400 font-mono bg-slate-950 px-3 py-1 rounded-full border border-slate-700 uppercase tracking-widest">Topic: Static Electricity</div>
                </nav>

                <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-4">
                    <div className="lg:col-span-9 flex flex-col gap-6">
                        <div className="bg-slate-950 rounded-3xl border border-slate-700 p-1 shadow-2xl relative overflow-hidden h-[500px]">
                            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} className="w-full h-full object-contain canvas-container" />
                            <div className="absolute top-6 left-6 bg-slate-900/90 px-5 py-3 rounded-2xl border border-slate-700 text-sm text-slate-300 backdrop-blur-md pointer-events-none flex items-center gap-3">
                                <i data-lucide="mouse-pointer-2" className="text-indigo-400"></i>
                                拖動<b>氣球</b>在<b>毛衣</b>上摩擦，然後靠近<b>牆壁</b>。
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 flex justify-between items-center shadow-xl">
                            <label className="flex items-center gap-3 cursor-pointer p-3 rounded-2xl bg-slate-950/50 hover:bg-slate-700 transition-colors border border-slate-700">
                                <input type="checkbox" checked={showCharges} onChange={() => setShowCharges(!showCharges)} className="w-5 h-5 rounded border-slate-500 text-yellow-500 focus:ring-0 cursor-pointer" />
                                <span className="text-sm font-bold text-slate-300 uppercase tracking-widest">顯示電荷</span>
                            </label>
                            <button onClick={resetSim} className="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded-2xl text-white font-bold transition-all flex items-center gap-2 active:scale-95 shadow-lg"><i data-lucide="rotate-ccw"></i> 重置實驗</button>
                        </div>
                    </div>

                    <div className="lg:col-span-3 space-y-6">
                        <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 text-lg border-b border-slate-700 pb-4">
                                <i data-lucide="battery-charging" className="text-indigo-400"></i> 電量狀態
                            </h2>
                            <div className="p-6 rounded-2xl bg-slate-950 border border-slate-700 text-center shadow-inner">
                                <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">氣球淨電荷 (Net Charge)</div>
                                <div className={`text-4xl font-black font-mono ${netCharge < 0 ? 'text-blue-400' : 'text-slate-500'}`}>
                                    {netCharge === 0 ? "中性" : `${netCharge} e⁻`}
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-900/10 border border-indigo-500/20 p-6 rounded-3xl shadow-inner space-y-6">
                            <h3 className="text-indigo-300 font-bold text-sm flex items-center gap-2 uppercase tracking-widest"><i data-lucide="lightbulb" className="w-4 h-4"></i> 現象觀察</h3>
                            <div className="space-y-4">
                                <div>
                                    <p className="text-xs font-bold text-slate-200 mb-1">摩擦起電 (Triboelectric):</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">摩擦時，氣球從毛衣奪取了電子（藍色）。氣球現在帶負電，而毛衣失去電子帶正電。</p>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-200 mb-1">靜電感應 (Induction):</p>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">當帶負電氣球靠近牆壁時，會排斥牆上的電子使其遠離表面，導致表面顯現正電性而吸引氣球。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
