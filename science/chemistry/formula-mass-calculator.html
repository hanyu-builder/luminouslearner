<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>式量及質量百分比計算機 (Formula Mass & Composition Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .key-btn {
            transition: all 0.1s;
        }
        .key-btn:active {
            transform: scale(0.95);
        }
        
        .ex-btn {
            transition: all 0.2s;
        }
        .ex-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AtomicMasses = {
            H: 1.0, He: 4.0, Li: 6.9, Be: 9.0, B: 10.8, C: 12.0, N: 14.0, O: 16.0, F: 19.0, Ne: 20.2,
            Na: 23.0, Mg: 24.3, Al: 27.0, Si: 28.1, P: 31.0, S: 32.1, Cl: 35.5, K: 39.1, Ar: 39.9, Ca: 40.1,
            Fe: 55.8, Cu: 63.5, Zn: 65.4, Br: 79.9, Ag: 107.9, I: 126.9, Ba: 137.3, Pb: 207.2
        };

        const ExampleCategories = [
            {
                name: '常用 (Common)',
                items: ['H2O', 'CO2', 'O2', 'N2']
            },
            {
                name: '酸與鹼 (Acids & Alkalis)',
                items: ['HCl', 'H2SO4', 'HNO3', 'NaOH', 'NH3', 'Ca(OH)2']
            },
            {
                name: '鹽與水合物 (Salts)',
                items: ['NaCl', 'CaCO3', 'CuSO4.5H2O', 'FeSO4.7H2O', 'AgNO3']
            },
            {
                name: '有機物 (Organic)',
                items: ['CH4', 'C2H5OH', 'C6H12O6', 'CH3COOH']
            }
        ];

        const App = () => {
            const [input, setInput] = useState('');
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const [breakdown, setBreakdown] = useState([]);
            const [composition, setComposition] = useState([]); // For Percentage
            const [activeCategory, setActiveCategory] = useState(0);
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            // Parser Logic
            const calculateMass = () => {
                setError('');
                setResult(null);
                setBreakdown([]);
                setComposition([]);

                if (!input.trim()) return;
                
                try {
                    const parts = input.split('.');
                    let totalMass = 0;
                    let fullBreakdown = [];
                    let atomCounts = {}; // To track total count of each element for percentage

                    // Helper to accumulate atom counts
                    const addToCounts = (el, count, mass) => {
                        if (!atomCounts[el]) atomCounts[el] = { count: 0, totalMass: 0 };
                        atomCounts[el].count += count;
                        atomCounts[el].totalMass += mass;
                    };

                    // Process Main Formula
                    const mainResult = parseFormula(parts[0]);
                    totalMass += mainResult.mass;
                    fullBreakdown = [...mainResult.details];
                    
                    mainResult.details.forEach(d => addToCounts(d.element, d.count, d.atomicMass * d.count));

                    // Process Hydrate (if any)
                    if (parts.length > 1) {
                        const hydratePart = parts[1];
                        const match = hydratePart.match(/^(\d*)(.*)/);
                        const multiplier = match[1] ? parseInt(match[1]) : 1;
                        const formula = match[2];
                        
                        if(formula) {
                            const hydrateResult = parseFormula(formula);
                            const hydrateMass = hydrateResult.mass * multiplier;
                            totalMass += hydrateMass;
                            
                            fullBreakdown.push({
                                type: 'hydrate',
                                count: multiplier,
                                formula: formula,
                                mass: hydrateMass,
                                subDetails: hydrateResult.details
                            });

                            hydrateResult.details.forEach(d => addToCounts(d.element, d.count * multiplier, d.atomicMass * d.count * multiplier));
                        }
                    }

                    const finalMass = parseFloat(totalMass.toFixed(1));
                    setResult(finalMass);
                    setBreakdown(fullBreakdown);

                    // Calculate Composition
                    const compData = Object.entries(atomCounts).map(([el, data]) => ({
                        element: el,
                        mass: data.totalMass,
                        percent: ((data.totalMass / finalMass) * 100).toFixed(1)
                    })).sort((a, b) => b.mass - a.mass); // Sort by mass descending

                    // Check if hydrate exists, calculate water % separately if needed? 
                    // Standard usually asks for element %, but water of crystallization % is also common.
                    // Let's add water % if hydrate exists
                    if (parts.length > 1) {
                        const hydPart = fullBreakdown.find(b => b.type === 'hydrate');
                        if(hydPart) {
                            compData.push({
                                element: 'Water (H₂O)',
                                mass: hydPart.mass,
                                percent: ((hydPart.mass / finalMass) * 100).toFixed(1),
                                isSpecial: true
                            });
                        }
                    }
                    
                    setComposition(compData);

                } catch (e) {
                    setError('無效的化學式。請檢查元素符號及括號。');
                    console.error(e);
                }
            };

            const parseFormula = (formulaStr) => {
                const stack = [{ atoms: {} }];
                let i = 0;
                const len = formulaStr.length;

                while (i < len) {
                    const char = formulaStr[i];

                    if (char === '(') {
                        stack.push({ atoms: {} });
                        i++;
                    } else if (char === ')') {
                        if (stack.length === 1) throw new Error("Unmatched brackets");
                        
                        const group = stack.pop();
                        i++;
                        let numStr = '';
                        while (i < len && /\d/.test(formulaStr[i])) {
                            numStr += formulaStr[i];
                            i++;
                        }
                        const multiplier = numStr ? parseInt(numStr) : 1;
                        
                        const parent = stack[stack.length - 1];
                        for (const [el, count] of Object.entries(group.atoms)) {
                            parent.atoms[el] = (parent.atoms[el] || 0) + count * multiplier;
                        }

                    } else if (/[A-Z]/.test(char)) {
                        let element = char;
                        i++;
                        if (i < len && /[a-z]/.test(formulaStr[i])) {
                            element += formulaStr[i];
                            i++;
                        }

                        let numStr = '';
                        while (i < len && /\d/.test(formulaStr[i])) {
                            numStr += formulaStr[i];
                            i++;
                        }
                        const count = numStr ? parseInt(numStr) : 1;

                        const current = stack[stack.length - 1];
                        current.atoms[element] = (current.atoms[element] || 0) + count;
                    } else {
                        i++;
                    }
                }

                if (stack.length > 1) throw new Error("Unmatched brackets");

                const finalAtoms = stack[0].atoms;
                let mass = 0;
                const details = [];

                for (const [el, count] of Object.entries(finalAtoms)) {
                    const atomicMass = AtomicMasses[el];
                    if (!atomicMass) throw new Error(`Unknown element: ${el}`);
                    mass += atomicMass * count;
                    details.push({ element: el, count, atomicMass });
                }

                return { mass, details };
            };

            // Keypad Input
            const addChar = (char) => {
                setInput(prev => prev + char);
            };
            
            const backspace = () => {
                setInput(prev => prev.slice(0, -1));
            };
            
            const clear = () => {
                setInput('');
                setResult(null);
                setBreakdown([]);
                setComposition([]);
                setError('');
            };

            const loadExample = (ex) => {
                setInput(ex);
            };

            // Auto-calc effect
            useEffect(() => {
                if (input && ExampleCategories.some(cat => cat.items.includes(input))) {
                    calculateMass();
                }
            }, [input]);

            // Chart rendering
            useEffect(() => {
                if (canvasRef.current && result && composition.length > 0) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    
                    // Filter out special entries (like Water) for the main pie chart to avoid double counting
                    const chartData = composition.filter(c => !c.isSpecial);

                    const ctx = canvasRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: chartData.map(c => c.element),
                            datasets: [{
                                data: chartData.map(c => c.mass),
                                backgroundColor: [
                                    '#3b82f6', '#ef4444', '#22c55e', '#eab308', '#a855f7', '#6366f1'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'right' },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const val = context.raw;
                                            const pct = ((val / result) * 100).toFixed(1);
                                            return `${context.label}: ${pct}%`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }, [result, composition]);

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="flask-conical"></i> 式量與百分比計算機
                            </h1>
                            <p className="text-slate-400 text-sm">Formula Mass & Composition Calculator</p>
                        </div>
                        <button onClick={clear} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 清除
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Input & Keypad */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-4">
                            
                            {/* Display Screen */}
                            <div className="bg-white p-4 rounded-2xl shadow-inner border-2 border-indigo-100 flex flex-col min-h-[100px] relative transition-all focus-within:border-indigo-300 focus-within:shadow-md">
                                <span className="text-xs text-slate-400 font-bold uppercase mb-1">Chemical Formula</span>
                                <input 
                                    type="text" 
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    className="w-full text-3xl font-mono font-bold text-slate-800 bg-transparent outline-none placeholder-slate-300"
                                    placeholder="e.g. CuSO4.5H2O"
                                />
                                {error && (
                                    <div className="absolute bottom-2 left-4 text-red-500 text-xs font-bold flex items-center gap-1 animate-pulse">
                                        <i data-lucide="alert-circle" size={12}/> {error}
                                    </div>
                                )}
                            </div>

                            {/* Extended Examples Section */}
                            <div className="bg-white p-3 rounded-xl border border-slate-200">
                                <div className="flex gap-2 overflow-x-auto pb-2 mb-2 border-b border-slate-100">
                                    {ExampleCategories.map((cat, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setActiveCategory(idx)}
                                            className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap transition-all
                                                ${activeCategory === idx ? 'bg-indigo-100 text-indigo-600' : 'text-slate-500 hover:bg-slate-50'}
                                            `}
                                        >
                                            {cat.name.split(' ')[0]}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-2 flex-wrap">
                                    {ExampleCategories[activeCategory].items.map(ex => (
                                        <button 
                                            key={ex}
                                            onClick={() => loadExample(ex)}
                                            className="ex-btn px-3 py-1.5 bg-slate-50 text-slate-600 text-xs font-mono rounded border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200"
                                        >
                                            {ex}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Keypad */}
                            <div className="bg-slate-800 p-4 rounded-2xl shadow-lg">
                                <div className="grid grid-cols-4 gap-2 mb-2">
                                    {['1','2','3','H', '4','5','6','C', '7','8','9','O', '0','(',')','N'].map(k => (
                                        <button 
                                            key={k} 
                                            onClick={() => addChar(k)}
                                            className={`key-btn h-12 rounded-lg font-bold text-lg shadow-sm
                                                ${/[A-Z]/.test(k) ? 'bg-indigo-600 text-white hover:bg-indigo-500' : 'bg-slate-600 text-slate-200 hover:bg-slate-500'}
                                            `}
                                        >
                                            {k}
                                        </button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    <button onClick={() => addChar('.')} className="key-btn h-12 bg-slate-600 text-white rounded-lg font-bold hover:bg-slate-500">.</button>
                                    <button onClick={() => addChar('S')} className="key-btn h-12 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-500">S</button>
                                    <button onClick={backspace} className="key-btn h-12 bg-red-500 text-white rounded-lg font-bold hover:bg-red-400 flex items-center justify-center"><i data-lucide="delete" size={20}/></button>
                                    <button onClick={calculateMass} className="key-btn h-12 bg-green-500 text-white rounded-lg font-bold hover:bg-green-400 shadow-[0_4px_0_rgb(21,128,61)] transform translate-y-[-2px] active:translate-y-[0px] active:shadow-none">
                                        =
                                    </button>
                                </div>
                            </div>

                        </div>

                        {/* Right: Result Breakdown */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-4">
                            
                            {result ? (
                                <div className="animate-in slide-in-from-bottom-4 fade-in duration-500 h-full flex flex-col">
                                    
                                    {/* Total Result Card */}
                                    <div className="bg-indigo-50 rounded-2xl p-5 border border-indigo-100 mb-4 flex justify-between items-center shadow-sm">
                                        <div>
                                            <div className="text-xs text-indigo-400 font-bold uppercase mb-1">Formula Mass / Molar Mass</div>
                                            <div className="text-4xl font-mono font-bold text-indigo-700">{result}</div>
                                            <div className="text-xs text-indigo-300 mt-1 font-bold">g/mol</div>
                                        </div>
                                        <div className="bg-white p-3 rounded-full shadow-sm border border-indigo-100">
                                            <i data-lucide="weight" size={28} className="text-indigo-500" />
                                        </div>
                                    </div>

                                    {/* Tabbed View: Calculation vs Composition */}
                                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex-grow flex flex-col">
                                        
                                        {/* Composition Analysis (Percentage) */}
                                        <div className="p-4 border-b border-slate-100">
                                            <h4 className="font-bold text-slate-600 text-sm flex items-center gap-2 mb-3">
                                                <i data-lucide="pie-chart" size={16} /> 質量百分比 (Percentage by Mass)
                                            </h4>
                                            
                                            <div className="flex flex-col md:flex-row gap-4 items-center">
                                                <div className="w-32 h-32 relative flex-shrink-0">
                                                    <canvas ref={canvasRef}></canvas>
                                                </div>
                                                <div className="flex-grow w-full space-y-2">
                                                    {composition.map((comp, idx) => (
                                                        <div key={idx} className={`flex justify-between items-center text-sm p-2 rounded ${comp.isSpecial ? 'bg-blue-50 border border-blue-100' : 'bg-slate-50'}`}>
                                                            <span className={`font-bold ${comp.isSpecial ? 'text-blue-700' : 'text-slate-700'}`}>{comp.element}</span>
                                                            <div className="flex items-center gap-3">
                                                                <span className="text-xs text-slate-400">{comp.mass.toFixed(1)} g</span>
                                                                <span className={`font-mono font-bold ${comp.isSpecial ? 'text-blue-600' : 'text-indigo-600'}`}>{comp.percent}%</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Calculation Steps (Scrollable if long) */}
                                        <div className="p-4 bg-slate-50 flex-grow overflow-y-auto max-h-[200px]">
                                            <h4 className="font-bold text-slate-500 text-xs uppercase mb-2">計算步驟 (Breakdown)</h4>
                                            <div className="space-y-2 text-sm">
                                                {breakdown.map((item, idx) => (
                                                    item.type === 'hydrate' ? (
                                                        <div key={`hyd-${idx}`} className="text-blue-600 font-mono pl-2 border-l-2 border-blue-300">
                                                            + {item.count} × ({item.formula}) [{item.mass.toFixed(1)}]
                                                        </div>
                                                    ) : (
                                                        <div key={`atom-${idx}`} className="flex justify-between text-slate-600 font-mono border-b border-slate-200 pb-1 last:border-0">
                                                            <span>{item.element} ({item.atomicMass}) × {item.count}</span>
                                                            <span className="font-bold text-slate-800">{(item.atomicMass * item.count).toFixed(1)}</span>
                                                        </div>
                                                    )
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50/50 p-8">
                                    <i data-lucide="calculator" size={48} className="mb-4 opacity-20" />
                                    <p className="text-sm text-center">
                                        請在左側輸入化學式<br/>
                                        (支援水合物如 CuSO4.5H2O)
                                    </p>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic II
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
