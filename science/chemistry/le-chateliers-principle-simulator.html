<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勒沙特列原理模擬器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }

        /* Container transition for Volume change */
        .reaction-container {
            transition: width 0.5s ease-in-out, background-color 0.5s;
        }
        
        /* Piston */
        .piston {
            transition: left 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Systems = [
            {
                id: 'N2O4',
                name: 'N₂O₄ ⇌ 2NO₂',
                type: 'gas',
                equation: 'N₂O₄(g) ⇌ 2NO₂(g)',
                left: { name: 'N₂O₄', color: '#94a3b8', size: 20, label: '無色' }, // Grey/Colorless
                right: { name: 'NO₂', color: '#9a3412', size: 12, label: '紅棕色' }, // Brown
                deltaH: +57, // Endothermic
                kc: 4.0, // Equilibrium constant (ratio target)
                stoichiometry: { L: 1, R: 2 } // 1 L becomes 2 R
            },
            {
                id: 'Co',
                name: '鈷配合物 (Cobalt Complex)',
                type: 'solution',
                equation: 'Co(H₂O)₆²⁺ + 4Cl⁻ ⇌ CoCl₄²⁻ + 6H₂O',
                left: { name: 'Pink', color: '#f472b6', size: 16, label: '粉紅色' },
                right: { name: 'Blue', color: '#3b82f6', size: 16, label: '藍色' },
                deltaH: +100, // Endothermic
                kc: 1.0,
                stoichiometry: { L: 1, R: 1 } // Simplified visual 1:1
            }
        ];

        const App = () => {
            const [system, setSystem] = useState(Systems[0]);
            
            // UI State (Synced from Ref)
            const [uiCounts, setUiCounts] = useState({ L: 10, R: 20 });
            
            // Simulation Parameters
            const [temperature, setTemperature] = useState(298); // K
            const [volume, setVolume] = useState(1.0); // Relative Volume
            
            // Refs for Physics Engine (Mutable state without re-render)
            const particlesRef = useRef([]);
            const requestRef = useRef();
            const containerRef = useRef(null);

            // Initialize / Reset
            useEffect(() => {
                // Initial population
                const newParticles = [];
                // Start with equilibrium-ish ratio
                const initL = 10;
                const initR = 20;
                
                for(let i=0; i<initL; i++) newParticles.push(createParticle('L'));
                for(let i=0; i<initR; i++) newParticles.push(createParticle('R'));
                
                particlesRef.current = newParticles;
                setUiCounts({ L: initL, R: initR });

            }, [system]);

            const createParticle = (type) => {
                return {
                    id: Math.random(),
                    type: type, // 'L' or 'R'
                    x: Math.random() * 90 + 5, // %
                    y: Math.random() * 90 + 5, // %
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    targetSize: type === 'L' ? system.left.size : system.right.size,
                    currentSize: type === 'L' ? system.left.size : system.right.size,
                    color: type === 'L' ? system.left.color : system.right.color
                };
            };

            // Physics Loop
            useEffect(() => {
                const animate = () => {
                    const particles = particlesRef.current;
                    
                    // 1. Calculate Equilibrium Constant (K) based on Temp
                    // Van 't Hoff equation approximation: ln(K2/K1) = -dH/R * (1/T2 - 1/T1)
                    // If Endo (dH > 0), T increases -> K increases (Shift Right)
                    // If Exo (dH < 0), T increases -> K decreases (Shift Left)
                    
                    let K_eq = system.kc;
                    if (system.deltaH > 0) {
                        K_eq = system.kc * Math.pow(1.02, (temperature - 298)/5);
                    } else {
                        K_eq = system.kc * Math.pow(0.98, (temperature - 298)/5);
                    }

                    // 2. Calculate Reaction Quotient (Q)
                    // Count particles
                    let countL = 0;
                    let countR = 0;
                    particles.forEach(p => { if(p.type === 'L') countL++; else countR++; });

                    // Conc = N / V
                    const concL = countL / volume;
                    const concR = countR / volume;
                    
                    // Q calculation (simplified for visual)
                    // N2O4: K = [NO2]^2 / [N2O4]
                    // Co: K = [B] / [A]
                    let Q = 0;
                    if (system.id === 'N2O4') {
                        Q = (concR * concR) / (concL + 0.1); // Avoid div by 0
                    } else {
                        Q = concR / (concL + 0.1);
                    }

                    // 3. Determine Shift Probability
                    // If Q < K, shift Right (L -> R). Speed depends on difference.
                    // If Q > K, shift Left (R -> L).
                    
                    let probForward = 0;
                    let probReverse = 0;
                    const rateConst = 0.05 * (temperature / 298); // Reaction speed increases with T

                    if (Q < K_eq) {
                        // Need more products
                        probForward = rateConst * (1 - Q/K_eq); 
                        probForward = Math.min(0.1, Math.max(0.001, probForward)); // Clamp
                        probReverse = 0.001; // Small back reaction always exists
                    } else {
                        // Need more reactants
                        probReverse = rateConst * (Q/K_eq - 1);
                        probReverse = Math.min(0.1, Math.max(0.001, probReverse));
                        probForward = 0.001;
                    }

                    // 4. Update Particles
                    const newParticles = [];
                    
                    // Speed factor from temp
                    const speed = temperature / 298;

                    for (let i = 0; i < particles.length; i++) {
                        let p = particles[i];
                        
                        // Move
                        p.x += p.vx * speed;
                        p.y += p.vy * speed;
                        
                        // Bounce
                        if (p.x <= 0 || p.x >= 100) p.vx *= -1;
                        if (p.y <= 0 || p.y >= 100) p.vy *= -1;
                        p.x = Math.max(0, Math.min(100, p.x));
                        p.y = Math.max(0, Math.min(100, p.y));

                        // Animate Size/Color transition
                        p.currentSize = p.currentSize * 0.9 + p.targetSize * 0.1;

                        // Reaction Logic
                        let reacted = false;

                        if (p.type === 'L' && Math.random() < probForward) {
                            // React: L -> n*R
                            reacted = true;
                            const n = system.stoichiometry.R; 
                            // Convert this particle to R
                            p.type = 'R';
                            p.targetSize = system.right.size;
                            p.color = system.right.color;
                            newParticles.push(p);
                            
                            // Create (n-1) extra R particles if needed
                            for(let k=1; k<n; k++) {
                                const extra = createParticle('R');
                                extra.x = p.x; extra.y = p.y; // Spawn at same location
                                newParticles.push(extra);
                            }

                        } else if (p.type === 'R' && Math.random() < probReverse) {
                            // React: n*R -> L
                            // Simplification: Just convert R -> L. 
                            // For N2O4 (2NO2 -> N2O4), ideally we need collision of 2 Rs.
                            // For visual simplicity in this "Probability Model", we allow spontaneous conversion
                            // but scale probability to mimic collision requirement if needed.
                            // Here we just convert 1 R to 1 L, and to maintain mass balance approx for N2O4,
                            // we might need to delete another R? 
                            // Implementing "Collision" is hard. Let's use "Decay/Fusion" model.
                            
                            if (system.id === 'N2O4') {
                                // Try to find a neighbor R to fuse with
                                // For sim performance, let's just randomly delete another R from the list later?
                                // Or easier: Only convert if we get "heads" on a coin flip, and on "tails" we just kill a particle?
                                // Let's just convert R -> L directly. It violates mass conservation visually (1 big made from 1 small)
                                // UNLESS we say L is just a different state.
                                // Visual trick: 1 R becomes 1 L. 
                                // To be accurate: 2 R becomes 1 L.
                                // Let's try to find a neighbor.
                                let partnerIdx = -1;
                                for(let j=0; j<particles.length; j++) {
                                    if(i!==j && particles[j].type === 'R') {
                                        const dx = p.x - particles[j].x;
                                        const dy = p.y - particles[j].y;
                                        if (dx*dx + dy*dy < 25) { // Close enough
                                            partnerIdx = j;
                                            break;
                                        }
                                    }
                                }
                                
                                if (partnerIdx !== -1) {
                                    // Found partner, Fuse!
                                    reacted = true;
                                    p.type = 'L';
                                    p.targetSize = system.left.size;
                                    p.color = system.left.color;
                                    newParticles.push(p);
                                    // Mark partner for deletion (we handle this by NOT adding it to newParticles when we iterate to it)
                                    particles[partnerIdx].dead = true; 
                                } else {
                                    // No partner, no reaction
                                    newParticles.push(p);
                                }

                            } else {
                                // 1:1 reaction
                                reacted = true;
                                p.type = 'L';
                                p.targetSize = system.left.size;
                                p.color = system.left.color;
                                newParticles.push(p);
                            }

                        } else {
                            // No reaction
                            if (!p.dead) newParticles.push(p);
                        }
                    }
                    
                    particlesRef.current = newParticles;
                    
                    // Sync UI counts occasionally to prevent React lag, or every frame if fast enough
                    // Let's do every frame for smoothness
                    let finalL = 0; 
                    let finalR = 0;
                    newParticles.forEach(p => p.type === 'L' ? finalL++ : finalR++);
                    setUiCounts({ L: finalL, R: finalR });

                    requestRef.current = requestAnimationFrame(animate);
                };
                
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [temperature, volume, system]);

            // Manual Controls
            const addParticle = (type) => {
                const p = createParticle(type);
                particlesRef.current.push(p);
                // Force UI update will happen next frame
            };

            // Helper to render particles
            // We use a Canvas for performance if many particles, but DOM is fine for <100
            // Using DOM here for simplicity with Tailwind styling
            
            // Color Calculation
            const getBgColor = () => {
                const total = uiCounts.L + uiCounts.R;
                if (total === 0) return '#fff';
                
                if (system.id === 'N2O4') {
                    // White to Brown
                    const ratio = uiCounts.R / (total || 1); // More R (NO2) = Brown
                    // NO2 is Brown (154, 52, 18). N2O4 is Colorless (255,255,255)
                    // A bit of opacity
                    return `rgba(154, 52, 18, ${ratio * 0.5})`;
                } else {
                    // Pink to Blue
                    // Pink (244, 114, 182) to Blue (59, 130, 246)
                    const ratio = uiCounts.R / (total || 1); 
                    const r = 244 + (59 - 244) * ratio;
                    const g = 114 + (130 - 114) * ratio;
                    const b = 182 + (246 - 182) * ratio;
                    return `rgba(${r}, ${g}, ${b}, 0.5)`;
                }
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="scale"></i> 勒沙特列原理模擬器
                            </h1>
                            <p className="text-slate-400 text-sm">Le Chatelier's Principle Simulator v3.0</p>
                        </div>
                        
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            {Systems.map(s => (
                                <button
                                    key={s.id}
                                    onClick={() => { setSystem(s); setTemperature(298); setVolume(1.0); }}
                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${system.id === s.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}
                                >
                                    {s.name.split(' ')[0]}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow items-start">
                        
                        {/* Left: Controls */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            <div className="bg-white p-4 rounded-2xl border border-indigo-100 text-center shadow-sm">
                                <div className="text-xs text-slate-400 font-bold uppercase mb-2">平衡方程式 (Equilibrium)</div>
                                <div className="text-lg font-mono font-bold text-slate-800">{system.equation}</div>
                                <div className={`text-xs font-bold mt-1 ${system.deltaH > 0 ? 'text-red-500' : 'text-blue-500'}`}>
                                    ΔH = {system.deltaH > 0 ? '+' : ''}{system.deltaH} kJ (吸熱)
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                                    <i data-lucide="sliders" size={16}/> 擾亂平衡
                                </h3>

                                {/* Concentration */}
                                <div className="mb-6">
                                    <label className="text-xs font-bold text-slate-600 block mb-2">濃度 (加粒子)</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => addParticle('L')} className="p-2 bg-slate-100 rounded hover:bg-indigo-50 text-indigo-600 text-xs font-bold flex items-center justify-center gap-1 transition-colors border border-slate-200">
                                            + {system.left.name}
                                        </button>
                                        <button onClick={() => addParticle('R')} className="p-2 bg-slate-100 rounded hover:bg-orange-50 text-orange-600 text-xs font-bold flex items-center justify-center gap-1 transition-colors border border-slate-200">
                                            + {system.right.name}
                                        </button>
                                    </div>
                                </div>

                                {/* Temperature */}
                                <div className="mb-6">
                                    <div className="flex justify-between mb-1">
                                        <label className="text-xs font-bold text-red-500">溫度 (Temperature)</label>
                                        <span className="text-xs font-mono font-bold">{temperature} K</span>
                                    </div>
                                    <input 
                                        type="range" min="273" max="373" step="1" 
                                        value={temperature} 
                                        onChange={(e) => setTemperature(Number(e.target.value))}
                                        className="w-full h-2 bg-gradient-to-r from-blue-300 to-red-300 rounded-lg appearance-none cursor-pointer"
                                    />
                                </div>

                                {/* Volume */}
                                {system.type === 'gas' && (
                                    <div className="mb-2">
                                        <div className="flex justify-between mb-1">
                                            <label className="text-xs font-bold text-blue-500">體積 (Volume)</label>
                                            <span className="text-xs font-mono font-bold">{volume.toFixed(1)}x</span>
                                        </div>
                                        <input 
                                            type="range" min="0.5" max="2.0" step="0.1" 
                                            value={volume} 
                                            onChange={(e) => setVolume(Number(e.target.value))}
                                            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                        />
                                    </div>
                                )}
                            </div>

                            {/* Stats */}
                            <div className="bg-slate-800 text-white p-4 rounded-xl shadow-lg text-center">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <div className="text-3xl font-mono font-black text-slate-200">{uiCounts.L}</div>
                                        <div className="text-[10px] text-slate-500 uppercase">反應物 (Left)</div>
                                    </div>
                                    <div>
                                        <div className="text-3xl font-mono font-black text-slate-200">{uiCounts.R}</div>
                                        <div className="text-[10px] text-slate-500 uppercase">生成物 (Right)</div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* Right: Visualization */}
                        <div className="w-full lg:w-2/3 bg-white rounded-3xl border-4 border-slate-200 p-8 shadow-xl min-h-[500px] flex flex-col items-center justify-center relative overflow-hidden">
                            
                            {/* Container */}
                            <div 
                                className="reaction-container relative border-4 border-slate-400 rounded-xl overflow-hidden shadow-inner"
                                style={{
                                    width: system.type === 'gas' ? `${volume * 50}%` : '60%',
                                    height: '320px',
                                    backgroundColor: getBgColor()
                                }}
                            >
                                {/* Render Particles */}
                                {particlesRef.current.map((p) => (
                                    <div 
                                        key={p.id}
                                        className="absolute rounded-full shadow-sm transition-colors duration-300"
                                        style={{
                                            left: `${p.x}%`,
                                            top: `${p.y}%`,
                                            width: `${p.currentSize}px`,
                                            height: `${p.currentSize}px`,
                                            backgroundColor: p.color,
                                            transform: 'translate(-50%, -50%)'
                                        }}
                                    ></div>
                                ))}
                            </div>

                            {/* Piston Visual */}
                            {system.type === 'gas' && (
                                <div 
                                    className="absolute h-[340px] w-6 bg-slate-600 rounded-l piston shadow-xl flex items-center justify-center"
                                    style={{ 
                                        left: `calc(50% + ${volume * 25}% + 6px)`, 
                                        top: '50%', transform: 'translateY(-50%)'
                                    }}
                                >
                                    <div className="w-1 h-12 bg-white/20 rounded"></div>
                                </div>
                            )}
                            
                            {/* Legend */}
                            <div className="flex gap-8 mt-8">
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded-full" style={{backgroundColor: system.left.color}}></div>
                                    <div className="text-xs font-bold text-slate-600">{system.left.name}</div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 rounded-full" style={{backgroundColor: system.right.color}}></div>
                                    <div className="text-xs font-bold text-slate-600">{system.right.name}</div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8 border-t border-slate-200 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic X
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
