<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加成聚合器 (Addition Polymerization Maker)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Monomer Animation */
        .monomer {
            transition: all 0.5s ease;
        }
        
        /* Bond Opening Animation */
        @keyframes open-bond {
            0% { transform: rotate(0deg); width: 40px; }
            50% { transform: rotate(90deg); width: 20px; opacity: 0.5; }
            100% { transform: rotate(180deg); width: 60px; opacity: 1; }
        }
        .bond-opening {
            animation: open-bond 1s ease-out forwards;
        }

        /* Chain Growth */
        .polymer-chain {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: auto;
            padding: 20px;
        }
        
        .bracket {
            font-size: 4rem;
            font-weight: 100;
            color: #cbd5e1;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Monomer Data (Updated with Conditions)
        const Monomers = [
            { 
                id: 'ethene', 
                name: '乙烯 (Ethene)', 
                polymer: '聚乙烯 (Polythene / PE)', 
                sideGroups: ['H', 'H', 'H', 'H'], 
                color: 'bg-blue-500',
                uses: '膠袋 (Plastic bags), 膠樽 (Bottles)',
                conditions: [
                    { type: 'LDPE (低密度)', detail: '高壓 (1000 atm), 高溫 (200°C), 微量氧' },
                    { type: 'HDPE (高密度)', detail: '低壓, 低溫, 齊格勒-納塔催化劑 (Ziegler-Natta Catalyst)' }
                ]
            },
            { 
                id: 'propene', 
                name: '丙烯 (Propene)', 
                polymer: '聚丙烯 (Polypropene / PP)', 
                sideGroups: ['CH₃', 'H', 'H', 'H'], 
                color: 'bg-yellow-500',
                uses: '繩索 (Ropes), 堅硬塑膠容器, 醫療器材',
                conditions: [
                    { type: '一般條件', detail: '齊格勒-納塔催化劑 (Ziegler-Natta Catalyst), 溫和溫度與壓力' }
                ]
            },
            { 
                id: 'chloroethene', 
                name: '氯乙烯 (Chloroethene)', 
                polymer: '聚氯乙烯 (PVC)', 
                sideGroups: ['Cl', 'H', 'H', 'H'], 
                color: 'bg-green-500',
                uses: '水管 (Water pipes), 電線絕緣層, 雨衣',
                conditions: [
                    { type: '一般條件', detail: '過氧化物引發劑 (Peroxide initiator), 加熱 (40-60°C), 高壓' }
                ]
            },
            { 
                id: 'styrene', 
                name: '苯乙烯 (Styrene)', 
                polymer: '聚苯乙烯 (Polystyrene / PS)', 
                sideGroups: ['C₆H₅', 'H', 'H', 'H'], 
                color: 'bg-purple-500',
                uses: '發泡膠 (Foam), 即棄餐具, CD盒',
                conditions: [
                    { type: '一般條件', detail: '過氧化物引發劑 (Peroxide initiator), 加熱 (Reflux)' }
                ]
            }
        ];

        const App = () => {
            const [selectedMonomer, setSelectedMonomer] = useState(Monomers[0]);
            const [isPolymerizing, setIsPolymerizing] = useState(false);
            const [step, setStep] = useState(0); // 0: Ready, 1: Open Bond, 2: Connect
            const [chainLength, setChainLength] = useState(1);

            const startPolymerization = () => {
                if (isPolymerizing) return;
                setIsPolymerizing(true);
                setStep(0);
                setChainLength(1);

                // Animation Sequence
                setTimeout(() => setStep(1), 500); // Open bonds
                setTimeout(() => {
                    setStep(2);
                    // Grow chain
                    let count = 1;
                    const interval = setInterval(() => {
                        count++;
                        setChainLength(count);
                        if (count >= 3) {
                            clearInterval(interval);
                            setIsPolymerizing(false);
                        }
                    }, 800);
                }, 1500);
            };

            const reset = () => {
                setIsPolymerizing(false);
                setStep(0);
                setChainLength(1);
            };

            // Render a single unit (monomer or repeating unit)
            const Unit = ({ type, groups, isOpen, isLinked }) => {
                return (
                    <div className={`relative flex flex-col items-center transition-all duration-1000 ${isLinked ? 'mx-0' : 'mx-4'}`}>
                        
                        {/* Top Groups */}
                        <div className="flex gap-8 mb-1">
                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold border border-slate-500">{groups[0]}</div>
                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold border border-slate-500">{groups[2]}</div>
                        </div>

                        {/* Carbon Backbone */}
                        <div className="flex items-center relative">
                            {/* Left Bond */}
                            <div className={`h-2 bg-white transition-all duration-500 ${isOpen ? 'w-8 -ml-8' : 'w-0'}`}></div>
                            
                            {/* C-C Core */}
                            <div className="flex items-center gap-0 relative bg-slate-800 px-2 py-1 rounded-lg border border-slate-600 z-10">
                                <div className="w-10 h-10 rounded-full bg-slate-600 flex items-center justify-center font-bold text-xl shadow-inner">C</div>
                                
                                {/* Double/Single Bond */}
                                <div className="w-12 h-8 flex flex-col justify-center items-center gap-1 mx-1">
                                    <div className="w-full h-1.5 bg-white rounded-full"></div>
                                    <div className={`w-full h-1.5 bg-white rounded-full transition-all duration-500 ${isOpen ? 'opacity-0 scale-x-0' : 'opacity-100 scale-x-100'}`}></div>
                                </div>

                                <div className="w-10 h-10 rounded-full bg-slate-600 flex items-center justify-center font-bold text-xl shadow-inner">C</div>
                            </div>

                            {/* Right Bond */}
                            <div className={`h-2 bg-white transition-all duration-500 ${isOpen ? 'w-8 -mr-8' : 'w-0'}`}></div>
                        </div>

                        {/* Bottom Groups */}
                        <div className="flex gap-8 mt-1">
                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold border border-slate-500">{groups[1]}</div>
                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold border border-slate-500">{groups[3]}</div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-yellow-400 flex items-center gap-2">
                                <i data-lucide="link"></i> 加成聚合器
                            </h1>
                            <p className="text-slate-400 text-sm">Addition Polymerization Maker</p>
                        </div>
                        <button onClick={reset} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-sm flex items-center gap-2 transition-colors border border-slate-600">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Reaction Stage */}
                        <div className="w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative flex flex-col items-center justify-center min-h-[500px] shadow-2xl overflow-hidden p-8">
                            
                            {/* Background Grid */}
                            <div className="absolute inset-0 opacity-10" 
                                 style={{backgroundImage: 'radial-gradient(#fbbf24 1px, transparent 1px)', backgroundSize: '30px 30px'}}></div>

                            {/* Info Tag */}
                            <div className="absolute top-4 left-4 bg-slate-900/80 px-3 py-1 rounded-lg border border-slate-600 text-xs font-bold text-yellow-400 uppercase tracking-wider z-20">
                                {step === 0 ? '單體 (Monomers)' : step === 1 ? '斷鍵 (Breaking Double Bond)' : '聚合 (Polymerization)'}
                            </div>

                            {/* Main Visualization */}
                            <div className="relative z-10 w-full h-64 flex items-center justify-center overflow-hidden">
                                {step < 2 ? (
                                    /* Monomers Stage */
                                    <div className="flex gap-4">
                                        <Unit groups={selectedMonomer.sideGroups} isOpen={step === 1} isLinked={false} />
                                        <div className="text-4xl font-bold text-slate-500 pt-12">+</div>
                                        <Unit groups={selectedMonomer.sideGroups} isOpen={step === 1} isLinked={false} />
                                        <div className="text-4xl font-bold text-slate-500 pt-12">+</div>
                                        <Unit groups={selectedMonomer.sideGroups} isOpen={step === 1} isLinked={false} />
                                    </div>
                                ) : (
                                    /* Polymer Stage */
                                    <div className="flex items-center animate-in slide-in-from-right duration-1000">
                                        <div className="text-slate-400 text-4xl mr-2 font-light">~</div>
                                        {Array.from({length: chainLength}).map((_, i) => (
                                            <Unit key={i} groups={selectedMonomer.sideGroups} isOpen={true} isLinked={true} />
                                        ))}
                                        <div className="text-slate-400 text-4xl ml-2 font-light">~</div>
                                    </div>
                                )}
                            </div>

                            {/* Equation Display */}
                            <div className="absolute bottom-24 text-center w-full px-4">
                                <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-600 inline-block">
                                    <div className="text-xs text-slate-400 font-bold mb-1">Chemical Equation</div>
                                    <div className="font-mono text-lg text-white">
                                        n <span className="text-yellow-400">{selectedMonomer.name.split(' ')[0]}</span> &rarr; 
                                        <span className="text-green-400"> {selectedMonomer.polymer.split(' ')[0]}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Action Button */}
                            <div className="absolute bottom-8 z-20">
                                <button 
                                    onClick={startPolymerization}
                                    disabled={isPolymerizing || step === 2}
                                    className={`px-8 py-3 rounded-full font-bold text-lg shadow-lg transition-all flex items-center gap-2
                                        ${step === 2 ? 'bg-green-600 text-white cursor-default' : 'bg-yellow-500 hover:bg-yellow-600 text-slate-900'}
                                    `}
                                >
                                    {step === 2 ? <span><i className="inline-block mr-2" data-lucide="check" /> 反應完成</span> : <span><i className="inline-block mr-2" data-lucide="play" /> 開始聚合 (Start)</span>}
                                </button>
                            </div>

                        </div>

                        {/* Right: Selection & Info */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Monomer Selector */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="layers" /> 選擇單體 (Select Monomer)
                                </h3>
                                <div className="space-y-2">
                                    {Monomers.map(m => (
                                        <button
                                            key={m.id}
                                            onClick={() => { setSelectedMonomer(m); reset(); }}
                                            disabled={isPolymerizing && step > 0}
                                            className={`w-full p-3 rounded-xl border text-left transition-all flex justify-between items-center
                                                ${selectedMonomer.id === m.id 
                                                    ? 'bg-yellow-500/10 border-yellow-500 text-yellow-400' 
                                                    : 'bg-slate-700/30 border-slate-600 text-slate-400 hover:bg-slate-700'}
                                            `}
                                        >
                                            <span className="font-bold">{m.name.split(' ')[0]}</span>
                                            <span className="text-xs opacity-70 font-mono">{m.sideGroups[0]} group</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Polymer Info */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow animate-in fade-in slide-in-from-bottom-4">
                                <div className="mb-4">
                                    <div className="text-xs text-slate-400 uppercase font-bold mb-1">Resulting Polymer</div>
                                    <div className="text-2xl font-bold text-white mb-2">{selectedMonomer.polymer}</div>
                                    <div className="inline-block bg-green-900/30 text-green-400 px-3 py-1 rounded-full text-xs border border-green-800 font-mono">
                                        Repeating Unit: -[ C-C ]-
                                    </div>
                                </div>

                                <div className="space-y-4 text-sm text-slate-300 leading-relaxed border-t border-slate-700 pt-4">
                                    <div>
                                        <strong className="text-yellow-400 block mb-1 text-xs uppercase">主要用途 (Uses)</strong>
                                        <p>{selectedMonomer.uses}</p>
                                    </div>

                                    {/* Process Conditions Section - NEW */}
                                    <div className="bg-purple-900/30 p-3 rounded-lg border border-purple-700/50">
                                        <strong className="text-purple-300 block mb-2 text-xs uppercase flex items-center gap-2">
                                            <i data-lucide="settings-2" size={12}/> 反應條件 (Process Conditions)
                                        </strong>
                                        <ul className="space-y-2">
                                            {selectedMonomer.conditions.map((cond, idx) => (
                                                <li key={idx} className="text-xs border-l-2 border-purple-500 pl-2">
                                                    {cond.type !== '一般條件' && <span className="font-bold text-purple-200 block">{cond.type}</span>}
                                                    <span className="text-slate-300">{cond.detail}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    
                                    <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-600 mt-2">
                                        <strong className="text-blue-400 block mb-1 text-xs uppercase flex items-center gap-1">
                                            <i data-lucide="info" size={12}/> 觀察重點
                                        </strong>
                                        <ul className="list-disc list-inside pl-1 text-xs text-slate-400 space-y-1">
                                            <li>C=C 雙鍵斷開 (Breaking of double bond)。</li>
                                            <li>變成 C-C 單鍵 (Single bonds formed)。</li>
                                            <li>單體首尾相連，碳主鏈延長。</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic V
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
