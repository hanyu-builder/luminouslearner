<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagent Master - Organic Chemistry Quiz</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className}></i>;
        };

        const questionBank = [
            { from: "Alkene", to: "Alkane", correct: "H₂ / Pt", distractors: ["H₂SO₄", "LiAlH₄", "NaBH₄"], note: "Catalytic Hydrogenation adds H₂." },
            { from: "Alkene", to: "Haloalkane", correct: "HX (g)", distractors: ["X₂ / UV light", "KOH (alc)", "PCl₅"], note: "Electrophilic Addition (Markovnikov)." },
            { from: "Alkene", to: "Diol", correct: "Cold dil. KMnO₄ / H⁺", distractors: ["Conc. H₂SO₄", "K₂Cr₂O₇ / H⁺", "O₃"], note: "Mild oxidation." },
            { from: "Haloalkane", to: "Alcohol", correct: "NaOH (aq), heat", distractors: ["NaOH (alc), heat", "Conc. H₂SO₄", "H₂O"], note: "Aqueous = Substitution. Alcoholic = Elimination." },
            { from: "Haloalkane", to: "Alkene", correct: "NaOH (alc), heat", distractors: ["NaOH (aq), heat", "Conc. H₂SO₄", "H₂ / Pt"], note: "Elimination requires alcoholic conditions." },
            { from: "Haloalkane", to: "Nitrile", correct: "KCN (alc), reflux", distractors: ["HCN", "NH₃", "HNO₃"], note: "Step-up reaction (+1 Carbon)." },
            { from: "1° Alcohol", to: "Aldehyde", correct: "K₂Cr₂O₇ / H⁺, Distil", distractors: ["KMnO₄ / H⁺, Reflux", "LiAlH₄", "Conc. H₂SO₄"], note: "Distillation removes aldehyde before further oxidation." },
            { from: "1° Alcohol", to: "Carboxylic Acid", correct: "KMnO₄ / H⁺, Reflux", distractors: ["PCC", "NaBH₄", "NaOH"], note: "Reflux ensures complete oxidation." },
            { from: "Carboxylic Acid", to: "1° Alcohol", correct: "LiAlH₄ in dry ether", distractors: ["NaBH₄", "H₂ / Pt", "Sn / HCl"], note: "Only LiAlH₄ is strong enough." },
            { from: "Carboxylic Acid", to: "Acyl Chloride", correct: "SOCl₂", distractors: ["Cl₂", "HCl", "NaCl"], note: "Thionyl chloride replaces -OH with -Cl." },
            { from: "Acyl Chloride", to: "Amide", correct: "NH₃ (conc)", distractors: ["HNO₃", "NH₄Cl", "NaNO₂"], note: "Nucleophilic substitution." },
            { from: "Benzene", to: "Nitrobenzene", correct: "Conc. HNO₃ / Conc. H₂SO₄", distractors: ["Dil. HNO₃", "HNO₃ / Reflux", "NaNO₂ / HCl"], note: "Nitration mixture generates NO₂⁺." },
            { from: "Benzene", to: "Bromobenzene", correct: "Br₂ / FeBr₃", distractors: ["Br₂ (aq)", "Br₂ / UV light", "HBr"], note: "Need Lewis Acid catalyst (FeBr₃)." },
            { from: "Methylbenzene", to: "Benzoic Acid", correct: "KMnO₄ / OH⁻, Reflux", distractors: ["K₂Cr₂O₇ / H⁺", "O₃", "Conc. HNO₃"], note: "Side-chain oxidation." },
            { from: "Nitrobenzene", to: "Phenylamine", correct: "Sn / Conc. HCl", distractors: ["LiAlH₄", "H₂ / Pt", "NaBH₄"], note: "Reduction of Nitro group." },
            { from: "Phenylamine", to: "Diazonium Salt", correct: "NaNO₂ / HCl, < 5°C", distractors: ["HNO₃", "NH₃", "Reflux"], note: "Must be cold (< 5°C)." },
            { from: "Diazonium Salt", to: "Benzonitrile", correct: "CuCN", distractors: ["KCN", "HCN", "CH₃CN"], note: "Sandmeyer Reaction." },
            { from: "Diazonium Salt", to: "Phenol", correct: "H₂O, Warm", distractors: ["NaOH", "OH⁻", "Alcohol"], note: "Hydrolysis releases N₂ gas." }
        ];

        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        const App = () => {
            // Explicit Game Status: 'loading' | 'playing' | 'finished'
            const [status, setStatus] = useState('loading');
            
            // Data State
            const [deck, setDeck] = useState([]);
            const [index, setIndex] = useState(0);
            
            // Score State
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            
            // Interaction State
            const [feedback, setFeedback] = useState(null); 
            const [selected, setSelected] = useState(null);

            // 1. Initialize Game on Mount
            useEffect(() => {
                startNewGame();
            }, []);

            const startNewGame = () => {
                setStatus('loading');
                
                // Simulate tiny delay to ensure state clears (safety)
                setTimeout(() => {
                    const rawQuestions = shuffleArray(questionBank).slice(0, 10);
                    
                    // Prepare deck with pre-shuffled options
                    const newDeck = rawQuestions.map(q => ({
                        ...q,
                        options: shuffleArray([q.correct, ...q.distractors])
                    }));

                    setDeck(newDeck);
                    setIndex(0);
                    setScore(0);
                    setStreak(0);
                    setFeedback(null);
                    setSelected(null);
                    setStatus('playing'); // Only switch to playing when deck is ready
                }, 50);
            };

            const handleAnswer = (option) => {
                if (feedback) return; // Prevent double clicks
                
                const currentQ = deck[index];
                const isCorrect = option === currentQ.correct;
                setSelected(option);

                if (isCorrect) {
                    setScore(s => s + 10 + (streak * 2));
                    setStreak(s => s + 1);
                    setFeedback({ isCorrect: true, message: "Correct! " + currentQ.note });
                } else {
                    setStreak(0);
                    setFeedback({ isCorrect: false, message: currentQ.note, correctVal: currentQ.correct });
                }
            };

            const handleNext = () => {
                // CRITICAL FIX: Check bounds before updating state
                if (index < deck.length - 1) {
                    setIndex(prev => prev + 1); // Move to next question
                    setFeedback(null);          // Clear old feedback
                    setSelected(null);          // Clear old selection
                } else {
                    setStatus('finished');      // End game
                }
            };

            // --- VIEW 1: LOADING (Crash Prevention) ---
            if (status === 'loading') {
                return (
                    <div className="min-h-screen bg-[#0F172A] flex items-center justify-center">
                        <div className="flex flex-col items-center gap-4">
                            <Icon name="loader-2" className="w-10 h-10 text-emerald-500 animate-spin" />
                            <span className="text-emerald-400 font-mono text-sm tracking-widest">PREPARING REAGENTS...</span>
                        </div>
                    </div>
                );
            }

            // --- VIEW 2: RESULTS ---
            if (status === 'finished') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#0F172A] text-center">
                        <div className="bg-slate-800/80 backdrop-blur p-8 rounded-3xl border border-slate-700 shadow-2xl max-w-md w-full animate-slide-up">
                            <div className="mb-6">
                                <div className="text-6xl mb-4 animate-bounce">{score > 80 ? '🏆' : (score > 50 ? '🧪' : '💥')}</div>
                                <h2 className="text-3xl font-bold text-white mb-2">Quiz Complete!</h2>
                                <p className="text-slate-400">Final Score</p>
                            </div>
                            <div className="text-6xl font-black text-emerald-400 mb-8">{score}</div>
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-700">
                                    <div className="text-slate-500 text-xs uppercase font-bold">Accuracy</div>
                                    <div className="text-xl font-bold text-white">{(score / (10*15) * 100).toFixed(0)}%</div>
                                </div>
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-700">
                                    <div className="text-slate-500 text-xs uppercase font-bold">Max Streak</div>
                                    <div className="text-xl font-bold text-yellow-400">x{streak}</div>
                                </div>
                            </div>
                            <button onClick={startNewGame} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-colors flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                                <Icon name="rotate-ccw" className="w-5 h-5"/> Play Again
                            </button>
                        </div>
                    </div>
                );
            }

            // --- VIEW 3: PLAYING ---
            
            // ★ THE ULTIMATE GUARD CLAUSE ★
            // If for ANY reason the deck is empty or index is wrong, show Loading instead of Crashing.
            const currentQ = deck[index];
            if (!currentQ) {
                // Auto-recover if something goes wrong
                setTimeout(() => setStatus('finished'), 1000); 
                return <div className="min-h-screen bg-[#0F172A]"></div>;
            }

            return (
                <div className="min-h-screen bg-[#0F172A] flex flex-col items-center p-4 md:p-8">
                    {/* Header */}
                    <div className="w-full max-w-2xl flex justify-between items-center mb-8 bg-slate-800/50 p-4 rounded-2xl backdrop-blur border border-slate-700">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-white border border-slate-600">
                                {index + 1}
                            </div>
                            <div className="text-sm text-slate-400">Question {index + 1} / {deck.length}</div>
                        </div>
                        <div className="flex items-center gap-4">
                             {streak > 1 && (
                                <div className="flex items-center gap-1 text-orange-400 font-bold animate-pulse">
                                    <Icon name="flame" className="w-5 h-5 fill-current"/> {streak}
                                </div>
                             )}
                             <div className="bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700 font-mono text-emerald-400 font-bold">
                                {score} pts
                             </div>
                        </div>
                    </div>

                    {/* Question Area */}
                    <div className="w-full max-w-2xl bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden mb-6 relative">
                        {/* Progress Bar */}
                        <div className="absolute top-0 left-0 w-full h-1 bg-slate-700">
                            <div className="h-full bg-emerald-500 transition-all duration-500" style={{width: `${((index) / 10) * 100}%`}}></div>
                        </div>

                        <div className="p-8 text-center space-y-6">
                            <h2 className="text-slate-400 uppercase tracking-widest text-xs font-bold">Conversion Task</h2>
                            <div className="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8 my-4">
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-600 w-full md:w-auto min-w-[160px]">
                                    <div className="text-xl font-bold text-white">{currentQ.from}</div>
                                </div>
                                <div className="flex flex-col items-center gap-2 text-slate-500">
                                    <Icon name="arrow-right" className="w-8 h-8 hidden md:block" />
                                    <Icon name="arrow-down" className="w-8 h-8 md:hidden" />
                                    <span className="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">Reagent?</span>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-emerald-900/50 w-full md:w-auto min-w-[160px] shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                                    <div className="text-xl font-bold text-emerald-400">{currentQ.to}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Options Area */}
                    <div className="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-4">
                        {currentQ.options.map((opt, i) => {
                            let btnClass = "p-4 rounded-xl font-mono text-sm md:text-base font-bold border-2 transition-all duration-200 flex items-center justify-center relative min-h-[80px] ";
                            
                            if (feedback) {
                                if (opt === currentQ.correct) {
                                    btnClass += "bg-emerald-600 border-emerald-500 text-white shadow-lg opacity-100";
                                } else if (opt === selected) {
                                    btnClass += "bg-red-500/20 border-red-500 text-red-200 opacity-50";
                                } else {
                                    btnClass += "bg-slate-800 border-slate-700 text-slate-500 opacity-30";
                                }
                            } else {
                                btnClass += "bg-slate-800 border-slate-700 text-slate-200 hover:border-blue-400 hover:bg-slate-750 hover:scale-[1.02] active:scale-[0.98] cursor-pointer";
                            }

                            return (
                                <button 
                                    key={i} 
                                    onClick={() => handleAnswer(opt)} 
                                    disabled={!!feedback} 
                                    className={btnClass}
                                >
                                    {opt}
                                    {feedback && opt === currentQ.correct && (
                                        <Icon name="check-circle" className="absolute right-4 w-5 h-5 text-white" />
                                    )}
                                </button>
                            );
                        })}
                    </div>

                    {/* Feedback & Next Button */}
                    {feedback && (
                        <div className={`w-full max-w-2xl mt-6 p-4 rounded-2xl border flex items-center gap-4 animate-slide-up shadow-lg ${feedback.isCorrect ? 'bg-emerald-900/40 border-emerald-500/50' : 'bg-red-900/40 border-red-500/50'}`}>
                            <div className={`p-3 rounded-full shrink-0 ${feedback.isCorrect ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                                <Icon name={feedback.isCorrect ? "check" : "x"} className="w-6 h-6" />
                            </div>
                            <div className="flex-1">
                                <h3 className={`font-bold text-lg ${feedback.isCorrect ? 'text-emerald-400' : 'text-red-400'}`}>
                                    {feedback.isCorrect ? "Correct!" : "Not quite..."}
                                </h3>
                                {!feedback.isCorrect && (
                                    <p className="text-slate-300 text-sm mt-1">
                                        Answer: <span className="font-mono font-bold text-white bg-slate-800 px-2 py-0.5 rounded border border-slate-600">{feedback.correctVal}</span>
                                    </p>
                                )}
                                <p className="text-slate-400 text-sm mt-1">{feedback.message}</p>
                            </div>
                            <button 
                                onClick={handleNext} 
                                className="px-6 py-3 bg-white text-slate-900 font-bold rounded-xl hover:bg-slate-100 transition-colors shadow-md whitespace-nowrap"
                            >
                                Next <Icon name="arrow-right" className="w-4 h-4 inline ml-1"/>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
