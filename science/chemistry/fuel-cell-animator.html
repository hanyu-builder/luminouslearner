<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>燃料電池動畫師 (Fuel Cell Animator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }

        /* Flow Animations */
        @keyframes flow-right {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(100px); opacity: 0; }
        }
        .electron {
            width: 8px; height: 8px; background-color: #facc15; border-radius: 50%;
            position: absolute; box-shadow: 0 0 5px #facc15;
            animation: flow-right 2s linear infinite;
        }
        
        @keyframes ion-move {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(150px); opacity: 0; }
        }
        .proton {
            width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%;
            position: absolute;
            animation: ion-move 3s linear infinite;
        }

        /* Gas movement */
        @keyframes gas-in {
            0% { transform: translateX(-20px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .gas-molecule { animation: gas-in 1s infinite linear; }
        
        /* Water drop */
        @keyframes drop {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }
        .water-out { animation: drop 1s infinite ease-in; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [isRunning, setIsRunning] = useState(false);
            const [voltage, setVoltage] = useState(0);

            useEffect(() => {
                let interval;
                if (isRunning) {
                    // Ramp up voltage
                    interval = setInterval(() => {
                        setVoltage(prev => Math.min(1.23, prev + 0.05));
                    }, 50);
                } else {
                    setVoltage(0);
                }
                return () => clearInterval(interval);
            }, [isRunning]);

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-green-600 flex items-center gap-2">
                                <i data-lucide="zap"></i> 燃料電池動畫師
                            </h1>
                            <p className="text-slate-400 text-sm">Hydrogen-Oxygen Fuel Cell (PEMFC)</p>
                        </div>
                        <button 
                            onClick={() => setIsRunning(!isRunning)}
                            className={`px-6 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition-colors shadow-sm
                                ${isRunning ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-green-500 text-white hover:bg-green-600'}
                            `}
                        >
                            {isRunning ? '停止運作' : '啟動電池'}
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Visualization */}
                        <div className="w-full lg:w-2/3 bg-white rounded-3xl border-2 border-slate-200 shadow-lg p-8 relative overflow-hidden min-h-[500px] flex flex-col items-center justify-center">
                            
                            {/* Circuit (Top) */}
                            <div className="absolute top-8 w-full flex justify-center items-center z-20">
                                <div className="relative w-64 h-24 border-t-4 border-x-4 border-slate-700 rounded-t-xl">
                                    {/* Load (Bulb) */}
                                    <div className="absolute top-[-20px] left-1/2 -translate-x-1/2 bg-white p-2 rounded-full border-2 border-slate-700 z-10">
                                        <i data-lucide="lightbulb" size={32} className={`transition-all duration-500 ${isRunning ? 'text-yellow-400 fill-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.8)]' : 'text-slate-300'}`} />
                                    </div>
                                    
                                    {/* Voltmeter */}
                                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-green-400 px-3 py-1 rounded font-mono font-bold border border-slate-600 text-sm">
                                        {voltage.toFixed(2)} V
                                    </div>

                                    {/* Electrons Flow */}
                                    {isRunning && (
                                        <>
                                            <div className="electron" style={{top: '-4px', left: '20%'}}></div>
                                            <div className="electron" style={{top: '-4px', left: '40%'}}></div>
                                            <div className="electron" style={{top: '-4px', left: '60%'}}></div>
                                            <div className="electron" style={{top: '-4px', left: '80%'}}></div>
                                            <div className="absolute top-[-25px] left-10 text-xs font-bold text-yellow-600 animate-pulse">e⁻ &rarr;</div>
                                        </>
                                    )}
                                </div>
                            </div>

                            {/* Cell Body */}
                            <div className="relative w-full max-w-lg h-64 flex mt-16 border-4 border-slate-300 rounded-xl bg-slate-50 overflow-hidden">
                                
                                {/* Anode Compartment (Left) */}
                                <div className="w-1/3 h-full bg-red-50/50 border-r-4 border-slate-400/50 relative flex flex-col items-center justify-center">
                                    <div className="absolute top-2 text-xs font-bold text-red-600 bg-white/80 px-2 rounded border border-red-200">陽極 (Anode -)</div>
                                    
                                    {/* H2 Inlet */}
                                    <div className="absolute left-[-20px] top-10 flex items-center">
                                        <span className="text-xs font-bold mr-1 text-slate-500">H₂ In</span>
                                        <i data-lucide="arrow-right" size={16} className="text-slate-400"/>
                                    </div>

                                    {/* Reaction H2 -> 2H+ + 2e- */}
                                    {isRunning && (
                                        <div className="absolute inset-0 pointer-events-none">
                                            <div className="absolute left-4 top-12 text-xs font-bold text-slate-600 gas-molecule">H₂</div>
                                            <div className="absolute left-4 top-20 text-xs font-bold text-slate-600 gas-molecule" style={{animationDelay: '0.5s'}}>H₂</div>
                                            
                                            {/* Oxidation text */}
                                            <div className="absolute bottom-4 w-full text-center text-[10px] text-red-500 font-mono">H₂ → 2H⁺ + 2e⁻</div>
                                        </div>
                                    )}
                                </div>

                                {/* PEM (Center) */}
                                <div className="w-1/3 h-full bg-yellow-100/30 relative flex flex-col items-center justify-center border-x-2 border-dashed border-yellow-300">
                                    <div className="absolute top-2 text-[10px] font-bold text-yellow-700 bg-white/80 px-2 rounded text-center w-full">質子交換膜 (PEM)</div>
                                    
                                    {/* H+ Flow */}
                                    {isRunning && (
                                        <div className="w-full h-full relative overflow-hidden">
                                            <div className="proton" style={{top: '30%', left: '10%'}}></div>
                                            <div className="proton" style={{top: '50%', left: '0%', animationDelay: '0.5s'}}></div>
                                            <div className="proton" style={{top: '70%', left: '20%', animationDelay: '1s'}}></div>
                                            <div className="absolute bottom-10 w-full text-center text-[10px] text-red-500 font-bold">H⁺ Flow &rarr;</div>
                                        </div>
                                    )}
                                </div>

                                {/* Cathode Compartment (Right) */}
                                <div className="w-1/3 h-full bg-blue-50/50 border-l-4 border-slate-400/50 relative flex flex-col items-center justify-center">
                                    <div className="absolute top-2 text-xs font-bold text-blue-600 bg-white/80 px-2 rounded border border-blue-200">陰極 (Cathode +)</div>
                                    
                                    {/* O2 Inlet */}
                                    <div className="absolute right-[-20px] top-10 flex items-center flex-row-reverse">
                                        <span className="text-xs font-bold ml-1 text-slate-500">O₂ In</span>
                                        <i data-lucide="arrow-left" size={16} className="text-slate-400"/>
                                    </div>

                                    {/* Reaction O2 + 4H+ + 4e- -> 2H2O */}
                                    {isRunning && (
                                        <div className="absolute inset-0 pointer-events-none">
                                            {/* O2 entering */}
                                            <div className="absolute right-4 top-12 text-xs font-bold text-blue-500 gas-molecule" style={{animationDirection: 'reverse'}}>O₂</div>
                                            
                                            {/* Water Out */}
                                            <div className="absolute bottom-4 right-[-10px] flex flex-col items-center">
                                                <span className="text-xs font-bold text-blue-600 mb-1">H₂O Out</span>
                                                <i data-lucide="droplet" size={16} className="text-blue-400 fill-blue-400 water-out"/>
                                            </div>

                                            {/* Reduction text */}
                                            <div className="absolute bottom-16 w-full text-center text-[10px] text-blue-600 font-mono px-1">O₂ + 4H⁺ + 4e⁻ → 2H₂O</div>
                                        </div>
                                    )}
                                </div>

                            </div>

                            {/* Legend */}
                            <div className="flex gap-6 mt-6 text-xs">
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-yellow-400 rounded-full shadow-[0_0_5px_yellow]"></div>
                                    <span className="text-slate-500">電子 (Electron, e⁻)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-red-500 rounded-full"></div>
                                    <span className="text-slate-500">質子 (Proton, H⁺)</span>
                                </div>
                            </div>

                        </div>

                        {/* Right: Theory Panel */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-4">
                            
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex-grow">
                                <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <i data-lucide="book-open" className="text-green-500" /> 化學原理
                                </h3>
                                
                                <div className="space-y-4">
                                    <div className="p-3 bg-red-50 rounded-lg border-l-4 border-red-500">
                                        <strong className="text-red-800 block mb-1 text-sm">陽極 (Anode -) 氧化</strong>
                                        <p className="font-mono text-xs text-slate-700">H₂(g) → 2H⁺(aq) + 2e⁻</p>
                                        <p className="text-xs text-slate-500 mt-1">氫氣失去電子，變成氫離子穿過薄膜。</p>
                                    </div>

                                    <div className="p-3 bg-blue-50 rounded-lg border-l-4 border-blue-500">
                                        <strong className="text-blue-800 block mb-1 text-sm">陰極 (Cathode +) 還原</strong>
                                        <p className="font-mono text-xs text-slate-700">O₂(g) + 4H⁺(aq) + 4e⁻ → 2H₂O(l)</p>
                                        <p className="text-xs text-slate-500 mt-1">氧氣、氫離子和電子結合成水。</p>
                                    </div>

                                    <div className="p-3 bg-green-50 rounded-lg border-l-4 border-green-500">
                                        <strong className="text-green-800 block mb-1 text-sm">總反應 (Overall)</strong>
                                        <p className="font-mono text-sm text-slate-800 font-bold">2H₂(g) + O₂(g) → 2H₂O(l)</p>
                                        <p className="text-xs text-green-600 mt-1 font-bold">⚡ 產物只有水，零碳排放！</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-800 p-4 rounded-xl text-white text-sm shadow-lg">
                                <h4 className="font-bold text-yellow-400 mb-2 flex items-center gap-2">
                                    <i data-lucide="star" size={14}/> 優點 (Pros)
                                </h4>
                                <ul className="list-disc list-inside space-y-1 text-xs opacity-90">
                                    <li>高效率 (High efficiency)</li>
                                    <li>無污染 (Pollution free)</li>
                                    <li>持續運作 (只要有燃料)</li>
                                </ul>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8 border-t border-slate-200 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic XIII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
