<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金屬反應性順序模擬器 (Reactivity Series Simulator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .metal-block {
            cursor: grab;
            transition: all 0.2s ease;
        }
        .metal-block:active { cursor: grabbing; transform: scale(1.05); }

        /* Bubble animation for reaction rate */
        @keyframes bubbles-fast {
            0% { opacity: 0; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-30px) translateX(2px); }
            100% { opacity: 0; transform: translateY(-60px); }
        }
        @keyframes bubbles-medium {
            0% { opacity: 0; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-15px); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
        .bubble-anim {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation-iteration-count: infinite;
            pointer-events: none;
        }

        /* Vibrate effect for violent reaction */
        @keyframes vibrate {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
        }
        .vibrate-fast {
            animation: vibrate 0.1s infinite;
        }

        /* Result Text Style */
        .reaction-text {
             transition: all 0.5s ease;
             text-shadow: 0 0 5px rgba(234, 88, 12, 0.5); /* Orange glow */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Metals = [
            { symbol: 'K', name: '鉀', reactivity: 6, color: 'bg-rose-500', mass: 39.1 },
            { symbol: 'Na', name: '鈉', reactivity: 5, color: 'bg-red-400', mass: 23.0 },
            { symbol: 'Ca', name: '鈣', reactivity: 4, color: 'bg-yellow-400', mass: 40.1 },
            { symbol: 'Mg', name: '鎂', reactivity: 3, color: 'bg-gray-300', mass: 24.3 },
            { symbol: 'Zn', name: '鋅', reactivity: 2, color: 'bg-slate-400', mass: 65.4 },
            { symbol: 'Fe', name: '鐵', reactivity: 1, color: 'bg-amber-700', mass: 55.8 },
            { symbol: 'Cu', name: '銅', reactivity: -1, color: 'bg-orange-500', mass: 63.5 },
            { symbol: 'Ag', name: '銀', reactivity: -2, color: 'bg-slate-300', mass: 107.9 }
        ];
        
        // Extended list for sorting challenge
        const FullSortList = ['K', 'Na', 'Ca', 'Mg', 'Zn', 'Fe', 'Cu', 'Ag'];

        const Reagents = {
            COLD_WATER: { name: '冷水 (Cold Water)', color: 'bg-blue-200', req: 5 }, // Na, K
            DILUTE_ACID: { name: '稀鹽酸 (Dilute HCl)', color: 'bg-yellow-100', req: 1 }, // Fe and above
            COPPER_SULFATE: { name: '硫酸銅 (CuSO₄ aq)', color: 'bg-sky-400', req: 1 }, // Zn and above
            SILVER_NITRATE: { name: '硝酸銀 (AgNO₃ aq)', color: 'bg-slate-100', req: -1 } // Cu and above
        };

        const InitialReactionState = {};
        Object.keys(Reagents).forEach(key => InitialReactionState[key] = null);
        
        const App = () => {
            const [reactionResults, setReactionResults] = useState(InitialReactionState);
            const [draggedElement, setDraggedElement] = useState(null);
            const [isViolent, setIsViolent] = useState(false); // For screen shake/vibrate
            const [sortOrder, setSortOrder] = useState([...FullSortList].sort(() => Math.random() - 0.5)); // Randomized initial sort
            const [sortMessage, setSortMessage] = useState({ text: '請將金屬從最高活性排到最低。', type: 'info' });

            // Logic to get the reaction result message
            const getReactionMessage = (metal, reagent) => {
                const r = metal.reactivity;
                const req = Reagents[reagent].req;
                
                if (reagent === 'COLD_WATER') {
                    if (r === 6) return { text: '劇烈反應，產生火焰 (Violent reaction, produces flame)', rate: 'Fast', isShock: true };
                    if (r === 5) return { text: '快速反應，釋放熱量 (Reacts rapidly, releases heat)', rate: 'Fast' };
                    if (r === 4) return { text: '緩慢反應，有氣泡 (Slow reaction, few bubbles)', rate: 'Medium' };
                    return { text: '無可見反應', rate: 'None' };
                }
                
                if (r >= req) {
                    if (reagent === 'DILUTE_ACID') {
                        if (r >= 4) return { text: '快速反應，大量氣泡 (Reacts rapidly, fast bubbling)', rate: 'Fast' };
                        if (r >= 2) return { text: '中等反應 (Moderate reaction)', rate: 'Medium' };
                        return { text: '緩慢反應 (Slow reaction)', rate: 'Slow' };
                    }
                    if (reagent === 'COPPER_SULFATE') {
                         if (r > 1) return { text: '發生置換，表面有銅沉積 (Displaced, Copper deposited)', rate: 'Medium', deposit: 'bg-orange-600' };
                         return { text: '無可見反應', rate: 'None' };
                    }
                    if (reagent === 'SILVER_NITRATE') {
                         if (r > -2) return { text: '發生置換，表面有銀沉積 (Displaced, Silver deposited)', rate: 'Fast', deposit: 'bg-slate-300' };
                         return { text: '無可見反應', rate: 'None' };
                    }
                }
                
                return { text: '無可見反應', rate: 'None' };
            };
            
            // Handle Dropping Metal into Reagent
            const handleDrop = (metal, reagentId) => {
                const metalData = Metals.find(m => m.symbol === metal);
                const result = getReactionMessage(metalData, reagentId);
                
                // Set shock state for Na/K in water
                if (result.isShock) {
                    setIsViolent(true);
                    setTimeout(() => setIsViolent(false), 800);
                }

                setReactionResults(prev => ({...prev, [reagentId]: { metal: metal, result }}));
            };

            // Drag Handlers for Malleability (Top bar)
            const handleDragStart = (e, metal) => {
                e.dataTransfer.setData("metalSymbol", metal.symbol);
                setDraggedElement(metal.symbol);
            };

            // Render Reagent Beaker
            const renderBeaker = (reagentId, reagentData) => {
                const currentResult = reactionResults[reagentId];
                
                let bgColor = reagentData.color;
                let reactionInfo = currentResult ? currentResult.result : { text: '拖曳金屬到此處', rate: 'None' };
                let messageStyle = reactionInfo.rate === 'None' ? 'text-slate-500' : (reactionInfo.rate === 'Fast' ? 'text-orange-600' : 'text-green-600');
                
                return (
                    <div 
                        key={reagentId}
                        className="w-1/4 h-64 bg-white rounded-xl shadow-lg border border-slate-200 p-4 flex flex-col items-center relative"
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={() => handleDrop(draggedElement, reagentId)}
                        onDragEnter={(e) => e.preventDefault()}
                    >
                        {/* Beaker Glass */}
                        <div className="w-20 h-32 border-4 border-slate-300 rounded-b-xl relative overflow-hidden flex flex-col justify-end">
                            {/* Liquid */}
                            <div className={`w-full h-full ${bgColor} opacity-60`}></div>
                            
                            {/* Deposit / Result Layer */}
                            {currentResult && reactionInfo.deposit && (
                                <div className={`absolute bottom-0 w-full h-8 ${reactionInfo.deposit} opacity-70`}></div>
                            )}

                            {/* Bubbles */}
                            {currentResult && reactionInfo.rate !== 'None' && (
                                <div className="absolute inset-0">
                                    {[...Array(10)].map((_, i) => (
                                        <div key={i} className="bubble-anim" 
                                             style={{
                                                width: Math.random() * 8 + 4, height: Math.random() * 8 + 4,
                                                left: Math.random() * 80 + 10 + '%',
                                                animation: `${reactionInfo.rate === 'Fast' ? 'bubbles-fast' : 'bubbles-medium'} ${Math.random() * 1.5 + 1}s linear infinite`,
                                                animationDelay: `${Math.random() * 1}s`
                                             }}></div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <span className="mt-2 text-xs font-bold text-slate-600">{reagentData.name}</span>
                        
                        {/* Result Message - NOW HIGHLIGHTED */}
                        <div className={`mt-3 p-2 rounded-lg text-center w-full font-black reaction-text 
                            ${reactionInfo.rate === 'Fast' ? 'text-xl text-red-600 border-2 border-red-300 bg-red-50' : 
                             (reactionInfo.rate === 'Medium' || reactionInfo.rate === 'Slow') ? 'text-lg text-green-700 border border-green-300 bg-green-50' : 'text-sm text-slate-500'}
                        `}>
                            {reactionInfo.text.split('(')[0]}
                        </div>
                    </div>
                );
            };

            // Sortable List Logic
            const handleSortEnd = () => {
                // Correct order is K, Na, Ca, Mg, Zn, Fe, Cu, Ag
                const correctOrderSymbols = FullSortList;
                const isCorrect = correctOrderSymbols.every((symbol, i) => symbol === sortOrder[i]);
                
                if (isCorrect) {
                     setSortMessage({ text: '恭喜！反應性順序完全正確！', type: 'success' });
                } else {
                     setSortMessage({ text: '排序錯誤，請再試試！提示：反應性越高，排得越靠前。', type: 'error' });
                }
            };
            
            const handleSortDragStart = (e, index) => {
                e.dataTransfer.setData("startIndex", index);
            };

            const handleSortDrop = (e, endIndex) => {
                e.preventDefault();
                const startIndex = parseInt(e.dataTransfer.getData("startIndex"));
                if (startIndex !== endIndex) {
                    const newOrder = [...sortOrder];
                    const [movedItem] = newOrder.splice(startIndex, 1);
                    newOrder.splice(endIndex, 0, movedItem);
                    setSortOrder(newOrder);
                }
            };
            
            // Generate List items for sorting
            const sortList = sortOrder.map((symbol, index) => {
                const metal = Metals.find(m => m.symbol === symbol);
                
                return (
                    <div 
                        key={symbol}
                        draggable 
                        onDragStart={(e) => handleSortDragStart(e, index)}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => handleSortDrop(e, index)}
                        className={`p-3 bg-white border border-slate-200 rounded-lg shadow-sm flex justify-between items-center text-sm font-bold metal-block ${metal.color} text-slate-900`}
                    >
                        <span className="font-mono text-xl w-8 text-center">{symbol}</span>
                        <span className="text-sm">{metal.name}</span>
                        <span className="text-xs text-slate-500">#{index + 1}</span>
                    </div>
                )
            });

            return (
                <div className={`flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl ${isViolent ? 'vibrate-fast' : ''}`}>
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-3xl font-bold text-orange-500 flex items-center gap-2">
                                <i data-lucide="zap"></i> 金屬反應性順序模擬器
                            </h1>
                            <p className="text-slate-500 text-sm">Reactivity Series Lab (Displacement & Reaction Rate)</p>
                        </div>
                        <button onClick={() => { setReactionResults(InitialReactionState); setSortMessage({ text: '請將金屬從最高活性排到最低。', type: 'info' }); setSortOrder([...FullSortList].sort(() => Math.random() - 0.5)); }} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置實驗
                        </button>
                    </div>

                    {/* Top: Metal Selection & Experiment */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 mb-8">
                        <h2 className="text-xl font-bold text-slate-700 mb-4">步驟一：金屬測試 (Metal Test)</h2>
                        
                        {/* Metal Blocks */}
                        <div className="flex justify-between gap-3 mb-6 p-3 border-b border-slate-200 overflow-x-auto">
                            {Metals.map(m => (
                                <div key={m.symbol} 
                                     draggable 
                                     onDragStart={(e) => handleDragStart(e, m)}
                                     className={`p-3 rounded-lg text-center font-bold text-slate-900 shadow-lg border-b-4 border-slate-600/30 metal-block ${m.color}`}
                                     onDragEnd={() => setDraggedElement(null)}
                                >
                                    {m.symbol}
                                    <div className="text-xs font-normal">{m.name}</div>
                                </div>
                            ))}
                        </div>

                        {/* Reagent Beakers */}
                        <div className="flex justify-between gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200 overflow-x-auto">
                            {Object.entries(Reagents).map(([id, data]) => renderBeaker(id, data))}
                        </div>
                    </div>

                    {/* Bottom: Sorting Challenge */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
                         <h2 className="text-xl font-bold text-slate-700 mb-4">步驟二：反應性排序挑戰 (Reactivity Series Challenge)</h2>
                         
                         <div className="flex flex-col md:flex-row gap-8 items-start">
                            {/* Sorting Target */}
                            <div className="w-full md:w-1/2 p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <h3 className="font-bold text-lg text-slate-700 mb-3">請拖曳並排序 (Drag & Drop to Order)</h3>
                                <div className="space-y-2">
                                     {sortList}
                                </div>
                            </div>

                            {/* Reactivity Table Hint */}
                            <div className="w-full md:w-1/2 p-4 rounded-xl border-2 
                                ${sortMessage.type === 'success' ? 'bg-green-50 border-green-400' : sortMessage.type === 'error' ? 'bg-red-50 border-red-400' : 'bg-orange-50 border-orange-200'}
                            `}>
                                <h3 className="font-bold text-lg text-slate-700 mb-2 flex items-center gap-2">
                                    <i data-lucide="lightbulb" size={20} className={sortMessage.type === 'success' ? 'text-green-600' : 'text-orange-600'} /> 排序法則 (Rule)
                                </h3>
                                <p className={`mb-3 text-sm ${sortMessage.type === 'success' ? 'text-green-700' : sortMessage.type === 'error' ? 'text-red-700' : 'text-orange-700'}`}>
                                    {sortMessage.text}
                                </p>
                                <ul className="text-sm text-orange-700 list-disc list-inside space-y-1">
                                    <li><strong>反應性最高</strong> 的金屬排在最頂部 (Top)。</li>
                                    <li>反應性越高，與水、酸反應越快。</li>
                                    <li>活性高的金屬能**置換 (Displace)** 鹽溶液中活性低的金屬。</li>
                                </ul>
                                <button onClick={handleSortEnd} className="mt-4 w-full py-2 bg-orange-600 text-white rounded-lg font-bold hover:bg-orange-500 transition-colors">
                                    確認排序 (Confirm Order)
                                </button>
                            </div>
                         </div>
                    </div>

                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic III
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
