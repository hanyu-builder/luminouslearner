<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指示劑色盤 (Indicator Color Wheel)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Solution Liquid Transition */
        .solution-color { transition: background-color 0.3s ease; }

        /* pH Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
        
        /* Bubbles */
        @keyframes bubble-rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }
        .bubble {
            position: absolute;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: bubble-rise 3s infinite ease-in;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Indicator Data
        const Indicators = [
            {
                id: 'methyl_orange',
                name: '甲基橙',
                engName: 'Methyl Orange',
                lowPH: 3.1,
                highPH: 4.4,
                lowColor: [239, 68, 68], // Red (rgb)
                highColor: [234, 179, 8], // Yellow (rgb)
                desc: '常用於強酸滴定弱鹼。在酸性中呈紅色，鹼性中呈黃色。'
            },
            {
                id: 'litmus',
                name: '石蕊溶液',
                engName: 'Litmus',
                lowPH: 5.0,
                highPH: 8.0,
                lowColor: [239, 68, 68], // Red
                highColor: [59, 130, 246], // Blue
                desc: '最常見的指示劑。在酸性中呈紅色，鹼性中呈藍色，中性時呈紫色。'
            },
            {
                id: 'phenolphthalein',
                name: '酚酞',
                engName: 'Phenolphthalein',
                lowPH: 8.3,
                highPH: 10.0,
                lowColor: [255, 255, 255], // Colorless (White for display)
                highColor: [236, 72, 153], // Pink/Magenta
                desc: '常用於弱酸滴定強鹼。在酸性/中性中無色，鹼性中呈粉紅色。'
            }
        ];

        const App = () => {
            const [ph, setPh] = useState(7.0);
            const [colors, setColors] = useState({});

            // Helper: Interpolate color based on pH
            const calculateColor = (ph, ind) => {
                if (ph <= ind.lowPH) return `rgb(${ind.lowColor.join(',')})`;
                if (ph >= ind.highPH) return `rgb(${ind.highColor.join(',')})`;
                
                // Linear Interpolation
                const ratio = (ph - ind.lowPH) / (ind.highPH - ind.lowPH);
                const r = Math.round(ind.lowColor[0] + (ind.highColor[0] - ind.lowColor[0]) * ratio);
                const g = Math.round(ind.lowColor[1] + (ind.highColor[1] - ind.lowColor[1]) * ratio);
                const b = Math.round(ind.lowColor[2] + (ind.highColor[2] - ind.lowColor[2]) * ratio);
                
                return `rgb(${r}, ${g}, ${b})`;
            };

            // Determine text description for color
            const getColorName = (ph, ind) => {
                if (ind.id === 'phenolphthalein') {
                    if (ph < 8.3) return '無色 (Colorless)';
                    if (ph > 10.0) return '粉紅色 (Pink)';
                    return '淡粉紅 (Pale Pink)';
                }
                if (ind.id === 'methyl_orange') {
                    if (ph < 3.1) return '紅色 (Red)';
                    if (ph > 4.4) return '黃色 (Yellow)';
                    return '橙色 (Orange)';
                }
                if (ind.id === 'litmus') {
                    if (ph < 5.0) return '紅色 (Red)';
                    if (ph > 8.0) return '藍色 (Blue)';
                    return '紫色 (Purple)';
                }
                return '';
            };

            // Update colors on pH change
            useEffect(() => {
                const newColors = {};
                Indicators.forEach(ind => {
                    newColors[ind.id] = calculateColor(ph, ind);
                });
                setColors(newColors);
            }, [ph]);

            // Generate Bubbles for visual effect
            const Beaker = ({ indicator }) => {
                const bgColor = colors[indicator.id] || '#fff';
                const colorName = getColorName(ph, indicator);

                return (
                    <div className="flex flex-col items-center w-full md:w-1/3">
                        <div className="w-32 h-40 border-4 border-slate-300 rounded-b-xl relative overflow-hidden bg-white shadow-lg">
                            {/* Liquid */}
                            <div 
                                className="absolute bottom-0 w-full h-3/4 solution-color opacity-80"
                                style={{ backgroundColor: bgColor }}
                            >
                                {/* Bubbles */}
                                {[...Array(6)].map((_,i) => (
                                    <div key={i} className="bubble" 
                                         style={{
                                             left: `${Math.random()*80 + 10}%`,
                                             width: `${Math.random()*10+5}px`,
                                             height: `${Math.random()*10+5}px`,
                                             animationDelay: `${Math.random()*2}s`,
                                             animationDuration: `${2+Math.random()*2}s`
                                         }}></div>
                                ))}
                            </div>
                            
                            {/* Glass Reflection */}
                            <div className="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-white/20 to-transparent pointer-events-none"></div>
                        </div>
                        
                        <div className="mt-4 text-center">
                            <h3 className="font-bold text-slate-700 text-lg">{indicator.name}</h3>
                            <div className="text-xs text-slate-500 font-mono mb-2">{indicator.engName}</div>
                            
                            <div className="bg-white border border-slate-200 rounded-lg p-2 shadow-sm">
                                <span className="block text-xs font-bold text-slate-400 uppercase">Color at pH {Number(ph).toFixed(1)}</span>
                                <span className="block font-bold text-indigo-600" style={{color: bgColor === 'rgb(255, 255, 255)' ? '#cbd5e1' : bgColor}}>
                                    {colorName}
                                </span>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-8 max-w-5xl">
                    
                    {/* Header */}
                    <div className="text-center mb-10">
                        <h1 className="text-3xl font-black text-indigo-600 flex items-center justify-center gap-3 mb-2">
                            <i data-lucide="palette" size={32}></i> 指示劑色盤
                        </h1>
                        <p className="text-slate-500">Indicator Color Wheel: pH & Color Changes</p>
                    </div>

                    {/* Control Area */}
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-indigo-100 mb-12">
                        <div className="flex justify-between items-end mb-4">
                            <label className="text-sm font-bold text-slate-500 uppercase">調整 pH 值</label>
                            <div className="text-4xl font-mono font-bold text-indigo-600">{Number(ph).toFixed(1)}</div>
                        </div>
                        
                        <div className="relative h-12 flex items-center">
                            {/* pH Scale Background */}
                            <div className="absolute w-full h-4 rounded-full overflow-hidden" 
                                 style={{background: 'linear-gradient(to right, #ef4444, #f97316, #eab308, #84cc16, #22c55e, #06b6d4, #3b82f6, #6366f1, #a855f7)'}}>
                            </div>
                            
                            <input 
                                type="range" 
                                min="0" 
                                max="14" 
                                step="0.1" 
                                value={ph} 
                                onChange={(e) => setPh(e.target.value)}
                                className="relative z-10 w-full"
                            />
                        </div>
                        
                        <div className="flex justify-between text-xs font-bold text-slate-400 mt-2">
                            <span>0 (Acidic)</span>
                            <span>7 (Neutral)</span>
                            <span>14 (Alkaline)</span>
                        </div>
                    </div>

                    {/* Experiment Area */}
                    <div className="flex flex-col md:flex-row gap-8 justify-center items-start">
                        {Indicators.map(ind => <Beaker key={ind.id} indicator={ind} />)}
                    </div>

                    {/* Info Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
                        {Indicators.map(ind => (
                            <div key={ind.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="font-bold text-slate-700 text-sm">{ind.name}</span>
                                    <span className="text-xs bg-slate-200 px-2 py-1 rounded text-slate-600">Range: {ind.lowPH} - {ind.highPH}</span>
                                </div>
                                <p className="text-xs text-slate-500 leading-relaxed">{ind.desc}</p>
                                
                                {/* Color Bar Visual */}
                                <div className="mt-3 h-2 rounded-full w-full" 
                                     style={{
                                         background: `linear-gradient(to right, rgb(${ind.lowColor.join(',')}) 0%, rgb(${ind.lowColor.join(',')}) 40%, rgb(${ind.highColor.join(',')}) 60%, rgb(${ind.highColor.join(',')}) 100%)`
                                     }}>
                                </div>
                                <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                                    <span>pH &lt; {ind.lowPH}</span>
                                    <span>pH &gt; {ind.highPH}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-12">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
