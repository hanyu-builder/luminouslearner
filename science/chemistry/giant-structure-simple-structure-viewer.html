<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巨大 vs 簡單結構檢視器 (Giant vs Simple Structure Viewer)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .structure-container {
            perspective: 800px;
            overflow: hidden;
        }
        
        .particle {
            transition: all 0.5s ease;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        
        /* Melting Animation */
        @keyframes melt {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2px, 2px) rotate(5deg); }
            50% { transform: translate(-2px, 1px) rotate(-5deg); }
            75% { transform: translate(1px, -2px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .melting .particle {
            animation: melt 0.5s infinite linear;
        }
        .melted .particle {
            transform: translate(0, 100px) !important;
            opacity: 0;
        }

        /* Electricity Flow */
        @keyframes flow {
            0% { left: -20px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }
        .electron-flow {
            position: absolute;
            top: 50%;
            width: 10px;
            height: 10px;
            background: yellow;
            border-radius: 50%;
            box-shadow: 0 0 5px yellow;
            animation: flow 2s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Structure Data
        const Structures = [
            { 
                id: 'NaCl', 
                name: '氯化鈉 (Sodium Chloride)', 
                type: 'Giant Ionic', 
                desc: '巨型離子結構：正負離子交替排列，靜電引力強。',
                mp: '801°C (High)', 
                cond: 'Solid: No / Molten: Yes',
                particles: 'Na⁺, Cl⁻' 
            },
            { 
                id: 'Diamond', 
                name: '金剛石 (Diamond)', 
                type: 'Giant Covalent', 
                desc: '巨型共價結構：每個碳原子與 4 個其他碳原子鍵合，極硬。',
                mp: '>3500°C (Very High)', 
                cond: 'No',
                particles: 'C atoms' 
            },
            { 
                id: 'Graphite', 
                name: '石墨 (Graphite)', 
                type: 'Giant Covalent', 
                desc: '層狀結構：層與層之間有微弱的范德華力，層內有離域電子。',
                mp: '>3500°C (Very High)', 
                cond: 'Yes (Delocalized e⁻)',
                particles: 'C atoms' 
            },
            { 
                id: 'I2', 
                name: '碘 (Iodine)', 
                type: 'Simple Molecular', 
                desc: '簡單分子結構：I₂ 分子之間只有微弱的范德華力。',
                mp: '114°C (Low)', 
                cond: 'No',
                particles: 'I₂ molecules' 
            },
            { 
                id: 'DryIce', 
                name: '乾冰 (Dry Ice)', 
                type: 'Simple Molecular', 
                desc: '簡單分子結構：CO₂ 分子之間只有微弱的范德華力。',
                mp: '-78°C (Sublimes)', 
                cond: 'No',
                particles: 'CO₂ molecules' 
            },
            {
                 id: 'Quartz',
                 name: '石英 (Quartz)',
                 type: 'Giant Covalent',
                 desc: '巨型共價結構：二氧化矽 (SiO₂)，每個 Si 連接 4 個 O，每個 O 連接 2 個 Si。',
                 mp: '1710°C (High)',
                 cond: 'No',
                 particles: 'Si, O atoms'
            }
        ];

        const App = () => {
            const [currentStruct, setCurrentStruct] = useState(Structures[0]);
            const [temp, setTemp] = useState(25); // Simulation temp
            const [isHeating, setIsHeating] = useState(false);
            const [isConducting, setIsConducting] = useState(false);
            const [meltState, setMeltState] = useState('solid'); // solid, melting, liquid/gas

            // Reset on structure change
            useEffect(() => {
                setTemp(25);
                setIsHeating(false);
                setIsConducting(false);
                setMeltState('solid');
            }, [currentStruct]);

            // Heating Logic
            useEffect(() => {
                let interval;
                if (isHeating) {
                    interval = setInterval(() => {
                        setTemp(prev => {
                            const next = prev + 10;
                            // Check melting points (simplified logic)
                            let threshold = 1000; 
                            if (currentStruct.type === 'Simple Molecular') threshold = 100;
                            if (currentStruct.id === 'DryIce') threshold = -70; 
                            if (currentStruct.type === 'Giant Covalent') threshold = 3000;

                            if (next > threshold && meltState !== 'liquid') {
                                setMeltState('liquid');
                            }
                            return next;
                        });
                    }, 50);
                }
                return () => clearInterval(interval);
            }, [isHeating, currentStruct, meltState]);

            // Render 3D-like grid based on type
            const renderStructure = () => {
                const items = [];
                // Simplified 3D grid simulation
                // We use CSS transforms to position 'particles'
                
                if (currentStruct.id === 'NaCl') {
                    // Cubic lattice: Na (Purple) Cl (Green)
                    for(let z=0; z<3; z++) {
                        for(let y=0; y<3; y++) {
                            for(let x=0; x<3; x++) {
                                const isNa = (x+y+z)%2 === 0;
                                const color = isNa ? 'bg-purple-500' : 'bg-green-500';
                                const size = isNa ? 'w-8 h-8' : 'w-10 h-10'; // Cl is bigger
                                items.push(
                                    <div key={`${x}-${y}-${z}`} 
                                         className={`particle absolute rounded-full ${color} ${size} flex items-center justify-center text-[8px] font-bold text-white`}
                                         style={{
                                             transform: `translate3d(${x*50}px, ${y*50}px, ${z*50}px)`,
                                             left: '100px', top: '50px', zIndex: 3-z
                                         }}>
                                        {isNa ? '+' : '-'}
                                    </div>
                                );
                            }
                        }
                    }
                } else if (currentStruct.id === 'Diamond') {
                    // Tetrahedral network (simplified)
                     const carbonPos = [
                        [0,0,0], [50,50,0], [100,0,0], [150,50,0],
                        [25,25,40], [75,75,40], [125,25,40],
                        [0,100,0], [50,150,0], [100,100,0]
                     ];
                     items.push(...carbonPos.map((p, i) => (
                         <div key={i} className="particle absolute w-6 h-6 bg-gray-200 rounded-full border border-gray-400 shadow-sm"
                              style={{ transform: `translate3d(${p[0]}px, ${p[1]}px, ${p[2]}px)`, left: '120px', top: '50px' }}>
                         </div>
                     )));
                     // Add bonds (lines) - simplified for demo using CSS borders or just proximity
                } else if (currentStruct.id === 'Graphite') {
                    // Layered structure
                    for(let layer=0; layer<3; layer++) {
                        for(let i=0; i<6; i++) {
                            items.push(
                                <div key={`L${layer}-${i}`} className="particle absolute w-6 h-6 bg-gray-600 rounded-full border border-gray-500"
                                     style={{ 
                                         transform: `translate3d(${i*40}px, ${layer*80}px, 0px)`, 
                                         left: '80px', top: '40px' 
                                     }}>
                                </div>
                            );
                        }
                        // Delocalized electrons hint
                        if (isConducting) {
                            items.push(
                                <div key={`e-${layer}`} className="electron-flow" style={{ top: 45 + layer*80 + 'px' }}></div>
                            );
                        }
                    }
                } else if (currentStruct.type === 'Simple Molecular') {
                    // Discrete molecules (I2 pairs)
                    for(let i=0; i<8; i++) {
                         const x = (i % 3) * 80;
                         const y = Math.floor(i / 3) * 80;
                         const color = currentStruct.id === 'I2' ? 'bg-purple-800' : 'bg-white border-2 border-slate-300';
                         items.push(
                             <div key={i} className={`particle absolute w-16 h-8 rounded-full flex items-center justify-center gap-1 ${meltState === 'liquid' ? 'animate-bounce' : ''}`}
                                  style={{ transform: `translate3d(${x}px, ${y}px, 0px)`, left: '80px', top: '80px' }}>
                                 <div className={`w-6 h-6 rounded-full ${color}`}></div>
                                 <div className={`w-6 h-6 rounded-full ${color}`}></div>
                             </div>
                         );
                    }
                } else if (currentStruct.id === 'Quartz') {
                    // SiO2 network (simplified) - Si (Grey), O (Red)
                    for(let i=0; i<5; i++) {
                         const x = i * 50;
                         const y = (i % 2) * 40;
                         items.push(
                             <div key={`si-${i}`} className="particle absolute w-8 h-8 bg-slate-400 rounded-full flex items-center justify-center text-[10px] text-white font-bold"
                                  style={{ transform: `translate3d(${x}px, ${y}px, 0px)`, left: '80px', top: '80px' }}>Si</div>
                         );
                         items.push(
                             <div key={`o-${i}`} className="particle absolute w-6 h-6 bg-red-500 rounded-full flex items-center justify-center text-[10px] text-white font-bold"
                                  style={{ transform: `translate3d(${x+25}px, ${y+25}px, 20px)`, left: '80px', top: '80px' }}>O</div>
                         );
                    }
                }

                return items;
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-blue-400 flex items-center gap-2">
                                <i data-lucide="box"></i> 結構檢視器
                            </h1>
                            <p className="text-slate-400 text-sm">Giant vs Simple Structure Viewer</p>
                        </div>
                        <div className="flex gap-2 overflow-x-auto pb-2 max-w-xl">
                            {Structures.map(s => (
                                <button
                                    key={s.id}
                                    onClick={() => setCurrentStruct(s)}
                                    className={`px-3 py-1 rounded border text-sm font-bold transition-colors whitespace-nowrap
                                        ${currentStruct.id === s.id 
                                            ? 'bg-blue-600 text-white border-blue-500' 
                                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    {s.id}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-grow flex flex-col lg:flex-row gap-8">
                        
                        {/* Visualization Area */}
                        <div className={`w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative flex flex-col items-center justify-center min-h-[500px] shadow-2xl overflow-hidden p-8 structure-container
                             ${meltState === 'liquid' ? 'melted' : isHeating ? 'melting' : ''}
                        `}>
                            
                            {/* Background Grid */}
                            <div className="absolute inset-0 opacity-10" 
                                 style={{backgroundImage: 'radial-gradient(#60a5fa 1px, transparent 1px)', backgroundSize: '30px 30px'}}></div>

                            {/* 3D Structure Placeholder */}
                            <div className="relative w-full h-full" style={{transformStyle: 'preserve-3d'}}>
                                {renderStructure()}
                            </div>

                            {/* Status Indicators */}
                            <div className="absolute top-4 left-4 flex flex-col gap-2 z-20">
                                <div className="bg-slate-900/80 px-3 py-1 rounded text-xs text-blue-300 border border-slate-600 flex items-center gap-2">
                                    <i data-lucide="thermometer" size={14} /> {temp}°C
                                </div>
                                {meltState === 'liquid' && (
                                    <div className="bg-red-900/80 px-3 py-1 rounded text-xs text-red-300 border border-red-600 font-bold animate-pulse">
                                        MELTED / BROKEN
                                    </div>
                                )}
                                {isConducting && (
                                    <div className={`px-3 py-1 rounded text-xs border font-bold flex items-center gap-2
                                        ${(currentStruct.id === 'Graphite' || (currentStruct.id === 'NaCl' && meltState === 'liquid')) 
                                            ? 'bg-green-900/80 text-green-300 border-green-600' 
                                            : 'bg-slate-900/80 text-slate-500 border-slate-600'}
                                    `}>
                                        <i data-lucide="zap" size={14} /> 
                                        {(currentStruct.id === 'Graphite' || (currentStruct.id === 'NaCl' && meltState === 'liquid')) ? 'Conducting' : 'Insulator'}
                                    </div>
                                )}
                            </div>

                            {/* Controls Overlay */}
                            <div className="absolute bottom-8 flex gap-4 z-20">
                                <button 
                                    onMouseDown={() => setIsHeating(true)}
                                    onMouseUp={() => setIsHeating(false)}
                                    onMouseLeave={() => setIsHeating(false)}
                                    className={`px-6 py-3 rounded-xl font-bold text-white transition-all flex items-center gap-2 shadow-lg
                                        ${isHeating ? 'bg-red-600 scale-95' : 'bg-red-500 hover:bg-red-400'}
                                    `}
                                >
                                    <i data-lucide="flame" /> 加熱 (Heat)
                                </button>

                                <button 
                                    onClick={() => setIsConducting(!isConducting)}
                                    className={`px-6 py-3 rounded-xl font-bold text-white transition-all flex items-center gap-2 shadow-lg
                                        ${isConducting ? 'bg-yellow-600 ring-2 ring-yellow-400' : 'bg-yellow-500 hover:bg-yellow-400'}
                                    `}
                                >
                                    <i data-lucide="zap" /> 通電 (Test Elec.)
                                </button>
                            </div>

                        </div>

                        {/* Right: Info Panel */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                                <div className="mb-4">
                                    <div className="text-xs text-slate-400 uppercase font-bold mb-1">Selected Structure</div>
                                    <div className="text-2xl font-bold text-white mb-1">{currentStruct.name}</div>
                                    <div className="inline-block bg-blue-900/50 text-blue-300 px-2 py-1 rounded text-xs border border-blue-800">
                                        {currentStruct.type}
                                    </div>
                                </div>
                                
                                <div className="space-y-4 text-sm text-slate-300 leading-relaxed">
                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-blue-500">
                                        <strong className="text-white block mb-1">結構特點 (Structure)</strong>
                                        {currentStruct.desc}
                                    </div>
                                    
                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-red-500">
                                        <strong className="text-white block mb-1">熔點 (Melting Point)</strong>
                                        <span className="font-mono text-red-300 font-bold">{currentStruct.mp}</span>
                                        <p className="mt-1 text-xs opacity-70">
                                            {currentStruct.type === 'Simple Molecular' 
                                                ? '只需很少能量克服微弱的范德華力 (van der Waals\' forces)。'
                                                : '需要極大能量打破強大的化學鍵 (Ionic/Covalent bonds)。'}
                                        </p>
                                    </div>

                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-yellow-500">
                                        <strong className="text-white block mb-1">導電性 (Conductivity)</strong>
                                        <span className="font-mono text-yellow-300 font-bold">{currentStruct.cond}</span>
                                        <p className="mt-1 text-xs opacity-70">
                                            {currentStruct.id === 'NaCl' && '固體時離子不能移動；熔融或溶於水後離子可自由流動 (Mobile Ions)。'}
                                            {currentStruct.id === 'Graphite' && '含有離域電子 (Delocalized electrons)，可沿層流動。'}
                                            {currentStruct.id === 'Diamond' && '所有電子都被鎖定在共價鍵中，無自由電子。'}
                                            {currentStruct.type === 'Simple Molecular' && '沒有自由離子或電子。'}
                                        </p>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic II & IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
