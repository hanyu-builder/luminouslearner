<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分子間引力視圖 (Intermolecular Forces Visualizer)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Molecule Types
        const Molecules = {
            'He': { 
                id: 'He', name: '氦 (Helium)', type: 'vdW', 
                color: '#a855f7', radius: 15, mass: 4, 
                forceStrength: 1, bp: -269,
                desc: '非極性單原子。僅有極微弱的范德華力 (Dispersion forces)。' 
            },
            'N2': { 
                id: 'N2', name: '氮氣 (Nitrogen)', type: 'vdW', 
                color: '#3b82f6', radius: 20, mass: 28, 
                forceStrength: 2, bp: -196,
                desc: '非極性分子。電子數較多，范德華力比 He 強。' 
            },
            'HCl': { 
                id: 'HCl', name: '氯化氫 (HCl)', type: 'Dipole', 
                color: '#22c55e', radius: 22, mass: 36.5, 
                forceStrength: 4, bp: -85,
                desc: '極性分子。具有永久偶極-永久偶極引力 (Permanent Dipole)。' 
            },
            'H2O': { 
                id: 'H2O', name: '水 (Water)', type: 'H-Bond', 
                color: '#ef4444', radius: 18, mass: 18, 
                forceStrength: 8, bp: 100,
                desc: '能夠形成氫鍵 (Hydrogen Bond)。引力極強，沸點異常高。' 
            }
        };

        const App = () => {
            const [selectedMol, setSelectedMol] = useState(Molecules['He']);
            const [temperature, setTemperature] = useState(50); // 0-100 (Simulation scale)
            const [isRunning, setIsRunning] = useState(true);
            
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);
            const requestRef = useRef();

            // Initialize Particles
            useEffect(() => {
                const numParticles = 20;
                const newParticles = [];
                const canvas = canvasRef.current;
                if (!canvas) return;

                const w = canvas.width;
                const h = canvas.height;

                for (let i = 0; i < numParticles; i++) {
                    newParticles.push({
                        id: i,
                        x: Math.random() * (w - 40) + 20,
                        y: Math.random() * (h - 40) + 20,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        type: selectedMol.id
                    });
                }
                particlesRef.current = newParticles;
            }, [selectedMol]);

            // Animation Loop
            const animate = () => {
                if (!isRunning) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                
                // Physics Parameters
                const speedFactor = (temperature / 50) * 2; // Temp controls speed
                const interactionDist = 100; // Distance to form bond
                
                ctx.clearRect(0, 0, w, h);

                // Update & Draw Particles
                particlesRef.current.forEach(p => {
                    // Move
                    p.x += p.vx * speedFactor;
                    p.y += p.vy * speedFactor;

                    // Bounce walls
                    if (p.x < 15 || p.x > w - 15) p.vx *= -1;
                    if (p.y < 15 || p.y > h - 15) p.vy *= -1;
                    
                    // Keep in bounds
                    p.x = Math.max(15, Math.min(w-15, p.x));
                    p.y = Math.max(15, Math.min(h-15, p.y));
                });

                // Draw Connections (Forces)
                // O(N^2) but N is small (20)
                ctx.lineWidth = selectedMol.forceStrength; 
                
                for (let i = 0; i < particlesRef.current.length; i++) {
                    for (let j = i + 1; j < particlesRef.current.length; j++) {
                        const p1 = particlesRef.current[i];
                        const p2 = particlesRef.current[j];
                        
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if (dist < interactionDist) {
                            // Probability of bonding decreases with Temperature
                            // Probability increases with Force Strength
                            const bondStability = (selectedMol.forceStrength * 20) / (temperature + 1);
                            
                            // Visual: Opacity based on distance and stability
                            const opacity = Math.max(0, (1 - dist/interactionDist) * Math.min(1, bondStability));
                            
                            if (opacity > 0.1) {
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                
                                // Style based on type
                                if (selectedMol.type === 'H-Bond') {
                                    ctx.strokeStyle = `rgba(255, 255, 0, ${opacity})`; // Yellow solid for H-bond
                                    ctx.setLineDash([]);
                                } else if (selectedMol.type === 'Dipole') {
                                    ctx.strokeStyle = `rgba(56, 189, 248, ${opacity})`; // Blue dashed
                                    ctx.setLineDash([5, 5]);
                                } else {
                                    ctx.strokeStyle = `rgba(148, 163, 184, ${opacity})`; // Grey dotted
                                    ctx.setLineDash([2, 4]);
                                }
                                
                                ctx.stroke();
                                
                                // "Attraction" effect: pull them together slightly if low temp
                                if (temperature < 30) {
                                    const pull = 0.02 * selectedMol.forceStrength;
                                    const angle = Math.atan2(dy, dx);
                                    p1.vx -= Math.cos(angle) * pull;
                                    p1.vy -= Math.sin(angle) * pull;
                                    p2.vx += Math.cos(angle) * pull;
                                    p2.vy += Math.sin(angle) * pull;
                                }
                            }
                        }
                    }
                }

                // Draw Particles on top
                particlesRef.current.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, selectedMol.radius, 0, Math.PI * 2);
                    ctx.fillStyle = selectedMol.color;
                    ctx.fill();
                    
                    // Visual Detail (Dipole or H-bond hint)
                    if (selectedMol.type === 'H-Bond') {
                        ctx.fillStyle = 'white';
                        ctx.font = '10px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('H', p.x-4, p.y+3);
                        ctx.fillText('O', p.x+4, p.y+3);
                    } else if (selectedMol.type === 'Dipole') {
                        ctx.fillStyle = 'white';
                        ctx.font = '8px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('δ+', p.x-6, p.y+3);
                        ctx.fillText('δ-', p.x+6, p.y+3);
                    }
                    
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([]);
                    ctx.stroke();
                });

                requestRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                // Initial Resize
                if (canvasRef.current) {
                    const parent = canvasRef.current.parentElement;
                    canvasRef.current.width = parent.clientWidth;
                    canvasRef.current.height = parent.clientHeight;
                }
                
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            });

            // Derived Status
            const getState = () => {
                // Simple thresholds for visual feedback
                const threshold = selectedMol.forceStrength * 15;
                if (temperature > threshold) return 'Gas (氣態) - 引力已斷裂';
                if (temperature > threshold / 2) return 'Liquid (液態) - 分子滑動';
                return 'Solid (固態) - 分子振動';
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-blue-400 flex items-center gap-2">
                                <i data-lucide="network"></i> 分子間引力視圖
                            </h1>
                            <p className="text-slate-400 text-sm">Intermolecular Forces Visualizer</p>
                        </div>
                        
                        <div className="flex gap-2">
                            {Object.values(Molecules).map(m => (
                                <button 
                                    key={m.id}
                                    onClick={() => setSelectedMol(m)}
                                    className={`px-3 py-1 rounded border text-sm font-bold transition-all
                                        ${selectedMol.id === m.id 
                                            ? `bg-slate-700 text-white border-white` 
                                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}
                                    `}
                                    style={{ borderColor: selectedMol.id === m.id ? m.color : '' }}
                                >
                                    {m.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Canvas Area */}
                        <div className="w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative h-[500px] shadow-2xl overflow-hidden">
                            
                            <canvas ref={canvasRef} className="block w-full h-full" />
                            
                            {/* Overlay Info */}
                            <div className="absolute top-4 left-4 bg-black/60 backdrop-blur px-4 py-2 rounded-xl border border-slate-600">
                                <div className="text-xs text-slate-400 font-bold uppercase">Current State</div>
                                <div className={`text-lg font-bold ${temperature > 80 ? 'text-red-400' : 'text-blue-300'}`}>
                                    {getState()}
                                </div>
                            </div>

                        </div>

                        {/* Right: Controls & Theory */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Controls */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="thermometer" className="text-red-500" /> 溫度控制
                                </h3>
                                
                                <div className="flex items-center gap-4 mb-2">
                                    <span className="text-blue-300 font-bold text-xs">Cold</span>
                                    <input 
                                        type="range" min="1" max="100" value={temperature} 
                                        onChange={(e) => setTemperature(Number(e.target.value))}
                                        className="flex-grow h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-red-500"
                                    />
                                    <span className="text-red-400 font-bold text-xs">Hot</span>
                                </div>
                                <div className="text-center font-mono text-xl text-white font-bold">
                                    {temperature}°C (Simulation)
                                </div>
                                <p className="text-xs text-slate-400 text-center mt-2">
                                    溫度越高，動能越大，越容易打破分子間引力。
                                </p>
                            </div>

                            {/* Theory Card */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow animate-in fade-in slide-in-from-right">
                                <div className="mb-4 border-b border-slate-600 pb-4">
                                    <div className="text-xs text-slate-400 uppercase font-bold mb-1">Force Type</div>
                                    <div className="text-2xl font-bold text-white" style={{ color: selectedMol.color }}>
                                        {selectedMol.type === 'vdW' ? '范德華力 (van der Waals)' :
                                         selectedMol.type === 'Dipole' ? '永久偶極引力 (Permanent Dipole)' :
                                         '氫鍵 (Hydrogen Bond)'}
                                    </div>
                                </div>

                                <div className="space-y-4 text-sm text-slate-300 leading-relaxed">
                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4" style={{ borderColor: selectedMol.color }}>
                                        <strong className="text-white block mb-1">原理說明</strong>
                                        {selectedMol.desc}
                                    </div>
                                    
                                    <div className="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg">
                                        <span>相對強度</span>
                                        <div className="flex gap-1">
                                            {Array.from({length: 5}).map((_, i) => (
                                                <div key={i} className={`w-4 h-2 rounded-sm ${i < selectedMol.forceStrength/2 ? 'bg-yellow-400' : 'bg-slate-600'}`}></div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg">
                                        <span>沸點 (Boiling Point)</span>
                                        <span className="font-mono font-bold text-white">{selectedMol.bp}°C</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic VI
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
