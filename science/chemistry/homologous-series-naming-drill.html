<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有機化學命名特訓 (IUPAC Naming Drill)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Card Animation */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .atom-shadow { box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Molecule Data Structure ---
        // Nodes: { x, y (relative), el (symbol), color (optional class) }
        // Links: { source, target (indices), type: 'single' | 'double' }
        
        const Database = [
            // 1. Alkanes
            {
                id: 'alkane-3',
                type: 'Alkane (烷烴)',
                correct: 'Propane',
                formula: 'CH₃CH₂CH₃',
                options: ['Ethane', 'Propane', 'Butane', 'Pentane'],
                nodes: [
                    { x: -60, y: 0, el: 'C' },
                    { x: 0, y: 0, el: 'C' },
                    { x: 60, y: 0, el: 'C' }
                ],
                links: [{ s: 0, t: 1 }, { s: 1, t: 2 }]
            },
            {
                id: 'alkane-branch',
                type: 'Alkane (支鏈)',
                correct: '2-methylpropane',
                formula: 'CH₃CH(CH₃)CH₃',
                options: ['Butane', '2-methylpropane', 'Pentane', 'Propane'],
                nodes: [
                    { x: -60, y: 0, el: 'C' },
                    { x: 0, y: 0, el: 'C' },
                    { x: 60, y: 0, el: 'C' },
                    { x: 0, y: 60, el: 'CH₃' }
                ],
                links: [{ s: 0, t: 1 }, { s: 1, t: 2 }, { s: 1, t: 3 }]
            },
            
            // 2. Alkenes
            {
                id: 'alkene-2',
                type: 'Alkene (烯烴)',
                correct: 'Ethene',
                formula: 'CH₂=CH₂',
                options: ['Ethane', 'Ethene', 'Ethyne', 'Propene'],
                nodes: [
                    { x: -40, y: 0, el: 'C' },
                    { x: 40, y: 0, el: 'C' }
                ],
                links: [{ s: 0, t: 1, type: 'double' }]
            },
            {
                id: 'alkene-3',
                type: 'Alkene (烯烴)',
                correct: 'Propene',
                formula: 'CH₃CH=CH₂',
                options: ['Ethene', 'Propene', 'But-1-ene', 'Propane'],
                nodes: [
                    { x: -50, y: 0, el: 'C' },
                    { x: 10, y: 0, el: 'C' },
                    { x: 70, y: 0, el: 'C' }
                ],
                links: [
                    { s: 0, t: 1 }, 
                    { s: 1, t: 2, type: 'double' }
                ]
            },

            // 3. Haloalkanes
            {
                id: 'halo-cl-2',
                type: 'Haloalkane (鹵代烴)',
                correct: 'Chloroethane',
                formula: 'CH₃CH₂Cl',
                options: ['Chloromethane', 'Chloroethane', '1-chloropropane', 'Dichloroethane'],
                nodes: [
                    { x: -50, y: 0, el: 'C' },
                    { x: 10, y: 0, el: 'C' },
                    { x: 70, y: 0, el: 'Cl', color: 'bg-green-500 border-green-600' }
                ],
                links: [{ s: 0, t: 1 }, { s: 1, t: 2 }]
            },
            {
                id: 'halo-br-3',
                type: 'Haloalkane (鹵代烴)',
                correct: '2-bromopropane',
                formula: 'CH₃CH(Br)CH₃',
                options: ['1-bromopropane', '2-bromopropane', 'Bromobutane', '2,2-dibromopropane'],
                nodes: [
                    { x: -60, y: 0, el: 'C' },
                    { x: 0, y: 0, el: 'C' },
                    { x: 60, y: 0, el: 'C' },
                    { x: 0, y: 60, el: 'Br', color: 'bg-orange-500 border-orange-600' } // Branch down
                ],
                links: [{ s: 0, t: 1 }, { s: 1, t: 2 }, { s: 1, t: 3 }]
            },

            // 4. Alcohols
            {
                id: 'alcohol-2',
                type: 'Alcohol (醇)',
                correct: 'Ethanol',
                formula: 'CH₃CH₂OH',
                options: ['Methanol', 'Ethanol', 'Propanol', 'Ethanoic Acid'],
                nodes: [
                    { x: -50, y: 0, el: 'C' },
                    { x: 10, y: 0, el: 'C' },
                    { x: 70, y: 0, el: 'OH', color: 'bg-red-500 border-red-600' }
                ],
                links: [{ s: 0, t: 1 }, { s: 1, t: 2 }]
            },

            // 5. Aldehydes & Ketones
            {
                id: 'aldehyde-2',
                type: 'Aldehyde (醛)',
                correct: 'Ethanal',
                formula: 'CH₃CHO',
                options: ['Methanal', 'Ethanal', 'Ethanol', 'Ethanoic Acid'],
                nodes: [
                    { x: -40, y: 0, el: 'C' },
                    { x: 20, y: 0, el: 'C' },
                    { x: 20, y: -60, el: 'O', color: 'bg-red-500 border-red-600' }, // Double O up
                    { x: 70, y: 30, el: 'H', color: 'bg-slate-400 border-slate-500' } // H down-right
                ],
                links: [
                    { s: 0, t: 1 }, 
                    { s: 1, t: 2, type: 'double' }, 
                    { s: 1, t: 3 }
                ]
            },
            {
                id: 'ketone-3',
                type: 'Ketone (酮)',
                correct: 'Propanone',
                formula: 'CH₃COCH₃',
                options: ['Propanal', 'Propanone', 'Butanone', 'Propanoic Acid'],
                nodes: [
                    { x: -60, y: 0, el: 'C' },
                    { x: 0, y: 0, el: 'C' },
                    { x: 60, y: 0, el: 'C' },
                    { x: 0, y: -60, el: 'O', color: 'bg-red-500 border-red-600' } // Double O up on middle C
                ],
                links: [
                    { s: 0, t: 1 }, 
                    { s: 1, t: 2 },
                    { s: 1, t: 3, type: 'double' }
                ]
            },

            // 6. Carboxylic Acids
            {
                id: 'acid-2',
                type: 'Carboxylic Acid (羧酸)',
                correct: 'Ethanoic Acid',
                formula: 'CH₃COOH',
                options: ['Methanoic Acid', 'Ethanoic Acid', 'Propanoic Acid', 'Ethanol'],
                nodes: [
                    { x: -40, y: 0, el: 'C' },
                    { x: 20, y: 0, el: 'C' },
                    { x: 20, y: -60, el: 'O', color: 'bg-red-500 border-red-600' }, // Double O up
                    { x: 70, y: 30, el: 'OH', color: 'bg-red-500 border-red-600' }  // OH down-right
                ],
                links: [
                    { s: 0, t: 1 }, 
                    { s: 1, t: 2, type: 'double' }, 
                    { s: 1, t: 3 }
                ]
            },

            // 7. Esters
            {
                id: 'ester-methyl-ethanoate',
                type: 'Ester (酯)',
                correct: 'Methyl ethanoate',
                formula: 'CH₃COOCH₃',
                options: ['Ethyl methanoate', 'Methyl ethanoate', 'Ethyl ethanoate', 'Propanoic Acid'],
                nodes: [
                    { x: -60, y: 0, el: 'C' },
                    { x: 0, y: 0, el: 'C' },
                    { x: 0, y: -60, el: 'O', color: 'bg-red-500 border-red-600' }, // Double O up
                    { x: 50, y: 0, el: 'O', color: 'bg-red-500 border-red-600' },  // Single O right
                    { x: 100, y: 0, el: 'C' }   // Methyl group
                ],
                links: [
                    { s: 0, t: 1 }, 
                    { s: 1, t: 2, type: 'double' }, 
                    { s: 1, t: 3 },
                    { s: 3, t: 4 }
                ]
            },

            // 8. Amides
            {
                id: 'amide-2',
                type: 'Unsubstituted Amide (酰胺)',
                correct: 'Ethanamide',
                formula: 'CH₃CONH₂',
                options: ['Methanamide', 'Ethanamide', 'Ethanoic Acid', 'Ethylamine'],
                nodes: [
                    { x: -40, y: 0, el: 'C' },
                    { x: 20, y: 0, el: 'C' },
                    { x: 20, y: -60, el: 'O', color: 'bg-red-500 border-red-600' }, // Double O up
                    { x: 70, y: 0, el: 'NH₂', color: 'bg-blue-500 border-blue-600' }  // NH2 right
                ],
                links: [
                    { s: 0, t: 1 }, 
                    { s: 1, t: 2, type: 'double' }, 
                    { s: 1, t: 3 }
                ]
            },

            // 9. Amines
            {
                id: 'amine-2',
                type: 'Primary Amine (胺)',
                correct: 'Ethylamine',
                formula: 'CH₃CH₂NH₂',
                options: ['Methylamine', 'Ethylamine', 'Propylamine', 'Ethanamide'],
                nodes: [
                    { x: -50, y: 0, el: 'C' },
                    { x: 10, y: 0, el: 'C' },
                    { x: 70, y: 0, el: 'NH₂', color: 'bg-blue-500 border-blue-600' }
                ],
                links: [{ s: 0, t: 1 }, { s: 1, t: 2 }]
            }
        ];

        const App = () => {
            const [currentQ, setCurrentQ] = useState(null);
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [feedback, setFeedback] = useState(null);

            useEffect(() => {
                loadNextQuestion();
            }, []);

            const loadNextQuestion = () => {
                setFeedback(null);
                const randomIdx = Math.floor(Math.random() * Database.length);
                setCurrentQ(Database[randomIdx]);
            };

            const handleAnswer = (answer) => {
                if (feedback) return;

                if (answer === currentQ.correct) {
                    setScore(s => s + 10);
                    setStreak(s => s + 1);
                    setFeedback({ correct: true, msg: '正確！ (Correct!)', selected: answer });
                } else {
                    setStreak(0);
                    setFeedback({ correct: false, msg: `錯誤。正確答案是 ${currentQ.correct}`, selected: answer });
                }
            };

            // --- Visualization Component (SVG + HTML Overlay) ---
            const StructureVisual = ({ data }) => {
                // Center calculation
                const centerX = 300; // Half of width
                const centerY = 120; // Half of height
                
                return (
                    <div className="relative w-full h-60 bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-inner group">
                        {/* Grid Background */}
                        <div className="absolute inset-0 opacity-10" 
                             style={{backgroundImage: 'radial-gradient(#94a3b8 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
                        
                        {/* SVG Layer for Bonds */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none">
                            {data.links.map((link, i) => {
                                const start = data.nodes[link.s];
                                const end = data.nodes[link.t];
                                
                                // Draw Double Bond
                                if (link.type === 'double') {
                                    return (
                                        <g key={i}>
                                            <line x1={centerX + start.x} y1={centerY + start.y - 3} x2={centerX + end.x} y2={centerY + end.y - 3} stroke="#94a3b8" strokeWidth="3" />
                                            <line x1={centerX + start.x} y1={centerY + start.y + 3} x2={centerX + end.x} y2={centerY + end.y + 3} stroke="#94a3b8" strokeWidth="3" />
                                        </g>
                                    );
                                }
                                // Draw Single Bond
                                return (
                                    <line key={i} x1={centerX + start.x} y1={centerY + start.y} x2={centerX + end.x} y2={centerY + end.y} stroke="#94a3b8" strokeWidth="3" />
                                );
                            })}
                        </svg>

                        {/* Atom Nodes */}
                        {data.nodes.map((node, i) => (
                            <div 
                                key={i}
                                className={`absolute flex items-center justify-center font-bold text-sm rounded-full border-2 atom-shadow transform -translate-x-1/2 -translate-y-1/2 transition-transform group-hover:scale-110
                                    ${node.color || (node.el === 'C' ? 'bg-slate-600 border-slate-400 text-white' : 'bg-slate-200 border-slate-400 text-slate-800')}
                                    ${node.el.length > 1 ? 'w-10 h-10 text-xs' : 'w-9 h-9'}
                                `}
                                style={{ left: centerX + node.x, top: centerY + node.y }}
                            >
                                {node.el}
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-2xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-teal-400 flex items-center gap-2">
                                <i data-lucide="pencil-ruler"></i> 命名特訓
                            </h1>
                            <p className="text-slate-400 text-sm">IUPAC Naming Drill</p>
                        </div>
                        <div className="flex gap-4 font-mono font-bold text-xl">
                            <div className="text-teal-400">Score: {score}</div>
                            <div className="text-orange-400">Streak: {streak} 🔥</div>
                        </div>
                    </div>

                    {currentQ && (
                        <div className="flex flex-col gap-6 animate-in fade-in">
                            
                            {/* Question Card */}
                            <div className="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                                <div className="flex justify-between items-center mb-4">
                                    <span className="text-xs font-bold text-slate-800 bg-slate-300 px-2 py-1 rounded uppercase tracking-wider">
                                        Identify the Structure
                                    </span>
                                    <span className="text-xs text-teal-400 font-bold">
                                        {currentQ.type}
                                    </span>
                                </div>
                                
                                <StructureVisual data={currentQ} />
                                
                                <div className="mt-4 text-center font-mono text-lg text-slate-300 bg-slate-900/50 p-2 rounded-lg border border-slate-600">
                                    Formula Hint: <span className="text-white font-bold">{currentQ.formula}</span>
                                </div>
                            </div>

                            {/* Options */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {currentQ.options.map((opt, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(opt)}
                                        disabled={feedback}
                                        className={`p-4 rounded-xl border-2 font-bold text-lg transition-all
                                            ${feedback 
                                                ? (opt === currentQ.correct ? 'bg-green-600 border-green-500 text-white shadow-[0_0_15px_rgba(34,197,94,0.5)]' : opt === feedback.selected ? 'bg-red-600 border-red-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-500 opacity-50')
                                                : 'bg-slate-800 border-slate-600 text-slate-200 hover:bg-slate-700 hover:border-teal-400 hover:shadow-md'}
                                        `}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>

                            {/* Feedback & Next */}
                            {feedback && (
                                <div className={`p-4 rounded-xl border-l-4 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4 animate-in slide-in-from-bottom-2
                                    ${feedback.correct ? 'bg-green-900/30 border-green-500 text-green-300' : 'bg-red-900/30 border-red-500 text-red-300'}
                                `}>
                                    <div className="font-bold text-lg flex items-center gap-2">
                                        {feedback.correct ? <i data-lucide="check-circle"/> : <i data-lucide="x-circle"/>}
                                        {feedback.msg}
                                    </div>
                                    <button 
                                        onClick={loadNextQuestion}
                                        className="px-8 py-3 bg-white text-slate-900 font-bold rounded-lg hover:bg-slate-200 transition-colors w-full md:w-auto"
                                    >
                                        下一題 (Next) &rarr;
                                    </button>
                                </div>
                            )}

                        </div>
                    )}
                    
                    <div className="text-center text-slate-500 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic V & XI
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
