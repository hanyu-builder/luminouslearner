<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同位素視圖 (Isotope Visualizer)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        /* Nucleon (Proton/Neutron) Animation */
        @keyframes jiggle {
            0% { transform: translate(0, 0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, 0); }
            75% { transform: translate(0, -1px); }
            100% { transform: translate(0, 0); }
        }
        .nucleon {
            animation: jiggle 2s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        /* Radiation Effect */
        @keyframes radiate {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .radioactive {
            animation: radiate 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Isotope Data (Simplified for Demo)
        const IsotopeData = {
            H: {
                name: '氫 (Hydrogen)',
                symbol: 'H',
                z: 1,
                isotopes: [
                    { a: 1, neutrons: 0, name: 'Protium', abundance: 99.98, stable: true },
                    { a: 2, neutrons: 1, name: 'Deuterium (D)', abundance: 0.015, stable: true },
                    { a: 3, neutrons: 2, name: 'Tritium (T)', abundance: 0, stable: false, halfLife: '12.3 years' }
                ]
            },
            C: {
                name: '碳 (Carbon)',
                symbol: 'C',
                z: 6,
                isotopes: [
                    { a: 12, neutrons: 6, name: 'Carbon-12', abundance: 98.93, stable: true },
                    { a: 13, neutrons: 7, name: 'Carbon-13', abundance: 1.07, stable: true },
                    { a: 14, neutrons: 8, name: 'Carbon-14', abundance: 0, stable: false, halfLife: '5730 years' }
                ]
            },
            Cl: {
                name: '氯 (Chlorine)',
                symbol: 'Cl',
                z: 17,
                isotopes: [
                    { a: 35, neutrons: 18, name: 'Chlorine-35', abundance: 75.76, stable: true },
                    { a: 36, neutrons: 19, name: 'Chlorine-36', abundance: 0, stable: false, halfLife: '301,000 years' },
                    { a: 37, neutrons: 20, name: 'Chlorine-37', abundance: 24.24, stable: true }
                ]
            }
        };

        const App = () => {
            const [selectedElement, setSelectedElement] = useState('H');
            const [neutronCount, setNeutronCount] = useState(0);
            
            // Load initial state when element changes
            useEffect(() => {
                const defaultIso = IsotopeData[selectedElement].isotopes[0];
                setNeutronCount(defaultIso.neutrons);
            }, [selectedElement]);

            const elementData = IsotopeData[selectedElement];
            const protonCount = elementData.z;
            const massNumber = protonCount + neutronCount;
            
            // Find matching real isotope data
            const currentIsotope = elementData.isotopes.find(iso => iso.neutrons === neutronCount);
            
            // Calculate RAM (Relative Atomic Mass) for display
            const calculateRAM = () => {
                let totalAbundance = 0;
                let weightedSum = 0;
                elementData.isotopes.forEach(iso => {
                    if (iso.stable) {
                        weightedSum += iso.a * iso.abundance;
                        totalAbundance += iso.abundance;
                    }
                });
                return (weightedSum / totalAbundance).toFixed(2);
            };

            const ram = calculateRAM();

            // Helper to generate nucleus visualization
            const renderNucleus = () => {
                const particles = [];
                // Pack particles in a spiral/cluster
                const total = protonCount + neutronCount;
                const radius = Math.sqrt(total) * 8; 
                
                for (let i = 0; i < protonCount; i++) {
                    const angle = i * 137.5; // Golden angle
                    const r = 6 * Math.sqrt(i);
                    const x = r * Math.cos(angle * Math.PI / 180);
                    const y = r * Math.sin(angle * Math.PI / 180);
                    particles.push(
                        <div key={`p-${i}`} className="nucleon absolute w-6 h-6 bg-red-500 rounded-full shadow-inner border border-red-400 flex items-center justify-center text-[10px] font-bold z-10"
                             style={{ transform: `translate(${x}px, ${y}px)` }}>
                            +
                        </div>
                    );
                }
                for (let i = 0; i < neutronCount; i++) {
                    const idx = i + protonCount;
                    const angle = idx * 137.5;
                    const r = 6 * Math.sqrt(idx);
                    const x = r * Math.cos(angle * Math.PI / 180);
                    const y = r * Math.sin(angle * Math.PI / 180);
                    particles.push(
                        <div key={`n-${i}`} className="nucleon absolute w-6 h-6 bg-slate-400 rounded-full shadow-inner border border-slate-300 z-0"
                             style={{ transform: `translate(${x}px, ${y}px)` }}>
                        </div>
                    );
                }
                return particles;
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-green-400 flex items-center gap-2">
                                <i data-lucide="atom"></i> 同位素視圖
                            </h1>
                            <p className="text-slate-400 text-sm">Isotope Visualizer: Protons vs Neutrons</p>
                        </div>
                        
                        <div className="flex gap-2">
                            {Object.keys(IsotopeData).map(symbol => (
                                <button
                                    key={symbol}
                                    onClick={() => setSelectedElement(symbol)}
                                    className={`w-10 h-10 rounded-lg font-bold transition-all border
                                        ${selectedElement === symbol 
                                            ? 'bg-green-600 text-white border-green-400 shadow-[0_0_10px_green]' 
                                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    {symbol}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Visualizer */}
                        <div className="w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative flex flex-col items-center min-h-[500px] shadow-2xl overflow-hidden">
                            
                            {/* Info Overlay */}
                            <div className="absolute top-6 left-6 z-20">
                                <div className="text-sm text-slate-400 uppercase font-bold mb-1">Atomic Symbol</div>
                                <div className="flex items-center gap-4 bg-black/40 p-3 rounded-xl border border-slate-600 backdrop-blur-sm">
                                    <div className="text-center font-serif leading-none">
                                        <div className="text-green-400 text-lg font-bold">{massNumber}</div>
                                        <div className="text-red-400 text-lg font-bold">{protonCount}</div>
                                    </div>
                                    <div className="text-6xl font-bold text-white">{elementData.symbol}</div>
                                </div>
                            </div>

                            {/* Stability Status */}
                            <div className="absolute top-6 right-6 z-20">
                                {currentIsotope ? (
                                    <div className={`px-4 py-2 rounded-lg border flex items-center gap-2 font-bold backdrop-blur-sm shadow-lg
                                        ${currentIsotope.stable 
                                            ? 'bg-green-500/20 border-green-500 text-green-300' 
                                            : 'bg-yellow-500/20 border-yellow-500 text-yellow-300 radioactive'}
                                    `}>
                                        {currentIsotope.stable ? <i data-lucide="shield-check" /> : <i data-lucide="radiation" />}
                                        {currentIsotope.stable ? '穩定 (Stable)' : '不穩定 (Unstable)'}
                                    </div>
                                ) : (
                                    <div className="px-4 py-2 rounded-lg border border-slate-500 bg-slate-700/50 text-slate-400 flex items-center gap-2 font-bold">
                                        <i data-lucide="help-circle" /> 理論存在 (Theoretical)
                                    </div>
                                )}
                            </div>

                            {/* Nucleus Area */}
                            <div className="flex-grow flex items-center justify-center w-full relative">
                                <div className="relative">
                                    {renderNucleus()}
                                    {/* Electron Cloud Hint */}
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] border border-slate-600/30 rounded-full animate-pulse pointer-events-none"></div>
                                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] border border-slate-600/20 rounded-full pointer-events-none"></div>
                                </div>
                            </div>

                            {/* Legend */}
                            <div className="absolute bottom-4 w-full flex justify-center gap-6">
                                <div className="flex items-center gap-2 bg-black/40 px-3 py-1 rounded-full border border-slate-600">
                                    <div className="w-4 h-4 bg-red-500 rounded-full"></div>
                                    <span className="text-xs text-slate-300">質子 (Protons)</span>
                                </div>
                                <div className="flex items-center gap-2 bg-black/40 px-3 py-1 rounded-full border border-slate-600">
                                    <div className="w-4 h-4 bg-slate-400 rounded-full"></div>
                                    <span className="text-xs text-slate-300">中子 (Neutrons)</span>
                                </div>
                            </div>

                        </div>

                        {/* Right: Controls & Data */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Controls */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="sliders" /> 粒子控制
                                </h3>
                                
                                {/* Protons (Fixed for Element) */}
                                <div className="mb-6 opacity-70">
                                    <div className="flex justify-between text-sm mb-2">
                                        <span className="text-red-400 font-bold">質子數 (Protons, Z)</span>
                                        <span className="text-white font-mono">{protonCount}</span>
                                    </div>
                                    <div className="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
                                        <div className="h-full bg-red-500" style={{width: '100%'}}></div>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1">質子數決定元素種類，此處固定。</p>
                                </div>

                                {/* Neutrons (Adjustable) */}
                                <div>
                                    <div className="flex justify-between text-sm mb-2">
                                        <span className="text-slate-300 font-bold">中子數 (Neutrons)</span>
                                        <span className="text-white font-mono text-xl">{neutronCount}</span>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <button 
                                            onClick={() => setNeutronCount(p => Math.max(0, p - 1))}
                                            className="w-10 h-10 rounded-lg bg-slate-600 hover:bg-slate-500 text-white font-bold transition-colors"
                                        >-</button>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max={protonCount * 2 + 2} 
                                            value={neutronCount} 
                                            onChange={(e) => setNeutronCount(parseInt(e.target.value))}
                                            className="flex-grow h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-slate-300"
                                        />
                                        <button 
                                            onClick={() => setNeutronCount(p => p + 1)}
                                            className="w-10 h-10 rounded-lg bg-slate-600 hover:bg-slate-500 text-white font-bold transition-colors"
                                        >+</button>
                                    </div>
                                </div>
                            </div>

                            {/* Isotope Details */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="database" /> 同位素數據
                                </h3>
                                
                                {currentIsotope ? (
                                    <div className="space-y-4 animate-in fade-in slide-in-from-bottom-2">
                                        <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-600">
                                            <div className="text-slate-400 text-xs uppercase font-bold">Isotope Name</div>
                                            <div className="text-2xl font-bold text-green-400">{currentIsotope.name}</div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-600">
                                                <div className="text-slate-400 text-xs">Abundance</div>
                                                <div className="text-lg font-mono text-white">
                                                    {currentIsotope.abundance > 0 ? `${currentIsotope.abundance}%` : 'Trace / Synthetic'}
                                                </div>
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-600">
                                                <div className="text-slate-400 text-xs">Mass Number (A)</div>
                                                <div className="text-lg font-mono text-white">{massNumber}</div>
                                            </div>
                                        </div>

                                        {!currentIsotope.stable && (
                                            <div className="bg-yellow-900/20 p-3 rounded-lg border border-yellow-700/50 text-yellow-200 text-sm">
                                                <span className="font-bold block mb-1">⚠️ 放射性同位素</span>
                                                半衰期 (Half-life): {currentIsotope.halfLife}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-center py-8 text-slate-500 italic border-2 border-dashed border-slate-700 rounded-xl">
                                        此中子數的同位素在自然界極罕見或不存在。
                                    </div>
                                )}

                                {/* RAM Explanation */}
                                <div className="mt-6 pt-4 border-t border-slate-700">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold text-slate-400">相對原子質量 (R.A.M.)</span>
                                        <span className="text-xl font-mono font-bold text-blue-400">{ram}</span>
                                    </div>
                                    <p className="text-xs text-slate-500">
                                        這是所有天然同位素質量的<strong>加權平均數 (Weighted Average)</strong>。
                                    </p>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Chemistry Topic II
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
