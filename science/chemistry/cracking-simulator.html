<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裂解模擬器 (Cracking Simulator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .molecule { transition: all 1s ease-in-out; }
        
        /* Heat Animation */
        @keyframes heat-shimmer {
            0% { opacity: 0.3; transform: translateY(0) scale(1); }
            50% { opacity: 0.6; transform: translateY(-10px) scale(1.1); }
            100% { opacity: 0.3; transform: translateY(0) scale(1); }
        }
        .heat-wave {
            position: absolute;
            background: radial-gradient(circle, rgba(239,68,68,0.4) 0%, transparent 70%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: heat-shimmer 2s infinite;
        }

        /* Bromine Test Animation */
        .bromine-liquid {
            transition: background-color 2s ease;
        }
        
        .fade-in { animation: fade-in 0.5s ease-out forwards; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isHeating, setIsHeating] = useState(false);
            const [cracked, setCracked] = useState(false);
            const [tested, setTested] = useState(false);
            const [bromineColor, setBromineColor] = useState('bg-orange-500'); // Orange to start
            const [products, setProducts] = useState([]);

            // Initial Long Chain Molecule (e.g., C10H22)
            // Visualized as a chain of balls
            const longChain = Array.from({ length: 10 }).map((_, i) => ({ id: i, type: 'C' }));

            const startCracking = () => {
                if (isHeating) return;
                setIsHeating(true);
                setCracked(false);
                setTested(false);
                setBromineColor('bg-orange-500');
                
                setTimeout(() => {
                    // Perform Cracking Logic (Random Split)
                    // Example: C10 -> C8 (Alkane) + C2 (Alkene) OR C6 + C4
                    // For visuals, let's split into two groups
                    const splitPoint = 4 + Math.floor(Math.random() * 3); // Split at 4, 5, or 6
                    
                    const prod1 = { 
                        name: `Octane (C8H18) 等長鏈烷烴`, 
                        type: 'alkane', 
                        atoms: longChain.slice(0, splitPoint),
                        x: -100, y: -50 
                    };
                    const prod2 = { 
                        name: `Ethene (C2H4) 等短鏈烯烴`, 
                        type: 'alkene', 
                        atoms: longChain.slice(splitPoint),
                        x: 100, y: 50,
                        isUnsaturated: true
                    };
                    
                    setProducts([prod1, prod2]);
                    setCracked(true);
                    setIsHeating(false);
                }, 3000); // 3s heating
            };

            const testBromine = () => {
                if (!cracked || tested) return;
                setTested(true);
                
                // Simulate Bromine Decolourization
                setTimeout(() => {
                    setBromineColor('bg-slate-200/30'); // Colorless
                }, 1000);
            };

            const reset = () => {
                setIsHeating(false);
                setCracked(false);
                setTested(false);
                setBromineColor('bg-orange-500');
                setProducts([]);
            };

            const MoleculeVisual = ({ atoms, className }) => (
                <div className={`flex items-center justify-center ${className}`}>
                    {atoms.map((atom, i) => (
                        <React.Fragment key={i}>
                            <div className="w-8 h-8 rounded-full bg-slate-800 border-2 border-slate-600 flex items-center justify-center relative shadow-lg z-10">
                                <span className="text-xs font-bold text-slate-400">C</span>
                                {/* Hydrogens (simplified visual) */}
                                <div className="absolute -top-2 w-2 h-2 bg-white rounded-full opacity-50"></div>
                                <div className="absolute -bottom-2 w-2 h-2 bg-white rounded-full opacity-50"></div>
                            </div>
                            {i < atoms.length - 1 && <div className="w-4 h-1 bg-slate-500"></div>}
                        </React.Fragment>
                    ))}
                </div>
            );

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-orange-500 flex items-center gap-2">
                                <i data-lucide="flame"></i> 裂解模擬器
                            </h1>
                            <p className="text-slate-400 text-sm">Cracking Simulator: Long to Short Chains</p>
                        </div>
                        <button onClick={reset} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-sm flex items-center gap-2 transition-colors border border-slate-600">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Reaction Chamber */}
                        <div className="w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative flex flex-col items-center justify-center min-h-[500px] shadow-2xl overflow-hidden p-8">
                            
                            {/* Background Elements */}
                            <div className="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiZmZmYiLz48L3N2Zz4=')]"></div>
                            
                            {/* Catalyst Bed */}
                            <div className="absolute bottom-0 w-full h-24 bg-stone-700 border-t-4 border-stone-600 flex items-center justify-center z-0">
                                <span className="text-stone-500 font-bold text-xl uppercase tracking-widest opacity-50">Hot Catalyst (Al₂O₃ / SiO₂)</span>
                            </div>

                            {/* Heat Effect */}
                            {isHeating && (
                                <>
                                    <div className="heat-wave bottom-10 left-1/4"></div>
                                    <div className="heat-wave bottom-20 left-1/2 animation-delay-500"></div>
                                    <div className="heat-wave bottom-10 right-1/4 animation-delay-1000"></div>
                                    <div className="absolute top-10 text-red-400 font-bold animate-pulse flex items-center gap-2">
                                        <i data-lucide="thermometer" /> High Temp & Pressure
                                    </div>
                                </>
                            )}

                            {/* Molecules Container */}
                            <div className="relative z-10 w-full h-64 flex items-center justify-center">
                                {!cracked ? (
                                    <div className={`molecule ${isHeating ? 'animate-bounce' : ''}`}>
                                        <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-600 backdrop-blur-sm mb-4 text-center">
                                            <div className="text-xs text-slate-400 uppercase font-bold mb-2">重油 / 燃料油 (Heavy Oil)</div>
                                            <MoleculeVisual atoms={longChain} />
                                            <div className="text-slate-300 text-sm mt-2 font-mono">C₁₀H₂₂ (Decane)</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-8 w-full">
                                        {products.map((prod, idx) => (
                                            <div key={idx} className={`molecule flex items-center justify-between bg-slate-900/80 p-4 rounded-2xl border ${prod.type === 'alkene' ? 'border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.2)]' : 'border-blue-500/50'} backdrop-blur-sm fade-in`}>
                                                <div>
                                                    <div className={`text-xs uppercase font-bold mb-1 ${prod.type === 'alkene' ? 'text-yellow-400' : 'text-blue-400'}`}>
                                                        {prod.type === 'alkene' ? 'Useful Alkene (烯烴)' : 'Shorter Alkane (烷烴)'}
                                                    </div>
                                                    <div className="text-white font-bold text-lg">{prod.name.split(' ')[0]}</div>
                                                </div>
                                                <MoleculeVisual atoms={prod.atoms} />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Action Button */}
                            {!cracked && (
                                <div className="absolute bottom-32 z-20">
                                    <button 
                                        onClick={startCracking}
                                        disabled={isHeating}
                                        className={`px-8 py-3 rounded-full font-bold text-lg shadow-lg transition-all flex items-center gap-2
                                            ${isHeating ? 'bg-red-500 text-white cursor-wait' : 'bg-orange-500 hover:bg-orange-600 text-white'}
                                        `}
                                    >
                                        <i data-lucide="zap" /> {isHeating ? '裂解進行中...' : '開始裂解 (Start Cracking)'}
                                    </button>
                                </div>
                            )}

                        </div>

                        {/* Right: Test & Info */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Bromine Water Test */}
                            <div className={`bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg transition-opacity duration-500 ${cracked ? 'opacity-100' : 'opacity-50 pointer-events-none'}`}>
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="flask-conical" className="text-yellow-500" /> 產物測試
                                </h3>
                                <p className="text-sm text-slate-400 mb-4">
                                    如何證明產物中含有不飽和烴 (Unsaturated Hydrocarbon / Alkene)？
                                </p>
                                
                                <div className="flex items-center gap-4 mb-4">
                                    <div className="relative w-16 h-24 border-2 border-slate-500 rounded-b-lg bg-white/10 overflow-hidden">
                                        <div className={`absolute bottom-0 w-full h-3/4 ${bromineColor} bromine-liquid`}></div>
                                    </div>
                                    <div className="flex-1">
                                        <div className="text-xs text-slate-500 font-bold uppercase mb-1">Reagent</div>
                                        <div className="text-white font-bold mb-2">溴水 (Bromine Water)</div>
                                        <button 
                                            onClick={testBromine}
                                            disabled={tested}
                                            className="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 disabled:bg-slate-600 disabled:text-slate-400 text-white text-sm font-bold rounded-lg transition-colors w-full"
                                        >
                                            加入產物測試
                                        </button>
                                    </div>
                                </div>

                                {tested && (
                                    <div className="bg-green-900/30 border border-green-500/50 p-3 rounded-lg animate-in fade-in">
                                        <div className="flex items-center gap-2 text-green-400 font-bold mb-1">
                                            <i data-lucide="check-circle" size={16} /> 陽性反應 (Positive)
                                        </div>
                                        <p className="text-xs text-slate-300">
                                            溴水由<strong>橙色褪至無色 (Decolourized)</strong>。證明產物中含有 C=C 雙鍵 (烯烴)。
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* Theory Card */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="book-open" /> 化學原理
                                </h3>
                                <div className="space-y-4 text-sm text-slate-300">
                                    <div>
                                        <strong className="text-orange-400 block mb-1">為什麼要裂解 (Cracking)？</strong>
                                        <p>原油中含有過多需求量低的長鏈重油。裂解能將其轉化為：</p>
                                        <ul className="list-disc list-inside mt-1 pl-2 text-xs text-slate-400">
                                            <li>需求量大的短鏈汽油 (Petrol)</li>
                                            <li>工業原料烯烴 (Alkenes for plastics)</li>
                                        </ul>
                                    </div>
                                    <div className="border-t border-slate-700 pt-4">
                                        <strong className="text-blue-400 block mb-1">反應條件</strong>
                                        <p>需要<strong>高溫</strong>及<strong>催化劑</strong> (如氧化鋁/矽膠碎)。這是一個熱分解 (Thermal Decomposition) 過程。</p>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic V
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
