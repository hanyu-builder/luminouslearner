<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化學計量計算機 (Stoichiometry Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .step-card { transition: all 0.3s ease; }
        .step-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        
        /* Flow Animation */
        @keyframes flow-right {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }
        .flow-line {
            stroke-dasharray: 5;
            animation: flow-right 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Extended Atomic Masses
        const AtomicMasses = {
            H: 1.0, He: 4.0, Li: 6.9, Be: 9.0, B: 10.8, C: 12.0, N: 14.0, O: 16.0, F: 19.0, Ne: 20.2,
            Na: 23.0, Mg: 24.3, Al: 27.0, Si: 28.1, P: 31.0, S: 32.1, Cl: 35.5, K: 39.1, Ar: 39.9, Ca: 40.1,
            Fe: 55.8, Cu: 63.5, Zn: 65.4, Br: 79.9, Ag: 107.9, I: 126.9, Ba: 137.3, Pb: 207.2,
            Mn: 54.9, Cr: 52.0
        };

        // Categorized Examples
        const ExampleCategories = [
            {
                name: '燃燒 (Combustion)',
                items: [
                    { name: 'Mg + O₂', a: { f: 'Mg', c: 2, m: 4.86 }, b: { f: 'MgO', c: 2 } },
                    { name: 'H₂ + O₂', a: { f: 'H2', c: 2, m: 4.0 }, b: { f: 'H2O', c: 2 } },
                    { name: 'C₃H₈ + O₂', a: { f: 'C3H8', c: 1, m: 10.0 }, b: { f: 'CO2', c: 3 } }
                ]
            },
            {
                name: '分解 (Decomp.)',
                items: [
                    { name: 'CaCO₃ → CaO', a: { f: 'CaCO3', c: 1, m: 50.0 }, b: { f: 'CaO', c: 1 } },
                    { name: '2KClO₃ → 3O₂', a: { f: 'KClO3', c: 2, m: 12.25 }, b: { f: 'O2', c: 3 } }
                ]
            },
            {
                name: '酸與金屬 (Acid+Metal)',
                items: [
                    { name: 'Mg + HCl', a: { f: 'Mg', c: 1, m: 2.43 }, b: { f: 'H2', c: 1 } },
                    { name: 'Zn + HCl', a: { f: 'Zn', c: 1, m: 6.54 }, b: { f: 'H2', c: 1 } }
                ]
            },
            {
                name: '中和 (Neutralization)',
                items: [
                    { name: 'NaOH + HCl', a: { f: 'NaOH', c: 1, m: 4.0 }, b: { f: 'NaCl', c: 1 } },
                    { name: 'Ca(OH)₂ + HCl', a: { f: 'Ca(OH)2', c: 1, m: 7.4 }, b: { f: 'CaCl2', c: 1 } }
                ]
            }
        ];

        const App = () => {
            // Inputs
            const [substanceA, setSubstanceA] = useState({ formula: 'Mg', coeff: 2, mass: '4.86' });
            const [substanceB, setSubstanceB] = useState({ formula: 'MgO', coeff: 2 });
            const [activeCategory, setActiveCategory] = useState(0);
            
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const [steps, setSteps] = useState(null);

            // Robust Formula Parser (Adapted from Formula Mass Calculator)
            const calculateMolarMass = (formula) => {
                if (!formula) return 0;
                try {
                    const stack = [{ atoms: {} }];
                    let i = 0;
                    const len = formula.length;

                    while (i < len) {
                        const char = formula[i];
                        if (char === '(') { stack.push({ atoms: {} }); i++; }
                        else if (char === ')') {
                            if (stack.length === 1) throw new Error("Unmatched brackets");
                            const group = stack.pop();
                            i++;
                            let numStr = '';
                            while (i < len && /\d/.test(formula[i])) { numStr += formula[i]; i++; }
                            const multiplier = numStr ? parseInt(numStr) : 1;
                            const parent = stack[stack.length - 1];
                            for (const [el, count] of Object.entries(group.atoms)) {
                                parent.atoms[el] = (parent.atoms[el] || 0) + count * multiplier;
                            }
                        } else if (/[A-Z]/.test(char)) {
                            let element = char;
                            i++;
                            if (i < len && /[a-z]/.test(formula[i])) { element += formula[i]; i++; }
                            let numStr = '';
                            while (i < len && /\d/.test(formula[i])) { numStr += formula[i]; i++; }
                            const count = numStr ? parseInt(numStr) : 1;
                            const current = stack[stack.length - 1];
                            current.atoms[element] = (current.atoms[element] || 0) + count;
                        } else { i++; }
                    }

                    let mass = 0;
                    for (const [el, count] of Object.entries(stack[0].atoms)) {
                        // Case insensitive check if needed, but atomic masses keys are strict here. 
                        // Let's assume input is correct case or handle it. 
                        // For better UX, let's try to match case-insensitive if direct match fails.
                        let elKey = el;
                        if (!AtomicMasses[elKey]) {
                             const match = Object.keys(AtomicMasses).find(k => k.toLowerCase() === el.toLowerCase());
                             if (match) elKey = match;
                        }

                        if (AtomicMasses[elKey]) {
                            mass += AtomicMasses[elKey] * count;
                        } else {
                            throw new Error(`未知元素: ${el}`);
                        }
                    }
                    return mass;
                } catch (e) {
                    throw e;
                }
            };

            const handleCalculate = () => {
                setError('');
                setResult(null);
                setSteps(null);

                const massA = parseFloat(substanceA.mass);
                const coeffA = parseFloat(substanceA.coeff);
                const coeffB = parseFloat(substanceB.coeff);
                
                if (isNaN(massA) || massA < 0) {
                    setError('請輸入有效的已知質量 (Mass A)。');
                    return;
                }
                if (isNaN(coeffA) || coeffA <= 0 || isNaN(coeffB) || coeffB <= 0) {
                    setError('化學計量係數 (Coefficient) 必須為正數。');
                    return;
                }

                try {
                    const mmA = calculateMolarMass(substanceA.formula.trim());
                    const mmB = calculateMolarMass(substanceB.formula.trim());

                    if (mmA === 0 || mmB === 0) {
                        setError('請輸入有效的化學式 (例如 Mg, O2, MgO)。');
                        return;
                    }

                    // Step 1: Mass A -> Mole A
                    const moleA = massA / mmA;

                    // Step 2: Mole A -> Mole B (Mole Ratio)
                    const moleB = moleA * (coeffB / coeffA);

                    // Step 3: Mole B -> Mass B
                    const massB = moleB * mmB;

                    setResult(massB.toFixed(2));
                    setSteps({
                        massA, mmA, moleA,
                        coeffA, coeffB,
                        moleB, mmB, massB
                    });
                } catch (e) {
                    setError(`化學式錯誤: ${e.message}`);
                }
            };

            const loadExampleData = (ex) => {
                setSubstanceA({ formula: ex.a.f, coeff: ex.a.c, mass: ex.a.m.toString() });
                setSubstanceB({ formula: ex.b.f, coeff: ex.b.c });
                setError('');
                setResult(null);
                setSteps(null);
            };

            const nextCategory = () => {
                setActiveCategory((prev) => (prev + 1) % ExampleCategories.length);
            };

            const prevCategory = () => {
                setActiveCategory((prev) => (prev - 1 + ExampleCategories.length) % ExampleCategories.length);
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="scale"></i> 化學計量計算機
                            </h1>
                            <p className="text-slate-400 text-sm">Stoichiometry Calculator (Mass-Mass)</p>
                        </div>
                        <button onClick={() => { setSubstanceA({...substanceA, mass: ''}); setResult(null); setSteps(null); }} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Input & Setup */}
                        <div className="w-full lg:w-5/12 flex flex-col gap-6">
                            
                            {/* Example Loader (Improved UI) */}
                            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                                <div className="flex justify-between items-center mb-3">
                                    <h4 className="text-xs font-bold text-slate-500 uppercase flex items-center gap-2">
                                        <i data-lucide="zap" size={14} /> 快速載入例子
                                    </h4>
                                </div>
                                
                                {/* Category Navigation - Updated Buttons */}
                                <div className="flex items-center justify-between bg-slate-50 rounded-lg p-1 mb-3">
                                    <button 
                                        onClick={prevCategory}
                                        className="p-2 rounded-md hover:bg-white text-indigo-600 hover:text-indigo-800 shadow-sm transition-all"
                                    >
                                        <i data-lucide="chevron-left" size={20} strokeWidth={3} />
                                    </button>
                                    
                                    <span className="text-sm font-bold text-indigo-600 select-none">
                                        {ExampleCategories[activeCategory].name}
                                    </span>

                                    <button 
                                        onClick={nextCategory}
                                        className="p-2 rounded-md hover:bg-white text-indigo-600 hover:text-indigo-800 shadow-sm transition-all"
                                    >
                                        <i data-lucide="chevron-right" size={20} strokeWidth={3} />
                                    </button>
                                </div>
                                
                                <div className="flex gap-2 flex-wrap">
                                    {ExampleCategories[activeCategory].items.map((item, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => loadExampleData(item)}
                                            className="px-3 py-1.5 bg-white text-slate-700 rounded-lg border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-200 text-xs font-bold transition-all shadow-sm"
                                        >
                                            {item.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-md border border-indigo-100">
                                <h3 className="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                                    <i data-lucide="test-tubes"></i> 設定反應物與生成物
                                </h3>

                                {/* Substance A (Known) */}
                                <div className="p-4 bg-blue-50 rounded-xl border border-blue-100 mb-4 relative group focus-within:ring-2 focus-within:ring-blue-300 transition-all">
                                    <div className="absolute -top-3 left-4 bg-blue-600 text-white px-2 py-0.5 rounded text-xs font-bold">已知物質 (Given)</div>
                                    <div className="grid grid-cols-12 gap-3 items-end">
                                        <div className="col-span-3">
                                            <label className="text-xs font-bold text-blue-700 block mb-1">係數 (Coeff)</label>
                                            <input 
                                                type="number" 
                                                value={substanceA.coeff}
                                                onChange={(e) => setSubstanceA({...substanceA, coeff: e.target.value})}
                                                className="w-full p-2 rounded border border-blue-200 text-center font-mono font-bold"
                                            />
                                        </div>
                                        <div className="col-span-9">
                                            <label className="text-xs font-bold text-blue-700 block mb-1">化學式 (Formula)</label>
                                            <input 
                                                type="text" 
                                                value={substanceA.formula}
                                                onChange={(e) => setSubstanceA({...substanceA, formula: e.target.value})}
                                                className="w-full p-2 rounded border border-blue-200 font-mono placeholder-blue-300" // Removed uppercase class
                                                placeholder="e.g. Mg"
                                            />
                                        </div>
                                        <div className="col-span-12 mt-2">
                                            <label className="text-xs font-bold text-blue-700 block mb-1">已知質量 (Mass, g)</label>
                                            <input 
                                                type="number" 
                                                value={substanceA.mass}
                                                onChange={(e) => setSubstanceA({...substanceA, mass: e.target.value})}
                                                className="w-full p-3 rounded-lg border-2 border-blue-300 text-xl font-mono font-bold text-blue-900 focus:border-blue-500 outline-none transition-all"
                                                placeholder="e.g. 4.86"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-center -my-6 relative z-10">
                                    <div className="bg-slate-200 rounded-full p-2 border-4 border-white">
                                        <i data-lucide="arrow-down" className="text-slate-500" />
                                    </div>
                                </div>

                                {/* Substance B (Target) */}
                                <div className="p-4 bg-green-50 rounded-xl border border-green-100 mt-4 relative group focus-within:ring-2 focus-within:ring-green-300 transition-all">
                                    <div className="absolute -top-3 left-4 bg-green-600 text-white px-2 py-0.5 rounded text-xs font-bold">目標物質 (Target)</div>
                                    <div className="grid grid-cols-12 gap-3 items-end">
                                        <div className="col-span-3">
                                            <label className="text-xs font-bold text-green-700 block mb-1">係數 (Coeff)</label>
                                            <input 
                                                type="number" 
                                                value={substanceB.coeff}
                                                onChange={(e) => setSubstanceB({...substanceB, coeff: e.target.value})}
                                                className="w-full p-2 rounded border border-green-200 text-center font-mono font-bold"
                                            />
                                        </div>
                                        <div className="col-span-9">
                                            <label className="text-xs font-bold text-green-700 block mb-1">化學式 (Formula)</label>
                                            <input 
                                                type="text" 
                                                value={substanceB.formula}
                                                onChange={(e) => setSubstanceB({...substanceB, formula: e.target.value})}
                                                className="w-full p-2 rounded border border-green-200 font-mono placeholder-green-300" // Removed uppercase class
                                                placeholder="e.g. MgO"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {error && (
                                    <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm font-bold flex items-center gap-2 animate-pulse">
                                        <i data-lucide="alert-circle" size={16} /> {error}
                                    </div>
                                )}

                                <button 
                                    onClick={handleCalculate}
                                    className="mt-6 w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-500 transition-all active:scale-95 text-lg flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="calculator" /> 計算質量 (Calculate Mass)
                                </button>
                            </div>

                        </div>

                        {/* Right: Visual Steps & Result */}
                        <div className="w-full lg:w-7/12 flex flex-col gap-6">
                            
                            {result ? (
                                <div className="h-full flex flex-col animate-in slide-in-from-right duration-500">
                                    
                                    {/* Visualization Map */}
                                    <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-md mb-6 relative overflow-hidden">
                                        <h3 className="text-sm font-bold text-slate-400 uppercase mb-6 flex items-center gap-2">
                                            <i data-lucide="git-merge" size={16} /> 計算路徑圖 (Calculation Map)
                                        </h3>
                                        
                                        <div className="flex justify-between items-center relative z-10">
                                            {/* Step 1 */}
                                            <div className="flex flex-col items-center w-1/3">
                                                <div className="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center border-2 border-blue-200 font-bold shadow-sm mb-2 text-xl">
                                                    1
                                                </div>
                                                <div className="text-xs font-bold text-blue-800 mb-1">Mass A &rarr; Mole A</div>
                                                <div className="bg-blue-50 px-2 py-1 rounded border border-blue-100 text-xs font-mono text-blue-600 font-bold">
                                                    ÷ {steps.mmA.toFixed(1)}
                                                </div>
                                            </div>

                                            {/* Arrow 1 */}
                                            <div className="flex-grow h-1 bg-slate-100 relative">
                                                <div className="absolute inset-0 bg-gradient-to-r from-blue-300 to-purple-300 opacity-50 flow-line"></div>
                                            </div>

                                            {/* Step 2 */}
                                            <div className="flex flex-col items-center w-1/3">
                                                <div className="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center border-2 border-purple-200 font-bold shadow-sm mb-2 text-xl">
                                                    2
                                                </div>
                                                <div className="text-xs font-bold text-purple-800 mb-1">Mole Ratio</div>
                                                <div className="bg-purple-50 px-2 py-1 rounded border border-purple-100 text-xs font-mono text-purple-600 font-bold">
                                                    × ({steps.coeffB}/{steps.coeffA})
                                                </div>
                                            </div>

                                            {/* Arrow 2 */}
                                            <div className="flex-grow h-1 bg-slate-100 relative">
                                                <div className="absolute inset-0 bg-gradient-to-r from-purple-300 to-green-300 opacity-50 flow-line"></div>
                                            </div>

                                            {/* Step 3 */}
                                            <div className="flex flex-col items-center w-1/3">
                                                <div className="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center border-2 border-green-200 font-bold shadow-sm mb-2 text-xl">
                                                    3
                                                </div>
                                                <div className="text-xs font-bold text-green-800 mb-1">Mole B &rarr; Mass B</div>
                                                <div className="bg-green-50 px-2 py-1 rounded border border-green-100 text-xs font-mono text-green-600 font-bold">
                                                    × {steps.mmB.toFixed(1)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Detailed Steps */}
                                    <div className="space-y-4 flex-grow">
                                        <div className="bg-white p-4 rounded-xl border-l-4 border-blue-500 shadow-sm step-card">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="text-xs font-bold text-blue-500 uppercase mb-1">Step 1: Find Moles of {substanceA.formula}</div>
                                                    <div className="text-sm text-slate-600">
                                                        Mole = Mass / Molar Mass
                                                        <br/>
                                                        <span className="font-mono text-slate-500">= {steps.massA} / {steps.mmA.toFixed(1)}</span>
                                                    </div>
                                                </div>
                                                <div className="text-2xl font-mono font-bold text-blue-600">{steps.moleA.toFixed(4)} <span className="text-sm font-sans text-slate-400">mol</span></div>
                                            </div>
                                        </div>

                                        <div className="bg-white p-4 rounded-xl border-l-4 border-purple-500 shadow-sm step-card">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="text-xs font-bold text-purple-500 uppercase mb-1">Step 2: Use Mole Ratio ({substanceA.coeff} : {substanceB.coeff})</div>
                                                    <div className="text-sm text-slate-600">
                                                        Mole {substanceB.formula} = Mole {substanceA.formula} × ({steps.coeffB}/{steps.coeffA})
                                                        <br/>
                                                        <span className="font-mono text-slate-500">= {steps.moleA.toFixed(4)} × {steps.coeffB/steps.coeffA}</span>
                                                    </div>
                                                </div>
                                                <div className="text-2xl font-mono font-bold text-purple-600">{steps.moleB.toFixed(4)} <span className="text-sm font-sans text-slate-400">mol</span></div>
                                            </div>
                                        </div>

                                        <div className="bg-white p-4 rounded-xl border-l-4 border-green-500 shadow-sm step-card">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="text-xs font-bold text-green-500 uppercase mb-1">Step 3: Convert to Mass</div>
                                                    <div className="text-sm text-slate-600">
                                                        Mass = Mole × Molar Mass
                                                        <br/>
                                                        <span className="font-mono text-slate-500">= {steps.moleB.toFixed(4)} × {steps.mmB.toFixed(1)}</span>
                                                    </div>
                                                </div>
                                                <div className="text-4xl font-mono font-bold text-green-600">{result} <span className="text-lg font-sans text-slate-400">g</span></div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col items-center justify-center text-slate-400 border-4 border-dashed border-slate-200 rounded-3xl bg-slate-50/50 p-12 min-h-[400px]">
                                    <i data-lucide="scale" size={64} className="mb-6 opacity-30" />
                                    <p className="text-xl text-center font-medium mb-2">
                                        等待數據輸入...
                                    </p>
                                    <p className="text-sm text-center opacity-70 max-w-xs">
                                        請在左側輸入「已知物質」的質量和「目標物質」的係數。
                                    </p>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic III
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
