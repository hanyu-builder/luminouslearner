<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式週期表 (Interactive Periodic Table)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .element-cell {
            transition: all 0.2s ease;
        }
        .element-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        
        /* Grid Layout for Periodic Table */
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Legend Gradient */
        .legend-gradient {
            background: linear-gradient(to right, #ef4444, #eab308, #22c55e, #3b82f6);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Elements Data (Simplified for first 20 + key elements for DSE)
        // Full implementation would load a JSON of all 118 elements
        const ElementsDB = [
            { z: 1, symbol: 'H', name: 'Hydrogen', group: 1, period: 1, cat: 'nonmetal', mp: 14, radius: 37, en: 2.2 },
            { z: 2, symbol: 'He', name: 'Helium', group: 18, period: 1, cat: 'noble', mp: 0.95, radius: 31, en: null },
            { z: 3, symbol: 'Li', name: 'Lithium', group: 1, period: 2, cat: 'alkali', mp: 453, radius: 152, en: 0.98 },
            { z: 4, symbol: 'Be', name: 'Beryllium', group: 2, period: 2, cat: 'alkaline', mp: 1560, radius: 112, en: 1.57 },
            { z: 5, symbol: 'B', name: 'Boron', group: 13, period: 2, cat: 'metalloid', mp: 2349, radius: 85, en: 2.04 },
            { z: 6, symbol: 'C', name: 'Carbon', group: 14, period: 2, cat: 'nonmetal', mp: 3800, radius: 77, en: 2.55 },
            { z: 7, symbol: 'N', name: 'Nitrogen', group: 15, period: 2, cat: 'nonmetal', mp: 63, radius: 75, en: 3.04 },
            { z: 8, symbol: 'O', name: 'Oxygen', group: 16, period: 2, cat: 'nonmetal', mp: 54, radius: 73, en: 3.44 },
            { z: 9, symbol: 'F', name: 'Fluorine', group: 17, period: 2, cat: 'halogen', mp: 53, radius: 72, en: 3.98 },
            { z: 10, symbol: 'Ne', name: 'Neon', group: 18, period: 2, cat: 'noble', mp: 24, radius: 71, en: null },
            { z: 11, symbol: 'Na', name: 'Sodium', group: 1, period: 3, cat: 'alkali', mp: 371, radius: 186, en: 0.93 },
            { z: 12, symbol: 'Mg', name: 'Magnesium', group: 2, period: 3, cat: 'alkaline', mp: 923, radius: 160, en: 1.31 },
            { z: 13, symbol: 'Al', name: 'Aluminium', group: 13, period: 3, cat: 'metal', mp: 933, radius: 143, en: 1.61 },
            { z: 14, symbol: 'Si', name: 'Silicon', group: 14, period: 3, cat: 'metalloid', mp: 1687, radius: 118, en: 1.9 },
            { z: 15, symbol: 'P', name: 'Phosphorus', group: 15, period: 3, cat: 'nonmetal', mp: 317, radius: 110, en: 2.19 },
            { z: 16, symbol: 'S', name: 'Sulphur', group: 16, period: 3, cat: 'nonmetal', mp: 388, radius: 103, en: 2.58 },
            { z: 17, symbol: 'Cl', name: 'Chlorine', group: 17, period: 3, cat: 'halogen', mp: 171, radius: 100, en: 3.16 },
            { z: 18, symbol: 'Ar', name: 'Argon', group: 18, period: 3, cat: 'noble', mp: 84, radius: 98, en: null },
            { z: 19, symbol: 'K', name: 'Potassium', group: 1, period: 4, cat: 'alkali', mp: 336, radius: 227, en: 0.82 },
            { z: 20, symbol: 'Ca', name: 'Calcium', group: 2, period: 4, cat: 'alkaline', mp: 1115, radius: 197, en: 1.0 },
            // Fillers for layout logic
            { z: 21, symbol: 'Sc', group: 3, period: 4, cat: 'transition', mp: 1814 },
            { z: 22, symbol: 'Ti', group: 4, period: 4, cat: 'transition', mp: 1941 },
            { z: 26, symbol: 'Fe', group: 8, period: 4, cat: 'transition', mp: 1811 },
            { z: 29, symbol: 'Cu', group: 11, period: 4, cat: 'transition', mp: 1357 },
            { z: 30, symbol: 'Zn', group: 12, period: 4, cat: 'transition', mp: 692 },
            { z: 35, symbol: 'Br', group: 17, period: 4, cat: 'halogen', mp: 265, radius: 114, en: 2.96 },
            { z: 53, symbol: 'I', group: 17, period: 5, cat: 'halogen', mp: 386, radius: 133, en: 2.66 }
        ];

        // Category Colors
        const Colors = {
            alkali: 'bg-red-500 border-red-600',
            alkaline: 'bg-orange-400 border-orange-500',
            transition: 'bg-yellow-500 border-yellow-600',
            metal: 'bg-blue-400 border-blue-500',
            metalloid: 'bg-teal-500 border-teal-600',
            nonmetal: 'bg-green-500 border-green-600',
            halogen: 'bg-indigo-500 border-indigo-600',
            noble: 'bg-purple-500 border-purple-600',
            unknown: 'bg-slate-700 border-slate-600'
        };

        const App = () => {
            const [viewMode, setViewMode] = useState('default'); // default, radius, melting
            const [selectedElement, setSelectedElement] = useState(null);
            const [hoverElement, setHoverElement] = useState(null);

            // Helper to get element at grid position
            const getElementAt = (row, col) => {
                return ElementsDB.find(e => e.period === row && e.group === col);
            };

            // Generate Grid Cells
            const renderGrid = () => {
                const grid = [];
                for (let r = 1; r <= 7; r++) {
                    for (let c = 1; c <= 18; c++) {
                        const el = getElementAt(r, c);
                        
                        // Skip logic for Lanthanides/Actinides gaps for simplicity in this demo
                        
                        if (el) {
                            // Calculate styles based on mode
                            let style = {};
                            let content = null;
                            let bgClass = Colors[el.cat] || Colors.unknown;

                            if (viewMode === 'radius') {
                                const size = el.radius ? (el.radius / 250) * 100 : 40; // Scale size
                                content = (
                                    <div className="w-full h-full flex items-center justify-center">
                                        <div 
                                            style={{ width: `${size}%`, height: `${size}%`, borderRadius: '50%' }} 
                                            className={`bg-white/80 transition-all duration-500`}
                                        ></div>
                                    </div>
                                );
                            } else if (viewMode === 'melting') {
                                // Heatmap logic: 0K (Blue) -> 4000K (Red)
                                const temp = el.mp || 0;
                                const intensity = Math.min(1, temp / 3500);
                                // Simple gradient approximation
                                const rVal = Math.floor(255 * intensity);
                                const bVal = Math.floor(255 * (1 - intensity));
                                style = { backgroundColor: `rgb(${rVal}, 50, ${bVal})`, borderColor: `rgba(255,255,255,0.2)` };
                                bgClass = ''; // Override default class
                            }

                            grid.push(
                                <div 
                                    key={`${r}-${c}`} 
                                    className={`element-cell relative aspect-square rounded-md border border-opacity-50 cursor-pointer flex flex-col items-center justify-center select-none ${bgClass}`}
                                    style={{ gridColumn: c, gridRow: r, ...style }}
                                    onMouseEnter={() => setHoverElement(el)}
                                    onClick={() => setSelectedElement(el)}
                                >
                                    {viewMode === 'default' && (
                                        <>
                                            <div className="text-[10px] absolute top-0.5 left-1 opacity-80">{el.z}</div>
                                            <div className="font-bold text-lg leading-none shadow-black drop-shadow-md">{el.symbol}</div>
                                        </>
                                    )}
                                    {viewMode !== 'default' && (
                                        <>
                                            <div className="absolute top-0 left-0 w-full h-full opacity-30 z-0">{content}</div>
                                            <div className="font-bold text-sm z-10 drop-shadow-md">{el.symbol}</div>
                                        </>
                                    )}
                                </div>
                            );
                        } else {
                            // Empty cell placeholder logic could go here if needed
                        }
                    }
                }
                return grid;
            };

            const activeEl = hoverElement || selectedElement;

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-7xl">
                    
                    {/* Header & Controls */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-700 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-teal-400 flex items-center gap-2">
                                <i data-lucide="grid"></i> 互動式週期表
                            </h1>
                            <p className="text-slate-400 text-sm">Discover Periodic Trends & Patterns</p>
                        </div>
                        
                        <div className="flex bg-slate-800 rounded-lg p-1">
                            <button 
                                onClick={() => setViewMode('default')}
                                className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'default' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                基本視圖
                            </button>
                            <button 
                                onClick={() => setViewMode('radius')}
                                className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'radius' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                原子半徑 (Size)
                            </button>
                            <button 
                                onClick={() => setViewMode('melting')}
                                className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'melting' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                熔點 (Melting Pt.)
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6 flex-grow">
                        
                        {/* Main Table Area */}
                        <div className="flex-grow overflow-x-auto pb-4 custom-scrollbar">
                            <div className="periodic-grid min-w-[800px]">
                                {renderGrid()}
                            </div>
                            
                            {/* Legend Area */}
                            <div className="mt-6 flex flex-wrap gap-4 justify-center text-xs text-slate-300">
                                {viewMode === 'default' ? (
                                    <>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.alkali}`}></div> Alkali Metals</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.alkaline}`}></div> Alkaline Earth</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.transition}`}></div> Transition</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.halogen}`}></div> Halogens</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.noble}`}></div> Noble Gases</div>
                                    </>
                                ) : viewMode === 'melting' ? (
                                    <div className="w-64 h-4 rounded-full legend-gradient relative">
                                        <span className="absolute -bottom-5 left-0">Low MP</span>
                                        <span className="absolute -bottom-5 right-0">High MP</span>
                                    </div>
                                ) : (
                                    <div>圓圈大小代表原子半徑 (Circle size represents Atomic Radius)</div>
                                )}
                            </div>
                        </div>

                        {/* Info Panel (Sidebar) */}
                        <div className="w-full lg:w-80 bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-2xl flex flex-col sticky top-6 h-fit">
                            {activeEl ? (
                                <div className="animate-in slide-in-from-right fade-in duration-300">
                                    {/* Element Header */}
                                    <div className="flex justify-between items-start mb-6">
                                        <div>
                                            <div className="text-6xl font-bold text-white mb-1">{activeEl.symbol}</div>
                                            <div className="text-xl text-teal-400 font-medium">{activeEl.name}</div>
                                            <div className="text-sm text-slate-500 uppercase mt-1">{activeEl.cat}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-4xl font-mono font-bold text-slate-600">{activeEl.z}</div>
                                            <div className="text-xs text-slate-500 mt-1">Atomic Number</div>
                                        </div>
                                    </div>

                                    {/* Properties Grid */}
                                    <div className="space-y-4">
                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600">
                                            <span className="text-slate-400 text-sm">Group</span>
                                            <span className="text-white font-mono font-bold">{activeEl.group}</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600">
                                            <span className="text-slate-400 text-sm">Period</span>
                                            <span className="text-white font-mono font-bold">{activeEl.period}</span>
                                        </div>
                                        
                                        <div className="h-px bg-slate-600 my-2"></div>

                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600">
                                            <span className="text-slate-400 text-sm">Melting Point</span>
                                            <span className="text-white font-mono font-bold">{activeEl.mp ? `${activeEl.mp} K` : 'N/A'}</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600">
                                            <span className="text-slate-400 text-sm">Atomic Radius</span>
                                            <span className="text-white font-mono font-bold">{activeEl.radius ? `${activeEl.radius} pm` : 'N/A'}</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600">
                                            <span className="text-slate-400 text-sm">Electronegativity</span>
                                            <span className="text-white font-mono font-bold">{activeEl.en || 'N/A'}</span>
                                        </div>
                                    </div>

                                    {/* Trend Context Hint */}
                                    <div className="mt-6 p-3 bg-teal-900/30 border border-teal-800 rounded-lg text-xs text-teal-200 leading-relaxed">
                                        <strong className="block mb-1 text-teal-400">DSE Trend Note:</strong>
                                        {activeEl.group === 1 && 'Alkali metals become MORE reactive down the group.'}
                                        {activeEl.group === 17 && 'Halogens become LESS reactive down the group.'}
                                        {activeEl.period === 3 && 'Atomic radius decreases across Period 3.'}
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col items-center justify-center text-slate-500 text-center py-10">
                                    <i data-lucide="mouse-pointer-2" size={48} className="mb-4 opacity-50" />
                                    <p>Hover over an element to see details.</p>
                                </div>
                            )}
                        </div>

                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic II & XII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
