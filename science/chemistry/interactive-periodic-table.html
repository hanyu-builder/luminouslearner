<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式週期表 (Interactive Periodic Table)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .element-cell {
            transition: all 0.2s ease;
        }
        .element-cell:hover {
            transform: scale(1.15);
            z-index: 20;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        
        /* Grid Layout for Periodic Table */
        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            width: 100%;
            min-width: 900px; /* Ensure minimum width */
            margin: 0 auto;
        }

        /* Legend Gradient */
        .legend-gradient {
            background: linear-gradient(to right, #ef4444, #eab308, #22c55e, #3b82f6);
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Extended Elements Data (Z=1 to 56, plus common heavy elements)
        const ElementsDB = [
            // Period 1
            { z: 1, symbol: 'H', name: 'Hydrogen', group: 1, period: 1, cat: 'nonmetal', mp: 14, radius: 37, en: 2.2 },
            { z: 2, symbol: 'He', name: 'Helium', group: 18, period: 1, cat: 'noble', mp: 0.95, radius: 31, en: null },
            
            // Period 2
            { z: 3, symbol: 'Li', name: 'Lithium', group: 1, period: 2, cat: 'alkali', mp: 453, radius: 152, en: 0.98 },
            { z: 4, symbol: 'Be', name: 'Beryllium', group: 2, period: 2, cat: 'alkaline', mp: 1560, radius: 112, en: 1.57 },
            { z: 5, symbol: 'B', name: 'Boron', group: 13, period: 2, cat: 'metalloid', mp: 2349, radius: 85, en: 2.04 },
            { z: 6, symbol: 'C', name: 'Carbon', group: 14, period: 2, cat: 'nonmetal', mp: 3800, radius: 77, en: 2.55 },
            { z: 7, symbol: 'N', name: 'Nitrogen', group: 15, period: 2, cat: 'nonmetal', mp: 63, radius: 75, en: 3.04 },
            { z: 8, symbol: 'O', name: 'Oxygen', group: 16, period: 2, cat: 'nonmetal', mp: 54, radius: 73, en: 3.44 },
            { z: 9, symbol: 'F', name: 'Fluorine', group: 17, period: 2, cat: 'halogen', mp: 53, radius: 72, en: 3.98 },
            { z: 10, symbol: 'Ne', name: 'Neon', group: 18, period: 2, cat: 'noble', mp: 24, radius: 71, en: null },
            
            // Period 3
            { z: 11, symbol: 'Na', name: 'Sodium', group: 1, period: 3, cat: 'alkali', mp: 371, radius: 186, en: 0.93 },
            { z: 12, symbol: 'Mg', name: 'Magnesium', group: 2, period: 3, cat: 'alkaline', mp: 923, radius: 160, en: 1.31 },
            { z: 13, symbol: 'Al', name: 'Aluminium', group: 13, period: 3, cat: 'metal', mp: 933, radius: 143, en: 1.61 },
            { z: 14, symbol: 'Si', name: 'Silicon', group: 14, period: 3, cat: 'metalloid', mp: 1687, radius: 118, en: 1.9 },
            { z: 15, symbol: 'P', name: 'Phosphorus', group: 15, period: 3, cat: 'nonmetal', mp: 317, radius: 110, en: 2.19 },
            { z: 16, symbol: 'S', name: 'Sulphur', group: 16, period: 3, cat: 'nonmetal', mp: 388, radius: 103, en: 2.58 },
            { z: 17, symbol: 'Cl', name: 'Chlorine', group: 17, period: 3, cat: 'halogen', mp: 171, radius: 100, en: 3.16 },
            { z: 18, symbol: 'Ar', name: 'Argon', group: 18, period: 3, cat: 'noble', mp: 84, radius: 98, en: null },
            
            // Period 4
            { z: 19, symbol: 'K', name: 'Potassium', group: 1, period: 4, cat: 'alkali', mp: 336, radius: 227, en: 0.82 },
            { z: 20, symbol: 'Ca', name: 'Calcium', group: 2, period: 4, cat: 'alkaline', mp: 1115, radius: 197, en: 1.0 },
            { z: 21, symbol: 'Sc', name: 'Scandium', group: 3, period: 4, cat: 'transition', mp: 1814, radius: 162, en: 1.36 },
            { z: 22, symbol: 'Ti', name: 'Titanium', group: 4, period: 4, cat: 'transition', mp: 1941, radius: 147, en: 1.54 },
            { z: 23, symbol: 'V', name: 'Vanadium', group: 5, period: 4, cat: 'transition', mp: 2183, radius: 134, en: 1.63 },
            { z: 24, symbol: 'Cr', name: 'Chromium', group: 6, period: 4, cat: 'transition', mp: 2180, radius: 128, en: 1.66 },
            { z: 25, symbol: 'Mn', name: 'Manganese', group: 7, period: 4, cat: 'transition', mp: 1519, radius: 127, en: 1.55 },
            { z: 26, symbol: 'Fe', name: 'Iron', group: 8, period: 4, cat: 'transition', mp: 1811, radius: 126, en: 1.83 },
            { z: 27, symbol: 'Co', name: 'Cobalt', group: 9, period: 4, cat: 'transition', mp: 1768, radius: 125, en: 1.88 },
            { z: 28, symbol: 'Ni', name: 'Nickel', group: 10, period: 4, cat: 'transition', mp: 1728, radius: 124, en: 1.91 },
            { z: 29, symbol: 'Cu', name: 'Copper', group: 11, period: 4, cat: 'transition', mp: 1357, radius: 128, en: 1.9 },
            { z: 30, symbol: 'Zn', name: 'Zinc', group: 12, period: 4, cat: 'transition', mp: 692, radius: 134, en: 1.65 },
            { z: 31, symbol: 'Ga', name: 'Gallium', group: 13, period: 4, cat: 'metal', mp: 302, radius: 135, en: 1.81 },
            { z: 32, symbol: 'Ge', name: 'Germanium', group: 14, period: 4, cat: 'metalloid', mp: 1211, radius: 122, en: 2.01 },
            { z: 33, symbol: 'As', name: 'Arsenic', group: 15, period: 4, cat: 'metalloid', mp: 1090, radius: 120, en: 2.18 },
            { z: 34, symbol: 'Se', name: 'Selenium', group: 16, period: 4, cat: 'nonmetal', mp: 494, radius: 119, en: 2.55 },
            { z: 35, symbol: 'Br', name: 'Bromine', group: 17, period: 4, cat: 'halogen', mp: 265, radius: 114, en: 2.96 },
            { z: 36, symbol: 'Kr', name: 'Krypton', group: 18, period: 4, cat: 'noble', mp: 115, radius: 112, en: 3.0 },

            // Period 5
            { z: 37, symbol: 'Rb', name: 'Rubidium', group: 1, period: 5, cat: 'alkali', mp: 312, radius: 248, en: 0.82 },
            { z: 38, symbol: 'Sr', name: 'Strontium', group: 2, period: 5, cat: 'alkaline', mp: 1050, radius: 215, en: 0.95 },
            { z: 47, symbol: 'Ag', name: 'Silver', group: 11, period: 5, cat: 'transition', mp: 1234, radius: 144, en: 1.93 },
            { z: 50, symbol: 'Sn', name: 'Tin', group: 14, period: 5, cat: 'metal', mp: 505, radius: 140, en: 1.96 },
            { z: 53, symbol: 'I', name: 'Iodine', group: 17, period: 5, cat: 'halogen', mp: 386, radius: 133, en: 2.66 },
            { z: 54, symbol: 'Xe', name: 'Xenon', group: 18, period: 5, cat: 'noble', mp: 161, radius: 131, en: 2.6 },

            // Period 6
            { z: 55, symbol: 'Cs', name: 'Cesium', group: 1, period: 6, cat: 'alkali', mp: 301, radius: 265, en: 0.79 },
            { z: 56, symbol: 'Ba', name: 'Barium', group: 2, period: 6, cat: 'alkaline', mp: 1000, radius: 222, en: 0.89 },
            { z: 79, symbol: 'Au', name: 'Gold', group: 11, period: 6, cat: 'transition', mp: 1337, radius: 144, en: 2.54 },
            { z: 80, symbol: 'Hg', name: 'Mercury', group: 12, period: 6, cat: 'transition', mp: 234, radius: 151, en: 2.0 },
            { z: 82, symbol: 'Pb', name: 'Lead', group: 14, period: 6, cat: 'metal', mp: 600, radius: 147, en: 2.33 }
        ];

        // Category Colors
        const Colors = {
            alkali: 'bg-red-500 border-red-600 hover:bg-red-400',
            alkaline: 'bg-orange-400 border-orange-500 hover:bg-orange-300',
            transition: 'bg-yellow-500 border-yellow-600 hover:bg-yellow-400',
            metal: 'bg-blue-400 border-blue-500 hover:bg-blue-300',
            metalloid: 'bg-teal-500 border-teal-600 hover:bg-teal-400',
            nonmetal: 'bg-green-500 border-green-600 hover:bg-green-400',
            halogen: 'bg-indigo-500 border-indigo-600 hover:bg-indigo-400',
            noble: 'bg-purple-500 border-purple-600 hover:bg-purple-400',
            unknown: 'bg-slate-700 border-slate-600 opacity-50'
        };

        const App = () => {
            const [viewMode, setViewMode] = useState('default'); // default, radius, melting
            const [selectedElement, setSelectedElement] = useState(null);
            const [hoverElement, setHoverElement] = useState(null);

            // Helper to get element at grid position
            const getElementAt = (row, col) => {
                return ElementsDB.find(e => e.period === row && e.group === col);
            };

            // Generate Grid Cells
            const renderGrid = () => {
                const grid = [];
                // Create 7 rows, 18 columns
                for (let r = 1; r <= 7; r++) {
                    for (let c = 1; c <= 18; c++) {
                        const el = getElementAt(r, c);
                        
                        // Basic placeholder for Lanthanides/Actinides gap (Period 6/7, Group 3)
                        const isGap = (r === 6 && c === 3) || (r === 7 && c === 3);
                        
                        if (el) {
                            // Calculate styles based on mode
                            let style = {};
                            let content = null;
                            let bgClass = Colors[el.cat] || Colors.unknown;

                            if (viewMode === 'radius') {
                                const size = el.radius ? (el.radius / 270) * 100 : 40; // Scale size
                                content = (
                                    <div className="w-full h-full flex items-center justify-center">
                                        <div 
                                            style={{ width: `${size}%`, height: `${size}%`, borderRadius: '50%' }} 
                                            className={`bg-white/90 transition-all duration-500 shadow-sm`}
                                        ></div>
                                    </div>
                                );
                            } else if (viewMode === 'melting') {
                                // Heatmap logic: 0K (Blue) -> 4000K (Red)
                                const temp = el.mp || 0;
                                const intensity = Math.min(1, temp / 3800);
                                // Simple gradient approximation: Blue -> Red -> White
                                let rVal, gVal, bVal;
                                if (intensity < 0.5) {
                                    // Blue to Redish
                                    rVal = Math.floor(50 + 410 * intensity);
                                    bVal = Math.floor(255 - 410 * intensity);
                                    gVal = 50;
                                } else {
                                    // Red to White
                                    rVal = 255;
                                    bVal = 50 + 410 * (intensity - 0.5);
                                    gVal = 50 + 410 * (intensity - 0.5);
                                }
                                
                                style = { backgroundColor: `rgb(${rVal}, ${gVal}, ${bVal})`, borderColor: `rgba(255,255,255,0.2)` };
                                bgClass = ''; // Override default class
                            }

                            grid.push(
                                <div 
                                    key={`${r}-${c}`} 
                                    className={`element-cell relative aspect-square rounded-sm border border-opacity-30 cursor-pointer flex flex-col items-center justify-center select-none ${bgClass}`}
                                    style={{ gridColumn: c, gridRow: r, ...style }}
                                    onMouseEnter={() => setHoverElement(el)}
                                    onClick={() => setSelectedElement(el)}
                                >
                                    {viewMode === 'default' && (
                                        <>
                                            <div className="text-[9px] absolute top-0.5 left-1 opacity-70">{el.z}</div>
                                            <div className="font-bold text-sm md:text-lg leading-none shadow-black drop-shadow-sm">{el.symbol}</div>
                                        </>
                                    )}
                                    {viewMode !== 'default' && (
                                        <>
                                            <div className="absolute top-0 left-0 w-full h-full opacity-30 z-0">{content}</div>
                                            <div className="font-bold text-xs z-10 drop-shadow-md text-white">{el.symbol}</div>
                                        </>
                                    )}
                                </div>
                            );
                        } else if (isGap) {
                             // Render gap markers for Lanthanides/Actinides (Optional Visual)
                             grid.push(
                                <div key={`gap-${r}`} className="flex items-center justify-center text-[10px] text-slate-600" style={{ gridColumn: c, gridRow: r }}>
                                    {r===6 ? '57-71' : '89-103'}
                                </div>
                             );
                        }
                    }
                }
                return grid;
            };

            const activeEl = hoverElement || selectedElement;

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-[1400px]">
                    
                    {/* Header & Controls */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-4 border-b border-slate-700 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-teal-400 flex items-center gap-2">
                                <i data-lucide="grid"></i> 互動式週期表 (Extended)
                            </h1>
                            <p className="text-slate-400 text-sm">Discover Periodic Trends & Patterns (Z=1-56 + Common Heavy Metals)</p>
                        </div>
                        
                        <div className="flex bg-slate-800 rounded-lg p-1 gap-1">
                            <button 
                                onClick={() => setViewMode('default')}
                                className={`px-3 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'default' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                基本 (Basic)
                            </button>
                            <button 
                                onClick={() => setViewMode('radius')}
                                className={`px-3 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'radius' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                原子半徑 (Radius)
                            </button>
                            <button 
                                onClick={() => setViewMode('melting')}
                                className={`px-3 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'melting' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                            >
                                熔點 (Melting Pt.)
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col xl:flex-row gap-6 flex-grow">
                        
                        {/* Main Table Area */}
                        <div className="flex-grow overflow-x-auto pb-4 custom-scrollbar">
                            <div className="periodic-grid">
                                {renderGrid()}
                            </div>
                            
                            {/* Legend Area */}
                            <div className="mt-6 flex flex-wrap gap-4 justify-center text-xs text-slate-300 bg-slate-800/50 p-3 rounded-lg">
                                {viewMode === 'default' ? (
                                    <>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.alkali}`}></div> Alkali Metals</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.alkaline}`}></div> Alkaline Earth</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.transition}`}></div> Transition Metals</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.metal}`}></div> Post-transition</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.metalloid}`}></div> Metalloids</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.nonmetal}`}></div> Nonmetals</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.halogen}`}></div> Halogens</div>
                                        <div className="flex items-center gap-1"><div className={`w-3 h-3 ${Colors.noble}`}></div> Noble Gases</div>
                                    </>
                                ) : viewMode === 'melting' ? (
                                    <div className="w-64 h-4 rounded-full legend-gradient relative mx-auto">
                                        <span className="absolute -bottom-5 left-0 font-bold text-blue-400">Low MP</span>
                                        <span className="absolute -bottom-5 right-0 font-bold text-red-400">High MP</span>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-4 rounded-full bg-white/80"></div>
                                        <span>圓圈大小代表原子半徑 (Circle size = Atomic Radius). Trend: Increases down & left.</span>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Info Panel (Sidebar) */}
                        <div className="w-full xl:w-80 bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-2xl flex flex-col sticky top-4 h-fit shrink-0">
                            {activeEl ? (
                                <div className="animate-in slide-in-from-right fade-in duration-300">
                                    {/* Element Header */}
                                    <div className="flex justify-between items-start mb-6">
                                        <div>
                                            <div className="text-6xl font-bold text-white mb-1">{activeEl.symbol}</div>
                                            <div className="text-xl text-teal-400 font-medium">{activeEl.name}</div>
                                            <div className="text-xs text-slate-500 uppercase mt-1 bg-slate-900 px-2 py-1 rounded inline-block">{activeEl.cat}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-5xl font-mono font-bold text-slate-700/50 absolute top-4 right-4 -z-10">{activeEl.z}</div>
                                            <div className="text-4xl font-mono font-bold text-white relative z-10">{activeEl.z}</div>
                                            <div className="text-xs text-slate-500 mt-1">Atomic Number</div>
                                        </div>
                                    </div>

                                    {/* Properties Grid */}
                                    <div className="space-y-3">
                                        <div className="grid grid-cols-2 gap-2">
                                            <div className="bg-slate-900/50 p-2 rounded-lg text-center border border-slate-600">
                                                <div className="text-slate-400 text-[10px] uppercase">Group</div>
                                                <div className="text-white font-mono font-bold text-lg">{activeEl.group}</div>
                                            </div>
                                            <div className="bg-slate-900/50 p-2 rounded-lg text-center border border-slate-600">
                                                <div className="text-slate-400 text-[10px] uppercase">Period</div>
                                                <div className="text-white font-mono font-bold text-lg">{activeEl.period}</div>
                                            </div>
                                        </div>
                                        
                                        <div className="h-px bg-slate-600 my-2"></div>

                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600 hover:border-teal-500 transition-colors">
                                            <span className="text-slate-400 text-sm">Melting Point</span>
                                            <span className="text-white font-mono font-bold">{activeEl.mp ? `${activeEl.mp} K` : 'N/A'}</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600 hover:border-teal-500 transition-colors">
                                            <span className="text-slate-400 text-sm">Atomic Radius</span>
                                            <span className="text-white font-mono font-bold">{activeEl.radius ? `${activeEl.radius} pm` : 'N/A'}</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-lg flex justify-between items-center border border-slate-600 hover:border-teal-500 transition-colors">
                                            <span className="text-slate-400 text-sm">Electronegativity</span>
                                            <span className="text-white font-mono font-bold">{activeEl.en || 'N/A'}</span>
                                        </div>
                                    </div>

                                    {/* Trend Context Hint */}
                                    <div className="mt-6 p-4 bg-teal-900/20 border border-teal-800 rounded-lg text-xs text-teal-200 leading-relaxed shadow-inner">
                                        <strong className="block mb-2 text-teal-400 flex items-center gap-2">
                                            <i data-lucide="lightbulb" size={14}></i> DSE Trend Note:
                                        </strong>
                                        {activeEl.group === 1 && 'Alkali metals become MORE reactive down the group (Li < Na < K < Rb < Cs).'}
                                        {activeEl.group === 2 && 'Alkaline earth metals reactivity increases down the group.'}
                                        {activeEl.group === 17 && 'Halogens become LESS reactive down the group (F > Cl > Br > I).'}
                                        {activeEl.group === 18 && 'Noble gases have very low boiling points, increasing down the group due to stronger van der Waals\' forces.'}
                                        {(activeEl.cat === 'transition') && 'Transition metals typically form colored ions and have variable oxidation states.'}
                                        {activeEl.period === 3 && 'Atomic radius decreases across Period 3, while electronegativity increases.'}
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col items-center justify-center text-slate-500 text-center py-10">
                                    <div className="w-20 h-20 bg-slate-700/30 rounded-full flex items-center justify-center mb-4">
                                        <i data-lucide="mouse-pointer-2" size={32} className="opacity-50" />
                                    </div>
                                    <p className="text-sm">Hover over an element to see details.</p>
                                    <p className="text-xs opacity-50 mt-2">Click to select.</p>
                                </div>
                            )}
                        </div>

                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic II & XII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
