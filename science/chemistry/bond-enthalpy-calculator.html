<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鍵焓計算機 (Bond Enthalpy Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .bond-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }

        /* Energy Diagram Animations */
        @keyframes grow-up { from { height: 0; } to { height: var(--h); } }
        @keyframes grow-down { from { height: 0; } to { height: var(--h); } }
        .arrow-up { animation: grow-up 1s ease-out forwards; }
        .arrow-down { animation: grow-down 1s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Bond Enthalpy Data (kJ/mol)
        const BondData = {
            'C-H': 413, 'C-C': 347, 'C=C': 612, 'C-O': 358, 'C=O': 799, 
            'O=O': 498, 'O-H': 464, 'H-H': 436, 'H-Cl': 432, 'Cl-Cl': 243,
            'N-H': 391, 'N≡N': 945, 'C-Cl': 327, 'H-Br': 366, 'Br-Br': 193, 'H-I': 299, 'I-I': 151
        };

        // Presets
        const Presets = [
            {
                name: '甲烷燃燒',
                reactants: [ { bond: 'C-H', count: 4 }, { bond: 'O=O', count: 2 } ],
                products: [ { bond: 'C=O', count: 2 }, { bond: 'O-H', count: 4 } ]
            },
            {
                name: '乙烯氫化',
                reactants: [ { bond: 'C=C', count: 1 }, { bond: 'C-H', count: 4 }, { bond: 'H-H', count: 1 } ],
                products: [ { bond: 'C-C', count: 1 }, { bond: 'C-H', count: 6 } ]
            },
            {
                name: '氫氣燃燒',
                reactants: [ { bond: 'H-H', count: 2 }, { bond: 'O=O', count: 1 } ],
                products: [ { bond: 'O-H', count: 4 } ]
            }
        ];

        const App = () => {
            const [reactants, setReactants] = useState([{ id: 1, bond: 'C-H', count: 1 }]);
            const [products, setProducts] = useState([{ id: 1, bond: 'C=O', count: 1 }]);
            const [result, setResult] = useState(null);
            
            // Calculate
            const calculate = () => {
                let energyIn = 0;
                let energyOut = 0;

                reactants.forEach(r => {
                    if (r.bond && BondData[r.bond]) energyIn += BondData[r.bond] * parseFloat(r.count);
                });

                products.forEach(p => {
                    if (p.bond && BondData[p.bond]) energyOut += BondData[p.bond] * parseFloat(p.count);
                });

                const deltaH = energyIn - energyOut;
                setResult({ energyIn, energyOut, deltaH });
            };

            // Handlers
            const addRow = (type) => {
                const newItem = { id: Date.now(), bond: Object.keys(BondData)[0], count: 1 };
                if (type === 'reactants') setReactants([...reactants, newItem]);
                else setProducts([...products, newItem]);
            };
            
            const removeRow = (type, id) => {
                if (type === 'reactants' && reactants.length > 1) setReactants(reactants.filter(i => i.id !== id));
                else if (type === 'products' && products.length > 1) setProducts(products.filter(i => i.id !== id));
            };

            const updateRow = (type, id, field, value) => {
                const list = type === 'reactants' ? reactants : products;
                const newList = list.map(item => item.id === id ? { ...item, [field]: value } : item);
                if (type === 'reactants') setReactants(newList);
                else setProducts(newList);
            };

            const loadPreset = (preset) => {
                setReactants(preset.reactants.map((r, i) => ({ ...r, id: `r-${i}` })));
                setProducts(preset.products.map((p, i) => ({ ...p, id: `p-${i}` })));
                setResult(null);
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-7xl">
                    
                    {/* Header with Presets */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 pb-4 gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-pink-600 flex items-center gap-2">
                                <i data-lucide="link-2"></i> 鍵焓計算機
                            </h1>
                            <p className="text-slate-400 text-sm">Bond Enthalpy Calculator</p>
                        </div>
                        
                        {/* Presets in Header */}
                        <div className="flex gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm">
                            {Presets.map((p, idx) => (
                                <button 
                                    key={idx} 
                                    onClick={() => loadPreset(p)}
                                    className="px-4 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-800 rounded-lg transition-all"
                                >
                                    {p.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow items-start">
                        
                        {/* Left Column: Inputs (Stacked Vertically) */}
                        <div className="w-full lg:w-5/12 flex flex-col gap-6">
                            
                            {/* Reactants (Broken) - Red */}
                            <div className="bg-white p-6 rounded-3xl shadow-md border-l-8 border-red-400 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5 text-red-500 pointer-events-none">
                                    <i data-lucide="scissors" size={100}/>
                                </div>
                                <h3 className="text-sm font-bold text-red-500 uppercase mb-4 flex items-center gap-2">
                                    <i data-lucide="scissors" size={16}/> 斷裂鍵 (BONDS BROKEN) - 吸熱
                                </h3>
                                <div className="space-y-3 relative z-10">
                                    {reactants.map(item => (
                                        <div key={item.id} className="flex gap-2 items-center">
                                            <select 
                                                value={item.bond} 
                                                onChange={(e) => updateRow('reactants', item.id, 'bond', e.target.value)}
                                                className="w-full p-3 bg-slate-50 border rounded-xl text-sm font-mono font-bold bond-select focus:ring-2 focus:ring-red-200 outline-none"
                                            >
                                                {Object.keys(BondData).map(b => <option key={b} value={b}>{b}</option>)}
                                            </select>
                                            <input 
                                                type="number" 
                                                value={item.count} 
                                                onChange={(e) => updateRow('reactants', item.id, 'count', e.target.value)}
                                                className="w-20 p-3 bg-slate-50 border rounded-xl text-sm text-center font-bold focus:ring-2 focus:ring-red-200 outline-none"
                                                min="1"
                                            />
                                            <button onClick={() => removeRow('reactants', item.id)} className="text-slate-300 hover:text-red-500 p-1"><i data-lucide="x" size={18}/></button>
                                        </div>
                                    ))}
                                    <button onClick={() => addRow('reactants')} className="w-full py-2 border-2 border-dashed border-slate-200 text-slate-400 rounded-xl hover:border-red-300 hover:text-red-500 text-xs font-bold transition-all mt-2">+ 增加鍵</button>
                                </div>
                            </div>

                            {/* Products (Formed) - Green */}
                            <div className="bg-white p-6 rounded-3xl shadow-md border-l-8 border-green-400 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5 text-green-500 pointer-events-none">
                                    <i data-lucide="link" size={100}/>
                                </div>
                                <h3 className="text-sm font-bold text-green-500 uppercase mb-4 flex items-center gap-2">
                                    <i data-lucide="link" size={16}/> 形成鍵 (BONDS FORMED) - 放熱
                                </h3>
                                <div className="space-y-3 relative z-10">
                                    {products.map(item => (
                                        <div key={item.id} className="flex gap-2 items-center">
                                            <select 
                                                value={item.bond} 
                                                onChange={(e) => updateRow('products', item.id, 'bond', e.target.value)}
                                                className="w-full p-3 bg-slate-50 border rounded-xl text-sm font-mono font-bold bond-select focus:ring-2 focus:ring-green-200 outline-none"
                                            >
                                                {Object.keys(BondData).map(b => <option key={b} value={b}>{b}</option>)}
                                            </select>
                                            <input 
                                                type="number" 
                                                value={item.count} 
                                                onChange={(e) => updateRow('products', item.id, 'count', e.target.value)}
                                                className="w-20 p-3 bg-slate-50 border rounded-xl text-sm text-center font-bold focus:ring-2 focus:ring-green-200 outline-none"
                                                min="1"
                                            />
                                            <button onClick={() => removeRow('products', item.id)} className="text-slate-300 hover:text-green-500 p-1"><i data-lucide="x" size={18}/></button>
                                        </div>
                                    ))}
                                    <button onClick={() => addRow('products')} className="w-full py-2 border-2 border-dashed border-slate-200 text-slate-400 rounded-xl hover:border-green-300 hover:text-green-500 text-xs font-bold transition-all mt-2">+ 增加鍵</button>
                                </div>
                            </div>

                            <button 
                                onClick={calculate}
                                className="w-full py-4 bg-pink-600 text-white rounded-2xl font-bold shadow-lg hover:bg-pink-500 transition-all text-lg flex items-center justify-center gap-2 active:scale-95 shadow-pink-200"
                            >
                                計算 ΔH (Calculate)
                            </button>

                        </div>

                        {/* Right Column: Results & Diagram */}
                        <div className="w-full lg:w-7/12 flex flex-col gap-6">
                            
                            {result ? (
                                <div className="h-full flex flex-col animate-in slide-in-from-right duration-500 gap-6">
                                    
                                    {/* Dark Result Card */}
                                    <div className="bg-slate-800 text-white p-10 rounded-3xl shadow-xl text-center relative overflow-hidden border border-slate-700">
                                        <div className="relative z-10">
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Enthalpy Change (ΔH)</div>
                                            <div className={`text-8xl font-mono font-black tracking-tighter ${result.deltaH < 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                {result.deltaH > 0 ? '+' : ''}{result.deltaH}
                                            </div>
                                            <div className="text-xl mt-2 font-bold opacity-60">kJ mol⁻¹</div>
                                            <div className={`mt-6 inline-block px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wide ${result.deltaH < 0 ? 'bg-green-500/20 text-green-300 border border-green-500/50' : 'bg-red-500/20 text-red-300 border border-red-500/50'}`}>
                                                {result.deltaH < 0 ? '放熱反應 (EXOTHERMIC)' : '吸熱反應 (ENDOTHERMIC)'}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Energy Diagram */}
                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex-grow flex flex-col justify-center items-center min-h-[400px]">
                                        <div className="w-full max-w-lg h-80 relative border-l-2 border-b-2 border-slate-300">
                                            <div className="absolute top-[-10px] left-2 text-[10px] text-slate-400 font-bold uppercase">Energy (H)</div>
                                            
                                            {/* Reactants Level (Fixed at 50%) */}
                                            <div className="absolute left-4 top-[50%] w-24 border-b-4 border-slate-700"></div>
                                            <div className="absolute left-4 top-[42%] text-xs font-bold text-slate-600">Reactants</div>

                                            {/* Gaseous Atoms (Max Energy) */}
                                            <div className="absolute left-1/2 -translate-x-1/2 top-[10%] w-32 border-b-2 border-dashed border-slate-300"></div>
                                            <div className="absolute left-1/2 -translate-x-1/2 top-0 text-[10px] text-slate-400 text-center leading-tight">Gaseous Atoms<br/><span className="text-[8px]">(Max Energy)</span></div>

                                            {/* Products Level */}
                                            <div className="absolute right-4 w-24 border-b-4 border-slate-700 transition-all duration-1000"
                                                 style={{ top: result.deltaH < 0 ? '80%' : '20%' }}></div>
                                            <div className="absolute right-4 text-xs font-bold text-slate-600 transition-all duration-1000"
                                                 style={{ top: result.deltaH < 0 ? '72%' : '12%' }}>Products</div>

                                            {/* Arrow: Breaking (Up) */}
                                            <div className="absolute left-20 w-1 bg-red-400 arrow-up origin-bottom" 
                                                 style={{ bottom: '50%', height: '40%' }}></div>
                                            <div className="absolute left-24 top-[30%] text-sm text-red-500 font-bold">+{result.energyIn}</div>

                                            {/* Arrow: Forming (Down) */}
                                            <div className="absolute right-20 w-1 bg-green-500 arrow-down origin-top" 
                                                 style={{ top: '10%', height: result.deltaH < 0 ? '70%' : '20%' }}></div>
                                            <div className="absolute right-24 top-[15%] text-sm text-green-500 font-bold text-right" style={{transform: 'translateX(-100%)'}}>-{result.energyOut}</div>

                                            {/* Delta H Arrow */}
                                            <div className={`absolute right-32 w-1 transition-all duration-1000 ${result.deltaH < 0 ? 'bg-green-600' : 'bg-red-600'}`} 
                                                 style={{ 
                                                     top: result.deltaH < 0 ? '50%' : '30%', 
                                                     height: result.deltaH < 0 ? '30%' : '20%',
                                                 }}></div>
                                            <div className="absolute right-36 text-blue-600 font-bold text-lg transition-all duration-1000"
                                                 style={{ top: result.deltaH < 0 ? '60%' : '35%' }}>ΔH</div>
                                        </div>
                                    </div>

                                    {/* Formula Display */}
                                    <div className="bg-slate-100 p-6 rounded-2xl text-center font-mono text-sm text-slate-600">
                                        <p className="mb-2 font-sans font-bold text-slate-400 uppercase text-xs">Calculation</p>
                                        ΔH = Σ(Bond Breaking) - Σ(Bond Forming)<br/>
                                        = <span className="text-red-500">{result.energyIn}</span> - <span className="text-green-500">{result.energyOut}</span> = <strong>{result.deltaH}</strong>
                                    </div>

                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col items-center justify-center text-slate-400 border-4 border-dashed border-slate-200 rounded-3xl bg-slate-50/30 p-12 min-h-[500px]">
                                    <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-6 shadow-sm">
                                        <i data-lucide="bar-chart-2" size={48} className="text-slate-300" />
                                    </div>
                                    <p className="text-2xl text-center font-bold mb-2 text-slate-500">等待計算...</p>
                                    <p className="text-sm text-center opacity-60">請在左側輸入鍵的數量以計算焓變。</p>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic VIII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
