<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鍵焓計算機 (Bond Enthalpy Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        .bond-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }

        /* Energy Diagram Animations */
        @keyframes grow-up { from { height: 0; } to { height: var(--h); } }
        @keyframes grow-down { from { height: 0; } to { height: var(--h); } }
        .arrow-up { animation: grow-up 1s ease-out forwards; }
        .arrow-down { animation: grow-down 1s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Bond Enthalpy Data (kJ/mol) - Simplified DSE Values
        const BondData = {
            'C-H': 413, 'C-C': 347, 'C=C': 612, 'C-O': 358, 'C=O': 799, // C=O in CO2 is 799 (DSE)
            'O=O': 498, 'O-H': 464, 'H-H': 436, 'H-Cl': 432, 'Cl-Cl': 243,
            'N-H': 391, 'N≡N': 945, 'C-Cl': 327, 'H-Br': 366, 'Br-Br': 193, 'H-I': 299, 'I-I': 151
        };

        // Presets
        const Presets = [
            {
                name: '甲烷燃燒',
                desc: 'CH₄ + 2O₂ → CO₂ + 2H₂O',
                reactants: [ { bond: 'C-H', count: 4 }, { bond: 'O=O', count: 2 } ],
                products: [ { bond: 'C=O', count: 2 }, { bond: 'O-H', count: 4 } ]
            },
            {
                name: '乙烯氫化',
                desc: 'C₂H₄ + H₂ → C₂H₆',
                reactants: [ { bond: 'C=C', count: 1 }, { bond: 'C-H', count: 4 }, { bond: 'H-H', count: 1 } ],
                products: [ { bond: 'C-C', count: 1 }, { bond: 'C-H', count: 6 } ]
            },
            {
                name: '氫氣燃燒',
                desc: '2H₂ + O₂ → 2H₂O',
                reactants: [ { bond: 'H-H', count: 2 }, { bond: 'O=O', count: 1 } ],
                products: [ { bond: 'O-H', count: 4 } ]
            }
        ];

        const App = () => {
            const [reactants, setReactants] = useState([{ id: 1, bond: 'C-H', count: 1 }]);
            const [products, setProducts] = useState([{ id: 1, bond: 'C=O', count: 1 }]);
            const [result, setResult] = useState(null);
            
            // Calculate
            const calculate = () => {
                let energyIn = 0;
                let energyOut = 0;

                reactants.forEach(r => {
                    if (r.bond && BondData[r.bond]) energyIn += BondData[r.bond] * parseFloat(r.count);
                });

                products.forEach(p => {
                    if (p.bond && BondData[p.bond]) energyOut += BondData[p.bond] * parseFloat(p.count);
                });

                const deltaH = energyIn - energyOut;
                setResult({ energyIn, energyOut, deltaH });
            };

            // Handlers
            const addRow = (type) => {
                const newItem = { id: Date.now(), bond: Object.keys(BondData)[0], count: 1 };
                if (type === 'reactants') setReactants([...reactants, newItem]);
                else setProducts([...products, newItem]);
            };
            
            const removeRow = (type, id) => {
                if (type === 'reactants' && reactants.length > 1) setReactants(reactants.filter(i => i.id !== id));
                else if (type === 'products' && products.length > 1) setProducts(products.filter(i => i.id !== id));
            };

            const updateRow = (type, id, field, value) => {
                const list = type === 'reactants' ? reactants : products;
                const newList = list.map(item => item.id === id ? { ...item, [field]: value } : item);
                if (type === 'reactants') setReactants(newList);
                else setProducts(newList);
            };

            const loadPreset = (preset) => {
                setReactants(preset.reactants.map((r, i) => ({ ...r, id: `r-${i}` })));
                setProducts(preset.products.map((p, i) => ({ ...p, id: `p-${i}` })));
                setResult(null); // Reset result to force user to click calculate
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-7xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-pink-600 flex items-center gap-2">
                                <i data-lucide="link-2"></i> 鍵焓計算機
                            </h1>
                            <p className="text-slate-400 text-sm">Bond Enthalpy Calculator</p>
                        </div>
                    </div>

                    {/* Presets (Centered) */}
                    <div className="flex justify-center mb-8">
                        <div className="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex gap-3 flex-wrap justify-center">
                            {Presets.map((p, idx) => (
                                <button 
                                    key={idx} 
                                    onClick={() => loadPreset(p)}
                                    className="px-4 py-2 text-sm font-bold text-slate-600 bg-slate-50 hover:bg-pink-50 hover:text-pink-600 border border-slate-200 hover:border-pink-200 rounded-lg transition-all shadow-sm"
                                    title={p.desc}
                                >
                                    {p.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow items-start">
                        
                        {/* Left Column: Inputs (Horizontal Arrangement) */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            {/* Input Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                
                                {/* Reactants (Broken) */}
                                <div className="bg-white p-5 rounded-2xl shadow-md border-t-4 border-red-400 h-full flex flex-col">
                                    <h3 className="text-sm font-bold text-red-500 uppercase mb-4 flex items-center gap-2">
                                        <i data-lucide="scissors" size={16}/> 斷裂鍵 (Absorb)
                                    </h3>
                                    <div className="space-y-3 flex-grow">
                                        {reactants.map(item => (
                                            <div key={item.id} className="flex gap-2 items-center">
                                                <select 
                                                    value={item.bond} 
                                                    onChange={(e) => updateRow('reactants', item.id, 'bond', e.target.value)}
                                                    className="w-full p-2 bg-slate-50 border rounded-lg text-sm font-mono font-bold bond-select focus:ring-2 focus:ring-red-200 outline-none"
                                                >
                                                    {Object.keys(BondData).map(b => <option key={b} value={b}>{b}</option>)}
                                                </select>
                                                <input 
                                                    type="number" 
                                                    value={item.count} 
                                                    onChange={(e) => updateRow('reactants', item.id, 'count', e.target.value)}
                                                    className="w-16 p-2 bg-slate-50 border rounded-lg text-sm text-center font-bold focus:ring-2 focus:ring-red-200 outline-none"
                                                    min="1"
                                                />
                                                <button onClick={() => removeRow('reactants', item.id)} className="text-slate-300 hover:text-red-500"><i data-lucide="x" size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => addRow('reactants')} className="mt-4 w-full py-2 border-2 border-dashed border-slate-200 text-slate-400 rounded-lg hover:border-red-200 hover:text-red-500 text-xs font-bold transition-all">+ 增加</button>
                                </div>

                                {/* Products (Formed) */}
                                <div className="bg-white p-5 rounded-2xl shadow-md border-t-4 border-green-400 h-full flex flex-col">
                                    <h3 className="text-sm font-bold text-green-500 uppercase mb-4 flex items-center gap-2">
                                        <i data-lucide="link" size={16}/> 形成鍵 (Release)
                                    </h3>
                                    <div className="space-y-3 flex-grow">
                                        {products.map(item => (
                                            <div key={item.id} className="flex gap-2 items-center">
                                                <select 
                                                    value={item.bond} 
                                                    onChange={(e) => updateRow('products', item.id, 'bond', e.target.value)}
                                                    className="w-full p-2 bg-slate-50 border rounded-lg text-sm font-mono font-bold bond-select focus:ring-2 focus:ring-green-200 outline-none"
                                                >
                                                    {Object.keys(BondData).map(b => <option key={b} value={b}>{b}</option>)}
                                                </select>
                                                <input 
                                                    type="number" 
                                                    value={item.count} 
                                                    onChange={(e) => updateRow('products', item.id, 'count', e.target.value)}
                                                    className="w-16 p-2 bg-slate-50 border rounded-lg text-sm text-center font-bold focus:ring-2 focus:ring-green-200 outline-none"
                                                    min="1"
                                                />
                                                <button onClick={() => removeRow('products', item.id)} className="text-slate-300 hover:text-green-500"><i data-lucide="x" size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => addRow('products')} className="mt-4 w-full py-2 border-2 border-dashed border-slate-200 text-slate-400 rounded-lg hover:border-green-200 hover:text-green-500 text-xs font-bold transition-all">+ 增加</button>
                                </div>

                            </div>

                            <button 
                                onClick={calculate}
                                className="w-full py-4 bg-pink-600 text-white rounded-xl font-bold shadow-lg hover:bg-pink-500 transition-all text-lg flex items-center justify-center gap-2 active:scale-95"
                            >
                                <i data-lucide="calculator" /> 計算 ΔH
                            </button>

                        </div>

                        {/* Right Column: Results (Card & Diagram) */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            {result ? (
                                <div className="h-full flex flex-col animate-in slide-in-from-right duration-500 gap-6">
                                    
                                    {/* Result Card */}
                                    <div className="bg-slate-800 text-white p-8 rounded-3xl shadow-lg text-center relative overflow-hidden border border-slate-700">
                                        <div className="relative z-10">
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Enthalpy Change (ΔH)</div>
                                            <div className={`text-7xl font-mono font-black tracking-tighter ${result.deltaH < 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                {result.deltaH > 0 ? '+' : ''}{result.deltaH}
                                            </div>
                                            <div className="text-lg mt-2 font-bold opacity-80">kJ mol⁻¹</div>
                                            <div className={`mt-4 inline-block px-4 py-1 rounded-full text-xs font-bold uppercase ${result.deltaH < 0 ? 'bg-green-900/50 text-green-300 border border-green-700' : 'bg-red-900/50 text-red-300 border border-red-700'}`}>
                                                {result.deltaH < 0 ? '放熱反應 (Exothermic)' : '吸熱反應 (Endothermic)'}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Energy Diagram */}
                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex-grow flex flex-col justify-center items-center min-h-[350px]">
                                        <div className="w-full max-w-md h-64 relative border-l-2 border-b-2 border-slate-300">
                                            <div className="absolute top-[-10px] left-2 text-[10px] text-slate-400 font-bold uppercase">Energy</div>
                                            
                                            {/* Reactants Level (Fixed at 50%) */}
                                            <div className="absolute left-4 top-[50%] w-20 border-b-4 border-slate-700"></div>
                                            <div className="absolute left-4 top-[42%] text-xs font-bold text-slate-600">Reactants</div>
                                            <div className="absolute left-28 top-[52%] text-[10px] text-slate-400 transform -translate-y-1/2">H = 0 (Relative)</div>

                                            {/* Gaseous Atoms (Max Energy) */}
                                            {/* Height depends on energyIn scale, let's just fix visual proportion */}
                                            <div className="absolute left-1/2 -translate-x-1/2 top-[10%] w-24 border-b-2 border-dashed border-slate-300"></div>
                                            <div className="absolute left-1/2 -translate-x-1/2 top-0 text-[10px] text-slate-400 text-center leading-tight">Gaseous Atoms<br/>(Bond Breaking)</div>

                                            {/* Products Level */}
                                            {/* If Exo (dH < 0), lower than reactants (e.g. 80%). If Endo, higher (e.g. 30%) */}
                                            <div className="absolute right-4 w-20 border-b-4 border-slate-700 transition-all duration-1000"
                                                 style={{ top: result.deltaH < 0 ? '80%' : '30%' }}></div>
                                            <div className="absolute right-4 text-xs font-bold text-slate-600 transition-all duration-1000"
                                                 style={{ top: result.deltaH < 0 ? '72%' : '22%' }}>Products</div>

                                            {/* Arrow: Breaking (Up) */}
                                            <div className="absolute left-16 w-1 bg-red-400 arrow-up origin-bottom" 
                                                 style={{ bottom: '50%', height: '40%' }}></div>
                                            <div className="absolute left-18 top-[30%] text-xs text-red-500 font-bold">+{result.energyIn}</div>

                                            {/* Arrow: Forming (Down) */}
                                            <div className="absolute right-16 w-1 bg-green-500 arrow-down origin-top" 
                                                 style={{ top: '10%', height: result.deltaH < 0 ? '70%' : '20%' }}></div>
                                            <div className="absolute right-18 top-[15%] text-xs text-green-500 font-bold text-right" style={{transform: 'translateX(-100%)'}}>-{result.energyOut}</div>

                                            {/* Delta H Arrow */}
                                            <div className={`absolute right-28 w-1 transition-all duration-1000 ${result.deltaH < 0 ? 'bg-green-600' : 'bg-red-600'}`} 
                                                 style={{ 
                                                     top: result.deltaH < 0 ? '50%' : '30%', 
                                                     height: result.deltaH < 0 ? '30%' : '20%',
                                                 }}></div>
                                            <div className="absolute right-32 text-blue-600 font-bold text-sm transition-all duration-1000"
                                                 style={{ top: result.deltaH < 0 ? '65%' : '40%' }}>ΔH</div>
                                        </div>

                                        <div className="mt-8 text-center bg-slate-50 p-3 rounded-lg w-full text-sm font-mono text-slate-600 border border-slate-100">
                                            ΔH = Σ(Bond Breaking) - Σ(Bond Forming)<br/>
                                            = {result.energyIn} - {result.energyOut} = <strong>{result.deltaH}</strong>
                                        </div>
                                    </div>

                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 border-4 border-dashed border-slate-100 rounded-3xl bg-slate-50/50 p-12">
                                    <i data-lucide="bar-chart-2" size={64} className="mb-6 opacity-20" />
                                    <p className="text-xl text-center font-medium mb-2">等待計算...</p>
                                    <p className="text-sm text-center opacity-70">請在左側輸入鍵的數量以計算焓變。</p>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic VIII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
