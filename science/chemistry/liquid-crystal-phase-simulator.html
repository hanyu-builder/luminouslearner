<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Crystal Phase Simulator - Basic</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        canvas { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- PHASE DATA ---
        const PHASES = {
            solid: { name: 'Solid Crystal', color: 'text-blue-400', desc: 'Fixed positions, fixed orientation.' },
            smectic: { name: 'Smectic LC', color: 'text-emerald-400', desc: 'Layers form. Molecules slide in layers.' },
            nematic: { name: 'Nematic LC', color: 'text-yellow-400', desc: 'No layers. Random position, fixed orientation.' },
            liquid: { name: 'Isotropic Liquid', color: 'text-red-400', desc: 'Random position, random orientation.' }
        };

        const MOLECULE_COUNT = 200;

        // --- 3D SCENE COMPONENT ---
        const Scene3D = ({ phase }) => {
            const mountRef = useRef(null);
            const phaseRef = useRef(phase);

            useEffect(() => {
                phaseRef.current = phase;
            }, [phase]);

            useEffect(() => {
                if (!mountRef.current) return;

                // 1. Setup
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;
                
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617); // Deep dark blue

                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
                camera.position.set(15, 12, 20);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                mountRef.current.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.5;

                // 2. Helpers & Lights
                // Grid
                const gridHelper = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
                gridHelper.position.y = -8;
                scene.add(gridHelper);

                // Axes
                const axesHelper = new THREE.AxesHelper(3);
                axesHelper.position.set(-8, -8, 8);
                scene.add(axesHelper);

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);

                // 3. Molecules
                // Use CylinderGeometry (Reliable)
                const geometry = new THREE.CylinderGeometry(0.2, 0.2, 1.5, 8);
                const material = new THREE.MeshPhysicalMaterial({ 
                    color: 0x22d3ee, // Cyan
                    metalness: 0.2, 
                    roughness: 0.2,
                    clearcoat: 1.0
                });

                const mesh = new THREE.InstancedMesh(geometry, material, MOLECULE_COUNT);
                scene.add(mesh);

                // Molecule Data
                const dummy = new THREE.Object3D();
                const molecules = [];
                
                // Initialize in grid for Solid
                let idx = 0;
                const dim = Math.ceil(Math.pow(MOLECULE_COUNT, 1/3));
                const spacing = 2.2;
                const offset = (dim * spacing) / 2;

                for (let x = 0; x < dim; x++) {
                    for (let y = 0; y < dim; y++) {
                        for (let z = 0; z < dim; z++) {
                            if (idx >= MOLECULE_COUNT) break;
                            molecules.push({
                                // Base lattice position
                                bx: x * spacing - offset,
                                by: y * spacing - offset,
                                bz: z * spacing - offset,
                                // Current position
                                x: x * spacing - offset,
                                y: y * spacing - offset,
                                z: z * spacing - offset,
                                // Velocities
                                vx: (Math.random()-0.5)*0.1,
                                vy: (Math.random()-0.5)*0.1,
                                vz: (Math.random()-0.5)*0.1,
                                // Rotations
                                rx: 0, ry: 0, rz: 0,
                                vrx: (Math.random()-0.5)*0.05,
                                vry: (Math.random()-0.5)*0.05,
                                vrz: (Math.random()-0.5)*0.05
                            });
                            idx++;
                        }
                    }
                }

                // 4. Animation Loop
                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    const currentP = phaseRef.current; // Read from ref
                    const bound = 8;

                    molecules.forEach((mol, i) => {
                        
                        // POSITION LOGIC
                        if (currentP === 'solid') {
                            // Snap to grid
                            mol.x += (mol.bx - mol.x) * 0.1;
                            mol.y += (mol.by - mol.y) * 0.1;
                            mol.z += (mol.bz - mol.z) * 0.1;
                        } else if (currentP === 'smectic') {
                            // Layers (Y fixed to grid steps, X/Z free)
                            const layerY = Math.round(mol.y / spacing) * spacing;
                            mol.y += (layerY - mol.y) * 0.1;
                            mol.x += mol.vx;
                            mol.z += mol.vz;
                        } else {
                            // Nematic / Liquid (Free move)
                            mol.x += mol.vx;
                            mol.y += mol.vy;
                            mol.z += mol.vz;
                        }

                        // Boundary wrap
                        if(mol.x > bound) mol.x -= 2*bound; if(mol.x < -bound) mol.x += 2*bound;
                        if(mol.y > bound) mol.y -= 2*bound; if(mol.y < -bound) mol.y += 2*bound;
                        if(mol.z > bound) mol.z -= 2*bound; if(mol.z < -bound) mol.z += 2*bound;

                        // ROTATION LOGIC
                        dummy.position.set(mol.x, mol.y, mol.z);

                        if (currentP === 'liquid') {
                            // Random rotation
                            mol.rx += mol.vrx;
                            mol.ry += mol.vry;
                            mol.rz += mol.vrz;
                            dummy.rotation.set(mol.rx, mol.ry, mol.rz);
                        } else {
                            // Ordered (Solid, Smectic, Nematic) -> Align Vertical
                            // Add tiny wobble for realism
                            dummy.rotation.set(
                                Math.sin(Date.now()*0.001 + i)*0.1, 
                                0, 
                                Math.cos(Date.now()*0.002 + i)*0.1
                            );
                        }

                        dummy.updateMatrix();
                        mesh.setMatrixAt(i, dummy.matrix);
                    });

                    mesh.instanceMatrix.needsUpdate = true;
                    controls.update();
                    renderer.render(scene, camera);
                };
                
                animate();

                // Resize Handler
                const handleResize = () => {
                    if (!mountRef.current) return;
                    const w = mountRef.current.clientWidth;
                    const h = mountRef.current.clientHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(frameId);
                    window.removeEventListener('resize', handleResize);
                    if (mountRef.current && renderer.domElement) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    geometry.dispose();
                    material.dispose();
                };
            }, []);

            return <div ref={mountRef} className="w-full h-full" />;
        };

        // --- UI APP ---
        const App = () => {
            const [phase, setPhase] = useState('solid');
            const currentInfo = PHASES[phase];

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="layers" className="text-emerald-400" /> Phase Simulator
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Liquid Crystal Basics</p>
                        </div>

                        <div className="p-6 space-y-6">
                            
                            {/* Info Card */}
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg">
                                <div className="text-xs font-bold text-slate-500 uppercase mb-2">Current Phase</div>
                                <div className={`text-2xl font-black mb-2 ${currentInfo.color}`}>
                                    {currentInfo.name}
                                </div>
                                <p className="text-sm text-slate-300 leading-relaxed">
                                    {currentInfo.desc}
                                </p>
                            </div>

                            {/* Buttons */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">Select Phase</label>
                                
                                <button 
                                    onClick={() => setPhase('solid')}
                                    className={`w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3
                                        ${phase === 'solid' ? 'bg-blue-900/30 border-blue-500 ring-1 ring-blue-500/50' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    <div className="w-3 h-3 rounded-full bg-blue-400"></div>
                                    <span className="font-bold text-sm">1. Solid Crystal</span>
                                </button>

                                <button 
                                    onClick={() => setPhase('smectic')}
                                    className={`w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3
                                        ${phase === 'smectic' ? 'bg-emerald-900/30 border-emerald-500 ring-1 ring-emerald-500/50' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    <div className="w-3 h-3 rounded-full bg-emerald-400"></div>
                                    <span className="font-bold text-sm">2. Smectic LC</span>
                                </button>

                                <button 
                                    onClick={() => setPhase('nematic')}
                                    className={`w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3
                                        ${phase === 'nematic' ? 'bg-yellow-900/30 border-yellow-500 ring-1 ring-yellow-500/50' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                                    <span className="font-bold text-sm">3. Nematic LC</span>
                                </button>

                                <button 
                                    onClick={() => setPhase('liquid')}
                                    className={`w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3
                                        ${phase === 'liquid' ? 'bg-red-900/30 border-red-500 ring-1 ring-red-500/50' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    <div className="w-3 h-3 rounded-full bg-red-400"></div>
                                    <span className="font-bold text-sm">4. Isotropic Liquid</span>
                                </button>
                            </div>

                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 relative bg-[#020617] overflow-hidden">
                        
                        {/* Use key to force re-render on hard refresh if needed, but here we use ref inside */}
                        <Scene3D phase={phase} />
                        
                        <div className="absolute bottom-6 right-6 text-slate-500 text-xs pointer-events-none select-none bg-black/40 backdrop-blur px-4 py-2 rounded-full border border-white/10">
                            Left Click: Rotate • Right Click: Pan • Scroll: Zoom
                        </div>

                        <div className="absolute top-6 left-6 pointer-events-none">
                            <div className="flex items-center gap-2">
                                <div className="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></div>
                                <span className="text-cyan-400 font-mono text-sm font-bold uppercase tracking-widest">Live View</span>
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
