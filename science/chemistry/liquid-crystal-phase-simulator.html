<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Crystal Phase Simulator - Robust</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        canvas { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Safe Icon Component
        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        try {
                            const svgElement = window.lucide.createElement(iconData);
                            svgElement.setAttribute('class', className);
                            svgElement.setAttribute('width', size);
                            svgElement.setAttribute('height', size);
                            setSvgHtml(svgElement.outerHTML);
                        } catch (e) {}
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- PHASE DATA ---
        const PHASES = {
            solid: { name: 'Solid Crystal', color: 'text-blue-400', desc: 'Fixed positions, fixed orientation.' },
            smectic: { name: 'Smectic LC', color: 'text-emerald-400', desc: 'Layers form. Molecules slide in layers.' },
            nematic: { name: 'Nematic LC', color: 'text-yellow-400', desc: 'No layers. Random position, fixed orientation.' },
            liquid: { name: 'Isotropic Liquid', color: 'text-red-400', desc: 'Random position, random orientation.' }
        };

        const MOLECULE_COUNT = 200;

        // --- 3D SCENE COMPONENT ---
        const Scene3D = ({ phase }) => {
            const mountRef = useRef(null);
            const phaseRef = useRef(phase);

            // Sync ref
            useEffect(() => {
                phaseRef.current = phase;
            }, [phase]);

            useEffect(() => {
                const container = mountRef.current;
                if (!container) return;

                // 1. Init Scene
                const width = container.clientWidth || window.innerWidth;
                const height = container.clientHeight || window.innerHeight;
                
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617); // Dark Blue

                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
                camera.position.set(15, 15, 20);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance
                container.appendChild(renderer.domElement);

                // Controls
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.0;

                // 2. Visual Helpers (To ensure scene is rendering)
                const gridHelper = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
                gridHelper.position.y = -7;
                scene.add(gridHelper);

                const axesHelper = new THREE.AxesHelper(2); // X=Red, Y=Green, Z=Blue
                axesHelper.position.set(-8, -7, 8);
                scene.add(axesHelper);

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);

                // 3. Molecules
                // Using Standard Material for better visibility
                const geometry = new THREE.CylinderGeometry(0.25, 0.25, 1.5, 8);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x22d3ee, // Bright Cyan
                    roughness: 0.3,
                    metalness: 0.2
                });

                const mesh = new THREE.InstancedMesh(geometry, material, MOLECULE_COUNT);
                scene.add(mesh);

                // Data
                const dummy = new THREE.Object3D();
                const molecules = [];
                
                let idx = 0;
                const dim = Math.ceil(Math.pow(MOLECULE_COUNT, 1/3));
                const spacing = 2.2;
                const offset = (dim * spacing) / 2;

                for (let x = 0; x < dim; x++) {
                    for (let y = 0; y < dim; y++) {
                        for (let z = 0; z < dim; z++) {
                            if (idx >= MOLECULE_COUNT) break;
                            molecules.push({
                                bx: x * spacing - offset,
                                by: y * spacing - offset,
                                bz: z * spacing - offset,
                                x: x * spacing - offset,
                                y: y * spacing - offset,
                                z: z * spacing - offset,
                                vx: (Math.random()-0.5)*0.1,
                                vy: (Math.random()-0.5)*0.1,
                                vz: (Math.random()-0.5)*0.1,
                                rx: 0, ry: 0, rz: 0,
                                vrx: (Math.random()-0.5)*0.05,
                                vry: (Math.random()-0.5)*0.05,
                                vrz: (Math.random()-0.5)*0.05
                            });
                            idx++;
                        }
                    }
                }

                // 4. Loop
                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    const currentP = phaseRef.current;
                    const bound = 8;

                    molecules.forEach((mol, i) => {
                        // POS
                        if (currentP === 'solid') {
                            mol.x += (mol.bx - mol.x) * 0.1;
                            mol.y += (mol.by - mol.y) * 0.1;
                            mol.z += (mol.bz - mol.z) * 0.1;
                        } else if (currentP === 'smectic') {
                            const layerY = Math.round(mol.y / spacing) * spacing;
                            mol.y += (layerY - mol.y) * 0.1;
                            mol.x += mol.vx;
                            mol.z += mol.vz;
                        } else {
                            mol.x += mol.vx;
                            mol.y += mol.vy;
                            mol.z += mol.vz;
                        }

                        // Wrap
                        if(mol.x > bound) mol.x -= 2*bound; if(mol.x < -bound) mol.x += 2*bound;
                        if(mol.y > bound) mol.y -= 2*bound; if(mol.y < -bound) mol.y += 2*bound;
                        if(mol.z > bound) mol.z -= 2*bound; if(mol.z < -bound) mol.z += 2*bound;

                        // ROT
                        dummy.position.set(mol.x, mol.y, mol.z);
                        if (currentP === 'liquid') {
                            mol.rx += mol.vrx;
                            mol.ry += mol.vry;
                            mol.rz += mol.vrz;
                            dummy.rotation.set(mol.rx, mol.ry, mol.rz);
                        } else {
                            dummy.rotation.set(Math.sin(Date.now()*0.001 + i)*0.1, 0, Math.cos(Date.now()*0.002 + i)*0.1);
                        }

                        dummy.updateMatrix();
                        mesh.setMatrixAt(i, dummy.matrix);
                    });

                    mesh.instanceMatrix.needsUpdate = true;
                    controls.update();
                    renderer.render(scene, camera);
                };
                
                animate();

                // Resize Listener
                const handleResize = () => {
                    if (!container) return;
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    if (w && h) {
                        camera.aspect = w / h;
                        camera.updateProjectionMatrix();
                        renderer.setSize(w, h);
                    }
                };
                window.addEventListener('resize', handleResize);

                // Cleanup
                return () => {
                    cancelAnimationFrame(frameId);
                    window.removeEventListener('resize', handleResize);
                    if (container && renderer.domElement) {
                        container.removeChild(renderer.domElement);
                    }
                    geometry.dispose();
                    material.dispose();
                };
            }, []);

            return <div ref={mountRef} className="w-full h-full" />;
        };

        // --- UI APP ---
        const App = () => {
            const [phase, setPhase] = useState('solid');
            const currentInfo = PHASES[phase];

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800 shrink-0">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="layers" className="text-emerald-400" /> Phase Simulator
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Liquid Crystal Basics</p>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto">
                            
                            {/* Info Card */}
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg mb-6">
                                <div className="text-xs font-bold text-slate-500 uppercase mb-2">Current Phase</div>
                                <div className={`text-2xl font-black mb-2 ${currentInfo.color}`}>
                                    {currentInfo.name}
                                </div>
                                <p className="text-sm text-slate-300 leading-relaxed">
                                    {currentInfo.desc}
                                </p>
                            </div>

                            {/* Buttons */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">Select Phase</label>
                                {Object.entries(PHASES).map(([key, p]) => (
                                    <button 
                                        key={key}
                                        onClick={() => setPhase(key)}
                                        className={`w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3
                                            ${phase === key 
                                                ? 'bg-slate-800 border-white/30 ring-1 ring-white/20 shadow-lg' 
                                                : 'bg-slate-900 border-slate-800 hover:bg-slate-800 hover:border-slate-700'}
                                        `}
                                    >
                                        <div className={`w-3 h-3 rounded-full ${p.color.replace('text-', 'bg-')}`}></div>
                                        <span className="font-bold text-sm">{p.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 relative bg-[#020617] overflow-hidden flex flex-col">
                        
                        <div className="flex-1 relative">
                            <Scene3D phase={phase} />
                            
                            <div className="absolute bottom-6 right-6 text-slate-500 text-xs pointer-events-none select-none bg-black/40 backdrop-blur px-4 py-2 rounded-full border border-white/10">
                                Left Click: Rotate • Right Click: Pan • Scroll: Zoom
                            </div>

                            <div className="absolute top-6 left-6 pointer-events-none">
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></div>
                                    <span className="text-cyan-400 font-mono text-sm font-bold uppercase tracking-widest">Live View</span>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
