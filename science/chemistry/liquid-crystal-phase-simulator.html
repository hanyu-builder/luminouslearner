<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Crystal Phase Simulator</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Extended Three.js Geometry (For CapsuleGeometry if r128 doesn't support it natively, but r128 usually does not. 
         CapsuleGeometry was added in r137. We will use a fallback or polyfill) -->
         
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        canvas { outline: none; }
        
        /* Slider Styling */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; 
            background: #38bdf8; cursor: pointer; margin-top: -8px; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- SIMULATION CONFIG ---
        const MOLECULE_COUNT = 300;
        
        // Phase definitions (Temperature Ranges)
        const PHASES = [
            { name: 'Solid Crystal', temp: 0, color: 'text-blue-400', desc: 'Highly ordered position and orientation.' },
            { name: 'Smectic LC', temp: 30, color: 'text-emerald-400', desc: 'Layers form. Orientation ordered, position ordered in layers.' },
            { name: 'Nematic LC', temp: 60, color: 'text-yellow-400', desc: 'No layers. Orientation ordered, position random.' },
            { name: 'Isotropic Liquid', temp: 100, color: 'text-red-400', desc: 'Complete disorder in position and orientation.' }
        ];

        // --- 3D SCENE ---
        const LCSimulation = ({ temp, setPhaseName }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                if (!mountRef.current) return;

                // 1. Setup Scene
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0F172A);
                // Add subtle fog for depth
                scene.fog = new THREE.FogExp2(0x0F172A, 0.02);

                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
                camera.position.set(15, 15, 25);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);
                mountRef.current.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.5;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(5, 10, 7);
                scene.add(dirLight);
                const pointLight = new THREE.PointLight(0x38bdf8, 0.5); // Blue glow
                pointLight.position.set(0, 0, 0);
                scene.add(pointLight);

                // 2. Create Molecules (InstancedMesh for performance)
                // FALLBACK: CylinderGeometry for older Three.js versions (r128)
                // CapsuleGeometry was introduced in r137.
                const geometry = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8); 
                // Add caps to simulate capsule if needed, or just use cylinders which are fine for rod-like LC molecules.
                
                const material = new THREE.MeshPhysicalMaterial({ 
                    color: 0x38bdf8, 
                    metalness: 0.2, 
                    roughness: 0.2,
                    clearcoat: 1.0,
                    transparent: true,
                    opacity: 0.9
                });

                const mesh = new THREE.InstancedMesh(geometry, material, MOLECULE_COUNT);
                scene.add(mesh);

                // Initialize Molecule State
                const dummy = new THREE.Object3D();
                const molecules = [];

                // Generate grid positions for initial solid state
                let idx = 0;
                const dim = Math.ceil(Math.pow(MOLECULE_COUNT, 1/3));
                const spacing = 2.5;
                const offset = (dim * spacing) / 2;

                for (let x = 0; x < dim; x++) {
                    for (let y = 0; y < dim; y++) {
                        for (let z = 0; z < dim; z++) {
                            if (idx >= MOLECULE_COUNT) break;
                            
                            molecules.push({
                                // Target Position (for solid/smectic layers)
                                baseX: x * spacing - offset,
                                baseY: y * spacing - offset, // Y is the vertical stacking axis
                                baseZ: z * spacing - offset,
                                
                                // Current State
                                x: x * spacing - offset,
                                y: y * spacing - offset,
                                z: z * spacing - offset,
                                
                                // Orientation (Euler Angles for simplicity in simulation step)
                                rotX: 0, rotY: 0, rotZ: 0,
                                
                                // Velocities (for liquid movement)
                                vx: (Math.random()-0.5)*0.1,
                                vy: (Math.random()-0.5)*0.1,
                                vz: (Math.random()-0.5)*0.1,
                                vrx: (Math.random()-0.5)*0.05,
                                vry: (Math.random()-0.5)*0.05,
                                vrz: (Math.random()-0.5)*0.05
                            });
                            idx++;
                        }
                    }
                }
                
                // Animation Loop
                let frameId;

                const animate = () => {
                    frameId = requestAnimationFrame(animate);

                    // Determine current temperature factor (0 to 1)
                    const t = temp; // Accessing from closure scope is tricky with useEffect dependency
                    // Note: In this specific useEffect structure, 'temp' is constant from the render cycle.
                    // To make it reactive without re-creating scene, we'd need a ref.
                    // BUT, since we are re-creating the scene on temp change might be heavy, 
                    // let's fix the dependency issue.
                    // BETTER APPROACH: Use a ref for temp so we don't re-init scene.
                };
                
                // Re-write the animation logic to use Ref for temp to avoid re-creating scene constantly
            }, []); // Empty dependency to run once

            // --- RE-IMPLEMENTATION WITH REFS FOR PERFORMANCE ---
            // We need a separate effect to update the simulation loop with new temp without destroying the scene.
            
            return <LCSimulationInner temp={temp} />;
        };

        // Inner component to handle Three.js logic properly
        const LCSimulationInner = ({ temp }) => {
            const mountRef = useRef(null);
            const tempRef = useRef(temp);
            
            // Update ref when prop changes
            useEffect(() => {
                tempRef.current = temp;
            }, [temp]);

            useEffect(() => {
                if (!mountRef.current) return;

                // 1. Setup Scene
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0F172A);
                scene.fog = new THREE.FogExp2(0x0F172A, 0.02);

                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
                camera.position.set(15, 15, 25);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);
                mountRef.current.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.5;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(5, 10, 7);
                scene.add(dirLight);
                const pointLight = new THREE.PointLight(0x38bdf8, 0.5);
                pointLight.position.set(0, 0, 0);
                scene.add(pointLight);

                // 2. Create Molecules
                // FIX: Use CylinderGeometry instead of CapsuleGeometry for compatibility with r128
                const geometry = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8);
                const material = new THREE.MeshPhysicalMaterial({ 
                    color: 0x38bdf8, 
                    metalness: 0.2, 
                    roughness: 0.2,
                    clearcoat: 1.0,
                    transparent: true,
                    opacity: 0.9
                });

                const mesh = new THREE.InstancedMesh(geometry, material, MOLECULE_COUNT);
                scene.add(mesh);

                // Init Data
                const dummy = new THREE.Object3D();
                const molecules = [];
                let idx = 0;
                const dim = Math.ceil(Math.pow(MOLECULE_COUNT, 1/3));
                const spacing = 2.5;
                const offset = (dim * spacing) / 2;

                for (let x = 0; x < dim; x++) {
                    for (let y = 0; y < dim; y++) {
                        for (let z = 0; z < dim; z++) {
                            if (idx >= MOLECULE_COUNT) break;
                            molecules.push({
                                baseX: x * spacing - offset,
                                baseY: y * spacing - offset,
                                baseZ: z * spacing - offset,
                                x: x * spacing - offset,
                                y: y * spacing - offset,
                                z: z * spacing - offset,
                                rotX: 0, rotY: 0, rotZ: 0,
                                vx: (Math.random()-0.5)*0.1,
                                vy: (Math.random()-0.5)*0.1,
                                vz: (Math.random()-0.5)*0.1,
                                vrx: (Math.random()-0.5)*0.05,
                                vry: (Math.random()-0.5)*0.05,
                                vrz: (Math.random()-0.5)*0.05
                            });
                            idx++;
                        }
                    }
                }

                // 3. Animation Loop
                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    const t = tempRef.current; // Read latest temp from ref

                    // Factors based on Temperature
                    const spacing = 2.5;
                    
                    molecules.forEach((mol, i) => {
                        // 1. Position Update
                        if (t < 20) {
                            // SOLID
                            mol.x += (mol.baseX - mol.x) * 0.1;
                            mol.y += (mol.baseY - mol.y) * 0.1;
                            mol.z += (mol.baseZ - mol.z) * 0.1;
                        } else if (t < 50) {
                            // SMECTIC
                            const layerY = Math.round(mol.y / spacing) * spacing;
                            mol.y += (layerY - mol.y) * 0.1;
                            mol.x += mol.vx * (t/20);
                            mol.z += mol.vz * (t/20);
                        } else {
                            // NEMATIC / LIQUID
                            mol.x += mol.vx * (t/30);
                            mol.y += mol.vy * (t/30);
                            mol.z += mol.vz * (t/30);
                        }

                        // Wrap
                        const B = 12;
                        if (mol.x > B) mol.x -= 2*B; if (mol.x < -B) mol.x += 2*B;
                        if (mol.y > B) mol.y -= 2*B; if (mol.y < -B) mol.y += 2*B;
                        if (mol.z > B) mol.z -= 2*B; if (mol.z < -B) mol.z += 2*B;

                        // 2. Orientation Update
                        dummy.position.set(mol.x, mol.y, mol.z);
                        
                        if (t < 80) {
                            // ORDERED
                            const wobble = (t / 100) * 0.5;
                            dummy.rotation.set(
                                Math.sin(i + Date.now()*0.001) * wobble, 
                                0, // Align Y roughly
                                Math.cos(i + Date.now()*0.002) * wobble
                            );
                        } else {
                            // LIQUID
                            mol.rotX += mol.vrx;
                            mol.rotY += mol.vry;
                            mol.rotZ += mol.vrz;
                            dummy.rotation.set(mol.rotX, mol.rotY, mol.rotZ);
                        }

                        dummy.updateMatrix();
                        mesh.setMatrixAt(i, dummy.matrix);
                    });

                    mesh.instanceMatrix.needsUpdate = true;
                    controls.update();
                    renderer.render(scene, camera);
                };
                
                animate();

                return () => {
                    cancelAnimationFrame(frameId);
                    if (mountRef.current && renderer.domElement) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    geometry.dispose();
                    material.dispose();
                };
            }, []); // Run once on mount

            return <div ref={mountRef} className="w-full h-full" />;
        };

        // --- MAIN APP ---
        const App = () => {
            const [temp, setTemp] = useState(0); // 0 to 100
            
            // Derived Phase
            let currentPhase = PHASES[0];
            if (temp > 20) currentPhase = PHASES[1];
            if (temp > 50) currentPhase = PHASES[2];
            if (temp > 85) currentPhase = PHASES[3];

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="layers" className="text-cyan-400" /> Phase Simulator
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Liquid Crystal States</p>
                        </div>

                        <div className="p-6 flex-1 overflow-y-auto">
                            
                            {/* Phase Indicator */}
                            <div className="bg-slate-800 rounded-2xl border border-slate-700 p-5 mb-8 shadow-lg">
                                <div className="text-xs text-slate-500 font-bold uppercase mb-2 tracking-wider">Current Phase</div>
                                <div className={`text-2xl font-black ${currentPhase.color} mb-2 transition-colors duration-500`}>
                                    {currentPhase.name}
                                </div>
                                <p className="text-sm text-slate-400 leading-relaxed">
                                    {currentPhase.desc}
                                </p>
                            </div>

                            {/* Temperature Control */}
                            <div className="space-y-4 mb-8">
                                <div className="flex justify-between items-center">
                                    <label className="text-xs font-bold text-red-400 uppercase tracking-wider flex items-center gap-2">
                                        <Icon name="thermometer" size={14}/> Temperature (Energy)
                                    </label>
                                </div>
                                <div className="relative h-12 flex items-center">
                                    <input 
                                        type="range" min="0" max="100" step="0.5"
                                        value={temp} 
                                        onChange={(e) => setTemp(parseFloat(e.target.value))}
                                        className="z-20 relative w-full"
                                    />
                                    {/* Track Background with Phase Colors */}
                                    <div className="absolute top-1/2 left-0 right-0 h-2 -mt-1 rounded-full overflow-hidden flex opacity-30 pointer-events-none">
                                        <div className="w-[20%] bg-blue-500"></div>
                                        <div className="w-[30%] bg-emerald-500"></div>
                                        <div className="w-[35%] bg-yellow-500"></div>
                                        <div className="w-[15%] bg-red-500"></div>
                                    </div>
                                </div>
                                <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                                    <span>Low T</span>
                                    <span>High T</span>
                                </div>
                            </div>

                            {/* Key Concepts */}
                            <div className="space-y-3">
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2">Observation Guide</h3>
                                
                                <div className={`p-3 rounded-xl border transition-all duration-500 ${currentPhase.name.includes('Solid') ? 'bg-blue-900/20 border-blue-500/50 opacity-100' : 'bg-slate-800/50 border-slate-700/50 opacity-50'}`}>
                                    <div className="text-xs font-bold text-blue-400 mb-1">1. Solid</div>
                                    <div className="text-[10px] text-slate-400">Perfect 3D lattice. Fixed position & orientation.</div>
                                </div>

                                <div className={`p-3 rounded-xl border transition-all duration-500 ${currentPhase.name.includes('Smectic') ? 'bg-emerald-900/20 border-emerald-500/50 opacity-100' : 'bg-slate-800/50 border-slate-700/50 opacity-50'}`}>
                                    <div className="text-xs font-bold text-emerald-400 mb-1">2. Smectic (Soap-like)</div>
                                    <div className="text-[10px] text-slate-400">Flows in layers. Molecules slide over each other but keep orientation.</div>
                                </div>

                                <div className={`p-3 rounded-xl border transition-all duration-500 ${currentPhase.name.includes('Nematic') ? 'bg-yellow-900/20 border-yellow-500/50 opacity-100' : 'bg-slate-800/50 border-slate-700/50 opacity-50'}`}>
                                    <div className="text-xs font-bold text-yellow-400 mb-1">3. Nematic (Thread-like)</div>
                                    <div className="text-[10px] text-slate-400">No layers. Molecules flow freely but point in same direction (Director). Used in LCDs.</div>
                                </div>

                                <div className={`p-3 rounded-xl border transition-all duration-500 ${currentPhase.name.includes('Liquid') ? 'bg-red-900/20 border-red-500/50 opacity-100' : 'bg-slate-800/50 border-slate-700/50 opacity-50'}`}>
                                    <div className="text-xs font-bold text-red-400 mb-1">4. Isotropic Liquid</div>
                                    <div className="text-[10px] text-slate-400">Chaos. No order in position or direction.</div>
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 relative bg-slate-950 overflow-hidden">
                        <LCSimulation temp={temp} />
                        
                        <div className="absolute bottom-6 right-6 text-slate-500 text-xs pointer-events-none select-none bg-black/20 backdrop-blur px-3 py-1 rounded-full">
                            Click & Drag to Rotate View • Scroll to Zoom
                        </div>

                        {/* Visual Hint Overlay */}
                        <div className="absolute top-6 left-6 pointer-events-none">
                            <div className="flex items-center gap-2">
                                <div className="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></div>
                                <span className="text-cyan-400 font-mono text-sm font-bold uppercase tracking-widest">Live Simulation</span>
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
