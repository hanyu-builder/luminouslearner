<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>異構物獵人 (Isomer Hunter)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .atom-btn { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .atom-btn:hover { transform: scale(1.1); }
        .atom-btn:active { transform: scale(0.95); }
        
        /* Found Animation */
        @keyframes pop-success {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop-success 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Game Data ---
        const Levels = {
            C4: { formula: 'C₄H₁₀', target: 4, isomers: ['Butane', '2-methylpropane'] },
            C5: { formula: 'C₅H₁₂', target: 5, isomers: ['Pentane', '2-methylbutane', '2,2-dimethylpropane'] },
            C6: { formula: 'C₆H₁₄', target: 6, isomers: ['Hexane', '2-methylpentane', '3-methylpentane', '2,2-dimethylbutane', '2,3-dimethylbutane'] }
        };

        // --- IUPAC Naming Logic Helper ---
        const analyzeStructure = (chainLength, branches) => {
            // 1. Build Graph
            // Nodes 0 to chainLength-1 are the main chain
            // Branches are attached to these nodes
            const nodes = [];
            for(let i=0; i<chainLength; i++) nodes.push({ id: i, neighbors: [] });
            
            // Connect Main Chain
            for(let i=0; i<chainLength-1; i++) {
                nodes[i].neighbors.push(i+1);
                nodes[i+1].neighbors.push(i);
            }

            // Add Branches
            let nextId = chainLength;
            branches.forEach(b => {
                // b.pos is 0-based index on main chain
                // b.count is number of methyls (1 or 2)
                for(let k=0; k<b.count; k++) {
                    nodes.push({ id: nextId, neighbors: [] });
                    // Connect branch to main chain carbon
                    nodes[b.pos].neighbors.push(nextId);
                    nodes[nextId].neighbors.push(b.pos);
                    nextId++;
                }
            });

            const totalCarbons = nodes.length;

            // 2. Find Longest Path (Diameter of Tree)
            // DFS to find furthest node from arbitrary start (node 0), then furthest from that
            const getFurthest = (startNode) => {
                const visited = new Set();
                const stack = [{ node: startNode, dist: 1, path: [startNode] }];
                let max = { node: startNode, dist: 0, path: [] };
                
                while(stack.length > 0) {
                    const current = stack.pop();
                    visited.add(current.node);
                    
                    if (current.dist > max.dist) max = current;

                    nodes[current.node].neighbors.forEach(n => {
                        if (!visited.has(n)) {
                            stack.push({ node: n, dist: current.dist + 1, path: [...current.path, n] });
                        }
                    });
                }
                return max;
            };

            const endA = getFurthest(0);
            const endB = getFurthest(endA.node);
            
            const longestChainLen = endB.dist;
            const longestPath = endB.path; // This is one longest path, there might be others but for simple alkanes this is usually sufficient to identify parent

            // 3. Identify Branches based on Longest Path
            // Nodes in 'longestPath' are the parent chain. Others are branches.
            // We need to number from both ends and see which gives lower locants.
            
            const calculateName = (path) => {
                const pathSet = new Set(path);
                const substituents = []; // { pos: 1-based, type: 'methyl' }
                
                path.forEach((nodeId, idx) => {
                    // Check neighbors of this node
                    nodes[nodeId].neighbors.forEach(n => {
                        if (!pathSet.has(n)) {
                            // It's a branch. Since we only add methyls, it's a methyl group.
                            // (In C6 context, we won't form ethyls usually unless main chain 3 + branch, which is handled by logic)
                            // Wait, if we have ethyl, the longest path logic would have likely included it in the main chain if it was longer.
                            // So checking for simple methyls off the main path is generally safe for C4-C6 generated this way.
                            substituents.push(idx + 1); // 1-based position
                        }
                    });
                });

                return substituents;
            };

            const subsForward = calculateName(longestPath);
            const subsBackward = calculateName([...longestPath].reverse());

            // Compare locants
            let finalSubs = subsForward;
            // Simple comparison: first point of difference
            for(let i=0; i<Math.max(subsForward.length, subsBackward.length); i++) {
                const f = subsForward[i] || 999;
                const b = subsBackward[i] || 999;
                if (b < f) { finalSubs = subsBackward; break; }
                if (f < b) { finalSubs = subsForward; break; }
            }

            // Construct Name
            const rootNames = ['', 'Methane', 'Ethane', 'Propane', 'Butane', 'Pentane', 'Hexane', 'Heptane', 'Octane'];
            const parentName = rootNames[longestChainLen] || `C${longestChainLen}-alkane`;
            
            if (finalSubs.length === 0) return { name: parentName, carbons: totalCarbons };

            // Group substituents
            const counts = {};
            finalSubs.forEach(s => counts[s] = (counts[s] || 0) + 1); // Should handle 2,2-dimethyl
            
            // Sort locants
            finalSubs.sort((a,b) => a-b);
            
            const prefixes = ['', '', 'di', 'tri', 'tetra'];
            const subPrefix = prefixes[finalSubs.length];
            
            const locantString = finalSubs.join(',');
            const name = `${locantString}-${subPrefix}methyl${parentName.toLowerCase()}`;

            return { name: name.charAt(0).toUpperCase() + name.slice(1), carbons: totalCarbons };
        };


        const App = () => {
            const [level, setLevel] = useState('C6');
            const [found, setFound] = useState([]); // Array of found names
            const [message, setMessage] = useState({ text: '開始組裝你的分子吧！', type: 'info' });
            
            // Builder State
            const [chainLen, setChainLen] = useState(4);
            const [branches, setBranches] = useState({}); // { index: count }

            // Reset when level changes
            useEffect(() => {
                setFound([]);
                resetBuilder();
                setMessage({ text: `目標：尋找 ${Levels[level].isomers.length} 個異構物 (${Levels[level].formula})`, type: 'info' });
            }, [level]);

            const resetBuilder = () => {
                setChainLen(Math.max(1, Levels[level].target - 2)); // Default to slightly shorter
                setBranches({});
            };

            const toggleBranch = (idx) => {
                setBranches(prev => {
                    const current = prev[idx] || 0;
                    const next = (current + 1) % 3; // 0 -> 1 -> 2 -> 0 (Max 2 methyls)
                    return { ...prev, [idx]: next };
                });
            };

            const handleCheck = () => {
                // Convert state to format for analyzer
                const branchList = Object.entries(branches)
                    .filter(([_, count]) => count > 0)
                    .map(([pos, count]) => ({ pos: parseInt(pos), count }));

                const result = analyzeStructure(chainLen, branchList);

                // 1. Check Carbon Count
                if (result.carbons !== Levels[level].target) {
                    setMessage({ 
                        text: `碳原子數量錯誤！你用了 ${result.carbons} 個，目標是 ${Levels[level].target} 個。`, 
                        type: 'error' 
                    });
                    return;
                }

                // 2. Check if Valid Isomer
                const targetIsomers = Levels[level].isomers;
                // Fuzzy match for naming differences (though logic should be standard)
                // We check if the calculated name is in our target list
                const match = targetIsomers.find(iso => iso.toLowerCase() === result.name.toLowerCase());

                if (match) {
                    if (found.includes(match)) {
                        setMessage({ text: `你已經找過這個了！這是 ${match}。`, type: 'warning' });
                    } else {
                        setFound(prev => [...prev, match]);
                        setMessage({ text: `恭喜！發現新異構物：${match}`, type: 'success' });
                        // Trigger confetti or sound here if possible
                    }
                } else {
                    // This theoretically shouldn't happen if carbon count is correct for alkanes C4-C6, 
                    // unless the analyzer has a bug or edge case (e.g. ethyl group formed).
                    // But our simple builder only adds methyls.
                    // For C6, 3-ethyl... is impossible (C8).
                    // So any C6 structure MUST be one of the 5 isomers.
                    // If we get here, maybe logic name formatting differs slightly.
                    // Let's treat as found but warn if logic drifted.
                    console.log("Generated:", result.name);
                    setMessage({ text: `這似乎是 ${result.name}，但不在目標清單中？(請檢查結構)`, type: 'warning' });
                }
            };

            // Visual Components
            const renderAtom = (index, isBranch = false) => (
                <div 
                    key={index}
                    onClick={() => !isBranch && toggleBranch(index)}
                    className={`
                        relative flex items-center justify-center w-14 h-14 rounded-full border-4 shadow-lg
                        ${isBranch 
                            ? 'bg-teal-500 border-teal-600 text-teal-100 w-10 h-10 mt-2' 
                            : 'bg-slate-700 border-slate-500 text-slate-300 cursor-pointer hover:bg-slate-600 hover:scale-105 active:scale-95 atom-btn'}
                        transition-all select-none z-10
                    `}
                >
                    <span className="font-bold font-mono">{isBranch ? 'CH₃' : 'C'}</span>
                    {!isBranch && (branches[index] > 0) && (
                        <div className="absolute -top-2 -right-2 bg-teal-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-slate-800">
                            {branches[index]}
                        </div>
                    )}
                </div>
            );

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-teal-400 flex items-center gap-2">
                                <i data-lucide="crosshair"></i> 異構物獵人
                            </h1>
                            <p className="text-slate-400 text-sm">Isomer Hunter: Find all isomers of Alkanes</p>
                        </div>
                        
                        <div className="flex bg-slate-800 rounded-lg p-1">
                            {Object.keys(Levels).map(lvl => (
                                <button
                                    key={lvl}
                                    onClick={() => setLevel(lvl)}
                                    className={`px-4 py-1 rounded font-bold text-sm transition-all
                                        ${level === lvl ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-white'}
                                    `}
                                >
                                    {lvl} ({Levels[lvl].formula})
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Builder Area */}
                        <div className="w-full lg:w-2/3 flex flex-col gap-4">
                            
                            {/* Canvas */}
                            <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-inner flex-grow flex flex-col items-center justify-center relative min-h-[400px]">
                                <div className="absolute inset-0 opacity-10" style={{backgroundImage: 'radial-gradient(#2dd4bf 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
                                
                                <div className="flex items-start gap-1 relative z-10">
                                    {Array.from({length: chainLen}).map((_, i) => (
                                        <div key={i} className="flex flex-col items-center">
                                            {/* Main Chain Atom */}
                                            {renderAtom(i)}
                                            
                                            {/* Bond */}
                                            {i < chainLen - 1 && <div className="absolute w-8 h-2 bg-slate-600 top-6 -right-4 -z-10"></div>}

                                            {/* Branch Visuals */}
                                            <div className="flex flex-col items-center transition-all duration-300">
                                                {branches[i] >= 1 && (
                                                    <>
                                                        <div className="h-4 w-1 bg-slate-500 my-1"></div>
                                                        {renderAtom(`b1-${i}`, true)}
                                                    </>
                                                )}
                                                {branches[i] >= 2 && (
                                                    <>
                                                        <div className="h-4 w-1 bg-slate-500 my-1"></div>
                                                        {renderAtom(`b2-${i}`, true)}
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <p className="absolute bottom-4 text-slate-500 text-xs flex items-center gap-2">
                                    <i data-lucide="mouse-pointer-click" size={14}/> 點擊碳原子以添加/移除支鏈 (Methyl)
                                </p>
                            </div>

                            {/* Controls */}
                            <div className="bg-white p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 border border-slate-200 shadow-lg">
                                <div className="flex items-center gap-4 w-full md:w-auto">
                                    <label className="text-sm font-bold text-slate-600">主鏈長度 (Main Chain):</label>
                                    <input 
                                        type="range" min="1" max="6" 
                                        value={chainLen} onChange={(e) => setChainLen(parseInt(e.target.value))}
                                        className="accent-teal-600 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer flex-grow"
                                    />
                                    <span className="text-xl font-mono font-bold text-teal-600 w-8 text-center">{chainLen}</span>
                                </div>

                                <button 
                                    onClick={handleCheck}
                                    className="px-8 py-3 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl shadow-md transition-transform active:scale-95 flex items-center gap-2 w-full md:w-auto justify-center"
                                >
                                    <i data-lucide="search" /> 鑑定結構 (Check)
                                </button>
                            </div>

                            {/* Message Banner */}
                            <div className={`p-4 rounded-xl border-l-4 text-sm font-bold flex items-center gap-3 transition-all
                                ${message.type === 'success' ? 'bg-green-900/30 border-green-500 text-green-300' : 
                                  message.type === 'error' ? 'bg-red-900/30 border-red-500 text-red-300' : 
                                  message.type === 'warning' ? 'bg-yellow-900/30 border-yellow-500 text-yellow-300' :
                                  'bg-slate-800 border-slate-600 text-slate-400'}
                            `}>
                                {message.type === 'success' ? <i data-lucide="check-circle"/> : 
                                 message.type === 'error' ? <i data-lucide="x-circle"/> : 
                                 message.type === 'warning' ? <i data-lucide="alert-circle"/> :
                                 <i data-lucide="info"/>}
                                {message.text}
                            </div>
                        </div>

                        {/* Right: Collection */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-4">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                                <div className="flex justify-between items-end mb-4">
                                    <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                        <i data-lucide="book-open" /> 異構物圖鑑
                                    </h3>
                                    <span className="text-sm font-mono text-teal-400 font-bold">
                                        {found.length} / {Levels[level].isomers.length} Found
                                    </span>
                                </div>
                                
                                <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden mb-6">
                                    <div 
                                        className="h-full bg-teal-500 transition-all duration-1000" 
                                        style={{width: `${(found.length / Levels[level].isomers.length) * 100}%`}}
                                    ></div>
                                </div>

                                <div className="space-y-3">
                                    {Levels[level].isomers.map((iso, idx) => {
                                        const isFound = found.includes(iso);
                                        return (
                                            <div 
                                                key={iso}
                                                className={`p-3 rounded-xl border transition-all flex items-center gap-3
                                                    ${isFound 
                                                        ? 'bg-teal-900/20 border-teal-500/50 text-teal-100 animate-pop' 
                                                        : 'bg-slate-900/50 border-slate-700 text-slate-600'}
                                                `}
                                            >
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm
                                                    ${isFound ? 'bg-teal-600 text-white' : 'bg-slate-700 text-slate-500'}
                                                `}>
                                                    {idx + 1}
                                                </div>
                                                <div className="font-mono text-sm">
                                                    {isFound ? iso : '???????'}
                                                </div>
                                                {isFound && <i data-lucide="check" className="ml-auto text-teal-500" size={16} />}
                                            </div>
                                        )
                                    })}
                                </div>

                                {found.length === Levels[level].isomers.length && (
                                    <div className="mt-6 p-4 bg-gradient-to-r from-yellow-600/20 to-orange-600/20 border border-yellow-500/30 rounded-xl text-center animate-bounce">
                                        <div className="text-2xl mb-1">🏆</div>
                                        <h4 className="font-bold text-yellow-200">恭喜完成所有收集！</h4>
                                        <p className="text-xs text-yellow-400/70">你已找出 {level} 的所有異構物。</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic XI
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
