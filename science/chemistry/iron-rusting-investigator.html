<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鐵鏽探究模擬器 (Iron Rusting Investigator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .rust-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #8c2f00; /* Darker rust red */
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Rust Animation Classes */
        .rusted-mild .rust-dot { opacity: 0.3; }
        .rusted-medium .rust-dot { opacity: 0.6; }
        .rusted-severe .rust-dot { opacity: 1; }

        /* Animation for fast forward */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-rust { animation: fade-in 2s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TestSetups = [
            { id: 1, name: '對照組', description: '鐵釘 + 空氣 + 水', conditions: { air: true, water: true, salt: false }, color: 'bg-green-100', expectedRust: 2 },
            { id: 2, name: '無水', description: '鐵釘 + 空氣 + 乾燥劑', conditions: { air: true, water: false, salt: false }, color: 'bg-yellow-100', expectedRust: 0 },
            { id: 3, name: '無空氣', description: '鐵釘 + 水 + 煮沸油 (隔絕空氣)', conditions: { air: false, water: true, salt: false }, color: 'bg-blue-100', expectedRust: 0 },
            { id: 4, name: '加速組', description: '鐵釘 + 鹽水 + 空氣', conditions: { air: true, water: true, salt: true }, color: 'bg-red-100', expectedRust: 3 },
            { id: 5, name: '防護組', description: '鐵釘 + 油 (完全覆蓋)', conditions: { air: false, water: false, salt: false }, color: 'bg-slate-200', expectedRust: 0 }
        ];

        const RustLevel = {
            0: '無鏽 (No Rust)',
            1: '微鏽 (Mild)',
            2: '中鏽 (Moderate)',
            3: '嚴重 (Severe)'
        };

        const App = () => {
            const [isSimulating, setIsSimulating] = useState(false);
            const [dayCount, setDayCount] = useState(0);
            const [rustState, setRustState] = useState(TestSetups.map(s => ({ id: s.id, rustLevel: 0 })));

            // Simulation Effect
            useEffect(() => {
                let interval;
                if (isSimulating && dayCount < 10) {
                    interval = setInterval(() => {
                        setDayCount(prev => prev + 1);
                    }, 200); // 200ms per day
                } else if (dayCount >= 10) {
                    setIsSimulating(false);
                }
                return () => clearInterval(interval);
            }, [isSimulating, dayCount]);

            // Rust Calculation Effect
            useEffect(() => {
                if (dayCount > 0) {
                    setRustState(TestSetups.map(setup => {
                        const { air, water, salt } = setup.conditions;
                        let rustFactor = 0;

                        // Base condition: Needs Air AND Water
                        if (air && water) {
                            rustFactor = 1;
                            // Salt accelerates rusting significantly
                            if (salt) rustFactor = 3;
                        }
                        
                        // Time factor (rust progresses over time)
                        let level = 0;
                        if (rustFactor > 0) {
                            level = Math.min(3, Math.ceil(dayCount * 0.3 * rustFactor)); // Progressively rusts up to 3
                        }

                        return { id: setup.id, rustLevel: level };
                    }));
                }
            }, [dayCount]);

            const startSimulation = () => {
                if (dayCount < 10) {
                    setIsSimulating(true);
                } else {
                    setDayCount(0);
                    setRustState(TestSetups.map(s => ({ id: s.id, rustLevel: 0 })));
                    setIsSimulating(true);
                }
            };

            const BeakerVisual = ({ setup, rustLevel }) => {
                const levelClass = `rusted-${rustLevel}`;
                const baseHeight = setup.conditions.water ? 'h-1/2' : 'h-1/4';
                
                // Content color and label
                let contentBg = setup.conditions.water ? setup.conditions.salt ? 'bg-red-200' : 'bg-blue-300' : 'bg-white';
                let topLayer = setup.id === 3 ? 'bg-yellow-600 h-1/4' : 'bg-transparent';
                
                // Rust dots positions
                const rustDots = Array.from({length: 15}).map((_, i) => ({
                    x: 35 + (i % 3) * 10 + (Math.random() * 5),
                    y: 40 + Math.floor(i / 3) * 10 + (Math.random() * 5),
                    delay: i * 0.1
                }));

                return (
                    <div className="flex flex-col items-center w-full p-2">
                        <div className="w-24 h-40 border-4 border-slate-300 rounded-b-xl relative overflow-hidden flex flex-col justify-end">
                            
                            {/* Content (Liquid/Air) */}
                            <div className={`w-full ${contentBg} absolute bottom-0 ${baseHeight} transition-all duration-1000`}></div>
                            {/* Top Layer (Oil/Air) */}
                            <div className={`w-full ${topLayer} absolute top-0`}></div>

                            {/* Iron Nail */}
                            <div className={`absolute left-1/2 -translate-x-1/2 w-2 h-14 bg-slate-400 rounded-b-full z-10`} 
                                 style={{ bottom: setup.conditions.water ? '15%' : '0' }}>
                                
                                {/* Rust Layer */}
                                <div className={`absolute inset-0 ${levelClass} animate-rust`} key={dayCount}>
                                    {rustDots.map(dot => (
                                        <div key={dot.x} className="rust-dot" style={{ left: `${dot.x}%`, top: `${dot.y}%`, animationDelay: `${dot.delay}s` }}></div>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Bottom Content Label */}
                            {setup.id === 2 && <span className="absolute bottom-0 text-[8px] text-slate-600 w-full text-center">CaCl₂ (Drying Agent)</span>}
                            {setup.id === 5 && <span className="absolute top-0 text-[8px] text-slate-900 w-full text-center">Oil Layer</span>}
                            
                            {/* Water Line */}
                            {setup.conditions.water && <div className="absolute w-full h-px border-t border-slate-700" style={{ bottom: '50%' }}></div>}
                        </div>
                        
                        <div className="mt-2 text-center">
                            <h4 className="text-sm font-bold text-slate-700">{setup.name}</h4>
                            <p className="text-xs text-slate-500 italic">{setup.description.split('+')[1].trim()}</p>
                            <p className={`mt-1 font-bold text-lg ${rustLevel > 0 ? 'text-red-600' : 'text-green-600'}`}>{RustLevel[rustLevel]}</p>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-red-600 flex items-center gap-2">
                                <i data-lucide="shield-off"></i> 鐵釘生鏽探究實驗室
                            </h1>
                            <p className="text-slate-400 text-sm">Iron Rusting Investigator (Time Lapse)</p>
                        </div>
                        <button onClick={startSimulation} disabled={isSimulating} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-500 font-bold text-sm flex items-center gap-2 transition-colors disabled:bg-slate-400">
                            <i data-lucide={isSimulating ? "loader-2" : "play"} size={16} className={isSimulating ? 'animate-spin' : ''}></i>
                            {isSimulating ? `模擬中... (Day ${dayCount})` : dayCount > 0 ? '重啟模擬 (Restart)' : '開始快轉 (Start Time Lapse)'}
                        </button>
                    </div>

                    {/* Simulation Grid */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 flex justify-around gap-4 mb-8">
                        {TestSetups.map(setup => {
                            const currentRust = rustState.find(r => r.id === setup.id);
                            return <BeakerVisual key={setup.id} setup={setup} rustLevel={currentRust ? currentRust.rustLevel : 0} />;
                        })}
                    </div>

                    {/* Theory and Results Summary */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200 lg:col-span-2">
                            <h3 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2">
                                <i data-lucide="flask-conical" className="text-blue-500" /> 實驗結論 (Required Conditions)
                            </h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="p-4 bg-blue-50 border-l-4 border-blue-400 rounded-lg">
                                    <strong className="text-blue-800 block mb-1">鐵生鏽的必要條件 (Conditions Required)</strong>
                                    <ul className="text-sm text-blue-700 list-disc list-inside">
                                        <li><strong>氧氣 (Oxygen)</strong> - 氧化劑 (Oxidizing Agent)</li>
                                        <li><strong>水 (Water)</strong> - 充當電解質 (Electrolyte)</li>
                                    </ul>
                                </div>
                                <div className="p-4 bg-red-50 border-l-4 border-red-400 rounded-lg">
                                    <strong className="text-red-800 block mb-1">反應加速劑 (Accelerators)</strong>
                                    <ul className="text-sm text-red-700 list-disc list-inside">
                                        <li><strong>鹽分 (Salt / NaCl)</strong> - 增加水的導電性。</li>
                                        <li><strong>酸 (Acid)</strong> - 降低 pH 值。</li>
                                    </ul>
                                </div>
                            </div>
                            
                            <p className="mt-4 text-sm text-slate-600">
                                <strong>觀察總結：</strong> 只有同時提供空氣和水的試管 (#1, #4) 才會生鏽。移除其中任一項（#2, #3, #5）都能有效阻止生鏽。
                            </p>
                        </div>

                        {/* Equation Card */}
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                            <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                                <i data-lucide="zap" className="text-yellow-400" /> 電化學原理
                            </h3>
                            <div className="text-sm text-slate-300 leading-relaxed space-y-2">
                                <p className="font-bold text-red-400">陽極 (Anode) - 氧化 (Oxidation):</p>
                                <p className="font-mono text-white break-words">Fe(s) &rarr; Fe²⁺(aq) + 2e⁻</p>
                                
                                <p className="font-bold text-blue-400 pt-3 border-t border-slate-700">陰極 (Cathode) - 還原 (Reduction):</p>
                                <p className="font-mono text-white break-words">O₂(g) + 2H₂O(l) + 4e⁻ &rarr; 4OH⁻(aq)</p>
                                
                                <p className="font-bold text-green-400 pt-3 border-t border-slate-700">最終產物 (Final Rust):</p>
                                <p className="font-mono text-white break-words">Fe³⁺(aq) + H₂O &rarr; Fe₂O₃·xH₂O (Rust)</p>
                            </div>
                        </div>
                    </div>

                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic III
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
