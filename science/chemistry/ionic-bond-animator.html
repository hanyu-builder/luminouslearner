<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>離子鍵動畫師 (Ionic Bond Animator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .electron {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: grab;
        }
        .electron:active { cursor: grabbing; }
        
        .atom-shell {
            transition: all 0.3s ease;
        }
        
        @keyframes pulse-success {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .animate-success {
            animation: pulse-success 1s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s infinite ease-in-out;
        }
        
        /* Lattice 3D Effect */
        .lattice-grid {
            perspective: 1000px;
        }
        .lattice-ion {
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Atom Data
        const Atoms = {
            Na: { symbol: 'Na', name: '鈉 (Sodium)', z: 11, valence: 1, type: 'metal', color: 'bg-yellow-500' },
            Mg: { symbol: 'Mg', name: '鎂 (Magnesium)', z: 12, valence: 2, type: 'metal', color: 'bg-orange-500' },
            Li: { symbol: 'Li', name: '鋰 (Lithium)', z: 3, valence: 1, type: 'metal', color: 'bg-red-500' },
            Cl: { symbol: 'Cl', name: '氯 (Chlorine)', z: 17, valence: 7, type: 'nonmetal', color: 'bg-green-500' },
            O: { symbol: 'O', name: '氧 (Oxygen)', z: 8, valence: 6, type: 'nonmetal', color: 'bg-blue-500' },
            F: { symbol: 'F', name: '氟 (Fluorine)', z: 9, valence: 7, type: 'nonmetal', color: 'bg-teal-500' }
        };

        // Possible Combinations with Ratios
        const Reactions = [
            { id: 'NaCl', metal: 'Na', nonmetal: 'Cl', mCount: 1, nmCount: 1, product: '氯化鈉 (Sodium Chloride)' },
            { id: 'MgO', metal: 'Mg', nonmetal: 'O', mCount: 1, nmCount: 1, product: '氧化鎂 (Magnesium Oxide)' },
            { id: 'LiF', metal: 'Li', nonmetal: 'F', mCount: 1, nmCount: 1, product: '氟化鋰 (Lithium Fluoride)' },
            { id: 'MgCl2', metal: 'Mg', nonmetal: 'Cl', mCount: 1, nmCount: 2, product: '氯化鎂 (Magnesium Chloride)' },
            { id: 'Li2O', metal: 'Li', nonmetal: 'O', mCount: 2, nmCount: 1, product: '氧化鋰 (Lithium Oxide)' }
        ];

        const App = () => {
            const [currentReaction, setCurrentReaction] = useState(Reactions[0]);
            const [transferredCount, setTransferredCount] = useState(0);
            const [stage, setStage] = useState('transfer'); // transfer, success, lattice
            // Using simplified tracking: just count how many electrons moved
            
            const metal = Atoms[currentReaction.metal];
            const nonmetal = Atoms[currentReaction.nonmetal];
            
            // Total electrons to transfer = metal valence * metal count
            const totalToTransfer = metal.valence * currentReaction.mCount;

            // Initialize
            useEffect(() => {
                setTransferredCount(0);
                setStage('transfer');
            }, [currentReaction]);

            // Handle Transfer Click
            const handleTransfer = () => {
                if (transferredCount < totalToTransfer) {
                    setTransferredCount(prev => {
                        const next = prev + 1;
                        // If all transferred
                        if (next === totalToTransfer) {
                            setTimeout(() => setStage('success'), 500);
                        }
                        return next;
                    });
                }
            };

            // Reset
            const reset = () => {
                setTransferredCount(0);
                setStage('transfer');
            };

            // Render Single Atom
            const renderAtom = (atomData, isMetal, index, totalTypeCount) => {
                // For metals: how many electrons THIS atom has lost?
                // We distribute losses sequentially.
                // e.g., Li2O (total 2 to lose). 1st Li loses 1st, 2nd Li loses 2nd.
                
                let myTransferred = 0;
                let myReceived = 0;

                if (isMetal) {
                    // Calculate how many electrons THIS metal atom has lost
                    // Total transferred is distributed among mCount atoms.
                    // Each can lose `atomData.valence`.
                    const maxLoss = atomData.valence;
                    // Previous atoms took this much from the pool
                    const consumedByPrevious = index * maxLoss;
                    const availableForMe = Math.max(0, transferredCount - consumedByPrevious);
                    myTransferred = Math.min(availableForMe, maxLoss);
                } else {
                    // Non-metal: gains electrons
                    // Each needs (8 - valence)
                    const maxGain = 8 - atomData.valence;
                    const consumedByPrevious = index * maxGain;
                    const availableForMe = Math.max(0, transferredCount - consumedByPrevious);
                    myReceived = Math.min(availableForMe, maxGain);
                }

                // Check if THIS atom is stable/complete
                const isComplete = isMetal 
                    ? myTransferred === atomData.valence 
                    : myReceived === (8 - atomData.valence);

                // Calculate electron positions
                const electrons = [];
                // For metal: show remaining. For non-metal: show original + received
                const currentElectrons = isMetal 
                    ? atomData.valence - myTransferred 
                    : atomData.valence + myReceived;

                for (let i = 0; i < currentElectrons; i++) {
                    const angle = (i / (isMetal ? atomData.valence : 8)) * 2 * Math.PI - Math.PI/2;
                    const r = 50; // Reduced radius for multi-atom view
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    
                    // Determine color: 
                    // If non-metal and this is a received electron (index >= original valence)
                    // use Metal's color to show transfer source
                    const isReceivedElectron = !isMetal && i >= atomData.valence;
                    const colorClass = isReceivedElectron ? Atoms[currentReaction.metal].color : atomData.color;
                    
                    electrons.push(
                        <div key={i} 
                             className={`absolute w-3 h-3 rounded-full border border-white shadow-sm transition-all duration-500 ${colorClass}`}
                             style={{ transform: `translate(${x}px, ${y}px)` }}>
                        </div>
                    );
                }

                return (
                    <div key={`${atomData.symbol}-${index}`} className={`flex flex-col items-center gap-2 transition-all duration-500 ${stage === 'success' ? 'scale-105' : ''}`}>
                        <div className="relative w-32 h-32 flex items-center justify-center">
                            {/* Shell Ring */}
                            <div className={`absolute inset-0 rounded-full border-2 border-dashed m-4
                                ${isComplete ? 'border-green-400 opacity-60' : 'border-slate-500'}
                            `}></div>
                            
                            {/* Core */}
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold text-white shadow-lg z-10 ${atomData.color}
                                ${stage === 'success' ? 'animate-success' : ''}
                            `}>
                                {atomData.symbol}
                                {stage !== 'transfer' && (
                                    <sup className="text-xs ml-0.5">
                                        {isMetal ? `${atomData.valence}+` : `${8 - atomData.valence}-`}
                                    </sup>
                                )}
                            </div>

                            {/* Electrons */}
                            {electrons}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-700 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-green-400 flex items-center gap-2">
                                <i data-lucide="zap"></i> 離子鍵動畫師
                            </h1>
                            <p className="text-slate-400 text-sm">Ionic Bond Animator: 1:1, 1:2, 2:1 Ratios</p>
                        </div>
                        <div className="flex flex-wrap gap-2 justify-center">
                            {Reactions.map(r => (
                                <button
                                    key={r.id}
                                    onClick={() => setCurrentReaction(r)}
                                    className={`px-3 py-1 rounded border text-sm font-bold transition-colors
                                        ${currentReaction.id === r.id ? 'bg-green-600 text-white border-green-500' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    {r.id}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-grow flex flex-col lg:flex-row gap-8">
                        
                        {/* Visualization Area */}
                        <div className="w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative flex flex-col items-center justify-center min-h-[400px] shadow-2xl overflow-hidden p-4">
                            
                            {/* Background Grid */}
                            <div className="absolute inset-0 opacity-10" 
                                 style={{backgroundImage: 'radial-gradient(#4ade80 1px, transparent 1px)', backgroundSize: '30px 30px'}}></div>

                            {stage !== 'lattice' ? (
                                <div className="flex flex-col md:flex-row items-center justify-center gap-4 w-full relative z-10">
                                    
                                    {/* Metal Atoms Column */}
                                    <div className="flex flex-col gap-2">
                                        {Array.from({length: currentReaction.mCount}).map((_, i) => 
                                            renderAtom(metal, true, i, currentReaction.mCount)
                                        )}
                                        <div className="text-center mt-2">
                                            <div className="text-sm font-bold text-white">{metal.name}</div>
                                            <div className="text-xs text-slate-400">失去 e⁻</div>
                                        </div>
                                    </div>

                                    {/* Transfer Controls */}
                                    <div className="flex flex-col items-center justify-center px-4">
                                        <i data-lucide="arrow-right" size={40} className={`text-slate-600 transition-all duration-500 hidden md:block ${transferredCount > 0 ? 'text-green-400 scale-125' : ''}`} />
                                        <i data-lucide="arrow-down" size={40} className={`text-slate-600 transition-all duration-500 md:hidden mb-4 ${transferredCount > 0 ? 'text-green-400 scale-125' : ''}`} />
                                        
                                        {stage === 'transfer' && (
                                            <button 
                                                onClick={handleTransfer}
                                                className="whitespace-nowrap px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full shadow-lg transition-transform active:scale-95 animate-bounce"
                                            >
                                                轉移電子 ({transferredCount}/{totalToTransfer})
                                            </button>
                                        )}
                                    </div>

                                    {/* Non-Metal Atoms Column */}
                                    <div className="flex flex-col gap-2">
                                        {Array.from({length: currentReaction.nmCount}).map((_, i) => 
                                            renderAtom(nonmetal, false, i, currentReaction.nmCount)
                                        )}
                                        <div className="text-center mt-2">
                                            <div className="text-sm font-bold text-white">{nonmetal.name}</div>
                                            <div className="text-xs text-slate-400">接收 e⁻</div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                /* Lattice View */
                                <div className="flex flex-col items-center animate-in zoom-in duration-700">
                                    <div className="grid grid-cols-3 gap-2 lattice-grid mb-6">
                                        {/* Dynamically generate lattice based on ratio */}
                                        {Array.from({length: 9}).map((_, i) => {
                                            // Simple pattern logic: 
                                            // for 1:1 (NaCl) -> Alt
                                            // for 1:2 (MgCl2) -> 1 M, 2 NM
                                            let atom;
                                            let sign;
                                            
                                            if (currentReaction.mCount === 1 && currentReaction.nmCount === 1) {
                                                const isPos = i % 2 === 0;
                                                atom = isPos ? metal : nonmetal;
                                                sign = isPos ? '+' : '-';
                                            } else if (currentReaction.mCount === 1 && currentReaction.nmCount === 2) {
                                                // 1:2 ratio (MgCl2) - More anions
                                                const isPos = i % 3 === 0;
                                                atom = isPos ? metal : nonmetal;
                                                sign = isPos ? '2+' : '-';
                                            } else {
                                                // 2:1 ratio (Li2O) - More cations
                                                const isNeg = i % 3 === 0;
                                                atom = isNeg ? nonmetal : metal;
                                                sign = isNeg ? '2-' : '+';
                                            }

                                            return (
                                                <div key={i} className={`w-16 h-16 rounded-full ${atom.color} flex items-center justify-center text-white font-bold text-xl shadow-[inset_-5px_-5px_10px_rgba(0,0,0,0.3)] border-2 border-white/20 lattice-ion animate-float`} style={{animationDelay: `${i*0.2}s`}}>
                                                    {sign}
                                                </div>
                                            )
                                        })}
                                    </div>
                                    <div className="text-center">
                                        <h2 className="text-2xl font-bold text-white mb-2">{currentReaction.product}</h2>
                                        <p className="text-slate-300 max-w-md text-sm">
                                            正負離子以 {currentReaction.mCount}:{currentReaction.nmCount} 的比例，通過強大的靜電引力緊密堆積。
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* Success Message */}
                            {stage === 'success' && (
                                <div className="absolute bottom-4 bg-green-600/90 text-white px-6 py-3 rounded-xl shadow-lg backdrop-blur flex items-center gap-3 animate-in slide-in-from-bottom-4">
                                    <i data-lucide="check-circle" size={24} />
                                    <div>
                                        <div className="font-bold">反應完成！</div>
                                        <button onClick={() => setStage('lattice')} className="text-sm underline hover:text-green-200">查看晶體結構 &rarr;</button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Right: Info Panel */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="book-open" /> 化學原理與公式
                                </h3>
                                
                                <div className="space-y-4 text-sm text-slate-300 leading-relaxed">
                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-blue-500">
                                        <strong className="text-white block mb-1">化學式 (Chemical Formula)</strong>
                                        <div className="text-xl font-mono text-center py-2 text-blue-400 font-bold">
                                            {currentReaction.id}
                                        </div>
                                        <p>
                                            由於 {metal.name} 帶 {metal.valence}+ 電荷，而 {nonmetal.name} 帶 {nonmetal.valence === 7 ? 1 : 2}- 電荷，
                                            為了達到<strong>電中性 (Electrical Neutrality)</strong>，它們必須以 
                                            <span className="text-white font-bold mx-1">{currentReaction.mCount} : {currentReaction.nmCount}</span>
                                            的比例結合。
                                        </p>
                                    </div>
                                    
                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-green-500">
                                        <strong className="text-white block mb-1">電子轉移 (Electron Transfer)</strong>
                                        <ul className="list-disc list-inside mt-1 space-y-1">
                                            <li>總共轉移了 <span className="text-green-400 font-bold">{totalToTransfer}</span> 粒電子。</li>
                                            <li>每個 {metal.symbol} 失去 {metal.valence} 粒。</li>
                                            <li>每個 {nonmetal.symbol} 獲得 {8 - nonmetal.valence} 粒。</li>
                                        </ul>
                                    </div>
                                </div>

                                {stage === 'lattice' && (
                                    <div className="mt-6 pt-6 border-t border-slate-700">
                                        <button 
                                            onClick={reset}
                                            className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="rotate-ccw" size={18} /> 重置實驗
                                        </button>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic II
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
