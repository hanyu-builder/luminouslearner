<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電鍍實驗室 (Electroplating Lab)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Beaker Liquid */
        .liquid { transition: background-color 0.5s; }
        
        /* Bubble Animation */
        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: rise 2s infinite linear;
        }

        /* Ion Movement */
        @keyframes move-ion {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            90% { transform: translate(var(--tx), var(--ty)); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
        .ion-anim {
            animation: move-ion 2s infinite linear;
        }

        /* Plating Growth */
        .plating-layer {
            transition: opacity 0.2s;
        }

        /* Electron Flow Animation */
        @keyframes electron-flow {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }
        .wire-active {
            stroke-dasharray: 5;
            animation: electron-flow 0.5s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Metals = [
            { id: 'Cu', name: '銅 (Copper)', ion: 'Cu²⁺', color: 'bg-orange-500', liquidColor: 'bg-blue-400/60', platingColor: 'rgba(249, 115, 22, 0.9)', atomicMass: 63.5, charge: 2 },
            { id: 'Ag', name: '銀 (Silver)', ion: 'Ag⁺', color: 'bg-slate-300', liquidColor: 'bg-slate-200/60', platingColor: 'rgba(203, 213, 225, 0.9)', atomicMass: 107.9, charge: 1 },
            { id: 'Ni', name: '鎳 (Nickel)', ion: 'Ni²⁺', color: 'bg-green-600', liquidColor: 'bg-green-400/60', platingColor: 'rgba(22, 163, 74, 0.9)', atomicMass: 58.7, charge: 2 }
        ];

        const Objects = [
            { id: 'Key', name: '鐵鑰匙 (Iron Key)', icon: 'Key', baseColor: 'text-slate-600' },
            { id: 'Spoon', name: '鐵湯匙 (Iron Spoon)', icon: 'Utensils', baseColor: 'text-slate-500' },
            { id: 'Coin', name: '硬幣 (Coin)', icon: 'Circle', baseColor: 'text-yellow-600' }
        ];

        const App = () => {
            // Settings
            const [platingMetal, setPlatingMetal] = useState(Metals[0]); // Copper
            const [targetObject, setTargetObject] = useState(Objects[0]); // Key
            const [current, setCurrent] = useState(1.0); // Amps
            const [time, setTime] = useState(0); // Seconds
            const [isRunning, setIsRunning] = useState(false);
            
            // Simulation State
            const [massDeposited, setMassDeposited] = useState(0);
            const [thickness, setThickness] = useState(0); // 0-100% visual opacity
            const [anodeMassLoss, setAnodeMassLoss] = useState(0);

            // Constants
            const FARADAY = 96500; // C/mol

            // Timer & Calculation Loop
            useEffect(() => {
                let interval;
                if (isRunning) {
                    interval = setInterval(() => {
                        setTime(prev => {
                            const newTime = prev + 1;
                            
                            // Calculate Mass: m = (I * t * M) / (z * F)
                            const m = (current * newTime * platingMetal.atomicMass) / (platingMetal.charge * FARADAY);
                            setMassDeposited(m);
                            
                            setAnodeMassLoss(m);

                            const visualScale = m * 100; 
                            setThickness(Math.min(100, visualScale));

                            return newTime;
                        });
                    }, 100); 
                }
                return () => clearInterval(interval);
            }, [isRunning, current, platingMetal]);

            const reset = () => {
                setIsRunning(false);
                setTime(0);
                setMassDeposited(0);
                setThickness(0);
                setAnodeMassLoss(0);
            };

            // Custom Icons Render
            // FIX: Coin is now an SVG to properly use 'text-color' as fill via currentColor
            const ObjectIcon = ({ type, className, style }) => {
                if (type === 'Key') return <svg viewBox="0 0 24 24" fill="currentColor" className={className} style={style}><path d="M21 2l-2 2m-7.6 7.6l6.5-6.5a2 2 0 0 0-2.8-2.8l-6.5 6.5a2 2 0 0 0-.6 1.5l-.4 1.4-2 2-2-2-2 2 2 2 2 2 2 2-2 2-1.4.4a2 2 0 0 0-1.5.6l-2.6 2.6a2 2 0 0 0 2.8 2.8l2.6-2.6"/></svg>;
                if (type === 'Spoon') return <svg viewBox="0 0 24 24" fill="currentColor" className={className} style={style}><path d="M12 2a4 4 0 0 1 4 4c0 2-1.5 3.5-3.5 4L12 22 9.5 10C7.5 9.5 6 8 6 6a4 4 0 0 1 6-4z"/></svg>; 
                if (type === 'Coin') return <svg viewBox="0 0 24 24" fill="currentColor" className={className} style={style}><circle cx="12" cy="12" r="10"/></svg>;
                return null;
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="layers"></i> 電鍍實驗室 (Electroplating Lab)
                            </h1>
                            <p className="text-slate-400 text-sm">Simulate Current, Time & Mass Deposition</p>
                        </div>
                        <button onClick={reset} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Controls */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Settings Panel */}
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                                    <i data-lucide="sliders" size={16}/> 實驗參數
                                </h3>

                                {/* Metal Selection */}
                                <div className="mb-4">
                                    <label className="text-xs font-bold text-indigo-600 block mb-2">電鍍金屬 (Anode / Electrolyte)</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {Metals.map(m => (
                                            <button 
                                                key={m.id}
                                                onClick={() => { setPlatingMetal(m); reset(); }}
                                                className={`p-2 rounded-lg border text-xs font-bold transition-all flex flex-col items-center gap-1
                                                    ${platingMetal.id === m.id ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}
                                                `}
                                            >
                                                <div className={`w-4 h-4 rounded-full ${m.color}`}></div>
                                                {m.name.split(' ')[0]}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Object Selection */}
                                <div className="mb-6">
                                    <label className="text-xs font-bold text-slate-500 block mb-2">被鍍物件 (Cathode)</label>
                                    <div className="flex gap-2">
                                        {Objects.map(o => (
                                            <button 
                                                key={o.id}
                                                onClick={() => { setTargetObject(o); reset(); }}
                                                className={`flex-1 p-2 rounded-lg border text-xs font-bold transition-all
                                                    ${targetObject.id === o.id ? 'bg-slate-100 border-slate-400 text-slate-800' : 'bg-white border-slate-200 text-slate-400 hover:bg-slate-50'}
                                                `}
                                            >
                                                {o.name.split(' ')[0]}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Current Slider */}
                                <div className="mb-6">
                                    <div className="flex justify-between mb-2">
                                        <label className="text-xs font-bold text-slate-500">電流 (Current, I)</label>
                                        <span className="text-sm font-mono font-bold text-indigo-600">{current.toFixed(1)} A</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="0.1" max="5.0" step="0.1" 
                                        value={current}
                                        onChange={(e) => setCurrent(parseFloat(e.target.value))}
                                        disabled={isRunning}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                                    />
                                </div>

                                <button 
                                    onClick={() => setIsRunning(!isRunning)}
                                    className={`w-full py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2
                                        ${isRunning ? 'bg-red-500 hover:bg-red-600' : 'bg-green-600 hover:bg-green-700'}
                                    `}
                                >
                                    {isRunning ? <i data-lucide="pause" fill="white"/> : <i data-lucide="play" fill="white"/>}
                                    {isRunning ? '暫停電鍍' : '開始電鍍'}
                                </button>
                            </div>

                            {/* Real-time Data */}
                            <div className="bg-slate-800 p-5 rounded-2xl text-white shadow-lg">
                                <h3 className="text-sm font-bold text-yellow-400 uppercase mb-3 flex items-center gap-2">
                                    <i data-lucide="activity" size={16}/> 實時數據
                                </h3>
                                <div className="space-y-3 font-mono text-sm">
                                    <div className="flex justify-between border-b border-slate-700 pb-1">
                                        <span className="text-slate-400">時間 (t):</span>
                                        <span>{time.toFixed(0)} s</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-700 pb-1">
                                        <span className="text-slate-400">沉積質量 (m):</span>
                                        <span className="text-green-400 font-bold">{massDeposited.toFixed(4)} g</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-700 pb-1">
                                        <span className="text-slate-400">陽極損耗:</span>
                                        <span className="text-red-400">-{anodeMassLoss.toFixed(4)} g</span>
                                    </div>
                                </div>
                                <div className="mt-3 text-[10px] text-slate-500">
                                    Formula: m = (I × t × M) ÷ (z × F)
                                </div>
                            </div>

                        </div>

                        {/* Right: Visualization */}
                        <div className="w-full lg:w-2/3 flex flex-col gap-6 items-center justify-center bg-slate-100 rounded-3xl border-4 border-slate-200 relative overflow-hidden min-h-[500px] p-8">
                            
                            {/* Background Grid */}
                            <div className="absolute inset-0 opacity-5" style={{backgroundImage: 'radial-gradient(#000 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>

                            {/* Circuit & Power Source - Added */}
                            <div className="relative w-full max-w-md h-96 flex flex-col items-center justify-end">
                                
                                {/* Power Source & Wires (Top Section) */}
                                <div className="absolute top-0 w-full flex justify-center z-10">
                                    {/* Battery */}
                                    <div className="relative bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg border-2 border-slate-600 flex flex-col items-center">
                                        <div className="text-yellow-400 font-mono font-bold text-lg">DC {current.toFixed(1)}A</div>
                                        <div className="text-[10px] text-slate-400 uppercase font-bold">Power Source</div>
                                        <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-slate-800 rotate-45 z-0"></div>
                                    </div>
                                    
                                    {/* Wires SVG */}
                                    <svg className="absolute top-8 w-full h-24 pointer-events-none overflow-visible" style={{zIndex: -1}}>
                                        {/* Left Wire (Anode, +) */}
                                        <path d="M 50% 10 H 15% V 100" fill="none" stroke="#ef4444" strokeWidth="4" className={isRunning ? 'wire-active' : ''} />
                                        {/* Right Wire (Cathode, -) */}
                                        <path d="M 50% 10 H 85% V 100" fill="none" stroke="#374151" strokeWidth="4" className={isRunning ? 'wire-active' : ''} />
                                        
                                        {/* Polarity Signs */}
                                        <text x="15%" y="90" fill="#ef4444" fontSize="24" fontWeight="bold" textAnchor="middle">+</text>
                                        <text x="85%" y="90" fill="#374151" fontSize="24" fontWeight="bold" textAnchor="middle">-</text>
                                    </svg>
                                </div>

                                {/* Beaker */}
                                <div className="w-80 h-64 border-4 border-slate-300 border-t-0 rounded-b-3xl bg-white/40 backdrop-blur-sm relative overflow-hidden shadow-xl mt-16">
                                    {/* Electrolyte */}
                                    <div className={`absolute bottom-0 w-full h-[85%] ${platingMetal.liquidColor} liquid`}></div>
                                    
                                    {/* Anode (Metal Bar) - Left - UPDATED LABEL POSITION */}
                                    <div className="absolute left-12 top-0 w-12 h-full flex flex-col items-center">
                                         {/* Wire Connection Point */}
                                        <div className="w-1 h-4 bg-black absolute -top-4"></div>
                                        
                                        <div className={`w-8 h-48 ${platingMetal.color} border-2 border-slate-600 rounded-b-md shadow-md transition-all relative`}
                                             style={{ 
                                                 // Visualize erosion
                                                 clipPath: `polygon(0 0, 100% 0, 100% ${100 - anodeMassLoss*50}%, 80% 100%, 20% 100%, 0 ${100 - anodeMassLoss*50}%)`
                                             }}>
                                        </div>
                                        {/* Label Moved Up */}
                                        <div className="absolute -top-8 bg-white/80 px-2 py-0.5 rounded text-[10px] font-bold text-red-600 shadow-sm border border-red-200">Anode (+)</div>
                                        <div className="absolute top-2 text-[9px] font-bold text-white/90 pointer-events-none">{platingMetal.name.split(' ')[0]}</div>
                                    </div>

                                    {/* Cathode (Object) - Right - UPDATED LABEL POSITION */}
                                    <div className="absolute right-12 top-0 w-16 h-full flex flex-col items-center">
                                        {/* Wire Connection Point */}
                                        <div className="w-1 h-8 bg-black absolute -top-8"></div>
                                        
                                        {/* Label Moved Up */}
                                        <div className="absolute -top-8 bg-white/80 px-2 py-0.5 rounded text-[10px] font-bold text-slate-800 shadow-sm border border-slate-300">Cathode (-)</div>

                                        <div className="relative w-full h-40 flex justify-center mt-2">
                                            {/* Base Object */}
                                            <ObjectIcon type={targetObject.id} className={`w-16 h-32 ${targetObject.baseColor}`} />
                                            
                                            {/* Plating Layer Overlay */}
                                            <ObjectIcon 
                                                type={targetObject.id} 
                                                className="w-16 h-32 absolute inset-0 plating-layer" 
                                                style={{ 
                                                    color: platingMetal.platingColor, 
                                                    opacity: Math.min(1, thickness / 50), // Opacity builds up
                                                    filter: `drop-shadow(0 0 ${thickness/10}px ${platingMetal.platingColor})`
                                                }} 
                                            />
                                        </div>
                                    </div>

                                    {/* Ion Animation */}
                                    {isRunning && (
                                        <div className="absolute inset-0 pointer-events-none overflow-hidden">
                                            {/* Cations moving Anode -> Cathode */}
                                            {[...Array(5)].map((_, i) => (
                                                <div key={i} className="absolute w-4 h-4 bg-white/80 rounded-full flex items-center justify-center text-[8px] font-bold text-slate-700 border border-slate-400 shadow-sm ion-anim"
                                                     style={{
                                                         left: '20%', top: '40%',
                                                         '--tx': '180px', '--ty': `${(i-2)*20}px`,
                                                         animationDelay: `${i * 0.5}s`,
                                                         animationDuration: `${3 - current * 0.4}s` // Speed depends on current
                                                     }}>
                                                    {platingMetal.ion.replace(/\d+\+/, '+')}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                </div>
                            </div>

                            {/* Legend */}
                            <div className="flex gap-6 text-xs text-slate-500 font-bold mt-4">
                                <div className="flex items-center gap-2">
                                    <div className={`w-3 h-3 rounded ${platingMetal.color}`}></div>
                                    <span>陽極: {platingMetal.name} (氧化)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 rounded bg-slate-600"></div>
                                    <span>陰極: {targetObject.name} (還原)</span>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic VII
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
