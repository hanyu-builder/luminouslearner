<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赫斯定律循環解題器 (Hess's Law Cycle Solver)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .node-input {
            transition: all 0.2s;
            text-align: center;
        }
        .node-input:focus {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Arrow Animation */
        .arrow-path {
            transition: stroke 0.3s, stroke-width 0.3s, marker-end 0.3s;
            cursor: pointer;
        }
        .arrow-path:hover {
            stroke: #6366f1; /* Indigo-500 */
            stroke-width: 4;
        }
        .arrow-path.highlight {
            stroke: #22c55e; /* Green-500 */
            stroke-width: 4;
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .val-input {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .val-input:focus {
            background: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [mode, setMode] = useState('combustion'); // generic, formation, combustion
            const [nodes, setNodes] = useState({
                top: '反應物 (Reactants)',
                right: '生成物 (Products)',
                bottom: '燃燒產物 (Oxides)'
            });
            
            // Edges: 1=Top->Right, 2=Top->Bottom, 3=Right->Bottom (default directions for generic)
            // Values: string to allow empty
            // Direction: 1 = forward, -1 = reverse
            const [edges, setEdges] = useState({
                e1: { val: '', dir: 1, name: 'ΔH1', label: '反應焓變' }, // Top -> Right
                e2: { val: '', dir: 1, name: 'ΔH2', label: '反應物燃燒焓' }, // Top -> Bottom
                e3: { val: '', dir: 1, name: 'ΔH3', label: '生成物燃燒焓' }  // Right -> Bottom (Note: usually P->O in combustion)
            });

            const [result, setResult] = useState(null);
            const [pathHighlight, setPathHighlight] = useState([]); // ['e1', 'e2', 'e3'] to highlight

            // Preset Modes Configuration
            useEffect(() => {
                if (mode === 'formation') {
                    setNodes({ top: '反應物 (R)', right: '生成物 (P)', bottom: '構成元素 (Elements)' });
                    setEdges({
                        e1: { ...edges.e1, val: '', dir: 1, label: '反應焓變 (ΔHr)' },
                        e2: { ...edges.e2, val: '', dir: -1, label: '反應物生成焓 (ΔHf[R])' }, // Elements -> Reactants (Bottom to Top)
                        e3: { ...edges.e3, val: '', dir: -1, label: '生成物生成焓 (ΔHf[P])' }  // Elements -> Products (Bottom to Right)
                    });
                } else if (mode === 'combustion') {
                    setNodes({ top: '反應物 (R)', right: '生成物 (P)', bottom: '燃燒產物 (Combustion Products)' });
                    setEdges({
                        e1: { ...edges.e1, val: '', dir: 1, label: '反應焓變 (ΔHr)' },
                        e2: { ...edges.e2, val: '', dir: 1, label: '反應物燃燒焓 (ΔHc[R])' }, // Reactants -> Oxides
                        e3: { ...edges.e3, val: '', dir: 1, label: '生成物燃燒焓 (ΔHc[P])' }  // Products -> Oxides
                    });
                } else {
                    // Generic
                    setNodes({ top: '物質 A', right: '物質 B', bottom: '物質 C' });
                    setEdges({
                        e1: { ...edges.e1, val: '', dir: 1, label: 'ΔH1 (A → B)' },
                        e2: { ...edges.e2, val: '', dir: 1, label: 'ΔH2 (A → C)' },
                        e3: { ...edges.e3, val: '', dir: -1, label: 'ΔH3 (C → B)' } // C -> B
                    });
                }
                setResult(null);
                setPathHighlight([]);
            }, [mode]);

            const toggleDirection = (edgeKey) => {
                setEdges(prev => ({
                    ...prev,
                    [edgeKey]: { ...prev[edgeKey], dir: prev[edgeKey].dir * -1 }
                }));
                setResult(null);
                setPathHighlight([]);
            };

            const handleValueChange = (edgeKey, value) => {
                setEdges(prev => ({
                    ...prev,
                    [edgeKey]: { ...prev[edgeKey], val: value }
                }));
                setResult(null);
                setPathHighlight([]);
            };

            const calculate = () => {
                // Identify the unknown (empty value)
                const unknownKey = Object.keys(edges).find(k => edges[k].val === '');
                const knownKeys = Object.keys(edges).filter(k => edges[k].val !== '');

                if (!unknownKey) {
                    alert("請留空一個欄位作為未知數 (Target)。");
                    return;
                }
                if (knownKeys.length < 2) {
                    alert("請至少輸入兩個已知數值。");
                    return;
                }

                // Define the Vector Logic
                // Positions: Top(0), Right(1), Bottom(2)
                // e1 connects 0 -> 1
                // e2 connects 0 -> 2
                // e3 connects 1 -> 2
                
                // We want to form a closed loop or find a path.
                // Let's standardize: Find path from Start of Unknown to End of Unknown.
                
                let calcValue = 0;
                let steps = [];
                let highlight = [];

                const getVal = (key) => parseFloat(edges[key].val);
                const getDir = (key) => edges[key].dir; // 1 is default flow, -1 is reverse

                if (unknownKey === 'e1') {
                    // Target: Top -> Right
                    // Path: Top -> Bottom -> Right
                    // = (Top->Bottom) + (Bottom->Right)
                    
                    // 1. Top -> Bottom (e2)
                    // e2 default is Top->Bottom (0->2). If dir=1, we add. If dir=-1 (Bottom->Top), we subtract.
                    const v2 = getVal('e2') * getDir('e2'); // Effective vector 0->2
                    
                    // 2. Bottom -> Right (Reverse of e3)
                    // e3 connects 1->2 (Right->Bottom). We want 2->1.
                    // Vector 1->2 is val*dir. Vector 2->1 is -(val*dir).
                    const v3 = -(getVal('e3') * getDir('e3'));

                    calcValue = v2 + v3;
                    
                    // Construct Explanation
                    steps.push(`目標路徑 (Target): ${nodes.top} → ${nodes.right}`);
                    steps.push(`替代路徑 (Alternative): ${nodes.top} → ${nodes.bottom} → ${nodes.right}`);
                    steps.push(`1. ${nodes.top} → ${nodes.bottom}: ${v2 > 0 ? '+' : ''}${v2}`);
                    steps.push(`2. ${nodes.bottom} → ${nodes.right}: ${v3 > 0 ? '+' : ''}${v3} (逆向 ${edges.e3.label})`);
                    
                    highlight = ['e2', 'e3'];

                } else if (unknownKey === 'e2') {
                    // Target: Top -> Bottom
                    // Path: Top -> Right -> Bottom
                    // = (Top->Right) + (Right->Bottom)
                    
                    // 1. Top -> Right (e1)
                    const v1 = getVal('e1') * getDir('e1');

                    // 2. Right -> Bottom (e3)
                    const v3 = getVal('e3') * getDir('e3');

                    calcValue = v1 + v3;
                    
                    steps.push(`目標路徑 (Target): ${nodes.top} → ${nodes.bottom}`);
                    steps.push(`替代路徑 (Alternative): ${nodes.top} → ${nodes.right} → ${nodes.bottom}`);
                    steps.push(`1. ${nodes.top} → ${nodes.right}: ${v1}`);
                    steps.push(`2. ${nodes.right} → ${nodes.bottom}: ${v3}`);

                    highlight = ['e1', 'e3'];

                } else if (unknownKey === 'e3') {
                    // Target: Right -> Bottom
                    // Path: Right -> Top -> Bottom
                    // = (Right->Top) + (Top->Bottom)
                    
                    // 1. Right -> Top (Reverse e1)
                    const v1 = -(getVal('e1') * getDir('e1'));
                    
                    // 2. Top -> Bottom (e2)
                    const v2 = getVal('e2') * getDir('e2');

                    calcValue = v1 + v2;

                    steps.push(`目標路徑 (Target): ${nodes.right} → ${nodes.bottom}`);
                    steps.push(`替代路徑 (Alternative): ${nodes.right} → ${nodes.top} → ${nodes.bottom}`);
                    steps.push(`1. ${nodes.right} → ${nodes.top}: ${v1} (逆向 ${edges.e1.label})`);
                    steps.push(`2. ${nodes.top} → ${nodes.bottom}: ${v2}`);

                    highlight = ['e1', 'e2'];
                }
                
                // Adjust for direction of the unknown edge itself
                // If target edge is reversed (dir=-1), the calculated vector represents the 'forward' (default) geometry, 
                // so we need to divide by dir to get the value relative to the arrow shown?
                // No, the user inputs the value FOR the arrow direction.
                // The calculation above finds the vector from Start->End.
                // If the unknown arrow is pointing End->Start (dir=-1), then the value should be negated.
                
                if (getDir(unknownKey) === -1) {
                    calcValue = -calcValue;
                    steps.push(`注意：目標箭頭方向相反，結果變號。`);
                }

                setResult({ value: calcValue, steps });
                setPathHighlight(highlight);
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="recycle"></i> 赫斯定律循環解題器
                            </h1>
                            <p className="text-slate-400 text-sm">Hess's Law Cycle Solver</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => setMode('combustion')}
                                className={`px-3 py-1 rounded text-xs font-bold border transition-all ${mode === 'combustion' ? 'bg-red-500 text-white border-red-600' : 'bg-white text-slate-500'}`}
                            >
                                燃燒循環 (Combustion)
                            </button>
                            <button 
                                onClick={() => setMode('formation')}
                                className={`px-3 py-1 rounded text-xs font-bold border transition-all ${mode === 'formation' ? 'bg-green-500 text-white border-green-600' : 'bg-white text-slate-500'}`}
                            >
                                生成循環 (Formation)
                            </button>
                            <button 
                                onClick={() => setMode('generic')}
                                className={`px-3 py-1 rounded text-xs font-bold border transition-all ${mode === 'generic' ? 'bg-blue-500 text-white border-blue-600' : 'bg-white text-slate-500'}`}
                            >
                                自訂 (Custom)
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Interactive Diagram */}
                        <div className="w-full lg:w-2/3 bg-white rounded-2xl shadow-xl border border-slate-200 p-8 relative min-h-[500px] flex items-center justify-center overflow-hidden">
                            
                            {/* SVG Layer */}
                            <svg viewBox="0 0 600 400" className="absolute inset-0 w-full h-full pointer-events-none">
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
                                    </marker>
                                    <marker id="arrowhead-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
                                    </marker>
                                </defs>
                                
                                {/* E1: Top to Right */}
                                <line x1="300" y1="80" x2="500" y2="80" 
                                    className={`arrow-path ${pathHighlight.includes('e1') ? 'highlight' : ''}`} 
                                    stroke="#94a3b8" strokeWidth="2" 
                                    markerEnd={pathHighlight.includes('e1') ? "url(#arrowhead-highlight)" : "url(#arrowhead)"}
                                    /* Flip logic simulated by react state, but visually standard is L->R */
                                    transform={edges.e1.dir === -1 ? "rotate(180 400 80)" : ""}
                                />

                                {/* E2: Top to Bottom */}
                                <line x1="280" y1="100" x2="280" y2="300" 
                                    className={`arrow-path ${pathHighlight.includes('e2') ? 'highlight' : ''}`}
                                    stroke="#94a3b8" strokeWidth="2" 
                                    markerEnd={pathHighlight.includes('e2') ? "url(#arrowhead-highlight)" : "url(#arrowhead)"}
                                    transform={edges.e2.dir === -1 ? "rotate(180 280 200)" : ""}
                                />

                                {/* E3: Right to Bottom (Diagonal/Vertical-ish) */}
                                {/* Usually P -> Oxides is vertical down in Born-Haber style cycles, but let's do triangle */}
                                <line x1="480" y1="100" x2="320" y2="300" 
                                    className={`arrow-path ${pathHighlight.includes('e3') ? 'highlight' : ''}`}
                                    stroke="#94a3b8" strokeWidth="2" 
                                    markerEnd={pathHighlight.includes('e3') ? "url(#arrowhead-highlight)" : "url(#arrowhead)"}
                                    transform={edges.e3.dir === -1 ? "rotate(180 400 200)" : ""}
                                />
                            </svg>

                            {/* Nodes (Inputs) */}
                            
                            {/* Top Node */}
                            <div className="absolute top-10 left-1/2 -translate-x-1/2 z-10 w-64">
                                <input 
                                    type="text" value={nodes.top} onChange={(e) => setNodes({...nodes, top: e.target.value})}
                                    className="node-input w-full bg-blue-50 border-2 border-blue-200 text-blue-800 font-bold p-3 rounded-xl shadow-sm focus:outline-none"
                                />
                            </div>

                            {/* Right Node */}
                            <div className="absolute top-10 right-4 z-10 w-48">
                                <input 
                                    type="text" value={nodes.right} onChange={(e) => setNodes({...nodes, right: e.target.value})}
                                    className="node-input w-full bg-green-50 border-2 border-green-200 text-green-800 font-bold p-3 rounded-xl shadow-sm focus:outline-none"
                                />
                            </div>

                            {/* Bottom Node */}
                            <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-10 w-64">
                                <input 
                                    type="text" value={nodes.bottom} onChange={(e) => setNodes({...nodes, bottom: e.target.value})}
                                    className="node-input w-full bg-orange-50 border-2 border-orange-200 text-orange-800 font-bold p-3 rounded-xl shadow-sm focus:outline-none"
                                />
                            </div>

                            {/* Value Inputs (On Edges) */}
                            
                            {/* E1 Value */}
                            <div className="absolute top-14 left-[60%] z-20 flex flex-col items-center">
                                <label className="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider cursor-pointer hover:text-indigo-600" onClick={() => toggleDirection('e1')}>
                                    {edges.e1.label} <i data-lucide="refresh-cw" size={10} className="inline"/>
                                </label>
                                <input 
                                    type="number" placeholder="?" 
                                    value={edges.e1.val} onChange={(e) => handleValueChange('e1', e.target.value)}
                                    className={`val-input w-24 p-2 border rounded-lg font-mono font-bold text-center outline-none shadow-sm ${edges.e1.val === '' ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-slate-300'}`}
                                />
                            </div>

                            {/* E2 Value */}
                            <div className="absolute top-1/2 left-[280px] -translate-x-full -translate-y-1/2 pr-4 z-20 flex flex-col items-end">
                                <label className="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider cursor-pointer hover:text-indigo-600" onClick={() => toggleDirection('e2')}>
                                    {edges.e2.label} <i data-lucide="refresh-cw" size={10} className="inline"/>
                                </label>
                                <input 
                                    type="number" placeholder="?" 
                                    value={edges.e2.val} onChange={(e) => handleValueChange('e2', e.target.value)}
                                    className={`val-input w-24 p-2 border rounded-lg font-mono font-bold text-center outline-none shadow-sm ${edges.e2.val === '' ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-slate-300'}`}
                                />
                            </div>

                            {/* E3 Value */}
                            <div className="absolute top-1/2 right-[20%] z-20 flex flex-col items-center">
                                <label className="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider cursor-pointer hover:text-indigo-600" onClick={() => toggleDirection('e3')}>
                                    {edges.e3.label} <i data-lucide="refresh-cw" size={10} className="inline"/>
                                </label>
                                <input 
                                    type="number" placeholder="?" 
                                    value={edges.e3.val} onChange={(e) => handleValueChange('e3', e.target.value)}
                                    className={`val-input w-24 p-2 border rounded-lg font-mono font-bold text-center outline-none shadow-sm ${edges.e3.val === '' ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-slate-300'}`}
                                />
                            </div>

                        </div>

                        {/* Right: Controls & Solution */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 flex-grow flex flex-col">
                                <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <i data-lucide="calculator" className="text-indigo-500"/> 計算面板
                                </h3>
                                
                                <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6 text-sm text-indigo-800">
                                    <p className="font-bold mb-2"><i data-lucide="info" size={14} className="inline mr-1"/>使用說明：</p>
                                    <ul className="list-disc list-inside space-y-1 opacity-80">
                                        <li>輸入兩個已知數值 (kJ/mol)。</li>
                                        <li><strong>留空</strong>一個欄位作為未知數。</li>
                                        <li>點擊箭頭標籤可<strong>反轉方向</strong>。</li>
                                    </ul>
                                </div>

                                <button 
                                    onClick={calculate}
                                    className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-500 transition-all active:scale-95 text-lg flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="play" /> 計算未知數
                                </button>

                                {result && (
                                    <div className="mt-6 animate-in slide-in-from-bottom-4 fade-in">
                                        <div className="bg-slate-800 text-white p-5 rounded-xl shadow-md text-center mb-4 relative overflow-hidden">
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Result</div>
                                            <div className="text-4xl font-mono font-black text-green-400">
                                                {result.value > 0 ? '+' : ''}{result.value} <span className="text-lg text-white font-sans">kJ mol⁻¹</span>
                                            </div>
                                        </div>
                                        
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-600 text-xs uppercase mb-3">解題步驟 (Steps)</h4>
                                            <div className="space-y-2 text-sm font-mono text-slate-700">
                                                {result.steps.map((s, i) => (
                                                    <div key={i} className="border-b border-slate-200 pb-2 last:border-0">{s}</div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic VIII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
