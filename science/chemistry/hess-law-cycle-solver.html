<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赫斯定律循環解題器 (Hess's Law Cycle Solver)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .node-input {
            transition: all 0.2s;
            text-align: center;
        }
        .node-input:focus {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Arrow Animation */
        .arrow-path {
            transition: stroke 0.3s, stroke-width 0.3s, marker-end 0.3s;
            cursor: pointer;
        }
        .arrow-path:hover {
            stroke: #6366f1; /* Indigo-500 */
            stroke-width: 4;
        }
        .arrow-path.highlight {
            stroke: #22c55e; /* Green-500 */
            stroke-width: 4;
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .val-input {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .val-input:focus {
            background: white;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [mode, setMode] = useState('combustion'); // generic, formation, combustion
            const [nodes, setNodes] = useState({
                top: '反應物 (Reactants)',
                right: '生成物 (Products)',
                bottom: '燃燒產物 (Oxides)'
            });
            
            const [edges, setEdges] = useState({
                e1: { val: '', dir: 1, name: 'ΔH1', label: '反應焓變' }, 
                e2: { val: '', dir: 1, name: 'ΔH2', label: '反應物燃燒焓' }, 
                e3: { val: '', dir: 1, name: 'ΔH3', label: '生成物燃燒焓' }  
            });

            const [result, setResult] = useState(null);
            const [pathHighlight, setPathHighlight] = useState([]);

            useEffect(() => {
                if (mode === 'formation') {
                    setNodes({ top: '反應物 (Reactants)', right: '生成物 (Products)', bottom: '構成元素 (Elements)' });
                    setEdges({
                        e1: { ...edges.e1, val: '', dir: 1, label: '反應焓變 (ΔHr)' },
                        e2: { ...edges.e2, val: '', dir: -1, label: '反應物生成焓 (ΔHf[R])' }, 
                        e3: { ...edges.e3, val: '', dir: -1, label: '生成物生成焓 (ΔHf[P])' }  
                    });
                } else if (mode === 'combustion') {
                    setNodes({ top: '反應物 (Reactants)', right: '生成物 (Products)', bottom: '燃燒產物 (Combustion Products)' });
                    setEdges({
                        e1: { ...edges.e1, val: '', dir: 1, label: '反應焓變 (ΔHr)' },
                        e2: { ...edges.e2, val: '', dir: 1, label: '反應物燃燒焓 (ΔHc[R])' }, 
                        e3: { ...edges.e3, val: '', dir: 1, label: '生成物燃燒焓 (ΔHc[P])' }  
                    });
                } else {
                    setNodes({ top: '物質 A', right: '物質 B', bottom: '物質 C' });
                    setEdges({
                        e1: { ...edges.e1, val: '', dir: 1, label: 'ΔH1 (A → B)' },
                        e2: { ...edges.e2, val: '', dir: 1, label: 'ΔH2 (A → C)' },
                        e3: { ...edges.e3, val: '', dir: -1, label: 'ΔH3 (C → B)' } 
                    });
                }
                setResult(null);
                setPathHighlight([]);
            }, [mode]);

            const toggleDirection = (edgeKey) => {
                setEdges(prev => ({
                    ...prev,
                    [edgeKey]: { ...prev[edgeKey], dir: prev[edgeKey].dir * -1 }
                }));
                setResult(null);
                setPathHighlight([]);
            };

            const handleValueChange = (edgeKey, value) => {
                setEdges(prev => ({
                    ...prev,
                    [edgeKey]: { ...prev[edgeKey], val: value }
                }));
                setResult(null);
                setPathHighlight([]);
            };

            const calculate = () => {
                const unknownKey = Object.keys(edges).find(k => edges[k].val === '');
                const knownKeys = Object.keys(edges).filter(k => edges[k].val !== '');

                if (!unknownKey) {
                    alert("請留空一個欄位作為未知數 (Target)。");
                    return;
                }
                if (knownKeys.length < 2) {
                    alert("請至少輸入兩個已知數值。");
                    return;
                }

                let calcValue = 0;
                let steps = [];
                let highlight = [];

                const getVal = (key) => parseFloat(edges[key].val);
                const getDir = (key) => edges[key].dir; 

                // Path finding logic based on vector addition
                if (unknownKey === 'e1') { // Target: Top -> Right
                    const v2 = getVal('e2') * getDir('e2'); 
                    const v3 = -(getVal('e3') * getDir('e3')); 
                    calcValue = v2 + v3;
                    steps.push(`目標路徑: ${nodes.top} → ${nodes.right}`);
                    steps.push(`替代路徑: ${nodes.top} → ${nodes.bottom} → ${nodes.right}`);
                    steps.push(`1. ${nodes.top} → ${nodes.bottom}: ${v2 > 0 ? '+' : ''}${v2}`);
                    steps.push(`2. ${nodes.bottom} → ${nodes.right}: ${v3 > 0 ? '+' : ''}${v3}`);
                    highlight = ['e2', 'e3'];
                } else if (unknownKey === 'e2') { // Target: Top -> Bottom
                    const v1 = getVal('e1') * getDir('e1');
                    const v3 = getVal('e3') * getDir('e3');
                    calcValue = v1 + v3;
                    steps.push(`目標路徑: ${nodes.top} → ${nodes.bottom}`);
                    steps.push(`替代路徑: ${nodes.top} → ${nodes.right} → ${nodes.bottom}`);
                    steps.push(`1. ${nodes.top} → ${nodes.right}: ${v1}`);
                    steps.push(`2. ${nodes.right} → ${nodes.bottom}: ${v3}`);
                    highlight = ['e1', 'e3'];
                } else if (unknownKey === 'e3') { // Target: Right -> Bottom
                    const v1 = -(getVal('e1') * getDir('e1'));
                    const v2 = getVal('e2') * getDir('e2');
                    calcValue = v1 + v2;
                    steps.push(`目標路徑: ${nodes.right} → ${nodes.bottom}`);
                    steps.push(`替代路徑: ${nodes.right} → ${nodes.top} → ${nodes.bottom}`);
                    steps.push(`1. ${nodes.right} → ${nodes.top}: ${v1}`);
                    steps.push(`2. ${nodes.top} → ${nodes.bottom}: ${v2}`);
                    highlight = ['e1', 'e2'];
                }
                
                if (getDir(unknownKey) === -1) {
                    calcValue = -calcValue;
                    steps.push(`注意：目標箭頭方向相反，結果變號。`);
                }

                setResult({ value: calcValue, steps });
                setPathHighlight(highlight);
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-7xl space-y-6">
                    
                    {/* 1. Diagram Section (Full Width) */}
                    <div className="w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 relative min-h-[600px] flex flex-col">
                        
                        {/* Header & Tabs */}
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 z-30 relative">
                            <div>
                                <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                    <i data-lucide="recycle"></i> 赫斯定律循環解題器
                                </h1>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-xl mt-4 md:mt-0">
                                <button 
                                    onClick={() => setMode('combustion')}
                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${mode === 'combustion' ? 'bg-white text-red-600 shadow-sm ring-1 ring-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    <i data-lucide="flame" size={16}/> 燃燒循環
                                </button>
                                <button 
                                    onClick={() => setMode('formation')}
                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${mode === 'formation' ? 'bg-white text-green-600 shadow-sm ring-1 ring-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    <i data-lucide="hammer" size={16}/> 生成循環
                                </button>
                                <button 
                                    onClick={() => setMode('generic')}
                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${mode === 'generic' ? 'bg-white text-blue-600 shadow-sm ring-1 ring-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    <i data-lucide="edit-3" size={16}/> 自訂
                                </button>
                            </div>
                        </div>

                        {/* Interactive Diagram */}
                        <div className="relative flex-grow w-full flex items-center justify-center">
                            <svg viewBox="0 0 800 450" className="absolute inset-0 w-full h-full pointer-events-none z-0">
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
                                    </marker>
                                    <marker id="arrowhead-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
                                    </marker>
                                </defs>
                                
                                {/* E1: Left to Right */}
                                <line x1="250" y1="100" x2="550" y2="100" 
                                    className={`arrow-path ${pathHighlight.includes('e1') ? 'highlight' : ''}`} 
                                    stroke="#94a3b8" strokeWidth="3" 
                                    markerEnd={pathHighlight.includes('e1') ? "url(#arrowhead-highlight)" : "url(#arrowhead)"}
                                    transform={edges.e1.dir === -1 ? "rotate(180 400 100)" : ""}
                                />

                                {/* E2: Left to Bottom */}
                                <line x1="200" y1="140" x2="350" y2="350" 
                                    className={`arrow-path ${pathHighlight.includes('e2') ? 'highlight' : ''}`}
                                    stroke="#94a3b8" strokeWidth="3" 
                                    markerEnd={pathHighlight.includes('e2') ? "url(#arrowhead-highlight)" : "url(#arrowhead)"}
                                    transform={edges.e2.dir === -1 ? "rotate(180 275 245)" : ""}
                                />

                                {/* E3: Right to Bottom */}
                                <line x1="600" y1="140" x2="450" y2="350" 
                                    className={`arrow-path ${pathHighlight.includes('e3') ? 'highlight' : ''}`}
                                    stroke="#94a3b8" strokeWidth="3" 
                                    markerEnd={pathHighlight.includes('e3') ? "url(#arrowhead-highlight)" : "url(#arrowhead)"}
                                    transform={edges.e3.dir === -1 ? "rotate(180 525 245)" : ""}
                                />
                            </svg>

                            {/* Node Inputs */}
                            <div className="absolute top-16 left-[10%] z-10 w-64">
                                <input type="text" value={nodes.top} onChange={(e) => setNodes({...nodes, top: e.target.value})}
                                    className="node-input w-full bg-blue-50 border-2 border-blue-200 text-blue-800 font-bold p-4 rounded-2xl shadow-sm focus:outline-none placeholder-blue-300"/>
                            </div>
                            <div className="absolute top-16 right-[10%] z-10 w-64">
                                <input type="text" value={nodes.right} onChange={(e) => setNodes({...nodes, right: e.target.value})}
                                    className="node-input w-full bg-green-50 border-2 border-green-200 text-green-800 font-bold p-4 rounded-2xl shadow-sm focus:outline-none placeholder-green-300"/>
                            </div>
                            <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-10 w-80">
                                <input type="text" value={nodes.bottom} onChange={(e) => setNodes({...nodes, bottom: e.target.value})}
                                    className="node-input w-full bg-orange-50 border-2 border-orange-200 text-orange-800 font-bold p-4 rounded-2xl shadow-sm focus:outline-none placeholder-orange-300"/>
                            </div>

                            {/* Value Inputs (Positioned on lines) */}
                            
                            {/* E1 Input (Center Top) */}
                            <div className="absolute top-[70px] left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
                                <label className="text-xs text-slate-500 font-bold mb-1 bg-white/80 px-2 rounded backdrop-blur-sm cursor-pointer hover:text-indigo-600 flex items-center gap-1" onClick={() => toggleDirection('e1')}>
                                    {edges.e1.label} <i data-lucide="refresh-cw" size={10}/>
                                </label>
                                <input type="number" placeholder="?" value={edges.e1.val} onChange={(e) => handleValueChange('e1', e.target.value)}
                                    className={`val-input w-28 p-2 border-2 rounded-xl font-mono font-bold text-center outline-none text-lg shadow-sm ${edges.e1.val === '' ? 'border-indigo-400 bg-indigo-50' : 'border-slate-300'}`}/>
                            </div>

                            {/* E2 Input (Left Diagonal) */}
                            <div className="absolute top-[220px] left-[25%] -translate-x-1/2 z-20 flex flex-col items-end">
                                <label className="text-xs text-slate-500 font-bold mb-1 bg-white/80 px-2 rounded backdrop-blur-sm cursor-pointer hover:text-indigo-600 flex items-center gap-1" onClick={() => toggleDirection('e2')}>
                                    {edges.e2.label} <i data-lucide="refresh-cw" size={10}/>
                                </label>
                                <input type="number" placeholder="?" value={edges.e2.val} onChange={(e) => handleValueChange('e2', e.target.value)}
                                    className={`val-input w-28 p-2 border-2 rounded-xl font-mono font-bold text-center outline-none text-lg shadow-sm ${edges.e2.val === '' ? 'border-indigo-400 bg-indigo-50' : 'border-slate-300'}`}/>
                            </div>

                            {/* E3 Input (Right Diagonal) */}
                            <div className="absolute top-[220px] left-[75%] -translate-x-1/2 z-20 flex flex-col items-start">
                                <label className="text-xs text-slate-500 font-bold mb-1 bg-white/80 px-2 rounded backdrop-blur-sm cursor-pointer hover:text-indigo-600 flex items-center gap-1" onClick={() => toggleDirection('e3')}>
                                    {edges.e3.label} <i data-lucide="refresh-cw" size={10}/>
                                </label>
                                <input type="number" placeholder="?" value={edges.e3.val} onChange={(e) => handleValueChange('e3', e.target.value)}
                                    className={`val-input w-28 p-2 border-2 rounded-xl font-mono font-bold text-center outline-none text-lg shadow-sm ${edges.e3.val === '' ? 'border-indigo-400 bg-indigo-50' : 'border-slate-300'}`}/>
                            </div>

                        </div>
                    </div>

                    {/* 2. Controls Section (Full Width) */}
                    <div className="w-full bg-white p-6 rounded-3xl shadow-md border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-6">
                        <div className="flex-grow">
                            <h3 className="font-bold text-slate-700 flex items-center gap-2 mb-2">
                                <i data-lucide="info" className="text-indigo-500"/> 操作說明
                            </h3>
                            <ul className="list-disc list-inside text-sm text-slate-500 space-y-1">
                                <li>輸入兩個已知數值 (kJ/mol)，<strong>留空</strong>一個作為未知數。</li>
                                <li>點擊圖中數值上方的標籤可<strong>反轉箭頭方向</strong>。</li>
                            </ul>
                        </div>
                        <button 
                            onClick={calculate}
                            className="w-full md:w-auto px-12 py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-500 transition-all active:scale-95 text-lg flex items-center justify-center gap-2"
                        >
                            <i data-lucide="calculator" /> 計算未知數
                        </button>
                    </div>

                    {/* 3. Results Section (Full Width, only if result exists) */}
                    {result && (
                        <div className="w-full bg-white p-8 rounded-3xl shadow-lg border border-slate-200 animate-in slide-in-from-bottom-4 fade-in">
                            <div className="flex flex-col md:flex-row gap-8 items-center">
                                {/* Big Result Number */}
                                <div className="w-full md:w-1/3 bg-slate-800 text-white p-8 rounded-2xl shadow-md text-center relative overflow-hidden">
                                    <div className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Calculated Result</div>
                                    <div className="text-5xl font-mono font-black text-green-400">
                                        {result.value > 0 ? '+' : ''}{result.value}
                                    </div>
                                    <div className="text-lg text-slate-500 mt-1">kJ mol⁻¹</div>
                                    <div className="absolute top-0 right-0 p-4 opacity-10">
                                        <i data-lucide="check-circle" size={64} />
                                    </div>
                                </div>
                                
                                {/* Steps List */}
                                <div className="w-full md:w-2/3 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                    <h4 className="font-bold text-slate-700 text-sm uppercase mb-4 flex items-center gap-2">
                                        <i data-lucide="list-ordered" size={16}/> 解題步驟 (Solution Steps)
                                    </h4>
                                    <div className="space-y-3 text-sm font-mono text-slate-600">
                                        {result.steps.map((s, i) => (
                                            <div key={i} className="border-b border-slate-200 pb-2 last:border-0 flex gap-3">
                                                <span className="text-indigo-500 font-bold flex-shrink-0">{i+1}.</span>
                                                <span>{s}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic VIII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
