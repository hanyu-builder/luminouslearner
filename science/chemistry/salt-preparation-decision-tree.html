<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹽製備決策樹 (Salt Preparation Guide)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Flow Chart Animation */
        .node-enter { animation: fade-in-up 0.5s ease-out forwards; }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Lab Animation Keyframes */
        @keyframes drip {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(80px) scale(0.5); opacity: 0; }
        }
        .anim-drip { animation: drip 1s infinite ease-in; }
        
        @keyframes swirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes precipitate {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .anim-ppt { animation: precipitate 2s ease-out forwards; }

        /* Patterns */
        .pattern-dots {
            background-image: radial-gradient(#94a3b8 1.5px, transparent 1.5px);
            background-size: 6px 6px;
        }
        .pattern-lines {
            background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 5px, #f1f5f9 5px, #f1f5f9 10px);
        }

        /* Tool Button Hover */
        .tool-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Data Sets ---
        const SolubilityRules = [
            { id: 1, rule: '硝酸鹽 (Nitrates)', status: 'All Soluble', desc: '所有硝酸鹽皆可溶於水，無例外。' },
            { id: 2, rule: '鹼金屬鹽 (Group 1)', status: 'All Soluble', desc: '所有 Group 1 金屬 (Li+, Na+, K+) 及銨鹽 (NH4+) 皆可溶。' },
            { id: 3, rule: '氯化物 (Chlorides)', status: 'Mostly Soluble', desc: '例外：AgCl, PbCl₂ (冷水不溶)' },
            { id: 4, rule: '硫酸鹽 (Sulphates)', status: 'Mostly Soluble', desc: '例外：BaSO₄, PbSO₄, CaSO₄ (微溶)' },
            { id: 5, rule: '碳酸鹽 (Carbonates)', status: 'Mostly Insoluble', desc: '例外：Na⁺, K⁺, NH₄⁺ 的碳酸鹽可溶。' },
            { id: 6, rule: '氫氧化物 (Hydroxides)', status: 'Mostly Insoluble', desc: '例外：Na⁺, K⁺, NH₄⁺ 可溶; Ca(OH)₂ 微溶。' }
        ];

        const CommonSalts = [
            { name: '氯化鈉 (NaCl)', f: 'NaCl', soluble: true },
            { name: '硝酸銀 (AgNO3)', f: 'AgNO3', soluble: true },
            { name: '氯化銀 (AgCl)', f: 'AgCl', soluble: false },
            { name: '硫酸銅 (CuSO4)', f: 'CuSO4', soluble: true },
            { name: '碳酸鈣 (CaCO3)', f: 'CaCO3', soluble: false },
            { name: '硫酸鋇 (BaSO4)', f: 'BaSO4', soluble: false },
            { name: '氫氧化鈉 (NaOH)', f: 'NaOH', soluble: true },
            { name: '氫氧化銅 (Cu(OH)2)', f: 'Cu(OH)2', soluble: false },
            { name: '碳酸鈉 (Na2CO3)', f: 'Na2CO3', soluble: true },
            { name: '氯化鉛 (PbCl2)', f: 'PbCl2', soluble: false }
        ];

        const Cations = [
            { label: 'Na⁺', val: 'Na' }, { label: 'K⁺', val: 'K' }, { label: 'NH₄⁺', val: 'NH4' },
            { label: 'Mg²⁺', val: 'Mg' }, { label: 'Ca²⁺', val: 'Ca' }, { label: 'Ba²⁺', val: 'Ba' },
            { label: 'Zn²⁺', val: 'Zn' }, { label: 'Cu²⁺', val: 'Cu' }, { label: 'Ag⁺', val: 'Ag' }, { label: 'Pb²⁺', val: 'Pb' }
        ];
        const Anions = [
            { label: 'NO₃⁻', val: 'NO3' }, { label: 'Cl⁻', val: 'Cl' }, { label: 'SO₄²⁻', val: 'SO4' },
            { label: 'CO₃²⁻', val: 'CO3' }, { label: 'OH⁻', val: 'OH' }
        ];

        const Methods = {
            titration: {
                id: 'titration',
                name: '滴定法 (Titration)',
                desc: '用於製備可溶性鹽 (特別是 K, Na, NH₄ 鹽)。',
                steps: ['將酸加入滴定管', '將鹼加入錐形瓶', '加入指示劑', '滴定至變色', '記錄體積', '不加指示劑重複實驗', '結晶']
            },
            excess: {
                id: 'excess',
                name: '過量試劑法 (Excess Reagent)',
                desc: '用於製備可溶性鹽 (非 K, Na, NH₄)。',
                steps: ['加熱酸 (如需要)', '加入過量固體 (M/MO/MCO3)', '攪拌至不再溶解', '過濾除去多餘固體', '加熱濾液濃縮', '結晶']
            },
            precipitation: {
                id: 'precipitation',
                name: '沉澱法 (Precipitation)',
                desc: '用於製備不可溶性鹽。',
                steps: ['混合兩種可溶性溶液', '攪拌', '過濾分離沉澱', '用蒸餾水洗滌沉澱', '乾燥']
            }
        };

        const App = () => {
            const [mode, setMode] = useState('tree'); 
            const [step, setStep] = useState(0); 
            const [path, setPath] = useState([]); 
            const [resultMethod, setResultMethod] = useState(null);
            
            const [activeTool, setActiveTool] = useState('rules');
            const [searchTerm, setSearchTerm] = useState('');
            const [checkCat, setCheckCat] = useState(Cations[0]);
            const [checkAn, setCheckAn] = useState(Anions[0]);

            const resetTree = () => {
                setStep(0);
                setPath([]);
                setResultMethod(null);
            };

            const handleAnswer = (answer, nextStep) => {
                setPath([...path, answer]);
                if (typeof nextStep === 'string') {
                    setResultMethod(Methods[nextStep]);
                } else {
                    setStep(nextStep);
                }
            };

            const checkSolubilityResult = useMemo(() => {
                const c = checkCat.val;
                const a = checkAn.val;
                if (['Na', 'K', 'NH4'].includes(c) || a === 'NO3') return { soluble: true, reason: 'Always Soluble' };
                if (a === 'Cl' && ['Ag', 'Pb'].includes(c)) return { soluble: false, reason: 'Insoluble Chloride' };
                if (a === 'SO4' && ['Ba', 'Pb', 'Ca'].includes(c)) return { soluble: false, reason: 'Insoluble Sulphate' };
                if ((a === 'CO3' || a === 'OH') && !['Na', 'K', 'NH4'].includes(c)) return { soluble: false, reason: 'Insoluble Carbonate/Hydroxide' };
                return { soluble: true, reason: 'Soluble' };
            }, [checkCat, checkAn]);

            // --- Visual Components ---

            const renderMethodVisual = () => {
                if (!resultMethod) return null;
                const isTitration = resultMethod.id === 'titration';
                const isExcess = resultMethod.id === 'excess';
                const isPrecipitation = resultMethod.id === 'precipitation';

                return (
                    <div className="animate-in zoom-in duration-500">
                        <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-indigo-100 mb-6">
                            <div className="text-center mb-8">
                                <div className="inline-block bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full text-sm font-bold mb-2">推薦方法</div>
                                <h2 className="text-3xl font-bold text-slate-800">{resultMethod.name}</h2>
                                <p className="text-slate-500 mt-2">{resultMethod.desc}</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {/* Diagram Area */}
                                <div className="bg-slate-50 rounded-2xl border border-slate-200 h-64 relative flex items-center justify-center overflow-hidden p-4">
                                    
                                    {isTitration && (
                                        <div className="relative flex flex-col items-center">
                                            {/* Burette */}
                                            <div className="w-6 h-32 border-x-2 border-b-2 border-slate-400 rounded-b-sm bg-white relative mb-1">
                                                <div className="absolute bottom-0 w-full h-2/3 bg-purple-200/50"></div>
                                                {/* Lines */}
                                                <div className="absolute top-4 right-0 w-2 h-px bg-slate-400"></div>
                                                <div className="absolute top-8 right-0 w-2 h-px bg-slate-400"></div>
                                            </div>
                                            <div className="w-1 h-4 bg-slate-400"></div>
                                            
                                            {/* Drop */}
                                            <div className="absolute top-[140px] w-2 h-2 bg-purple-300 rounded-full anim-drip"></div>

                                            {/* Flask */}
                                            <div className="w-20 h-24 border-2 border-slate-400 rounded-b-xl relative bg-white mt-8 flex items-end justify-center overflow-hidden">
                                                <div className="w-full h-1/3 bg-pink-100 animate-pulse"></div>
                                            </div>
                                            <div className="absolute top-10 right-[-60px] text-xs bg-white shadow px-2 py-1 rounded text-slate-500">滴定管</div>
                                        </div>
                                    )}

                                    {isExcess && (
                                        <div className="flex items-center gap-4">
                                            {/* Beaker with Residue */}
                                            <div className="relative flex flex-col items-center">
                                                <div className="w-20 h-28 border-2 border-slate-400 border-t-0 rounded-b-lg bg-white relative overflow-hidden">
                                                    <div className="absolute bottom-0 w-full h-2/3 bg-blue-100"></div>
                                                    <div className="absolute bottom-0 w-full h-4 bg-slate-600 pattern-dots"></div>
                                                    {/* Stirring Rod */}
                                                    <div className="absolute top-[-10px] left-10 w-1 h-36 bg-slate-300 transform rotate-12"></div>
                                                </div>
                                                <span className="text-xs mt-2 font-bold text-slate-500">過量固體</span>
                                            </div>
                                            <i data-lucide="arrow-right" className="text-slate-300"/>
                                            {/* Funnel */}
                                            <div className="relative flex flex-col items-center">
                                                <div className="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[30px] border-t-slate-200 relative">
                                                    <div className="absolute -top-[30px] -left-[16px] w-[32px] h-[4px] bg-white border-t border-slate-300"></div>
                                                </div>
                                                <div className="w-1 h-12 bg-slate-200"></div>
                                                <div className="w-16 h-20 border-2 border-slate-400 border-t-0 rounded-b-lg bg-white mt-[-10px] -z-10 relative overflow-hidden">
                                                    <div className="absolute bottom-0 w-full h-1/2 bg-blue-100"></div>
                                                </div>
                                                <span className="text-xs mt-2 font-bold text-slate-500">過濾</span>
                                            </div>
                                        </div>
                                    )}

                                    {isPrecipitation && (
                                        <div className="relative flex items-center gap-2">
                                            {/* Mixing two beakers */}
                                            <div className="w-14 h-20 border-2 border-slate-400 border-t-0 rounded-b-md bg-white relative overflow-hidden">
                                                <div className="absolute bottom-0 w-full h-2/3 bg-yellow-100"></div>
                                            </div>
                                            <div className="text-2xl text-slate-300">+</div>
                                            <div className="w-14 h-20 border-2 border-slate-400 border-t-0 rounded-b-md bg-white relative overflow-hidden">
                                                <div className="absolute bottom-0 w-full h-2/3 bg-blue-100"></div>
                                            </div>
                                            <i data-lucide="arrow-right" className="text-slate-400"/>
                                            {/* Precipitate */}
                                            <div className="w-16 h-24 border-2 border-slate-400 border-t-0 rounded-b-md bg-white relative overflow-hidden shadow-sm">
                                                <div className="absolute bottom-0 w-full h-2/3 bg-green-50/50"></div>
                                                <div className="absolute bottom-0 w-full h-10 bg-green-200 pattern-dots anim-ppt"></div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Steps */}
                                <div>
                                    <h4 className="font-bold text-slate-700 mb-3 flex items-center gap-2"><i data-lucide="clipboard-list" size={18}/> 實驗步驟</h4>
                                    <ul className="space-y-2">
                                        {resultMethod.steps.map((s, i) => (
                                            <li key={i} className="flex items-start gap-3 text-sm text-slate-600">
                                                <span className="bg-indigo-100 text-indigo-600 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">{i+1}</span>
                                                <span>{s}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <button onClick={resetTree} className="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold shadow-lg hover:bg-slate-700 flex items-center justify-center gap-2 text-lg transition-all active:scale-95">
                            <i data-lucide="rotate-ccw" /> 重新選擇
                        </button>
                    </div>
                );
            };

            const renderDecisionTree = () => {
                if (resultMethod) return renderMethodVisual();

                if (step === 0) {
                    return (
                        <div className="text-center node-enter py-10">
                            <h3 className="text-3xl font-bold text-slate-700 mb-12">你要製備的鹽是可溶的嗎？</h3>
                            <div className="flex justify-center gap-8">
                                <button onClick={() => handleAnswer('可溶 (Soluble)', 1)} className="group w-48 py-6 bg-white border-2 border-green-500 text-green-600 rounded-3xl font-bold shadow-lg hover:bg-green-500 hover:text-white transition-all hover:-translate-y-1">
                                    <div className="text-4xl mb-2 group-hover:scale-110 transition-transform">💧</div>
                                    <div className="text-xl">是 (Yes)</div>
                                </button>
                                <button onClick={() => handleAnswer('不可溶 (Insoluble)', 'precipitation')} className="group w-48 py-6 bg-white border-2 border-red-500 text-red-600 rounded-3xl font-bold shadow-lg hover:bg-red-500 hover:text-white transition-all hover:-translate-y-1">
                                    <div className="text-4xl mb-2 group-hover:scale-110 transition-transform">🧱</div>
                                    <div className="text-xl">否 (No)</div>
                                </button>
                            </div>
                            <p className="mt-8 text-slate-400">如果不確定，請使用上方的「溶解度規則」或「查閱鹽類」。</p>
                        </div>
                    );
                }
                if (step === 1) {
                    return (
                        <div className="text-center node-enter py-10">
                            <h3 className="text-3xl font-bold text-slate-700 mb-12">含有 K⁺, Na⁺ 或 NH₄⁺ 離子嗎？</h3>
                            <div className="flex justify-center gap-8">
                                <button onClick={() => handleAnswer('含 K/Na/NH4', 'titration')} className="group w-48 py-6 bg-white border-2 border-blue-500 text-blue-600 rounded-3xl font-bold shadow-lg hover:bg-blue-500 hover:text-white transition-all hover:-translate-y-1">
                                    <div className="text-4xl mb-2 group-hover:scale-110 transition-transform">🧪</div>
                                    <div className="text-xl">是 (Yes)</div>
                                </button>
                                <button onClick={() => handleAnswer('其他陽離子', 'excess')} className="group w-48 py-6 bg-white border-2 border-orange-500 text-orange-600 rounded-3xl font-bold shadow-lg hover:bg-orange-500 hover:text-white transition-all hover:-translate-y-1">
                                    <div className="text-4xl mb-2 group-hover:scale-110 transition-transform">🔥</div>
                                    <div className="text-xl">否 (No)</div>
                                </button>
                            </div>
                        </div>
                    );
                }
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-4xl">
                    
                    {/* Top Nav */}
                    <div className="flex justify-center gap-4 mb-8">
                        <button onClick={() => setMode('tree')} className={`px-6 py-3 rounded-full font-bold shadow-sm transition-all flex items-center gap-2 ${mode === 'tree' ? 'bg-indigo-600 text-white ring-2 ring-indigo-300' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>
                            <i data-lucide="git-fork"/> 決策樹 (Guide)
                        </button>
                        <button onClick={() => setMode('tools')} className={`px-6 py-3 rounded-full font-bold shadow-sm transition-all flex items-center gap-2 ${mode === 'tools' ? 'bg-indigo-600 text-white ring-2 ring-indigo-300' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>
                            <i data-lucide="database"/> 溶解度工具 (Tools)
                        </button>
                    </div>

                    {/* Content Area */}
                    <div className="flex-grow">
                        {mode === 'tree' ? renderDecisionTree() : (
                            // Tools View
                            <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                                <div className="flex border-b border-slate-200 bg-slate-50">
                                    {['rules', 'search', 'checker'].map(t => (
                                        <button key={t} onClick={() => setActiveTool(t)} className={`flex-1 py-4 font-bold text-xs md:text-sm flex items-center justify-center gap-2 uppercase ${activeTool === t ? 'bg-white text-indigo-600 border-t-4 border-indigo-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                            {t === 'rules' && '📜 規則'}
                                            {t === 'search' && '🔍 搜尋'}
                                            {t === 'checker' && '✅ 檢查器'}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex-grow overflow-y-auto p-6 bg-slate-50/50">
                                    {activeTool === 'rules' && (
                                        <div className="space-y-3">
                                            {SolubilityRules.map((r, i) => (
                                                <div key={i} className={`p-4 rounded-xl border-l-4 bg-white shadow-sm ${r.status.includes('Insoluble') ? 'border-red-400' : 'border-green-400'}`}>
                                                    <div className="font-bold text-slate-800">{r.rule}</div>
                                                    <div className="text-xs text-slate-500 mt-1">{r.desc}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {activeTool === 'search' && (
                                        <div className="h-full flex flex-col">
                                            <input type="text" placeholder="輸入名稱或化學式 (e.g. AgCl)..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none mb-4" />
                                            <div className="space-y-2 flex-grow overflow-y-auto">
                                                {CommonSalts.filter(s => s.name.includes(searchTerm) || s.f.toLowerCase().includes(searchTerm.toLowerCase())).map((s, i) => (
                                                    <div key={i} className="flex justify-between items-center p-3 bg-white rounded-lg border border-slate-200">
                                                        <div><div className="font-bold text-slate-700">{s.name}</div><div className="text-xs text-slate-400">{s.f}</div></div>
                                                        <span className={`text-xs font-bold px-2 py-1 rounded ${s.soluble ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{s.soluble ? '可溶' : '不可溶'}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    {activeTool === 'checker' && (
                                        <div className="flex flex-col items-center justify-center h-full gap-6">
                                            <div className="flex gap-4 w-full max-w-md">
                                                <select onChange={e => setCheckCat(Cations.find(c => c.val === e.target.value))} className="flex-1 p-3 rounded-xl border-2 border-slate-300 font-bold text-slate-700 outline-none focus:border-indigo-500">{Cations.map(c => <option key={c.val} value={c.val}>{c.label}</option>)}</select>
                                                <select onChange={e => setCheckAn(Anions.find(a => a.val === e.target.value))} className="flex-1 p-3 rounded-xl border-2 border-slate-300 font-bold text-slate-700 outline-none focus:border-indigo-500">{Anions.map(a => <option key={a.val} value={a.val}>{a.label}</option>)}</select>
                                            </div>
                                            <div className={`w-full max-w-md p-6 rounded-2xl text-center border-4 border-double transition-all duration-500 ${checkSolubilityResult.soluble ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                                <div className="text-5xl mb-4">{checkSolubilityResult.soluble ? '💧' : '🧱'}</div>
                                                <h3 className={`text-3xl font-black mb-2 ${checkSolubilityResult.soluble ? 'text-green-600' : 'text-red-600'}`}>{checkSolubilityResult.soluble ? '可溶 (Soluble)' : '不可溶 (Insoluble)'}</h3>
                                                <p className="text-slate-500 font-medium">{checkSolubilityResult.reason}</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
