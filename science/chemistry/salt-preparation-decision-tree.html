<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹽製備決策樹 (Salt Preparation Guide)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Flow Chart Animation */
        .node-enter { animation: fade-in-up 0.5s ease-out forwards; }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Lab Animation */
        @keyframes drip {
            0% { top: 0; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .drip { animation: drip 1s infinite; }
        
        @keyframes swirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .swirl { animation: swirl 3s linear infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Solubility Rules Data
        const SolubilityRules = [
            { rule: '所有 硝酸鹽 (Nitrates)', soluble: true },
            { rule: '所有 鈉、鉀、銨鹽 (Na+, K+, NH4+)', soluble: true },
            { rule: '大部分 氯化物 (Chlorides)', soluble: true, except: 'AgCl, PbCl₂ (insoluble)' },
            { rule: '大部分 硫酸鹽 (Sulphates)', soluble: true, except: 'BaSO₄, PbSO₄, CaSO₄ (insoluble)' },
            { rule: '大部分 碳酸鹽 (Carbonates)', soluble: false, except: 'Na, K, NH4 salts (soluble)' },
            { rule: '大部分 氫氧化物 (Hydroxides)', soluble: false, except: 'Na, K, NH4 salts (soluble)' }
        ];

        // Methods Data
        const Methods = {
            titration: {
                id: 'titration',
                name: '滴定法 (Titration)',
                desc: '用於製備可溶性鹽 (特別是 K, Na, NH₄ 鹽)。反應物均為溶液。',
                steps: ['將酸加入滴定管', '將鹼加入錐形瓶', '加入指示劑', '滴定至變色', '記錄體積', '不加指示劑重複實驗', '結晶']
            },
            excess: {
                id: 'excess',
                name: '過量試劑法 (Excess Reagent)',
                desc: '用於製備可溶性鹽 (非 K, Na, NH₄)。反應物之一為不溶性固體 (金屬/氧化物/碳酸鹽)。',
                steps: ['加熱酸 (如需要)', '加入過量固體', '攪拌至不再溶解', '過濾除去多餘固體', '加熱濾液濃縮', '結晶']
            },
            precipitation: {
                id: 'precipitation',
                name: '沉澱法 (Precipitation)',
                desc: '用於製備不可溶性鹽。混合兩種可溶性鹽溶液。',
                steps: ['混合兩種溶液', '攪拌', '過濾分離沉澱', '用蒸餾水洗滌沉澱', '乾燥']
            }
        };

        const App = () => {
            const [step, setStep] = useState(0); // 0: Start, 1: Q1, 2: Q2...
            const [path, setPath] = useState([]); 
            const [resultMethod, setResultMethod] = useState(null);
            const [showRules, setShowRules] = useState(false);

            const reset = () => {
                setStep(0);
                setPath([]);
                setResultMethod(null);
            };

            const handleAnswer = (answer, nextStep) => {
                setPath([...path, answer]);
                if (typeof nextStep === 'string') {
                    // It's a result
                    setResultMethod(Methods[nextStep]);
                } else {
                    setStep(nextStep);
                }
            };

            // Decision Tree Logic
            const renderDecision = () => {
                if (resultMethod) return null;

                if (step === 0) {
                    return (
                        <div className="text-center node-enter">
                            <h3 className="text-xl font-bold text-slate-700 mb-6">你要製備的鹽是可溶的嗎？(Is the salt soluble?)</h3>
                            <div className="flex justify-center gap-4">
                                <button onClick={() => handleAnswer('可溶 (Soluble)', 1)} className="px-8 py-4 bg-green-500 text-white rounded-xl font-bold shadow-lg hover:bg-green-600 transition-transform hover:scale-105">
                                    是 (Yes)
                                </button>
                                <button onClick={() => handleAnswer('不可溶 (Insoluble)', 'precipitation')} className="px-8 py-4 bg-red-500 text-white rounded-xl font-bold shadow-lg hover:bg-red-600 transition-transform hover:scale-105">
                                    否 (No)
                                </button>
                            </div>
                            <p className="mt-4 text-sm text-slate-400">如果不確定，請點擊右上角查看溶解度規則。</p>
                        </div>
                    );
                }

                if (step === 1) {
                    return (
                        <div className="text-center node-enter">
                            <h3 className="text-xl font-bold text-slate-700 mb-6">這種鹽含有 鉀 (K⁺)、鈉 (Na⁺) 或 銨 (NH₄⁺) 離子嗎？</h3>
                            <div className="flex justify-center gap-4">
                                <button onClick={() => handleAnswer('含 K/Na/NH4', 'titration')} className="px-8 py-4 bg-blue-500 text-white rounded-xl font-bold shadow-lg hover:bg-blue-600 transition-transform hover:scale-105">
                                    是 (Yes)
                                </button>
                                <button onClick={() => handleAnswer('其他陽離子', 'excess')} className="px-8 py-4 bg-orange-500 text-white rounded-xl font-bold shadow-lg hover:bg-orange-600 transition-transform hover:scale-105">
                                    否 (No)
                                </button>
                            </div>
                        </div>
                    );
                }
            };

            // Method Visualizer
            const renderMethodVisual = () => {
                if (!resultMethod) return null;

                const isTitration = resultMethod.id === 'titration';
                const isExcess = resultMethod.id === 'excess';
                const isPrecipitation = resultMethod.id === 'precipitation';

                return (
                    <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-indigo-100 animate-in zoom-in duration-500">
                        <div className="text-center mb-8">
                            <div className="inline-block bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full text-sm font-bold mb-2">推薦方法</div>
                            <h2 className="text-3xl font-bold text-slate-800">{resultMethod.name}</h2>
                            <p className="text-slate-500 mt-2">{resultMethod.desc}</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {/* Animation Area */}
                            <div className="bg-slate-50 rounded-2xl border border-slate-200 h-64 relative flex items-center justify-center overflow-hidden">
                                
                                {isTitration && (
                                    <div className="relative flex flex-col items-center">
                                        <div className="w-4 h-32 bg-white border-2 border-slate-400 border-t-0 relative">
                                            <div className="absolute bottom-0 w-full h-1/2 bg-purple-200"></div>
                                        </div>
                                        <div className="w-1 h-4 bg-slate-400"></div>
                                        <div className="w-1 h-20 border-l-2 border-dashed border-blue-300 absolute top-36 drip"></div>
                                        <div className="w-20 h-24 border-2 border-slate-400 border-t-0 rounded-b-xl mt-4 relative bg-white">
                                            <div className="absolute bottom-0 w-full h-1/3 bg-pink-200 transition-colors duration-1000 animate-pulse"></div>
                                        </div>
                                        <div className="absolute top-10 right-[-80px] text-xs text-slate-500 bg-white p-1 rounded shadow">酸/鹼滴定</div>
                                    </div>
                                )}

                                {isExcess && (
                                    <div className="relative flex flex-col items-center">
                                        <div className="w-24 h-32 border-2 border-slate-400 border-t-0 rounded-b-xl relative bg-white overflow-hidden">
                                            <div className="absolute bottom-0 w-full h-2/3 bg-blue-100"></div>
                                            {/* Excess Solid */}
                                            <div className="absolute bottom-0 w-full h-4 bg-slate-600 opacity-80"></div>
                                            {/* Stirring */}
                                            <div className="absolute top-[-20px] left-10 w-2 h-40 bg-slate-300 transform rotate-12 swirl origin-top"></div>
                                        </div>
                                        <div className="absolute bottom-2 text-xs font-bold text-slate-600">過量固體沉底</div>
                                    </div>
                                )}

                                {isPrecipitation && (
                                    <div className="relative flex items-center gap-2">
                                        <div className="w-16 h-24 border-2 border-slate-400 border-t-0 rounded-b-lg bg-white relative overflow-hidden">
                                            <div className="absolute bottom-0 w-full h-1/2 bg-yellow-100"></div>
                                        </div>
                                        <i data-lucide="plus" className="text-slate-400"/>
                                        <div className="w-16 h-24 border-2 border-slate-400 border-t-0 rounded-b-lg bg-white relative overflow-hidden">
                                            <div className="absolute bottom-0 w-full h-1/2 bg-blue-100"></div>
                                        </div>
                                        <i data-lucide="arrow-right" className="text-slate-400"/>
                                        <div className="w-16 h-24 border-2 border-slate-400 border-t-0 rounded-b-lg bg-white relative overflow-hidden">
                                            <div className="absolute bottom-0 w-full h-3/4 bg-green-100 opacity-50"></div>
                                            <div className="absolute bottom-0 w-full h-8 bg-white border-t border-slate-300 pattern-dots"></div>
                                        </div>
                                        <div className="absolute bottom-[-30px] right-0 text-xs font-bold text-slate-600">沉澱生成</div>
                                    </div>
                                )}

                            </div>

                            {/* Steps List */}
                            <div className="flex flex-col justify-center">
                                <h4 className="font-bold text-slate-700 mb-3 flex items-center gap-2">
                                    <i data-lucide="list-ordered" size={18} /> 實驗步驟
                                </h4>
                                <ul className="space-y-2">
                                    {resultMethod.steps.map((s, i) => (
                                        <li key={i} className="flex items-start gap-3 text-sm text-slate-600">
                                            <span className="bg-indigo-100 text-indigo-600 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">{i+1}</span>
                                            <span>{s}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        <div className="mt-8 text-center">
                            <button onClick={reset} className="px-6 py-3 bg-slate-800 text-white rounded-full font-bold shadow-lg hover:bg-slate-700 transition-all flex items-center gap-2 mx-auto">
                                <i data-lucide="rotate-ccw" size={18} /> 重新選擇
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-4xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="git-fork"></i> 鹽製備決策樹
                            </h1>
                            <p className="text-slate-400 text-sm">Salt Preparation Decision Tree</p>
                        </div>
                        <button 
                            onClick={() => setShowRules(!showRules)}
                            className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${showRules ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-600 border border-indigo-200'}`}
                        >
                            <i data-lucide="book-open" size={16} /> 溶解度規則
                        </button>
                    </div>

                    <div className="flex-grow relative">
                        
                        {/* Rules Modal/Overlay */}
                        {showRules && (
                            <div className="absolute top-0 right-0 z-20 w-full md:w-80 bg-white p-5 rounded-xl shadow-2xl border border-slate-200 animate-in fade-in slide-in-from-top-5">
                                <div className="flex justify-between items-center mb-3 border-b pb-2">
                                    <h3 className="font-bold text-slate-700">溶解度規則 (Solubility)</h3>
                                    <button onClick={() => setShowRules(false)} className="text-slate-400 hover:text-slate-600"><i data-lucide="x" size={18} /></button>
                                </div>
                                <div className="space-y-2 text-xs">
                                    {SolubilityRules.map((r, i) => (
                                        <div key={i} className={`p-2 rounded border-l-4 ${r.soluble ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}`}>
                                            <div className="font-bold">{r.rule}</div>
                                            <div className="text-slate-500">{r.soluble ? '可溶' : '不可溶'} {r.except && <span className="text-red-600 block mt-1">例外: {r.except}</span>}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Main Content */}
                        <div className="h-full flex flex-col justify-center">
                            
                            {/* Path History */}
                            {path.length > 0 && !resultMethod && (
                                <div className="flex justify-center gap-2 mb-8">
                                    {path.map((p, i) => (
                                        <div key={i} className="flex items-center gap-2 text-sm text-slate-400">
                                            <span className="bg-white px-3 py-1 rounded-full border border-slate-200">{p}</span>
                                            <i data-lucide="arrow-right" size={14} />
                                        </div>
                                    ))}
                                </div>
                            )}

                            {renderDecision()}
                            {renderMethodVisual()}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
