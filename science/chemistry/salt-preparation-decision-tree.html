<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹽製備決策樹 (Salt Preparation Guide)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Flow Chart Animation */
        .node-enter { animation: fade-in-up 0.5s ease-out forwards; }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Lab Animation */
        @keyframes drip {
            0% { top: 0; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .drip { animation: drip 1s infinite; }
        
        @keyframes swirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .swirl { animation: swirl 3s linear infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Data Sets ---

        // 1. Solubility Rules
        const SolubilityRules = [
            { id: 1, rule: '硝酸鹽 (Nitrates, NO₃⁻)', status: 'All Soluble', desc: '所有硝酸鹽皆可溶於水，無例外。' },
            { id: 2, rule: '鹼金屬鹽 (Li⁺, Na⁺, K⁺)', status: 'All Soluble', desc: '所有 Group 1 金屬及銨鹽 (NH₄⁺) 皆可溶。' },
            { id: 3, rule: '氯化物 (Chlorides, Cl⁻)', status: 'Mostly Soluble', desc: '例外：AgCl, PbCl₂ (冷水不溶, 熱水可溶)' },
            { id: 4, rule: '硫酸鹽 (Sulphates, SO₄²⁻)', status: 'Mostly Soluble', desc: '例外：BaSO₄, PbSO₄, CaSO₄ (微溶)' },
            { id: 5, rule: '碳酸鹽 (Carbonates, CO₃²⁻)', status: 'Mostly Insoluble', desc: '例外：Na⁺, K⁺, NH₄⁺ 的碳酸鹽可溶。' },
            { id: 6, rule: '氫氧化物 (Hydroxides, OH⁻)', status: 'Mostly Insoluble', desc: '例外：Na⁺, K⁺, NH₄⁺ 可溶; Ca(OH)₂ 微溶。' }
        ];

        // 2. Common Salts Database
        const CommonSalts = [
            { name: '氯化鈉 (Sodium Chloride)', f: 'NaCl', soluble: true },
            { name: '硝酸銀 (Silver Nitrate)', f: 'AgNO3', soluble: true },
            { name: '氯化銀 (Silver Chloride)', f: 'AgCl', soluble: false },
            { name: '硫酸銅 (Copper(II) Sulphate)', f: 'CuSO4', soluble: true },
            { name: '碳酸鈣 (Calcium Carbonate)', f: 'CaCO3', soluble: false },
            { name: '硫酸鋇 (Barium Sulphate)', f: 'BaSO4', soluble: false },
            { name: '硝酸鉛(II) (Lead(II) Nitrate)', f: 'Pb(NO3)2', soluble: true },
            { name: '氯化鉛(II) (Lead(II) Chloride)', f: 'PbCl2', soluble: false, note: '熱水可溶' },
            { name: '氫氧化銅(II) (Copper(II) Hydroxide)', f: 'Cu(OH)2', soluble: false },
            { name: '碳酸鈉 (Sodium Carbonate)', f: 'Na2CO3', soluble: true },
            { name: '硫酸鋅 (Zinc Sulphate)', f: 'ZnSO4', soluble: true },
            { name: '氫氧化鎂 (Magnesium Hydroxide)', f: 'Mg(OH)2', soluble: false }
        ];

        // 3. Ion Data for Checker
        const Cations = [
            { label: 'Na⁺', val: 'Na', charge: 1 },
            { label: 'K⁺', val: 'K', charge: 1 },
            { label: 'NH₄⁺', val: 'NH4', charge: 1 },
            { label: 'Mg²⁺', val: 'Mg', charge: 2 },
            { label: 'Ca²⁺', val: 'Ca', charge: 2 },
            { label: 'Ba²⁺', val: 'Ba', charge: 2 },
            { label: 'Zn²⁺', val: 'Zn', charge: 2 },
            { label: 'Cu²⁺', val: 'Cu', charge: 2 },
            { label: 'Fe²⁺', val: 'Fe', charge: 2 },
            { label: 'Pb²⁺', val: 'Pb', charge: 2 },
            { label: 'Ag⁺', val: 'Ag', charge: 1 },
            { label: 'Al³⁺', val: 'Al', charge: 3 }
        ];

        const Anions = [
            { label: 'NO₃⁻', val: 'NO3', charge: 1 },
            { label: 'Cl⁻', val: 'Cl', charge: 1 },
            { label: 'SO₄²⁻', val: 'SO4', charge: 2 },
            { label: 'CO₃²⁻', val: 'CO3', charge: 2 },
            { label: 'OH⁻', val: 'OH', charge: 1 }
        ];

        // Methods Logic
        const Methods = {
            titration: {
                id: 'titration',
                name: '滴定法 (Titration)',
                desc: '用於製備可溶性鹽 (特別是 K, Na, NH₄ 鹽)。反應物通常是酸和鹼溶液。',
                steps: ['將酸加入滴定管', '將鹼加入錐形瓶', '加入指示劑', '滴定至變色', '記錄體積', '不加指示劑重複實驗', '結晶']
            },
            excess: {
                id: 'excess',
                name: '過量試劑法 (Excess Reagent)',
                desc: '用於製備可溶性鹽 (非 K, Na, NH₄)。反應物之一為不溶性固體 (金屬/氧化物/碳酸鹽)。',
                steps: ['加熱酸 (如需要)', '加入過量固體', '攪拌至不再溶解', '過濾除去多餘固體', '加熱濾液濃縮', '結晶']
            },
            precipitation: {
                id: 'precipitation',
                name: '沉澱法 (Precipitation)',
                desc: '用於製備不可溶性鹽。混合兩種含有相關離子的可溶性鹽溶液。',
                steps: ['混合兩種溶液', '攪拌', '過濾分離沉澱', '用蒸餾水洗滌沉澱 (Wash)', '乾燥 (Dry)']
            }
        };

        const App = () => {
            const [mode, setMode] = useState('tree'); // 'tree' or 'tools'
            const [step, setStep] = useState(0); 
            const [path, setPath] = useState([]); 
            const [resultMethod, setResultMethod] = useState(null);
            
            // Tool State
            const [activeTool, setActiveTool] = useState('rules'); // rules, search, checker
            const [searchTerm, setSearchTerm] = useState('');
            const [checkCat, setCheckCat] = useState(Cations[0]);
            const [checkAn, setCheckAn] = useState(Anions[0]);

            // Decision Tree Reset
            const resetTree = () => {
                setStep(0);
                setPath([]);
                setResultMethod(null);
            };

            const handleAnswer = (answer, nextStep) => {
                setPath([...path, answer]);
                if (typeof nextStep === 'string') {
                    setResultMethod(Methods[nextStep]);
                } else {
                    setStep(nextStep);
                }
            };

            // --- Logic for Solubility Checker ---
            const checkSolubilityResult = useMemo(() => {
                const c = checkCat.val;
                const a = checkAn.val;
                
                // 1. Always Soluble
                if (['Na', 'K', 'NH4'].includes(c)) return { soluble: true, reason: 'Group 1 / Ammonium salts are always soluble.' };
                if (a === 'NO3') return { soluble: true, reason: 'Nitrates are always soluble.' };

                // 2. Chlorides
                if (a === 'Cl') {
                    if (['Ag', 'Pb'].includes(c)) return { soluble: false, reason: 'AgCl and PbCl₂ are insoluble.' };
                    return { soluble: true, reason: 'Most chlorides are soluble.' };
                }

                // 3. Sulphates
                if (a === 'SO4') {
                    if (['Ba', 'Pb', 'Ca'].includes(c)) return { soluble: false, reason: `${c}SO₄ is insoluble (or sparingly soluble).` };
                    return { soluble: true, reason: 'Most sulphates are soluble.' };
                }

                // 4. Carbonates & Hydroxides
                if (a === 'CO3' || a === 'OH') {
                    // Exceptions (Na, K, NH4) handled at top
                    if (c === 'Ca' && a === 'OH') return { soluble: false, reason: 'Ca(OH)₂ is only slightly soluble (Limewater).' };
                    return { soluble: false, reason: 'Most carbonates/hydroxides are insoluble.' };
                }

                return { soluble: true, reason: 'Likely soluble.' };
            }, [checkCat, checkAn]);

            // Format formula for display (simple approximation)
            const getFormattedFormula = () => {
                // Swap charges logic (simplified)
                return `${checkCat.val}${checkAn.val}`; 
            };

            // --- Renders ---

            const renderDecisionTree = () => {
                if (resultMethod) return (
                    <div className="animate-in zoom-in duration-500">
                        <div className="bg-white p-8 rounded-3xl shadow-xl border-2 border-indigo-100 mb-6">
                            <div className="text-center mb-8">
                                <div className="inline-block bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full text-sm font-bold mb-2">推薦方法</div>
                                <h2 className="text-3xl font-bold text-slate-800">{resultMethod.name}</h2>
                                <p className="text-slate-500 mt-2">{resultMethod.desc}</p>
                            </div>
                            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><i data-lucide="list-ordered"/> 實驗步驟</h4>
                                <ul className="space-y-3">
                                    {resultMethod.steps.map((s, i) => (
                                        <li key={i} className="flex items-start gap-3 text-sm text-slate-600">
                                            <span className="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0">{i+1}</span>
                                            <span className="mt-0.5">{s}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                        <button onClick={resetTree} className="w-full py-3 bg-slate-800 text-white rounded-xl font-bold shadow-lg hover:bg-slate-700 flex items-center justify-center gap-2">
                            <i data-lucide="rotate-ccw" /> 重新選擇
                        </button>
                    </div>
                );

                if (step === 0) {
                    return (
                        <div className="text-center node-enter py-10">
                            <h3 className="text-2xl font-bold text-slate-700 mb-8">你要製備的鹽是可溶的嗎？</h3>
                            <div className="flex justify-center gap-6">
                                <button onClick={() => handleAnswer('可溶 (Soluble)', 1)} className="w-40 py-4 bg-green-500 text-white rounded-2xl font-bold shadow-lg hover:bg-green-600 text-lg">是 (Yes)</button>
                                <button onClick={() => handleAnswer('不可溶 (Insoluble)', 'precipitation')} className="w-40 py-4 bg-red-500 text-white rounded-2xl font-bold shadow-lg hover:bg-red-600 text-lg">否 (No)</button>
                            </div>
                        </div>
                    );
                }
                if (step === 1) {
                    return (
                        <div className="text-center node-enter py-10">
                            <h3 className="text-2xl font-bold text-slate-700 mb-8">這種鹽含有 K⁺, Na⁺ 或 NH₄⁺ 離子嗎？</h3>
                            <div className="flex justify-center gap-6">
                                <button onClick={() => handleAnswer('含 K/Na/NH4', 'titration')} className="w-40 py-4 bg-blue-500 text-white rounded-2xl font-bold shadow-lg hover:bg-blue-600 text-lg">是 (Yes)</button>
                                <button onClick={() => handleAnswer('其他陽離子', 'excess')} className="w-40 py-4 bg-orange-500 text-white rounded-2xl font-bold shadow-lg hover:bg-orange-600 text-lg">否 (No)</button>
                            </div>
                        </div>
                    );
                }
            };

            const renderTools = () => (
                <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                    {/* Tool Tabs */}
                    <div className="flex border-b border-slate-200 bg-slate-50">
                        <button onClick={() => setActiveTool('rules')} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 ${activeTool === 'rules' ? 'bg-white text-indigo-600 border-t-4 border-indigo-600' : 'text-slate-500 hover:bg-slate-100'}`}>
                            <i data-lucide="book" size={16}/> 溶解度規則
                        </button>
                        <button onClick={() => setActiveTool('search')} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 ${activeTool === 'search' ? 'bg-white text-indigo-600 border-t-4 border-indigo-600' : 'text-slate-500 hover:bg-slate-100'}`}>
                            <i data-lucide="search" size={16}/> 查閱鹽類
                        </button>
                        <button onClick={() => setActiveTool('checker')} className={`flex-1 py-4 font-bold text-sm flex items-center justify-center gap-2 ${activeTool === 'checker' ? 'bg-white text-indigo-600 border-t-4 border-indigo-600' : 'text-slate-500 hover:bg-slate-100'}`}>
                            <i data-lucide="check-square" size={16}/> 溶解檢查器
                        </button>
                    </div>

                    {/* Tool Content */}
                    <div className="flex-grow overflow-y-auto p-6 bg-slate-50/50">
                        
                        {/* 1. Rules */}
                        {activeTool === 'rules' && (
                            <div className="space-y-3">
                                {SolubilityRules.map(r => (
                                    <div key={r.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <div className="flex justify-between items-start mb-1">
                                            <h4 className="font-bold text-slate-800">{r.rule}</h4>
                                            <span className={`text-xs px-2 py-1 rounded font-bold ${r.status.includes('Insoluble') ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>{r.status}</span>
                                        </div>
                                        <p className="text-sm text-slate-500">{r.desc}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 2. Search */}
                        {activeTool === 'search' && (
                            <div className="h-full flex flex-col">
                                <div className="relative mb-4">
                                    <input 
                                        type="text" 
                                        placeholder="輸入名稱或化學式 (e.g. AgCl)..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full p-3 pl-10 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"
                                    />
                                    <i data-lucide="search" className="absolute left-3 top-3.5 text-slate-400" size={18}/>
                                </div>
                                <div className="space-y-2 flex-grow overflow-y-auto">
                                    {CommonSalts.filter(s => 
                                        s.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                        s.f.toLowerCase().includes(searchTerm.toLowerCase())
                                    ).map((s, i) => (
                                        <div key={i} className="flex justify-between items-center p-3 bg-white rounded-lg border border-slate-200 hover:border-indigo-300 transition-colors">
                                            <div>
                                                <div className="font-bold text-slate-700">{s.name}</div>
                                                <div className="text-xs text-slate-400 font-mono">{s.f}</div>
                                            </div>
                                            <div className="text-right">
                                                <span className={`text-xs font-bold px-2 py-1 rounded ${s.soluble ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                    {s.soluble ? '可溶' : '不可溶'}
                                                </span>
                                                {s.note && <div className="text-[10px] text-slate-400 mt-1">{s.note}</div>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. Checker */}
                        {activeTool === 'checker' && (
                            <div className="flex flex-col items-center justify-center h-full">
                                <div className="w-full max-w-sm bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
                                    <div className="flex gap-2 mb-6">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-slate-400 mb-1 uppercase">Cation (+)</label>
                                            <select 
                                                value={checkCat.val} 
                                                onChange={(e) => setCheckCat(Cations.find(c => c.val === e.target.value))}
                                                className="w-full p-3 bg-slate-50 rounded-lg border border-slate-300 font-bold text-slate-700 outline-none focus:border-indigo-500"
                                            >
                                                {Cations.map(c => <option key={c.val} value={c.val}>{c.label}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-slate-400 mb-1 uppercase">Anion (-)</label>
                                            <select 
                                                value={checkAn.val} 
                                                onChange={(e) => setCheckAn(Anions.find(a => a.val === e.target.value))}
                                                className="w-full p-3 bg-slate-50 rounded-lg border border-slate-300 font-bold text-slate-700 outline-none focus:border-indigo-500"
                                            >
                                                {Anions.map(a => <option key={a.val} value={a.val}>{a.label}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div className={`p-6 rounded-xl text-center transition-colors duration-500 ${checkSolubilityResult.soluble ? 'bg-green-50 border-2 border-green-200' : 'bg-red-50 border-2 border-red-200'}`}>
                                        <div className="text-4xl mb-2">{checkSolubilityResult.soluble ? '💧' : '🧱'}</div>
                                        <h3 className={`text-2xl font-black mb-1 ${checkSolubilityResult.soluble ? 'text-green-600' : 'text-red-600'}`}>
                                            {checkSolubilityResult.soluble ? '可溶 (Soluble)' : '不可溶 (Insoluble)'}
                                        </h3>
                                        <p className="text-sm opacity-80 font-medium">{checkSolubilityResult.reason}</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Top Nav */}
                    <div className="flex justify-center gap-4 mb-6">
                        <button 
                            onClick={() => setMode('tree')}
                            className={`px-6 py-3 rounded-full font-bold shadow-sm transition-all flex items-center gap-2
                                ${mode === 'tree' ? 'bg-indigo-600 text-white ring-2 ring-indigo-300' : 'bg-white text-slate-500 hover:bg-slate-50'}
                            `}
                        >
                            <i data-lucide="git-fork"/> 決策樹 (Decision Tree)
                        </button>
                        <button 
                            onClick={() => setMode('tools')}
                            className={`px-6 py-3 rounded-full font-bold shadow-sm transition-all flex items-center gap-2
                                ${mode === 'tools' ? 'bg-indigo-600 text-white ring-2 ring-indigo-300' : 'bg-white text-slate-500 hover:bg-slate-50'}
                            `}
                        >
                            <i data-lucide="database"/> 溶解度工具箱 (Tools)
                        </button>
                    </div>

                    {/* Content Area */}
                    <div className="flex-grow">
                        {mode === 'tree' ? renderDecisionTree() : renderTools()}
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
