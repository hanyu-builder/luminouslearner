<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實驗式計算機 (Empirical Formula Solver)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .step-card { transition: all 0.3s ease; }
        .step-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Common Atomic Masses
        const AtomicMasses = {
            H: 1.0, C: 12.0, N: 14.0, O: 16.0, Na: 23.0, Mg: 24.3, Al: 27.0, 
            S: 32.1, Cl: 35.5, K: 39.1, Ca: 40.1, Fe: 55.8, Cu: 63.5, Zn: 65.4, 
            Ag: 107.9, Pb: 207.2
        };

        const App = () => {
            const [elements, setElements] = useState([
                { id: 1, symbol: '', mass: '' },
                { id: 2, symbol: '', mass: '' }
            ]);
            const [result, setResult] = useState(null);
            const [error, setError] = useState('');
            const [steps, setSteps] = useState(null);

            const handleInputChange = (id, field, value) => {
                setElements(prev => prev.map(el => 
                    el.id === id ? { ...el, [field]: value } : el
                ));
            };

            const addElement = () => {
                const newId = elements.length > 0 ? Math.max(...elements.map(e => e.id)) + 1 : 1;
                setElements([...elements, { id: newId, symbol: '', mass: '' }]);
            };

            const removeElement = (id) => {
                if (elements.length > 1) {
                    setElements(elements.filter(e => e.id !== id));
                }
            };

            const calculate = () => {
                setError('');
                setResult(null);
                setSteps(null);

                // Validation
                const validElements = elements.filter(e => e.symbol && e.mass);
                if (validElements.length < 1) {
                    setError('請至少輸入一種元素的數據。');
                    return;
                }

                try {
                    // Step 1: Calculate Moles
                    const moleData = validElements.map(e => {
                        const sym = e.symbol.trim(); // Keep original case for display
                        // Try to find atomic mass (case insensitive search in our small DB)
                        // In real app, use a robust periodic table lookup
                        const lookupSym = Object.keys(AtomicMasses).find(k => k.toLowerCase() === sym.toLowerCase());
                        const atomicMass = lookupSym ? AtomicMasses[lookupSym] : null;
                        
                        if (!atomicMass) throw new Error(`未知元素符號: ${sym}`);

                        const massVal = parseFloat(e.mass);
                        if (isNaN(massVal) || massVal <= 0) throw new Error(`無效質量數值: ${e.mass}`);

                        const moles = massVal / atomicMass;
                        return { symbol: sym, mass: massVal, atomicMass, moles };
                    });

                    // Step 2: Divide by Smallest
                    const minMole = Math.min(...moleData.map(d => d.moles));
                    const ratioData = moleData.map(d => ({
                        ...d,
                        rawRatio: d.moles / minMole
                    }));

                    // Step 3: Find Simplest Integer Ratio
                    // Check for common fractions: .5, .33, .25, .66, .75
                    let multiplier = 1;
                    const fractions = ratioData.map(d => d.rawRatio % 1);
                    
                    // Simple heuristic to find multiplier
                    // Check if any ratio is close to X.5, X.33, X.25 etc.
                    const isClose = (val, target) => Math.abs(val - target) < 0.1 || Math.abs(val - target) > 0.9;
                    
                    if (fractions.some(f => isClose(f, 0.5))) multiplier = 2;
                    else if (fractions.some(f => isClose(f, 0.33) || isClose(f, 0.67))) multiplier = 3;
                    else if (fractions.some(f => isClose(f, 0.25) || isClose(f, 0.75))) multiplier = 4;
                    
                    // Just in case, try up to 6
                    for (let m = 1; m <= 6; m++) {
                         const allIntegers = ratioData.every(d => {
                             const val = d.rawRatio * m;
                             return Math.abs(val - Math.round(val)) < 0.1;
                         });
                         if (allIntegers) {
                             multiplier = m;
                             break;
                         }
                    }

                    const finalData = ratioData.map(d => ({
                        ...d,
                        intRatio: Math.round(d.rawRatio * multiplier)
                    }));

                    // Construct Formula
                    let formula = '';
                    finalData.forEach(d => {
                        formula += d.symbol;
                        if (d.intRatio > 1) formula += `<sub>${d.intRatio}</sub>`;
                    });

                    setResult(formula);
                    setSteps({ moleData, minMole, ratioData, multiplier, finalData });

                } catch (err) {
                    setError(err.message);
                }
            };

            const clear = () => {
                setElements([
                    { id: 1, symbol: '', mass: '' },
                    { id: 2, symbol: '', mass: '' }
                ]);
                setResult(null);
                setSteps(null);
                setError('');
            };

            // Example Loader
            const loadExample = (type) => {
                if (type === 'water') {
                    setElements([
                        { id: 1, symbol: 'H', mass: '11.1' },
                        { id: 2, symbol: 'O', mass: '88.9' }
                    ]);
                } else if (type === 'glucose') {
                    setElements([
                        { id: 1, symbol: 'C', mass: '40.0' },
                        { id: 2, symbol: 'H', mass: '6.7' },
                        { id: 3, symbol: 'O', mass: '53.3' }
                    ]);
                } else if (type === 'iron_oxide') {
                    setElements([
                        { id: 1, symbol: 'Fe', mass: '70.0' },
                        { id: 2, symbol: 'O', mass: '30.0' }
                    ]);
                }
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-teal-600 flex items-center gap-2">
                                <i data-lucide="flask-conical"></i> 實驗式計算機
                            </h1>
                            <p className="text-slate-400 text-sm">Empirical Formula Solver</p>
                        </div>
                        <button onClick={clear} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 清除
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Input Area */}
                        <div className="w-full lg:w-5/12 flex flex-col gap-4">
                            
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2">
                                        <i data-lucide="table-2"></i> 輸入實驗數據
                                    </h3>
                                    <div className="flex gap-2">
                                        <button onClick={() => loadExample('water')} className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded hover:bg-blue-100">水</button>
                                        <button onClick={() => loadExample('iron_oxide')} className="text-xs bg-orange-50 text-orange-600 px-2 py-1 rounded hover:bg-orange-100">氧化鐵</button>
                                        <button onClick={() => loadExample('glucose')} className="text-xs bg-green-50 text-green-600 px-2 py-1 rounded hover:bg-green-100">葡萄糖</button>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <div className="grid grid-cols-12 gap-2 text-xs font-bold text-slate-400 uppercase px-2">
                                        <div className="col-span-4">元素符號 (Symbol)</div>
                                        <div className="col-span-6">質量 / 百分比 (Mass/%)</div>
                                        <div className="col-span-2"></div>
                                    </div>
                                    
                                    {elements.map((el) => (
                                        <div key={el.id} className="grid grid-cols-12 gap-2 items-center p-2 bg-slate-50 rounded-lg border border-slate-200">
                                            <div className="col-span-4">
                                                <input 
                                                    type="text" 
                                                    placeholder="e.g. Cu"
                                                    value={el.symbol}
                                                    onChange={(e) => handleInputChange(el.id, 'symbol', e.target.value)}
                                                    className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-teal-400 outline-none font-mono uppercase"
                                                />
                                            </div>
                                            <div className="col-span-6">
                                                <input 
                                                    type="number" 
                                                    placeholder="e.g. 80.0"
                                                    value={el.mass}
                                                    onChange={(e) => handleInputChange(el.id, 'mass', e.target.value)}
                                                    className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-teal-400 outline-none font-mono"
                                                />
                                            </div>
                                            <div className="col-span-2 flex justify-center">
                                                {elements.length > 1 && (
                                                    <button 
                                                        onClick={() => removeElement(el.id)}
                                                        className="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition-colors"
                                                    >
                                                        <i data-lucide="trash-2" size={18} />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={addElement}
                                    className="mt-4 w-full py-2 border-2 border-dashed border-slate-300 text-slate-500 rounded-lg hover:border-teal-400 hover:text-teal-500 transition-all font-bold text-sm flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="plus" size={16} /> 增加元素 (Add Element)
                                </button>

                                {error && (
                                    <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm font-bold flex items-center gap-2 animate-pulse">
                                        <i data-lucide="alert-triangle" size={16} /> {error}
                                    </div>
                                )}

                                <button 
                                    onClick={calculate}
                                    className="mt-6 w-full py-4 bg-teal-600 text-white font-bold rounded-xl shadow-lg hover:bg-teal-500 transition-all active:scale-95 text-lg flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="calculator" /> 開始計算
                                </button>
                            </div>
                            
                            <div className="bg-teal-50 p-4 rounded-xl border border-teal-100 text-sm text-teal-800">
                                <h4 className="font-bold mb-2 flex items-center gap-2"><i data-lucide="lightbulb" size={16}/> 提示 (Tips)</h4>
                                <ul className="list-disc list-inside space-y-1 opacity-80">
                                    <li>你可以輸入<strong>質量 (Mass, g)</strong> 或 <strong>百分比 (%)</strong>。</li>
                                    <li>如果結果出現小數 (e.g. 1.5)，系統會自動乘以整數以獲取簡單整數比。</li>
                                </ul>
                            </div>

                        </div>

                        {/* Right: Result Breakdown */}
                        <div className="w-full lg:w-7/12 flex flex-col gap-6">
                            
                            {result ? (
                                <div className="animate-in slide-in-from-bottom-4 fade-in duration-500 h-full flex flex-col">
                                    
                                    {/* Result Card */}
                                    <div className="bg-slate-800 rounded-2xl p-6 shadow-lg text-white mb-6 border border-slate-700 relative overflow-hidden">
                                        <div className="relative z-10">
                                            <div className="text-xs text-slate-400 font-bold uppercase mb-2 tracking-wider">Empirical Formula</div>
                                            <div className="text-5xl font-mono font-bold text-teal-400 tracking-wider" dangerouslySetInnerHTML={{ __html: result }}></div>
                                        </div>
                                        <div className="absolute right-0 top-0 p-6 opacity-10">
                                            <i data-lucide="microscope" size={120} />
                                        </div>
                                    </div>

                                    {/* Calculation Table */}
                                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex-grow">
                                        <div className="bg-slate-50 p-4 border-b border-slate-200 font-bold text-slate-700 flex items-center gap-2">
                                            <i data-lucide="list-ordered" size={18} /> 計算步驟 (Step-by-Step)
                                        </div>
                                        
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="bg-slate-100 text-slate-500 uppercase font-bold text-xs">
                                                    <tr>
                                                        <th className="p-3">元素</th>
                                                        <th className="p-3">質量/百分比 (m)</th>
                                                        <th className="p-3">原子量 (A.M.)</th>
                                                        <th className="p-3">摩爾數 (n = m÷A.M.)</th>
                                                        <th className="p-3">除以最小 (÷ Smallest)</th>
                                                        <th className="p-3 text-right">最簡整數比</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {steps.moleData.map((d, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                            <td className="p-3 font-bold text-teal-700 text-lg">{d.symbol}</td>
                                                            <td className="p-3 font-mono">{d.mass}</td>
                                                            <td className="p-3 text-slate-400 font-mono">{d.atomicMass}</td>
                                                            <td className="p-3 font-mono font-bold text-slate-700">{d.moles.toFixed(3)}</td>
                                                            <td className="p-3 font-mono text-slate-600">
                                                                {d.moles.toFixed(3)} ÷ {steps.minMole.toFixed(3)} = <strong>{steps.ratioData[idx].rawRatio.toFixed(2)}</strong>
                                                            </td>
                                                            <td className="p-3 text-right font-mono font-black text-xl text-teal-600">
                                                                {steps.finalData[idx].intRatio}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        {steps.multiplier > 1 && (
                                            <div className="p-4 bg-yellow-50 border-t border-yellow-100 text-yellow-800 text-sm">
                                                <strong>注意：</strong> 原始比例中出現了非整數 (e.g. x.5 or x.33)。
                                                為了得到整數比，我們將所有數值乘以 <strong>{steps.multiplier}</strong>。
                                            </div>
                                        )}
                                    </div>

                                </div>
                            ) : (
                                <div className="flex-grow flex flex-col items-center justify-center text-slate-400 border-4 border-dashed border-slate-200 rounded-3xl bg-slate-50/50 p-12 min-h-[400px]">
                                    <i data-lucide="table" size={64} className="mb-6 opacity-30" />
                                    <p className="text-xl text-center font-medium mb-2">
                                        等待數據輸入...
                                    </p>
                                    <p className="text-sm text-center opacity-70">
                                        請在左側輸入元素的質量或百分比
                                    </p>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic III
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
