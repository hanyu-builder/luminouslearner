<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極性檢查器 (Polarity Checker)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        canvas { outline: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Electronegativity Data (Pauling Scale)
        const EN = {
            H: 2.2, B: 2.04, C: 2.55, N: 3.04, O: 3.44, F: 3.98, Cl: 3.16, S: 2.58, Be: 1.57
        };

        const Colors = {
            H: 0xffffff, B: 0xffaa00, C: 0x333333, N: 0x3b82f6, O: 0xef4444, F: 0x22c55e, Cl: 0x10b981, S: 0xeab308, Be: 0x94a3b8
        };

        // Molecule Definitions
        // Atoms: [Element, x, y, z]
        const Molecules = [
            {
                id: 'H2', name: '氫氣 (Hydrogen)', formula: 'H₂', type: 'nonpolar',
                atoms: [['H', -0.7, 0, 0], ['H', 0.7, 0, 0]],
                bonds: [[0, 1]],
                desc: '非極性共價鍵。兩個原子電負性相同，電子分佈均勻。'
            },
            {
                id: 'HCl', name: '氯化氫 (Hydrogen Chloride)', formula: 'HCl', type: 'polar',
                atoms: [['H', -0.8, 0, 0], ['Cl', 0.8, 0, 0]],
                bonds: [[0, 1]],
                desc: '極性分子。Cl 的電負性 (3.16) 高於 H (2.2)，電子偏向 Cl。'
            },
            {
                id: 'CO2', name: '二氧化碳 (Carbon Dioxide)', formula: 'CO₂', type: 'nonpolar',
                atoms: [['C', 0, 0, 0], ['O', -1.2, 0, 0], ['O', 1.2, 0, 0]],
                bonds: [[0, 1], [0, 2]],
                desc: '非極性分子。雖然 C=O 鍵是極性的，但直線形結構使極性互相抵消 (Symmetrical)。'
            },
            {
                id: 'H2O', name: '水 (Water)', formula: 'H₂O', type: 'polar',
                atoms: [['O', 0, 0.2, 0], ['H', -0.8, -0.4, 0], ['H', 0.8, -0.4, 0]], // Bent
                bonds: [[0, 1], [0, 2]],
                desc: '極性分子。V 型結構不對稱，鍵極性無法抵消，產生淨偶極矩。'
            },
            {
                id: 'BF3', name: '三氟化硼 (Boron Trifluoride)', formula: 'BF₃', type: 'nonpolar',
                atoms: [
                    ['B', 0, 0, 0],
                    ['F', 0, 1.3, 0],
                    ['F', 1.12, -0.65, 0],
                    ['F', -1.12, -0.65, 0]
                ],
                bonds: [[0, 1], [0, 2], [0, 3]],
                desc: '非極性分子。平面三角形結構高度對稱，三個 B-F 鍵極性互相抵消。'
            },
            {
                id: 'NH3', name: '氨 (Ammonia)', formula: 'NH₃', type: 'polar',
                atoms: [
                    ['N', 0, 0.2, 0],
                    ['H', 0, -0.5, 0.9],
                    ['H', -0.8, -0.5, -0.45],
                    ['H', 0.8, -0.5, -0.45]
                ],
                bonds: [[0, 1], [0, 2], [0, 3]],
                desc: '極性分子。三角錐體結構不對稱，且 N 上有孤對電子，產生強烈極性。'
            },
            {
                id: 'CCl4', name: '四氯化碳 (Tetrachloromethane)', formula: 'CCl₄', type: 'nonpolar',
                atoms: [
                    ['C', 0, 0, 0],
                    ['Cl', 0, 1.2, 0],
                    ['Cl', 1.13, -0.4, 0],
                    ['Cl', -0.56, -0.4, 0.98],
                    ['Cl', -0.56, -0.4, -0.98]
                ],
                bonds: [[0, 1], [0, 2], [0, 3], [0, 4]],
                desc: '非極性分子。四面體結構完全對稱，四個 C-Cl 鍵極性互相抵消。'
            },
            {
                id: 'CHCl3', name: '三氯甲烷 (Trichloromethane)', formula: 'CHCl₃', type: 'polar',
                atoms: [
                    ['C', 0, 0, 0],
                    ['H', 0, 1.2, 0],
                    ['Cl', 1.13, -0.4, 0],
                    ['Cl', -0.56, -0.4, 0.98],
                    ['Cl', -0.56, -0.4, -0.98]
                ],
                bonds: [[0, 1], [0, 2], [0, 3], [0, 4]],
                desc: '極性分子。雖然是四面體形，但原子種類不同 (H vs Cl)，極性無法抵消。'
            }
        ];

        // --- 3D Scene Component ---
        const MoleculeScene = ({ molecule, showBondDipoles, showNetDipole, showCharges }) => {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            
            useEffect(() => {
                if (!mountRef.current) return;

                // Setup
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1e293b);
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(50, mountRef.current.clientWidth / mountRef.current.clientHeight, 0.1, 100);
                camera.position.z = 6;
                camera.position.y = 1;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                mountRef.current.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.5;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                const pointLight = new THREE.PointLight(0xffffff, 0.8);
                pointLight.position.set(5, 5, 5);
                scene.add(pointLight);

                // --- Build Molecule ---
                const group = new THREE.Group();

                // Add Atoms
                molecule.atoms.forEach((atom, idx) => {
                    const [el, x, y, z] = atom;
                    const color = Colors[el] || 0xcccccc;
                    const size = el === 'H' ? 0.3 : el === 'Cl' ? 0.6 : 0.45;
                    
                    const geo = new THREE.SphereGeometry(size, 32, 32);
                    const mat = new THREE.MeshPhongMaterial({ color: color, shininess: 50 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, y, z);
                    group.add(mesh);

                    // Add Partial Charges Text (Sprite)
                    if (showCharges && EN[el]) {
                        // Calculate relative charge crudely based on bonded neighbors
                        // For simplicity in visualization: 
                        // If atom EN > average EN of neighbors => delta-
                        // This is complex to calculate perfectly dynamically without bonding graph logic in full depth
                        // Simplified visual logic: High EN = delta-, Low EN = delta+
                        // We will manually assign for demo or calculate vs molecule average EN?
                        // Better: Calculate vs bonded partner
                    }
                });

                // Calculate Net Dipole Vector
                let netDipole = new THREE.Vector3(0, 0, 0);

                // Add Bonds and Bond Dipoles
                molecule.bonds.forEach(bond => {
                    const idx1 = bond[0];
                    const idx2 = bond[1];
                    const a1 = molecule.atoms[idx1];
                    const a2 = molecule.atoms[idx2];
                    
                    const v1 = new THREE.Vector3(a1[1], a1[2], a1[3]);
                    const v2 = new THREE.Vector3(a2[1], a2[2], a2[3]);
                    
                    // Draw Bond Cylinder
                    const distance = v1.distanceTo(v2);
                    const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
                    const cylinderGeo = new THREE.CylinderGeometry(0.08, 0.08, distance, 12);
                    const cylinderMat = new THREE.MeshPhongMaterial({ color: 0x94a3b8 });
                    const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
                    cylinder.position.copy(mid);
                    cylinder.lookAt(v2);
                    cylinder.rotateX(Math.PI / 2);
                    group.add(cylinder);

                    // Calculate Dipole
                    const en1 = EN[a1[0]];
                    const en2 = EN[a2[0]];
                    const diff = Math.abs(en1 - en2);

                    if (diff > 0.3) { // Threshold for polar bond
                        const direction = new THREE.Vector3().subVectors(v2, v1).normalize();
                        if (en1 > en2) direction.negate(); // Point towards higher EN
                        
                        // Add to net dipole
                        netDipole.add(direction.clone().multiplyScalar(diff));

                        // Visual Arrow for Bond Dipole
                        if (showBondDipoles) {
                            // Arrow Helper
                            const arrowColor = 0xffff00; // Yellow
                            const arrowLength = 0.8;
                            const arrowDir = direction.clone();
                            const arrowOrigin = mid.clone().sub(direction.clone().multiplyScalar(0.4)); // Shift back to center
                            const arrowHelper = new THREE.ArrowHelper(arrowDir, arrowOrigin, arrowLength, arrowColor, 0.2, 0.15);
                            group.add(arrowHelper);
                            
                            // Add "plus" sign at tail for dipole notation
                            // Simplified: Just the arrow is standard in physics, Chem often uses +--->
                        }
                    }

                    // Partial Charges Visuals (Simplified Logic)
                    if (showCharges && diff > 0.3) {
                        const createLabel = (text, pos, color) => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = 64; canvas.height = 64;
                            ctx.fillStyle = color;
                            ctx.font = 'bold 48px serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(text, 32, 32);
                            const texture = new THREE.CanvasTexture(canvas);
                            const spriteMat = new THREE.SpriteMaterial({ map: texture });
                            const sprite = new THREE.Sprite(spriteMat);
                            sprite.position.copy(pos).add(new THREE.Vector3(0.3, 0.3, 0));
                            sprite.scale.set(0.6, 0.6, 1);
                            return sprite;
                        };

                        const highENIdx = en1 > en2 ? idx1 : idx2;
                        const lowENIdx = en1 > en2 ? idx2 : idx1;
                        
                        const posHigh = new THREE.Vector3(molecule.atoms[highENIdx][1], molecule.atoms[highENIdx][2], molecule.atoms[highENIdx][3]);
                        const posLow = new THREE.Vector3(molecule.atoms[lowENIdx][1], molecule.atoms[lowENIdx][2], molecule.atoms[lowENIdx][3]);

                        group.add(createLabel('δ-', posHigh, '#ef4444')); // Red delta-
                        group.add(createLabel('δ+', posLow, '#3b82f6')); // Blue delta+
                    }
                });

                // Net Dipole Visual
                if (showNetDipole && netDipole.length() > 0.1) {
                    const origin = new THREE.Vector3(0, 0, 0); // Assume center of molecule is roughly origin for these models
                    const length = 2.5; // Fixed visual length for clarity, or scale with netDipole.length()
                    const color = 0xec4899; // Pink/Magenta
                    const arrowHelper = new THREE.ArrowHelper(netDipole.normalize(), origin, length, color, 0.5, 0.3);
                    group.add(arrowHelper);
                }

                scene.add(group);

                // Animation Loop
                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                // Cleanup
                return () => {
                    cancelAnimationFrame(frameId);
                    if (mountRef.current) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    group.traverse((obj) => {
                        if (obj.isMesh) {
                            obj.geometry.dispose();
                            obj.material.dispose();
                        }
                    });
                    renderer.dispose();
                };
            }, [molecule, showBondDipoles, showNetDipole, showCharges]);

            return <div ref={mountRef} className="w-full h-full rounded-2xl overflow-hidden shadow-inner bg-slate-900" />;
        };

        // --- Main App ---
        const App = () => {
            const [selectedMol, setSelectedMol] = useState(Molecules[0]);
            const [showBondDipoles, setShowBondDipoles] = useState(true);
            const [showNetDipole, setShowNetDipole] = useState(true);
            const [showCharges, setShowCharges] = useState(false);

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-teal-400 flex items-center gap-2">
                                <i data-lucide="magnet"></i> 極性檢查器 (Polarity Checker)
                            </h1>
                            <p className="text-slate-400 text-sm">Predicting Molecular Polarity from Bond Dipoles & Geometry</p>
                        </div>
                        <div className="flex gap-2">
                            {Molecules.slice(0, 5).map(m => (
                                <button key={m.id} onClick={() => setSelectedMol(m)} className={`px-2 py-1 text-xs rounded border ${selectedMol.id === m.id ? 'bg-teal-600 border-teal-400 text-white' : 'border-slate-600 text-slate-400'}`}>
                                    {m.formula}
                                </button>
                            ))}
                            <span className="text-slate-500 self-center">...</span>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: 3D View */}
                        <div className="w-full lg:w-2/3 h-[500px] relative">
                            <MoleculeScene 
                                molecule={selectedMol} 
                                showBondDipoles={showBondDipoles}
                                showNetDipole={showNetDipole}
                                showCharges={showCharges}
                            />
                            <div className="absolute bottom-4 left-4 text-xs text-slate-500 bg-black/60 px-2 py-1 rounded pointer-events-none">
                                左鍵旋轉 • 右鍵平移 • 滾輪縮放
                            </div>
                            
                            {/* Legend Overlay */}
                            <div className="absolute top-4 left-4 flex flex-col gap-2 bg-black/40 p-2 rounded border border-slate-700/50 backdrop-blur-sm text-xs">
                                <div className="flex items-center gap-2 text-yellow-300"><i data-lucide="arrow-right" size={14}/> 鍵極性 (Bond Dipole)</div>
                                <div className="flex items-center gap-2 text-pink-400"><i data-lucide="arrow-up-right" size={14}/> 淨偶極矩 (Net Dipole)</div>
                            </div>
                        </div>

                        {/* Right: Controls & Analysis */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Molecule Selection Grid */}
                            <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
                                <h3 className="text-sm font-bold text-slate-400 uppercase mb-3">選擇分子 (Select Molecule)</h3>
                                <div className="grid grid-cols-3 gap-2">
                                    {Molecules.map(m => (
                                        <button 
                                            key={m.id}
                                            onClick={() => setSelectedMol(m)}
                                            className={`p-2 rounded-lg text-center transition-all border
                                                ${selectedMol.id === m.id 
                                                    ? 'bg-teal-600/20 border-teal-500 text-teal-300' 
                                                    : 'bg-slate-700/50 border-slate-600 text-slate-400 hover:bg-slate-700'}
                                            `}
                                        >
                                            <div className="font-bold text-lg">{m.formula}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Visual Controls */}
                            <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
                                <h3 className="text-sm font-bold text-slate-400 uppercase mb-3">顯示設定 (Display)</h3>
                                <div className="space-y-2">
                                    <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-slate-700/50 rounded">
                                        <input type="checkbox" checked={showBondDipoles} onChange={(e) => setShowBondDipoles(e.target.checked)} className="accent-yellow-500 w-4 h-4" />
                                        <span className="text-slate-200 text-sm">顯示鍵極性向量 (Bond Dipoles)</span>
                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-slate-700/50 rounded">
                                        <input type="checkbox" checked={showNetDipole} onChange={(e) => setShowNetDipole(e.target.checked)} className="accent-pink-500 w-4 h-4" />
                                        <span className="text-slate-200 text-sm">顯示整體極性 (Net Dipole)</span>
                                    </label>
                                    <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-slate-700/50 rounded">
                                        <input type="checkbox" checked={showCharges} onChange={(e) => setShowCharges(e.target.checked)} className="accent-blue-500 w-4 h-4" />
                                        <span className="text-slate-200 text-sm">顯示部分電荷 (Partial Charges, δ)</span>
                                    </label>
                                </div>
                            </div>

                            {/* Analysis Result */}
                            <div className={`p-5 rounded-2xl border-l-4 shadow-lg transition-all animate-in fade-in
                                ${selectedMol.type === 'polar' ? 'bg-blue-900/30 border-blue-500' : 'bg-slate-700/30 border-slate-500'}
                            `}>
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="text-xl font-bold text-white">{selectedMol.name}</h2>
                                    <span className={`px-2 py-1 rounded text-xs font-bold uppercase ${selectedMol.type === 'polar' ? 'bg-blue-600 text-white' : 'bg-slate-600 text-slate-300'}`}>
                                        {selectedMol.type === 'polar' ? 'POLAR (極性)' : 'NON-POLAR (非極性)'}
                                    </span>
                                </div>
                                <p className="text-sm text-slate-300 leading-relaxed">
                                    {selectedMol.desc}
                                </p>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic VI
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
