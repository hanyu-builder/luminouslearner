<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電池電壓預測器 (Cell Voltage Predictor)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }

        /* Electron Flow Animation */
        @keyframes flow {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(100px); opacity: 0; }
        }
        .electron-dot {
            animation: flow 1.5s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Standard Electrode Potentials (E standard)
        // Sorted by E value (descending)
        const HalfCells = [
            { id: 'Ag', name: '銀 (Ag)', reaction: 'Ag⁺(aq) + e⁻ ⇌ Ag(s)', E: 0.80, color: 'bg-slate-300' },
            { id: 'Cu', name: '銅 (Cu)', reaction: 'Cu²⁺(aq) + 2e⁻ ⇌ Cu(s)', E: 0.34, color: 'bg-orange-400' },
            { id: 'H', name: '氫 (H₂)', reaction: '2H⁺(aq) + 2e⁻ ⇌ H₂(g)', E: 0.00, color: 'bg-slate-100' }, // Standard Hydrogen Electrode
            { id: 'Pb', name: '鉛 (Pb)', reaction: 'Pb²⁺(aq) + 2e⁻ ⇌ Pb(s)', E: -0.13, color: 'bg-slate-500' },
            { id: 'Fe', name: '鐵 (Fe)', reaction: 'Fe²⁺(aq) + 2e⁻ ⇌ Fe(s)', E: -0.44, color: 'bg-stone-500' },
            { id: 'Zn', name: '鋅 (Zn)', reaction: 'Zn²⁺(aq) + 2e⁻ ⇌ Zn(s)', E: -0.76, color: 'bg-zinc-400' },
            { id: 'Mg', name: '鎂 (Mg)', reaction: 'Mg²⁺(aq) + 2e⁻ ⇌ Mg(s)', E: -2.37, color: 'bg-gray-200' }
        ];

        const App = () => {
            const [leftElectrode, setLeftElectrode] = useState(HalfCells[5]); // Zn
            const [rightElectrode, setRightElectrode] = useState(HalfCells[1]); // Cu
            
            const [anode, setAnode] = useState(null);
            const [cathode, setCathode] = useState(null);
            const [cellVoltage, setCellVoltage] = useState(0);
            const [electronDirection, setElectronDirection] = useState('right'); // 'left' or 'right'

            useEffect(() => {
                // Determine Anode and Cathode based on E values
                // More negative E => Anode (Oxidation)
                // More positive E => Cathode (Reduction)
                
                let a, c, voltage, dir;

                if (leftElectrode.E < rightElectrode.E) {
                    // Left is Anode
                    a = { ...leftElectrode, side: 'left' };
                    c = { ...rightElectrode, side: 'right' };
                    dir = 'right';
                } else {
                    // Right is Anode
                    a = { ...rightElectrode, side: 'right' };
                    c = { ...leftElectrode, side: 'left' };
                    dir = 'left';
                }

                // Calculate Voltage: E_cell = E_cathode - E_anode
                voltage = c.E - a.E;

                setAnode(a);
                setCathode(c);
                setCellVoltage(voltage.toFixed(2));
                setElectronDirection(dir);

            }, [leftElectrode, rightElectrode]);

            // Helper to reverse equation for oxidation
            const getOxidationEq = (reductionEq) => {
                // Simply swap sides visually for demo purposes
                // e.g. Zn2+ + 2e- = Zn  ->  Zn = Zn2+ + 2e-
                const parts = reductionEq.split('⇌');
                if (parts.length === 2) {
                    return `${parts[1].trim()} → ${parts[0].trim()}`;
                }
                return reductionEq;
            };

            // Helper to format reduction eq
            const getReductionEq = (eq) => {
                return eq.replace('⇌', '→');
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-amber-600 flex items-center gap-2">
                                <i data-lucide="battery-charging"></i> 電池電壓預測器
                            </h1>
                            <p className="text-slate-400 text-sm">Cell Voltage Predictor (Electrochemical Series)</p>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Cell Configuration */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Left Electrode Selector */}
                            <div className="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-slate-700">左側電極 (Left Electrode)</h3>
                                    <span className={`text-xs font-bold px-2 py-1 rounded ${anode?.side === 'left' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                                        {anode?.side === 'left' ? '陽極 (Anode) -' : '陰極 (Cathode) +'}
                                    </span>
                                </div>
                                <select 
                                    value={leftElectrode.id} 
                                    onChange={(e) => setLeftElectrode(HalfCells.find(c => c.id === e.target.value))}
                                    className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl font-bold text-slate-700 outline-none focus:ring-2 focus:ring-amber-400"
                                >
                                    {HalfCells.map(c => (
                                        <option key={c.id} value={c.id} disabled={c.id === rightElectrode.id}>
                                            {c.name} (E° = {c.E > 0 ? '+' : ''}{c.E.toFixed(2)} V)
                                        </option>
                                    ))}
                                </select>
                                <div className="mt-3 p-3 bg-slate-100 rounded-lg text-xs text-slate-500 font-mono">
                                    {leftElectrode.reaction}
                                </div>
                            </div>

                            {/* VS Badge */}
                            <div className="flex justify-center -my-3 z-10">
                                <div className="bg-amber-100 text-amber-600 font-black rounded-full w-10 h-10 flex items-center justify-center border-4 border-white shadow-sm">VS</div>
                            </div>

                            {/* Right Electrode Selector */}
                            <div className="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-slate-700">右側電極 (Right Electrode)</h3>
                                    <span className={`text-xs font-bold px-2 py-1 rounded ${anode?.side === 'right' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                                        {anode?.side === 'right' ? '陽極 (Anode) -' : '陰極 (Cathode) +'}
                                    </span>
                                </div>
                                <select 
                                    value={rightElectrode.id} 
                                    onChange={(e) => setRightElectrode(HalfCells.find(c => c.id === e.target.value))}
                                    className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl font-bold text-slate-700 outline-none focus:ring-2 focus:ring-amber-400"
                                >
                                    {HalfCells.map(c => (
                                        <option key={c.id} value={c.id} disabled={c.id === leftElectrode.id}>
                                            {c.name} (E° = {c.E > 0 ? '+' : ''}{c.E.toFixed(2)} V)
                                        </option>
                                    ))}
                                </select>
                                <div className="mt-3 p-3 bg-slate-100 rounded-lg text-xs text-slate-500 font-mono">
                                    {rightElectrode.reaction}
                                </div>
                            </div>

                        </div>

                        {/* Right: Visualization & Results */}
                        <div className="w-full lg:w-2/3 flex flex-col gap-6">
                            
                            {/* Cell Diagram */}
                            <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 relative overflow-hidden min-h-[300px] flex flex-col justify-end">
                                
                                {/* Voltmeter */}
                                <div className="absolute top-6 left-1/2 -translate-x-1/2 w-32 h-24 bg-slate-800 rounded-lg border-4 border-slate-600 flex flex-col items-center justify-center shadow-lg z-20">
                                    <div className="text-green-400 font-mono text-2xl font-bold">{cellVoltage} V</div>
                                    <div className="text-slate-500 text-[10px] uppercase mt-1">Voltmeter</div>
                                    
                                    {/* Wires */}
                                    <div className="absolute bottom-0 left-4 w-1 h-16 bg-black translate-y-full"></div>
                                    <div className="absolute bottom-0 right-4 w-1 h-16 bg-red-600 translate-y-full"></div>
                                </div>

                                {/* Electron Flow */}
                                <div className="absolute top-16 left-0 w-full flex justify-center pointer-events-none">
                                    <div className={`w-64 h-2 bg-transparent relative overflow-hidden ${electronDirection === 'left' ? 'rotate-180' : ''}`}>
                                        {[...Array(5)].map((_, i) => (
                                            <div key={i} className="electron-dot absolute top-0 w-2 h-2 bg-yellow-400 rounded-full shadow-[0_0_5px_yellow]" 
                                                 style={{ animationDelay: `${i * 0.3}s` }}></div>
                                        ))}
                                    </div>
                                </div>
                                <div className={`absolute top-12 ${electronDirection === 'right' ? 'left-1/4' : 'right-1/4'} text-xs font-bold text-yellow-600 animate-pulse`}>
                                    e⁻ Flow &rarr;
                                </div>

                                {/* Beakers Container */}
                                <div className="flex justify-around items-end w-full mt-12 relative z-10">
                                    
                                    {/* Left Beaker */}
                                    <div className="flex flex-col items-center">
                                        <div className="w-32 h-40 border-4 border-slate-400 border-t-0 rounded-b-xl relative bg-blue-50 overflow-hidden">
                                            <div className="absolute bottom-0 w-full h-3/4 bg-blue-200/50"></div>
                                            {/* Electrode */}
                                            <div className={`absolute top-[-20px] left-1/2 -translate-x-1/2 w-8 h-48 ${leftElectrode.color} border-2 border-slate-500 rounded-sm`}></div>
                                        </div>
                                        <div className="mt-2 font-bold text-slate-700">{leftElectrode.name.split(' ')[0]}</div>
                                    </div>

                                    {/* Salt Bridge */}
                                    <div className="absolute bottom-24 left-1/2 -translate-x-1/2 w-40 h-16 border-t-8 border-x-8 border-slate-300 rounded-t-2xl pointer-events-none"></div>
                                    <div className="absolute bottom-12 left-1/2 -translate-x-1/2 bg-white px-2 py-1 text-xs text-slate-400 font-bold">Salt Bridge</div>

                                    {/* Right Beaker */}
                                    <div className="flex flex-col items-center">
                                        <div className="w-32 h-40 border-4 border-slate-400 border-t-0 rounded-b-xl relative bg-blue-50 overflow-hidden">
                                            <div className="absolute bottom-0 w-full h-3/4 bg-blue-200/50"></div>
                                            {/* Electrode */}
                                            <div className={`absolute top-[-20px] left-1/2 -translate-x-1/2 w-8 h-48 ${rightElectrode.color} border-2 border-slate-500 rounded-sm`}></div>
                                        </div>
                                        <div className="mt-2 font-bold text-slate-700">{rightElectrode.name.split(' ')[0]}</div>
                                    </div>
                                </div>

                            </div>

                            {/* Calculation Breakdown */}
                            {anode && cathode && (
                                <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                                    <h3 className="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                                        <i data-lucide="sigma" /> 計算過程與半反應
                                    </h3>
                                    
                                    <div className="space-y-4">
                                        {/* Anode (Oxidation) */}
                                        <div className="p-3 bg-red-50 rounded-lg border-l-4 border-red-500">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="font-bold text-red-700 text-sm uppercase">陽極 (Anode) - Oxidation</span>
                                                <span className="font-mono font-bold text-red-600 text-sm">E° = {anode.E.toFixed(2)} V</span>
                                            </div>
                                            <div className="font-mono text-sm text-slate-700">
                                                {getOxidationEq(anode.reaction)}
                                            </div>
                                        </div>

                                        {/* Cathode (Reduction) */}
                                        <div className="p-3 bg-blue-50 rounded-lg border-l-4 border-blue-500">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="font-bold text-blue-700 text-sm uppercase">陰極 (Cathode) - Reduction</span>
                                                <span className="font-mono font-bold text-blue-600 text-sm">E° = {cathode.E.toFixed(2)} V</span>
                                            </div>
                                            <div className="font-mono text-sm text-slate-700">
                                                {getReductionEq(cathode.reaction)}
                                            </div>
                                        </div>

                                        {/* Total E_cell */}
                                        <div className="p-4 bg-amber-50 rounded-lg border border-amber-200 text-center">
                                            <div className="text-xs text-amber-600 font-bold uppercase mb-2">Standard Cell Potential (E°cell)</div>
                                            <div className="font-mono text-lg text-slate-700">
                                                E°cell = E°(Cathode) - E°(Anode)
                                            </div>
                                            <div className="font-mono text-xl font-bold text-slate-800 mt-1">
                                                = {cathode.E.toFixed(2)} - ({anode.E.toFixed(2)}) = <span className="text-amber-600 text-2xl">{cellVoltage} V</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic VII
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
