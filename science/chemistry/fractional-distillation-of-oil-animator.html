<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原油分餾模擬實驗室</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }

        @keyframes rise {
          0% { transform: translateY(0) scale(1); opacity: 0.5; }
          100% { transform: translateY(-500px) scale(1.5); opacity: 0; }
        }
        .animate-rise {
          animation: rise 3s infinite linear;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            margin-top: -10px; 
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            border: 2px solid white;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Stable Icon Components ---
        const Icons = {
            FlaskConical: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>,
            Flame: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.243-2.185.7-3.14 1.54 1.045 2.6 2.088 2.8 3.64Z"/></svg>,
            Thermometer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>,
            Car: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>,
            Plane: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 22h20"/><path d="M20.4 9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L14.5 4c-.5-1.3-2.2-1.3-2.7 0L10 8.3l-7.8 2.6c-.9.3-1.3 1.3-1 2.2l1 3 11.6-3.9c.5-.2 1.1.1 1.3.6l.5 1.4L2 18"/></svg>,
            Ship: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9 1 2.5 1S14 21 14 21c2.5 0 2.5-2 5-2 1.3 0 1.9 1 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.9 5.8 2.2 7.5"/><path d="M5 10 2 7l9-4 9 4-3 3"/><path d="M10 2v4"/><path d="M14 2v4"/><path d="M10 6h4"/></svg>,
            Hammer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25V2.4a1 1 0 0 0-1-1h-3.4a1 1 0 0 0-1 1v5.8c0 .85-.33 1.65-.93 2.25L11.2 11.7a2.1 2.1 0 0 0 0 2.98l4.25 4.25a2.1 2.1 0 0 0 2.98 0l2.48-2.48a2.1 2.1 0 0 0 0-2.98Z"/></svg>,
            Truck: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>,
            FlameKindling: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 2c-1.66 0-3 .67-3 2.25A3.25 3.25 0 0 0 12.25 7.5a3.25 3.25 0 0 1 3.25 3.25c0 2.5-2.24 4.25-5.5 4.25C6.14 15 2 12.16 2 8.5"/><path d="M2 18h20"/><path d="M6 22v-4"/><path d="M10 22v-4"/><path d="M14 22v-4"/><path d="M18 22v-4"/></svg>,
            Info: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            BookOpen: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            TrendingUp: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            TrendingDown: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
        };

        const FractionDistillationApp = () => {
            const [selectedFraction, setSelectedFraction] = useState(null);
            const [temperature, setTemperature] = useState(25); // Initial temp

            const apiKey = ""; // Key empty as requested

            // Data for fractions
            const fractions = [
                {
                    id: 'gas', name: '煉油氣 (Refinery Gases)', tempRange: '< 40°C', carbonCount: 'C1 - C4',
                    uses: '家用煮食燃料、露營氣體', icon: <Icons.FlameKindling size={24} />, color: 'bg-blue-100',
                    position: 0, description: '沸點最低，分子最小。在室溫下即為氣體，從塔頂逸出。'
                },
                {
                    id: 'petrol', name: '汽油 (Petrol / Gasoline)', tempRange: '40°C - 70°C', carbonCount: 'C5 - C10',
                    uses: '私家車燃料', icon: <Icons.Car size={24} />, color: 'bg-yellow-100',
                    position: 1, description: '易揮發的液體，極易燃燒。'
                },
                {
                    id: 'naphtha', name: '石腦油 (Naphtha)', tempRange: '70°C - 170°C', carbonCount: 'C8 - C12',
                    uses: '製造化學品、塑膠原料', icon: <Icons.FlaskConical size={24} />, color: 'bg-orange-100',
                    position: 2, description: '主要用於石油化工行業，裂解後生產乙烯等。'
                },
                {
                    id: 'kerosene', name: '煤油 / 火水 (Kerosene)', tempRange: '170°C - 250°C', carbonCount: 'C10 - C16',
                    uses: '飛機燃料 (Jet Fuel)、取暖', icon: <Icons.Plane size={24} />, color: 'bg-orange-200',
                    position: 3, description: '比汽油更黏稠，不易揮發。'
                },
                {
                    id: 'diesel', name: '柴油 (Diesel Oil)', tempRange: '250°C - 350°C', carbonCount: 'C14 - C20',
                    uses: '貨車、火車、重型機械燃料', icon: <Icons.Truck size={24} className="text-gray-700" />, color: 'bg-orange-300',
                    position: 4, description: '黏度較高，能量密度高。'
                },
                {
                    id: 'fuel_oil', name: '燃料油 (Fuel Oil)', tempRange: '350°C - 400°C', carbonCount: 'C20 - C70',
                    uses: '大型船隻、發電廠燃料', icon: <Icons.Ship size={24} />, color: 'bg-orange-400',
                    position: 5, description: '非常黏稠的液體，難以點燃。'
                },
                {
                    id: 'bitumen', name: '瀝青 (Bitumen)', tempRange: '> 400°C', carbonCount: '> C70',
                    uses: '鋪設道路、屋頂防水層', icon: <Icons.Hammer size={24} />, color: 'bg-gray-800 text-white',
                    position: 6, description: '沸點最高，分子最大。在塔底以黑色黏稠殘渣形式流出。'
                }
            ];

            // Determine active fraction based on slider temperature
            const getActiveFraction = () => {
                if (temperature < 40) return fractions[0];
                if (temperature < 100) return fractions[1];
                if (temperature < 170) return fractions[2];
                if (temperature < 250) return fractions[3];
                if (temperature < 350) return fractions[4];
                if (temperature < 400) return fractions[5];
                return fractions[6];
            };

            const activeFraction = getActiveFraction();
            const activeId = activeFraction.id;

            // Sync selectedFraction with temperature (Auto-select)
            useEffect(() => {
                setSelectedFraction(activeFraction);
            }, [activeFraction.id]); // Only update if fraction ID changes

            // Manually selecting a fraction also updates temperature to the middle of that range (for UX consistency)
            const handleFractionClick = (fraction) => {
                setSelectedFraction(fraction);
                // Set temp to a representative value for that fraction
                let newTemp = 25;
                switch(fraction.id) {
                    case 'gas': newTemp = 30; break;
                    case 'petrol': newTemp = 80; break;
                    case 'naphtha': newTemp = 135; break;
                    case 'kerosene': newTemp = 210; break;
                    case 'diesel': newTemp = 300; break;
                    case 'fuel_oil': newTemp = 375; break;
                    case 'bitumen': newTemp = 420; break;
                }
                setTemperature(newTemp);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
                    <header className="bg-blue-900 text-white p-4 shadow-lg">
                        <div className="container mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold flex items-center gap-2">
                                <Icons.FlaskConical /> 原油分餾模擬實驗室
                            </h1>
                            <span className="text-sm bg-blue-800 px-3 py-1 rounded-full hidden sm:block">High School Chemistry Level</span>
                        </div>
                    </header>

                    <main className="flex-grow container mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-8">
                        
                        {/* Left Column: Tower */}
                        <div className="flex-1 flex flex-col items-center bg-white p-6 rounded-2xl shadow-xl border border-slate-200 relative overflow-hidden">
                            <h2 className="text-xl font-bold mb-4 text-slate-700 w-full text-center">分餾塔 (Fractionating Column)</h2>
                            
                            <div className="relative w-full max-w-md h-[600px] flex flex-col">
                                <div className="absolute inset-y-0 left-1/4 right-1/4 rounded-lg bg-gradient-to-b from-blue-50 via-yellow-50 to-red-100 border-x-4 border-slate-400 z-0 opacity-80"></div>
                                <div className="absolute left-0 h-full flex flex-col justify-between text-xs font-mono text-slate-500 py-4">
                                    <span>25°C (冷)</span><span>|</span><span>100°C</span><span>|</span><span>200°C</span><span>|</span><span>300°C</span><span>|</span><span>400°C (熱)</span>
                                </div>

                                <div className="z-10 flex flex-col h-full justify-between w-full py-2">
                                    {fractions.map((fraction) => (
                                        <div 
                                            key={fraction.id}
                                            onClick={() => handleFractionClick(fraction)}
                                            className={`
                                                relative group cursor-pointer transition-all duration-300
                                                flex items-center
                                                ${selectedFraction?.id === fraction.id ? 'scale-105' : 'hover:scale-105'}
                                            `}
                                        >
                                            {/* Pipe Output Visual - FIXED z-index */}
                                            <div className={`
                                                hidden md:block absolute right-[25%] w-[15%] h-3 bg-slate-300 
                                                border-y border-slate-400 z-0
                                                group-hover:bg-blue-200
                                            `}></div>

                                            {/* The Fraction Box - FIXED relative and z-index */}
                                            <div className={`
                                                relative z-10
                                                w-full md:w-1/2 md:mx-auto p-2 md:p-3 rounded-lg border-2 
                                                flex justify-between items-center shadow-sm
                                                ml-[20%] md:ml-auto
                                                ${fraction.color}
                                                ${selectedFraction?.id === fraction.id ? 'border-blue-500 ring-2 ring-blue-200 shadow-lg' : 'border-transparent'}
                                                ${activeId === fraction.id ? 'ring-4 ring-red-400 animate-pulse' : ''}
                                            `}>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm md:text-base">{fraction.name.split(' ')[0]}</span>
                                                </div>
                                                <span className="text-xs font-mono hidden sm:inline-block">{fraction.carbonCount}</span>
                                            </div>

                                            <div className="absolute right-0 md:right-4 text-xs md:text-sm bg-white/80 px-2 py-1 rounded shadow-sm w-24 text-right z-10">
                                                {fraction.uses.split('、')[0]}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="absolute bottom-0 left-1/4 right-1/4 h-16 bg-slate-700 rounded-b-lg flex flex-col items-center justify-center text-white z-20">
                                    <span className="text-sm font-bold">加熱爐</span>
                                    {temperature > 50 && <Icons.Flame className={`text-orange-500 ${temperature > 200 ? 'animate-bounce' : ''}`} />}
                                </div>
                                <div className="absolute bottom-8 left-0 w-1/4 h-4 bg-black flex items-center">
                                    <div className="w-full text-[10px] text-white text-center">原油</div>
                                </div>

                                {/* Rising Bubbles Animation based on temperature */}
                                {temperature > 50 && (
                                    <div className="absolute inset-0 left-1/4 right-1/4 pointer-events-none overflow-hidden z-0">
                                        <div className="animate-rise absolute bottom-0 left-1/3 w-4 h-4 bg-yellow-200 rounded-full opacity-50" style={{animationDuration: `${30000/temperature}s`}}></div>
                                        <div className="animate-rise absolute bottom-0 left-1/2 w-6 h-6 bg-white rounded-full opacity-40 delay-100" style={{animationDuration: `${40000/temperature}s`}}></div>
                                        <div className="animate-rise absolute bottom-0 right-1/3 w-3 h-3 bg-orange-200 rounded-full opacity-50 delay-200" style={{animationDuration: `${35000/temperature}s`}}></div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Right Column */}
                        <div className="flex-1 flex flex-col gap-6">
                            {/* Controls - Temperature Slider */}
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold flex items-center gap-2">
                                        <Icons.Thermometer className="text-red-500" /> 爐溫控制 (Temp Control)
                                    </h3>
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl font-mono font-bold text-red-600">{temperature}°C</span>
                                    </div>
                                </div>
                                
                                <div className="relative pt-2 pb-6">
                                    <input 
                                        type="range" 
                                        min="25" 
                                        max="450" 
                                        value={temperature} 
                                        onChange={(e) => setTemperature(Number(e.target.value))}
                                        className="w-full"
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 font-bold mt-2 absolute w-full">
                                        <span>25°C (冷)</span>
                                        <span>450°C (熱)</span>
                                    </div>
                                </div>
                                <p className="text-xs text-slate-500 bg-slate-50 p-2 rounded border border-slate-100 mt-2">
                                    <strong className="text-slate-700">操作提示：</strong> 拖動滑桿改變溫度，觀察分餾塔中哪一層正在冷凝收集。
                                </p>
                            </div>

                            {/* Details Card (Auto-updates) */}
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100 animate-in fade-in duration-300 flex-grow">
                                {selectedFraction ? (
                                    <>
                                        <div className="flex items-start justify-between mb-6">
                                            <div>
                                                <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Current Distillate</div>
                                                <h2 className="text-3xl font-bold text-slate-800">{selectedFraction.name}</h2>
                                                <p className="text-slate-500 font-mono text-sm mt-1 px-2 py-0.5 bg-slate-100 rounded inline-block">
                                                    {selectedFraction.carbonCount}
                                                </p>
                                            </div>
                                            <div className={`p-4 rounded-full ${selectedFraction.color} shadow-inner transform transition-transform hover:scale-110`}>
                                                {selectedFraction.icon}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 mb-6">
                                            <div className="bg-red-50 p-3 rounded-xl border border-red-100">
                                                <p className="text-[10px] text-red-400 font-bold uppercase mb-1 flex items-center gap-1"><Icons.Thermometer size={12}/> 沸點範圍</p>
                                                <p className="font-bold text-red-700">{selectedFraction.tempRange}</p>
                                            </div>
                                            <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                                <p className="text-[10px] text-blue-400 font-bold uppercase mb-1 flex items-center gap-1"><Icons.Car size={12}/> 主要用途</p>
                                                <p className="font-bold text-blue-700 text-sm">{selectedFraction.uses.split('、')[0]}</p>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                            <p className="text-sm text-slate-600 leading-relaxed">
                                                {selectedFraction.description}
                                            </p>
                                        </div>
                                    </>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 py-10">
                                        <p>滑動溫度計以開始分餾...</p>
                                    </div>
                                )}
                            </div>

                            {/* Key Concepts Panel (Replaces AI if no key) */}
                            {!apiKey && (
                                <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100 h-full">
                                    <h3 className="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                                        <Icons.BookOpen className="text-blue-500" /> 學習重點 (Key Trends)
                                    </h3>
                                    
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3 p-3 bg-red-50 rounded-lg border-l-4 border-red-400">
                                            <div className="bg-white p-2 rounded-full text-red-500 shadow-sm"><Icons.Thermometer size={20}/></div>
                                            <div>
                                                <div className="text-xs font-bold text-slate-500 uppercase">沸點 (Boiling Point)</div>
                                                <div className="font-bold text-slate-700 flex items-center gap-1">
                                                    向下增加 <Icons.TrendingUp size={16}/>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-3 p-3 bg-orange-50 rounded-lg border-l-4 border-orange-400">
                                            <div className="bg-white p-2 rounded-full text-orange-500 shadow-sm"><Icons.Droplets size={20}/></div>
                                            <div>
                                                <div className="text-xs font-bold text-slate-500 uppercase">黏滯度 (Viscosity)</div>
                                                <div className="font-bold text-slate-700 flex items-center gap-1">
                                                    向下增加 <Icons.TrendingUp size={16}/>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-3 p-3 bg-yellow-50 rounded-lg border-l-4 border-yellow-400">
                                            <div className="bg-white p-2 rounded-full text-yellow-500 shadow-sm"><Icons.Flame size={20}/></div>
                                            <div>
                                                <div className="text-xs font-bold text-slate-500 uppercase">易燃性 (Flammability)</div>
                                                <div className="font-bold text-slate-700 flex items-center gap-1">
                                                    向下減少 <Icons.TrendingDown size={16}/>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-4 text-xs text-slate-400 leading-relaxed">
                                            <span className="font-bold">原理：</span> 分子越大，分子間引力（范德華力）越強，因此沸點越高，液體越黏稠，且越難揮發燃燒。
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FractionDistillationApp />);
    </script>
</body>
</html>
