<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原油分餾模擬器 (Fractional Distillation)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }

        @keyframes rise {
          0% { transform: translateY(0) scale(1); opacity: 0.5; }
          100% { transform: translateY(-500px) scale(1.5); opacity: 0; }
        }
        .animate-rise {
          animation: rise 3s infinite linear;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Stable Icon Components (Replacing Lucide script to prevent DOM conflicts) ---
        const Icons = {
            FlaskConical: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>,
            Flame: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.243-2.185.7-3.14 1.54 1.045 2.6 2.088 2.8 3.64Z"/></svg>,
            Thermometer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>,
            Car: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>,
            Plane: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 22h20"/><path d="M20.4 9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L14.5 4c-.5-1.3-2.2-1.3-2.7 0L10 8.3l-7.8 2.6c-.9.3-1.3 1.3-1 2.2l1 3 11.6-3.9c.5-.2 1.1.1 1.3.6l.5 1.4L2 18"/></svg>,
            Ship: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9 1 2.5 1S14 21 14 21c2.5 0 2.5-2 5-2 1.3 0 1.9 1 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.9 5.8 2.2 7.5"/><path d="M5 10 2 7l9-4 9 4-3 3"/><path d="M10 2v4"/><path d="M14 2v4"/><path d="M10 6h4"/></svg>,
            Hammer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25V2.4a1 1 0 0 0-1-1h-3.4a1 1 0 0 0-1 1v5.8c0 .85-.33 1.65-.93 2.25L11.2 11.7a2.1 2.1 0 0 0 0 2.98l4.25 4.25a2.1 2.1 0 0 0 2.98 0l2.48-2.48a2.1 2.1 0 0 0 0-2.98Z"/></svg>,
            Truck: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>,
            MessageCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>,
            BrainCircuit: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 1 19.5 4.5"/><path d="M12 18a4 4 0 0 0 .203-8.134 4 4 0 0 0-3.237 3.236"/></svg>,
            Send: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
            Loader2: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Sparkles: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/></svg>,
            RefreshCw: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/></svg>,
            CheckCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>,
            XCircle: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
        };

        const FractionDistillationApp = () => {
            const [selectedFraction, setSelectedFraction] = useState(null);
            const [isSimulating, setIsSimulating] = useState(false);
            const [temperature, setTemperature] = useState(25);

            // AI State
            const [aiMode, setAiMode] = useState('chat');
            const [chatInput, setChatInput] = useState('');
            const [chatHistory, setChatHistory] = useState([{ role: 'model', text: '你好！我是你的 AI 化學導師。關於分餾過程或特定的產物，你有什麼問題嗎？' }]);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [quizData, setQuizData] = useState(null);
            const [quizSelectedOption, setQuizSelectedOption] = useState(null);
            const [quizResult, setQuizResult] = useState(null);

            const apiKey = ""; // Use system provided key if available

            // Data for fractions (Updated to use Icons component)
            const fractions = [
                {
                    id: 'gas', name: '煉油氣 (Refinery Gases)', tempRange: '< 40°C', carbonCount: 'C1 - C4',
                    uses: '家用煮食燃料、露營氣體', icon: <Icons.FlaskConical size={24} />, color: 'bg-blue-100',
                    position: 0, description: '沸點最低，分子最小。在室溫下即為氣體，從塔頂逸出。'
                },
                {
                    id: 'petrol', name: '汽油 (Petrol / Gasoline)', tempRange: '40°C - 70°C', carbonCount: 'C5 - C10',
                    uses: '私家車燃料', icon: <Icons.Car size={24} />, color: 'bg-yellow-100',
                    position: 1, description: '易揮發的液體，極易燃燒。'
                },
                {
                    id: 'naphtha', name: '石腦油 (Naphtha)', tempRange: '70°C - 170°C', carbonCount: 'C8 - C12',
                    uses: '製造化學品、塑膠原料', icon: <Icons.FlaskConical size={24} />, color: 'bg-orange-100',
                    position: 2, description: '主要用於石油化工行業，裂解後生產乙烯等。'
                },
                {
                    id: 'kerosene', name: '煤油 / 火水 (Kerosene)', tempRange: '170°C - 250°C', carbonCount: 'C10 - C16',
                    uses: '飛機燃料 (Jet Fuel)、取暖', icon: <Icons.Plane size={24} />, color: 'bg-orange-200',
                    position: 3, description: '比汽油更黏稠，不易揮發。'
                },
                {
                    id: 'diesel', name: '柴油 (Diesel Oil)', tempRange: '250°C - 350°C', carbonCount: 'C14 - C20',
                    uses: '貨車、火車、重型機械燃料', icon: <Icons.Truck size={24} className="text-gray-700" />, color: 'bg-orange-300',
                    position: 4, description: '黏度較高，能量密度高。'
                },
                {
                    id: 'fuel_oil', name: '燃料油 (Fuel Oil)', tempRange: '350°C - 400°C', carbonCount: 'C20 - C70',
                    uses: '大型船隻、發電廠燃料', icon: <Icons.Ship size={24} />, color: 'bg-orange-400',
                    position: 5, description: '非常黏稠的液體，難以點燃。'
                },
                {
                    id: 'bitumen', name: '瀝青 (Bitumen)', tempRange: '> 400°C', carbonCount: '> C70',
                    uses: '鋪設道路、屋頂防水層', icon: <Icons.Hammer size={24} />, color: 'bg-gray-800 text-white',
                    position: 6, description: '沸點最高，分子最大。在塔底以黑色黏稠殘渣形式流出。'
                }
            ];

            // Animation Logic
            useEffect(() => {
                let interval;
                if (isSimulating) {
                    setTemperature(25);
                    interval = setInterval(() => {
                        setTemperature((prev) => {
                            if (prev >= 450) {
                                setIsSimulating(false);
                                return 450;
                            }
                            return prev + 2;
                        });
                    }, 20);
                } else {
                    setTemperature(25);
                }
                return () => clearInterval(interval);
            }, [isSimulating]);

            const getActiveFraction = () => {
                if (!isSimulating) return null;
                if (temperature < 40) return 'gas';
                if (temperature < 100) return 'petrol';
                if (temperature < 170) return 'naphtha';
                if (temperature < 250) return 'kerosene';
                if (temperature < 350) return 'diesel';
                if (temperature < 400) return 'fuel_oil';
                return 'bitumen';
            };

            const activeId = getActiveFraction();

            // AI Logic
            const callGeminiChat = async () => {
                if (!chatInput.trim()) return;
                const userMessage = chatInput;
                setChatHistory(prev => [...prev, { role: 'user', text: userMessage }]);
                setChatInput('');
                
                if (!apiKey) {
                     setChatHistory(prev => [...prev, { role: 'model', text: "請在代碼中設定 API Key 才能使用 AI 功能。" }]);
                     return;
                }
                
                setIsAiLoading(true);
                const context = selectedFraction 
                    ? `Current selected fraction: ${selectedFraction.name}. Properties: ${selectedFraction.description}, Uses: ${selectedFraction.uses}, Carbon Count: ${selectedFraction.carbonCount}, Boiling Point Range: ${selectedFraction.tempRange}.`
                    : `User is looking at the general fractional distillation column.`;

                const prompt = `You are a helpful and encouraging high school chemistry tutor. The student is using an interactive web app about fractional distillation of crude oil. ${context} Please answer the student's question: "${userMessage}". Keep the answer concise (under 3 sentences if possible), accurate for high school level chemistry, and use Traditional Chinese (繁體中文).`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我現在無法回答，請稍後再試。";
                    setChatHistory(prev => [...prev, { role: 'model', text: aiText }]);
                } catch (error) {
                    console.error("Gemini API Error:", error);
                    setChatHistory(prev => [...prev, { role: 'model', text: "連線錯誤，請檢查網絡或 API 金鑰。" }]);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const generateQuiz = async () => {
                if (!apiKey) {
                     alert("請在代碼中設定 API Key 才能使用 AI 功能。");
                     return;
                }
                setIsAiLoading(true);
                setQuizData(null);
                setQuizSelectedOption(null);
                setQuizResult(null);

                const context = selectedFraction 
                ? `Focus the question on: ${selectedFraction.name} (${selectedFraction.carbonCount}).` 
                : `Focus the question on the general concept of fractional distillation (boiling points, viscosity, molecular size trends).`;

                const prompt = `Generate a single multiple-choice question (MCQ) for a high school chemistry student about fractional distillation of crude oil. ${context} Return ONLY raw JSON with this structure: { "question": "Question text in Traditional Chinese", "options": ["A", "B", "C", "D"], "correctIndex": 0, "explanation": "Explanation in Traditional Chinese" }`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await response.json();
                    const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (jsonText) {
                        const parsedQuiz = JSON.parse(jsonText);
                        setQuizData(parsedQuiz);
                    }
                } catch (error) {
                    console.error("Quiz Gen Error:", error);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const handleQuizSelection = (index) => {
                if (quizResult) return;
                setQuizSelectedOption(index);
                if (index === quizData.correctIndex) setQuizResult('correct');
                else setQuizResult('incorrect');
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
                    <header className="bg-blue-900 text-white p-4 shadow-lg">
                        <div className="container mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold flex items-center gap-2">
                                <Icons.FlaskConical /> 原油分餾模擬實驗室
                            </h1>
                            <span className="text-sm bg-blue-800 px-3 py-1 rounded-full hidden sm:block">High School Chemistry Level</span>
                        </div>
                    </header>

                    <main className="flex-grow container mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-8">
                        
                        {/* Left Column: Tower */}
                        <div className="flex-1 flex flex-col items-center bg-white p-6 rounded-2xl shadow-xl border border-slate-200 relative overflow-hidden">
                            <h2 className="text-xl font-bold mb-4 text-slate-700 w-full text-center">分餾塔 (Fractionating Column)</h2>
                            
                            <div className="relative w-full max-w-md h-[600px] flex flex-col">
                                <div className="absolute inset-y-0 left-1/4 right-1/4 rounded-lg bg-gradient-to-b from-blue-50 via-yellow-50 to-red-100 border-x-4 border-slate-400 z-0 opacity-80"></div>
                                <div className="absolute left-0 h-full flex flex-col justify-between text-xs font-mono text-slate-500 py-4">
                                    <span>25°C (冷)</span><span>|</span><span>100°C</span><span>|</span><span>200°C</span><span>|</span><span>300°C</span><span>|</span><span>400°C (熱)</span>
                                </div>

                                <div className="z-10 flex flex-col h-full justify-between w-full py-2">
                                    {fractions.map((fraction) => (
                                        <div 
                                            key={fraction.id}
                                            onClick={() => setSelectedFraction(fraction)}
                                            className={`
                                                relative group cursor-pointer transition-all duration-300
                                                flex items-center
                                                ${selectedFraction?.id === fraction.id ? 'scale-105' : 'hover:scale-105'}
                                            `}
                                        >
                                            <div className={`
                                                hidden md:block absolute right-[25%] w-[15%] h-3 bg-slate-300 
                                                border-y border-slate-400
                                                group-hover:bg-blue-200
                                            `}></div>

                                            <div className={`
                                                w-full md:w-1/2 md:mx-auto p-2 md:p-3 rounded-lg border-2 
                                                flex justify-between items-center shadow-sm
                                                ml-[20%] md:ml-auto
                                                ${fraction.color}
                                                ${selectedFraction?.id === fraction.id ? 'border-blue-500 ring-2 ring-blue-200 shadow-lg' : 'border-transparent'}
                                                ${isSimulating && activeId === fraction.id ? 'animate-pulse ring-4 ring-red-400' : ''}
                                            `}>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm md:text-base">{fraction.name.split(' ')[0]}</span>
                                                </div>
                                                <span className="text-xs font-mono hidden sm:inline-block">{fraction.carbonCount}</span>
                                            </div>

                                            <div className="absolute right-0 md:right-4 text-xs md:text-sm bg-white/80 px-2 py-1 rounded shadow-sm w-24 text-right">
                                                {fraction.uses.split('、')[0]}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="absolute bottom-0 left-1/4 right-1/4 h-16 bg-slate-700 rounded-b-lg flex flex-col items-center justify-center text-white z-20">
                                    <span className="text-sm font-bold">加熱爐</span>
                                    {isSimulating && <Icons.Flame className="text-orange-500 animate-bounce" />}
                                </div>
                                <div className="absolute bottom-8 left-0 w-1/4 h-4 bg-black flex items-center">
                                    <div className="w-full text-[10px] text-white text-center">原油</div>
                                </div>

                                {isSimulating && (
                                <div className="absolute inset-0 left-1/4 right-1/4 pointer-events-none overflow-hidden z-0">
                                    <div className="animate-rise absolute bottom-0 left-1/3 w-4 h-4 bg-yellow-200 rounded-full opacity-50"></div>
                                    <div className="animate-rise absolute bottom-0 left-1/2 w-6 h-6 bg-white rounded-full opacity-40 delay-100"></div>
                                    <div className="animate-rise absolute bottom-0 right-1/3 w-3 h-3 bg-orange-200 rounded-full opacity-50 delay-200"></div>
                                </div>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
                                <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                    <Icons.Thermometer className="text-red-500" /> 實驗控制
                                </h3>
                                
                                <div className="flex items-center gap-4 mb-4">
                                    <button
                                        onClick={() => setIsSimulating(!isSimulating)}
                                        className={`
                                            flex-1 py-3 px-6 rounded-xl font-bold text-white transition-colors
                                            ${isSimulating 
                                                ? 'bg-red-500 hover:bg-red-600' 
                                                : 'bg-green-500 hover:bg-green-600'}
                                        `}
                                    >
                                        {isSimulating ? '停止加熱' : '開始加熱 / 模擬'}
                                    </button>
                                </div>

                                <div className="bg-slate-100 rounded-xl p-4 flex items-center justify-between">
                                    <span className="text-slate-500 text-sm font-semibold">當前爐溫</span>
                                    <span className="text-3xl font-mono font-bold text-slate-800">{temperature}°C</span>
                                </div>
                                
                                <p className="text-xs text-slate-400 mt-2">
                                    提示：點擊左側的分餾塔層級以查看詳細資料。
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100 flex-grow">
                                {selectedFraction ? (
                                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                        <div className="flex items-start justify-between mb-6">
                                            <div>
                                                <h2 className="text-2xl font-bold text-slate-800">{selectedFraction.name}</h2>
                                                <p className="text-slate-500">碳鏈長度: {selectedFraction.carbonCount}</p>
                                            </div>
                                            <div className={`p-3 rounded-full ${selectedFraction.color} shadow-inner`}>
                                                {selectedFraction.icon}
                                            </div>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-500">
                                                    <Icons.Thermometer size={20} />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-slate-400 uppercase font-bold">沸點範圍</p>
                                                    <p className="font-medium">{selectedFraction.tempRange}</p>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
                                                    <Icons.Droplets size={20} />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-slate-400 uppercase font-bold">黏滯度 (Viscosity)</p>
                                                    <p className="font-medium">
                                                        {selectedFraction.position > 4 ? '極高 (像蜜糖)' : selectedFraction.position > 2 ? '中等' : '極低 (易流動)'}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-500">
                                                    <Icons.Flame size={20} />
                                                </div>
                                                <div>
                                                    <p className="text-xs text-slate-400 uppercase font-bold">易燃性 (Flammability)</p>
                                                    <p className="font-medium">
                                                        {selectedFraction.position > 4 ? '難以點燃' : selectedFraction.position > 2 ? '一般' : '極易燃'}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                <p className="text-sm text-slate-600 leading-relaxed">
                                                    <span className="font-bold text-slate-800 block mb-1">詳細說明：</span>
                                                    {selectedFraction.description}
                                                </p>
                                                <p className="text-sm text-slate-600 mt-2">
                                                    <span className="font-bold text-slate-800 block mb-1">主要用途：</span>
                                                    {selectedFraction.uses}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 py-10">
                                        <Icons.FlaskConical size={48} className="mb-4 opacity-20" />
                                        <p>請點擊分餾塔的任意層級</p>
                                        <p className="text-sm">查看該餾分的詳細化學性質</p>
                                    </div>
                                )}
                            </div>

                            <div className="bg-indigo-50 rounded-2xl shadow-md border border-indigo-100 overflow-hidden flex flex-col flex-grow min-h-[300px]">
                                <div className="bg-indigo-100 p-2 flex gap-2">
                                    <button onClick={() => setAiMode('chat')} className={`flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-bold transition-all ${aiMode === 'chat' ? 'bg-white text-indigo-600 shadow-sm' : 'text-indigo-400 hover:text-indigo-600'}`}>
                                        <Icons.MessageCircle size={16} /> AI 導師
                                    </button>
                                    <button onClick={() => setAiMode('quiz')} className={`flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-bold transition-all ${aiMode === 'quiz' ? 'bg-white text-indigo-600 shadow-sm' : 'text-indigo-400 hover:text-indigo-600'}`}>
                                        <Icons.BrainCircuit size={16} /> ✨ 智能測驗
                                    </button>
                                </div>
                                <div className="flex-grow p-4 flex flex-col bg-white/50">
                                    {aiMode === 'chat' && (
                                        <>
                                            <div className="flex-grow overflow-y-auto space-y-3 mb-3 max-h-[200px] md:max-h-[300px] p-2 custom-scrollbar">
                                                {chatHistory.map((msg, idx) => (
                                                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border border-indigo-100 text-slate-700 rounded-bl-none shadow-sm'}`}>{msg.text}</div>
                                                    </div>
                                                ))}
                                                {isAiLoading && <div className="flex justify-start"><div className="bg-white border border-indigo-100 p-3 rounded-2xl rounded-bl-none shadow-sm flex items-center gap-2 text-indigo-500 text-sm"><Icons.Loader2 size={14} className="animate-spin" /> 正在思考中...</div></div>}
                                            </div>
                                            <div className="relative mt-auto">
                                                <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && callGeminiChat()} placeholder="輸入問題..." className="w-full pl-4 pr-12 py-3 rounded-xl border border-indigo-200 focus:ring-2 focus:ring-indigo-300 focus:border-transparent outline-none text-sm" />
                                                <button onClick={callGeminiChat} disabled={isAiLoading || !chatInput.trim()} className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-slate-300 transition-colors"><Icons.Send size={16} /></button>
                                            </div>
                                        </>
                                    )}
                                    {aiMode === 'quiz' && (
                                        <div className="flex flex-col h-full justify-center items-center text-center">
                                            {!quizData ? (
                                                <>
                                                    <div className="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-500 mb-2"><Icons.Sparkles size={32} /></div>
                                                    <h4 className="font-bold text-slate-700">生成化學測驗</h4>
                                                    <button onClick={generateQuiz} disabled={isAiLoading} className="mt-4 bg-indigo-600 text-white py-2 px-6 rounded-full font-bold text-sm hover:bg-indigo-700 transition-transform active:scale-95 disabled:bg-slate-300 flex items-center gap-2">
                                                        {isAiLoading ? <Icons.Loader2 size={16} className="animate-spin" /> : <Icons.RefreshCw size={16} />} {isAiLoading ? '生成中...' : '立即生成題目'}
                                                    </button>
                                                </>
                                            ) : (
                                                <div className="w-full text-left">
                                                    <div className="mb-4"><span className="text-xs font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded mb-2 inline-block">✨ AI Question</span><h4 className="font-bold text-slate-800">{quizData.question}</h4></div>
                                                    <div className="space-y-2 mb-4">{quizData.options.map((opt, idx) => (
                                                        <button key={idx} onClick={() => handleQuizSelection(idx)} disabled={quizResult !== null} className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${quizSelectedOption === idx ? (quizResult === 'correct' ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-500 text-red-800') : 'bg-white border-slate-200 hover:bg-slate-50'}`}>{String.fromCharCode(65+idx)}. {opt}</button>
                                                    ))}</div>
                                                    {quizResult && <div className={`p-3 rounded-lg text-sm mb-3 ${quizResult === 'correct' ? 'bg-green-100 text-green-800' : 'bg-red-50 text-red-800'}`}><p className="font-bold">{quizResult === 'correct' ? '答對了！' : '再接再厲！'}</p><p>{quizData.explanation}</p></div>}
                                                    <button onClick={generateQuiz} className="w-full py-2 bg-slate-100 text-slate-600 font-bold rounded-lg text-sm hover:bg-slate-200 transition-colors flex items-center justify-center gap-2"><Icons.RefreshCw size={14} /> 下一題</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FractionDistillationApp />);
    </script>
</body>
</html>
