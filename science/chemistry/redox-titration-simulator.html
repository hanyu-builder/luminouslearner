<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagent Master - Organic Chemistry Quiz</title>
    
    <!-- React & Tailwind & Lucide & Fonts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-slide-up { animation: slideUp 0.5s ease-out; }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className}></i>;
        };

        // --- QUESTION BANK ---
        // Format: { from: "Compound A", to: "Compound B", correct: "Reagent", distractor: ["Wrong 1", "Wrong 2", "Wrong 3"], note: "Explanation" }
        const questionBank = [
            // ALIPHATIC
            { from: "Alkene", to: "Alkane", correct: "H₂ / Pt", distractors: ["H₂SO₄", "LiAlH₄", "NaBH₄"], note: "Catalytic Hydrogenation adds H₂ across the double bond." },
            { from: "Alkene", to: "Haloalkane", correct: "HX (g)", distractors: ["X₂ / UV light", "KOH (alc)", "PCl₅"], note: "Electrophilic Addition. Follows Markovnikov's rule." },
            { from: "Alkene", to: "Diol", correct: "Cold dil. KMnO₄ / H⁺", distractors: ["Conc. H₂SO₄", "K₂Cr₂O₇ / H⁺", "O₃"], note: "Mild oxidation turns C=C into OH-C-C-OH." },
            { from: "Haloalkane", to: "Alcohol", correct: "NaOH (aq), heat", distractors: ["NaOH (alc), heat", "Conc. H₂SO₄", "H₂O"], note: "Aqueous NaOH causes Substitution. Alcoholic NaOH causes Elimination." },
            { from: "Haloalkane", to: "Alkene", correct: "NaOH (alc), heat", distractors: ["NaOH (aq), heat", "Conc. H₂SO₄", "H₂ / Pt"], note: "Elimination reaction requires alcoholic conditions." },
            { from: "Haloalkane", to: "Nitrile", correct: "KCN (alc), reflux", distractors: ["HCN", "NH₃", "HNO₃"], note: "Step-up reaction: Adds one carbon atom." },
            { from: "1° Alcohol", to: "Aldehyde", correct: "K₂Cr₂O₇ / H⁺, Distil", distractors: ["KMnO₄ / H⁺, Reflux", "LiAlH₄", "Conc. H₂SO₄"], note: "Distillation removes the aldehyde before it oxidizes further to acid." },
            { from: "1° Alcohol", to: "Carboxylic Acid", correct: "KMnO₄ / H⁺, Reflux", distractors: ["PCC", "NaBH₄", "NaOH"], note: "Strong oxidation under reflux ensures complete conversion to acid." },
            { from: "Carboxylic Acid", to: "1° Alcohol", correct: "LiAlH₄ in dry ether", distractors: ["NaBH₄", "H₂ / Pt", "Sn / HCl"], note: "Only LiAlH₄ is strong enough to reduce acids. NaBH₄ cannot." },
            { from: "Carboxylic Acid", to: "Acyl Chloride", correct: "SOCl₂", distractors: ["Cl₂", "HCl", "NaCl"], note: "Thionyl chloride replaces -OH with -Cl." },
            { from: "Acyl Chloride", to: "Amide", correct: "NH₃ (conc)", distractors: ["HNO₃", "NH₄Cl", "NaNO₂"], note: "Nucleophilic substitution with Ammonia." },
            
            // AROMATIC
            { from: "Benzene", to: "Nitrobenzene", correct: "Conc. HNO₃ / Conc. H₂SO₄", distractors: ["Dil. HNO₃", "HNO₃ / Reflux", "NaNO₂ / HCl"], note: "Nitration requires a nitrating mixture to generate NO₂⁺." },
            { from: "Benzene", to: "Bromobenzene", correct: "Br₂ / FeBr₃", distractors: ["Br₂ (aq)", "Br₂ / UV light", "HBr"], note: "Benzene needs a Lewis Acid catalyst (FeBr₃) for halogenation." },
            { from: "Methylbenzene", to: "Benzoic Acid", correct: "KMnO₄ / OH⁻, Reflux", distractors: ["K₂Cr₂O₇ / H⁺", "O₃", "Conc. HNO₃"], note: "Side-chain oxidation requires strong conditions (Permanganate)." },
            { from: "Nitrobenzene", to: "Phenylamine", correct: "Sn / Conc. HCl", distractors: ["LiAlH₄", "H₂ / Pt", "NaBH₄"], note: "Reduction of Nitro group usually uses Tin and Acid." },
            { from: "Phenylamine", to: "Diazonium Salt", correct: "NaNO₂ / HCl, < 5°C", distractors: ["HNO₃", "NH₃", "Reflux"], note: "Diazotization must be kept cold to prevent decomposition." },
            { from: "Diazonium Salt", to: "Benzonitrile", correct: "CuCN", distractors: ["KCN", "HCN", "CH₃CN"], note: "Sandmeyer Reaction uses Copper(I) salts." },
            { from: "Diazonium Salt", to: "Phenol", correct: "H₂O, Warm", distractors: ["NaOH", "OH⁻", "Alcohol"], note: "Hydrolysis of diazonium salt releases N₂ gas." }
        ];

        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        const App = () => {
            const [gameState, setGameState] = useState('menu'); // menu, playing, result
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [shuffledQuestions, setShuffledQuestions] = useState([]);
            const [currentOptions, setCurrentOptions] = useState([]);
            const [feedback, setFeedback] = useState(null); // { isCorrect, message, correctVal }
            const [selectedOption, setSelectedOption] = useState(null);

            // Init Game
            const startGame = () => {
                const q = shuffleArray(questionBank).slice(0, 10); // Take 10 random questions
                setShuffledQuestions(q);
                setCurrentQuestionIndex(0);
                setScore(0);
                setStreak(0);
                setGameState('playing');
                loadQuestion(q[0]);
            };

            const loadQuestion = (question) => {
                setFeedback(null);
                setSelectedOption(null);
                const opts = shuffleArray([question.correct, ...question.distractors]);
                setCurrentOptions(opts);
            };

            const handleAnswer = (option) => {
                if (feedback) return; // Prevent double click

                const currentQ = shuffledQuestions[currentQuestionIndex];
                const isCorrect = option === currentQ.correct;

                setSelectedOption(option);

                if (isCorrect) {
                    setScore(s => s + 10 + (streak * 2)); // Bonus for streak
                    setStreak(s => s + 1);
                    setFeedback({ isCorrect: true, message: "Correct! " + currentQ.note });
                } else {
                    setStreak(0);
                    setFeedback({ isCorrect: false, message: currentQ.note, correctVal: currentQ.correct });
                }
            };

            const nextQuestion = () => {
                if (currentQuestionIndex < shuffledQuestions.length - 1) {
                    const nextIdx = currentQuestionIndex + 1;
                    setCurrentQuestionIndex(nextIdx);
                    loadQuestion(shuffledQuestions[nextIdx]);
                } else {
                    setGameState('result');
                }
            };

            // --- RENDERERS ---

            if (gameState === 'menu') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#0F172A] relative overflow-hidden">
                        <div className="absolute inset-0 opacity-10 pointer-events-none">
                             <svg width="100%" height="100%">
                                <pattern id="pattern-circles" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <circle cx="20" cy="20" r="1.5" fill="#fff"/>
                                </pattern>
                                <rect x="0" y="0" width="100%" height="100%" fill="url(#pattern-circles)"/>
                             </svg>
                        </div>
                        
                        <div className="text-center space-y-8 z-10 animate-fade-in">
                            <div className="inline-block p-4 rounded-full bg-slate-800 border-2 border-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.3)] mb-4">
                                <Icon name="flask-conical" className="w-16 h-16 text-emerald-400" />
                            </div>
                            <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                                Reagent Master
                            </h1>
                            <p className="text-slate-400 text-lg max-w-md mx-auto">
                                測試你對有機化學反應條件的熟悉程度。準備好挑戰 DSE 級別的試劑庫了嗎？
                            </p>
                            <button 
                                onClick={startGame}
                                className="group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-emerald-600 font-lg rounded-full hover:bg-emerald-500 hover:scale-105 hover:shadow-[0_0_20px_rgba(16,185,129,0.5)] focus:outline-none ring-offset-2 focus:ring-2 ring-emerald-400"
                            >
                                <span className="mr-2">開始挑戰</span>
                                <Icon name="arrow-right" className="w-5 h-5 group-hover:translate-x-1 transition-transform"/>
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'result') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#0F172A] text-center">
                        <div className="bg-slate-800/80 backdrop-blur p-8 rounded-3xl border border-slate-700 shadow-2xl max-w-md w-full animate-slide-up">
                            <div className="mb-6">
                                {score > 80 ? (
                                    <div className="text-6xl mb-4">🏆</div>
                                ) : score > 50 ? (
                                    <div className="text-6xl mb-4">🧪</div>
                                ) : (
                                    <div className="text-6xl mb-4">💥</div>
                                )}
                                <h2 className="text-3xl font-bold text-white mb-2">Quiz Complete!</h2>
                                <p className="text-slate-400">你的最終得分</p>
                            </div>
                            
                            <div className="text-6xl font-black text-emerald-400 mb-8">{score}</div>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-700">
                                    <div className="text-slate-500 text-xs uppercase font-bold">準確率</div>
                                    <div className="text-xl font-bold text-white">{(score / (10*15) * 100).toFixed(0)}%</div>
                                </div>
                                <div className="bg-slate-900 p-3 rounded-xl border border-slate-700">
                                    <div className="text-slate-500 text-xs uppercase font-bold">Streak Bonus</div>
                                    <div className="text-xl font-bold text-yellow-400">x{streak}</div>
                                </div>
                            </div>

                            <button 
                                onClick={() => setGameState('menu')}
                                className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-colors flex items-center justify-center gap-2"
                            >
                                <Icon name="rotate-ccw" className="w-4 h-4"/> 再玩一次
                            </button>
                        </div>
                    </div>
                );
            }

            // Playing State
            const currentQ = shuffledQuestions[currentQuestionIndex];
            
            return (
                <div className="min-h-screen bg-[#0F172A] flex flex-col items-center p-4 md:p-8">
                    
                    {/* Top Bar */}
                    <div className="w-full max-w-2xl flex justify-between items-center mb-8 bg-slate-800/50 p-4 rounded-2xl backdrop-blur border border-slate-700">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-white border border-slate-600">
                                {currentQuestionIndex + 1}
                            </div>
                            <div className="text-sm text-slate-400">Question {currentQuestionIndex + 1}/10</div>
                        </div>
                        <div className="flex items-center gap-4">
                             {streak > 1 && (
                                <div className="flex items-center gap-1 text-orange-400 font-bold animate-pulse">
                                    <Icon name="flame" className="w-5 h-5 fill-current"/> {streak}
                                </div>
                             )}
                             <div className="bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700 font-mono text-emerald-400 font-bold">
                                {score} pts
                             </div>
                        </div>
                    </div>

                    {/* Question Card */}
                    <div className="w-full max-w-2xl bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden mb-6 relative">
                        {/* Progress Bar */}
                        <div className="absolute top-0 left-0 w-full h-1 bg-slate-700">
                            <div 
                                className="h-full bg-emerald-500 transition-all duration-300" 
                                style={{width: `${((currentQuestionIndex) / 10) * 100}%`}}
                            ></div>
                        </div>

                        <div className="p-8 text-center space-y-6">
                            <h2 className="text-slate-400 uppercase tracking-widest text-xs font-bold">Conversion Task</h2>
                            
                            <div className="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8 my-4">
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-600 w-full md:w-auto min-w-[160px]">
                                    <div className="text-xl font-bold text-white">{currentQ.from}</div>
                                </div>
                                <div className="flex flex-col items-center gap-2 text-slate-500">
                                    <Icon name="arrow-right" className="w-8 h-8 hidden md:block" />
                                    <Icon name="arrow-down" className="w-8 h-8 md:hidden" />
                                    <span className="text-xs font-mono bg-slate-700 px-2 py-0.5 rounded text-slate-300">Reagent?</span>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-emerald-900/50 w-full md:w-auto min-w-[160px] shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                                    <div className="text-xl font-bold text-emerald-400">{currentQ.to}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Options Grid */}
                    <div className="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-4">
                        {currentOptions.map((opt, i) => {
                            let btnClass = "p-4 rounded-xl font-mono text-lg font-bold border-2 transition-all duration-200 flex items-center justify-center relative ";
                            
                            if (feedback) {
                                if (opt === currentQ.correct) {
                                    btnClass += "bg-emerald-600 border-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)] opacity-100";
                                } else if (opt === selectedOption) {
                                    btnClass += "bg-red-500/20 border-red-500 text-red-200 opacity-50";
                                } else {
                                    btnClass += "bg-slate-800 border-slate-700 text-slate-500 opacity-30";
                                }
                            } else {
                                btnClass += "bg-slate-800 border-slate-700 text-slate-200 hover:border-blue-400 hover:bg-slate-750 hover:scale-[1.02] active:scale-[0.98] cursor-pointer";
                            }

                            return (
                                <button 
                                    key={i} 
                                    onClick={() => handleAnswer(opt)}
                                    disabled={!!feedback}
                                    className={btnClass}
                                >
                                    {opt}
                                    {feedback && opt === currentQ.correct && (
                                        <Icon name="check-circle" className="absolute right-4 w-5 h-5 text-white" />
                                    )}
                                </button>
                            );
                        })}
                    </div>

                    {/* Feedback Area */}
                    {feedback && (
                        <div className={`w-full max-w-2xl mt-6 p-4 rounded-2xl border flex items-start gap-4 animate-slide-up ${feedback.isCorrect ? 'bg-emerald-900/30 border-emerald-500/50' : 'bg-red-900/30 border-red-500/50'}`}>
                            <div className={`p-2 rounded-full ${feedback.isCorrect ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                                <Icon name={feedback.isCorrect ? "check" : "x"} className="w-6 h-6" />
                            </div>
                            <div className="flex-1">
                                <h3 className={`font-bold text-lg mb-1 ${feedback.isCorrect ? 'text-emerald-400' : 'text-red-400'}`}>
                                    {feedback.isCorrect ? "Correct!" : "Oops, not quite."}
                                </h3>
                                {!feedback.isCorrect && (
                                    <p className="text-slate-300 text-sm mb-2">
                                        Correct Answer: <span className="font-mono font-bold text-white bg-slate-800 px-2 py-0.5 rounded">{feedback.correctVal}</span>
                                    </p>
                                )}
                                <p className="text-slate-400 text-sm leading-relaxed">{feedback.message}</p>
                            </div>
                            <button 
                                onClick={nextQuestion}
                                className="self-center px-6 py-2 bg-slate-100 text-slate-900 font-bold rounded-lg hover:bg-white transition-colors"
                            >
                                Next
                            </button>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
