<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redox Titration Simulator</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Liquid Animations */
        .liquid { transition: height 0.3s ease-out, background-color 0.5s ease-in-out; }
        .drop {
            animation: dropFall 0.6s linear;
        }
        @keyframes dropFall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(200px) scale(0.5); opacity: 0; }
        }

        /* Swirl Animation */
        .swirl { animation: swirl 2s infinite linear; }
        @keyframes swirl {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- TITRATION DATA ---
        const EXPERIMENTS = {
            kmno4: {
                id: 'kmno4',
                name: 'Permanganate Titration',
                analyte: 'Iron(II) Sulfate (Fe²⁺)',
                titrant: 'Potassium Permanganate (MnO₄⁻)',
                indicator: 'None (Self-indicator)',
                eq: 'MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O',
                targetVol: 25.0, // Simplified target
                colors: {
                    titrant: 'bg-purple-700', // Deep purple
                    start: 'bg-emerald-50/20', // Pale green/colorless
                    end: 'bg-pink-400/40', // Pale pink
                    over: 'bg-purple-600/60' // Purple
                }
            },
            iodine: {
                id: 'iodine',
                name: 'Iodometric Titration',
                analyte: 'Iodine Solution (I₂)',
                titrant: 'Sodium Thiosulfate (S₂O₃²⁻)',
                indicator: 'Starch Solution (Added near end)',
                eq: 'I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻',
                targetVol: 25.0,
                colors: {
                    titrant: 'bg-slate-100/50', // Colorless
                    start: 'bg-yellow-700/80', // Brown
                    nearEnd: 'bg-yellow-200/40', // Pale yellow
                    starch: 'bg-blue-900/90', // Blue-black
                    end: 'bg-white/5', // Colorless
                    over: 'bg-white/5' // Colorless
                }
            }
        };

        const App = () => {
            const [expId, setExpId] = useState('kmno4');
            const [addedVol, setAddedVol] = useState(0);
            const [starchAdded, setStarchAdded] = useState(false);
            const [isDropping, setIsDropping] = useState(false);
            const [dropKey, setDropKey] = useState(0); // Force re-render drop animation

            const currentExp = EXPERIMENTS[expId];
            const target = currentExp.targetVol;

            // --- LOGIC: Determine Flask Color ---
            const getFlaskColor = () => {
                if (expId === 'kmno4') {
                    if (addedVol < target - 0.1) return currentExp.colors.start; // Fe2+ is very pale green, almost colorless
                    if (addedVol >= target - 0.1 && addedVol <= target + 0.1) return currentExp.colors.end; // End point Pink
                    return currentExp.colors.over; // Excess KMnO4
                } 
                else if (expId === 'iodine') {
                    // Iodine fades from Brown -> Pale Yellow -> (Starch) Blue -> Colorless
                    if (addedVol >= target) return currentExp.colors.end; // Done
                    
                    // Not done yet
                    if (starchAdded) return currentExp.colors.starch; // Blue-black if starch added and I2 remains
                    
                    // No starch yet
                    if (addedVol > target - 5) return currentExp.colors.nearEnd; // Pale yellow near end
                    return currentExp.colors.start; // Brown initially
                }
                return 'bg-transparent';
            };

            const addTitrant = (amount) => {
                setIsDropping(true);
                setDropKey(prev => prev + 1);
                setTimeout(() => setIsDropping(false), 500);
                setAddedVol(prev => parseFloat((prev + amount).toFixed(2)));
            };

            const reset = () => {
                setAddedVol(0);
                setStarchAdded(false);
            };

            const flaskColorClass = getFlaskColor();

            // Determine Status Message
            let statusMsg = "Titrating...";
            let statusColor = "text-slate-400";

            if (expId === 'kmno4') {
                if (addedVol >= target - 0.1 && addedVol <= target + 0.1) {
                    statusMsg = "End Point Reached (Permanent Pink)";
                    statusColor = "text-pink-400";
                } else if (addedVol > target + 0.1) {
                    statusMsg = "Over-titrated!";
                    statusColor = "text-red-400";
                }
            } else if (expId === 'iodine') {
                if (addedVol >= target) {
                    statusMsg = "End Point Reached (Colourless)";
                    statusColor = "text-emerald-400";
                } else if (addedVol > target - 5 && !starchAdded) {
                    statusMsg = "Solution is pale yellow. Add Starch now!";
                    statusColor = "text-yellow-400 animate-pulse";
                }
            }

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col md:flex-row overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-10 shadow-xl h-screen shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Icon name="flask-conical" className="text-purple-400" /> Redox Titration
                            </h1>
                            <p className="text-xs text-slate-400 mt-1">Determine End Point & Indicators</p>
                        </div>

                        <div className="p-6 space-y-8 flex-1 overflow-y-auto">
                            
                            {/* Experiment Selector */}
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">Select Experiment</label>
                                <button 
                                    onClick={() => { setExpId('kmno4'); reset(); }}
                                    className={`w-full text-left p-3 rounded-xl border transition-all flex items-center justify-between
                                        ${expId === 'kmno4' ? 'bg-purple-900/30 border-purple-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}
                                    `}
                                >
                                    <span className="text-sm font-bold">KMnO₄ vs Fe²⁺</span>
                                    {expId === 'kmno4' && <div className="w-2 h-2 bg-purple-400 rounded-full"></div>}
                                </button>
                                <button 
                                    onClick={() => { setExpId('iodine'); reset(); }}
                                    className={`w-full text-left p-3 rounded-xl border transition-all flex items-center justify-between
                                        ${expId === 'iodine' ? 'bg-yellow-900/30 border-yellow-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}
                                    `}
                                >
                                    <span className="text-sm font-bold">Iodine vs Thiosulfate</span>
                                    {expId === 'iodine' && <div className="w-2 h-2 bg-yellow-400 rounded-full"></div>}
                                </button>
                            </div>

                            {/* Info Card */}
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                <div className="flex items-center gap-2 mb-2 text-emerald-400 font-bold text-xs uppercase">
                                    <Icon name="info" size={14} /> Indicator Logic
                                </div>
                                <p className="text-xs text-slate-400 leading-relaxed mb-2">
                                    <strong>{currentExp.indicator}</strong>
                                </p>
                                <div className="text-xs text-slate-500 font-mono bg-slate-900 p-2 rounded border border-slate-800">
                                    {currentExp.eq}
                                </div
                            </div>

                            {/* Controls */}
                            <div className="space-y-2">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">Add Titrant</label>
                                <div className="grid grid-cols-3 gap-2">
                                    <button onClick={() => addTitrant(5.0)} className="py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-mono text-sm font-bold">+5 mL</button>
                                    <button onClick={() => addTitrant(1.0)} className="py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-mono text-sm font-bold">+1 mL</button>
                                    <button onClick={() => addTitrant(0.1)} className="py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-mono text-sm font-bold">+0.1</button>
                                </div>
                                
                                {expId === 'iodine' && !starchAdded && (
                                    <button 
                                        onClick={() => setStarchAdded(true)}
                                        className="w-full py-3 mt-2 bg-blue-700 hover:bg-blue-600 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg animate-in"
                                    >
                                        <Icon name="droplet" size={16}/> Add Starch Indicator
                                    </button>
                                )}
                                
                                <button onClick={reset} className="w-full py-3 mt-4 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-sm text-slate-400 flex items-center justify-center gap-2 border border-slate-700">
                                    <Icon name="rotate-ccw" size={16}/> Reset
                                </button>
                            </div>

                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="flex-1 relative bg-[#020617] overflow-hidden flex flex-col items-center justify-center">
                        
                        {/* Burette System */}
                        <div className="relative flex flex-col items-center h-[600px]">
                            
                            {/* Burette */}
                            <div className="w-8 h-64 border-x-2 border-slate-500 bg-slate-800/30 relative mb-1">
                                {/* Liquid in Burette */}
                                <div className={`absolute top-0 left-0 w-full transition-all duration-300 ${currentExp.colors.titrant}`} 
                                     style={{ height: `${100 - (addedVol/50)*100}%` }}></div>
                                
                                {/* Tick Marks */}
                                <div className="absolute right-0 top-0 h-full w-2 border-l border-slate-600 flex flex-col justify-between py-1">
                                    {[...Array(11)].map((_, i) => <div key={i} className="w-1 h-px bg-slate-500"></div>)}
                                </div>
                            </div>

                            {/* Tap */}
                            <div className="w-16 h-10 flex flex-col items-center">
                                <div className="w-1 h-4 bg-slate-500"></div>
                                <div className="w-8 h-4 bg-slate-400 rounded cursor-pointer flex items-center justify-center">
                                    <div className="w-1 h-3 bg-slate-600"></div>
                                </div>
                                <div className="w-1 h-4 bg-slate-500 relative">
                                    {/* Falling Drop Animation */}
                                    {isDropping && (
                                        <div key={dropKey} className={`absolute top-full left-1/2 -translate-x-1/2 w-2 h-2 rounded-full ${currentExp.colors.titrant} drop`}></div>
                                    )}
                                </div>
                            </div>

                            {/* Flask */}
                            <div className="relative mt-8">
                                {/* Flask Shape */}
                                <div className="w-40 h-40 border-4 border-slate-400/30 rounded-[40%_40%_45%_45%] bg-white/5 backdrop-blur-sm relative overflow-hidden shadow-2xl">
                                    {/* Solution */}
                                    <div 
                                        className={`absolute bottom-0 w-full h-3/5 liquid ${flaskColorClass}`}
                                    >
                                        {/* Swirl effect to show mixing */}
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent opacity-50"></div>
                                    </div>
                                </div>
                                
                                {/* Reflection */}
                                <div className="absolute top-10 left-4 w-2 h-20 bg-white/10 rounded-full -rotate-12"></div>
                            </div>

                            {/* Status Text */}
                            <div className="mt-8 text-center">
                                <div className="text-4xl font-mono font-black text-white mb-1">
                                    {addedVol.toFixed(1)} <span className="text-lg text-slate-500">mL</span>
                                </div>
                                <div className={`text-sm font-bold uppercase tracking-widest ${statusColor}`}>
                                    {statusMsg}
                                </div>
                            </div>

                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
