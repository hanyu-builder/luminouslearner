<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勒沙特列原理模擬器 | Luminous Learner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Smooth transitions */
        .transition-all-500 { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Particle Animation */
        .particle {
            position: absolute;
            border-radius: 50%;
            transition: background-color 0.3s, width 0.3s, height 0.3s;
            box-shadow: 0 0 4px rgba(0,0,0,0.1);
            pointer-events: none;
        }

        /* Graph */
        .chart-grid line { stroke: #e2e8f0; stroke-dasharray: 4; }
        .chart-axis { stroke: #94a3b8; stroke-width: 2; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-800">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const { Scale, Thermometer, Maximize2, FlaskConical, ArrowRight, RotateCcw, Info, Activity, TrendingUp } = lucide;

        // --- 1. 系統定義 (Systems Data) ---
        const Systems = [
            {
                id: 'N2O4',
                name: 'N₂O₄(g) ⇌ 2NO₂(g)',
                shortName: 'N₂O₄ ⇌ NO₂',
                type: 'gas',
                equation: 'N₂O₄(g) ⇌ 2NO₂(g)',
                left: { name: 'N₂O₄', color: '#cbd5e1', size: 24, label: '無色 (Colorless)', mole: 1 }, 
                right: { name: 'NO₂', color: '#92400e', size: 14, label: '紅棕色 (Brown)', mole: 2 }, 
                deltaH: +57, // Endothermic
                baseK: 0.15, // Equilibrium constant at 298K
                description: '二氧化氮的二聚反應。加壓會使平衡向左移動（氣體摩爾數減少），顏色變淺。升溫會使平衡向右移動（吸熱），顏色變深。'
            },
            {
                id: 'Co',
                name: 'Co(H₂O)₆²⁺ + 4Cl⁻ ⇌ CoCl₄²⁻ + 6H₂O',
                shortName: '鈷配合物 (Cobalt)',
                type: 'solution',
                equation: 'Co(H₂O)₆²⁺(aq) + 4Cl⁻(aq) ⇌ CoCl₄²⁻(aq) + 6H₂O(l)',
                left: { name: 'Pink', color: '#f472b6', size: 20, label: '粉紅色 (Pink)', mole: 1 },
                right: { name: 'Blue', color: '#3b82f6', size: 20, label: '藍色 (Blue)', mole: 1 },
                deltaH: +100, // Endothermic
                baseK: 1.0,
                description: '氯化鈷溶液的平衡。加入 HCl (Cl⁻) 會使平衡向右移動（變藍）。加水會使平衡向左移動（變粉紅）。升溫向右（變藍）。'
            }
        ];

        // --- 2. 主應用程式 (Main App) ---
        const App = () => {
            // 核心狀態
            const [system, setSystem] = useState(Systems[0]);
            const [temperature, setTemperature] = useState(298); // K
            const [volume, setVolume] = useState(1.0); // Relative Volume
            const [molesL, setMolesL] = useState(10); // Number of particles (Left)
            const [molesR, setMolesR] = useState(5); // Number of particles (Right)
            
            // 模擬狀態
            const [particles, setParticles] = useState([]);
            const [history, setHistory] = useState([]); // For Graphing: [{t, cL, cR}]
            const [feedback, setFeedback] = useState("");
            const [isEquilibrium, setIsEquilibrium] = useState(false);
            
            const requestRef = useRef();
            const timeRef = useRef(0);
            const containerRef = useRef(null);

            // 粒子生成器 (Helper function)
            const createParticle = useCallback((typeData) => ({
                id: Math.random(),
                x: Math.random() * 100, 
                y: Math.random() * 100,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                type: typeData.name,
                ...typeData
            }), []);

            // --- 計算邏輯 (Calculations) ---

            // 計算平衡常數 K (隨溫度變化)
            const currentK = useMemo(() => {
                // Van 't Hoff equation approximation for visual
                // ln(K2/K1) = -dH/R * (1/T2 - 1/T1)
                // Simplified: K_new = K_base * factor
                const tempDiff = temperature - 298;
                // 吸熱反應 (+dH): T 上升 -> K 上升
                // 放熱反應 (-dH): T 上升 -> K 下降
                const factor = system.deltaH > 0 ? 1.03 : 0.97;
                return system.baseK * Math.pow(factor, tempDiff / 5);
            }, [temperature, system]);

            // 計算反應商 Q
            const currentQ = useMemo(() => {
                // Conc = mol / V
                const cL = molesL / volume;
                const cR = molesR / volume;
                
                if (cL < 0.1) return 9999; // Avoid division by zero

                if (system.id === 'N2O4') {
                    // Q = [NO2]^2 / [N2O4]
                    return (cR * cR) / cL;
                } else {
                    // Simplified Q = [Blue] / [Pink] for Cobalt visualization
                    return cR / cL;
                }
            }, [molesL, molesR, volume, system]);

            // 生成容器顏色
            const containerColor = useMemo(() => {
                const total = molesL + molesR;
                if (total === 0) return 'rgba(255,255,255,0.5)';
                
                if (system.id === 'N2O4') {
                    // White <-> Brown
                    // Conc effect: More density = darker
                    const density = total / volume; 
                    const brownRatio = molesR / total;
                    const opacity = Math.min(0.8, 0.1 + (density / 40)); // Base opacity on density
                    
                    // Color Mix
                    // N2O4 (White/Clear) -> NO2 (Brown: 146, 64, 14)
                    const r = Math.round(255 - (255-146)*brownRatio);
                    const g = Math.round(255 - (255-64)*brownRatio);
                    const b = Math.round(255 - (255-14)*brownRatio);
                    return `rgba(${r}, ${g}, ${b}, ${opacity})`;
                } else {
                    // Pink <-> Blue
                    const ratio = molesR / total; // % of Blue
                    // Pink (244, 114, 182) -> Blue (59, 130, 246)
                    const r = Math.round(244 + (59-244)*ratio);
                    const g = Math.round(114 + (130-114)*ratio);
                    const b = Math.round(182 + (246-182)*ratio);
                    return `rgba(${r}, ${g}, ${b}, 0.7)`;
                }
            }, [molesL, molesR, volume, system]);

            // --- 模擬循環 (Simulation Loop) ---
            
            // 初始化粒子 (系統切換時)
            useEffect(() => {
                const newParticles = [];
                for(let i=0; i<molesL; i++) newParticles.push(createParticle(system.left));
                for(let i=0; i<molesR; i++) newParticles.push(createParticle(system.right));
                setParticles(newParticles);
                setHistory([]); // Reset graph on system change
                timeRef.current = 0;
            }, [system, createParticle]); // Added createParticle to deps

            // [FIX] 粒子同步機制：當 molesL/R 改變 (例如點擊按鈕) 時，自動補足/移除粒子
            useEffect(() => {
                setParticles(prev => {
                    const currentL = prev.filter(p => p.type === system.left.name).length;
                    const currentR = prev.filter(p => p.type === system.right.name).length;
                    
                    // 如果粒子數量與狀態一致，不需更新
                    if (currentL === molesL && currentR === molesR) return prev;

                    let newParticles = [...prev];

                    // 補足左側粒子
                    if (molesL > currentL) {
                        for(let i=0; i < molesL - currentL; i++) newParticles.push(createParticle(system.left));
                    } 
                    // (可選：若有減少按鈕，也可在此處理移除邏輯，目前主要是處理增加)

                    // 補足右側粒子
                    if (molesR > currentR) {
                        for(let i=0; i < molesR - currentR; i++) newParticles.push(createParticle(system.right));
                    }
                    
                    return newParticles;
                });
            }, [molesL, molesR, system, createParticle]);


            // 動畫與反應邏輯
            useEffect(() => {
                const animate = () => {
                    // 1. 更新教學回饋 (Feedback Logic)
                    const ratio = currentQ / currentK;
                    if (ratio > 1.1) {
                        setFeedback("Q > Kc，平衡向左移動 (Shift Left) 以消耗產物。");
                        setIsEquilibrium(false);
                    } else if (ratio < 0.9) {
                        setFeedback("Q < Kc，平衡向右移動 (Shift Right) 以生成產物。");
                        setIsEquilibrium(false);
                    } else {
                        setFeedback("Q ≈ Kc，系統處於動態平衡 (Dynamic Equilibrium)。");
                        setIsEquilibrium(true);
                    }

                    // 2. 粒子移動與反應
                    setParticles(prev => {
                        // 確定移動方向
                        const shiftRight = currentQ < currentK;
                        const reactionChance = 0.03; // Reaction probability per frame

                        // 更新位置
                        let nextParticles = prev.map(p => {
                            let speedFactor = (temperature / 298); 
                            let nx = p.x + p.vx * speedFactor;
                            let ny = p.y + p.vy * speedFactor;

                            // Bounce off walls
                            if (nx <= 0 || nx >= 100) p.vx *= -1;
                            if (ny <= 0 || ny >= 100) p.vy *= -1;

                            return { ...p, x: Math.min(99, Math.max(1, nx)), y: Math.min(99, Math.max(1, ny)) };
                        });

                        // 處理反應 (隨機選取粒子進行轉化)
                        if (Math.random() < reactionChance) {
                            if (shiftRight && molesL > 0) {
                                // Forward: L -> R
                                // Remove 1 L
                                const idx = nextParticles.findIndex(p => p.type === system.left.name);
                                if (idx !== -1) {
                                    nextParticles.splice(idx, 1);
                                    setMolesL(n => n - 1);
                                    // Add R (Stoichiometry)
                                    const gain = system.id === 'N2O4' ? 2 : 1;
                                    for(let k=0; k<gain; k++) {
                                        nextParticles.push(createParticle(system.right));
                                        setMolesR(n => n + 1);
                                    }
                                }
                            } else if (!shiftRight && molesR >= (system.id === 'N2O4' ? 2 : 1)) {
                                // Backward: R -> L
                                // Remove R
                                const loss = system.id === 'N2O4' ? 2 : 1;
                                let removedCount = 0;
                                
                                // Try to remove 'loss' amount of R particles
                                nextParticles = nextParticles.filter(p => {
                                    if (p.type === system.right.name && removedCount < loss) {
                                        removedCount++;
                                        return false;
                                    }
                                    return true;
                                });
                                
                                if (removedCount === loss) {
                                    setMolesR(n => n - loss);
                                    nextParticles.push(createParticle(system.left));
                                    setMolesL(n => n + 1);
                                }
                            }
                        }
                        return nextParticles;
                    });

                    // 3. 更新圖表數據 (每 30 frames 約 0.5s 記錄一次)
                    timeRef.current += 1;
                    if (timeRef.current % 30 === 0) {
                        setHistory(prev => {
                            const newData = { 
                                t: timeRef.current, 
                                cL: molesL / volume, 
                                cR: molesR / volume 
                            };
                            const newHistory = [...prev, newData];
                            if (newHistory.length > 50) newHistory.shift(); // Keep last 50 points
                            return newHistory;
                        });
                    }

                    requestRef.current = requestAnimationFrame(animate);
                };

                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [temperature, volume, molesL, molesR, system, currentK, currentQ, createParticle]);


            // --- UI Components ---

            return (
                <div className="flex flex-col h-full max-w-7xl mx-auto px-4 py-6 w-full">
                    
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-200 pb-4 gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 text-white p-2 rounded-lg shadow-md">
                                <Scale className="w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800">勒沙特列原理模擬器</h1>
                                <p className="text-xs text-slate-500 font-mono">Le Chatelier's Principle Simulator</p>
                            </div>
                        </div>
                        
                        <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                            {Systems.map(s => (
                                <button
                                    key={s.id}
                                    onClick={() => { 
                                        setSystem(s); 
                                        setMolesL(10); setMolesR(5); 
                                        setVolume(1); setTemperature(298); 
                                    }}
                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${system.id === s.id ? 'bg-indigo-50 text-indigo-600 shadow-sm ring-1 ring-indigo-200' : 'text-slate-500 hover:bg-slate-50'}`}
                                >
                                    {s.type === 'gas' ? <i data-lucide="wind" className="w-4 h-4"/> : <FlaskConical className="w-4 h-4"/>}
                                    {s.shortName}
                                </button>
                            ))}
                        </div>
                    </header>

                    <div className="flex flex-col lg:flex-row gap-6 flex-grow">
                        
                        {/* Left Column: Controls & Info */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-4">
                            
                            {/* Reaction Info Card */}
                            <div className="bg-white p-5 rounded-2xl border border-indigo-100 shadow-sm relative overflow-hidden group">
                                <div className="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-20 transition-opacity">
                                    <Activity className="w-24 h-24 text-indigo-600" />
                                </div>
                                <div className="relative z-10">
                                    <div className="text-xs font-bold text-slate-400 uppercase mb-1 tracking-wider">Chemical Equilibrium</div>
                                    <div className="text-lg font-mono font-bold text-slate-800 mb-2">{system.equation}</div>
                                    <div className={`inline-flex items-center px-2 py-1 rounded text-xs font-bold ${system.deltaH > 0 ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'}`}>
                                        {system.deltaH > 0 ? '吸熱 (Endothermic)' : '放熱 (Exothermic)'} ΔH = {system.deltaH > 0 ? '+' : ''}{system.deltaH} kJ
                                    </div>
                                    <p className="text-xs text-slate-500 mt-3 leading-relaxed border-t border-slate-100 pt-2">
                                        {system.description}
                                    </p>
                                </div>
                            </div>

                            {/* Smart Feedback Panel */}
                            <div className={`p-4 rounded-xl border-l-4 shadow-sm transition-colors duration-500 ${isEquilibrium ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-amber-50 border-amber-500 text-amber-900'}`}>
                                <div className="flex items-start gap-3">
                                    {isEquilibrium ? <Scale className="w-5 h-5 mt-0.5" /> : <TrendingUp className="w-5 h-5 mt-0.5" />}
                                    <div>
                                        <div className="font-bold text-sm mb-1">{isEquilibrium ? '系統平衡 (Equilibrium)' : '系統調整中 (Shifting)'}</div>
                                        <div className="text-xs opacity-90">{feedback}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 flex-grow">
                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-6 flex items-center gap-2">
                                    <Maximize2 className="w-4 h-4" /> 改變條件 (Conditions)
                                </h3>

                                {/* Temperature Control */}
                                <div className="mb-8">
                                    <div className="flex justify-between mb-2">
                                        <label className="text-sm font-bold text-slate-700 flex items-center gap-2">
                                            <Thermometer className="w-4 h-4 text-red-500" /> 溫度 (Temperature)
                                        </label>
                                        <span className="text-sm font-mono font-bold bg-slate-100 px-2 rounded text-slate-600">{temperature} K</span>
                                    </div>
                                    <input 
                                        type="range" min="273" max="373" step="1" 
                                        value={temperature} 
                                        onChange={(e) => setTemperature(Number(e.target.value))}
                                        className="w-full h-2 bg-gradient-to-r from-blue-300 via-green-200 to-red-300 rounded-lg appearance-none cursor-pointer"
                                    />
                                    <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                                        <span>冷 (Low T)</span>
                                        <span>熱 (High T)</span>
                                    </div>
                                </div>

                                {/* Volume Control (Gas Only) */}
                                <div className={`mb-8 transition-opacity duration-300 ${system.type === 'solution' ? 'opacity-40 pointer-events-none' : ''}`}>
                                    <div className="flex justify-between mb-2">
                                        <label className="text-sm font-bold text-slate-700 flex items-center gap-2">
                                            <Maximize2 className="w-4 h-4 text-blue-500" /> 體積/壓力 (Volume)
                                        </label>
                                        <span className="text-sm font-mono font-bold bg-slate-100 px-2 rounded text-slate-600">{volume.toFixed(1)}x</span>
                                    </div>
                                    <input 
                                        type="range" min="0.5" max="2.0" step="0.1" 
                                        value={volume} 
                                        onChange={(e) => setVolume(Number(e.target.value))}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                                    />
                                    <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                                        <span>高壓 (High P)</span>
                                        <span>低壓 (Low P)</span>
                                    </div>
                                </div>

                                {/* Add/Remove Particles */}
                                <div>
                                    <label className="text-sm font-bold text-slate-700 block mb-3">濃度干擾 (Add/Remove)</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => setMolesL(c => c + 3)} className="py-2 px-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-all flex items-center justify-center gap-1">
                                            + {system.left.name}
                                        </button>
                                        <button onClick={() => setMolesR(c => c + 3)} className="py-2 px-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-all flex items-center justify-center gap-1">
                                            + {system.right.name}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Visualization & Graph */}
                        <div className="w-full lg:w-2/3 flex flex-col gap-4">
                            
                            {/* 1. Visualization Container */}
                            <div className="bg-white rounded-3xl border-4 border-slate-100 p-8 shadow-xl flex-grow relative overflow-hidden min-h-[400px] flex flex-col justify-center items-center">
                                
                                {/* The Reaction Chamber */}
                                <div 
                                    className="relative border-x-4 border-b-4 border-slate-300 rounded-b-xl overflow-hidden shadow-inner transition-all-500 ease-in-out"
                                    style={{
                                        width: system.type === 'gas' ? `${Math.max(20, volume * 50)}%` : '50%',
                                        height: '300px',
                                        backgroundColor: containerColor
                                    }}
                                >
                                    {/* Piston (Gas Only) */}
                                    {system.type === 'gas' && (
                                        <div className="absolute top-0 left-0 w-full h-4 bg-slate-600 shadow-md z-10 transition-all duration-500">
                                            <div className="absolute bottom-full left-1/2 w-2 h-12 bg-slate-400 -translate-x-1/2"></div>
                                            <div className="absolute bottom-[48px] left-1/2 w-12 h-4 bg-slate-600 -translate-x-1/2 rounded-full"></div>
                                        </div>
                                    )}

                                    {/* Particles */}
                                    {particles.map((p) => (
                                        <div 
                                            key={p.id}
                                            className="particle"
                                            style={{
                                                left: `${p.x}%`,
                                                top: `${p.y}%`,
                                                width: `${p.size}px`,
                                                height: `${p.size}px`,
                                                backgroundColor: p.color,
                                                opacity: 0.8
                                            }}
                                        ></div>
                                    ))}
                                </div>

                                {/* Legend */}
                                <div className="flex gap-6 mt-6 justify-center">
                                    <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                                        <div className="w-4 h-4 rounded-full shadow-sm" style={{backgroundColor: system.left.color}}></div>
                                        <div className="text-xs font-bold text-slate-600">{system.left.name}</div>
                                        <div className="text-xs font-mono bg-white px-1.5 rounded text-slate-400">{molesL}</div>
                                    </div>
                                    <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                                        <div className="w-4 h-4 rounded-full shadow-sm" style={{backgroundColor: system.right.color}}></div>
                                        <div className="text-xs font-bold text-slate-600">{system.right.name}</div>
                                        <div className="text-xs font-mono bg-white px-1.5 rounded text-slate-400">{molesR}</div>
                                    </div>
                                </div>
                            </div>

                            {/* 2. Real-time Graph */}
                            <div className="bg-white p-4 rounded-2xl shadow-md border border-slate-100 h-48 relative">
                                <div className="text-xs font-bold text-slate-400 uppercase mb-2 flex justify-between">
                                    <span>濃度變化 (Concentration vs Time)</span>
                                    <div className="flex gap-2">
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{backgroundColor: system.left.color}}></span>[L]</span>
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{backgroundColor: system.right.color}}></span>[R]</span>
                                    </div>
                                </div>
                                
                                <div className="w-full h-32 relative">
                                    {history.length > 1 ? (
                                        <svg className="w-full h-full overflow-visible">
                                            {/* Grid Lines */}
                                            <g className="chart-grid opacity-30">
                                                <line x1="0" y1="0%" x2="100%" y2="0%" />
                                                <line x1="0" y1="50%" x2="100%" y2="50%" />
                                                <line x1="0" y1="100%" x2="100%" y2="100%" />
                                            </g>
                                            
                                            {/* Line for Left Reactant */}
                                            <polyline 
                                                fill="none" 
                                                stroke={system.left.color === '#cbd5e1' ? '#94a3b8' : system.left.color} // Darken white for visibility
                                                strokeWidth="2"
                                                points={history.map((h, i) => {
                                                    const x = (i / (history.length - 1)) * 100 + '%';
                                                    const y = (1 - Math.min(1, h.cL / 20)) * 100 + '%'; // Scale roughly
                                                    return `${x},${y}`;
                                                }).join(' ')}
                                            />

                                            {/* Line for Right Product */}
                                            <polyline 
                                                fill="none" 
                                                stroke={system.right.color} 
                                                strokeWidth="2"
                                                points={history.map((h, i) => {
                                                    const x = (i / (history.length - 1)) * 100 + '%';
                                                    const y = (1 - Math.min(1, h.cR / 20)) * 100 + '%';
                                                    return `${x},${y}`;
                                                }).join(' ')}
                                            />
                                        </svg>
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-slate-300 text-xs">
                                            Collecting Data...
                                        </div>
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <footer className="text-center text-slate-400 text-xs mt-8 border-t border-slate-200 pt-4">
                        © Luminous Learner | HKDSE Chemistry Topic X: Chemical Equilibrium
                    </footer>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
