<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Reaction Path Explorer - Luminous Learner</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f8fafc; /* bg-slate-50 */
        }
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { FlaskConical, ArrowRight, Beaker, Flame, AlertCircle, RefreshCw, Map, Search, Info } = lucide;

        // --- Database: HKDSE Organic Reaction Map ---
        // Nodes: Functional Groups
        // Edges: Reactions
        const reactionData = {
            nodes: [
                { id: 'alkane', label: '烷烴 (Alkane)', category: 'hydrocarbon' },
                { id: 'alkene', label: '烯烴 (Alkene)', category: 'hydrocarbon' },
                { id: 'haloalkane', label: '鹵代烷 (Haloalkane)', category: 'derivative' },
                { id: 'alcohol_1', label: '伯醇 (1° Alcohol)', category: 'oxygen' },
                { id: 'alcohol_2', label: '仲醇 (2° Alcohol)', category: 'oxygen' },
                { id: 'alcohol_3', label: '叔醇 (3° Alcohol)', category: 'oxygen' },
                { id: 'aldehyde', label: '醛 (Aldehyde)', category: 'carbonyl' },
                { id: 'ketone', label: '酮 (Ketone)', category: 'carbonyl' },
                { id: 'carboxylic_acid', label: '羧酸 (Carboxylic Acid)', category: 'acid' },
                { id: 'ester', label: '酯 (Ester)', category: 'derivative' },
                { id: 'amide', label: '酰胺 (Amide)', category: 'nitrogen' },
                { id: 'nitrile', label: '腈 (Nitrile)', category: 'nitrogen', note: 'Carbon chain +1' },
                { id: 'amine', label: '胺 (Amine)', category: 'nitrogen' },
                { id: 'diol', label: '二醇 (Diol)', category: 'oxygen' }
            ],
            edges: [
                // Alkane
                { from: 'alkane', to: 'haloalkane', reagents: 'X₂ / UV light', type: 'Free Radical Substitution', note: '產物通常為混合物' },
                
                // Alkene
                { from: 'alkene', to: 'alkane', reagents: 'H₂ / Pt or Ni, heat', type: 'Addition', note: 'Hardening of oils' },
                { from: 'alkene', to: 'haloalkane', reagents: 'HX (g)', type: 'Addition', note: 'Follows Markovnikov\'s Rule' },
                { from: 'alkene', to: 'alcohol_1', reagents: '1. conc. H₂SO₄ 2. H₂O, boil', type: 'Addition', note: 'Lab method' },
                { from: 'alkene', to: 'diol', reagents: 'cold dil. KMnO₄ / H⁺', type: 'Oxidation', note: 'Purple to Colourless' },
                
                // Haloalkane
                { from: 'haloalkane', to: 'alcohol_1', reagents: 'NaOH(aq), heat', type: 'Substitution', note: 'Nucleophilic' },
                { from: 'haloalkane', to: 'alkene', reagents: 'NaOH in alcohol, reflux', type: 'Elimination', note: '注意溶劑分別' },
                { from: 'haloalkane', to: 'nitrile', reagents: 'KCN in alcohol, reflux', type: 'Substitution', note: 'Step-up (+1 Carbon)' },
                { from: 'haloalkane', to: 'amine', reagents: 'excess conc. NH₃, heat in sealed tube', type: 'Substitution', note: '' },

                // Alcohol (1°)
                { from: 'alcohol_1', to: 'aldehyde', reagents: 'K₂Cr₂O₇ / H⁺, distillation', type: 'Oxidation', note: 'Orange to Green' },
                { from: 'alcohol_1', to: 'carboxylic_acid', reagents: 'K₂Cr₂O₇ / H⁺, reflux', type: 'Oxidation', note: 'Orange to Green' },
                { from: 'alcohol_1', to: 'alkene', reagents: 'conc. H₂SO₄ or Al₂O₃, heat', type: 'Dehydration', note: 'Elimination' },
                { from: 'alcohol_1', to: 'haloalkane', reagents: 'PCl₅ or SOCl₂', type: 'Substitution', note: 'Misty fumes (HCl)' },
                { from: 'alcohol_1', to: 'ester', reagents: 'Carboxylic Acid + conc. H₂SO₄, reflux', type: 'Esterification', note: 'Fruity smell, Reversible' },

                // Alcohol (2°)
                { from: 'alcohol_2', to: 'ketone', reagents: 'K₂Cr₂O₇ / H⁺, reflux', type: 'Oxidation', note: 'Orange to Green' },
                
                // Aldehyde & Ketone
                { from: 'aldehyde', to: 'carboxylic_acid', reagents: 'K₂Cr₂O₇ / H⁺, reflux', type: 'Oxidation', note: '' },
                { from: 'aldehyde', to: 'alcohol_1', reagents: 'LiAlH₄ in dry ether', type: 'Reduction', note: 'Nucleophilic Addition' },
                { from: 'ketone', to: 'alcohol_2', reagents: 'LiAlH₄ in dry ether', type: 'Reduction', note: '' },
                { from: 'aldehyde', to: '2-hydroxy-nitrile', reagents: 'HCN / trace NaOH', type: 'Addition', note: 'Step-up (+1 Carbon)' },

                // Nitrile (The Step-up Hub)
                { from: 'nitrile', to: 'carboxylic_acid', reagents: 'H⁺(aq), reflux', type: 'Hydrolysis', note: 'Acid Hydrolysis' },
                { from: 'nitrile', to: 'amine', reagents: 'LiAlH₄ in dry ether', type: 'Reduction', note: 'Primary amine formed' },

                // Carboxylic Acid
                { from: 'carboxylic_acid', to: 'alcohol_1', reagents: 'LiAlH₄ in dry ether', type: 'Reduction', note: 'NaBH₄ cannot reduce acid' },
                { from: 'carboxylic_acid', to: 'ester', reagents: 'Alcohol + conc. H₂SO₄, reflux', type: 'Esterification', note: '' },
                { from: 'carboxylic_acid', to: 'amide', reagents: '1. SOCl₂ 2. NH₃', type: 'Substitution', note: 'Via Acid Chloride' },

                // Amide (The Step-down)
                { from: 'amide', to: 'amine', reagents: 'Br₂ / NaOH', type: 'Hofmann Degradation', note: 'Step-down (-1 Carbon)' },
                { from: 'amide', to: 'carboxylic_acid', reagents: 'H⁺(aq), reflux', type: 'Hydrolysis', note: '' },
            ]
        };

        // --- Pathfinding Algorithm (BFS) ---
        const findPath = (startId, endId) => {
            if (startId === endId) return [{ node: startId, edge: null }];

            let queue = [[{ node: startId, edge: null }]];
            let visited = new Set();
            visited.add(startId);

            while (queue.length > 0) {
                let path = queue.shift();
                let lastStep = path[path.length - 1];
                let lastNodeId = lastStep.node;

                if (lastNodeId === endId) return path;

                // Find neighbors
                let neighbors = reactionData.edges.filter(e => e.from === lastNodeId);
                
                for (let edge of neighbors) {
                    if (!visited.has(edge.to)) {
                        visited.add(edge.to);
                        let newPath = [...path, { node: edge.to, edge: edge }];
                        queue.push(newPath);
                    }
                }
            }
            return null; // No path found
        };

        const App = () => {
            const [startNode, setStartNode] = useState('alkene');
            const [endNode, setEndNode] = useState('carboxylic_acid');
            const [path, setPath] = useState(null);

            // Compute path whenever start or end changes
            useEffect(() => {
                const result = findPath(startNode, endNode);
                setPath(result);
            }, [startNode, endNode]);

            // Helper to get node details
            const getNode = (id) => reactionData.nodes.find(n => n.id === id);

            // Group nodes for dropdown
            const groupedNodes = {
                'Hydrocarbons': reactionData.nodes.filter(n => n.category === 'hydrocarbon'),
                'Oxygen Containing': reactionData.nodes.filter(n => n.category === 'oxygen'),
                'Carbonyls & Acids': reactionData.nodes.filter(n => ['carbonyl', 'acid', 'derivative'].includes(n.category)),
                'Nitrogen Containing': reactionData.nodes.filter(n => n.category === 'nitrogen'),
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    
                    {/* Header */}
                    <header className="max-w-6xl w-full mb-8 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="bg-emerald-600 p-2 rounded-xl text-white shadow-lg">
                                <FlaskConical size={28} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800">Organic Reaction Map</h1>
                                <p className="text-slate-500 text-sm">HKDSE Chemistry • 有機合成路徑探索</p>
                            </div>
                        </div>
                        <div className="hidden md:block">
                             <span className="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-semibold">Synthesis Tool</span>
                        </div>
                    </header>

                    {/* Main Layout */}
                    <main className="max-w-6xl w-full grid grid-cols-1 md:grid-cols-12 gap-6">
                        
                        {/* Left Panel: Controls (4 cols) */}
                        <div className="md:col-span-4 flex flex-col gap-6">
                            
                            {/* Input Card */}
                            <div className="bg-white rounded-3xl shadow-md border border-slate-200 p-6">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <Search size={20} className="text-emerald-600"/> 設定路徑
                                </h2>

                                <div className="space-y-4">
                                    {/* Start Node */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 uppercase mb-2">起始物 (Starting Material)</label>
                                        <div className="relative">
                                            <select 
                                                value={startNode} 
                                                onChange={(e) => setStartNode(e.target.value)}
                                                className="w-full p-3 pl-4 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 appearance-none text-slate-700 font-medium cursor-pointer transition-all hover:bg-slate-100"
                                            >
                                                {Object.entries(groupedNodes).map(([group, nodes]) => (
                                                    <optgroup key={group} label={group}>
                                                        {nodes.map(node => (
                                                            <option key={node.id} value={node.id}>{node.label}</option>
                                                        ))}
                                                    </optgroup>
                                                ))}
                                            </select>
                                            <div className="absolute right-3 top-3 pointer-events-none text-slate-400">
                                                <Beaker size={18} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-center -my-2 z-10 relative">
                                        <div className="bg-slate-200 rounded-full p-1">
                                            <ArrowRight className="text-slate-500 rotate-90" size={20} />
                                        </div>
                                    </div>

                                    {/* End Node */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 uppercase mb-2">目標產物 (Target Product)</label>
                                        <div className="relative">
                                            <select 
                                                value={endNode} 
                                                onChange={(e) => setEndNode(e.target.value)}
                                                className="w-full p-3 pl-4 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 appearance-none text-slate-700 font-medium cursor-pointer transition-all hover:bg-slate-100"
                                            >
                                                {Object.entries(groupedNodes).map(([group, nodes]) => (
                                                    <optgroup key={group} label={group}>
                                                        {nodes.map(node => (
                                                            <option key={node.id} value={node.id} disabled={node.id === startNode}>{node.label}</option>
                                                        ))}
                                                    </optgroup>
                                                ))}
                                            </select>
                                             <div className="absolute right-3 top-3 pointer-events-none text-slate-400">
                                                <FlagIcon size={18} />
                                            </div>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => {
                                            const temp = startNode;
                                            setStartNode(endNode);
                                            setEndNode(temp);
                                        }}
                                        className="w-full mt-2 py-2 flex items-center justify-center gap-2 text-sm text-slate-500 hover:text-emerald-600 transition-colors"
                                    >
                                        <RefreshCw size={16} /> 交換起點與終點
                                    </button>
                                </div>
                            </div>

                            {/* DSE Tips Card */}
                            <div className="bg-purple-50 rounded-3xl p-6 border border-purple-100">
                                <h3 className="text-purple-800 font-bold flex items-center gap-2 mb-3">
                                    <Info size={20}/> DSE Synthesis Tips
                                </h3>
                                <ul className="text-sm text-purple-900 space-y-2 list-disc pl-4">
                                    <li><strong>碳鏈增長 (Step-up):</strong> 常用 <span className="font-mono bg-purple-200 px-1 rounded">KCN</span> 將鹵代烷轉為腈 (-CN)。</li>
                                    <li><strong>碳鏈縮短 (Step-down):</strong> 常用 <span className="font-mono bg-purple-200 px-1 rounded">Amide Degradation</span>。</li>
                                    <li><strong>回流 (Reflux):</strong> 確保反應完全並防止揮發。</li>
                                    <li><strong>氧化劑顏色:</strong> <span className="text-orange-600 font-bold">Cr₂O₇²⁻</span> (Orange → Green), <span className="text-purple-600 font-bold">MnO₄⁻</span> (Purple → Colourless)。</li>
                                </ul>
                            </div>
                        </div>

                        {/* Right Panel: Visualization (8 cols) */}
                        <div className="md:col-span-8">
                            <div className="bg-white rounded-3xl shadow-lg border border-slate-200 min-h-[500px] p-8 relative overflow-hidden">
                                
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                        <Map className="text-purple-600"/> 反應路徑圖
                                    </h2>
                                    {path && (
                                        <span className="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-mono">
                                            {path.length - 1} {path.length - 1 === 1 ? 'Step' : 'Steps'}
                                        </span>
                                    )}
                                </div>

                                {/* Path Visualization */}
                                <div className="space-y-0 relative z-10">
                                    {!path ? (
                                        <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                                            <AlertCircle size={48} className="mb-4 opacity-50"/>
                                            <p>找不到可行的反應路徑</p>
                                            <p className="text-xs mt-2">請嘗試從較簡單的官能基開始</p>
                                        </div>
                                    ) : (
                                        path.map((step, index) => {
                                            const nodeInfo = getNode(step.node);
                                            const edgeInfo = step.edge;
                                            const isLast = index === path.length - 1;

                                            return (
                                                <div key={index} className="fade-in" style={{animationDelay: `${index * 0.15}s`}}>
                                                    
                                                    {/* The Reaction Arrow (if not first item) */}
                                                    {edgeInfo && (
                                                        <div className="flex pl-8 py-2">
                                                            {/* Vertical Line */}
                                                            <div className="w-1 bg-slate-200 mr-8 rounded-full relative"></div>
                                                            
                                                            {/* Reaction Card */}
                                                            <div className="flex-1 bg-gradient-to-r from-emerald-50 to-white border-l-4 border-emerald-400 p-3 rounded-r-xl shadow-sm my-2">
                                                                <div className="flex justify-between items-start">
                                                                    <div>
                                                                        <div className="text-xs font-bold text-emerald-700 uppercase mb-1 flex items-center gap-1">
                                                                            <Flame size={12}/> Reagents & Conditions
                                                                        </div>
                                                                        <div className="font-mono text-slate-800 font-semibold text-sm md:text-base">
                                                                            {edgeInfo.reagents}
                                                                        </div>
                                                                    </div>
                                                                    <div className="text-right">
                                                                         <span className="inline-block px-2 py-0.5 bg-white border border-emerald-200 rounded text-xs text-emerald-600 font-medium">
                                                                            {edgeInfo.type}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                                {edgeInfo.note && (
                                                                    <div className="mt-2 text-xs text-slate-500 italic border-t border-emerald-100 pt-1">
                                                                        💡 Tip: {edgeInfo.note}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* The Compound Node */}
                                                    <div className="flex items-center gap-4">
                                                        <div className={`
                                                            w-16 h-16 rounded-2xl flex items-center justify-center shadow-md border-2
                                                            ${isLast ? 'bg-purple-600 border-purple-600 text-white' : 
                                                              index === 0 ? 'bg-emerald-600 border-emerald-600 text-white' : 
                                                              'bg-white border-slate-200 text-slate-600'}
                                                            font-bold text-xl relative z-10 transition-transform hover:scale-105
                                                        `}>
                                                            {index === 0 ? 'Start' : isLast ? 'End' : (index)}
                                                        </div>
                                                        <div className={`
                                                            flex-1 p-4 rounded-2xl border shadow-sm flex justify-between items-center
                                                            ${isLast ? 'bg-purple-50 border-purple-200' : 
                                                              index === 0 ? 'bg-emerald-50 border-emerald-200' : 
                                                              'bg-white border-slate-200'}
                                                        `}>
                                                            <div>
                                                                <h3 className="font-bold text-lg text-slate-800">{nodeInfo.label}</h3>
                                                                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">{nodeInfo.category}</span>
                                                            </div>
                                                            {nodeInfo.note && (
                                                                <div className="hidden md:block text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">
                                                                    {nodeInfo.note}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>

                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                {/* Background decoration */}
                                <div className="absolute top-0 right-0 opacity-5 pointer-events-none">
                                    <svg width="300" height="300" viewBox="0 0 100 100">
                                        <path d="M50 0 L93.3 25 V75 L50 100 L6.7 75 V25 Z" fill="currentColor"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="max-w-6xl w-full mt-12 text-center text-slate-400 text-sm pb-8">
                        <p>© Luminous Learner • Designed for HKDSE Chemistry</p>
                    </footer>
                </div>
            );
        };

        const FlagIcon = ({size}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
