<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官能基辨識器 (Functional Group Spotter)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        /* Molecule Display Area */
        .molecule-card {
            background-image: radial-gradient(#e0f2fe 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Highlight Box Animation (SVG Compatible) */
        @keyframes pulse-stroke {
            0% { stroke-opacity: 1; stroke-width: 3; }
            50% { stroke-opacity: 0.6; stroke-width: 4; }
            100% { stroke-opacity: 1; stroke-width: 3; }
        }
        .highlight-box {
            fill: rgba(254, 226, 226, 0.3); /* SVG fill instead of background-color */
            stroke: #ef4444;                 /* SVG stroke instead of border-color */
            stroke-width: 3;
            stroke-dasharray: 8 4;           /* Dashed line */
            animation: pulse-stroke 2s infinite;
            pointer-events: none;            /* Let clicks pass through */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Question Database
        const Questions = [
            {
                id: 1,
                type: 'series',
                formula: 'CH3-CH2-OH',
                // ViewBox widened to accommodate structure comfortably
                structureSVG: (
                    <svg viewBox="0 0 300 150" className="w-full h-full">
                        <text x="50" y="80" className="font-mono text-3xl font-bold" fill="#334155">CH₃—CH₂—<tspan fill="#ef4444">OH</tspan></text>
                        <rect x="200" y="50" width="60" height="50" rx="8" className="highlight-box" />
                    </svg>
                ),
                question: "圖中圈出的官能基屬於哪個同系列 (Homologous Series)？",
                options: ["Alkane (烷)", "Alkene (烯)", "Alcohol (醇)", "Carboxylic Acid (羧酸)"],
                answer: "Alcohol (醇)",
                explanation: "含有 -OH (Hydroxyl group) 且連接在飽和碳原子上，屬於醇類。"
            },
            {
                id: 2,
                type: 'group',
                formula: 'CH3-COOH',
                structureSVG: (
                    <svg viewBox="0 0 300 150" className="w-full h-full">
                        <text x="60" y="80" className="font-mono text-3xl font-bold" fill="#334155">CH₃—<tspan fill="#ef4444">COOH</tspan></text>
                        <rect x="140" y="50" width="100" height="50" rx="8" className="highlight-box" />
                    </svg>
                ),
                question: "圖中圈出的官能基名稱是什麼？",
                options: ["Hydroxyl group (羥基)", "Carboxyl group (羧基)", "Carbonyl group (羰基)", "Ester group (酯基)"],
                answer: "Carboxyl group (羧基)",
                explanation: "-COOH 稱為 Carboxyl group，是羧酸 (Carboxylic Acid) 的特徵。"
            },
            {
                id: 3,
                type: 'series',
                formula: 'CH2=CH2',
                structureSVG: (
                    <svg viewBox="0 0 300 150" className="w-full h-full">
                        <text x="80" y="80" className="font-mono text-3xl font-bold" fill="#334155">CH₂<tspan fill="#ef4444">=</tspan>CH₂</text>
                        <rect x="135" y="55" width="30" height="40" rx="5" className="highlight-box" />
                    </svg>
                ),
                question: "這個分子屬於哪個同系列？",
                options: ["Alkane", "Alkene", "Alcohol", "Aldehyde"],
                answer: "Alkene",
                explanation: "碳碳雙鍵 (C=C) 是烯烴 (Alkene) 的官能基。"
            },
            {
                id: 4,
                type: 'group',
                formula: 'CH3-CHO',
                structureSVG: (
                    <svg viewBox="0 0 300 150" className="w-full h-full">
                        {/* Expanded structural hint for aldehyde */}
                        <text x="60" y="80" className="font-mono text-3xl font-bold" fill="#334155">CH₃—</text>
                        <text x="140" y="80" className="font-mono text-3xl font-bold" fill="#334155">C</text>
                        
                        {/* Double bond O up */}
                        <line x1="150" y1="60" x2="150" y2="35" stroke="#ef4444" strokeWidth="3" />
                        <line x1="156" y1="60" x2="156" y2="35" stroke="#ef4444" strokeWidth="3" />
                        <text x="142" y="30" className="font-mono text-3xl font-bold" fill="#ef4444">O</text>
                        
                        {/* Single bond H right */}
                        <line x1="165" y1="75" x2="185" y2="75" stroke="#334155" strokeWidth="3" />
                        <text x="190" y="80" className="font-mono text-3xl font-bold" fill="#334155">H</text>
                        
                        <rect x="130" y="10" width="90" height="90" rx="12" className="highlight-box" />
                    </svg>
                ),
                question: "這個官能基 (-CHO) 的名稱是？",
                options: ["Ketone group", "Aldehyde group", "Carboxyl group", "Ester group"],
                answer: "Aldehyde group",
                explanation: "-CHO (羰基連接一個氫原子) 是醛基 (Aldehyde group)。"
            },
            {
                id: 5,
                type: 'series',
                formula: 'CH3-CO-CH3',
                structureSVG: (
                    <svg viewBox="0 0 300 150" className="w-full h-full">
                        <text x="40" y="80" className="font-mono text-3xl font-bold" fill="#334155">CH₃—</text>
                        <text x="120" y="80" className="font-mono text-3xl font-bold" fill="#334155">C</text>
                        
                        {/* Double bond O up */}
                        <line x1="130" y1="60" x2="130" y2="35" stroke="#ef4444" strokeWidth="3" />
                        <line x1="136" y1="60" x2="136" y2="35" stroke="#ef4444" strokeWidth="3" />
                        <text x="122" y="30" className="font-mono text-3xl font-bold" fill="#ef4444">O</text>
                        
                        <text x="150" y="80" className="font-mono text-3xl font-bold" fill="#334155">—CH₃</text>
                        
                        <rect x="110" y="10" width="50" height="90" rx="12" className="highlight-box" />
                    </svg>
                ),
                question: "圖中顯示的是哪個同系列的特徵？",
                options: ["Aldehyde", "Ketone", "Carboxylic Acid", "Ester"],
                answer: "Ketone",
                explanation: "羰基 (C=O) 連接兩個碳原子（烷基），這是酮 (Ketone) 的特徵。"
            },
             {
                id: 6,
                type: 'series',
                formula: 'CH3-COO-CH3',
                structureSVG: (
                    <svg viewBox="0 0 300 150" className="w-full h-full">
                        <text x="20" y="80" className="font-mono text-3xl font-bold" fill="#334155">CH₃—</text>
                        <text x="100" y="80" className="font-mono text-3xl font-bold" fill="#ef4444">COO</text>
                        <text x="170" y="80" className="font-mono text-3xl font-bold" fill="#334155">—CH₃</text>
                        <rect x="95" y="50" width="80" height="50" rx="8" className="highlight-box" />
                    </svg>
                ),
                question: "這個分子屬於哪個同系列？",
                options: ["Carboxylic Acid", "Ether", "Ester", "Ketone"],
                answer: "Ester",
                explanation: "-COO- 連接兩個烷基，這是酯 (Ester) 的官能基。"
            }
        ];

        const App = () => {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [gameOver, setGameOver] = useState(false);

            const shuffleArray = (array) => {
                const newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            useEffect(() => {
                if (currentQIndex < Questions.length) {
                    setShuffledOptions(shuffleArray(Questions[currentQIndex].options));
                    setSelectedOption(null);
                    setShowResult(false);
                } else {
                    setGameOver(true);
                }
            }, [currentQIndex]);

            const handleOptionClick = (option) => {
                if (showResult) return;
                
                setSelectedOption(option);
                const correct = option === Questions[currentQIndex].answer;
                setIsCorrect(correct);
                setShowResult(true);
                
                if (correct) setScore(s => s + 10);
            };

            const nextQuestion = () => {
                setCurrentQIndex(prev => prev + 1);
            };

            const restartGame = () => {
                setScore(0);
                setCurrentQIndex(0);
                setGameOver(false);
            };

            const progress = ((currentQIndex) / Questions.length) * 100;

            if (gameOver) {
                return (
                    <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-3xl items-center justify-center min-h-[600px]">
                        <div className="bg-white p-10 rounded-3xl shadow-xl border-2 border-indigo-100 text-center w-full">
                            <div className="mb-8">
                                <div className="w-32 h-32 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner">
                                    <i data-lucide="trophy" size={64} />
                                </div>
                                <h2 className="text-4xl font-black text-slate-800 mb-2">挑戰完成！</h2>
                                <p className="text-slate-500 text-lg">你完成了所有官能基辨識題目。</p>
                            </div>
                            
                            <div className="bg-slate-50 p-8 rounded-2xl border border-slate-200 mb-10">
                                <div className="text-sm font-bold text-slate-400 uppercase mb-2 tracking-wider">最終得分</div>
                                <div className="text-6xl font-mono font-black text-indigo-600">{score} <span className="text-2xl text-slate-400">/ {Questions.length * 10}</span></div>
                            </div>
                            
                            <button 
                                onClick={restartGame}
                                className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-500 transition-all active:scale-95 text-xl flex items-center justify-center gap-3"
                            >
                                <i data-lucide="rotate-ccw" /> 再玩一次
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQ = Questions[currentQIndex];

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-7xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-green-600 flex items-center gap-2">
                                <i data-lucide="search"></i> 官能基辨識器
                            </h1>
                            <p className="text-slate-400 text-sm">Functional Group Spotter</p>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-sm font-bold text-slate-400">
                                Question {currentQIndex + 1}/{Questions.length}
                            </div>
                            <div className="bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm font-mono font-bold text-indigo-600">
                                Score: {score}
                            </div>
                        </div>
                    </div>

                    {/* Progress Bar */}
                    <div className="w-full bg-slate-200 h-2 rounded-full mb-8 overflow-hidden">
                        <div className="h-full bg-green-500 transition-all duration-500" style={{width: `${progress}%`}}></div>
                    </div>

                    {/* Main Grid Layout: 3 Columns */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 h-full">
                        
                        {/* Column 1: Visualization (Largest) - Span 5 */}
                        <div className="lg:col-span-5 flex flex-col">
                            <div className="bg-white p-4 rounded-3xl shadow-lg border-2 border-slate-100 molecule-card flex-grow min-h-[300px] flex items-center justify-center relative overflow-hidden">
                                <div className="w-full h-full">
                                    {currentQ.structureSVG}
                                </div>
                                <div className="absolute bottom-4 text-center w-full text-slate-400 text-xs font-bold uppercase tracking-widest">
                                    Identify the highlighted group
                                </div>
                            </div>
                        </div>

                        {/* Column 2: Question & Options - Span 4 */}
                        <div className="lg:col-span-4 flex flex-col gap-4">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-full flex flex-col">
                                <h3 className="text-lg font-bold text-slate-800 mb-6 leading-snug">
                                    {currentQ.question}
                                </h3>
                                
                                <div className="space-y-3 flex-grow">
                                    {shuffledOptions.map((opt, idx) => {
                                        let btnStyle = 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300';
                                        let icon = null;

                                        if (showResult) {
                                            if (opt === currentQ.answer) {
                                                btnStyle = 'bg-green-100 text-green-800 border-green-400 ring-1 ring-green-400';
                                                icon = <i data-lucide="check" size={18}/>;
                                            } else if (opt === selectedOption) {
                                                btnStyle = 'bg-red-100 text-red-800 border-red-400 ring-1 ring-red-400';
                                                icon = <i data-lucide="x" size={18}/>;
                                            } else {
                                                btnStyle = 'opacity-50 bg-slate-50 border-slate-100';
                                            }
                                        } else if (selectedOption === opt) {
                                            btnStyle = 'bg-indigo-100 text-indigo-800 border-indigo-400';
                                        }

                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => handleOptionClick(opt)}
                                                disabled={showResult}
                                                className={`option-btn w-full p-4 rounded-xl border-2 font-bold text-left flex justify-between items-center ${btnStyle}`}
                                            >
                                                <span>{opt}</span>
                                                {icon}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* Column 3: Feedback / Info - Span 3 */}
                        <div className="lg:col-span-3 flex flex-col">
                            {showResult ? (
                                <div className={`h-full p-6 rounded-2xl border-l-8 shadow-md animate-in slide-in-from-right fade-in flex flex-col ${isCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                                    <div className="flex-grow">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className={`p-2 rounded-full ${isCorrect ? 'bg-green-200 text-green-700' : 'bg-red-200 text-red-700'}`}>
                                                <i data-lucide={isCorrect ? "thumbs-up" : "info"} size={24} />
                                            </div>
                                            <h4 className={`text-xl font-black ${isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                                {isCorrect ? 'Correct!' : 'Wrong!'}
                                            </h4>
                                        </div>
                                        
                                        <div className="bg-white/60 p-4 rounded-xl text-sm leading-relaxed mb-4">
                                            <p className={`font-bold mb-1 ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>解釋 (Explanation):</p>
                                            <p className="text-slate-700">{currentQ.explanation}</p>
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={nextQuestion}
                                        className={`w-full py-3 rounded-xl font-bold text-white transition-colors flex items-center justify-center gap-2 shadow-lg ${isCorrect ? 'bg-green-600 hover:bg-green-500' : 'bg-red-500 hover:bg-red-400'}`}
                                    >
                                        下一題 <i data-lucide="arrow-right" size={18} />
                                    </button>
                                </div>
                            ) : (
                                <div className="h-full bg-slate-100 rounded-2xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                                    <i data-lucide="lightbulb" size={48} className="mb-4 opacity-30" />
                                    <p className="text-sm font-medium">請選擇一個答案</p>
                                    <p className="text-xs mt-2 opacity-70">結果與解釋將顯示於此</p>
                                </div>
                            )}
                        </div>

                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-12 border-t border-slate-200 pt-6">
                        Luminous Learner Science Tools | HKDSE Topic XI
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
