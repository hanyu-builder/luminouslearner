<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>速率繪圖儀 (Rate Graph Plotter)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .data-input {
            transition: all 0.2s;
        }
        .data-input:focus {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        /* Table Scrollbar */
        .table-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Presets Data
        const Presets = {
            concTime: [
                { 
                    name: '零級反應 (Zero Order)', 
                    data: [
                        {x: 0, y: 1.0}, {x: 10, y: 0.9}, {x: 20, y: 0.8}, {x: 30, y: 0.7}, 
                        {x: 40, y: 0.6}, {x: 50, y: 0.5}, {x: 60, y: 0.4}, {x: 70, y: 0.3}
                    ],
                    desc: '濃度隨時間直線下降 (斜率恆定)。'
                },
                { 
                    name: '一級反應 (First Order)', 
                    data: [
                        {x: 0, y: 1.0}, {x: 10, y: 0.7}, {x: 20, y: 0.49}, {x: 30, y: 0.34}, 
                        {x: 40, y: 0.24}, {x: 50, y: 0.17}, {x: 60, y: 0.12}, {x: 70, y: 0.08}
                    ],
                    desc: '濃度呈指數下降，半衰期恆定。'
                }
            ],
            rateConc: [
                {
                    name: '二級反應 (Second Order)',
                    data: [
                        {x: 0.1, y: 0.002}, {x: 0.2, y: 0.008}, {x: 0.3, y: 0.018}, 
                        {x: 0.4, y: 0.032}, {x: 0.5, y: 0.050}
                    ],
                    desc: '速率與濃度的平方成正比 (拋物線)。'
                }
            ]
        };

        const App = () => {
            const [mode, setMode] = useState('concTime'); // concTime, rateConc
            const [data, setData] = useState([
                { id: 1, x: 0, y: 1.0 },
                { id: 2, x: 10, y: 0.8 },
                { id: 3, x: 20, y: 0.65 },
                { id: 4, x: 30, y: 0.55 }
            ]);
            const [initialRate, setInitialRate] = useState(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // --- Logic: Calculate Initial Rate ---
            const calculateResults = () => {
                if (mode === 'concTime') {
                    // Initial Rate = Slope of tangent at t=0
                    // Approximation: Use first 2 points if t=0 exists, or linear regression of first few
                    // Simple method: Slope between first two points (assuming small dt)
                    // Rate = - (C2 - C1) / (t2 - t1)
                    
                    // Sort by time just in case
                    const sorted = [...data].sort((a, b) => a.x - b.x);
                    
                    if (sorted.length >= 2) {
                        const p1 = sorted[0];
                        const p2 = sorted[1];
                        if (p1.x === 0) {
                            const slope = (p2.y - p1.y) / (p2.x - p1.x);
                            setInitialRate(Math.abs(slope).toFixed(4));
                        } else {
                            setInitialRate("需從 t=0 開始數據");
                        }
                    }
                } else {
                    setInitialRate(null); // Rate-Conc doesn't calc initial rate this way
                }
            };

            // --- Chart Rendering ---
            useEffect(() => {
                if (chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    if (chartInstance.current) chartInstance.current.destroy();

                    const sortedData = [...data].sort((a, b) => a.x - b.x)
                        .map(d => ({ x: parseFloat(d.x), y: parseFloat(d.y) }))
                        .filter(d => !isNaN(d.x) && !isNaN(d.y));

                    // Determine chart labels based on mode
                    const xLabel = mode === 'concTime' ? '時間 Time (s)' : '濃度 Concentration (mol dm⁻³)';
                    const yLabel = mode === 'concTime' ? '濃度 Concentration (mol dm⁻³)' : '初始速率 Initial Rate (mol dm⁻³ s⁻¹)';
                    const title = mode === 'concTime' ? '濃度-時間圖 (Conc-Time Graph)' : '速率-濃度圖 (Rate-Conc Graph)';

                    // Dataset config
                    const dataset = {
                        label: 'Experimental Data',
                        data: sortedData,
                        borderColor: '#4f46e5', // Indigo
                        backgroundColor: 'rgba(79, 70, 229, 0.5)',
                        borderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        showLine: mode === 'concTime', // Line for time, scatter for rate usually (unless curve fitting)
                        tension: 0.4 // Smooth curve
                    };

                    // Tangent Line for Initial Rate (Conc-Time only)
                    const datasets = [dataset];
                    if (mode === 'concTime' && sortedData.length >= 2 && sortedData[0].x === 0) {
                        const slope = (sortedData[1].y - sortedData[0].y) / (sortedData[1].x - sortedData[0].x);
                        // Draw a short line for tangent representation
                        const tangentEnd = { x: sortedData[1].x, y: sortedData[0].y + slope * sortedData[1].x };
                        datasets.push({
                            label: '初始速率切線 (Initial Rate Tangent)',
                            data: [sortedData[0], tangentEnd],
                            borderColor: '#ef4444', // Red
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0
                        });
                    }

                    chartInstance.current = new Chart(ctx, {
                        type: 'scatter',
                        data: { datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: { display: true, text: title, font: { size: 16 } },
                                legend: { position: 'bottom' }
                            },
                            scales: {
                                x: {
                                    type: 'linear',
                                    position: 'bottom',
                                    title: { display: true, text: xLabel, font: { weight: 'bold' } }
                                },
                                y: {
                                    title: { display: true, text: yLabel, font: { weight: 'bold' } }
                                }
                            }
                        }
                    });
                    
                    calculateResults();
                }
            }, [data, mode]);

            // --- Handlers ---
            const handleDataChange = (id, field, value) => {
                setData(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const addRow = () => {
                const newId = data.length > 0 ? Math.max(...data.map(d => d.id)) + 1 : 1;
                // Auto-increment X guess
                const lastX = data.length > 0 ? parseFloat(data[data.length - 1].x) : 0;
                setData([...data, { id: newId, x: lastX + 10, y: '' }]);
            };

            const removeRow = (id) => {
                if (data.length > 2) setData(data.filter(item => item.id !== id));
            };

            const loadPreset = (preset) => {
                setData(preset.data.map((d, i) => ({ id: i, x: d.x, y: d.y })));
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-200 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="line-chart"></i> 速率繪圖儀
                            </h1>
                            <p className="text-slate-400 text-sm">Rate Graph Plotter</p>
                        </div>
                        
                        {/* Mode Switcher */}
                        <div className="flex bg-slate-100 p-1 rounded-lg">
                            <button 
                                onClick={() => { setMode('concTime'); setData([{id:1, x:0, y:1}, {id:2, x:10, y:0.8}]); }}
                                className={`px-4 py-2 rounded-md text-xs font-bold transition-all flex items-center gap-2 ${mode === 'concTime' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'}`}
                            >
                                <i data-lucide="activity" size={14}/> 濃度-時間圖
                            </button>
                            <button 
                                onClick={() => { setMode('rateConc'); setData([{id:1, x:0.1, y:0.01}, {id:2, x:0.2, y:0.02}]); }}
                                className={`px-4 py-2 rounded-md text-xs font-bold transition-all flex items-center gap-2 ${mode === 'rateConc' ? 'bg-white text-green-600 shadow' : 'text-slate-500'}`}
                            >
                                <i data-lucide="bar-chart-2" size={14}/> 速率-濃度圖
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Data Input */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Presets */}
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <h4 className="text-xs font-bold text-slate-400 uppercase mb-2 flex items-center gap-2">
                                    <i data-lucide="zap" size={14}/> 載入範例數據
                                </h4>
                                <div className="flex flex-wrap gap-2">
                                    {(mode === 'concTime' ? Presets.concTime : Presets.rateConc).map((p, i) => (
                                        <button 
                                            key={i}
                                            onClick={() => loadPreset(p)}
                                            className="px-3 py-1 bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 rounded text-xs font-bold transition-colors"
                                            title={p.desc}
                                        >
                                            {p.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Data Table */}
                            <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-100 flex-grow flex flex-col max-h-[600px]">
                                <h3 className="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <i data-lucide="table" size={16}/> 實驗數據
                                </h3>
                                
                                <div className="grid grid-cols-6 gap-2 mb-2 px-2 text-xs font-bold text-slate-400 uppercase">
                                    <div className="col-span-2">{mode === 'concTime' ? '時間 (s)' : '濃度 (M)'}</div>
                                    <div className="col-span-3">{mode === 'concTime' ? '濃度 (M)' : '速率 (M/s)'}</div>
                                    <div className="col-span-1 text-center">操作</div>
                                </div>

                                <div className="flex-grow overflow-y-auto table-scroll space-y-2 pr-1">
                                    {data.map((row) => (
                                        <div key={row.id} className="grid grid-cols-6 gap-2 items-center">
                                            <div className="col-span-2">
                                                <input 
                                                    type="number" 
                                                    value={row.x} 
                                                    onChange={(e) => handleDataChange(row.id, 'x', e.target.value)}
                                                    className="w-full p-2 rounded border border-slate-200 font-mono text-sm text-center data-input outline-none"
                                                />
                                            </div>
                                            <div className="col-span-3">
                                                <input 
                                                    type="number" 
                                                    value={row.y} 
                                                    onChange={(e) => handleDataChange(row.id, 'y', e.target.value)}
                                                    className="w-full p-2 rounded border border-slate-200 font-mono text-sm text-center data-input outline-none"
                                                />
                                            </div>
                                            <div className="col-span-1 text-center">
                                                <button 
                                                    onClick={() => removeRow(row.id)}
                                                    className="text-slate-300 hover:text-red-500 transition-colors"
                                                >
                                                    <i data-lucide="trash-2" size={16}/>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <button 
                                    onClick={addRow}
                                    className="mt-4 w-full py-2 border-2 border-dashed border-slate-200 text-slate-400 hover:border-indigo-300 hover:text-indigo-500 rounded-xl font-bold text-xs flex items-center justify-center gap-1 transition-all"
                                >
                                    <i data-lucide="plus" size={14}/> 增加數據點
                                </button>
                            </div>

                        </div>

                        {/* Right: Graph & Analysis */}
                        <div className="w-full lg:w-2/3 flex flex-col gap-6">
                            
                            {/* Chart Area */}
                            <div className="bg-white p-4 rounded-3xl shadow-lg border border-slate-200 h-[500px] relative">
                                <canvas ref={chartRef}></canvas>
                            </div>

                            {/* Analysis Panel (Only for Conc-Time Initial Rate) */}
                            {mode === 'concTime' && (
                                <div className="bg-slate-800 p-6 rounded-2xl shadow-lg text-white border border-slate-700">
                                    <h3 className="text-xs font-bold text-slate-400 uppercase mb-4 flex items-center gap-2">
                                        <i data-lucide="activity" size={16}/> 分析結果
                                    </h3>
                                    <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                                        <div>
                                            <div className="text-sm font-bold text-indigo-400 mb-1">初始速率 (Initial Rate)</div>
                                            <div className="text-xs text-slate-400">基於 t=0 的切線斜率估算</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-4xl font-mono font-black text-green-400">
                                                {initialRate ? initialRate : '--'}
                                            </div>
                                            <div className="text-sm text-slate-500 font-mono">mol dm⁻³ s⁻¹</div>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-4 pt-4 border-t border-slate-700 text-xs text-slate-400 font-mono bg-slate-900/50 p-3 rounded-lg">
                                        Rate₀ ≈ - (C₂ - C₁) / (t₂ - t₁) = ({data[0]?.y} - {data[1]?.y}) / ({data[1]?.x} - {data[0]?.x})
                                    </div>
                                </div>
                            )}

                        </div>

                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8 border-t border-slate-200 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic IX
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
