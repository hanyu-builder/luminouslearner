<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摩爾數計算機 (The Mole Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Path Animation */
        @keyframes flow {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }
        .path-flow {
            stroke-dasharray: 10;
            animation: flow 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Constants
        const AVOGADRO = 6.02e23;

        // Atomic Masses for auto-calculation
        const AtomicMasses = {
            H: 1.0, He: 4.0, Li: 6.9, Be: 9.0, B: 10.8, C: 12.0, N: 14.0, O: 16.0, F: 19.0, Ne: 20.2,
            Na: 23.0, Mg: 24.3, Al: 27.0, Si: 28.1, P: 31.0, S: 32.1, Cl: 35.5, K: 39.1, Ar: 39.9, Ca: 40.1,
            Fe: 55.8, Cu: 63.5, Zn: 65.4, Br: 79.9, Ag: 107.9, I: 126.9, Ba: 137.3, Pb: 207.2
        };

        // Common Presets
        const Presets = [
            { formula: 'H2O', mass: 18.0 },
            { formula: 'CO2', mass: 44.0 },
            { formula: 'NaCl', mass: 58.5 },
            { formula: 'CaCO3', mass: 100.1 },
            { formula: 'Cu', mass: 63.5 }
        ];

        const App = () => {
            // Inputs
            const [mass, setMass] = useState('');
            const [mole, setMole] = useState('');
            const [particles, setParticles] = useState('');
            
            // Settings (Molar Mass)
            const [molarMassInput, setMolarMassInput] = useState('18.0'); // Can be formula or number
            const [molarMass, setMolarMass] = useState(18.0); // The actual number used for calc
            const [mmError, setMmError] = useState('');
            
            // Focus State for visualization
            const [activeField, setActiveField] = useState(null); // 'mass', 'mole', 'particles'

            // --- Molar Mass Parser Logic (Borrowed from previous app) ---
            const parseFormulaMass = (input) => {
                if (!input) return null;
                // If it's a direct number
                if (!isNaN(parseFloat(input)) && isFinite(input)) {
                    return parseFloat(input);
                }
                
                // Otherwise try to parse as chemical formula
                try {
                    let formulaStr = input.trim();
                    const stack = [{ atoms: {} }];
                    let i = 0;
                    const len = formulaStr.length;

                    while (i < len) {
                        const char = formulaStr[i];
                        if (char === '(') { stack.push({ atoms: {} }); i++; }
                        else if (char === ')') {
                            if (stack.length === 1) throw new Error("Unmatched brackets");
                            const group = stack.pop();
                            i++;
                            let numStr = '';
                            while (i < len && /\d/.test(formulaStr[i])) { numStr += formulaStr[i]; i++; }
                            const multiplier = numStr ? parseInt(numStr) : 1;
                            const parent = stack[stack.length - 1];
                            for (const [el, count] of Object.entries(group.atoms)) {
                                parent.atoms[el] = (parent.atoms[el] || 0) + count * multiplier;
                            }
                        } else if (/[A-Z]/.test(char)) {
                            let element = char;
                            i++;
                            if (i < len && /[a-z]/.test(formulaStr[i])) { element += formulaStr[i]; i++; }
                            let numStr = '';
                            while (i < len && /\d/.test(formulaStr[i])) { numStr += formulaStr[i]; i++; }
                            const count = numStr ? parseInt(numStr) : 1;
                            const current = stack[stack.length - 1];
                            current.atoms[element] = (current.atoms[element] || 0) + count;
                        } else { i++; }
                    }
                    
                    let mass = 0;
                    for (const [el, count] of Object.entries(stack[0].atoms)) {
                        const atomicMass = AtomicMasses[el];
                        if (!atomicMass) return null; // Unknown element
                        mass += atomicMass * count;
                    }
                    return mass > 0 ? parseFloat(mass.toFixed(1)) : null;
                } catch (e) {
                    return null;
                }
            };

            // Handle Molar Mass Input Change
            useEffect(() => {
                const calculated = parseFormulaMass(molarMassInput);
                if (calculated) {
                    setMolarMass(calculated);
                    setMmError('');
                    // Recalculate based on last active field
                    if (activeField === 'mass' && mass) handleMassChange(mass, calculated);
                    else if (activeField === 'mole' && mole) handleMoleChange(mole, calculated);
                    else if (activeField === 'particles' && particles) handleParticlesChange(particles, calculated);
                } else {
                    // Only show error if input is not empty and not a partial formula
                    if (molarMassInput && !molarMassInput.match(/^[A-Z]/)) {
                       // setMmError('無效數值或化學式'); // Optional: show error
                    }
                }
            }, [molarMassInput]);

            // Helper: Format scientific notation
            const formatSci = (input) => {
                if (input === '' || input === null || input === undefined) return '';
                const num = parseFloat(input);
                if (isNaN(num)) return '';
                if (num === 0) return '0';
                if (Math.abs(num) < 10000 && Math.abs(num) > 0.001) return parseFloat(num.toFixed(3));
                return num.toExponential(3).replace('e+', ' × 10^');
            };

            // Calculation Handlers (Accepting mm as arg to avoid stale state)
            const handleMassChange = (val, mm = molarMass) => {
                setMass(val);
                setActiveField('mass');
                if (val && !isNaN(val)) {
                    const m = parseFloat(val);
                    const n = m / mm;
                    const p = n * AVOGADRO;
                    setMole(n);
                    setParticles(p);
                } else {
                    setMole('');
                    setParticles('');
                }
            };

            const handleMoleChange = (val, mm = molarMass) => {
                setMole(val);
                setActiveField('mole');
                if (val && !isNaN(val)) {
                    const n = parseFloat(val);
                    const m = n * mm;
                    const p = n * AVOGADRO;
                    setMass(m);
                    setParticles(p);
                } else {
                    setMass('');
                    setParticles('');
                }
            };

            const handleParticlesChange = (val, mm = molarMass) => {
                setParticles(val);
                setActiveField('particles');
                if (val && !isNaN(val)) {
                    const p = parseFloat(val);
                    const n = p / AVOGADRO;
                    const m = n * mm;
                    setMass(m);
                    setMole(n);
                } else {
                    setMass('');
                    setMole('');
                }
            };

            const applyPreset = (p) => {
                setMolarMassInput(p.formula);
                // Trigger calculation will happen via useEffect
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="calculator"></i> 摩爾數計算機
                            </h1>
                            <p className="text-slate-400 text-sm">The Mole Calculator & Y-Map</p>
                        </div>
                        <button onClick={() => { setMass(''); setMole(''); setParticles(''); }} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 清除
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Y-Map Visualization (Unchanged visual) */}
                        <div className="w-full lg:w-1/2 bg-white rounded-2xl shadow-lg border border-slate-100 p-6 relative min-h-[400px] flex items-center justify-center">
                            <svg viewBox="0 0 400 400" className="w-full h-full max-w-[400px]">
                                <defs>
                                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                                        <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
                                    </marker>
                                </defs>
                                {/* Center: MOLE */}
                                <circle cx="200" cy="200" r="50" fill={activeField === 'mole' ? '#e0e7ff' : '#f8fafc'} stroke={activeField === 'mole' ? '#4f46e5' : '#cbd5e1'} strokeWidth="3" />
                                <text x="200" y="195" textAnchor="middle" className="font-bold fill-indigo-600 text-sm">MOLE (n)</text>
                                <text x="200" y="215" textAnchor="middle" className="font-mono text-xs fill-slate-500">{formatSci(mole) || '?'}</text>
                                {/* Top: MASS */}
                                <g transform="translate(200, 60)">
                                    <rect x="-60" y="-30" width="120" height="60" rx="10" fill={activeField === 'mass' ? '#dbeafe' : '#f8fafc'} stroke={activeField === 'mass' ? '#2563eb' : '#cbd5e1'} strokeWidth="3" />
                                    <text x="0" y="-5" textAnchor="middle" className="font-bold fill-blue-600 text-sm">MASS (m)</text>
                                    <text x="0" y="15" textAnchor="middle" className="font-mono text-xs fill-slate-500">{formatSci(mass) || '?'} g</text>
                                </g>
                                {/* Bottom Right: PARTICLES */}
                                <g transform="translate(320, 320)">
                                    <rect x="-70" y="-30" width="140" height="60" rx="10" fill={activeField === 'particles' ? '#dcfce7' : '#f8fafc'} stroke={activeField === 'particles' ? '#16a34a' : '#cbd5e1'} strokeWidth="3" />
                                    <text x="0" y="-5" textAnchor="middle" className="font-bold fill-green-600 text-sm">PARTICLES (N)</text>
                                    <text x="0" y="15" textAnchor="middle" className="font-mono text-xs fill-slate-500">{formatSci(particles) || '?'}</text>
                                </g>
                                {/* Paths */}
                                <path d="M200 90 L200 150" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow)" />
                                <text x="210" y="120" className="text-[10px] fill-slate-400">÷ M</text>
                                <text x="170" y="120" className="text-[10px] fill-slate-400">× M</text>
                                <path d="M235 235 L280 280" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow)" />
                                <text x="270" y="240" className="text-[10px] fill-slate-400">× L</text>
                                <text x="240" y="270" className="text-[10px] fill-slate-400">÷ L</text>
                                <text x="320" y="365" textAnchor="middle" className="text-[8px] fill-slate-400">L = 6.02 × 10²³</text>
                                <text x="200" y="30" textAnchor="middle" className="text-[8px] fill-slate-400">M = Molar Mass ({molarMass})</text>
                            </svg>
                        </div>

                        {/* Right: Input Controls */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            {/* New: Prominent Molar Mass Setting */}
                            <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 shadow-sm">
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-sm font-bold text-indigo-800 flex items-center gap-2">
                                        <i data-lucide="flask-conical" size={16}/> 設定摩爾質量 (Molar Mass, M)
                                    </label>
                                    <span className="text-xs font-mono bg-white px-2 py-1 rounded text-indigo-600 border border-indigo-200">
                                        當前值: {molarMass} g/mol
                                    </span>
                                </div>
                                
                                <div className="flex gap-2 mb-3 flex-wrap">
                                    {Presets.map(p => (
                                        <button 
                                            key={p.formula} 
                                            onClick={() => applyPreset(p)}
                                            className={`px-3 py-1 rounded-full text-xs font-bold border transition-all
                                                ${molarMassInput === p.formula 
                                                    ? 'bg-indigo-600 text-white border-indigo-600' 
                                                    : 'bg-white text-slate-500 border-slate-200 hover:border-indigo-300 hover:text-indigo-500'}
                                            `}
                                        >
                                            {p.formula}
                                        </button>
                                    ))}
                                </div>

                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={molarMassInput}
                                        onChange={(e) => setMolarMassInput(e.target.value)}
                                        placeholder="輸入數值 (e.g. 18) 或 化學式 (e.g. H2SO4)"
                                        className="w-full p-3 rounded-lg border border-indigo-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none font-mono font-bold text-indigo-900 placeholder-indigo-300"
                                    />
                                    <div className="absolute right-3 top-3 text-xs text-slate-400 font-bold pointer-events-none">g/mol</div>
                                </div>
                                <p className="text-xs text-slate-400 mt-2 ml-1">
                                    💡 支援直接輸入化學式，系統會自動計算！
                                </p>
                            </div>

                            {/* Mass Input */}
                            <div className={`p-6 rounded-2xl border-2 transition-all ${activeField === 'mass' ? 'bg-blue-50 border-blue-400 shadow-md' : 'bg-white border-slate-100'}`}>
                                <label className="block text-sm font-bold text-blue-700 mb-2 flex justify-between">
                                    <span>質量 (Mass, g)</span>
                                    <span className="text-xs font-normal bg-blue-200 text-blue-800 px-2 rounded">Input</span>
                                </label>
                                <input 
                                    type="number" 
                                    value={mass}
                                    onChange={(e) => handleMassChange(e.target.value)}
                                    placeholder="e.g. 18.0"
                                    className="w-full text-2xl font-mono font-bold bg-transparent outline-none text-slate-700 placeholder-slate-300 border-b border-blue-200 focus:border-blue-500 transition-colors"
                                />
                            </div>

                            {/* Mole Input */}
                            <div className={`p-6 rounded-2xl border-2 transition-all ${activeField === 'mole' ? 'bg-indigo-50 border-indigo-400 shadow-md' : 'bg-white border-slate-100'}`}>
                                <label className="block text-sm font-bold text-indigo-700 mb-2 flex justify-between">
                                    <span>摩爾數 (Mole, mol)</span>
                                    <span className="text-xs font-normal bg-indigo-200 text-indigo-800 px-2 rounded">Center</span>
                                </label>
                                <input 
                                    type="number" 
                                    value={mole}
                                    onChange={(e) => handleMoleChange(e.target.value)}
                                    placeholder="e.g. 1.0"
                                    className="w-full text-2xl font-mono font-bold bg-transparent outline-none text-slate-700 placeholder-slate-300 border-b border-indigo-200 focus:border-indigo-500 transition-colors"
                                />
                            </div>

                            {/* Particles Input */}
                            <div className={`p-6 rounded-2xl border-2 transition-all ${activeField === 'particles' ? 'bg-green-50 border-green-400 shadow-md' : 'bg-white border-slate-100'}`}>
                                <label className="block text-sm font-bold text-green-700 mb-2 flex justify-between">
                                    <span>粒子數 (No. of Particles)</span>
                                    <span className="text-xs font-normal bg-green-200 text-green-800 px-2 rounded">Count</span>
                                </label>
                                <div className="flex items-center gap-2">
                                    <input 
                                        type="number" 
                                        value={particles}
                                        onChange={(e) => handleParticlesChange(e.target.value)}
                                        placeholder="e.g. 6.02e23"
                                        className="w-full text-xl font-mono font-bold bg-transparent outline-none text-slate-700 placeholder-slate-300 border-b border-green-200 focus:border-green-500 transition-colors"
                                    />
                                </div>
                                <p className="text-xs text-slate-400 mt-2">提示：輸入科學記號可用 'e' (例如 6.02e23)</p>
                            </div>

                            {/* Formula Help */}
                            <div className="p-4 bg-slate-800 rounded-xl text-white text-sm">
                                <h4 className="font-bold mb-2 flex items-center gap-2"><i data-lucide="lightbulb" size={16}/> 記憶口訣 (Formula Triangle)</h4>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <div className="text-slate-400 text-xs">Mass to Mole</div>
                                        <div className="font-mono text-lg">n = m ÷ M</div>
                                    </div>
                                    <div>
                                        <div className="text-slate-400 text-xs">Mole to Particles</div>
                                        <div className="font-mono text-lg">N = n × L</div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic III
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
