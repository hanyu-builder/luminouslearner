<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海水分離實驗室 (Sea Water Separation Lab)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        .beaker-content { transition: all 1s ease; }
        .drop { animation: drop 1s infinite; }
        @keyframes drop {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }
        .bubble { animation: bubble 2s infinite ease-in; }
        @keyframes bubble {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const Icons = {
            Beaker: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>,
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 3-8.646 8.646a.5.5 0 0 0-.146.353v8.486a.5.5 0 0 1-.207.403l-2 1.5a.5.5 0 0 1-.793-.403v-9.986a.5.5 0 0 0-.146-.353L2 3h20z"/></svg>,
            Flame: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.243-2.185.7-3.14 1.54 1.045 2.6 2.088 2.8 3.64Z"/></svg>,
            Snowflake: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg>,
            Droplet: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        };

        const App = () => {
            // State
            const [mixture, setMixture] = useState({
                water: true,
                salt: true,
                sand: true,
                state: 'liquid' // liquid, gas, solid
            });
            const [processHistory, setProcessHistory] = useState([]);
            const [message, setMessage] = useState({ text: '歡迎來到分離實驗室！請選擇你的目標。', type: 'info' });
            const [target, setTarget] = useState(null); // 'water' or 'salt'
            const [animating, setAnimating] = useState(false);

            // Reset
            const resetLab = () => {
                setMixture({ water: true, salt: true, sand: true, state: 'liquid' });
                setProcessHistory([]);
                setMessage({ text: '實驗桌已重置。請重新開始。', type: 'info' });
                setTarget(null);
                setAnimating(false);
            };

            // Process Handlers
            const handleFilter = () => {
                if (animating) return;
                setAnimating(true);
                setMessage({ text: '正在進行過濾 (Filtration)...', type: 'loading' });
                
                setTimeout(() => {
                    if (!mixture.sand) {
                        setMessage({ text: '混合物中已經沒有沙子了，不需要過濾。', type: 'warning' });
                    } else if (mixture.state !== 'liquid') {
                        setMessage({ text: '只能過濾液體混合物！', type: 'error' });
                    } else {
                        setMixture(prev => ({ ...prev, sand: false }));
                        setProcessHistory(prev => [...prev, 'filtration']);
                        setMessage({ text: '過濾完成！沙子 (Insoluble solid) 已被濾紙隔除。濾液 (Filtrate) 現在是鹽水。', type: 'success' });
                    }
                    setAnimating(false);
                }, 2000);
            };

            const handleDistill = () => {
                if (animating) return;
                setAnimating(true);
                setMessage({ text: '正在進行蒸餾 (Distillation)...', type: 'loading' });

                setTimeout(() => {
                    if (mixture.sand) {
                        setMessage({ text: '危險！加熱含有沙子的混合物會導致暴沸 (Bumping)。請先過濾！', type: 'error' });
                    } else if (!mixture.water) {
                        setMessage({ text: '沒有水可以蒸餾了。', type: 'warning' });
                    } else {
                        // Distillation separates water from salt
                        // In this sim, we focus on collecting the distillate (water)
                        if (target === 'water') {
                            setMixture({ water: true, salt: false, sand: false, state: 'liquid' });
                            setProcessHistory(prev => [...prev, 'distillation']);
                            setMessage({ text: '蒸餾成功！水受熱變成蒸氣，經冷凝管冷卻變回純水 (Distillate)。', type: 'success' });
                        } else {
                            setMessage({ text: '蒸餾確實能分離水，但如果你想要的是鹽，這不是最有效率的方法（水被移走了）。', type: 'info' });
                            setMixture({ water: false, salt: true, sand: false, state: 'solid' });
                        }
                    }
                    setAnimating(false);
                }, 3000);
            };

            const handleEvaporate = () => {
                if (animating) return;
                setAnimating(true);
                setMessage({ text: '正在進行蒸發 (Evaporation)...', type: 'loading' });

                setTimeout(() => {
                    if (mixture.sand) {
                        setMessage({ text: '請先過濾沙子！否則你會得到混有沙子的鹽。', type: 'error' });
                    } else if (!mixture.water) {
                        setMessage({ text: '已經乾了。', type: 'warning' });
                    } else {
                        setMixture(prev => ({ ...prev, water: false, state: 'solid' }));
                        setProcessHistory(prev => [...prev, 'evaporation']);
                        setMessage({ text: '加熱完成！水份已完全蒸發，留下白色粉末狀的鹽。', type: 'success' });
                    }
                    setAnimating(false);
                }, 2500);
            };

            const handleCrystallize = () => {
                if (animating) return;
                setAnimating(true);
                setMessage({ text: '正在進行結晶 (Crystallisation)...', type: 'loading' });

                setTimeout(() => {
                    if (mixture.sand) {
                        setMessage({ text: '含有雜質！請先過濾。', type: 'error' });
                    } else if (!mixture.water) {
                        setMessage({ text: '需要水作為溶劑才能進行結晶。', type: 'error' });
                    } else {
                        // Crystallisation logic: concentrate then cool
                        setMixture(prev => ({ ...prev, water: false, state: 'crystal' }));
                        setProcessHistory(prev => [...prev, 'crystallisation']);
                        setMessage({ text: '加熱濃縮並冷卻後，漂亮的鹽晶體析出了！這是獲取純淨固體的最佳方法。', type: 'success' });
                    }
                    setAnimating(false);
                }, 3000);
            };

            // Visual Component for Beaker
            const BeakerVisual = () => (
                <div className="relative w-48 h-64 mx-auto mt-8">
                    {/* Glass Container */}
                    <div className="absolute bottom-0 w-full h-full border-x-4 border-b-4 border-slate-300 rounded-b-xl bg-blue-50/20 backdrop-blur-sm overflow-hidden">
                        
                        {/* Liquid Level */}
                        {mixture.water && (
                            <div className={`absolute bottom-0 w-full transition-all duration-1000 ${animating ? 'animate-pulse' : ''} bg-blue-200/60 h-3/4`}>
                                {/* Bubbles if heating */}
                                {animating && (message.text.includes('蒸') || message.text.includes('結晶')) && (
                                    <>
                                        <div className="bubble absolute bottom-2 left-1/4 w-4 h-4 bg-white/50 rounded-full"></div>
                                        <div className="bubble absolute bottom-4 left-1/2 w-6 h-6 bg-white/50 rounded-full" style={{animationDelay: '0.5s'}}></div>
                                        <div className="bubble absolute bottom-2 right-1/4 w-3 h-3 bg-white/50 rounded-full" style={{animationDelay: '1s'}}></div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* Sand Particles */}
                        {mixture.sand && (
                            <div className="absolute bottom-0 w-full h-12 bg-yellow-700/50 flex flex-wrap justify-center items-end p-1 gap-1 opacity-80">
                                {Array.from({length: 20}).map((_,i) => (
                                    <div key={i} className="w-2 h-2 bg-yellow-800 rounded-full"></div>
                                ))}
                            </div>
                        )}

                        {/* Salt (Dissolved or Solid) */}
                        {mixture.salt && (
                            mixture.water ? (
                                // Dissolved: Invisible but implied label
                                <div className="absolute top-1/2 w-full text-center text-blue-800/50 font-bold text-sm">
                                    (NaCl Dissolved)
                                </div>
                            ) : (
                                // Solid: White powder or Crystals
                                <div className="absolute bottom-0 w-full h-16 flex justify-center items-end">
                                    {mixture.state === 'crystal' ? (
                                        <div className="grid grid-cols-4 gap-1 p-2">
                                            {Array.from({length: 12}).map((_,i) => (
                                                <div key={i} className="w-6 h-6 bg-white border border-slate-200 transform rotate-45 shadow-sm"></div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="w-3/4 h-8 bg-white rounded-t-full opacity-90 blur-[1px]"></div>
                                    )}
                                </div>
                            )
                        )}
                    </div>
                    {/* Labels */}
                    <div className="absolute -right-24 bottom-10 text-xs text-slate-500 space-y-1">
                        {mixture.sand && <div className="flex items-center gap-1"><span className="w-2 h-2 bg-yellow-700 rounded-full"></span> 沙子 (Sand)</div>}
                        {mixture.water && <div className="flex items-center gap-1"><span className="w-2 h-2 bg-blue-200 rounded-full"></span> 水 (Water)</div>}
                        {mixture.salt && <div className="flex items-center gap-1"><span className="w-2 h-2 bg-white border border-slate-300"></span> 鹽 (Salt)</div>}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-4xl">
                    
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-blue-600 flex items-center gap-2">
                                <Icons.Beaker /> 海水分離實驗室
                            </h1>
                            <p className="text-slate-400 text-sm">Separation of Mixtures Simulation</p>
                        </div>
                        <button onClick={resetLab} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg font-bold text-sm hover:bg-slate-200">
                            重置 (Reset)
                        </button>
                    </div>

                    {!target ? (
                        <div className="flex-grow flex flex-col justify-center items-center space-y-8 py-12">
                            <h2 className="text-2xl font-bold text-slate-700">請選擇你的實驗目標：</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                                <button 
                                    onClick={() => setTarget('water')}
                                    className="p-8 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-2xl flex flex-col items-center gap-4 transition-all transform hover:scale-105"
                                >
                                    <div className="p-4 bg-blue-500 text-white rounded-full">
                                        <Icons.Droplet size={48} />
                                    </div>
                                    <div className="text-center">
                                        <h3 className="text-xl font-bold text-blue-800">獲取純水 (Pure Water)</h3>
                                        <p className="text-blue-600 text-sm mt-2">適合飲用或化學實驗</p>
                                    </div>
                                </button>

                                <button 
                                    onClick={() => setTarget('salt')}
                                    className="p-8 bg-yellow-50 hover:bg-yellow-100 border-2 border-yellow-200 rounded-2xl flex flex-col items-center gap-4 transition-all transform hover:scale-105"
                                >
                                    <div className="p-4 bg-yellow-500 text-white rounded-full">
                                        <Icons.Snowflake size={48} />
                                    </div>
                                    <div className="text-center">
                                        <h3 className="text-xl font-bold text-yellow-800">獲取純鹽晶體 (Salt Crystals)</h3>
                                        <p className="text-yellow-600 text-sm mt-2">去除雜質的氯化鈉晶體</p>
                                    </div>
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                            {/* Left: Workbench */}
                            <div className="w-full lg:w-2/3 bg-white rounded-2xl shadow-lg border border-slate-100 p-6 relative min-h-[400px] flex flex-col">
                                <div className="absolute top-4 left-4 bg-slate-100 px-3 py-1 rounded-full text-xs font-bold text-slate-500 uppercase tracking-wide">
                                    目標: {target === 'water' ? '獲取純水' : '獲取純鹽晶體'}
                                </div>
                                
                                <BeakerVisual />

                                {/* Feedback Message Area */}
                                <div className={`mt-8 p-4 rounded-xl border text-center transition-all
                                    ${message.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 
                                      message.type === 'success' ? 'bg-green-50 border-green-200 text-green-700' : 
                                      message.type === 'loading' ? 'bg-blue-50 border-blue-200 text-blue-700 animate-pulse' :
                                      'bg-slate-50 border-slate-200 text-slate-600'
                                    }
                                `}>
                                    {message.type === 'success' && <span className="text-2xl mr-2">🎉</span>}
                                    {message.type === 'error' && <span className="text-2xl mr-2">⚠️</span>}
                                    <span className="font-bold">{message.text}</span>
                                </div>
                            </div>

                            {/* Right: Tools */}
                            <div className="w-full lg:w-1/3 flex flex-col gap-3">
                                <h3 className="font-bold text-slate-700 mb-2 flex items-center gap-2">
                                    實驗工具箱 (Tools)
                                </h3>
                                
                                <button 
                                    onClick={handleFilter}
                                    disabled={animating}
                                    className="flex items-center gap-4 p-4 bg-white border border-slate-200 rounded-xl hover:border-blue-400 hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed group"
                                >
                                    <div className="p-2 bg-gray-100 rounded-lg group-hover:bg-blue-50 text-gray-600 group-hover:text-blue-600">
                                        <Icons.Filter />
                                    </div>
                                    <div className="text-left">
                                        <div className="font-bold text-slate-800">過濾 (Filtration)</div>
                                        <div className="text-xs text-slate-500">移除不溶性固體 (如沙子)</div>
                                    </div>
                                </button>

                                <button 
                                    onClick={handleEvaporate}
                                    disabled={animating}
                                    className="flex items-center gap-4 p-4 bg-white border border-slate-200 rounded-xl hover:border-orange-400 hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed group"
                                >
                                    <div className="p-2 bg-gray-100 rounded-lg group-hover:bg-orange-50 text-gray-600 group-hover:text-orange-600">
                                        <Icons.Flame />
                                    </div>
                                    <div className="text-left">
                                        <div className="font-bold text-slate-800">蒸發至乾 (Evaporation)</div>
                                        <div className="text-xs text-slate-500">快速移除水份，得到粉末</div>
                                    </div>
                                </button>

                                <button 
                                    onClick={handleCrystallize}
                                    disabled={animating}
                                    className="flex items-center gap-4 p-4 bg-white border border-slate-200 rounded-xl hover:border-purple-400 hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed group"
                                >
                                    <div className="p-2 bg-gray-100 rounded-lg group-hover:bg-purple-50 text-gray-600 group-hover:text-purple-600">
                                        <Icons.Snowflake />
                                    </div>
                                    <div className="text-left">
                                        <div className="font-bold text-slate-800">結晶法 (Crystallisation)</div>
                                        <div className="text-xs text-slate-500">緩慢濃縮冷卻，得到大晶體</div>
                                    </div>
                                </button>

                                <button 
                                    onClick={handleDistill}
                                    disabled={animating}
                                    className="flex items-center gap-4 p-4 bg-white border border-slate-200 rounded-xl hover:border-cyan-400 hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed group"
                                >
                                    <div className="p-2 bg-gray-100 rounded-lg group-hover:bg-cyan-50 text-gray-600 group-hover:text-cyan-600">
                                        <Icons.Droplet />
                                    </div>
                                    <div className="text-left">
                                        <div className="font-bold text-slate-800">蒸餾 (Distillation)</div>
                                        <div className="text-xs text-slate-500">收集溶劑 (水)</div>
                                    </div>
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
