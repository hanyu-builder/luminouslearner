<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反應網絡探索器 (Reaction Map Explorer)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .node {
            transition: filter 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }
        .node:hover {
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
            transform: scale(1.05);
        }
        .node-active rect {
            stroke: #4f46e5;
            stroke-width: 3px;
            filter: drop-shadow(0 0 12px rgba(79, 70, 229, 0.8));
        }

        .edge {
            transition: stroke-width 0.3s ease, stroke 0.3s ease;
            cursor: pointer;
        }
        .edge:hover {
            stroke: #ef4444;
            stroke-width: 5px;
        }
        .edge-active {
            stroke: #ef4444 !important;
            stroke-width: 5px !important;
            animation: dash 1s linear infinite;
        }
        
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }

        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col overflow-hidden">

    <div id="root" class="flex-grow flex flex-col h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Data: Nodes (Compounds) ---
        // Layout: Expanded to fit new groups from images
        const Nodes = [
            // Column 1: Hydrocarbons & Halides
            { id: 'alkane', label: 'Alkane\n烷烴', x: 100, y: 300, color: '#334155' },
            { id: 'haloalkane', label: 'Haloalkane\n鹵代烷', x: 350, y: 100, color: '#fbbf24' },
            { id: 'alkene', label: 'Alkene\n烯烴', x: 350, y: 300, color: '#a3e635' },
            { id: 'alkyne', label: 'Alkyne\n炔烴', x: 350, y: 500, color: '#65a30d' },
            { id: 'gem_dihalide', label: 'Geminal Dihalide\n同碳二鹵化物', x: 100, y: 500, color: '#fbbf24' }, // From image
            
            // Column 2: Oxygenates (Alcohols, Ethers, Epoxides)
            { id: 'alcohol', label: 'Alcohol\n醇', x: 650, y: 300, color: '#38bdf8' },
            { id: 'ether', label: 'Ether\n醚', x: 650, y: 100, color: '#7dd3fc' },
            { id: 'epoxide', label: 'Epoxide\n環氧化物', x: 650, y: 500, color: '#22d3ee' }, // From image
            { id: 'vic_diol', label: 'Vicinal Diol\n鄰二醇', x: 650, y: 700, color: '#0ea5e9' }, // From image

            // Column 3: Carbonyls
            { id: 'aldehyde', label: 'Aldehyde\n醛', x: 950, y: 300, color: '#f472b6' },
            { id: 'ketone', label: 'Ketone\n酮', x: 950, y: 500, color: '#f472b6' },
            
            // Column 4: Carboxylic Derivatives
            { id: 'acid', label: 'Carboxylic Acid\n羧酸', x: 1250, y: 300, color: '#ef4444' },
            { id: 'ester', label: 'Ester\n酯', x: 1250, y: 500, color: '#c084fc' },
            { id: 'amide', label: 'Amide\n酰胺', x: 1500, y: 300, color: '#818cf8' },
            
            // Column 5: Nitrogen/Sulfur (Extras)
            { id: 'nitrile', label: 'Nitrile\n腈', x: 950, y: 100, color: '#fcd34d' },
            { id: 'amine', label: 'Amine\n胺', x: 1250, y: 100, color: '#818cf8' }
        ];

        // --- Data: Edges (Reactions) ---
        // Incorporating new reactions from images
        const Edges = [
            // Alkyne Reactions (Expanded)
            { from: 'alkyne', to: 'alkene', id: 'r_alkyne_cis', reagents: 'H₂, Lindlar Catalyst', type: 'Reduction', desc: '生成順式烯烴 (Syn-addition)' },
            { from: 'alkyne', to: 'alkene', id: 'r_alkyne_trans', reagents: 'Na, NH₃(l)', type: 'Reduction', desc: '生成反式烯烴 (Anti-addition)' },
            { from: 'alkyne', to: 'gem_dihalide', id: 'r_alkyne_gem', reagents: 'Excess HX', type: 'Addition', desc: '馬氏規則 (Markovnikov)' },
            { from: 'alkyne', to: 'ketone', id: 'r_alkyne_ketone', reagents: 'HgSO₄, H₂SO₄, H₂O', type: 'Hydration', desc: '酸催化水合 (Markovnikov) -> Enol -> Ketone' },
            { from: 'alkyne', to: 'aldehyde', id: 'r_alkyne_ald', reagents: '1) R₂BH, 2) H₂O₂, NaOH', type: 'Hydroboration', desc: '反馬氏水合 (Anti-Markovnikov) -> Enol -> Aldehyde' },

            // Alkene Reactions (Expanded)
            { from: 'alkene', to: 'alkane', id: 'r2', reagents: 'H₂, Pd/C', type: 'Reduction', desc: '氫化' },
            { from: 'alkene', to: 'haloalkane', id: 'r3', reagents: 'HX', type: 'Addition', desc: '馬氏加成 (Markovnikov)' },
            { from: 'alkene', to: 'haloalkane', id: 'r_alkene_halo_anti', reagents: 'HBr, ROOR (peroxides)', type: 'Addition', desc: '反馬氏加成 (Anti-Markovnikov)' },
            { from: 'alkene', to: 'alcohol', id: 'r4', reagents: 'H₃O⁺ (cat.), H₂O', type: 'Hydration', desc: '酸催化水合' },
            { from: 'alkene', to: 'vic_diol', id: 'r_alkene_diol_syn', reagents: '1) OsO₄, 2) NaHSO₃', type: 'Oxidation', desc: '順式二羥基化 (Syn-dihydroxylation)' },
            { from: 'alkene', to: 'epoxide', id: 'r_alkene_epoxide', reagents: 'm-CPBA', type: 'Oxidation', desc: '環氧化 (Epoxidation)' },
            { from: 'alkene', to: 'aldehyde', id: 'r_alkene_ozonolysis', reagents: '1) O₃, 2) Zn, H₂O', type: 'Oxidation', desc: '臭氧分解 (Ozonolysis) - 還原性後處理' },
            { from: 'alkene', to: 'ketone', id: 'r_alkene_ozonolysis_k', reagents: '1) O₃, 2) Zn, H₂O', type: 'Oxidation', desc: '臭氧分解 (若碳上有兩個取代基)' },

            // Epoxide Reactions
            { from: 'epoxide', to: 'vic_diol', id: 'r_epoxide_diol', reagents: 'H₃O⁺, H₂O', type: 'Ring Opening', desc: '酸催化開環 (反式二醇)' },
            { from: 'epoxide', to: 'alcohol', id: 'r_epoxide_alc', reagents: '1) LiAlH₄, 2) H₃O⁺', type: 'Reduction', desc: '還原成醇' },

            // Alcohol Reactions
            { from: 'alcohol', to: 'haloalkane', id: 'r8', reagents: 'PBr₃ or SOCl₂', type: 'Substitution', desc: '轉化為鹵代烷 (Inversion if chiral)' },
            { from: 'alcohol', to: 'alkene', id: 'r9', reagents: 'conc. H₂SO₄, heat', type: 'Elimination', desc: '扎伊采夫消除 (Zaitsev)' },
            { from: 'alcohol', to: 'ether', id: 'r_alc_ether', reagents: '1) NaH, 2) R-X', type: 'Substitution', desc: 'Williamson Ether Synthesis' },
            { from: 'alcohol', to: 'aldehyde', id: 'r10', reagents: 'PCC or DMP', type: 'Oxidation', desc: '溫和氧化 (1° -> Aldehyde)' },
            { from: 'alcohol', to: 'acid', id: 'r11', reagents: 'H₂CrO₄ (Jones)', type: 'Oxidation', desc: '強氧化 (1° -> Acid)' },
            { from: 'alcohol', to: 'ketone', id: 'r12', reagents: 'PCC or H₂CrO₄', type: 'Oxidation', desc: '氧化 (2° -> Ketone)' },

            // Vicinal Diol
            { from: 'vic_diol', to: 'aldehyde', id: 'r_diol_cleave', reagents: 'HIO₄', type: 'Oxidation', desc: '氧化裂解 (Oxidative Cleavage)' },

            // Carbonyls
            { from: 'aldehyde', to: 'alcohol', id: 'r15', reagents: 'NaBH₄ or LiAlH₄', type: 'Reduction', desc: '還原成 1° 醇' },
            { from: 'ketone', to: 'alcohol', id: 'r16', reagents: 'NaBH₄ or LiAlH₄', type: 'Reduction', desc: '還原成 2° 醇' },
            { from: 'aldehyde', to: 'acid', id: 'r14', reagents: 'Ag₂O, NH₄OH (Tollens)', type: 'Oxidation', desc: '銀鏡反應 (Silver Mirror)' },

            // Standard Conversions
            { from: 'alkane', to: 'haloalkane', id: 'r1', reagents: 'X₂, hv', type: 'Substitution', desc: '自由基鹵化' },
            { from: 'haloalkane', to: 'alcohol', id: 'r5', reagents: 'NaOH, heat', type: 'Substitution', desc: 'SN2 (1°) 或 SN1 (3°)' },
            { from: 'haloalkane', to: 'alkene', id: 'r6', reagents: 'NaOEt, heat', type: 'Elimination', desc: 'E2 消除' },
            { from: 'haloalkane', to: 'nitrile', id: 'r_halo_nitrile', reagents: 'NaCN', type: 'Substitution', desc: '增碳反應' },
            
            { from: 'acid', to: 'ester', id: 'r13', reagents: 'ROH, H⁺', type: 'Condensation', desc: 'Fischer 酯化' },
            { from: 'acid', to: 'amide', id: 'r18', reagents: '1) SOCl₂, 2) NH₃', type: 'Substitution', desc: '經由酰氯生成酰胺' },
            { from: 'nitrile', to: 'acid', id: 'r_nitrile_acid', reagents: 'H₃O⁺, heat', type: 'Hydrolysis', desc: '酸性水解' },
            { from: 'nitrile', to: 'amine', id: 'r_nitrile_amine', reagents: 'LiAlH₄', type: 'Reduction', desc: '還原成胺' }
        ];

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedEdge, setSelectedEdge] = useState(null);
            
            // Pan & Zoom State
            const [scale, setScale] = useState(0.6); // Zoom out more to fit big map
            const [position, setPosition] = useState({ x: -200, y: -100 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            // Handlers
            const handleNodeClick = (nodeId) => { setSelectedNode(nodeId); setSelectedEdge(null); };
            const handleEdgeClick = (edge) => { setSelectedEdge(edge); setSelectedNode(null); };
            const resetSelection = () => { setSelectedNode(null); setSelectedEdge(null); };
            const resetView = () => { setScale(0.6); setPosition({ x: -200, y: -100 }); resetSelection(); };
            
            const handleWheel = (e) => {
                e.preventDefault();
                const zoomSensitivity = 0.001;
                const newScale = Math.min(Math.max(0.2, scale - e.deltaY * zoomSensitivity), 3);
                setScale(newScale);
            };

            const handleMouseDown = (e) => {
                if (e.button === 0) {
                    setIsDragging(true);
                    setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
                }
            };
            const handleMouseMove = (e) => {
                if (isDragging) setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
            };
            const handleMouseUp = () => setIsDragging(false);

            const isConnected = (edge) => {
                if (!selectedNode) return false;
                return edge.from === selectedNode || edge.to === selectedNode;
            };

            const getEdgePath = (edge) => {
                const start = Nodes.find(n => n.id === edge.from);
                const end = Nodes.find(n => n.id === edge.to);
                const width = 160; const height = 70;
                return { x1: start.x + width/2, y1: start.y + height/2, x2: end.x + width/2, y2: end.y + height/2 };
            };

            return (
                <div className="flex flex-col h-screen bg-slate-900 overflow-hidden relative font-sans">
                    
                    {/* Header Overlay */}
                    <div className="absolute top-0 left-0 w-full p-4 z-50 bg-gradient-to-b from-slate-900/90 to-transparent pointer-events-none flex justify-between items-start">
                        <div className="pointer-events-auto">
                            <h1 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 flex items-center gap-2">
                                <i data-lucide="network" className="text-cyan-400"/> 反應網絡探索器 v3.0
                            </h1>
                            <p className="text-slate-400 text-xs md:text-sm mt-1">Ultimate Reaction Map: Includes Oxidation, Reduction & Novel Pathways</p>
                        </div>
                        <div className="flex gap-2 pointer-events-auto">
                             <div className="bg-slate-800 px-3 py-1 rounded text-xs text-slate-400 border border-slate-700 hidden md:block">
                                滾輪縮放 • 拖曳移動
                            </div>
                            <button onClick={resetView} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-600 text-xs font-bold transition-all">
                                重置視圖
                            </button>
                        </div>
                    </div>

                    {/* Main Map Area */}
                    <div 
                        className={`flex-grow bg-slate-900 overflow-hidden relative ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                        onWheel={handleWheel}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                    >
                        <div 
                            className="absolute w-[2400px] h-[1600px] origin-top-left transition-transform duration-75 ease-linear"
                            style={{ transform: `translate(${position.x}px, ${position.y}px) scale(${scale})` }}
                        >
                            <svg width="2400" height="1600" className="overflow-visible">
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="28" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
                                    </marker>
                                    <marker id="arrowhead-active" markerWidth="10" markerHeight="7" refX="28" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
                                    </marker>
                                </defs>

                                {Edges.map(edge => {
                                    const { x1, y1, x2, y2 } = getEdgePath(edge);
                                    const isActive = selectedEdge?.id === edge.id || isConnected(edge);
                                    
                                    return (
                                        <g key={edge.id} onClick={(e) => { e.stopPropagation(); handleEdgeClick(edge); }}>
                                            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="transparent" strokeWidth="25" />
                                            <line 
                                                x1={x1} y1={y1} x2={x2} y2={y2} 
                                                className={`edge ${isActive ? 'edge-active' : ''}`}
                                                stroke={isActive ? '#ef4444' : '#475569'} 
                                                strokeWidth={isActive ? 4 : 2}
                                                markerEnd={isActive ? "url(#arrowhead-active)" : "url(#arrowhead)"}
                                            />
                                        </g>
                                    );
                                })}

                                {Nodes.map(node => {
                                    const isActive = selectedNode === node.id;
                                    return (
                                        <foreignObject key={node.id} x={node.x} y={node.y} width="160" height="70">
                                            <div 
                                                className={`
                                                    w-full h-full rounded-xl flex items-center justify-center text-center p-2
                                                    shadow-lg border-2 select-none node transition-all duration-300
                                                    ${isActive ? 'node-active bg-indigo-900/90 text-white ring-4 ring-indigo-500/30' : 'bg-slate-800 text-slate-300 border-slate-600'}
                                                `}
                                                style={{ borderColor: isActive ? '#818cf8' : node.color }}
                                                onClick={(e) => { e.stopPropagation(); handleNodeClick(node.id); }}
                                            >
                                                <div>
                                                    <div className="text-sm font-bold">{node.label.split('\n')[0]}</div>
                                                    <div className="text-xs opacity-70 font-bold">{node.label.split('\n')[1]}</div>
                                                </div>
                                            </div>
                                        </foreignObject>
                                    );
                                })}
                            </svg>
                        </div>
                    </div>

                    {/* Info Panel */}
                    <div className={`absolute bottom-0 left-0 w-full bg-slate-800/95 backdrop-blur-md border-t-4 border-slate-700 transition-transform duration-300 p-6 z-50 shadow-2xl ${selectedNode || selectedEdge ? 'translate-y-0' : 'translate-y-full'}`}>
                        <div className="container mx-auto max-w-5xl relative">
                            <button onClick={resetSelection} className="absolute top-0 right-0 text-slate-400 hover:text-white bg-slate-700 rounded-full p-1"><i data-lucide="x" size={20}/></button>
                            
                            {selectedEdge && (
                                <div className="animate-in fade-in slide-in-from-bottom-4">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="bg-red-500/20 text-red-400 px-3 py-1 rounded text-xs font-bold uppercase tracking-widest border border-red-500/50">Reaction</div>
                                        <h2 className="text-2xl font-bold text-white flex items-center gap-2 flex-wrap">
                                            {Nodes.find(n => n.id === selectedEdge.from).label.split('\n')[0]} 
                                            <i data-lucide="arrow-right" className="text-slate-500"/> 
                                            {Nodes.find(n => n.id === selectedEdge.to).label.split('\n')[0]}
                                        </h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-600 shadow-inner">
                                            <span className="text-xs text-slate-400 font-bold uppercase block mb-2 flex items-center gap-2"><i data-lucide="flask-conical" size={14}/> 試劑與條件 (Reagents)</span>
                                            <div className="text-xl text-yellow-400 font-mono font-bold">{selectedEdge.reagents}</div>
                                        </div>
                                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-600 shadow-inner">
                                            <span className="text-xs text-slate-400 font-bold uppercase block mb-2 flex items-center gap-2"><i data-lucide="tag" size={14}/> 反應類型 (Type)</span>
                                            <div className="text-lg text-blue-400 font-bold">{selectedEdge.type}</div>
                                            <div className="text-sm text-slate-400 mt-1">{selectedEdge.desc}</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {selectedNode && (
                                <div className="animate-in fade-in slide-in-from-bottom-4">
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded text-xs font-bold uppercase tracking-widest border border-indigo-500/50">Compound Class</div>
                                        <h2 className="text-3xl font-bold text-white">{Nodes.find(n => n.id === selectedNode).label.replace('\n', ' ')}</h2>
                                    </div>
                                    <p className="text-slate-400 mt-2 flex items-center gap-2">
                                        <i data-lucide="mouse-pointer-2" size={16}/> 點擊連接此物質的箭頭，以查看具體的合成或反應方法。
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>

                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
