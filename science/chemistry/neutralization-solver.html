<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中和反應求解器 (Neutralization Solver)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .input-group:focus-within label { color: #3b82f6; }
        .input-group:focus-within input { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        /* Titration Animation */
        @keyframes drip {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(100px) scale(0.5); opacity: 0; }
        }
        .drip-anim { animation: drip 0.5s infinite ease-in; }
        
        .liquid-level { transition: height 1s ease-out; }
        .color-change { transition: background-color 1s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Chemical Data
        const Acids = [
            { name: '鹽酸 (HCl)', formula: 'HCl', basicity: 1 },
            { name: '硝酸 (HNO₃)', formula: 'HNO3', basicity: 1 },
            { name: '硫酸 (H₂SO₄)', formula: 'H2SO4', basicity: 2 },
            { name: '乙酸 (CH₃COOH)', formula: 'CH3COOH', basicity: 1 } // Treated as monoprotic for calc
        ];

        const Alkalis = [
            { name: '氫氧化鈉 (NaOH)', formula: 'NaOH', acidity: 1 },
            { name: '氫氧化鉀 (KOH)', formula: 'KOH', acidity: 1 },
            { name: '氨水 (NH₃)', formula: 'NH3', acidity: 1 }, // NH3 + H+ -> NH4+
            { name: '氫氧化鈣 (Ca(OH)₂)', formula: 'Ca(OH)2', acidity: 2 }
        ];

        const App = () => {
            const [acid, setAcid] = useState(Acids[0]);
            const [alkali, setAlkali] = useState(Alkalis[0]);
            
            // Inputs
            const [ma, setMa] = useState(''); // Molarity Acid
            const [va, setVa] = useState(''); // Volume Acid
            const [mb, setMb] = useState(''); // Molarity Alkali
            const [vb, setVb] = useState(''); // Volume Alkali (Target usually)
            
            const [target, setTarget] = useState('vb'); // What to calculate?
            const [result, setResult] = useState(null);
            const [equation, setEquation] = useState('');
            const [moleRatio, setMoleRatio] = useState({ a: 1, b: 1 });
            const [isTitrating, setIsTitrating] = useState(false);

            // Update Equation and Ratio when chemicals change
            useEffect(() => {
                // Balance logic: Acid basicity vs Alkali acidity
                // e.g. H2SO4 (2 H+) + NaOH (1 OH-) => Ratio 1:2
                // LCM of (acid.basicity, alkali.acidity)
                
                const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                const lcm = (a, b) => (a * b) / gcd(a, b);
                
                const hCount = acid.basicity;
                const ohCount = alkali.acidity;
                const common = lcm(hCount, ohCount);
                
                const coeffAcid = common / hCount;
                const coeffAlkali = common / ohCount;
                
                setMoleRatio({ a: coeffAcid, b: coeffAlkali });

                // Construct Equation String (Simplified)
                let eqStr = '';
                if (coeffAcid > 1) eqStr += `${coeffAcid} `;
                eqStr += `${acid.formula} + `;
                if (coeffAlkali > 1) eqStr += `${coeffAlkali} `;
                eqStr += `${alkali.formula} → Salt + H₂O`;
                
                setEquation(eqStr);
                setResult(null); // Reset result on change
            }, [acid, alkali]);

            const calculate = () => {
                setIsTitrating(true);
                setResult(null);

                // Delay for animation
                setTimeout(() => {
                    try {
                        // Formula: (Ma * Va) / na = (Mb * Vb) / nb
                        // na = moleRatio.a, nb = moleRatio.b
                        
                        const na = moleRatio.a;
                        const nb = moleRatio.b;
                        let res = 0;

                        if (target === 'vb') {
                            // Vb = (Ma * Va * nb) / (na * Mb)
                            res = (parseFloat(ma) * parseFloat(va) * nb) / (na * parseFloat(mb));
                        } else if (target === 'mb') {
                            // Mb = (Ma * Va * nb) / (na * Vb)
                            res = (parseFloat(ma) * parseFloat(va) * nb) / (na * parseFloat(vb));
                        } else if (target === 'va') {
                            // Va = (Mb * Vb * na) / (nb * Ma)
                            res = (parseFloat(mb) * parseFloat(vb) * na) / (nb * parseFloat(ma));
                        } else if (target === 'ma') {
                            // Ma = (Mb * Vb * na) / (nb * Va)
                            res = (parseFloat(mb) * parseFloat(vb) * na) / (nb * parseFloat(va));
                        }

                        if (isFinite(res) && res > 0) {
                            setResult(res);
                        } else {
                            setResult('Error');
                        }
                    } catch (e) {
                        setResult('Error');
                    }
                    setIsTitrating(false);
                }, 1500);
            };

            // UI Helper: Is input disabled?
            const isDisabled = (field) => target === field;

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-purple-600 flex items-center gap-2">
                                <i data-lucide="flask-round"></i> 中和反應求解器
                            </h1>
                            <p className="text-slate-400 text-sm">Neutralization Solver (Titration Calculation)</p>
                        </div>
                        <button onClick={() => { setMa(''); setVa(''); setMb(''); setVb(''); setResult(null); }} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Setup & Inputs */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            {/* Chemical Selection */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-3 flex items-center gap-2">
                                    <i data-lucide="test-tubes" size={16}/> 1. 選擇反應物
                                </h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs font-bold text-red-500 block mb-1">酸 (Acid)</label>
                                        <select 
                                            value={acid.formula} 
                                            onChange={(e) => setAcid(Acids.find(a => a.formula === e.target.value))}
                                            className="w-full p-2 bg-red-50 border border-red-200 rounded-lg font-bold text-red-700 text-sm outline-none focus:ring-2 focus:ring-red-300"
                                        >
                                            {Acids.map(a => <option key={a.formula} value={a.formula}>{a.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-blue-500 block mb-1">鹼 (Alkali)</label>
                                        <select 
                                            value={alkali.formula} 
                                            onChange={(e) => setAlkali(Alkalis.find(a => a.formula === e.target.value))}
                                            className="w-full p-2 bg-blue-50 border border-blue-200 rounded-lg font-bold text-blue-700 text-sm outline-none focus:ring-2 focus:ring-blue-300"
                                        >
                                            {Alkalis.map(a => <option key={a.formula} value={a.formula}>{a.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                
                                {/* Balanced Equation Display */}
                                <div className="mt-4 p-3 bg-slate-800 rounded-xl text-center">
                                    <div className="text-[10px] text-slate-400 uppercase mb-1 font-bold">Balanced Equation</div>
                                    <div className="text-white font-mono text-lg font-bold">
                                        <span className="text-red-400">{moleRatio.a}</span> {acid.formula} + <span className="text-blue-400">{moleRatio.b}</span> {alkali.formula} ...
                                    </div>
                                </div>
                            </div>

                            {/* Calculation Inputs */}
                            <div className="bg-white p-6 rounded-2xl shadow-lg border-2 border-purple-100 relative">
                                <h3 className="text-sm font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                                    <i data-lucide="calculator" size={16}/> 2. 輸入數據 & 選擇目標
                                </h3>

                                {/* Target Selector */}
                                <div className="flex justify-between mb-4 bg-slate-50 p-1 rounded-lg">
                                    {['ma', 'va', 'mb', 'vb'].map(t => (
                                        <button
                                            key={t}
                                            onClick={() => setTarget(t)}
                                            className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all uppercase
                                                ${target === t ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}
                                            `}
                                        >
                                            Find {t.toUpperCase()}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 gap-6">
                                    {/* Acid Side */}
                                    <div className="space-y-3 border-r border-slate-100 pr-3">
                                        <div className={`input-group ${isDisabled('ma') ? 'opacity-50' : ''}`}>
                                            <label className="block text-xs font-bold text-red-400 mb-1">Mₐ (Acid Conc.)</label>
                                            <div className="relative">
                                                <input type="number" value={ma} onChange={(e) => setMa(e.target.value)} disabled={isDisabled('ma')} className="w-full p-2 rounded border border-slate-300 font-mono font-bold outline-none" placeholder={target==='ma'?'?':'e.g. 0.1'} />
                                                <span className="absolute right-2 top-2 text-[10px] text-slate-400">M</span>
                                            </div>
                                        </div>
                                        <div className={`input-group ${isDisabled('va') ? 'opacity-50' : ''}`}>
                                            <label className="block text-xs font-bold text-red-400 mb-1">Vₐ (Acid Vol.)</label>
                                            <div className="relative">
                                                <input type="number" value={va} onChange={(e) => setVa(e.target.value)} disabled={isDisabled('va')} className="w-full p-2 rounded border border-slate-300 font-mono font-bold outline-none" placeholder={target==='va'?'?':'e.g. 25'} />
                                                <span className="absolute right-2 top-2 text-[10px] text-slate-400">cm³</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Alkali Side */}
                                    <div className="space-y-3 pl-3">
                                        <div className={`input-group ${isDisabled('mb') ? 'opacity-50' : ''}`}>
                                            <label className="block text-xs font-bold text-blue-400 mb-1">Mᵦ (Alkali Conc.)</label>
                                            <div className="relative">
                                                <input type="number" value={mb} onChange={(e) => setMb(e.target.value)} disabled={isDisabled('mb')} className="w-full p-2 rounded border border-slate-300 font-mono font-bold outline-none" placeholder={target==='mb'?'?':'e.g. 0.2'} />
                                                <span className="absolute right-2 top-2 text-[10px] text-slate-400">M</span>
                                            </div>
                                        </div>
                                        <div className={`input-group ${isDisabled('vb') ? 'opacity-50' : ''}`}>
                                            <label className="block text-xs font-bold text-blue-400 mb-1">Vᵦ (Alkali Vol.)</label>
                                            <div className="relative">
                                                <input type="number" value={vb} onChange={(e) => setVb(e.target.value)} disabled={isDisabled('vb')} className="w-full p-2 rounded border border-slate-300 font-mono font-bold outline-none" placeholder={target==='vb'?'?':'25.0'} />
                                                <span className="absolute right-2 top-2 text-[10px] text-slate-400">cm³</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={calculate}
                                    disabled={isTitrating}
                                    className="mt-6 w-full py-3 bg-purple-600 text-white font-bold rounded-xl shadow-lg hover:bg-purple-500 transition-all active:scale-95 text-lg flex items-center justify-center gap-2 disabled:opacity-70"
                                >
                                    {isTitrating ? <i data-lucide="loader-2" className="animate-spin"/> : <i data-lucide="flask-conical" />}
                                    開始滴定 (Titrate)
                                </button>
                            </div>
                        </div>

                        {/* Right: Visual & Result */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            {/* Titration Visual */}
                            <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-6 flex justify-center items-end min-h-[350px] relative overflow-hidden">
                                <div className="absolute inset-0 bg-slate-50/50"></div>
                                
                                {/* Burette (Acid/Alkali depends on setup, usually Alkali in burette for Acid analyte) */}
                                <div className="absolute top-0 flex flex-col items-center z-10">
                                    <div className="w-4 h-48 border-x-2 border-b-2 border-slate-400 bg-white/50 relative rounded-b-md overflow-hidden">
                                        {/* Liquid in burette */}
                                        <div className={`w-full bg-blue-400 absolute bottom-0 transition-all duration-[1500ms]`} 
                                             style={{ height: isTitrating || result ? '20%' : '90%' }}></div>
                                    </div>
                                    <div className="w-1 h-4 bg-slate-400"></div> {/* Tip */}
                                    {/* Drops */}
                                    {isTitrating && (
                                        <div className="relative">
                                            <div className="w-2 h-2 bg-blue-400 rounded-full absolute top-0 -left-1 drip-anim"></div>
                                        </div>
                                    )}
                                </div>

                                {/* Conical Flask */}
                                <div className="relative z-10 flex flex-col items-center mt-32">
                                    {/* Flask Body */}
                                    <div className="w-24 h-32 border-4 border-slate-300 rounded-b-3xl rounded-t-md bg-white/30 backdrop-blur-sm relative overflow-hidden flex items-end justify-center">
                                        {/* Solution */}
                                        <div className={`w-full h-12 liquid-level transition-colors duration-1000 ${result ? 'bg-pink-300' : 'bg-transparent'}`}
                                             style={{ height: isTitrating || result ? '60%' : '40%' }}>
                                        </div>
                                    </div>
                                    <div className="text-xs text-slate-400 mt-2 font-bold uppercase">Analyte (Unknown)</div>
                                </div>
                            </div>

                            {/* Result Card */}
                            {result !== null && result !== 'Error' && (
                                <div className="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 text-white animate-in slide-in-from-bottom-4 fade-in">
                                    <div className="flex justify-between items-end mb-4">
                                        <span className="text-slate-400 text-sm font-bold uppercase">Calculated {target.toUpperCase()}</span>
                                        <span className="text-4xl font-mono font-bold text-purple-400">
                                            {parseFloat(result.toFixed(3))}
                                            <span className="text-lg ml-2 text-slate-500">
                                                {target.startsWith('m') ? 'M' : 'cm³'}
                                            </span>
                                        </span>
                                    </div>
                                    
                                    <div className="bg-slate-900/50 p-4 rounded-lg border border-slate-600">
                                        <div className="text-xs font-bold text-slate-500 uppercase mb-2">Formula Used:</div>
                                        <div className="font-mono text-sm text-center">
                                            <span className="text-red-400">MₐVₐ</span> / <span className="text-slate-400">{moleRatio.a}</span> = 
                                            <span className="text-blue-400"> MᵦVᵦ</span> / <span className="text-slate-400">{moleRatio.b}</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {result === 'Error' && (
                                <div className="p-4 bg-red-100 text-red-700 rounded-xl font-bold text-center border border-red-200 animate-pulse">
                                    計算錯誤：請檢查輸入數值是否完整且正確。
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
