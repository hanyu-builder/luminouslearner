<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Chemical Test Challenge</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #e2e8f0; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Liquid Animation */
        .liquid-fill {
            transition: height 1s ease-in-out, background-color 1s ease-in-out;
        }
        
        /* Drop Animation */
        .drop-fall {
            animation: drop 0.6s cubic-bezier(0.5, 0, 1, 1);
        }
        @keyframes drop {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(150px) scale(0.5); opacity: 0; }
        }

        /* Flask Shake on Wrong Answer */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(2px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 
            40%, 60% { transform: translate3d(4px, 0, 0); } 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const Icon = ({ name, className = "", size = 20 }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconData = window.lucide.icons[pascalName];
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svgElement = window.lucide.createElement(iconData);
                        svgElement.setAttribute('class', className);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        setSvgHtml(svgElement.outerHTML);
                    }
                }
            }, [name, className, size]);
            if (!svgHtml) return <span className={className} style={{ width: size, height: size, display: 'inline-block' }}></span>;
            return <span dangerouslySetInnerHTML={{ __html: svgHtml }} className="flex items-center justify-center" />;
        };

        // --- GAME DATA ---
        const REAGENTS = [
            { id: 'kmno4', name: 'Acidified KMnO₄', color: 'bg-purple-600', type: 'Oxidation' },
            { id: 'br2', name: 'Bromine Water', color: 'bg-orange-500', type: 'Addition/Sub' },
            { id: 'tollens', name: 'Tollens\' Reagent', color: 'bg-slate-200', type: 'Oxidation' },
            { id: '24dnp', name: '2,4-DNP', color: 'bg-orange-600', type: 'Condensation' },
            { id: 'iodoform', name: 'I₂ / NaOH', color: 'bg-yellow-700', type: 'Iodoform Test' },
            { id: 'nahco3', name: 'NaHCO₃ (aq)', color: 'bg-white', type: 'Acid-Base' }
        ];

        const CHALLENGES = [
            {
                id: 1,
                pair: ['Propan-1-ol', 'Propanone'],
                targetA: 'Propan-1-ol', targetB: 'Propanone',
                correctReagents: ['kmno4'], // Alcohol vs Ketone: Oxidation works
                reactions: {
                    'kmno4': { 
                        A: { color: 'bg-white/20', obs: 'Purple turns colourless' }, // Alcohol oxidizes
                        B: { color: 'bg-purple-600', obs: 'Remains purple' } // Ketone no reaction
                    },
                    '24dnp': {
                        A: { color: 'bg-orange-600', obs: 'Orange ppt? No' }, // Actually alcohol no ppt
                        B: { color: 'bg-orange-600', obs: 'Orange precipitate' } // Ketone forms ppt. Wait, this distinguishes too!
                        // Wait, 2,4-DNP distinguishes carbonyl from non-carbonyl. So it IS a valid test.
                    }
                },
                // We need to be careful. Usually DSE asks for specific observation.
                // Let's define outcomes for all reagents to handle logic dynamically.
            },
            {
                id: 2,
                pair: ['Ethanol', 'Ethanoic Acid'],
                targetA: 'Ethanol', targetB: 'Ethanoic Acid',
                correctReagents: ['nahco3', 'kmno4'], // Acid-base or Oxidation
                // Logic handled in getResult
            },
            {
                id: 3,
                pair: ['Cyclohexene', 'Cyclohexane'],
                targetA: 'Cyclohexene', targetB: 'Cyclohexane',
                correctReagents: ['br2', 'kmno4'], // Addition
            },
            {
                id: 4,
                pair: ['Propanal', 'Propanone'],
                targetA: 'Propanal', targetB: 'Propanone',
                correctReagents: ['tollens', 'kmno4'], // Aldehyde vs Ketone. 2,4-DNP gives positive for BOTH, so it fails to distinguish.
            },
            {
                id: 5,
                pair: ['Propan-2-ol', 'Propan-1-ol'],
                targetA: 'Propan-2-ol', targetB: 'Propan-1-ol',
                correctReagents: ['iodoform'], // Secondary methyl alcohol vs Primary
            }
        ];

        // Comprehensive Reaction Logic
        const getReactionResult = (compound, reagentId) => {
            // Default: No Reaction (color of reagent mixes in)
            let res = { 
                color: reagentId === 'kmno4' ? 'bg-purple-600/80' : 
                       reagentId === 'br2' ? 'bg-orange-400/60' : 
                       reagentId === '24dnp' ? 'bg-orange-600/80' : 
                       reagentId === 'iodoform' ? 'bg-yellow-700/60' :
                       reagentId === 'tollens' ? 'bg-slate-200/40' : 'bg-white/10',
                obs: 'No observable change',
                reacted: false
            };

            // 1. Acidified KMnO4 (Oxidation)
            if (reagentId === 'kmno4') {
                if (['Propan-1-ol', 'Ethanol', 'Propanal', 'Cyclohexene', 'Propan-2-ol'].includes(compound)) {
                    return { color: 'bg-white/10', obs: 'Purple colour decolourises', reacted: true };
                }
            }

            // 2. Bromine Water (Addition)
            if (reagentId === 'br2') {
                if (['Cyclohexene'].includes(compound)) {
                    return { color: 'bg-white/10', obs: 'Orange colour decolourises rapidly', reacted: true };
                }
                if (['Phenol'].includes(compound)) { // Add if needed
                     return { color: 'bg-white/50', obs: 'Decolourises & White ppt', reacted: true };
                }
            }

            // 3. Tollens' Reagent (Silver Mirror)
            if (reagentId === 'tollens') {
                if (['Propanal', 'Ethanal'].includes(compound)) {
                    return { color: 'bg-gradient-to-b from-slate-300 to-slate-500', obs: 'Silver mirror formed', reacted: true, type: 'coating' };
                }
            }

            // 4. 2,4-DNP (Carbonyls)
            if (reagentId === '24dnp') {
                if (['Propanal', 'Propanone'].includes(compound)) {
                    return { color: 'bg-orange-500', obs: 'Yellow/Orange precipitate', reacted: true, type: 'ppt' };
                }
            }

            // 5. Iodoform (Methyl ketone or Methyl secondary alcohol)
            if (reagentId === 'iodoform') {
                if (['Propanone', 'Ethanol', 'Propan-2-ol'].includes(compound)) {
                    return { color: 'bg-yellow-300', obs: 'Yellow precipitate (CHI₃)', reacted: true, type: 'ppt' };
                }
            }

            // 6. NaHCO3 (Acids)
            if (reagentId === 'nahco3') {
                if (['Ethanoic Acid'].includes(compound)) {
                    return { color: 'bg-white/10', obs: 'Colourless gas bubbles (CO₂)', reacted: true, type: 'gas' };
                }
            }

            return res;
        };

        // --- COMPONENTS ---
        
        const Flask = ({ label, result, dropping }) => {
            return (
                <div className="flex flex-col items-center">
                    {/* Flask Body */}
                    <div className="relative w-32 h-40 border-4 border-slate-400/30 rounded-b-[3rem] rounded-t-lg bg-white/5 backdrop-blur-sm overflow-hidden shadow-xl">
                        {/* Drop Animation */}
                        {dropping && (
                            <div className={`absolute top-0 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full drop-fall ${dropping.color}`}></div>
                        )}
                        
                        {/* Liquid */}
                        <div className={`absolute bottom-0 left-0 w-full liquid-fill transition-all duration-1000
                             ${result ? result.color : 'bg-white/5'}
                             ${result && result.type === 'gas' ? 'animate-pulse' : ''}
                        `} style={{ height: '60%' }}>
                             {/* Bubbles for gas */}
                             {result && result.type === 'gas' && (
                                 <div className="w-full h-full absolute inset-0 flex justify-center items-end">
                                     {[...Array(5)].map((_, i) => <div key={i} className="w-2 h-2 bg-white/80 rounded-full animate-bounce mx-1"></div>)}
                                 </div>
                             )}
                             {/* Silver Mirror */}
                             {result && result.type === 'coating' && (
                                 <div className="absolute inset-0 bg-gradient-to-tr from-slate-300 via-white to-slate-400 opacity-90"></div>
                             )}
                        </div>
                    </div>
                    <div className="mt-4 text-center">
                        <div className="text-xl font-bold text-white">{label}</div>
                        <div className={`text-xs mt-1 font-mono transition-all ${result ? 'opacity-100' : 'opacity-0'} ${result && result.reacted ? 'text-emerald-400' : 'text-slate-400'}`}>
                            {result ? result.obs : '...'}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [qIdx, setQIdx] = useState(0);
            const [results, setResults] = useState({ A: null, B: null });
            const [isAnimating, setIsAnimating] = useState(false);
            const [feedback, setFeedback] = useState(null); // 'success' | 'fail'
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);

            const currentQ = CHALLENGES[qIdx];

            // Reset on new question
            useEffect(() => {
                setResults({ A: null, B: null });
                setFeedback(null);
                setIsAnimating(false);
            }, [qIdx]);

            const handleTest = (reagent) => {
                if (isAnimating || feedback) return;
                
                setIsAnimating(reagent); // Store reagent object for color
                
                // Calculate results
                const resA = getReactionResult(currentQ.targetA, reagent.id);
                const resB = getReactionResult(currentQ.targetB, reagent.id);

                setTimeout(() => {
                    setResults({ A: resA, B: resB });
                    setIsAnimating(false);

                    // Evaluate Success: Did they behave DIFFERENTLY?
                    // We check if observations are different. 
                    // E.g. One reacted, one didn't. Or both reacted but different (rare in DSE simple tests).
                    // Usually "Distinguish" means one +ve, one -ve.
                    
                    // Exception: 2,4-DNP on Aldehyde vs Ketone -> Both +ve -> Fail to distinguish
                    const distinguished = (resA.obs !== resB.obs);

                    if (distinguished) {
                        setFeedback('success');
                        setScore(s => s + 10 + streak * 5);
                        setStreak(s => s + 1);
                    } else {
                        setFeedback('fail');
                        setStreak(0);
                    }
                }, 600); // Animation delay
            };

            const nextQ = () => {
                setQIdx(prev => (prev + 1) % CHALLENGES.length);
            };

            return (
                <div className="min-h-screen bg-[#0F172A] text-white flex flex-col items-center p-4 md:p-8">
                    
                    {/* Header */}
                    <div className="w-full max-w-4xl flex justify-between items-center mb-8 bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-purple-600 rounded-lg"><Icon name="swords" className="text-white" /></div>
                            <div>
                                <h1 className="text-lg font-bold">Test Challenge</h1>
                                <div className="text-xs text-slate-400">Distinguish X from Y</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            {streak > 1 && <div className="text-orange-400 font-bold flex gap-1 animate-pulse"><Icon name="flame"/> {streak}</div>}
                            <div className="bg-slate-900 px-4 py-1 rounded text-emerald-400 font-mono font-bold">{score} pts</div>
                        </div>
                    </div>

                    {/* Main Stage */}
                    <div className="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-8">
                        
                        {/* Left: The Challenge */}
                        <div className="md:col-span-2 bg-slate-900 rounded-3xl border border-slate-800 p-8 relative overflow-hidden">
                            <div className="absolute top-4 left-1/2 -translate-x-1/2 text-slate-500 text-xs font-bold uppercase tracking-widest">
                                Question {qIdx + 1}
                            </div>
                            
                            {/* Flasks Container */}
                            <div className="flex justify-center gap-16 mt-8 mb-8">
                                <Flask 
                                    label={`A: ${currentQ.targetA}`} 
                                    result={results.A} 
                                    dropping={isAnimating} 
                                />
                                <Flask 
                                    label={`B: ${currentQ.targetB}`} 
                                    result={results.B} 
                                    dropping={isAnimating} 
                                />
                            </div>

                            {/* Feedback Overlay */}
                            {feedback && (
                                <div className={`absolute bottom-6 left-6 right-6 p-4 rounded-xl border flex items-center justify-between animate-in fade-in
                                    ${feedback === 'success' ? 'bg-emerald-900/80 border-emerald-500/50' : 'bg-red-900/80 border-red-500/50'}
                                `}>
                                    <div>
                                        <div className={`font-bold text-lg ${feedback === 'success' ? 'text-emerald-400' : 'text-red-400'}`}>
                                            {feedback === 'success' ? 'Correctly Distinguished!' : 'Failed to Distinguish'}
                                        </div>
                                        <div className="text-xs text-slate-300 mt-1">
                                            {feedback === 'success' 
                                                ? `One gave a positive result, the other didn't.` 
                                                : `Both samples showed the same observation (or no reaction).`}
                                        </div>
                                    </div>
                                    <button onClick={nextQ} className="px-4 py-2 bg-white text-slate-900 rounded-lg font-bold hover:bg-slate-200 transition-colors">
                                        Next <Icon name="arrow-right" size={16} className="inline ml-1"/>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Right: Reagents */}
                        <div className="space-y-4">
                            <div className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1">Select Reagent</div>
                            <div className="grid grid-cols-1 gap-3">
                                {REAGENTS.map(r => (
                                    <button 
                                        key={r.id}
                                        onClick={() => handleTest(r)}
                                        disabled={!!feedback || isAnimating}
                                        className="w-full text-left p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-slate-500 hover:bg-slate-700 transition-all group relative overflow-hidden disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        <div className={`absolute left-0 top-0 bottom-0 w-1 ${r.color}`}></div>
                                        <div className="pl-3">
                                            <div className="font-bold text-sm text-white">{r.name}</div>
                                            <div className="text-[10px] text-slate-400">{r.type}</div>
                                        </div>
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <Icon name="flask-conical" size={16} className="text-slate-400"/>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>

                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
