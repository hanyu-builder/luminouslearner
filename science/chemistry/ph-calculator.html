<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pH 計算機 (pH Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* pH Gradient Background */
        .ph-gradient {
            background: linear-gradient(to right, 
                #ef4444 0%,    /* pH 0 Red */
                #f97316 14%,   /* pH 2 Orange */
                #eab308 28%,   /* pH 4 Yellow */
                #84cc16 42%,   /* pH 6 Lime */
                #22c55e 50%,   /* pH 7 Green */
                #06b6d4 57%,   /* pH 8 Cyan */
                #3b82f6 71%,   /* pH 10 Blue */
                #6366f1 85%,   /* pH 12 Indigo */
                #a855f7 100%   /* pH 14 Purple */
            );
        }

        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Common Substances Data
        const Substances = [
            { ph: 0, name: '電池酸液 (Battery Acid)', icon: '🔋' },
            { ph: 1, name: '胃酸 (Stomach Acid)', icon: '🤢' },
            { ph: 2, name: '檸檬汁 (Lemon Juice)', icon: '🍋' },
            { ph: 3, name: '醋 / 汽水 (Vinegar / Soda)', icon: '🥤' },
            { ph: 4, name: '番茄汁 (Tomato Juice)', icon: '🍅' },
            { ph: 5, name: '黑咖啡 (Black Coffee)', icon: '☕' },
            { ph: 6, name: '牛奶 / 尿液 (Milk / Urine)', icon: '🥛' },
            { ph: 7, name: '純水 (Pure Water)', icon: '💧' },
            { ph: 8, name: '海水 / 雞蛋 (Sea Water / Egg)', icon: '🌊' },
            { ph: 9, name: '小蘇打 (Baking Soda)', icon: '🍪' },
            { ph: 10, name: '胃藥 (Antacid)', icon: '💊' },
            { ph: 11, name: '氨水 (Ammonia Solution)', icon: '🧪' },
            { ph: 12, name: '肥皂水 (Soapy Water)', icon: '🧼' },
            { ph: 13, name: '漂白水 (Bleach)', icon: '🧴' },
            { ph: 14, name: '通渠水 (Drain Cleaner)', icon: '☠️' }
        ];

        const App = () => {
            const [hConc, setHConc] = useState('');
            const [phValue, setPhValue] = useState('');
            const [activeInput, setActiveInput] = useState(null); // 'H' or 'pH'
            const [error, setError] = useState('');

            // Format Helper: Scientific Notation
            const formatSci = (num) => {
                if (num === 0) return '0';
                if (Math.abs(num) < 0.0001 || Math.abs(num) > 10000) {
                    return num.toExponential(2).replace('e+', ' × 10^').replace('e-', ' × 10^-');
                }
                return parseFloat(num.toFixed(4)); // Limit decimals
            };

            // Calculate from [H+]
            const calculateFromH = (val) => {
                setHConc(val);
                setActiveInput('H');
                setError('');
                
                if (!val) {
                    setPhValue('');
                    return;
                }

                const h = parseFloat(val);
                if (isNaN(h) || h <= 0) {
                    // Don't show error immediately for typing like "1."
                    if (val !== '' && val !== '1.' && !val.endsWith('e') && !val.endsWith('e-')) {
                        // setError('濃度必須為正數'); 
                    }
                    setPhValue('');
                    return;
                }

                const ph = -Math.log10(h);
                // Limit pH range for display reasonableness, though math works
                if (ph < -1 || ph > 15) {
                    setError('pH 值超出一般範圍 (-1 ~ 15)');
                }
                setPhValue(ph.toFixed(2));
            };

            // Calculate from pH
            const calculateFromPh = (val) => {
                setPhValue(val);
                setActiveInput('pH');
                setError('');

                if (!val) {
                    setHConc('');
                    return;
                }

                const ph = parseFloat(val);
                if (isNaN(ph)) {
                    setHConc('');
                    return;
                }

                const h = Math.pow(10, -ph);
                setHConc(h.toExponential(2).replace('e+', 'e')); // Keep 'e' for input value
            };

            // Get substance match
            const getSubstance = () => {
                const p = parseFloat(phValue);
                if (isNaN(p)) return null;
                const roundPh = Math.round(p);
                return Substances.find(s => s.ph === roundPh);
            };

            const substance = getSubstance();
            const currentPh = parseFloat(phValue) || 7;
            const clampedPh = Math.min(14, Math.max(0, currentPh)); // For UI slider

            // Color Logic
            const getPhColor = (ph) => {
                if (ph < 3) return 'text-red-500';
                if (ph < 6) return 'text-orange-500';
                if (ph < 8) return 'text-green-500';
                if (ph < 11) return 'text-blue-500';
                return 'text-purple-500';
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-5xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="test-tube-2"></i> pH 計算機
                            </h1>
                            <p className="text-slate-400 text-sm">Convert between [H⁺] and pH</p>
                        </div>
                        <button onClick={() => { setHConc(''); setPhValue(''); setError(''); }} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold text-sm flex items-center gap-2 transition-colors">
                            <i data-lucide="rotate-ccw" size={16}></i> 重置
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Calculator Inputs */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-indigo-100">
                                <h3 className="text-lg font-bold mb-6 text-slate-700 flex items-center gap-2">
                                    <i data-lucide="calculator"></i> 輸入數值
                                </h3>

                                {/* H+ Input */}
                                <div className={`mb-6 p-4 rounded-xl border-2 transition-all input-focus-ring
                                    ${activeInput === 'H' ? 'bg-blue-50 border-blue-400' : 'bg-slate-50 border-slate-200'}
                                `}>
                                    <label className="block text-sm font-bold text-blue-700 mb-2 flex justify-between">
                                        <span>氫離子濃度 [H⁺] (mol dm⁻³)</span>
                                        <span className="text-xs font-normal bg-blue-200 text-blue-800 px-2 rounded">Molarity</span>
                                    </label>
                                    <div className="relative">
                                        <input 
                                            type="number" 
                                            value={hConc}
                                            onChange={(e) => calculateFromH(e.target.value)}
                                            placeholder="e.g. 1e-7"
                                            className="w-full text-2xl font-mono font-bold bg-transparent outline-none text-slate-700 placeholder-slate-300"
                                        />
                                        <div className="text-xs text-slate-400 mt-1">
                                            提示：科學記號可用 'e' (例: 1e-3 代表 $10^{-3}$)
                                        </div>
                                    </div>
                                    {activeInput === 'pH' && (
                                        <div className="mt-2 text-xs font-mono text-blue-600 font-bold">
                                            公式: [H⁺] = 10^(-pH)
                                        </div>
                                    )}
                                </div>

                                {/* Divider Icon */}
                                <div className="flex justify-center -my-9 relative z-10">
                                    <div className="bg-white p-2 rounded-full shadow-md border border-slate-200 text-slate-400">
                                        <i data-lucide="arrow-up-down" size={20} />
                                    </div>
                                </div>

                                {/* pH Input */}
                                <div className={`mt-6 p-4 rounded-xl border-2 transition-all input-focus-ring
                                    ${activeInput === 'pH' ? 'bg-purple-50 border-purple-400' : 'bg-slate-50 border-slate-200'}
                                `}>
                                    <label className="block text-sm font-bold text-purple-700 mb-2">
                                        pH 值 (Value)
                                    </label>
                                    <div className="relative">
                                        <input 
                                            type="number" 
                                            value={phValue}
                                            onChange={(e) => calculateFromPh(e.target.value)}
                                            placeholder="e.g. 7.0"
                                            className="w-full text-3xl font-mono font-bold bg-transparent outline-none text-slate-700 placeholder-slate-300"
                                        />
                                    </div>
                                    {activeInput === 'H' && (
                                        <div className="mt-2 text-xs font-mono text-purple-600 font-bold">
                                            公式: pH = -log[H⁺]
                                        </div>
                                    )}
                                </div>

                                {error && (
                                    <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm font-bold flex items-center gap-2 animate-pulse">
                                        <i data-lucide="alert-circle" size={16} /> {error}
                                    </div>
                                )}
                            </div>

                        </div>

                        {/* Right: Visual Scale & Info */}
                        <div className="w-full lg:w-1/2 flex flex-col gap-6">
                            
                            {/* pH Scale Visual */}
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
                                <h3 className="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                                    <i data-lucide="bar-chart-horizontal"></i> 酸鹼度標尺 (pH Scale)
                                </h3>
                                
                                <div className="relative h-16 w-full mb-8 mt-6">
                                    {/* Gradient Bar */}
                                    <div className="absolute inset-0 rounded-full ph-gradient shadow-inner border border-slate-300/50"></div>
                                    
                                    {/* Labels */}
                                    <div className="absolute -bottom-6 left-0 text-xs font-bold text-red-500">0 (Acidic)</div>
                                    <div className="absolute -bottom-6 left-1/2 -translate-x-1/2 text-xs font-bold text-green-600">7 (Neutral)</div>
                                    <div className="absolute -bottom-6 right-0 text-xs font-bold text-purple-500">14 (Alkaline)</div>

                                    {/* Indicator Needle */}
                                    <div 
                                        className="absolute top-0 h-full w-1 bg-slate-800 shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all duration-500 ease-out"
                                        style={{ left: `${(clampedPh / 14) * 100}%` }}
                                    >
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-4 h-4 bg-slate-800 rotate-45 rounded-sm"></div>
                                        <div className="absolute -bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-bold px-2 py-1 rounded shadow-lg">
                                            {phValue ? parseFloat(phValue).toFixed(1) : '?'}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Context Info */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow flex flex-col justify-center items-center text-center">
                                {phValue ? (
                                    <div className="animate-in zoom-in duration-300">
                                        <div className="text-slate-400 text-xs uppercase font-bold mb-2 tracking-wider">
                                            大約對應物質 (Approx. Substance)
                                        </div>
                                        
                                        {substance ? (
                                            <>
                                                <div className="text-6xl mb-3 animate-bounce">{substance.icon}</div>
                                                <div className={`text-2xl font-bold mb-1 ${getPhColor(currentPh)}`}>
                                                    {substance.name}
                                                </div>
                                                <div className="text-sm text-slate-400">
                                                    {currentPh < 7 ? '酸性 (Acidic)' : currentPh > 7 ? '鹼性 (Alkaline)' : '中性 (Neutral)'}
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <div className="text-4xl mb-2 text-slate-600">?</div>
                                                <div className="text-xl font-bold text-slate-300">
                                                    極端酸鹼環境
                                                </div>
                                            </>
                                        )}

                                        <div className="mt-6 pt-6 border-t border-slate-700 w-full">
                                            <div className="text-xs text-slate-500 mb-2">科學記號表示法</div>
                                            <div className="font-mono text-lg text-white bg-slate-900/50 px-4 py-2 rounded-lg inline-block">
                                                [H⁺] = {hConc ? formatSci(parseFloat(hConc)) : '?'} M
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-slate-500">
                                        <i data-lucide="arrow-left" className="mx-auto mb-2 opacity-50" size={32} />
                                        <p>請在左側輸入數值以查看結果</p>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
