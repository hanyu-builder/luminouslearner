<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分子形狀探究器 (VSEPR Shape Explorer)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Three.js for 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        canvas { outline: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- VSEPR Data Logic ---
        const VSEPR_DATA = {
            '2-0': { shape: 'Linear (直線型)', angle: '180°', example: 'CO₂, BeCl₂', geom: 'linear' },
            '3-0': { shape: 'Trigonal Planar (平面三角形)', angle: '120°', example: 'BF₃, BCl₃', geom: 'trigonal_planar' },
            '2-1': { shape: 'V-shaped / Bent (V型)', angle: '< 120° (~117°)', example: 'SO₂, O₃', geom: 'bent_120' },
            '4-0': { shape: 'Tetrahedral (四面體)', angle: '109.5°', example: 'CH₄, CCl₄', geom: 'tetrahedral' },
            '3-1': { shape: 'Trigonal Pyramidal (三角錐體)', angle: '< 109.5° (~107°)', example: 'NH₃, PCl₃', geom: 'trigonal_pyramidal' },
            '2-2': { shape: 'V-shaped / Bent (V型)', angle: '< 109.5° (~104.5°)', example: 'H₂O, H₂S', geom: 'bent_109' },
            '5-0': { shape: 'Trigonal Bipyramidal (三角雙錐)', angle: '90°, 120°', example: 'PCl₅', geom: 'trigonal_bipyramidal' },
            '6-0': { shape: 'Octahedral (八面體)', angle: '90°', example: 'SF₆', geom: 'octahedral' }
        };

        // --- 3D Scene Component ---
        const MoleculeScene = ({ bp, lp }) => {
            const mountRef = useRef(null);
            
            useEffect(() => {
                // 1. Scene Setup
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1e293b); // Slate-800
                
                const camera = new THREE.PerspectiveCamera(50, mountRef.current.clientWidth / mountRef.current.clientHeight, 0.1, 1000);
                camera.position.z = 8;
                camera.position.y = 2;

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                mountRef.current.appendChild(renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);
                const pointLight = new THREE.PointLight(0xffffff, 0.8);
                pointLight.position.set(10, 10, 10);
                scene.add(pointLight);

                // Controls
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 2.0;

                // --- Build Molecule Logic ---
                const group = new THREE.Group();

                // Materials
                const matCenter = new THREE.MeshPhongMaterial({ color: 0x9333ea }); // Purple (Central)
                const matBond = new THREE.MeshPhongMaterial({ color: 0xcbd5e1 });   // Grey
                const matAtom = new THREE.MeshPhongMaterial({ color: 0x22c55e });   // Green (Ligand)
                const matLonePair = new THREE.MeshPhongMaterial({ 
                    color: 0xfca5a5, 
                    transparent: true, 
                    opacity: 0.6, 
                    shininess: 100 
                }); // Red/Pink ghost for LP

                // Geometry
                const geoCenter = new THREE.SphereGeometry(0.8, 32, 32);
                const geoAtom = new THREE.SphereGeometry(0.5, 32, 32);
                // Lone Pair shape (Teardrop-ish approximated by scaling sphere)
                const geoLP = new THREE.SphereGeometry(0.6, 32, 16); 
                geoLP.scale(1, 1.5, 1);

                // Add Central Atom
                const centerMesh = new THREE.Mesh(geoCenter, matCenter);
                group.add(centerMesh);

                // Helper: Add Bond & Atom
                const addBond = (vector) => {
                    // Atom
                    const atomMesh = new THREE.Mesh(geoAtom, matAtom);
                    atomMesh.position.copy(vector).multiplyScalar(2.5);
                    group.add(atomMesh);

                    // Bond Stick
                    const distance = 2.5;
                    const cylinderGeo = new THREE.CylinderGeometry(0.1, 0.1, distance, 8);
                    const bondMesh = new THREE.Mesh(cylinderGeo, matBond);
                    
                    // Align cylinder
                    bondMesh.position.copy(vector).multiplyScalar(distance / 2);
                    bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vector.normalize());
                    group.add(bondMesh);
                };

                // Helper: Add Lone Pair Visual
                const addLP = (vector) => {
                    const lpMesh = new THREE.Mesh(geoLP, matLonePair);
                    lpMesh.position.copy(vector).multiplyScalar(1.5);
                    // Rotate to point away from center
                    lpMesh.lookAt(scene.position); 
                    // Fix orientation: lookAt points Z axis, geometry needs alignment? 
                    // Actually simpler: position it, then rotate it to align Y axis with vector
                    lpMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vector.normalize());
                    group.add(lpMesh);
                };

                // --- Geometry Positions ---
                // Standard vectors for VSEPR geometries
                const vectors = [];
                const totalPairs = bp + lp;

                if (totalPairs === 2) {
                    vectors.push(new THREE.Vector3(0, 1, 0));
                    vectors.push(new THREE.Vector3(0, -1, 0));
                } else if (totalPairs === 3) {
                    vectors.push(new THREE.Vector3(0, 1, 0));
                    vectors.push(new THREE.Vector3(Math.sin(2*Math.PI/3), Math.cos(2*Math.PI/3), 0));
                    vectors.push(new THREE.Vector3(Math.sin(4*Math.PI/3), Math.cos(4*Math.PI/3), 0));
                } else if (totalPairs === 4) {
                    // Tetrahedral
                    const a = 1, b = 1/Math.sqrt(2); // Not exact math but standard tet coords
                    // Using vertices of a tetrahedron inscribed in cube
                    vectors.push(new THREE.Vector3(1, 1, 1).normalize());
                    vectors.push(new THREE.Vector3(-1, -1, 1).normalize());
                    vectors.push(new THREE.Vector3(-1, 1, -1).normalize());
                    vectors.push(new THREE.Vector3(1, -1, -1).normalize());
                } else if (totalPairs === 5) {
                    // Trigonal Bipyramidal
                    vectors.push(new THREE.Vector3(0, 1, 0)); // Axial
                    vectors.push(new THREE.Vector3(0, -1, 0)); // Axial
                    vectors.push(new THREE.Vector3(1, 0, 0)); // Equatorial
                    vectors.push(new THREE.Vector3(-0.5, 0, Math.sqrt(3)/2)); // Eq
                    vectors.push(new THREE.Vector3(-0.5, 0, -Math.sqrt(3)/2)); // Eq
                } else if (totalPairs === 6) {
                    // Octahedral
                    vectors.push(new THREE.Vector3(0, 1, 0));
                    vectors.push(new THREE.Vector3(0, -1, 0));
                    vectors.push(new THREE.Vector3(1, 0, 0));
                    vectors.push(new THREE.Vector3(-1, 0, 0));
                    vectors.push(new THREE.Vector3(0, 0, 1));
                    vectors.push(new THREE.Vector3(0, 0, -1));
                }

                // Assign positions to LP first (VSEPR Rule: LP take more space, usually Eq positions in 5-coord)
                // Logic for 5-coord: LP prefers Equatorial.
                // Logic for others: Usually symmetric, doesn't matter much for simple visual, but let's be precise.
                
                const lpIndices = [];
                if (totalPairs === 5) {
                     // For 5, indices 2,3,4 are Equatorial in our array
                     if (lp >= 1) lpIndices.push(2);
                     if (lp >= 2) lpIndices.push(3);
                     if (lp >= 3) lpIndices.push(4);
                } else if (totalPairs === 6) {
                     // For 6, usually trans to minimize repulsion (4,5 are axial in our array? No, 0,1 are axial)
                     if (lp >= 1) lpIndices.push(0);
                     if (lp >= 2) lpIndices.push(1); // trans to 0
                } else if (totalPairs === 4) {
                     for(let i=0; i<lp; i++) lpIndices.push(i);
                } else {
                     for(let i=0; i<lp; i++) lpIndices.push(i);
                }

                // Render Loop
                vectors.forEach((v, i) => {
                    if (lpIndices.includes(i)) {
                        addLP(v);
                    } else {
                        addBond(v);
                    }
                });

                scene.add(group);

                // Animation Frame
                let animationId;
                const animate = () => {
                    animationId = requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                // Cleanup
                return () => {
                    cancelAnimationFrame(animationId);
                    if (mountRef.current && renderer.domElement && mountRef.current.contains(renderer.domElement)) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    
                    // Proper cleanup of geometry and material
                    group.traverse((object) => {
                        if (object.isMesh) {
                            if (object.geometry) object.geometry.dispose();
                            if (object.material) {
                                if (Array.isArray(object.material)) {
                                    object.material.forEach(material => material.dispose());
                                } else {
                                    object.material.dispose();
                                }
                            }
                        }
                    });
                    
                    renderer.dispose();
                };
            }, [bp, lp]); // Re-render on prop change

            return <div ref={mountRef} className="w-full h-full rounded-2xl overflow-hidden shadow-inner bg-slate-800" />;
        };

        // --- Main App ---
        const App = () => {
            const [bp, setBp] = useState(4);
            const [lp, setLp] = useState(0);
            
            const key = `${bp}-${lp}`;
            const info = VSEPR_DATA[key];
            const totalPairs = bp + lp;

            // Constraints to prevent invalid chemistry or complex geometries not covered
            const isValid = info !== undefined;

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-purple-400 flex items-center gap-2">
                                <i data-lucide="shapes"></i> 分子形狀探究器 (VSEPR)
                            </h1>
                            <p className="text-slate-400 text-sm">Valence Shell Electron Pair Repulsion Theory</p>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: 3D Viewer */}
                        <div className="w-full lg:w-2/3 h-[500px] relative">
                            {isValid ? (
                                <MoleculeScene key={key} bp={bp} lp={lp} />
                            ) : (
                                <div className="w-full h-full bg-slate-800 rounded-2xl flex items-center justify-center text-slate-500 border-4 border-slate-700 border-dashed">
                                    <div className="text-center">
                                        <i data-lucide="ban" size={48} className="mx-auto mb-2"/>
                                        <p>此組合在 DSE 範圍外或不常見 (Uncommon Geometry)</p>
                                        <p className="text-xs mt-1">請嘗試 BP+LP = 2 ~ 6</p>
                                    </div>
                                </div>
                            )}
                            
                            {/* Overlay Controls (Zoom/Rotate hint) */}
                            <div className="absolute bottom-4 left-4 text-xs text-slate-400 bg-black/50 px-3 py-1 rounded pointer-events-none">
                                左鍵旋轉 • 右鍵平移 • 滾輪縮放
                            </div>
                        </div>

                        {/* Right: Controls & Info */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            {/* Controls */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="sliders" /> 電子對設定
                                </h3>
                                
                                <div className="space-y-6">
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-green-400 font-bold">鍵合電子對 (Bond Pairs, BP)</label>
                                            <span className="text-2xl font-mono font-bold text-white">{bp}</span>
                                        </div>
                                        <input 
                                            type="range" min="2" max="6" value={bp} 
                                            onChange={(e) => setBp(parseInt(e.target.value))}
                                            className="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-green-500"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-red-400 font-bold">孤對電子 (Lone Pairs, LP)</label>
                                            <span className="text-2xl font-mono font-bold text-white">{lp}</span>
                                        </div>
                                        <input 
                                            type="range" min="0" max="3" value={lp} 
                                            onChange={(e) => setLp(parseInt(e.target.value))}
                                            className="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-red-500"
                                        />
                                    </div>
                                </div>
                                
                                <div className="mt-6 pt-4 border-t border-slate-700 flex justify-between items-center text-sm">
                                    <span className="text-slate-400">電子對總數 (Total Pairs):</span>
                                    <span className="font-bold text-white bg-slate-700 px-3 py-1 rounded">{totalPairs}</span>
                                </div>
                            </div>

                            {/* Info Card */}
                            {isValid && (
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow animate-in fade-in slide-in-from-bottom-4">
                                    <div className="mb-4">
                                        <div className="text-xs text-slate-400 uppercase font-bold mb-1">Molecular Geometry</div>
                                        <div className="text-2xl font-bold text-purple-300">{info.shape}</div>
                                    </div>

                                    <div className="space-y-4 text-sm text-slate-300 leading-relaxed">
                                        <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-blue-500">
                                            <strong className="text-white block mb-1">鍵角 (Bond Angle)</strong>
                                            <span className="font-mono text-lg text-blue-300">{info.angle}</span>
                                            {lp > 0 && <p className="text-xs mt-1 text-slate-400">孤對電子的斥力較大，將鍵角壓縮變小。</p>}
                                        </div>

                                        <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-green-500">
                                            <strong className="text-white block mb-1">常見例子 (Examples)</strong>
                                            <span className="font-mono text-lg text-green-300">{info.example}</span>
                                        </div>
                                        
                                        <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-yellow-500">
                                            <strong className="text-white block mb-1">VSEPR 原理</strong>
                                            <p className="text-xs">電子對會盡可能遠離對方，以減少<span className="text-yellow-400 font-bold">排斥力 (Repulsion)</span>。</p>
                                            <p className="text-xs mt-1 font-bold">排斥力：LP-LP &gt; LP-BP &gt; BP-BP</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic VI
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
