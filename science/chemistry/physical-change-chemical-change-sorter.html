<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理 vs 化學變化分類挑戰 (Physical vs Chemical Change Sorter)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        /* Card Animation */
        .card-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Drop Zone Hover */
        .drag-over { border-color: #3b82f6 !important; background-color: #eff6ff !important; transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Game Data
        const Items = [
            { id: 1, text: '冰融化成水 (Melting of ice)', type: 'physical', reason: '狀態改變 (Solid -> Liquid)，無新物質生成。' },
            { id: 2, text: '鐵釘生鏽 (Rusting of iron)', type: 'chemical', reason: '生成了氧化鐵 (Iron Oxide)，是新物質。' },
            { id: 3, text: '撕碎紙張 (Tearing paper)', type: 'physical', reason: '只是形狀改變，紙張本質未變。' },
            { id: 4, text: '燃燒木材 (Burning wood)', type: 'chemical', reason: '燃燒產生灰燼和氣體，不可逆轉。' },
            { id: 5, text: '糖溶於水 (Dissolving sugar)', type: 'physical', reason: '糖分子只是分散在水中，蒸發水後可還原。' },
            { id: 6, text: '牛奶變酸 (Souring of milk)', type: 'chemical', reason: '細菌作用產生了酸性新物質。' },
            { id: 7, text: '水沸騰變成蒸汽 (Boiling water)', type: 'physical', reason: '狀態改變 (Liquid -> Gas)，分子結構不變。' },
            { id: 8, text: '煎蛋 (Frying an egg)', type: 'chemical', reason: '蛋白質受熱變性，性質發生永久改變。' },
            { id: 9, text: '混合沙和鹽 (Mixing sand and salt)', type: 'physical', reason: '兩者沒有發生反應，可通過物理方法分離。' },
            { id: 10, text: '光合作用 (Photosynthesis)', type: 'chemical', reason: '將二氧化碳和水轉化為葡萄糖和氧氣。' },
            { id: 11, text: '乾冰昇華 (Sublimation of dry ice)', type: 'physical', reason: '固體二氧化碳直接變氣體，無新物質。' },
            { id: 12, text: '蘋果切開後變啡 (Browning of apple)', type: 'chemical', reason: '酶促氧化反應，生成了黑色素。' }
        ];

        const App = () => {
            const [currentItems, setCurrentItems] = useState([]);
            const [score, setScore] = useState(0);
            const [gameState, setGameState] = useState('start'); // start, playing, finished
            const [feedback, setFeedback] = useState(null); // { type: 'success'/'error', msg: '' }
            const [draggedItem, setDraggedItem] = useState(null);
            
            // Timer
            const [timeLeft, setTimeLeft] = useState(60);

            useEffect(() => {
                let timer;
                if (gameState === 'playing' && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    setGameState('finished');
                }
                return () => clearInterval(timer);
            }, [gameState, timeLeft]);

            const startGame = () => {
                setScore(0);
                setTimeLeft(60);
                setGameState('playing');
                // Shuffle and pick 10 items
                const shuffled = [...Items].sort(() => 0.5 - Math.random()).slice(0, 10);
                setCurrentItems(shuffled);
            };

            const handleDrop = (targetType) => {
                if (!draggedItem) return;

                if (draggedItem.type === targetType) {
                    // Correct
                    setScore(prev => prev + 10);
                    setFeedback({ type: 'success', msg: '正確！ (+10分)' });
                    // Remove item
                    setCurrentItems(prev => prev.filter(i => i.id !== draggedItem.id));
                    
                    // Check win
                    if (currentItems.length === 1) { // This was the last one
                        setGameState('finished');
                    }
                } else {
                    // Incorrect
                    setScore(prev => Math.max(0, prev - 5));
                    setFeedback({ type: 'error', msg: `錯誤！${draggedItem.reason} (-5分)` });
                }
                
                setDraggedItem(null);
                
                // Clear feedback after 2s
                setTimeout(() => setFeedback(null), 2000);
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-4xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                                <i data-lucide="arrow-left-right"></i> 物理 vs 化學變化
                            </h1>
                            <p className="text-slate-400 text-sm">Physical vs Chemical Change Sorter</p>
                        </div>
                        {gameState === 'playing' && (
                            <div className="flex gap-4 text-xl font-mono font-bold">
                                <div className="text-indigo-600">得分: {score}</div>
                                <div className={`${timeLeft < 10 ? 'text-red-500 animate-pulse' : 'text-slate-600'}`}>
                                    {timeLeft}s
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Game Area */}
                    {gameState === 'start' && (
                        <div className="flex-grow flex flex-col items-center justify-center space-y-6 animate-in zoom-in">
                            <div className="p-8 bg-white rounded-2xl shadow-lg text-center max-w-md border border-slate-100">
                                <div className="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-500">
                                    <i data-lucide="gamepad-2" size={40} />
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">準備好挑戰了嗎？</h2>
                                <p className="text-slate-500 mb-6">
                                    你有 60 秒的時間，將 10 個現象正確分類為「物理變化」或「化學變化」。
                                </p>
                                <button 
                                    onClick={startGame}
                                    className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-full shadow-lg transition-transform active:scale-95 w-full"
                                >
                                    開始遊戲 (Start Game)
                                </button>
                            </div>
                        </div>
                    )}

                    {gameState === 'playing' && (
                        <div className="flex flex-col h-full">
                            
                            {/* Feedback Banner */}
                            <div className={`h-12 mb-4 rounded-lg flex items-center justify-center font-bold transition-all
                                ${feedback?.type === 'success' ? 'bg-green-100 text-green-700' : 
                                  feedback?.type === 'error' ? 'bg-red-100 text-red-700' : 'bg-transparent'}
                            `}>
                                {feedback?.msg}
                            </div>

                            {/* Drop Zones */}
                            <div className="grid grid-cols-2 gap-8 mb-8">
                                {/* Physical Zone */}
                                <div 
                                    onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                                    onDragLeave={(e) => e.currentTarget.classList.remove('drag-over')}
                                    onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); handleDrop('physical'); }}
                                    className="h-64 border-4 border-dashed border-blue-300 bg-blue-50 rounded-2xl flex flex-col items-center justify-center transition-all relative group"
                                >
                                    <i data-lucide="snowflake" size={48} className="text-blue-300 mb-2 group-hover:scale-110 transition-transform" />
                                    <h3 className="text-xl font-bold text-blue-600">物理變化</h3>
                                    <span className="text-sm text-blue-400">Physical Change</span>
                                </div>

                                {/* Chemical Zone */}
                                <div 
                                    onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                                    onDragLeave={(e) => e.currentTarget.classList.remove('drag-over')}
                                    onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); handleDrop('chemical'); }}
                                    className="h-64 border-4 border-dashed border-orange-300 bg-orange-50 rounded-2xl flex flex-col items-center justify-center transition-all relative group"
                                >
                                    <i data-lucide="flame" size={48} className="text-orange-300 mb-2 group-hover:scale-110 transition-transform" />
                                    <h3 className="text-xl font-bold text-orange-600">化學變化</h3>
                                    <span className="text-sm text-orange-400">Chemical Change</span>
                                </div>
                            </div>

                            {/* Card Deck */}
                            <div className="flex-grow relative flex justify-center">
                                {currentItems.length > 0 ? (
                                    <div 
                                        draggable
                                        onDragStart={() => setDraggedItem(currentItems[0])}
                                        onDragEnd={() => setDraggedItem(null)}
                                        className="w-64 h-40 bg-white rounded-xl shadow-xl border border-slate-200 flex flex-col items-center justify-center p-4 text-center cursor-grab active:cursor-grabbing hover:-translate-y-1 transition-transform card-pop absolute top-0 z-10"
                                    >
                                        <div className="font-bold text-lg text-slate-800">{currentItems[0].text.split('(')[0]}</div>
                                        <div className="text-sm text-slate-500 mt-1">({currentItems[0].text.split('(')[1]}</div>
                                        <div className="mt-4 text-xs text-slate-400 flex items-center gap-1">
                                            <i data-lucide="hand" size={12} /> 拖曳此卡片
                                        </div>
                                    </div>
                                ) : null}
                                {/* Stack effect */}
                                {currentItems.length > 1 && (
                                    <div className="w-64 h-40 bg-slate-100 rounded-xl border border-slate-200 absolute top-2 scale-95 -z-10"></div>
                                )}
                                {currentItems.length > 2 && (
                                    <div className="w-64 h-40 bg-slate-50 rounded-xl border border-slate-100 absolute top-4 scale-90 -z-20"></div>
                                )}
                            </div>
                        </div>
                    )}

                    {gameState === 'finished' && (
                        <div className="flex-grow flex flex-col items-center justify-center animate-in fade-in">
                            <h2 className="text-3xl font-bold text-slate-800 mb-2">遊戲結束！</h2>
                            <div className="text-6xl font-black text-indigo-600 mb-6">{score} <span className="text-2xl text-slate-400 font-normal">分</span></div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl mb-8 overflow-y-auto max-h-60 p-2">
                                <div className="bg-blue-50 p-4 rounded-lg">
                                    <h3 className="font-bold text-blue-700 mb-2 border-b border-blue-200 pb-1">物理變化特點</h3>
                                    <ul className="text-sm text-blue-600 list-disc list-inside space-y-1">
                                        <li>沒有新物質生成</li>
                                        <li>通常是可逆的 (Reversible)</li>
                                        <li>僅涉及狀態或形狀改變</li>
                                    </ul>
                                </div>
                                <div className="bg-orange-50 p-4 rounded-lg">
                                    <h3 className="font-bold text-orange-700 mb-2 border-b border-orange-200 pb-1">化學變化特點</h3>
                                    <ul className="text-sm text-orange-600 list-disc list-inside space-y-1">
                                        <li>有新物質生成</li>
                                        <li>通常是不可逆的 (Irreversible)</li>
                                        <li>常伴隨能量變化 (光/熱)</li>
                                    </ul>
                                </div>
                            </div>

                            <button 
                                onClick={startGame}
                                className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-full shadow-lg transition-colors"
                            >
                                再玩一次 (Play Again)
                            </button>
                        </div>
                    )}

                    <div className="text-center text-slate-400 text-xs mt-8">
                        Luminous Learner Science Tools
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
