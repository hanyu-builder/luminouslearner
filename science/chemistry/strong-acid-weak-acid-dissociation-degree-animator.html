<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>強弱酸顯微鏡 (Strong vs Weak Acid Scope)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
        
        /* Particle Animation */
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 5px) rotate(10deg); }
            50% { transform: translate(0, 10px) rotate(0deg); }
            75% { transform: translate(-5px, 5px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .particle {
            position: absolute;
            animation: float 4s infinite ease-in-out;
            transition: all 0.5s ease;
        }
        
        /* Bulb Glow */
        .bulb-off { fill: #4b5563; filter: none; }
        .bulb-dim { fill: #fcd34d; filter: drop-shadow(0 0 5px #fcd34d); opacity: 0.6; }
        .bulb-bright { fill: #fbbf24; filter: drop-shadow(0 0 20px #fbbf24); opacity: 1; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Acids = [
            { 
                id: 'HCl', 
                name: '鹽酸 (Hydrochloric Acid)', 
                type: 'strong', 
                formula: 'HCl',
                dissociation: 1.0, // 100%
                desc: '強酸：完全解離 (Fully ionized)。溶液中全是離子。'
            },
            { 
                id: 'HF', 
                name: '氫氟酸 (Hydrofluoric Acid)', 
                type: 'weak', 
                formula: 'HF',
                dissociation: 0.2, // ~20% for visual demo (real is less but need to see ions)
                desc: '弱酸：部分解離 (Partially ionized)。大部分分子保持完整。'
            },
            { 
                id: 'CH3COOH', 
                name: '乙酸 (Ethanoic Acid)', 
                type: 'weak', 
                formula: 'CH₃COOH',
                dissociation: 0.1, // ~10% for visual demo
                desc: '弱酸：解離度極低。溶液中主要是酸分子。'
            }
        ];

        const App = () => {
            const [currentAcid, setCurrentAcid] = useState(Acids[0]);
            const [particles, setParticles] = useState([]);
            const [isConducting, setIsConducting] = useState(false);
            
            // Generate particles based on acid type
            useEffect(() => {
                const newParticles = [];
                const totalParticles = 15; // Total acid units
                const ionizedCount = Math.round(totalParticles * currentAcid.dissociation);
                
                // Add ionized particles (H+ and A-)
                for(let i=0; i<ionizedCount; i++) {
                    // H+
                    newParticles.push({ 
                        id: `h-${i}`, type: 'H+', 
                        x: Math.random()*80+10, y: Math.random()*80+10, 
                        delay: Math.random() 
                    });
                    // A-
                    newParticles.push({ 
                        id: `a-${i}`, type: 'A-', 
                        label: currentAcid.formula === 'HCl' ? 'Cl⁻' : currentAcid.formula === 'HF' ? 'F⁻' : 'CH₃COO⁻', 
                        x: Math.random()*80+10, y: Math.random()*80+10, 
                        delay: Math.random() 
                    });
                }

                // Add molecular particles (HA) - Not ionized
                for(let i=0; i<(totalParticles - ionizedCount); i++) {
                    newParticles.push({ 
                        id: `m-${i}`, type: 'HA', 
                        label: currentAcid.formula, 
                        x: Math.random()*80+10, y: Math.random()*80+10, 
                        delay: Math.random() 
                    });
                }
                
                setParticles(newParticles);
                setIsConducting(false); // Reset switch
            }, [currentAcid]);

            const getBulbClass = () => {
                if (!isConducting) return 'bulb-off';
                return currentAcid.type === 'strong' ? 'bulb-bright' : 'bulb-dim';
            };

            return (
                <div className="flex flex-col h-full container mx-auto px-4 py-6 max-w-6xl">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-green-400 flex items-center gap-2">
                                <i data-lucide="microscope"></i> 強弱酸顯微鏡
                            </h1>
                            <p className="text-slate-400 text-sm">Visualizing Acid Dissociation & Conductivity</p>
                        </div>
                        
                        <div className="flex gap-2">
                            {Acids.map(acid => (
                                <button
                                    key={acid.id}
                                    onClick={() => setCurrentAcid(acid)}
                                    className={`px-3 py-1 rounded border text-sm font-bold transition-colors
                                        ${currentAcid.id === acid.id 
                                            ? 'bg-green-600 text-white border-green-500' 
                                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}
                                    `}
                                >
                                    {acid.name.split(' ')[0]}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8 flex-grow">
                        
                        {/* Left: Microscope View */}
                        <div className="w-full lg:w-2/3 bg-slate-800 rounded-3xl border-4 border-slate-700 relative flex flex-col items-center justify-center min-h-[500px] shadow-2xl overflow-hidden p-8">
                            
                            {/* Circuit Overlay */}
                            <div className="absolute top-0 left-0 w-full h-full pointer-events-none z-20">
                                {/* Electrodes */}
                                <div className="absolute top-[10%] left-[30%] w-4 h-32 bg-gray-400 border-2 border-gray-500"></div>
                                <div className="absolute top-[10%] right-[30%] w-4 h-32 bg-gray-400 border-2 border-gray-500"></div>
                                
                                {/* Wires */}
                                <div className="absolute top-[10%] left-[31%] w-[20%] h-2 bg-yellow-600 -translate-y-2 border-t border-yellow-700"></div>
                                <div className="absolute top-[10%] right-[31%] w-[20%] h-2 bg-yellow-600 -translate-y-2 border-t border-yellow-700"></div>
                                
                                {/* Bulb */}
                                <div className="absolute top-[5%] left-1/2 -translate-x-1/2 -translate-y-1/2">
                                    <svg width="60" height="60" viewBox="0 0 24 24" className={`transition-all duration-500 ${getBulbClass()}`}>
                                        <path d="M9 22h6c.6 0 1-.4 1-1v-2h-8v2c0 .6.4 1 1 1zm2.8-20C7.5 2 4.3 4.9 4.3 9c0 2.5 1.2 4.7 3 6.1V18c0 .6.4 1 1 1h7.3c.6 0 1-.4 1-1v-2.9c1.9-1.4 3-3.6 3-6.1 0-4.1-3.2-7-7.3-7z"/>
                                    </svg>
                                </div>
                            </div>

                            {/* Solution View (Microscopic) */}
                            <div className="relative w-full h-80 bg-blue-900/30 rounded-2xl border border-blue-500/30 backdrop-blur-sm overflow-hidden mt-20">
                                {/* Water background */}
                                <div className="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgdmlld0JveD0iMCAwIDIwIDIwIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MGY1ZmEiIHN0cm9rZS13aWR0aD0iMSI+PHBhdGggZD0iTTEgMTBsNC00IDQgNCA0LTQgNCckeIi8+PC9zdmc+')]"></div>
                                
                                {particles.map((p, i) => (
                                    <div key={p.id} 
                                         className={`particle flex items-center justify-center font-bold shadow-lg border transition-all duration-1000
                                            ${p.type === 'H+' 
                                                ? 'w-8 h-8 rounded-full bg-red-500 border-red-400 text-white z-10 text-sm' 
                                                : p.type === 'A-' 
                                                    ? 'w-10 h-10 rounded-full bg-green-500 border-green-400 text-white z-10 text-xs'
                                                    : 'w-16 h-16 rounded-full bg-slate-200 border-slate-300 text-slate-700 z-0 text-xs'
                                            }
                                         `}
                                         style={{ 
                                             left: `${p.x}%`, 
                                             top: `${p.y}%`, 
                                             animationDelay: `${p.delay}s`
                                         }}>
                                        {p.type === 'H+' ? 'H⁺' : p.label}
                                    </div>
                                ))}
                            </div>

                            {/* Conductivity Control */}
                            <div className="mt-6 relative z-30">
                                <button 
                                    onClick={() => setIsConducting(!isConducting)}
                                    className={`px-8 py-3 rounded-full font-bold text-lg shadow-lg transition-all flex items-center gap-2
                                        ${isConducting ? 'bg-yellow-500 text-yellow-900 hover:bg-yellow-400' : 'bg-slate-600 text-slate-300 hover:bg-slate-500'}
                                    `}
                                >
                                    <i data-lucide={isConducting ? 'power' : 'power-off'} />
                                    {isConducting ? '電源已接通 (ON)' : '接通電源 (OFF)'}
                                </button>
                            </div>

                        </div>

                        {/* Right: Info Panel */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-6">
                            
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                                <h3 className="text-lg font-bold mb-4 text-white flex items-center gap-2">
                                    <i data-lucide="book-open" /> 化學原理
                                </h3>
                                
                                <div className="mb-6 p-4 bg-slate-900 rounded-xl border border-slate-600">
                                    <div className="text-xs text-slate-400 uppercase font-bold mb-1">Selected Acid</div>
                                    <div className="text-3xl font-bold text-white mb-1">{currentAcid.formula}</div>
                                    <div className={`inline-block px-2 py-1 rounded text-xs font-bold uppercase ${currentAcid.type === 'strong' ? 'bg-red-500/20 text-red-300 border border-red-500/50' : 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/50'}`}>
                                        {currentAcid.type === 'strong' ? 'Strong Acid (強酸)' : 'Weak Acid (弱酸)'}
                                    </div>
                                </div>

                                <div className="space-y-4 text-sm text-slate-300 leading-relaxed">
                                    <div className={`p-3 rounded-lg border-l-4 ${currentAcid.type === 'strong' ? 'border-red-500 bg-red-900/20' : 'border-yellow-500 bg-yellow-900/20'}`}>
                                        <strong className="text-white block mb-1">1. 解離度 (Dissociation)</strong>
                                        {currentAcid.desc}
                                        <br/>
                                        <span className="text-xs opacity-70 font-mono mt-1 block">
                                            {currentAcid.type === 'strong' 
                                                ? `${currentAcid.formula} → H⁺ + A⁻`
                                                : `${currentAcid.formula} ⇌ H⁺ + A⁻`}
                                        </span>
                                    </div>
                                    
                                    <div className="p-3 bg-slate-900/50 rounded-lg border-l-4 border-blue-500">
                                        <strong className="text-white block mb-1">2. 離子濃度與導電性</strong>
                                        {currentAcid.type === 'strong' 
                                            ? '強酸含有大量自由流動的離子 (Mobile Ions)，因此導電性極高，燈泡明亮。'
                                            : '弱酸只有少量離子，大部分以分子形式存在。導電性較低，燈泡較暗。'}
                                    </div>
                                </div>
                            </div>
                            
                            {/* Legend */}
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 text-xs text-slate-400">
                                <div className="font-bold mb-2 uppercase tracking-wider">圖例 (Legend)</div>
                                <div className="flex flex-wrap gap-4">
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-red-500"></div> H⁺ (氫離子)</div>
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-green-500"></div> A⁻ (酸根離子)</div>
                                    <div className="flex items-center gap-2"><div className="w-4 h-3 rounded-full bg-slate-200"></div> HA (酸分子)</div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <div className="text-center text-slate-600 text-xs mt-8 border-t border-slate-800 pt-4">
                        Luminous Learner Science Tools | HKDSE Topic IV
                    </div>
                </div>
            );
        };

        lucide.createIcons();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
