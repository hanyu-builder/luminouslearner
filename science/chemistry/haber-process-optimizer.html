<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haber Process Optimizer - Luminous Learner</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MathJax for Chemical Equations -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f8fafc;
        }
        
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #0f172a;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
        
        .gauge-container {
            position: relative;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.7;
            transition: top 0.1s linear, left 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { 
            FlaskConical, 
            Gauge, 
            TrendingUp, 
            Zap, 
            DollarSign, 
            AlertTriangle, 
            Info, 
            Settings,
            PlayCircle,
            RotateCcw
        } = lucide;

        // --- Components ---

        // 1. Stat Card Component
        const StatCard = ({ icon: Icon, label, value, unit, color, subtext }) => (
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center text-center">
                <div className={`p-3 rounded-full mb-2 ${color.bg}`}>
                    <Icon className={`w-6 h-6 ${color.text}`} />
                </div>
                <div className="text-slate-500 text-sm font-medium">{label}</div>
                <div className="text-2xl font-bold text-slate-800 font-mono my-1">
                    {value}<span className="text-sm ml-1 text-slate-400">{unit}</span>
                </div>
                {subtext && <div className="text-xs text-slate-400">{subtext}</div>}
            </div>
        );

        // 2. Reaction Chamber Visualization
        const ReactionChamber = ({ rate, yieldPercent, temperature, pressure, hasCatalyst }) => {
            const canvasRef = useRef(null);
            
            // Visual parameters
            const particleCount = 30;
            const baseSpeed = 0.5;
            
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                
                // Particles state
                let particles = [];
                for(let i=0; i<particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        type: Math.random() > 0.3 ? 'reactant' : 'product', // Initial mix
                    });
                }

                const render = () => {
                    // Clear canvas
                    ctx.fillStyle = '#f1f5f9'; // slate-100
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw Catalyst Grid if active
                    if (hasCatalyst) {
                        ctx.strokeStyle = '#cbd5e1';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        for(let i=0; i<canvas.width; i+=40) {
                            ctx.moveTo(i, 0);
                            ctx.lineTo(i, canvas.height);
                        }
                        ctx.stroke();
                        
                        ctx.fillStyle = '#64748b';
                        ctx.font = '12px sans-serif';
                        ctx.fillText("Fe Catalyst Bed", 10, 20);
                    }

                    // Update and draw particles
                    // Speed factor depends on Temperature (KE) and Rate
                    const speedFactor = (temperature / 200) * (hasCatalyst ? 1.5 : 1); 
                    // Product ratio depends on Yield
                    const targetProductRatio = yieldPercent / 100;

                    particles.forEach((p, i) => {
                        // Move
                        p.x += p.vx * speedFactor;
                        p.y += p.vy * speedFactor;

                        // Bounce
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        // Dynamic reaction simulation:
                        // Randomly change type based on target yield equilibrium
                        if (Math.random() < 0.02 * speedFactor) { // Reaction event chance
                            const currentProductCount = particles.filter(pt => pt.type === 'product').length;
                            const currentRatio = currentProductCount / particleCount;
                            
                            if (currentRatio < targetProductRatio) {
                                p.type = 'product';
                            } else {
                                p.type = 'reactant';
                            }
                        }

                        // Draw
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, pressure > 200 ? 6 : 4, 0, Math.PI * 2); // Higher pressure = closer particles (simulated by size relative to space)
                        if (p.type === 'reactant') {
                            ctx.fillStyle = '#3b82f6'; // N2 + H2 (Blue)
                        } else {
                            ctx.fillStyle = '#ef4444'; // NH3 (Red)
                        }
                        ctx.fill();
                    });

                    animationFrameId = window.requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.cancelAnimationFrame(animationFrameId);
                };
            }, [temperature, pressure, hasCatalyst, yieldPercent]);

            return (
                <div className="relative w-full h-64 bg-slate-100 rounded-xl overflow-hidden border-2 border-slate-300 shadow-inner">
                    <canvas ref={canvasRef} width={400} height={256} className="w-full h-full block"></canvas>
                    
                    {/* Overlays */}
                    <div className="absolute bottom-2 left-2 bg-white/80 px-2 py-1 rounded text-xs text-slate-600 font-mono">
                        <span className="inline-block w-3 h-3 bg-blue-500 rounded-full mr-1"></span>N₂/H₂
                        <span className="inline-block w-3 h-3 bg-red-500 rounded-full ml-2 mr-1"></span>NH₃
                    </div>
                    
                    {/* Warning Overlay for Extreme Conditions */}
                    {pressure > 350 && (
                        <div className="absolute top-2 right-2 animate-pulse text-red-600 flex items-center bg-red-100 px-2 py-1 rounded-full">
                            <AlertTriangle size={14} className="mr-1" /> 危險高壓
                        </div>
                    )}
                </div>
            );
        };

        // Main App Component
        const App = () => {
            // -- State --
            const [temperature, setTemperature] = useState(450); // Celsius
            const [pressure, setPressure] = useState(200); // atm
            const [hasCatalyst, setHasCatalyst] = useState(true); // Iron
            
            // -- Logic & Calculations (Simplified Model for Educational Purpose) --
            
            // 1. Yield (Equilibrium Position): 
            // Exothermic: High T -> Low Yield. 
            // Fewer gas moles on product side (4 -> 2): High P -> High Yield.
            const calculateYield = (t, p) => {
                // Base yield formula simulation
                // Yield decreases as T increases (e.g. 600K -> 100K)
                // Yield increases as P increases
                // Empirical approximation for simulation:
                const tFactor = Math.max(0, 1 - (t - 200) / 800); // Higher T = Lower Factor
                const pFactor = Math.min(1, Math.log10(p) / 2.8); // Logarithmic return on pressure
                
                let y = 100 * tFactor * pFactor;
                // Cap between 5% and 98%
                return Math.min(98, Math.max(5, y));
            };

            // 2. Rate (Kinetics):
            // High T -> High Rate. High P -> High Rate. Catalyst -> High Rate.
            const calculateRate = (t, p, cat) => {
                const tRate = Math.pow((t / 200), 2); // Exponential increase with T
                const pRate = p / 100; // Linear increase with P
                const catFactor = cat ? 100 : 1; // Huge boost from catalyst
                
                // Normalize to a 0-100 scale for display relative to "industrial ideal"
                let r = (tRate * pRate * catFactor) / 50; 
                return Math.min(100, r);
            };

            // 3. Cost (Economic):
            // High P = Very Expensive equipment (Exponential). 
            // High T = Expensive fuel (Linear).
            // Catalyst = One time cost (Low recurring).
            const calculateCost = (t, p, cat) => {
                const pCost = Math.pow(p, 1.6) / 200; // Safety equipment cost rises sharply
                const tCost = t / 10; // Fuel cost
                const catCost = cat ? 10 : 0;
                
                return pCost + tCost + catCost;
            };

            // Derived Values
            const yieldVal = calculateYield(temperature, pressure);
            const rateVal = calculateRate(temperature, pressure, hasCatalyst);
            const costVal = calculateCost(temperature, pressure, hasCatalyst);
            
            // Daily Profit Score = (Rate * Yield * Market_Price) - Operating_Cost
            // This is the "Game Score"
            // Tuning the constants to make ~450C, 200atm, Fe optimal
            const production = (rateVal * yieldVal) / 100; 
            const revenue = production * 15; // Arbitrary market value
            const profit = revenue - costVal;

            // Formatters
            const fmt = (n) => n.toFixed(1);

            // --- Render ---
            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        
                        {/* Header */}
                        <header className="mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center">
                            <div>
                                <h1 className="text-3xl md:text-4xl font-bold text-slate-800 mb-2 flex items-center gap-3">
                                    <FlaskConical className="text-blue-600" size={36} />
                                    哈伯法優化器
                                    <span className="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-normal">HKDSE Topic X & XIII</span>
                                </h1>
                                <p className="text-slate-600">調整反應條件，尋找氨氣 (Ammonia) 生產的最佳平衡點。</p>
                            </div>
                            <div className="mt-4 md:mt-0 bg-white px-6 py-3 rounded-xl shadow-sm border border-slate-200">
                                <div className="text-sm text-slate-400 uppercase tracking-wider font-bold">目標方程式</div>
                                <div className="font-mono text-lg text-slate-800">
                                    N<sub>2</sub>(g) + 3H<sub>2</sub>(g) &#8652; 2NH<sub>3</sub>(g) &nbsp; 
                                    <span className="text-red-500 text-base">&Delta;H &lt; 0</span>
                                </div>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* Left Column: Controls (4 cols) */}
                            <div className="lg:col-span-4 space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-100">
                                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center">
                                        <Settings className="mr-2 text-slate-400" size={20} /> 
                                        控制台 (Controls)
                                    </h2>

                                    {/* Temperature Control */}
                                    <div className="mb-8">
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-slate-600 font-medium">溫度 (Temperature)</label>
                                            <span className="text-2xl font-mono font-bold text-orange-500">{temperature}°C</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="200" max="700" step="10"
                                            value={temperature}
                                            onChange={(e) => setTemperature(Number(e.target.value))}
                                            className="accent-orange-500"
                                        />
                                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                                            <span>低溫 (Kinetic 低)</span>
                                            <span>高溫 (Rate 高)</span>
                                        </div>
                                    </div>

                                    {/* Pressure Control */}
                                    <div className="mb-8">
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-slate-600 font-medium">壓力 (Pressure)</label>
                                            <span className="text-2xl font-mono font-bold text-purple-600">{pressure} atm</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="1" max="400" step="10"
                                            value={pressure}
                                            onChange={(e) => setPressure(Number(e.target.value))}
                                            className="accent-purple-600"
                                        />
                                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                                            <span>低壓 (安全)</span>
                                            <span>高壓 (有利產率)</span>
                                        </div>
                                    </div>

                                    {/* Catalyst Control */}
                                    <div className="mb-6">
                                        <label className="text-slate-600 font-medium block mb-3">催化劑 (Catalyst)</label>
                                        <button 
                                            onClick={() => setHasCatalyst(!hasCatalyst)}
                                            className={`w-full py-3 px-4 rounded-xl flex items-center justify-center transition-all border-2 ${
                                                hasCatalyst 
                                                ? 'bg-slate-800 border-slate-800 text-white shadow-md scale-105' 
                                                : 'bg-white border-slate-200 text-slate-400 hover:border-slate-300'
                                            }`}
                                        >
                                            {hasCatalyst ? (
                                                <>
                                                    <Zap className="mr-2 text-yellow-400" size={20} fill="currentColor" />
                                                    使用鐵粉 (Finely Divided Iron)
                                                </>
                                            ) : (
                                                <>
                                                    <span className="mr-2">⚪</span>
                                                    無催化劑 (No Catalyst)
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    {/* Reset Button */}
                                    <button 
                                        onClick={() => { setTemperature(450); setPressure(200); setHasCatalyst(true); }}
                                        className="w-full py-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-lg text-sm flex items-center justify-center transition-colors"
                                    >
                                        <RotateCcw size={14} className="mr-1" /> 重置為工業標準 (Standard)
                                    </button>
                                </div>

                                {/* Tips Card */}
                                <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                                    <h3 className="text-blue-800 font-bold mb-2 flex items-center">
                                        <Info size={18} className="mr-2" /> 
                                        DSE 提示
                                    </h3>
                                    <ul className="text-sm text-blue-700 space-y-2 list-disc pl-4">
                                        <li><strong>勒沙特列原理：</strong> 降溫會使平衡向放熱方向移動 (增加產率)，但反應會變慢。</li>
                                        <li><strong>折衷方案 (Compromise)：</strong> 工業上不追求 100% 產率，而是追求「單位時間內的最大利潤」。</li>
                                        <li><strong>催化劑：</strong> 不改變產率，只加快達到平衡的時間，讓我們能在較低溫下操作。</li>
                                    </ul>
                                </div>
                            </div>

                            {/* Right Column: Visualization & Stats (8 cols) */}
                            <div className="lg:col-span-8 space-y-6">
                                
                                {/* Reaction Simulator Visual */}
                                <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-100">
                                    <h2 className="text-xl font-bold text-slate-800 mb-4">反應爐模擬 (Reaction Chamber)</h2>
                                    <ReactionChamber 
                                        temperature={temperature} 
                                        pressure={pressure} 
                                        hasCatalyst={hasCatalyst}
                                        yieldPercent={yieldVal}
                                        rate={rateVal}
                                    />
                                    
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                                        <StatCard 
                                            icon={Gauge} 
                                            label="平衡產率 (Yield)" 
                                            value={fmt(yieldVal)} 
                                            unit="%" 
                                            color={{bg: 'bg-green-100', text: 'text-green-600'}}
                                            subtext={yieldVal < 15 ? "產量過低" : "理論轉化率"}
                                        />
                                        <StatCard 
                                            icon={PlayCircle} 
                                            label="反應速率 (Rate)" 
                                            value={rateVal < 1 ? "< 1" : Math.round(rateVal)} 
                                            unit="au" 
                                            color={{bg: 'bg-blue-100', text: 'text-blue-600'}}
                                            subtext={rateVal < 5 ? "反應極慢" : "動力學速率"}
                                        />
                                        <StatCard 
                                            icon={DollarSign} 
                                            label="營運成本 (Cost)" 
                                            value={Math.round(costVal)} 
                                            unit="$" 
                                            color={{bg: 'bg-red-100', text: 'text-red-600'}}
                                            subtext={pressure > 300 ? "設備極昂貴" : "能源+設備"}
                                        />
                                        
                                        {/* Profit / Score Card */}
                                        <div className={`p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center text-center relative overflow-hidden ${
                                            profit > 0 ? 'bg-yellow-50 border-yellow-200' : 'bg-gray-50'
                                        }`}>
                                            <div className={`p-3 rounded-full mb-2 ${profit > 0 ? 'bg-yellow-100' : 'bg-gray-200'}`}>
                                                <TrendingUp className={`w-6 h-6 ${profit > 0 ? 'text-yellow-600' : 'text-gray-500'}`} />
                                            </div>
                                            <div className="text-slate-500 text-sm font-medium">每日利潤 (Profit)</div>
                                            <div className={`text-2xl font-bold font-mono my-1 ${profit > 0 ? 'text-yellow-700' : 'text-slate-400'}`}>
                                                {Math.round(profit)}
                                            </div>
                                            {profit > 100 && (
                                                <div className="absolute top-0 right-0 bg-red-500 text-white text-[10px] px-2 py-1 rounded-bl-lg font-bold">
                                                    OPTIMAL!
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Analysis Chart / Explanation */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-md border border-slate-100">
                                        <h3 className="font-bold text-slate-700 mb-3">狀態分析</h3>
                                        <div className="space-y-4">
                                            {/* Analysis Item: Temperature */}
                                            <div>
                                                <div className="flex justify-between text-sm mb-1">
                                                    <span className="text-slate-500">溫度效應</span>
                                                    <span className={temperature > 500 ? "text-red-500" : "text-green-600"}>
                                                        {temperature > 550 ? "過高 (產率低)" : temperature < 350 ? "過低 (速率慢)" : "適中"}
                                                    </span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-2">
                                                    <div 
                                                        className={`h-2 rounded-full ${temperature > 550 ? 'bg-red-400' : 'bg-green-500'}`} 
                                                        style={{width: `${(temperature/700)*100}%`}}
                                                    ></div>
                                                </div>
                                            </div>

                                            {/* Analysis Item: Pressure */}
                                            <div>
                                                <div className="flex justify-between text-sm mb-1">
                                                    <span className="text-slate-500">壓力效應</span>
                                                    <span className={pressure > 300 ? "text-orange-500" : "text-blue-600"}>
                                                        {pressure > 300 ? "極高 (成本激增)" : pressure < 100 ? "偏低 (產率一般)" : "適中"}
                                                    </span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-2">
                                                    <div 
                                                        className={`h-2 rounded-full ${pressure > 300 ? 'bg-orange-400' : 'bg-blue-500'}`} 
                                                        style={{width: `${(pressure/400)*100}%`}}
                                                    ></div>
                                                </div>
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-400 mt-4 leading-relaxed">
                                            試試將條件設為典型的工業條件：<br/>
                                            450°C, 200 atm, 鐵催化劑。<br/>
                                            看看這是否能帶來最高的「每日利潤」？
                                        </p>
                                    </div>

                                    <div className="bg-slate-800 p-6 rounded-3xl shadow-md text-white">
                                        <h3 className="font-bold text-slate-200 mb-3">化學原理速查</h3>
                                        <div className="text-sm text-slate-300 space-y-3">
                                            <p>
                                                <span className="text-blue-300 font-bold">Rate Equation:</span><br/>
                                                Rate ∝ [N₂][H₂]³ (受 P 影響) <br/>
                                                Rate ∝ e<sup>-Ea/RT</sup> (受 T, Cat 影響)
                                            </p>
                                            <p>
                                                <span className="text-green-300 font-bold">Equilibrium Constant (Kc):</span><br/>
                                                Kc 隨溫度上升而下降 (因為 &Delta;H &lt; 0)。這解釋了為什麼高溫會導致產率 (Yield) 下降。
                                            </p>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
