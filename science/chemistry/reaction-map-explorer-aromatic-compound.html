<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aromatic Reaction Map v3.0 (Full Kingdom)</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; margin: 0; overflow: hidden; color: #e2e8f0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .node-container { transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; }
        .node-container:hover { 
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.2); 
            z-index: 10;
            border-color: #f472b6;
        }
        
        .edge { transition: all 0.3s; cursor: pointer; opacity: 0.3; }
        .edge:hover { opacity: 1; stroke-width: 3px; filter: drop-shadow(0 0 4px #fff); }
        .edge-active { opacity: 1 !important; stroke-width: 3px !important; stroke-dasharray: 8; animation: flow 1.5s linear infinite; filter: drop-shadow(0 0 6px #f472b6); }
        @keyframes flow { to { stroke-dashoffset: -16; } }

        .badge { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root" style="height: 100vh; width: 100vw;"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className}></i>;
        };
        
        const Nodes = [
            // BRIDGE
            { id: 'aliphatic', label: 'Aliphatic Chain', x: -100, y: 350, color: '#4ade80', cat: 'Input' },

            // CENTER
            { id: 'benzene', label: 'Benzene', x: 200, y: 350, color: '#f472b6', cat: 'Aromatic Hub' },

            // --- TOP BRANCH: KETONES & ACIDS ---
            { id: 'acylbenzene', label: 'Acylbenzene\n(Phenyl Ketone)', x: 400, y: 50, color: '#f472b6', cat: 'Ketone' },
            { id: 'phenyl_alcohol', label: 'Phenyl Alcohol\n(1-Phenylethanol)', x: 100, y: 50, color: '#38bdf8', cat: 'Alcohol' }, // NEW
            
            { id: 'alkylbenzene', label: 'Alkylbenzene\n(Toluene)', x: 500, y: 200, color: '#94a3b8', cat: 'Hydrocarbon' },
            { id: 'benzoic_acid', label: 'Benzoic Acid', x: 800, y: 100, color: '#ef4444', cat: 'Acid' },
            
            // --- ACID DERIVATIVES (NEW CLUSTER) ---
            { id: 'benzoyl_chloride', label: 'Benzoyl Chloride', x: 1100, y: 100, color: '#ef4444', cat: 'Acid Chloride' }, // NEW
            { id: 'benzamide', label: 'Benzamide', x: 1400, y: 50, color: '#a78bfa', cat: 'Amide' }, // NEW
            { id: 'benzoate', label: 'Methyl Benzoate', x: 1400, y: 150, color: '#c084fc', cat: 'Ester' }, // NEW

            // MIDDLE
            { id: 'halobenzene', label: 'Halobenzene', x: 500, y: 350, color: '#facc15', cat: 'Halide' },
            { id: 'sulfonic_acid', label: 'Benzenesulfonic\nAcid', x: 500, y: 500, color: '#fbbf24', cat: 'Acid' },

            // --- BOTTOM BRANCH: NITROGEN ---
            { id: 'nitrobenzene', label: 'Nitrobenzene', x: 200, y: 650, color: '#818cf8', cat: 'Nitrogen' },
            { id: 'phenylamine', label: 'Phenylamine\n(Aniline)', x: 500, y: 650, color: '#818cf8', cat: 'Nitrogen' },
            
            // --- DIAZONIUM HUB ---
            { id: 'diazonium', label: 'Diazonium Salt', x: 800, y: 650, color: '#c084fc', cat: 'Intermediate' },

            // --- DIAZONIUM OUTPUTS ---
            { id: 'phenol', label: 'Phenol', x: 1100, y: 500, color: '#ec4899', cat: 'Oxygen' },
            { id: 'phenyl_ester', label: 'Phenyl Ester', x: 1400, y: 500, color: '#c084fc', cat: 'Ester' }, // NEW
            { id: 'nitrile', label: 'Benzonitrile', x: 1100, y: 300, color: '#fb923c', cat: 'Nitrile' }, // Moved up for loop
            { id: 'azo_dye', label: 'Azo Dye', x: 1100, y: 750, color: '#a855f7', cat: 'Dye' },
        ];

        const Edges = [
            // BRIDGE
            { from: 'aliphatic', to: 'benzene', reagents: 'Pt / Heat', type: 'Reform', desc: 'Catalytic Reforming' },

            // EAS - KETONE PATH
            { from: 'benzene', to: 'acylbenzene', reagents: 'R-COCl / AlCl₃', type: 'Sub', desc: 'Friedel-Crafts Acylation' },
            { from: 'acylbenzene', to: 'phenyl_alcohol', reagents: 'NaBH₄ / Methanol', type: 'Red', desc: 'Reduction of Ketone', note: 'Forms 2° Alcohol' },
            { from: 'acylbenzene', to: 'alkylbenzene', reagents: 'Zn(Hg) / HCl', type: 'Red', desc: 'Clemmensen Reduction' },

            // EAS - ALKYL PATH
            { from: 'benzene', to: 'alkylbenzene', reagents: 'R-Cl / AlCl₃', type: 'Sub', desc: 'Friedel-Crafts Alkylation' },
            { from: 'alkylbenzene', to: 'benzoic_acid', reagents: 'KMnO₄ / OH⁻, Reflux', type: 'Ox', desc: 'Side-chain Oxidation' },
            
            // ACID DERIVATIVES (THE NEW TREE)
            { from: 'benzoic_acid', to: 'benzoyl_chloride', reagents: 'SOCl₂', type: 'Sub', desc: 'Formation of Acid Chloride' },
            { from: 'benzoyl_chloride', to: 'benzamide', reagents: 'NH₃ (conc)', type: 'Sub', desc: 'Amide Formation' },
            { from: 'benzoyl_chloride', to: 'benzoate', reagents: 'Methanol', type: 'Cond', desc: 'Esterification (Fast)' },
            { from: 'benzoyl_chloride', to: 'benzoic_acid', reagents: 'H₂O', type: 'Hyd', desc: 'Hydrolysis' },

            // EAS - OTHERS
            { from: 'benzene', to: 'nitrobenzene', reagents: 'Conc. HNO₃ / H₂SO₄', type: 'Sub', desc: 'Nitration' },
            { from: 'benzene', to: 'halobenzene', reagents: 'Br₂ / FeBr₃', type: 'Sub', desc: 'Halogenation' },
            { from: 'benzene', to: 'sulfonic_acid', reagents: 'H₂SO₄ Reflux', type: 'Sub', desc: 'Sulfonation' },

            // NITROGEN PATH
            { from: 'nitrobenzene', to: 'phenylamine', reagents: 'Sn / HCl', type: 'Red', desc: 'Reduction' },
            { from: 'phenylamine', to: 'diazonium', reagents: 'NaNO₂ / HCl, <5°C', type: 'Conv', desc: 'Diazotization' },
            { from: 'phenylamine', to: 'benzamide', reagents: 'CH₃COCl', type: 'Sub', desc: 'N-Substitution (Amide)' }, // NEW: Aniline to Amide

            // DIAZONIUM OUTPUTS
            { from: 'diazonium', to: 'phenol', reagents: 'H₂O Warm', type: 'Hyd', desc: 'Hydrolysis' },
            { from: 'diazonium', to: 'azo_dye', reagents: 'Phenol/NaOH', type: 'Cpl', desc: 'Coupling' },
            
            // THE NITRILE LOOP
            { from: 'diazonium', to: 'nitrile', reagents: 'CuCN', type: 'Sub', desc: 'Sandmeyer Reaction' },
            { from: 'nitrile', to: 'benzoic_acid', reagents: 'H₃O⁺ Reflux', type: 'Hyd', desc: '★ Acid Hydrolysis (Completes the Loop)' },

            // PHENOL DERIVATIVES
            { from: 'phenol', to: 'phenyl_ester', reagents: 'Acyl Chloride', type: 'Cond', desc: 'Esterification (Phenols need Acyl Chloride)' },
            { from: 'phenol', to: 'azo_dye', reagents: 'Diazonium', type: 'Cpl', desc: 'Coupling Agent' },
        ];

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedEdge, setSelectedEdge] = useState(null);
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 0.65 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            useEffect(() => {
                const cx = window.innerWidth / 2 - 600 * 0.65;
                const cy = window.innerHeight / 2 - 350 * 0.65;
                setTransform({ x: cx, y: cy, scale: 0.65 });
            }, []);

            const getOffsetCoords = (s, e, offsetAmount = 14) => {
                const dx = e.x - s.x;
                const dy = e.y - s.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len === 0) return { x1: s.x, y1: s.y, x2: e.x, y2: e.y };
                const perpX = -dy / len;
                const perpY = dx / len;
                return {
                    x1: s.x + 90 + (perpX * offsetAmount), 
                    y1: s.y + 40 + (perpY * offsetAmount),
                    x2: e.x + 90 + (perpX * offsetAmount),
                    y2: e.y + 40 + (perpY * offsetAmount)
                };
            };

            const getNode = (id) => Nodes.find(n => n.id === id);

            return (
                <div 
                    className="w-full h-full relative overflow-hidden select-none bg-[#0F172A]"
                    onMouseDown={(e) => { setIsDragging(true); setDragStart({ x: e.clientX - transform.x, y: e.clientY - transform.y }); }}
                    onMouseMove={(e) => { if(isDragging) setTransform(p => ({ ...p, x: e.clientX - dragStart.x, y: e.clientY - dragStart.y })); }}
                    onMouseUp={() => setIsDragging(false)}
                    onWheel={(e) => setTransform(p => ({ ...p, scale: Math.min(Math.max(0.3, p.scale - e.deltaY * 0.001), 2) }))}
                >
                    {/* Header */}
                    <div className="absolute top-6 left-6 z-10 pointer-events-none">
                        <div className="bg-slate-900/80 backdrop-blur p-5 rounded-2xl border border-slate-700 shadow-2xl pointer-events-auto">
                            <h1 className="text-2xl font-bold text-white flex items-center gap-3">
                                 <Icon name="atom" className="text-pink-500" /> Aromatic Kingdom v3.0
                            </h1>
                            <p className="text-xs text-slate-400 mt-2 font-mono uppercase tracking-widest">Full Edition: Esters, Amides & Loops</p>
                        </div>
                    </div>

                    {/* Canvas */}
                    <div className="absolute origin-top-left will-change-transform" style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})` }}>
                        <svg width="2200" height="1200" className="overflow-visible">
                            <defs>
                                <marker id="arrow" markerWidth="6" markerHeight="4" refX="16" refY="2" orient="auto">
                                    <path d="M0,0 L6,2 L0,4" fill="#475569" />
                                </marker>
                                <marker id="arrow-active" markerWidth="6" markerHeight="4" refX="16" refY="2" orient="auto">
                                    <path d="M0,0 L6,2 L0,4" fill="#f472b6" />
                                </marker>
                            </defs>

                            {Edges.map((edge, i) => {
                                if (!getNode(edge.from) || !getNode(edge.to)) return null;
                                const s = getNode(edge.from);
                                const e = getNode(edge.to);
                                const { x1, y1, x2, y2 } = getOffsetCoords(s, e, 15); 
                                const active = selectedEdge === edge || (selectedNode && (edge.from === selectedNode || edge.to === selectedNode));
                                
                                return (
                                    <g key={i} onClick={(e) => { e.stopPropagation(); setSelectedEdge(edge); setSelectedNode(null); }}>
                                        <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="transparent" strokeWidth="24" />
                                        <line x1={x1} y1={y1} x2={x2} y2={y2} 
                                            className={`edge ${active ? 'edge-active' : ''}`}
                                            stroke={active ? "#f472b6" : (edge.from === 'aliphatic' ? '#4ade80' : "#475569")} 
                                            strokeWidth="2"
                                            strokeDasharray={edge.from === 'aliphatic' ? '5,5' : '0'}
                                            markerEnd={active ? "url(#arrow-active)" : "url(#arrow)"}
                                        />
                                        {transform.scale > 0.5 && (
                                            <foreignObject x={(x1+x2)/2 - 60} y={(y1+y2)/2 - 12} width="120" height="24" style={{pointerEvents:'none'}}>
                                                <div className={`text-[10px] text-center rounded font-mono transition-opacity duration-300
                                                    ${active ? 'bg-pink-900/90 text-pink-200 shadow-lg' : 'opacity-0'}`}>
                                                    {edge.reagents.split(' ')[0]}
                                                </div>
                                            </foreignObject>
                                        )}
                                    </g>
                                );
                            })}

                            {Nodes.map(node => {
                                const isActive = selectedNode === node.id;
                                const isRelated = selectedEdge?.from === node.id || selectedEdge?.to === node.id;

                                return (
                                    <foreignObject key={node.id} x={node.x} y={node.y} width="180" height="80">
                                        <div 
                                            onClick={(e) => { e.stopPropagation(); setSelectedNode(node.id); setSelectedEdge(null); }}
                                            className={`
                                                w-full h-full rounded-xl border flex flex-col items-center justify-center node-container
                                                backdrop-blur-sm
                                                ${isActive 
                                                    ? 'bg-slate-800 border-pink-500 ring-2 ring-pink-500/30 text-white' 
                                                    : 'bg-slate-800/60 border-slate-700 text-slate-300 hover:bg-slate-700 hover:border-slate-500'
                                                }
                                                ${node.id === 'aliphatic' ? 'border-green-500/50 text-green-100 bg-green-900/20' : ''}
                                            `}
                                        >
                                            <div className="text-base font-bold text-center tracking-tight whitespace-pre-line">{node.label}</div>
                                            <div className="badge mt-1 opacity-80" style={{color: node.color, backgroundColor: `${node.color}15`}}>
                                                {node.cat}
                                            </div>
                                        </div>
                                    </foreignObject>
                                );
                            })}
                        </svg>
                    </div>

                    {/* Info Panel */}
                    <div className={`absolute bottom-0 left-0 w-full p-6 transition-transform duration-500 z-20 flex justify-center ${selectedNode || selectedEdge ? 'translate-y-0' : 'translate-y-[120%]'}`}>
                        <div className="bg-slate-800/95 backdrop-blur-xl shadow-2xl rounded-2xl border border-slate-700 w-full max-w-4xl p-8 relative text-slate-200">
                            <button onClick={() => {setSelectedNode(null); setSelectedEdge(null);}} className="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-700 text-slate-400">
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                            
                            {selectedEdge && (
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                                    <div className="md:col-span-4 flex flex-col items-center justify-center p-6 bg-slate-900/50 rounded-xl border border-slate-700/50">
                                        <div className="text-lg font-bold text-pink-400">{getNode(selectedEdge.from).label.split('\n')[0]}</div>
                                        <Icon name="arrow-down" className="my-3 text-slate-500 w-6 h-6" />
                                        <div className="text-lg font-bold text-purple-400">{getNode(selectedEdge.to).label.split('\n')[0]}</div>
                                    </div>
                                    <div className="md:col-span-8 space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Reagents & Conditions</label>
                                            <div className="text-xl font-mono font-bold text-white bg-slate-900 p-4 rounded-lg border border-slate-600 mt-2 shadow-inner">
                                                {selectedEdge.reagents}
                                            </div>
                                        </div>
                                        <div className="flex flex-wrap gap-3">
                                            <div className="bg-pink-900/30 text-pink-300 border border-pink-800 px-3 py-1 rounded text-xs font-bold uppercase">
                                                {selectedEdge.type}
                                            </div>
                                            <div className="text-slate-400 text-sm flex items-center">
                                                <Icon name="info" className="w-4 h-4 mr-2" />
                                                {selectedEdge.desc}
                                            </div>
                                        </div>
                                        {selectedEdge.note && (
                                            <div className="text-amber-400 text-xs mt-2 italic border-l-2 border-amber-500 pl-2">
                                                Note: {selectedEdge.note}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {selectedNode && (
                                <div className="text-center py-2">
                                    <h2 className="text-4xl font-bold text-white mb-3">{getNode(selectedNode).label.replace('\n', ' ')}</h2>
                                    <p className="text-slate-400 text-base max-w-xl mx-auto leading-relaxed">
                                        {selectedNode === 'aliphatic' 
                                            ? 'Entry point from Aliphatic Chemistry.' 
                                            : 'Explore the Benzene Ring derivatives, including Esters, Amides, and Diazonium pathways.'}
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
